kind = "source"
reference = "board.toml"
result = "Board description, kernel arguments, payload contract and ADT inputs"

[[area.evidence]]
kind = "source"
reference = ".github/workflows/porting-record.yml"
result = "Shared Porting record validation on every push and pull request"

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["board.toml", "scripts/check-clover.py", "scripts/dump-clover-facts.sh"]
inputs = ["uefi-clover firmware, stock firmware DTB, ABL handoff at 0x80000000, PSCI SMC interface and the unit's UEFI platform configuration.", "Framebuffer at 0x9D400000 with a 0x02400000 reservation, 1200x1920 panel."]
configuration = ["firmware.config = clover; firmware.dsc = Platforms/Xiaomi/cloverPkg/clover.dsc.", "bootimg.image uses header version 0, 4096-byte pages and base-relative load offsets; the ABL adds the DRAM base.", "No [[bootimg.dtb_node]]: the stock tree already carries the splash node, and the firmware patches it in place."]
procedure = ["Build uefi-clover separately and pass it as --uefi when the payload or boot image is assembled.", "Inspect the firmware memory map against facts/ before changing a reservation.", "Cold-flash the cache partition and read the panel; there is no serial console after the menu."]
findings = ["The firmware publishes a GOP framebuffer, but this XNU kernel learns about it through /chosen and the entry probe, not through a platform display driver.", "The payload does not travel in a ramdisk: this firmware has no ramdisk filesystem driver, so UniXNU reads it from the cache partition.", "The firmware DTB is an input to the boot image; the separately generated ADT is the tree XNU consumes.", "Round160 extends the checker the firmware step runs: a userdata host gate that lost its pinned seed or its three-window rule now fails the firmware build, not the destructive flash.", "Round164 uses the same firmware volume; the board checker now asserts the round164 menu title and the two new payload/kernel contracts.", "Round165 also ships the unchanged firmware volume; only the checker's menu-title assertion moves to clover r165.", "Round166 ships the same firmware volume and only moves the menu-title assertion to clover r166; the checker addition covers the driver's untrusted batch default and the new signature-dump patch.", "Round167 ships the same firmware volume and only moves the menu-title assertion to clover r167; the checker now also asserts writeSettled, the stop-command check, the CACHE_CTRL switch and the three-sample read trust rule."]
completion = ["Firmware builds and enters UniXNU, publishes the framebuffer, and boots the payload from the cache partition."]
limits = ["Firmware sources and Binaries/clover blobs live outside this repository; the record cannot substitute for them."]
next_action = ["Record the firmware revision and handoff memory map with the next image build."]

