[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["board.toml", "scripts/check-clover.py", "scripts/dump-clover-facts.sh"]
inputs = ["uefi-clover firmware, stock firmware DTB, ABL handoff at 0x80000000, PSCI SMC interface and the unit's UEFI platform configuration.", "Framebuffer at 0x9D400000 with a 0x02400000 reservation, 1200x1920 panel."]
configuration = ["firmware.config = clover; firmware.dsc = Platforms/Xiaomi/cloverPkg/clover.dsc.", "bootimg.image uses header version 0, 4096-byte pages and base-relative load offsets; the ABL adds the DRAM base.", "No [[bootimg.dtb_node]]: the stock tree already carries the splash node, and the firmware patches it in place."]
procedure = ["Build uefi-clover separately and pass it as --uefi when the payload or boot image is assembled.", "Inspect the firmware memory map against facts/ before changing a reservation.", "Cold-flash the cache partition and read the panel; there is no serial console after the menu."]
findings = ["The firmware publishes a GOP framebuffer, but this XNU kernel learns about it through /chosen and the entry probe, not through a platform display driver.", "The payload does not travel in a ramdisk: this firmware has no ramdisk filesystem driver, so UniXNU reads it from the cache partition.", "The firmware DTB is an input to the boot image; the separately generated ADT is the tree XNU consumes.", "Round160 extends the checker the firmware step runs: a userdata host gate that lost its pinned seed or its three-window rule now fails the firmware build, not the destructive flash.", "Round164 uses the same firmware volume; the board checker now asserts the round164 menu title and the two new payload/kernel contracts.", "Round165 also ships the unchanged firmware volume; only the checker's menu-title assertion moves to clover r165.", "Round166 ships the same firmware volume and only moves the menu-title assertion to clover r166; the checker addition covers the driver's untrusted batch default and the new signature-dump patch.", "Round167 ships the same firmware volume and only moves the menu-title assertion to clover r167; the checker now also asserts writeSettled, the stop-command check, the CACHE_CTRL switch and the three-sample read trust rule.", "Round168 ships the same firmware volume and only moves the menu-title assertion to clover r168; the checker adds the two give-up lines, the 30 s guard and the 4 s settle bound, and rejects the two-second hand-over and the flat two-second request base.", "Round169 ships the same firmware volume and only moves the menu-title assertion to clover r169; the checker adds the card-busy line, the stage-tagged read line and abortReadTransfer, and rejects the four-second settle and the once-per-boot read give-up.", "Round170 ships the same firmware volume and only moves the menu-title assertion to clover r170; the checker asserts the 48-line check_np cap and the 16-line cache-directory cap, and rejects the two uncapped r153 format strings the throttle replaces.", "Round171 ships the same firmware volume and only moves the menu-title assertion to clover r171; the checker now asserts batchDelivered and kContentErrorMask, both CACHE_CTRL switches and the flush export, the two IOLock guards and their allocation gate, and rejects the retired gBlockGuard CAS, a block guard published without its lock, a flush that never re-enables the cache, and a getWriteCacheState that hardcodes false.", "Round172 reads the firmware's own transport back out of the dump it left: SDHCI_CAPABILITIES 0x742dc8b2 has CAN_DO_ADMA2 (0x00080000) and CAN_64BIT (0x10000000) set and CAN_DO_SDMA (0x00400000) clear, and the verification header's last HOST_CONTROL was 0x38, which is ADMA64 (0x18) plus the 8-bit bus (0x20). The boot loader was already DMA-ing on this controller, so the path round172 adds is the one the firmware used, and check-clover.py now pins both the descriptor layout and that reading.", "Round173 puts writes on the transport the firmware used: the same 12-byte ADMA2 descriptor table, the same 64-bit HOST_CONTROL field, and CMD25 with TRANSFER_MODE's DMA bit set beside MULTI and BLK_CNT_EN. check-clover.py therefore stops refusing SDHCI_TRNS_DMA on a write transfer mode and instead requires that a DMA write only be attempted after a PIO control round trip on the same blocks reported control=1.", "Round174 adds no new controller mode: the verdict writer keeps the PIO path it inherited and issues no command beyond the single-block read/write pair already audited, while check-clover.py now refuses any CloverSdhci verdict line that still calls IOLog directly -- a reading that belongs on the card cannot be left on the panel by accident.", "Round175 adds no controller mode and issues no command of its own: the tee only reads kernel memory and hands what it keeps to the round174 verdict writer. check-clover.py now refuses any path between teeConsumeLine and teeKernelLog that calls IOLog or sdhciSay, because printing what was copied out of the kernel log would feed the tee its own words and take bsd_log_lock inside the block guard.", "Round176 ships the same firmware volume and moves the menu-title assertion to clover r176. check-clover.py now requires the two rings to tile -- kRingCardSlots {64, 512} with kRingOffset {64, 192} and the reader's own arithmetic 64 + 2*64 = 192, 192 + 2*512 = 1216 -- requires exactly one call site that pushes kernel text (teeConsumeLine), caps the tee census at 12 lines, and refuses the single-ring names verdictPush, gVerdictBlock, kVerdictSlots and kVerdictOffset, because a leftover of the retired shape is a ring that silently never flushes.", "Round177 ships the same firmware volume and only moves the menu-title assertion to clover r177. Its checker additions are host gates run as subprocesses: normalize-kernel-macho.py --selftest replays 17 normalisation rules and check-cs-blob-structure.py --selftest replays 14 cs_validate_csblob rejection rules, and the checker requires the normalizer to sit after the AMFI patcher in AGENTS.md, because the patcher moves bytes the identity fields would otherwise have to describe.", "Round178 changes no firmware module and no memory map: the mu-clover tree is untouched and the round reaches the card through the prelink archive build, so the only firmware-visible contract is the payload title. Its checker additions pin the new guard primitives and require the hand-off call to appear in both the read and the write loop.", "Round179 changes no shipped byte. The menu title stays clover r178 because the payload is the round178 archive; the only additions are a host-side audit of the display family and its gate in check-clover.py, which pins the audited constants and refuses to run without a built kernel rather than invent one.", "Round180 changes no firmware module and no memory map: the mu-clover tree is untouched, UEFI still publishes the splash framebuffer at 0x9D400000 and the boot header stays v0. The firmware-visible part of the round is what the shipped image now promises at boot -- three display boot arguments in board.toml -- and what scripts/check-clover.py demands around them: it refuses a defconfig with CONFIG_XNU_NATIVE_LEGACY_DISPLAY on whose [kernel] archives omits the Legacy builder, refuses the reverse, refuses either boot argument missing, and refuses CONFIG_XNU_NATIVE_MOBILE_DISPLAY alongside it because the MDP5 driver has no hardware on this board. The round adds no firmware command and no new UEFI module.", "Round181 extends scripts/check-clover.py with a three-part contract for the new driver: the CloverInput archive, the defconfig line, the clover-input boot argument and the SHENG_PMGR schedule have to name each other; the driver source itself has to keep the shapes that make a transaction real (a SW_RESET write per transfer, the kQupMaxTagsLen tag array, the (address << 1) | 1 read tag, kQupTagV2DataRdStop, return finishTransfer (), the clover-input boot arg and a closing clover_emmc_flush_cache ()); and two negatives are asserted -- no write-only chip path, and no MX counter writes, which FIFO mode forbids. The menu title has to read clover r181, and the PMGR tail order unattended-then-emmc-then-input is checked by position, not by good intentions.", "Round183 ships the same firmware volume, moves the menu-title assertion to clover r183 and widens the contract that pins driver constants to the firmware's own device tree from 26 addresses to 30: qcom,smem@86000000 with its 0x200000 size and both smp2p nodes at 17911008 now have to agree with DspRegs.h before scripts/check-clover.py passes. The round adds no firmware command, no new UEFI module and no memory-map change -- which is the point of it: the ADSP and WiFi image regions it scans are memory this boot's firmware neither maps nor clears, so a scan that reads zero is a statement about the boot loader's PIL pass, not a verdict on the silicon.", "Round182 changed no firmware module either; its board.toml edit is the CloverPower archive entry and the menu title, and the SPMI windows it reads are declared by the same firmware DTB the boot image carries, which is why scripts/check-clover.py can bind driver-header bases to that tree.", "Round184 ships the same firmware volume -- round184-boot.img is byte-identical to round183's 196b284f -- and moves the menu-title assertion to clover r184. What it changes about the firmware contract is how a boot ends: with no deadline the board never came back to fastboot by itself, and the panel turned out to be a fixed-grid printer rather than a scrolling console, which round183's frame proves (its first row is still the kernel's own version banner, its last row is part(3)). Readings therefore have to come off the card, and off the card before the reset the deadline causes."]
completion = ["Firmware builds and enters UniXNU, publishes the framebuffer, and boots the payload from the cache partition."]
limits = ["Firmware sources and Binaries/clover blobs live outside this repository; the record cannot substitute for them."]
next_action = ["Record the firmware revision and handoff memory map with the next image build."]

