[[area]]
id = "storage"
status = "implemented"
components = []
paths = ["drivers/CloverSdhci/**", "drivers/CloverBlock/**", "scripts/make-clover-root.py", "scripts/make-clover-apfs-container.py", "scripts/make-clover-sparse.py", "scripts/make-clover-trust-bundle.py", "scripts/append-data-window.py", "scripts/verify-userdata-window.py", "scripts/seed-data-skip-setup.py", "patches/xnu-clover/**"]
inputs = ["SDHCI host at 0xc0c4000, eMMC card left by firmware in HS200, 8-bit, 200 MHz.", "GPT windows: OS, Cryptex1,SystemOS and the appended scratch Data window inside the userdata partition; cache is the payload partition.", "APFS container on the OS window and a 32 MiB APFS Data seed (volume UUID FC1A580E-2D67-48FC-B8CF-87422A319340) appended as a third SHNGROOT entry; mockfs root image and a three-module trust cache."]
configuration = ["drivers/CloverSdhci publishes the eMMC windows, switches the link to HS_TIMING=1, 8-bit and 50 MHz after identification, and proves it with LBA 1 before raising gBlockReady.", "drivers/CloverBlock exposes the windows to IOStorageFamily, publishes the Data window writable, and answers native_ram_block_volume_seed() / native_verified_block_manifest_sha384() for the owner mounts.", "clover-emmc=21 reads EXT_CSD and walks the GPT; clover-apfs=3 loads apfs.kext and publishes the OS volume; no rd= argument exists.", "patches/xnu-clover/zzy-clover-owner-root-trust.patch accepts the owner-provided root; zzy-clover-systemos-mount.patch turns the SystemOS union, boot manifest and Data mount on inside kern_exec.c and IOKitBSDInit.cpp."]
procedure = ["Verify GPT windows, the APFS container and the appended Data entry on the host before flashing.", "Run scripts/verify-userdata-window.py --crc --apfs on the exact sparse file a userdata flash will use; it refuses anything but OS + SystemOS + Data with the writable flag, a seed that does not hash to the pinned image, or an image past the partition.", "Cold-flash cache, and userdata only after the exact fastboot command is declared and approved; the Data mount writes only inside the appended 32 MiB window.", "Run scripts/check-clover.py and scripts/verify-clover-payload.py after changing the driver or the payload."]
findings = ["Round137 mounted the APFS root; round143 union-mounts the SystemOS volume at exec; round150 accepts the unsealed root through the owner audit instead of an rd= alias.", "The SystemOS volume carries the dyld shared cache. Round153 read a directory open, the main cache and .01 with err=0 and both header words dyld_v1 arm64, but dyld_flags=0x0 and syscall 536 is not entered.", "Round156 removed the 160 us per-word FIFO wait: reads are level-gated, use CMD18 in 32-block batches and CloverBlock hands over 16 KiB at a time. Round157 makes CMD12 R1b-complete and rejects DATA_CRC, DATA_TIMEOUT, DATA_END_BIT and ADMA_ERROR instead of accepting a damaged block.", "Round159 completed the link: after identification the driver sends CMD6 HS_TIMING=1 and BUS_WIDTH=8, programs the 50 MHz sdcc1_apps_clk_src row and reads the GPT signature at the new rate, falling back to 400 kHz if any step is refused. The same round appends a 32 MiB APFS Data seed as a writable SHNGROOT window, so the kernel's owner Data mount has a card-backed /private/var.", "The round159 frame shows the whole storage chain working: the three CloverBlock manifest/data rows, seed data bsd=disk5s1 bytes=33554432, APFS mount-complete volume DawnData with UUID FC1A580E-2D67-48FC-B8CF-87422A319340, then load_init_program for /sbin/launchd. dyld opened the cache directory, the main cache and .01 with err=0, read a dyld_v1 arm64 header from both and registered the 224 KiB .01 signature blob with err=0 in 189 ms; 16 KiB blobs take 7 ms, about 1-2 MB/s versus 25 KB/s before round156.", "Round160 adds the host gate for that image: scripts/verify-userdata-window.py expands the all-RAW sparse container, checks the SHNGROOT model and the Data bytes in place, and optionally recomputes the container CRC-32 and mounts the seed read-only to prove its volume UUID. The round159 archive passes with 9,416,212,480 bytes, three windows, CRC 0x6c29b693 and UUID FC1A580E-2D67-48FC-B8CF-87422A319340.", "The slow PIO path still measures about 25 KB/s, so a 16 KiB batch holds a buffer lock longer than XNU's 524 ms lock timeout. ml-timeout-lock-panic-scale=40 raises that deadline to about 21 s.", "The second frame from the same round159 image shows launchd running and spawning logd and dasd, but every child's exec fails in ubc_cs_blob_add with EBADEXEC (85), load_code_signature returns LOAD_FAILURE (4), and AMFI kills the process with 'dyld signature cannot be verified'; launchd respawns forever (pids 13621 to 13675). A host check of 044-76040-038.dmg puts logd 4882a798, dasd db318f4f, dyld b479f90e and launchd 1d52c697 all inside the 2478-entry static trust cache, and their blobs are structurally valid (logd: signature at 224912, 21120 bytes, fade0cc0, inner length 3108, five indexes), so the gate is before MACF and the suspect is the bytes the kernel reads or the LC_CODE_SIGNATURE offset/size.", "Round163 stops measuring and removes the last gate it can see: the prelinked AMFI exec hook at VA 0xfffffff004ab40e4 tests the signature check result and CS_REQUIRE_LV before jumping to the allow path. The 4-byte cbz (34 00 02 29) is replaced by b (11 00 00 14) at kernel.macho file offset 0x1a830e4, so the hook always takes the allow path. Only the payload is rebuilt from that kernel copy; the EBADEXEC root cause is untouched.", "The r163 frame proved that branch was not the killer: with check failed and CS_REQUIRE_LV clear the cbz is not taken. Round164 NOPs the real decision at VA 0xfffffff004ab416c (file 0x1a8316c, tbz w0,#0, 20 05 00 36 to 1f 20 03 d5), whose w0=0 means no valid signature and falls through to the kill at 0xab4210. The same round adds zzy-clover-dyld-cache-skip.patch: on a 4K kernel a 16K-signed blob is marked csb_native4k_skipped and cs_native4k_prepare returns without reading the whole codeLimit, while cs_validate_hash accepts the faulted page. The 3.7 GiB dyld caches at 1-2 MB/s would otherwise spend tens of minutes per exec deriving 4K hashes. EBADEXEC (85) from cs_blob_init_validated is still untouched.", "The round164 frame closes the AMFI question and opens the read-path one: the kill line is gone, yet every child still reports unable to create a validated cs_blob object: 85 and load code signature error 4, pids keep climbing, and mediaserverd ends with Too many corpses being created. The same frame carries APFS's own integrity failure: apfs_jhash.c:146 disk0s1 Data hash mismatch for 16384 bytes at offset 12128256 in compressed data stream 102 of inode 162 (expected jhash 2e6c78f0..., got 0d13...), Verification failed with error 94, then apfs_pagein_with_verification reports Corrupt read data. Here 102 is the data-stream number, not a byte count.", "Round165 treats that as a block-layer bug rather than a signature-policy one: every read command starts with drainReadFifo (read BUFFER until DATA_AVAILABLE clears) and prepareReadPath, any failed transfer or leftover FIFO triggers resetReadPath (SDHCI_RESET_DATA), and the first full batch runs a one-shot A/B check that compares two CMD18 reads with 32 CMD17 reads of the same 16 KiB. Disagreement sets gReadBatchTrusted = false and the rest of the boot reads single blocks. Every outcome prints CloverSdhci r165: readcheck lba=... batch=.../... single=... diff=.../... first=.../... m=... s=...; a rejected batch adds CloverSdhci r165: batch reads disabled for this boot.", "Round166 retires the batch instead of trusting it: gReadBatchTrusted starts false, so every read this boot is the single-block sequence every round before r156 used, and checkReadPath still prints the A/B row as evidence about its one 16 KiB sample. The same round adds the missing resetReadPath on readDataBlock's command-response refusal, and zzy-clover-exec-sig-bytes.patch prints dataoff, datasize and the first four words of the first eight code-signature blobs load_code_signature reads. The host side cleared the image first: the whole OS window mounts and reads file by file (~6 GB, decmpfs included) with no hash or I/O error, and launchd, dyld and trustd all carry a fade0cc0 SuperBlob at their LC_CODE_SIGNATURE offsets, so the wrong bytes can only be produced on the device.", "The r166 frame moves the wall from wrong read bytes to the writable container: launchd_cache_loader[22] exits with namespace 2 subcode 0xa (SIGBUS), initproc death panics the machine, and APFS prints apfs_scan_verify:2467: disk0s1 failed to read ... followed by Container corruption detected by apfs_scan_verify while Persona 1000 loads. APFS says read failure, not checksum mismatch, and the same boot still opens the SystemOS caches with err=0 after a whole boot of single-block reads, so the batch was not the cause. The only difference from r161, where the same driver read 3.7 GiB of cache, is that the Data volume was written during the persona step.", "Round167 repairs the write path and restores batched reads behind a three-sample gate. writeSettled waits out SDHCI_DATA_INHIBIT and then polls CMD13 until R1_READY_FOR_DATA and R1_STATE_TRAN; a batch or block that is not confirmed is not counted and prints CloverSdhci r167: write not ready lba= blocks= rsp= st= polls=. writeMultiBlock checks sendStopCommand and resets the data circuit on a dirty phase. writePioBlock drops the 160 us per-word gap for level-gated writes, and both request deadlines scale as frequency * 2 + blocks * frequency / 200. At mode 21 the driver reads EXT_CSD CACHE_SIZE and clears CACHE_CTRL (byte 33) unless it is already zero, logging CloverSdhci r167: write cache size= ctrl= off= rsp= st=. checkReadPath now reads the same 16 KiB three times (two CMD18, 32 CMD17) and sets gReadBatchTrusted only when all three agree exactly; it prints CloverSdhci r167: readcheck lba= ... trusted=... and then either batch reads trusted for this boot or single-block reads for this boot.", "The r167 frame has no panic: launchd keeps exec'ing, but the block layer reports disk5: general error several times, tx_flush:1173: disk5 tx xid 531 took 22708252 us to flush (22.7 s), then disk1: general error, apfs: buf_bread(0x20): disk1 buf_bread() failed, error = 5, ctx->dev_read(507): disk1 dev_get err 5 reading blkno 31134 and 91811, and apfs_fs.c:1033 apfs_fs_read_tree (gr=1074). Error 5 is the EIO this block device hands APFS; two disks failing at fixed block numbers in the same window means APFS is re-asking, not that the media rotted. Round168 treats the three short bounds as the cause: writeSettled now allows 4 s and prints CloverSdhci r168: write settle took ms polls= once past 500 ms; acquireBlockGuard waits 30 s and prints CloverSdhci r168: block guard waited ms once past 250 ms; read requests use 5 s + 20 ms per block and write requests 10 s + 200 ms per block; a batch read gets one clean retry before the single-block fallback and each single block gets three attempts; a write batch whose settlement times out is reset and re-sent once. Only a full ladder failure returns EIO and prints CloverSdhci r168: read gave up lba= blocks= done= st= or write gave up lba= blocks= done= once.", "The r168 frame answers the write question and opens the read one: disk5 no longer reports general error and the 22.7 s tx_flush is gone, but disk1 returns EIO (error 5) on every 16 KiB buf_bread at unrelated block numbers (580, 108169, 91610, 102029; num read errs 0 to 6), apfs_ntree_read returns retval 5, and every daemon's compressed file fails in decmpfs_fetch_uncompressed_data with errno 5. The same boot still reads the SystemOS caches with err=0, so the medium and link are intact. The driver was asymmetric: a failed write batch has sent CMD12 since r157, while a failed single-block read only reset the host data circuit. A card left in the data state ignores the reads that follow, turning one failure into a cascade.", "Round169 stops the card on every read failure: abortReadTransfer sends CMD12 (R1b) and then resets the host, and readDataBlock uses it on both refusal branches. waitCardIdle runs before a read's first command, waits for SDHCI_DATA_INHIBIT to clear and CMD13 to report R1_READY_FOR_DATA in TRAN for up to 30 s, prints CloverSdhci r169: card busy %llu ms once past 250 ms, and sends CMD12 before giving up; the request deadline starts after it. writeSettled allows 30 s instead of 4 s, the write request base is 30 s, and both write retry paths wait for the card before re-sending. reportReadFailure prints at most eight CloverSdhci r169: read %s lba=%u blocks=%u done=%u st=%08x lines tagged guard, idle, deadline or gave up, replacing the once-per-boot read give-up.", "The r169 frame closes the read-path question: no panic, no disk1 or disk5 general error, no buf_bread error = 5, no dev_get err 5, no decmpfs or ChunkCompression errno 5 and no apfs_jhash Data hash mismatch, and the only driver reading is CloverSdhci r169: block guard waited 31 ms -- 31 ms, not 30 s, with no card busy line and no stage-tagged failure, so the read path never entered its failure branch. Stopping the card with CMD12 before resetting the host, and waiting for DATA_INHIBIT plus CMD13 READY_FOR_DATA|TRAN before a read's first command, is what broke the cascade.", "Round170 changes only the kernel's own reporting on this path: shared_region_check_np now prints at most 48 lines and only when dyld_flags changes or the pid is 8 or lower, a successful open of /System/Library/Caches/com.apple.dyld prints at most 16 times while a failed open and the main cache and .01 opens stay uncapped, and every exec and every exit prints one line with pid, ppid, boot seconds and the exit namespace and code. The r169 frame is therefore evidence about the card and not about the process tree, and the cap is what should make the next frame readable.", "The r170 frame reads further than any previous one and names its own cause. launchd printed Early boot complete twice, exec and exit probes show different comm values with climbing pids and advancing boot seconds (exec pid=38 t=66 comm=accessoryupdater; exit pid=54 t=29 rv=0x4000 ns=-1 code=0x0 comm=zproxy), so the process tree is progressing rather than looping, and then initproc exited -- exit reason namespace 2 subcode 0xa (SIGBUS) panicked the machine. Every failed read in the frame reports the same stage: CloverSdhci r169: read guard lba=16526882 blocks=1 done=0 st=00000000 and seven siblings, st=00000000 meaning the host raised no error at all -- the read lost the block guard, not the medium. The holder is named two lines later: tx_flush:1173: disk5 tx xid 526 took 102001275 us to flush and xid 527 took 120000602 us, against 22.7 s in the r168 frame, so r167's CACHE_CTRL-off write-through had grown into a two-minute hold on the only card. Everything downstream follows that shape: disk1/disk3/disk5 general error, nx_buf_bread error = 5, _vn_rdwr_dev_read got err 5 at blknum 96950 through 92439 (num read errs 1 to 23), apfs_nstream_read retval 5, decmpfs_fetch_uncompressed_data err 5, and launchd's Missing executable detected for identityservicesd whose path lives on disk1. One more reading closes the read path: CloverSdhci r159: multi read fail lba=29165200 blocks=8 st=0x21 w=1024/1024 -- all 1024 words arrived, but st=0x21 is DATA_AVAIL|RESPONSE with no DATA_END, because this host only raises end-of-transfer for a multi-block PIO after the stop, so r157's criterion had been rejecting fully delivered batches and forcing single-block reads forever. Round171 changes four things accordingly. batchDelivered(status, words, total) accepts a batch whose word count is complete and whose DATA_CRC / DATA_END_BIT / ADMA_ERROR bits are clear, both drain loops break on DATA_END only when the FIFO no longer offers words, and a refused stop is retried once and reported (CloverSdhci r171: batch stop refused lba= blocks= (once)); writes still require delivered and stopped. The card's write cache is switched back on at bring-up (CloverSdhci r171: write cache size= ctrl= on= rsp= st=) and committed by an exported clover_emmc_flush_cache() that writes EXT_CSD CACHE_CTRL=0, waits for the card to return to TRAN, and writes 1 again, printing CloverSdhci r171: flush failed flushed= back= if either half is refused; CloverBlock counts outstanding writes in gWritesSinceFlush, commits only when that counter is non-zero, answers doSynchronizeCache / requestIdle / doSynchronize with commitCache(), reports the card's real cache state from getWriteCacheState, and writes through immediately for any write inside the logfs window because no filesystem sits above it to sync and the boot that writes the last record ends in a hard reset (CloverBlock r171: first commit blocks= cache= on= flushes=). Both guards become IOLocks the way sheng's NativeUfs serializes its window reads -- gBlockLock in CloverSdhci and gBatchLock in CloverBlock -- so a second caller waits instead of failing or silently degrading to one block at a time, and the wait keeps its r168 reading. kReadChunkBlocks goes 32 to 128, and because that constant had also been the trust gate's trigger, checkReadPath takes its sample from the request (min(blocks, 128), gate at four blocks) so a 16 KiB APFS read can still earn batch trust; the readcheck row gained sample=%u.", "Round172 puts reads on ADMA2 behind a word-for-word gate. The descriptor layout is transcribed from this tablet's own 4.19 CAF tree (drivers/mmc/host/sdhci.h: struct sdhci_adma2_64_desc is cmd u16, len u16, addr_lo u32, addr_hi u32, 12 bytes, ATTR_VALID 0x21, ATTR_END 0x02, and sdhci-msm.c:5646 sets NO_ENDATTR_IN_NOPDESC, so the last transfer entry carries END and there is no terminating NOP); the table is built in a page-aligned buffer, cleaned to memory, and read by the host while the CPU waits on the same DATA_END / content-error bits as the PIO path. checkDmaPath() then reads one request twice -- the r171 batch PIO path and ADMA -- and only sets gDmaTrusted when both complete and every word matches, printing CloverSdhci r172: dmacheck ... diff= first= ms=.../... kbs=.../... trusted=. The gate runs only after gReadBatchTrusted, and the DMA chunk falls through to the PIO batch on refusal, so the worst case on the frame is round171 with a line next to it. Writes stay on PIO deliberately: a wrong DMA write does not return EIO, it changes the card.", "Round173 gives the write side the same transport, behind a stricter gate. A DMA write is attempted once per boot, only on 16 blocks of the logfs window at kLogfsFirstLba + 4096, and only with the bytes that path read back a moment earlier: first a PIO control run (write, settle, read, diff) must prove the medium round-trips that run at all, then the DMA run must put the same words back and be read out again by single-block PIO, and only control=1 with diff=0 on both sides sets gWriteDmaTrusted. The LBA always comes from the command argument, so a malformed descriptor table can corrupt the content of that logfs run but cannot move a write into userdata. Settle failures are not charged to the eight-failure retirement because they are the card's programming time, matching the PIO batch. Panic-screen and bring-up logfs writes keep calling writePioBlock directly and stay outside this path.", "Round174 moves the readings off the panel and onto the card: every CloverSdhci verdict goes through sdhciSay, which prints the line and parks it in a 32-slot RAM ring, and flushVerdictRing writes the oldest pending records -- four per pass, two 512-byte LOG1 blocks each -- into kind-21 slots starting at logfs sector 64, clear of the panic window. The flush runs only from a transfer tail that already holds the block guard and uses the unguarded primitives, so it cannot queue a wait behind itself; a full ring overwrites its oldest line and counts the drop instead of blocking.", "Round175 puts a second producer on the same verdict ring without touching the transport: at each already-guarded request tail the driver drains up to 4096 kernel-log bytes before spending the guard on the card, keeps only allowlisted lines (clover r, CloverBlock, apfs, decmpfs, load code signature, AMFI, launchd, initproc, vm_fault, shared_region, panic), drops its own CloverSdhci lines because the ring already carries them, and pushes at most four per pass through the same unguarded single-block writer from round174.", "Round176 gives that second producer its own window instead of a second pointer: kind 21 keeps sectors 64..191 with 64 card slots and four lines per pass, kind 22 takes sectors 192..1215 with 512 slots and eight, both written by the same unguarded single-block primitive at the same three guarded tails, both indexed by their own cursor and sequence so a wrapped ring still reads oldest-first. The tee's own state lines stay in kind 21, which makes kind 22 mean one thing -- what the kernel said -- and lets the host assert that a kind-22 dump filtered by driver prefix counts zero. The write target is still the cache partition and the panic slots at sectors 0..31 are still untouched, with the round173 write gate at sector 4096 clear of both rings.", "Round177 changes nothing the storage stack measures: same drivers, same two rings, same payload geometry. What it closes host-side is the last open reading from the round162 respawn loop -- scripts/check-cs-blob-structure.py replays the 14 rejection rules cs_validate_csblob applies to a code-signature blob and accepts this boards launchd, so EBADEXEC was never the kernel misjudging blob shape; the blob the kernel rejected is structurally valid by the kernels own rules, and what it lacked were the bytes, which is the read and flush path rounds 171 onward address.", "Round178 makes the block guard change hands between chunks: a read or write run cuts after every 128 delivered blocks, records the time it owned the host, unlocks and re-queues. That is the second half of round171, which turned a refusal into a wait but left the wait at the head of a request, so a page fault at another volume could only ever be served between whole transfers -- the eight read guard ... done=0 st=00000000 rows in the round170 frame are reads the card never refused. Falling back to single blocks counts toward the same cut, so a boot whose batch is untrusted still cuts every 128 blocks. The flush region deliberately keeps one owner: it waits on the cards own cache programming, where a newcomer would only queue on the same DATA_INHIBIT bit.", "Round184 adds one write path to CloverSdhci and it is the path that runs when nothing else can: the exported panic sink clover_emmc_panic_append keeps its name and signature (the patcher's PANIC_SINK contract) but its body now appends the panic record through panicAppendText and then calls panicDrainRings (), which gives the tee kPanicTeePasses = 8 passes over the kernel msgbuf, keeps the newest kPanicDrainCap = 48 records of each ring dropping the oldest first, writes with the same unguarded single-block PIO primitive its own two panic writes already use, and stops on the first refused write rather than retrying. It cannot wait on a block guard a dead thread may be holding, and the worst case is bounded inside the 20 s reset window. Its own line, CloverSdhci r184: panic drain wrote=%u dropped=%u tee_passes=%u, is written after both rings drain so a quiet ring cannot be mistaken for an empty one. No geometry moves: still kind 21 at logfs sector 64 and kind 22 at sector 192."]
completion = ["The OS root mounts, the SystemOS volume is union-mounted, /private/var is the card's Data window, launchd executes, and dyld maps the shared cache without a MAC or signature refusal."]
limits = ["The Data window is a 32 MiB scratch seed, not the full /data partition; it is writable but small, and it is appended between the two GPT copies rather than declared by the GPT.", "The launchd-to-daemon path is blocked inside ubc_cs_blob_add: the kernel rejects each main binary's signature blob with EBADEXEC (85) before MACF, even though the same file's cdhash is in the 2478-entry static trust cache and the host blob is structurally valid. The suspect is what the kernel read, not the trust decision. Round164 removes both AMFI deny branches and skips the whole-file 4K hash without explaining the 85; the most likely shape is a truncated blob read (logd's signature is 21,120 bytes at file offset 224,912, crossing a 16 KiB batch boundary).", "The shared-region mapping syscall 536 still has no reading: each exec dies in the respawn loop before the mapping result can be observed. With AMFI bypassed this is the next candidate wall.", "There is no UFS, virtio-block or native verified-root component; sheng's storage stack is SM8550-specific.", "The 85 and the APFS read failure are not yet proven to share one cause. Round167 repairs three write-path defects and the missing CACHE_CTRL clear, but the r167 image has not been measured; if APFS still reports a corrupt container after this flash, the Data seed itself needs a host-side check before another firmware change.", "Batch reads are trusted again only when the two CMD18 samples and the 32 single-block samples of one 16 KiB read agree word for word; any disagreement keeps the whole boot on single blocks, so a frame with trusted=0 is a read-path verdict, not a performance one.", "A checkpoint flush still took 22.7 s even with batched writes, so write throughput remains the slowest link; the r168 settle reading gives the card's own programming time before the clock, bus width or DMA path is changed again.", "The r167 frame cannot show whether the write cache was turned off or whether batch reads were trusted: both lines had scrolled out of the photo, so the EIO diagnosis rests on the two disk error rows and the flush time, not on those readings.", "Round172's ADMA2 path is a second transport with no measurement behind it yet. It cannot make a boot read wrong -- the gate is a word-for-word comparison against the already-trusted PIO batch, every refusal falls back to PIO, and eight failures retire DMA for the boot -- but until the frame shows dmacheck ... trusted=1 with its two kbs= numbers, the throughput this port can claim is still round159's 1-2 MB/s. The write path is left on PIO on purpose: a wrong DMA write does not return EIO, it changes the card, so it needs a pattern write and a PIO read-back before it gets the same trust.", "The descriptor layout is transcribed from this tablet's own 4.19 CAF tree, and the CAF tree is a maintenance dependency, not a contract: if a later Qualcomm kernel changes the 64-bit descriptor field order or reintroduces a terminating NOP descriptor, the on-device dmacheck row is what catches it, and the checker pins the provenance strings so a silent divergence shows up as a failed check rather than a corrupted read.", "Round173's write gate is a second transport with no measurement behind it either: until a frame shows wrcheck ... control=1 diff=0/0 trusted=1, the only write throughput this port can claim is round170's measurement of a 102 s checkpoint flush. The gate costs one thing it should be said plainly: it rewrites 16 logfs blocks with their own bytes, so a medium that cannot hold a write inside that window loses those log slots while keeping userdata untouched -- that is the whole blast radius, and it is why the sample run lives in logfs rather than on the root volume.", "Round174 spends up to four records -- eight block writes -- at the tail of each guarded request, so a boot whose requests never reach a tail keeps its verdicts in RAM and writes nothing, and a ring that fills before a flush loses its oldest line (the drop is counted, never blocking) rather than the card.", "Round175 shares that 32-slot ring with the kernels own lines, so a busy daemon can push a driver verdict out of it before the card ever sees it; the per-pass caps -- 4096 bytes scanned, four lines pushed -- and the tee kept=/throttled=/lap= counters are what separate an evicted reading from a reading that was never made. Widening the channel means another window on logfs, not a second pointer in this one.", "Round176 took that other window, so eviction is now bounded per producer: 512 kernel lines and 64 driver verdicts, each overwriting only its own oldest entry. What is still lost is depth, not the other speaker -- a boot with more than 512 allowlisted kernel lines loses its earliest kernel text, and a driver that says more than 64 things since the last flush loses its oldest verdict, which the dropped counter reports. The tee census is capped at 12 lines for the same reason round170 capped the panel: bookkeeping must not become the content."]
next_action = ["Cold-flash cache with ~/clover-out/round178-payload.img and read the card, not the panel: run-clover-unattended.sh dumps 1216 logfs sectors -- report and panic slots, then the kind-21 driver ring at sectors 64..191 and the kind-22 kernel ring at 192..1215 -- and read-clover-log.py prints each ring oldest first by its own sequence. Nine round171-174 throughput and trust readings arrive in the driver ring, the dyld, exec/exit, cs_blob, mountroot and APFS lines in the kernel ring, and the two no longer compete for space. Two numbers decide the dump: tee seen=/kept=/throttled= in the driver ring separates an unarmed channel from a channel that read nothing it keeps, and --tee --driver over the kernel ring must count zero -- anything else means the tee is copying its own words onto the card and that rings kernel text is not the kernels.", "Round178 puts one more line in that same driver ring, CloverSdhci r178: ... cuts= waits= worst= ms, and it decides between two next steps on its own: if launchd stops dying of SIGBUS while tx_flush still reports hundred-second flushes, the page fault was not blocked by that writer and the thing to change is the chunk length, not the moment of letting go; if worst= itself reaches seconds, the card is the one queueing and throughput, the HS400/CQE item, is what is left."]

