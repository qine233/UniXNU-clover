[[area]]
id = "packaging"
status = "implemented"
components = []
paths = ["board.toml", "scripts/build-clover-block.py", "scripts/patch-clover-amfi.py", "scripts/normalize-kernel-macho.py", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c", "scripts/verify-clover-payload.py", "patches/xnu-clover/**"]
inputs = ["Prelinked kernel, generated ADT, three-module trust cache, mockfs root image, platform seed and uefi-clover firmware."]
configuration = ["The payload volume is 56 MiB, FAT with 512-byte clusters; loader = firmware.", "patches/xnu-clover/*.patch are applied to the shared XNU tree before the kernel build; they are not applied by the payload step.", "panic_screen = true and entry_probe_reset_delay = 15 patch the payload copy of the kernel with the panic screen and the timed reset."]
procedure = ["Build kernel and payload with the seed, root image and trust cache named explicitly.", "Run scripts/check-clover.py and scripts/verify-clover-payload.py; the second reads probe strings back from the payload image.", "Flash only the cache partition and keep a recovery image available."]
findings = ["The payload builder rejects a trust cache that does not match the trust_cache_sha256 pin; the three-module bundle is the only accepted one.", "The build reads ~/UniXNU/patches/xnu/*.patch, not patches/xnu-clover directly, so a patch change must be copied into the shared tree before the kernel build.", "sheng's [payload.install] needs a Data seed and a persistent Data volume. clover has neither, so no install menu is declared.", "Round164 rebuilds the kernel with zzy-clover-dyld-cache-skip.patch (16 KiB-signed blobs skip cs_native4k_prepare's whole-file read and cs_validate_hash accepts the faulted page) and patches both AMFI exec deny branches on the resulting copy (file 0x1a830e4 cbz to b; file 0x1a8316c tbz to nop). The menu title now names r164; the verifier asserts the three skip instruction groups and both allow-path words, and check-clover.py asserts the patch, patcher and verifier sources.", "Round165 rebuilds only what the driver change touches: the same AMFI copy procedure, a new prelink kernel 8a2d2bbf, AMFI copy 54875b4b, payload 31f2572d with in-volume kernel 12d0d834, unixnu.toml aa31b36a, ADT 99afed39, scratch-data.img 614b8356 and trustcache 7c369ce0. The verifier gains check_read_integrity and asserts the two new CloverSdhci strings; the entry probe stays at 6845 bytes in 37 runs.", "Round166 rebuilds the kernel with zzy-clover-exec-sig-bytes.patch on top of the r164 skip patch: prelink kernel e8b6570c, AMFI copy 986d6ab2 (same 0x1a830e4 and 0x1a8316c sites), payload 9092782b with in-volume kernel b897038d, unixnu.toml dac1ddfc, ADT 7645659b, scratch-data.img 614b8356 and trustcache 7c369ce0; the entry probe is 6844 bytes in 37 runs and verify-clover-payload.py reports 21 checks OK, including AMFI exec hook allows, eMMC read integrity and exec signature dump. The trust cache flag must name build/clover-trust/trustcache.bundle, because build/clover-root/trustcache.bundle is the 56-byte single-module bundle the board pin rejects.", "Round167 rebuilds only the driver and the payload: prelink kernel 248e7c58, AMFI copy f15625be (same 0x1a830e4 and 0x1a8316c sites), payload 2017f236 with in-volume kernel b87480e5, unixnu.toml 4cdbd9c7, ADT 5b328b26, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6845 bytes in 37 runs; verify-clover-payload.py gains an eMMC read/write integrity check covering the readcheck row, both trust outcomes, the write-cache row and the write-not-ready row, and reports every check OK.", "Round168 rebuilds only the driver and the payload: prelink kernel 1be9cc03, AMFI copy 86f99fc0 (same 0x1a830e4 and 0x1a8316c sites), payload 5870d848 (58,720,256 bytes) with in-volume kernel cb0a20cf, unixnu.toml 6f1b4889, ADT 056815d2, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6845 bytes in 37 runs; verify-clover-payload.py asserts the new guard-wait, settle, read-give-up and write-give-up strings on top of the r167 set, and reports every check OK.", "Round169 rebuilds only the driver and the payload from the same kernel tree with zzy-clover-dyld-cache-skip.patch reversed: prelink kernel c5e70a3b, AMFI copy f5f1db9e (same 0x1a830e4 and 0x1a8316c sites), payload db15478e (58,720,256 bytes) with in-volume kernel 52ef7cf4, unixnu.toml 76ca3839, ADT 34b08b2b, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6845 bytes in 37 runs; verify-clover-payload.py asserts the card-busy, staged-read and 30 s settle strings on top of the r168 set, and reports every check OK.", "Round170 rebuilds the kernel from the same tree with zzy-clover-dyld-cache-skip.patch reversed: prelink kernel 98f2e5e1, AMFI copy a100d479 (same 0x1a830e4 and 0x1a8316c sites), payload 00510286 (58,720,256 bytes) with in-volume kernel 27e95ca6, unixnu.toml 6df3a99e, ADT d8de9a71, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6844 bytes in 37 runs; verify-clover-payload.py gains kernel.macho: exec/exit probe linked, requires the throttled r170 open and check_np forms and rejects the two uncapped r153 strings, and reports every check OK.", "Round171 rebuilds only the drivers and the payload from the same kernel tree with zzy-clover-dyld-cache-skip.patch reversed: prelink kernel 076f1542, AMFI copy 616f1b38 (the new prelink moves the two exec-hook sites to file 0x1a870e4 and 0x1a8716c and the patcher finds them by symbol), payload 093fafdd (58,720,256 bytes) with in-volume kernel 6cfebbef, unixnu.toml 1333bed1, ADT 2dd487f5, scratch-data.img 614b8356 and trustcache 7c369ce0, the last two unchanged. The entry probe is 6844 bytes in 37 runs; verify-clover-payload.py's eMMC read/write integrity check now requires the batch-stop-refused, write-cache, flush-failed and first-commit strings and reports every check OK, and scripts/verify-userdata-window.py re-passes the round159 archive (9,416,212,480 bytes, three windows, Data 33,554,432 bytes at 0x22f400000, seed sha256 ef00c083) because this round does not touch userdata.", "Round172 extends the payload gate with DMA_INTEGRITY: verify-clover-payload.py now refuses an image whose kernel lacks the five strings that only the ADMA2 path compiles to -- dma up data=, dmacheck lba=, ADMA2 reads trusted for this boot, reads stay on the PIO path for this boot, first dma read lba= -- so a payload built from an older CloverSdhci cannot ship under a round172 title. check-clover.py additionally refuses a NOP descriptor, an unconditional gDmaTrusted = true, and SDHCI_TRNS_DMA on any write transfer mode.", "Round173 extends the payload gate with WRITE_DMA_INTEGRITY: verify-clover-payload.py now also refuses an image whose kernel lacks wrcheck lba=, ADMA2 writes trusted for this boot, writes stay on the PIO path for this boot and first dma write lba=. check-clover.py pins the gate's shape instead of the old prohibition -- the kWriteCheckLba constant, the window refusal against kLogfsLastLba, controlHeld && dmaWrite && dmaRead && diffDma == 0, and the fact that clover_emmc_panic_append still contains writePioBlock calls -- so a payload whose write gate silently degraded to 'trust DMA' cannot ship under a round173 title.", "Round174 gives the payload gate its own assertion: verify-clover-payload.py refuses an image whose linked kernel lacks the verdict-ring arming string, beside the existing read/write-integrity and exec-signature checks, so a payload built without the round174 driver cannot ship under a round174 title.", "Round175 renames the payload gate row to kernel.macho: verdict ring and log tee linked and requires both strings in the linked kernel -- the round174 verdict ring armed lba= and the round175 tee armed bufc= -- so a payload that names this round cannot ship without the tee in it.", "Round176 renames that row to kernel.macho: verdict rings and log tee linked and requires three armed strings in the linked kernel -- verdict ring armed lba=, kernel ring armed lba= and tee armed bufc= -- so a payload that claims round176 cannot ship with one ring or with a tee that never armed. The entry probe is unchanged at 6844 bytes in 37 runs and the payload is again 58,720,256 bytes: this round adds no XNU patch, only the drivers own record layout.", "Round177 puts scripts/normalize-kernel-macho.py into this areas paths and into the recipe between the AMFI patcher and the payload build. Two builds of one tree were measured 3,861 bytes apart in a 52,043,776-byte kernel in exactly three kinds: the n_value of 962 object-path stabs (the .o mtime, and only 50 of them differ per rebuild because a rebuild re-makes the twelve board archives and the patch-rewritten XNU files), one LC_UUID, and the _PrelinkKCID base64 inside __PRELINK_INFO. The normalizer blanks every stamp and derives the UUID and the KCID from sha256 of the zeroed file, is idempotent and length-preserving, and passes --prove on two real prelink outputs and on the two delivered AMFI copies; the shipped round177 AMFI copy is f9966b72 and --check calls it normalised. verify-clover-payload.py gained its 24th check, kernel.macho: build-varying fields normalized, which rebuilds the field table from the in-volume kernel and requires 962/962 stamps blank beside one UUID and one KCID -- it stops at the field table because the payload build writes entry probes into executable text after normalisation. Artifacts: prelink a307b5b0, payload 5d86bbaa (58,720,256 bytes) with in-volume kernel 348049f1, unixnu.toml d53c37e3, ADT 4113f39c, scratch-data.img 614b8356 and trustcache 7c369ce0; the entry probe is still 6844 bytes in 37 runs.", "Round178 ships prelink b8e194b6, a normalized delivery kernel fb2946ae with the AMFI hits at file 0x1a880e4 and 0x1a8816c, payload 28324379 (58,720,256 bytes) with in-volume kernel 2a5cea30, unixnu.toml 96817875, ADT 732a9815, scratch-data.img 614b8356 and trustcache 7c369ce0; the entry probe is still 6844 bytes in 37 runs and normalization still leaves 3860 differing bytes outside executable text. verify-clover-payload.py gained a twenty-fifth check that the r178 hand-off format string is present in the kernel on the volume."]
