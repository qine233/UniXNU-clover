[[area]]
id = "audio"
status = "planned"
components = []
paths = ["board.toml", "drivers/CloverDsp/**", "scripts/test-clover-dsp.py"]
inputs = ["SDM660 ADSP, LPASS and the board's codec/amplifier wiring.", "The shared heap the DSPs and the application processor agree on -- qcom,smem@86000000 at 0x86000000 + 0x200000, declared qcom,mpu-enabled -- the APCS IPC page at 0x17911008, the image regions that heap names, and qcom,lpass@15700000 with qcom,pas-id = <1>, qcom,smem-id 0x1a7 and qcom,ssctl-instance-id 0x14."]
configuration = ["No audio driver is selected.", "clover-dsp=3 selects drivers/CloverDsp's read-only shared-heap instrument: 1 reads the heap header and its partition table, 2 adds the APCS SMP2P doorbell, 3 adds the ADSP and WiFi image scans. No ADSP service, GLINK channel, APR port or codec is claimed, and no heap word, doorbell word or image byte is written by any mode."]
procedure = ["Bring up the DSP transport before the codec.", "Record playback and capture separately."]
findings = ["sheng's audio area depends on its SM8550 ADSP firmware, GLINK/QRTR services and CS35L43 amplifiers. None of those descriptions applies here.", "Round183 is the first code in this area and every byte of it is read-only. The fork it exists to settle is the schedule's fifth item: if the shared heap carries an ADSP partition row and the ADSP image region holds data, the DSP is already running under this boot and the audio question is a protocol question -- GLINK or APR over a heap that already exists. If the row is absent, or the region reads all zero, the ADSP was never brought up here and the work is a load question that starts with PIL (qcom,pas-id = <1> on qcom,lpass@15700000) and the vdd_cx rail, which is the power area's next step rather than this area's.", "Round164 leaves the audio inventory unchanged.", "Round167 leaves the audio inventory unchanged.", "Round168 leaves the audio inventory unchanged.", "Round169 leaves the audio inventory unchanged.", "Round170 leaves the audio inventory unchanged.", "Round171 leaves the audio inventory unchanged.", "Round172 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round173 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round174 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round175 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round176 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round177 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round178 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round179 adds no audio work; the WCD codec stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round180 adds no audio driver, and the board.toml edit is not a menu title this time: it swaps the display archive for build-clover-gop-legacy-display.py, adds the three phase-1 boot-args (offline-mobile-graphics-load, offline-legacy-register, offline-legacy-phase) and retitles the menu. None of those three args touches LPASS, ADSP or the WCD codec, and the audio area's own status stays planned with no driver selected.", "Round181 changes no audio fact: the WCD codec and the ADSP stay untouched, and no SPMI or APR transaction is issued. Its share of the round is the board.toml archive line, boot argument and title.", "Round183 decodes the heap the way the vendor tree decodes it and keeps the three places where the two trees disagree visible. The partition table sits at kSmemSize - 0x1000; its header is 0x20D0 bytes, wider than the single page the vendor map reserves, and that is recorded as a deliberate non-copy rather than smoothed into one number. The table of contents is 512 sixteen-byte entries starting at offset 0xD0 and is walked only after the header's own checks pass, and all four magics are compared as little-endian words -- $TOC 0x434f5424, $PRT 0x54525024, SIII 0x49494953, $SMP 0x504d5324 -- because the vendor header spells the same four as character literals that a grep for the word form would miss. Mode 2 adds the APCS page at 0x17911008, whose SMP2P items are validated with the vendor's own identity rules (version, total_entries equal to 512, both process ids) before any item is named; the ADSP-out item resolves to global id 429 from the item base 427 and stride 8, and cdsp-in 94 is kept in the record precisely because it breaks that arithmetic -- so the ladder is labelled a candidate, not a law, and a doorbell reading is only trusted against the item's own fields. Mode 3 adds the two image scans, 16 pages deep per region, because the question is presence rather than content and the answer is the ELF magic word 0x464c457f.", "Read-only is structural here, not a promise: an APCS write IS the interrupt, so there is no safe subset of doorbell writes, and the heap node declares qcom,mpu-enabled, so a mapping that outruns the declared window is refused before it is read. The driver maps first and reads second, returns named codes (DS_E_RANGE, DS_E_CANARY and nine others) instead of magic numbers, and ends in clover_emmc_flush_cache() so the report leaves the device; check-clover.py refuses windowWrite, ds_write, kSmp2pSet and IOMemoryDescriptor::withAddress anywhere in these sources, which is how the absence of a write path is asserted rather than claimed.", "Round184 opens no codec path and issues no SPMI write. Audio still waits on rails, and rails still wait on an arbiter that refused to be identified on hardware (not a v5 arbiter, with cnfg700=00000000 and apid=-1 candidates=0). The board.toml edit this round -- three instrument arguments commented, clover-unattended=300 added, the r184 menu title -- neither opens nor closes an audio path, and this area stays planned for the same SM8550-specific-component reason it was before."]
completion = ["A declared route plays or captures the selected format and handles start/stop.", "Round183's own completion is narrower and is machine-checkable: the heap header decodes, the TOC walk stays inside the declared window, the partition rows each pass their own header check, and the verdict line says adsp_edge=seen or not seen and adsp_loaded=pages nonzero or pages zero."]
limits = ["No audio device is published.", "The instrument reads what a boot left in memory and cannot say who left it there. A heap with no ADSP partition row is not proof that the ADSP cannot run -- only that this boot did not load it, and this boot is a cold flash of the cache partition with no PIL and no modem on this board.", "Item 429 is derived arithmetic, not a device-tree fact, and cdsp-in 94 already breaks the same ladder, so a doorbell reading is only believed against the item's own name and identity fields.", "The 0x20D0-byte heap header is wider than the one page the vendor maps; this driver scans 16 pages per image region instead of a declared size. Both are choices, and a reading that depends on either has to say so."]
next_action = ["Cold-flash round183 and read one line off the card with scripts/read-clover-log.py --tee: clover r183: verdict adsp_edge=seen|not seen adsp_loaded=pages nonzero|pages zero (mode 3 done). adsp_edge=seen with pages nonzero makes the next audio round a protocol job over the heap this one decoded (GLINK or APR, and then the codec). Any other combination makes it a bring-up job, whose first step belongs to the power area -- the vdd_cx rail the ADSP node declares -- and whose second is PIL loading qcom,pas-id = <1> on qcom,lpass@15700000.", "The WiFi half of the same scan is readable without claiming a network: wlan_msa and wlan_guard rows and their ELF presence say what the boot loader placed there, which is the only firmware inventory this board has until a modem path exists.", "Keep the codec inventory behind this round: the heap says nothing about which codec the board uses, no APR port is claimed here, and the WCD path still needs its own device-tree reading."]

