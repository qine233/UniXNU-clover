schema_version = 1

[device]
name = "clover"
soc = "SDM660"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi Pad 4 8\" LTE uses a board-owned eMMC path, an Apple device tree generated from two device trees, uefi-clover firmware and an ESP payload. This record describes implementation coverage and the evidence required for each milestone."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitattributes", ".github/**", "unixnu.lock", "AGENTS.md"]
inputs = ["SDM660 board facts, iPadOS 17.7.11 build 21H461, clover defconfig, pinned XNU and firmware sources.", "Two device trees pinned as refer sources in feeds.toml and the unit's own facts/ dump."]
configuration = ["board.name = clover; board.soc = SDM660; board.os_profile = ipados-17.7.11-21H461.", "The kernel arguments are the board contract: serial=3, debug=0x14e, boot-progress=2, clover-pmgr=2, clover-apfs=3, clover-emmc=21, cs_enforcement_disable=1, -no_slto_panic and ml-timeout-lock-panic-scale=40.", "This repository owns no submodules. ArmCpu, CloverSdhci, CloverBlock and CloverPMGR are in-tree drivers; shared XNU sources and the component catalog come from UniXNU."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig clover_defconfig --device ../UniXNU-clover from UniXNU.", "Run ./unixnu status --json --device ../UniXNU-clover and review the defconfig, archives and patch order.", "Run scripts/check-clover.py; the firmware step runs the same checker from the assembled tree."]
findings = ["sheng selects SM8550 components through [components] include. clover instead names explicit archive builders in [kernel] archives and keeps an Apple-style prelink root list, because the clover drivers are board-local rather than catalog components.", "sheng's OWNER_* and BOOT_PROGRESS switches cannot be enabled from clover_defconfig: build-xnu-4k-baseline.sh gates them behind NATIVE_VIRTIO_BLOCK, whose archive would define the native_verified_block_* symbols a second time. patches/xnu-clover/zzy-clover-owner-root-trust.patch and zzy-clover-systemos-mount.patch set the two object-local macros instead.", "The porting record is the same schema sheng maintains; .github/workflows/porting-record.yml runs the shared validator on every push.", "Round164 changes one payload title and adds no configuration key: board.toml only names the round in [payload] title. The kernel build additionally reads patches/xnu-clover/zzy-clover-dyld-cache-skip.patch copied into ~/UniXNU/patches/xnu/.", "Round165 again adds no configuration key: only the payload title names the round, and the kernel change is confined to drivers/CloverSdhci. The checker's title assertion moves to clover r165.", "Round166 adds no configuration key either: the title carries clover r166, the driver change is source only, and the new kernel half is patches/xnu-clover/zzy-clover-exec-sig-bytes.patch copied into ~/UniXNU/patches/xnu/. The build tree must be fully patch-applied before the archive step and zzy-clover-dyld-cache-skip must be reversed before the kernel step, because that patch overlaps the native-4k hunk it builds on.", "Round167 adds no configuration key: the title carries clover r167 and every change is inside drivers/CloverSdhci (CMD13 write confirmation, scaled request deadlines, EXT_CSD CACHE_CTRL clear, and batch reads trusted only when two CMD18 samples agree with 32 single-block reads)."]
completion = ["board.toml parses, every pinned source resolves, two checkers pass, and the record names each area this board implements or plans."]
limits = ["A local source override can differ from the published pin; record the effective source with the verification result.", "The record describes this repository. The uefi-clover repository owns its firmware implementation."]
next_action = ["Compare the effective status output whenever a defconfig, source pin or patch changes, and update the affected area's findings."]

