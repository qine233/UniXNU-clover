id = "diagnostics"
status = "implemented"
components = []
paths = ["scripts/check-clover.py", "scripts/read-clover-log.py", "scripts/check-cs-blob-structure.py", "scripts/run-clover-unattended.sh", "scripts/decode-clover-address.py", "scripts/decode-clover-cache-offset.py", "scripts/dump-clover-facts.sh", "scripts/test-clover-power.py", "scripts/test-clover-dsp.py", "board.toml", "scripts/test-clover-716-negatives.py"]
inputs = ["Panel output after the boot menu, logfs slots in the eMMC, IMEM restart-reason cell at 0x146bf000+0x65c.", "Panic screen and entry probe as the only reporters."]
configuration = ["boot-progress=2 and debug-enabled in /chosen enable the checkpoints.", "clover-unattended=<seconds> arms the ArmCpu deadline and the panic-screen reset into fastboot; the shipped boot leaves it out.", "read-clover-log.py reads logfs on the host; decode-clover-address.py maps a kernel address to a symbol."]
procedure = ["Run the checker for the changed area and keep its command and output.", "Read the last completed checkpoint and the first failing operation from the panel; link the captured frame.", "If a probe is silent, state whether it was not reached or was reached and printed nothing."]
findings = ["Three evidence levels are different facts: source shape, host check and device frame.", "r151's silence came from reading cn_pnbuf before vn_open_auth initialized it; r153 moved the read after the call. A silent probe is never proof that the code did not run.", "The r154 syscall-536 probe printed nothing even though .01 opened, which places the wall before the mapping syscall.", "The 524 ms lock timeout can fire during a slow 16 KiB read; ml-timeout-lock-panic-scale=40 is part of the shipped diagnostic frame.", "Round160 taught this checker the userdata host gate: scripts/verify-userdata-window.py must exist and keep its pinned seed, three-window rule and last-window rule, so the destructive image cannot be flashed with a gate that stopped reading it.", "Round164 changes the menu-title assertion to r164 and teaches the checker the kernel-side skip patch, the two-signature AMFI patcher and the verifier's new assertions; no probe was added, and both halves are binary/source patches recorded in the storage and packaging areas.", "Round165 adds one evidence row that is also a repair: CloverSdhci r165: readcheck reports two batch reads and 32 single-block reads of the same 16 KiB with a word-diff count and the first differing index, and CloverSdhci r165: batch reads disabled for this boot marks the fallback. The checker asserts the drain, reset, prepare and check functions and the read loop's gReadBatchTrusted gate; verify-clover-payload.py asserts both strings in the image.", "Round166 keeps the A/B row as an observation, not a policy switch, and adds the exec-side signature dump clover r166: sig n= mo= off= size= w=.../.../.../... for the first eight blobs the loader reads. The checker asserts the untrusted default, the two r166 strings and the patch's dump; verify-clover-payload.py asserts the image carries both strings plus the dump format, and the host-side image clearance (OS window mounted, every file readable, three SuperBlob magics) is recorded as evidence rather than assumed.", "Round167 adds two write-side readings and one policy reading: CloverSdhci r167: write cache size= ctrl= off= rsp= st= says whether the eMMC write cache was on and is now off, CloverSdhci r167: write not ready lba= blocks= rsp= st= polls= names the first write CMD13 never confirmed, and CloverSdhci r167: readcheck ... trusted=... plus batch reads trusted for this boot or single-block reads for this boot records which read path the boot actually used. The checker asserts writeSettled, the stop-command result, the CACHE_CTRL constant, the scaled deadlines, the three-sample rule and the absence of the 160 us per-word gap in the write path; the verifier asserts the same four strings in the payload image.", "Round168 turns four wait bounds into readings: CloverSdhci r168: block guard waited ms fires once past 250 ms, CloverSdhci r168: write settle took ms polls= once a counted write took more than 500 ms to be confirmed, and read gave up lba= blocks= done= st= or write gave up lba= blocks= done= is printed once when the whole retry ladder fails. The r167 frame that motivated them had no panic and no give-up line: disk5 and disk1 both returned EIO (error 5) at fixed block numbers while a single checkpoint flush took 22.7 s, so the driver's own 2 s guard and 200 ms settle were timing out a card that was merely busy. The checker rejects the old two-second hand-over and the flat two-second request base and asserts the 30 s guard and 4 s settle; the verifier asserts the four new strings.", "Round169 turns a read failure into a stage and a stop: CloverSdhci r169: card busy ms fires once past 250 ms of waiting for the card before a read, CloverSdhci r169: read <stage> lba= blocks= done= st= names up to eight failures with the stage (guard, idle, deadline, gave up) that produced them, and the CMD12-before-reset path is asserted in source. The checker also rejects the four-second settle and the once-per-boot read give-up it replaces; the verifier asserts the card-busy and staged-read strings in the image.", "Round170 is the counter-lesson to r151's silence: a probe without a cap is its own blind spot. r169 read clean because the read fix worked, then said nothing else because one uncapped printf filled the panel with clover r153: check_np dyld_flags=0x0 -- a line with no pid, from a syscall every process calls several times, on a kernel that only names the exit reason of critical processes. The exec/exit pair added this round is the first reading that names the process, so a respawn loop and a merely slow boot stop sharing one photograph.", "Round171 is the frame where a driver reading named its own bug. r169's stage tags turned a wall of disk1: general error into eight lines that all say guard with st=00000000, which is a different failure from every read failure this project had chased: nothing on the wire went wrong, the caller simply never got the card. The paired reading -- tx_flush took 102001275 us and 120000602 us on disk5, against 22708252 us in the r168 frame -- shows the wait was the write-through policy r167 chose, and w=1024/1024 st=0x21 shows the batch criterion rejecting work it had itself delivered. Three of this round's four fixes therefore come from readings that already existed; the fourth (sizing the trust gate from the request) was found on the host, because raising kReadChunkBlocks would have silently disarmed the r167 gate that decides whether batch reads are trusted at all.", "Round172 makes the transport itself readable: dma up names the bounce's physical address, the capability word, the interrupt enable and the host-control byte the firmware left, dmacheck carries both paths' milliseconds and KB/s, and each DMA refusal prints one of at most eight CloverSdhci r172: dma path|slot|cmd|deadline|error|stop lba= blocks= st= err8= hctl= lines with the ADMA_ERROR byte, which is what distinguishes a table the host rejected from an address the bus rejected. A frame with dma up and no dmacheck is a boot whose multi-block command was never trusted; a frame with no dma up is a controller that refused the bounce.", "Round173 makes the write transport readable: wrcheck carries both runs' milliseconds and KB/s, control= and dma= say which of the two round trips completed, diff=/first= name the first mismatching word, w=/g= print the original bytes against the bytes read back, and st= prints both INT_STATUS words. A frame with no wrcheck line at all is a boot whose first multi-block write never happened; a frame with control=0 is the medium or the PIO path, not DMA.", "Round174 makes the frame survive the panel: read-clover-log.py decodes both windows, orders the kind-21 ring by the sequence stamp in header word 8 so a wrapped ring still reads oldest to newest, names a bad bytes-sum or a missing prefix instead of silently dropping the record, and carries a --selftest that round-trips the writer exact header layout -- which scripts/check-clover.py executes as a build gate. run-clover-unattended.sh now dd-s 128 sectors and prints the report window and the verdict ring as separate sections, so a missing verdict section means a boot that predates round174 rather than a decoder that stopped looking.", "Round175 gives the card the kernels own words, not just the drivers: read-clover-log.py attributes every kind-21 record to driver or kernel from the CloverSdhci line prefix, --tee and --driver select one producer each, the selftest now writes a ring that mixes both kinds and asserts the split, and check-clover.py executes that selftest as a build gate. The unattended summary reports how many ring entries came from the kernel log and warns when the ring armed but brought no kernel lines.", "Round176 makes the two producers readable as two facts rather than one merged stream: read-clover-log.py decodes kind 21 as the driver ring and kind 22 as the kernel ring, refuses a record whose kind does not match the ring it was read from (a driver line surfacing under --tee is reported, not printed as kernel text), keeps --driver as a filter over whichever ring is open, and its --selftest now builds both rings, asserts each rings single producer, asserts the kernel ring contains no driver line, asserts the adjacency arithmetic 64 + 2*64 = 192 and 192 + 2*512 = 1216, and still prints broken records with the mismatch named. run-clover-unattended.sh dumps 1216 sectors, decodes both windows under their own headings, counts each, and warns twice: armed tee with zero kernel lines, and any driver line inside the kernel ring -- which is the tee echoing itself and the one reading that invalidates the whole window.", "Round177 adds two host gates that check-clover.py executes rather than greps: normalize-kernel-macho.py --selftest replays 17 rules (convergence of two synthetic builds, idempotence, preserved length, the counted stamps, a non-object stab left alone, a version-3 UUID carrying the RFC 4122 variant, the KCID as the same digests tail, nothing outside the derived fields moving, and four refusals -- non-Mach-O, missing LC_UUID, no object stamps, truncated file), and check-cs-blob-structure.py --selftest replays 14 cs_validate_csblob rules before the same script is run against build/clover-root/launchd.macho and must accept it. The checker also asserts the normalizer sits between the patcher and the payload step in AGENTS.md. A round that forgets the step now fails a gate instead of quietly shipping a kernel no one can reproduce.", "Round178 adds one reading to the driver ring: CloverSdhci r178: read|write handoff lba= blocks= done= cuts= waits= worst= ms, at most four lines per boot and reported by the holder that cut, while round168 block guard waited stays as the once-per-boot longest wait. cuts= above zero is the proof the guard changed hands inside one transfer; worst= says what a waiter paid for it. Both go through sdhciSay, so neither depends on the panel scrolling past them.", "Round179 adds a diagnostic that never touches the device: scripts/audit-clover-mobile-graphics-legacy.py answers, from out/clover/kernel/kernel.macho alone, whether the display class the next round has to impersonate is the original one. The gate checks the audit's pinned constants and forbids it from claiming a runtime observation, because the four identity numbers it prints are inferred from the registration site, and the file where the meta class record lives is zero-filled until load.", "Round180 adds a third speaker to the kernel ring without adding a channel: the display probe's lines go through IOLog with the clover r180: stamp, which round176's allowlist already keeps, so read-clover-log.py --tee yields the phase-1 reading after one cold flash and one dd. Its verifier gained check_legacy_display, because from this round the claim 'the display stack is code' can only be checked in the payload -- six needles, three boot-arg gates, the r180 stamp and two probe format strings. The same round had to widen the round164 fingerprint from exact bytes to masked regexes: one byte in it was an ADRP page delta, and a kernel that grew by one page made a present patch read as absent.", "Round181 reports through the channel round176 built, not a new one: the driver runs last in sheng_pmgr_run() -- after clover_emmc_run() and ending in clover_emmc_flush_cache() -- so its 37 clover r181: lines reach the card-backed kernel ring (kind 22) before the boot continues, and the tee allowlist needed no change because the shared prefix clover r was already whitelisted (the per-driver round stamps may differ; the display probe still says clover r180). The readings are cut so a silence is never ambiguous: xfer ... NACK means somebody was asked and answered, xfer ... timeout means the byte count and the done bit disagreed, bring-up stopped at verdict= names the step that failed, and no address ACKed; rails unproven, sda= scl= status= op= says the bus was tried and which four words to read next. The driver never panics -- once the readings are the product, stopping the boot is losing them.", "Round182 makes two silences impossible to fake: check-clover.py binds 26 driver-header physical constants against 230 device-tree nodes -- which is how the six-digit kQupPhys got caught on the host instead of on the panel -- and scripts/test-clover-power.py, a pthread model of the SPMI arbiter, runs as a gate that check-clover.py executes, so a power report built on a window nobody declared cannot ship.", "Round183 teaches the checker three things at once. A wiring contract: the CloverDsp archive, its CONFIG_XNU_EXTRA_LD_ARCHIVES line, the clover-dsp argument (anything but 1, 2 or 3 is refused) and CONFIG_XNU_SHENG_PMGR have to name each other, and the PMGR tail order unattended-then-emmc-then-input-then-power-then-dsp is checked by position rather than by good intentions. A shape contract for a read-only instrument: the bounded walks stay bounded -- heap size against the TOC, entry.data + entry.size against smem.size, a non-power-of-two cacheline refused, the SMP2P magic/version/total_entries/pid identity checks, the end-marker comparison return at == end ? DS_OK : DS_E_CANARY, DS_E_RANGE -- and four forbidden symbols (windowWrite, ds_write, kSmp2pSet, IOMemoryDescriptor::withAddress) make the absence of a write path an assertion instead of a promise; parse_defines() also learned static const so the driver's own constants can be pinned by value, including the four magics in word form. And a second host model as a gate: scripts/test-clover-dsp.py compiles drivers/CloverDsp/tests/clover_dsp_host.cpp over a synthetic 128 KiB heap, runs 189 assertions and must exit zero, so a heap decoder that silently accepts a corrupt table cannot ship. The reader side did not move: the report travels on the kind-22 ring round176 built, through the tee's clover r allowlist, and read-clover-log.py --tee still needs one cold flash and one dd.", "Round184 makes the card the reading channel of record, for two reasons the round183 frame supplied: the panel is a printer that stops drawing when full, and a boot with no deadline never returns to fastboot for a host to read. So scripts/check-clover.py now requires clover-unattended= in board.toml's kernel_args, requires it to be a bare number and to sit between 60 and 1800 seconds -- the ceiling is what scripts/run-clover-unattended.sh's own WAIT can still catch -- and still refuses armcpu-clock-panic=, which measured the scheduler rather than the boot. The same checker pins the panic sink's exported signature and requires panicDrainRings () inside its body, because a drain hung outside the sink is a drain that never runs. read-clover-log.py and the 1216-sector dd are unchanged: the drain writes into the kind-21 and kind-22 rings the reader already walks.", "Round184's first flash attempt read nothing and the reason was on this side of the cable: --flash-cache flashed the payload and then went straight to recovery, so the image just written was never booted and the 1216 sectors on the card still belonged to the *previous* boot. The script now has --boot-after-flash -- reboot normally, let the firmware enter XNU, and wait for the board to come back to fastboot by itself, exiting 6 if it never does -- and it warns when a fresh flash is followed by an immediate read. The other half of the observation is recorded rather than fixed: after that run the tablet was absent from USB entirely (empty `fastboot devices` and `adb devices`, and scripts/check-clover.py's own host list shows only hubs, a microphone, a headphone adapter and a receiver), the three archived runs under ~/clover-out never got past `waiting for fastboot`, and no clover-logfs.bin has ever been produced here. So the card's write side is proven every frame and its read side is not proven yet on this host, which is why the drain line the round added prints what it wrote and what it dropped instead of assuming anyone will read it back.", "The retry of that run settled which half of the channel is actually missing, and it was not the half the previous paragraph blamed. TWRP was up the whole time: the board answered as adb state `recovery` (`81ffcaaa`, `ro.product.device=clover`, `ro.twrp.version=3.7.1_12-1-clover-th3fron3`) while `adb_serial()` matched only state `device`, so the 180 s wait was a false negative produced by this host, not a boot that never reached recovery. Two more host defects fell out of the same run: TWRP's adbd puts dd's own statistics on the same stream as the block data, so `adb exec-out dd` came back 622677 bytes instead of 622592 and no length check could be trusted until dd's stderr was redirected on the device side; and the file-level gate that required `UXNULOG1` at offset 0 asserted something a logfs window does not promise -- the report window appends, so slot 0 is only live on the boots whose cursor happened to land there. With those three fixed the read path works: one dd of /dev/block/mmcblk0p39 issued from this host returns the whole window and no stream noise. The script itself has not been re-run end-to-end since the fix -- the board left the USB bus minutes later and is not reachable again until it is put back into recovery by hand -- so what is proven here is the exact command the script now runs, not a clean exit of the script. What it returns is the finding. All 16384 sectors of that partition -- sysfs start 12320768, exactly kLogfsFirstLba -- are byte-identical to ~/clover-out/round127-logfs.img, with zero differing sectors, zero `UXNU` headers, zero record bodies and zero `CloverSdhci` prefixes anywhere in 8 MiB. Since the flash of 2026-10-26, no byte from CloverSdhci has reached this partition, in any boot, including the round174 verdict ring, the round176 kernel ring and the round184 panic drain. The cause is in this driver's own arming order: gVerdictFirst, gVerdictReady, gTeeReady and gPanicLogReady are set only on the branch that runs after the boot has *read an existing record* out of the report window (drivers/CloverSdhci/CloverSdhci.cpp:6110-6118, `logNewestFound20 == 0` takes the other way out), so a partition that stopped holding a record -- which is exactly what flashing an APFS container over logfs sector 0 did -- can never arm, never write, and so never regain the record its own arming needs. The channel is self-sealing, and no amount of reading can tell that from a card that simply had nothing to say, which is why the drain prints wrote=/dropped= instead of being believed. One alternative theory was tested and rejected on the same board: 4 KiB block addressing, which would have displaced every write by 8x, is not what happened -- the recovery-side queue reports logical 512, physical 512 and hw_sector_size 512, and `blockdev --getbsz` printing 4096 is Linux's buffer-cache block size, not the card's addressing unit. The round184 deadline itself did fire in the sense that the board stopped being reachable and restarted by itself a few minutes after the payload came up from cache, and it did not come back to fastboot: no `fastboot devices` row appeared while this host watched, and a board that has booted our kernel is invisible on USB anyway because the USB device mode in schedule item 5 does not exist -- so the IMEM-to-fastboot hand-off is still unproven on this unit rather than disproven.", "Round185 is the round that log channel stops being circular: the arming condition round174 recorded as the first thing to change is changed, and both host readers move with it. scripts/read-clover-log.py now defaults --first-lba to 13320216 and says so in its help text (a pre-round185 card has to be read with 12320768), its dump default is clover-log-window.bin, and --selftest is rebased on the new window; scripts/run-clover-unattended.sh tries bootdevice/by-name/logdump, then by-name/logdump, then mmcblk0p56 before falling back to logfs, still one dd of 1216 sectors with a 622592-byte length gate. What remained unproven was the driver half, and the flash this round shipped answered it: kind-21 slot 0 (lba 13320280, seq 0) carries the armed line verbatim -- first=13320216 sectors=131072 report=13320216 driver=13320280 kernel=13320408 -- so the round174 self-lock is broken and the card holds this project's records for the first time: 17 verdict-ring entries (r159 link, r167 readcheck diff=0/0 trusted=1, r172 dmacheck got=1024 kbs=2000/0 trusted=1, r173 wrcheck control=1 dma=1 diff=0/0 trusted=1, the r174/r175/r176 arming lines, two tee census rows, first DMA read and write) and 352 consecutive kernel-ring entries covering 8.66 s to 34.28 s. Two honest blind spots came with the same frame: the report window holds no kind-20 record -- the photographed userspace panic (boot task failure: required boot task executable not found) never reached the card, because clover_emmc_panic_append is the kernel panic exit and a boot-task failure exits by a different path (or after the capture window) -- and the kernel ring ends at 34.28 s mid-exec of pid=12 usermanagerd, before the photographed panic. The frame also carries the desktop-blocking readings: all three volumes mount, exec pid=1 comm=launchd is clean, the dyld shared cache maps with map2 <- err=0, the early boot tasks fsck, mount, seputil, mobile_obliterator, apfs_boot_util, MSUEarlyBootTask and cc_fips_test all exit rv=0, keybagd alone exits rv=0x4700, and one tee race artifact is visible (a msgbuf line copied while the kernel was still writing it interleaves (1) syscall-unix 55 into the keybagd exit row, and (apply-protobox) into its exec row), which says the tee's line boundary is not atomic under concurrency but does not change either reading.", "Round186 adds the reading the panel could not give: launchd compares a required boot task spawn result with 2 and panics with required boot task executable not found, and neither the console nor the card said which path it looked up or how far that lookup got. zzzz-clover-spawn-why.patch re-resolves the failing path one component at a time for pid 1 only, at most 24 times per site, printing err/n/path/stop/good/fs/on/mflags/retry, and the loader site prints its own line so a missing dyld is never read as a missing boot task; one retry of the whole path separates a sticky failure from a one-off. It prints only -- the errno returned to userland is untouched -- so check-clover.py asserts the patch deletes no source line, pins the nine shapes the probe depends on (including vnode_mount and the two format strings) and refuses the retired r185/r170 strings, while verify-clover-payload.py reads both encoded strings out of the shipped image.", "Round186 readings: the probe fired exactly once and on the benign path -- spawn-why err=2 n=1 path=/usr/appleinternal/sbin/launchd.development stop=/usr/appleinternal good=/usr fs=apfs on=/ mflags=14809021 retry=2 -- so the required-boot-task ENOENT the previous frame photographed did not happen this boot, and what launchd is waiting for is usermanagerd (pid 12: exec at 37.193360, open of the dyld shared cache at 37.233612, then no line for the remaining 34 s of the capture), not a boot task it could not find; keybagd was the only non-zero exit (rv=0x4700 = EX_OSERR 71) while fsck, mount, seputil, mobile_obliterator, apfs_boot_util, MSUEarlyBootTask and cc_fips_test all exited 0. That moves the round187 question from a missing file to the syscall or mach trap usermanagerd entered and never returned from.", "Round187 splits that question in two on purpose. A mach trap never reaches BSD code (handle_svc sends trap_no < 0 straight to mach_syscall), so a probe only in unix_syscall would report silence for half the surface and silence would be misread as no activity; the patch therefore calls clover_sys_why_mach() from sleh.c and keeps the body in systemcalls.c where p_comm is reachable. The filter is by comm rather than pid (pids drift per boot, and fsck/mount/seputil would flood a 512-line ring), and each line has a budget with a periodic heartbeat (512 entries, 128 failures, every 128th thereafter) so exhaustion of the probe is distinguishable from a hang. A unix-fail line is the other half of the judgement: a call that returned an errno and a call that never returned look identical from user space, and only that line separates them.", "Round187 readings: usermanagerd last entered write_nocancel on fd 1 (code 397) at 63.066398 with nothing after it and only a mach_msg2_trap before it, while keybagd entered reboot(2) at 48.875134, was denied with EPERM by Protobox's syscall filter and left through exit(71) -- its hard-coded fatal path, not a crash. The fail budget saturated at n=128 at 59.792130, so the last seconds of failures are missing by design.", "Round188 keeps the r187 prints untouched and adds three readings around them in zzzzz-clover-syswhy2.patch: unix-write prints fd, length and the first 64 bytes of the buffer, unix-path resolves the path behind every failing open/stat/access (openat reads x[1]), and unix-wrote prints the write return value. It is still log-only -- no return value and no errno changes -- and the checker now scopes its no-old-round-strings rule to added lines, because the r187 prints are the patch's context.", "Round189 keeps every r187 and r188 print and fixes three readings in zzzzz-clover-syswhy3.patch: open_dprotected_np takes its path from x[0] (r188 read x[1], its flags word 0x701, so all twelve err=2 path lines came out empty), every successful open now prints the descriptor it returned and its path, and sleh.c prints the mach trap's kern_return_t after mach_syscall() returns. Entry and fail budgets rise to 4096/256 with a 64-entry heartbeat because the r188 entry budget saturated at 67.190819 and left the last thirteen seconds unread; the tee per-pass push budget doubles to 16 because r188 throttled 694 of 1598 lines. Two build facts are now recorded rather than rediscovered: the LATE reverse list must take syswhy3 and syswhy2 together, since r189 edits lines r187 added and r187 stops being reversible the moment it is applied; and the kernel build compiles out/clover/tree/.cache/xnu-work, not ~/UniXNU/.cache/xnu-work, which is a separate clone of the same revision. Payload images are not byte-reproducible -- two builds of one kernel differ by the 64 random bytes of ADT /chosen/random-seed -- while the in-volume kernel is.", "Round190 answers the one call the r189 frame ends on. That frame's last line is fcntl(3, 0x55 = F_BARRIERFSYNC) at [112.438859], followed by 187 s of kernel-ring silence to the 300 s reset with no panic and no watchdog line; the 1020-byte session table had already been written (ret=1020 err=0) and fsync and renameatx_np had both returned, so the wall is the barrier or whatever follows it. A kernel-side printf alone cannot settle that: the tee only pumps msgbuf in guarded block-request tails, so a barrier that hangs leaves its own exit line in msgbuf waiting for a pump that never comes. Hence a two-sided bracket. zzzzz-clover-syswhy4.patch prints the exit of the five calls that can wait on storage (fcntl, fcntl_nocancel, fsync, fsync_nocancel, renameatx_np) with a 128-entry budget and the same 64-entry heartbeat, still log-only. The driver writes its own start to the card before the first CMD6: clover_emmc_flush_cache() calls sdhciSay with CloverSdhci r190: flush-in once the block guard is held and before switchExtCsd (kExtCsdCacheCtrl, 0), drains msgbuf and the verdict ring right there, and prints flush-out after the commit with both response/status words and the elapsed milliseconds; the guard wait it reports comes from the new gGuardLastWaitMs. CloverBlock::commitCache() adds sync-in, sync-out ok=0|1 and a one-shot sync pending=0, so a barrier with nothing to commit is a third state rather than an indistinguishable silence. The reading rule is what the frame is for: flush-in without flush-out names our own CMD6 or guard path, no flush-in at all puts the wall above the block layer, and a flush-out says the card took the commit. The build taught one lesson the hard way: a device patch must be copied into out/clover/tree/patches/xnu/ or the kernel is built without it and nothing says so -- the first r190 kernel shipped without the patch and only verify-clover-payload.py's barrier bracket assertion (unix-out ABSENT) caught it.", "Round191 turns the r190 frame's entry-without-exit into a five-stage reading and moves the wait off the card. That frame ends on CloverSdhci r190: flush-in flushes=0 on=1 size=65536 wait=0 ms followed by no flush-out, with the kernel ring left at CloverBlock r190: sync-in pending=144: the barrier did reach commitCache(), the guard wait was zero, and this boot's first commit of 144 dirty blocks never returned. The old shape explains the 187 s: after each switchExtCsd the driver called waitCardReady(), which polls CMD13 up to 100 times and each poll spins up to kCommandSpinLimit (1 << 22) reads of SDHCI_INT_STATUS, so a card busy writing its cache to media was asked a question instead of being watched. flushSettle() replaces that with the host's own SDHCI_PRESENT_STATE DATA_INHIBIT bit, bounded by EXT_CSD byte 246 (CACHE_FLUSH_TIMEOUT, 10 ms units) clamped to [1000, 180000] ms, and only then asks for status with a dozen CMD13s. Each of the five records is written and drained before its own step runs, so the next frame's last line is the step that stopped: flush-go (cf/bound/ps/inh), flush-c1, flush-w1 (ready/to/busy/polls/rsp/st/smp/mk/ps/ms), flush-c2, flush-w2. switchExtCsd gained a spins out-parameter so a command that never left (st=0 spins=<limit>) reads differently from a timeout or a CRC. Nothing outside the commit path changed; boot.img is byte-identical to round183-190 and the cold flash writes the cache partition only.", "Round192 reads that frame and stops committing rather than waiting harder. The r191 frame's only stage record is flush-go cf=0 bound=30000 ps=01f800f0 inh=0: the card declares no CACHE_FLUSH_TIMEOUT (cf=0, so the bound defaulted to 30 s), the host was not busy before the first CMD6 and DATA_INHIBIT was clear, so the card entered the commit command healthy and simply never answered it. The second and more binding finding is structural: every r191 stage record, flush-in/flush-out and the r184 panic drain all leave through flushVerdictRing() -> writePioBlock() to the same card, so a card holding DAT0 for the commit refuses the records that describe it -- that commit was unobservable as well as unbounded, and one more record inside it would only add a line that cannot land. The bring-up therefore no longer issues switchExtCsd (kExtCsdCacheCtrl, 1): cacheOn is now what the card itself reports (cacheSize != 0 && cacheCtrlBefore != 0), which on this card is ctrl=0/on=0, so the write path falls back to the write-through shape r159-r170 ran, where every chunk already waits for READY_FOR_DATA in TRAN and the 102 s/122 s measured in r170 was already being paid. F_BARRIERFSYNC now returns immediately, so a boot task that syncs stops being parked behind it. The r171 line still prints (it is the reading that will say ctrl=0 on=0) and the whole r191 flush body stays live for a card that ships with its cache on. The early return is no longer silent: CloverSdhci r192: commit skipped size=%u on=%u (once) separates a commit that had nothing to do from a flush path that went missing. check-clover.py asserts the enable block is gone, pins the new cacheOn expression and the skipped line, and requires that line to precede acquireBlockGuard so it cannot wait on the writer it exists to avoid; verify-clover-payload.py's new cache ownership reading asserts the r192, r171 and r191 strings are all in the shipped image.", "Round193 separates the two facts a watchdog death produces: the r170 line says the process died with ns=2/code=0x5, and the r193 line says which crash-behavior bits, fatal reason and deadline made proc_handle_critical_exit panic; a frame with the first and no second is a missing probe, not a missing crash.", "Round194 reads the r193 frame as two limits rather than a fault. The report window holds three records: a watchdogd exit and two 300.00 s deadline panics; the verdict ring is clean end to end (29 records, the last being r192 commit skipped size=131072 on=0); and the kernel ring's 2048 writes end at 312.89 s with launchd still reaping and exec'ing. The round answers the three questions that frame left open: whether the boot reaches the desktop if the deadline does not cut it (900 s), whether a deadline panic's own reset lands in fastboot (fb=, now drawn before the sink so the card carries it), and what the kernel said after its first hundred seconds (the probe cap). The host half is fixed in the same round: on this XBL fastboot reboot recovery is performed as an ordinary reboot and oem reboot-recovery is an unknown command, so scripts/run-clover-unattended.sh writes a 2048-byte Android BCB with command=boot-recovery to misc and reboots, which landed in TWRP in 14 s twice; a board that comes back to fastboot instead exits 4 and is reported, never retried.", "Round195 reads round194's frame as two failed readings rather than a failed round. The deadline itself held: slot 3 carries clover r148: unattended deadline 900 s with ticks=143722, and the host saw the board return to fastboot on its own. What the card did not carry was fb=, because PANIC_LOG_BYTES is 480 and that row is drawn after every other reading, so the reset's destination was still a panel-only fact; the record now gets it as its second line. The kernel ring covered 802.00-911.94 s with r155 292, r153 100 and r170-open 99, and the producers are fairplayd.A2's crash-respawn loop re-reading the dyld cache; 512 slots at about 4.6 lines per second is 110 s, so SpringBoard at 213.70 s and Early boot complete at 233.16 s were evicted. Read the next frame by fb= first, then by the ring's span and the first class its budget stopped.", "Round197 read the 238 s reset as one that never reached XNU's panic path: the panic window's newest record was still r196's 900 s deadline, misc read back zero because TWRP clears the BCB on entry, and APFS had run out of space at 214.668048 s on a 32 MiB Data seed. A BCB written only from the panic sink cannot cover a reset from the PMIC, the firmware or a user-space fault.", "Round198 writes the BCB at the end of the GPT walk in coldBringUp, where the log rings open and no block driver has published yet, and leaves the panic sink's call idempotent; the frame's verdict ring carries CloverSdhci r198: recovery BCB pre-armed rc=100 written=1 and the board reached TWRP on its own after the 900 s deadline. The Data seed is now 1 GiB and the frame has no ENOSPC line at all; the new wall is SpringBoard, which exits rv=0x5 ns=2 code=0x5 0.3-0.4 s after every exec (24 times in this frame) while watchdogd exits the same way.", "Round200 turns the visible trap address into a slide-independent identity. The same sleh.c path now prints a second line carrying the vm_map entry around the trap pc, the file offset (VME_OFFSET plus pc minus start), the eight instructions that lead into the brk and x0-x3/x8/x16/x17. The cold frame read 14 r200 lines paired one-for-one with the r199 lines: watchdogd foff 0xab0c across four different map bases with identical code, liveactivitiesd 0x5c6924f8, SpringBoard 0x3a17b2ec; all three stop on inter-function brk padding, and head= reads zero for the two shared-cache mappings, which is why it is only evidence on a standalone executable. The 900 s deadline, the fb=1 preface on every panic record, the self-written BCB that lands the board in TWRP and the 622592-byte window decode all still hold.", "Round201 reads the trap through the same build's dyld shared cache: foff is the shared-region offset (pc - 0x180000000), not a file offset, and cross-boot slide changes make it boot-specific. The eight code words self-certify the place in dyld_shared_cache_arm64.09, cache vmaddr 0x19f3df2ec, image FrontBoardServices, function 0x19f3dee70+0x47c; the fatal record's string is “failed to find the main CADisplay”, so SpringBoard's SIGTRAP is the absent display stack, not a wild jump. scripts/decode-clover-cache-offset.py resolves LC_FUNCTION_STARTS and the export trie in the .dyldlinkedit subcache and exits non-zero when the words do not match.", "Round212 makes the frame attributable before it makes it readable. A kind-24 counter at sector 1216 is read and incremented once per boot and copied into header word 9, --boot checks it and every printed record shows boot=; the panic window rotates by header word 8 instead of refusing when full; the drain says enter (panic_first, verdict, tee, append_rc, probe_seen) and exit (wrote, dropped, tee_passes, probe, probe_drop, probe_pend) even when the guard is unavailable; panicTailRead drops its gTeeReady gate, validates msgbuf itself and always says its status row over the whole buffer; and clover_emmc_probe_say() holds the kernel kill lines in a 32-slot x 256-byte RAM ring that the drain forwards as kind 25. This frame delivered the attribution but not the probe test: boot=1 everywhere it matters, a boot-0 r184 line that is provably a leftover, zero kind-25 rows because SpringBoard's last exec is [152.198182] and the backboardd kill (457 s in round210) never came -- the boot froze at 194.18 s first.", "Round216's boot-5 frame is the first one where the kill point lands without a self-inflicted panic: the report window carries only unattended-deadline records, the drain says enter boot=5 append_rc=113 probe_seen=8 and wrote=13 dropped=0 unseen=0, and all five sbthr rows reach the card. Every thread reads kin=2 kstk=0000000000000000 (states 1/65/65/1/1, wait channels non-zero except thread 2, mt=0 for all), so all kernel stacks were handed off and sbthk has no rows at all -- that half of round211 is structurally unavailable for continuation-parked threads, because machine_stack_handoff leaves kernel_stack at 0 until the thread is dispatched again. The rows also did not print at the kill: killsig/upc/skst are stamped 420.773441-420.773512 and the five sbthr rows at 460.217851-460.217993, 39.44 s later, with exit pid=27 at 460.301116, where round207's boot-3 frame had 197 ms between kill and exit. The only blocking point between skst and the first sbthr is task_lock(task) in clover_task_threads, and other kernel lines keep landing throughout that interval (430.4 s ubrk, 439.7 s r188 rows), so the console is not the delay: the target task's lock was held for the whole 39 s. The five saved user states are not SpringBoard's code either -- at slide 0 (this boot's r200 row reads map=1 start=0x180000000 end=0x20c000000) every pc/lr falls inside the extracted cache's read-only data mapping 0x1e638c000+0x531c000, so the walk read a task already in teardown. Round217 therefore stops blocking on task_lock in the signal path and samples before the kill.", "Round218's boot-7 frame names the killer and the wait. killsig lands at [536.991377] with upc=0x1d5dad100, which disassembles to ___kill+0x8, and ulr=0x100ce0144; with backboardd's slide of 0xC6E000 that LR is image offset 0x72144, the return from the second bl _kill inside 0x100072050 -- a loop that walks the captured system-shell set, logs Killing %{public}@. for each element and calls kill(pid,9). The function carries the BKSystemShellSentinel strings and is reached from a libdispatch block (all four killustk frames are libdispatch), so the killer is backboardd's system-shell watchdog, not a crash handler. exit pid=27 arrives at [560.121938], 23.1 s after the signal, where round217 saw 18 ms; the gap is unexplained but no longer blocks attribution. On the SpringBoard side the main thread (tid 0x104) sits in mach_msg2 (x16=-47) with fp chain f2/f3 at __BKSDisplayGetMainScreenInfo+0xa4 and _BKSDisplayServicesStart+0x78 through t=417..444, switches to dispatch-mach receive frames (cache 0x1d2f55f34/0x1d2f562dc) from t=481, and reaches mach_port_mod_refs (x16=-19) at t=536, 0.57 s before the kill; it never submits rendering.  The cache slide is proved for this boot at 0xa628000 by locating the r200 code= word pair in the extracted cache (SessionSyncEngine vmaddr 0x1c18f64f8) Round219's boot-8 frame finally reads the mach_msg2 descriptor, and corrects r219's own labels: with mach_traps.h's register order the main thread (tid 0x103) at t=412/420 is a 24-byte header-only MQ call (MACH64_SEND_MQ_CALL | SEND | RCV | RCV_SYNC_WAIT | SEND_SYNC_OVERRIDE | SEND_PROPAGATE_QOS) to remote name 0x3003 with reply 0xa03, voucher 0x1d03, msgh_id 0x5b9173 and a 68-byte receive buffer; the copied header agrees on bits, remote, local, voucher and id (its size field reads 0, which is the MQ call leaving the size in x2). By t=438 the same thread has moved to a receive-only 16 KB call (MACH64_SEND_MQ_CALL | RCV | RCV_LARGE | RCV_LARGE_IDENTITY | MSG_STRICT_REPLY | RCV_SYNC_WAIT) whose descriptor does not change through t=456, and the kernel kills it at 480.159684 with exit at 480.714504 (0.55 s, versus 23.1 s in round218); a second thread (0x2fd) is meanwhile sending a 100-byte complex kobject call to 0x203 with reply 0x2803 and msgh_id 0x12cb. So the display-services style RPC did return before 438 s, and SpringBoard was parked in a later receive when the watchdog fired, not stuck in the handshake. killsrc still lands at image offset 0x72144 (backboardd executable slide 0xF06000 this boot), and no SpringBoard thread ever creates an IOMobileFramebufferUserClient (clients remain pid 58/56/160 while backboardd presents three frames). The r170 t= field is clock_get_uptime ticks over 1e9, and this board ticks at 19.2 MHz, so t=9s is 480.7 s of uptime, not a contradiction with the sample window.", "Round220's boot-9 frame answers the question round219 could only name: who the blocked thread is waiting for. The main thread (tid 0x104) sends synchronous MQ calls to the same destination from 380 s on -- 24-byte header-only at 380 and 401 s with remote 0x3903, reply 0x903, msgh_id 0x5b9173, and a 204-byte call at 413 s with remote 0x807, reply 0x903 (same id class 0x400000cf) -- and ipc_object_translate's owner walk puts both remote ports on launchd (pid 1); the reply port 0x903 belongs to SpringBoard itself, and a 369 s sample still shows one call to runningboardd (pid 26). From 424 s the same thread is in a 16,384-byte receive-only call on 0x903 and does not move until the kill at [449.509949], exit at [449.514325] (4.4 ms later, against 23.1 s in round218); a second thread (0x30a) waits on a 20-byte receive on 0x1003. The receive buffer still carries remote name 0x5a03 whose owner no longer resolves, because the send-once right was consumed -- so the reply mechanism itself works. Client list stays pid 58/56/164 and backboardd presents three frames, so no SpringBoard thread ever creates an IOMobileFramebufferUserClient. The blocker is therefore a synchronous XPC to launchd that never returns, not a crash and not the display handshake; Round221's boot-10 frame names the blocked trap and reads the request body. The main thread (tid 0x102) shows the same pair at 390, 413 and 470 s: pc=0x1d1454b58, lr=0x1d1458224, with code words d65f03c0.928005f0.d4001001... -- a mach trap stub (ret / mov x16,#0x2f / svc #0x80), not a brk, so the foff/code path of decode-clover-cache-offset.py does not apply; a byte search over the 54 cache files finds the stub only in dyld_shared_cache_arm64.23 at unslid vm 0x1cb780b58, which fixes this boot's slide at 0x5CD4000. With that correction the PC is libsystem_kernel.dylib _mach_msg2_trap (+0x8, the ret after svc) and the LR is _mach_msg2_internal (+0x4c), so round220's libxpc attribution was wrong: the immediate caller is inside libsystem_kernel and the real caller is further up the untaken user stack. The 204-byte send at 413 s (remote 0x807 on launchd, reply 0x903) carries @CPX@|handle|instance, where @CPX@ is the XPC serialization marker; the 24-byte calls at 390/404 s and the 40-byte send by tid 0x466 at 470 s have no four-byte printable run. Every other sampled SpringBoard thread sits at ___workq_kernreturn+0x8, so only the main thread and one secondary thread are blocked in mach_msg2. The kill lands at [479.004840], exit at [479.093986] with rv=0x9; visible client rows are pid 56 and pid 168, and a sixth client appears only at 907 s (pid 87), so SpringBoard never opens one. poff is slide-inclusive (VME_OFFSET + pc - vme_start): feeding the runtime address to --addr resolves through the .25 mapping and misnames the image, so the slide has to be recovered from the code words first.", "Round222 named the blocked call: the SpringBoard main thread (tid 0x104) was sampled four times between 403 and 436 s with an identical six-frame user chain, _mach_msg_overwrite+0x1ec -> _mach_msg+0x14 -> libdispatch 0x18f56dd28+0x20c -> libdispatch 0x18f56e2a4+0x38 -> libxpc _xpc_connection_send_message_with_reply_sync+0x100 -> Foundation thunk 0x186e80d04+0xc, with slide 0xB5C0000 recovered from that boot's own code words; the thunk is a single tail call (bl 0x187548f50) into libxpc's synchronous send, so x30 returns to the thunk itself. At 395.171 s the thread sent a 24-byte empty-body synchronous request to launchd port 0x3f07 (msgh_id 0x5b9173, reply port 0xa03, 16 KiB), and from 403 s every sample is a pure receive (op=40700420e, b=0, sz=0, rn=a03, rs=4000) until backboardd killed it with SIGKILL at 446.42 s (spid 58) and it exited at 456.1 s with rv=0x9. No reply ever arrived. launchd did not respawn SpringBoard between 450 s and 912.9 s, while bluetoothd and fairplayd.A2 kept spawning and exiting in pairs every ~5 s. The neighbouring threads were notify_post (0x168), an XPC send (0x40f), a 36-byte logd send carrying h=13.0.1b03.0.0.2d52 (0x411) and __kernelrpc_mach_port_is_connection_for_service+0x80 (0x41c). Round223 therefore reads the kernel-side state of both ports (ip_messages, ip_msgcount, ip_waitq, ip_mscount, ip_srights, ip_receivers, ip_kobject) and dumps the first queued message header, to separate a reply that arrived but never woke the waiter from a reply launchd never sent.", "Round223's boot-12 frame answers r222's fork with the ports' own state and says launchd never replied. At 443.990512 s the main thread (tid 0x104) is still in the 24-byte synchronous send (op=400304003, rem=0x2e03 owned by launchd, loc=0x1d03, voucher 0xa03, id=0x5b9173), and both ports were read in the same millisecond: the launchd port holds two messages (ip_msgcount=2, qlimit=6, imq_seqno=0) with that request as the first queued kmsg (msgh_id 0x5b9173), while reply port 0x1d03 has ip_msgcount=0 and imq_seqno=20, so no reply is waiting and r222's a03 was the voucher, not the reply port. A second 204-byte request (id 0x400000cf, rem=0x807) went out at 464.500653 s and was also left queued (msgcount=1, seqno=1386). From 472.88 s the thread blocks in a pure receive on 0x1d03 with a 16 KiB buffer, while port 0x7a03 reads ip_msgcount=1, ip_receiver_name=0, ip_receivers=0, ip_kobject=0 and only 2 send rights: a 308-byte message stays queued on a port with no receiver. At 537.342943 s the request names port 0x6003, owned by lsd (ro=117:lsd) from 547 s; there the queue does drain (seqno 0 to 1) but the reply port still receives nothing through the last sample at 590.237788 s. The kill also slipped: r207 fired kill(9) at 498.928036 s with ns=-1, and SpringBoard exited only at 599.286642 s (rv=0x9, ns=2, code=0x9). The wakeup path is therefore not the fault: launchd did not consume its request, and the later lsd request was consumed without an answer. r224 must move the sampler to launchd (pid 1) and lsd.", "Round224 is the frame that retires r223's conclusion instead of confirming it: 60 samples of pid 1 between 431 and 911 s show four or five threads and none of them inside ipc_mqueue_receive -- one in _sigsuspend_nocancel, one or two in _semaphore_wait_trap with wait_event equal to the shared _semaphore_event sentinel, two or three in ___workq_kernreturn -- while the 204 B request's target port 807 reads cnt=0 seq=1372 rn=107 ms=1 sr=162 in the same millisecond the send is sampled, so launchd did take 1372 messages and dispatch workers receive on demand rather than parking a thread on the port. SpringBoard is the side that actually blocks: at 447.918 s and 469.247 s its main thread sits in ipc_mqueue_receive with one 308/272 B id=40000000 message on 7b03/1d07 and rn=0 ms=0 sr=2 rcv=0/0, then SIGKILL lands at 475.351 s and exit rv=0x9 at 475.482 s with no respawn before 912 s. The window holds no launchd-sent mach message at all because the r221 sender probe still samples only SpringBoard, which is the gap r225 closes; and a peer line is a torn snapshot on purpose -- task->lock does not protect thread fields -- so only a repeated pattern across beats counts as one fact.", "Round225 puts the sender on the record and retires the missing-reply theory: at 606.098539 s launchd's thread 0x482 sits in _mach_msg2_trap sending a 64-byte message (msgh_bits 0x00000012 = MOVE_SEND_ONCE, msgh_id 0x20000000) to a send-once right named 4c85f, and at 730.375394 s the same thread sends a 116-byte complex message (0x80000012, one descriptor) to a send-once right named 4744f; both bodies carry the xpc vocabulary the r221 string hunt found in libxpc.dylib -- CPX@, then error in the first and rec_execcnt and req_pid in the second. A send-once right has no send right to copy, so clover_sb_port_state's ipc_object_copyin(...MAKE_SEND...) returns kr=17 (KERN_INVALID_RIGHT) on both and that number says nothing about the port's health. The user stacks resolve to _mach_msg2_trap, _mach_msg and _mach_msg_overwrite once the walker's cache file offsets 626241b0 and 62623fb8 are rebased at 0x180000000 and slid by this boot's 0x16ae0000; the four deeper frames land in no cache mapping and are withheld. SpringBoard's reply port a03 is read eleven times between 422 and 491 s: cnt=0 ql=5 rn=a03 ms=1 sr=1 with seq rising 26 to 29 to 30, so replies do arrive and are taken at once, and the same window shows SpringBoard's main thread 0x104 in a MIG send+recv on rem=7c03/753b rn=a03 -- the launchd-does-not-reply conclusion of r223 and r224 does not hold on this boot. The process still dies: backboardd (spid=58) signals SIGKILL at 497.143890 s, the kill site reads upc 0x1e2625100 = ___kill+0x8 with instruction 0x540000e3 (svc), and ulr 0x10086a144 is not outside that range at all: backboardd's boot-14 slide is 0x7F8000, so ulr minus slide = 0x100071ee4, the return address of the second `bl _kill` (0x100071ee0) inside the Killing %@ helper that otool -tvV shows on the host, the same image-offset family as r218's 0x72144 batch-kill path; exit is at 497.336066 s with rv=0x9 and no respawn through 900 s. backboardd keeps presenting its own progress region (pixels=41586 box=305x887..755x1029, 2262414 of 2304000 pixels black, client pid 58) across the kill. Hex fields: sz=40 means 64 bytes and sz=74 means 116 bytes.", "Round226 (boot 15, payload 62f8d60c...) read the kill site from the killer's own registers: at 532.091901 s backboardd (spid 58) kills SpringBoard (pid 27) and kreg0 gives x0=0x1b (27), x1=0x9 (SIGKILL), x2=0x1, while kreg4 gives pc=0x1d2975100 (libsystem_kernel ___kill+0x8, the svc), lr=0x100763144, sp=0x16f70d860; kreg2 carries x20=0x1006f1000, backboardd's image base, so lr - x20 = 0x72144, the same Killing %@ helper return r218 found through a different slide, now with the pid argument confirmed in x0. kraw0/kraw1 hold the sixteen raw words under sp and are recorded untranslated. The reply port 5203 went seq=3 at 472 s to seq=11 at 480 s and then stayed cnt=0 ql=5 seq=11 rn=5203 ms=0 sr=0 through the kill at 532 s, while the r221 sender trace shows thread 0x104 issuing mach_msg2 with rem=5903 rn=1d03 at 480/508/525 s and the r223 queue on 5903 holding one 134-byte message (bits=0x20111211 id=0x40000000) nobody took: replies stop at 480 s and the process then sits on one wait. Exit is 532.120416 s with rv=0x9 and sbgone t=536 pid=27 is the death as a reading. The receive probe printed nothing because its 32-line budget is global and the kernel log tail only starts at 469.32 s, and because clover_sb_note_current latches the first SpringBoard task forever; r226 could not tell those two causes apart. Screen is still only backboardd's progress bar (frame#0..#3 pixels=41586 box=305x887..755x1029, client pid=58 presenting at 532.91 s).", "Round227 (built for boot 16) stops printing receives live: ipc_mqueue.c keeps the last 64 distinct blocking receives in a fixed kernel ring (port, port-set object, kind, message id, queue length, sequence, remote, local, voucher, size, body words), deduplicated on port/kind/count/sequence/id/size, and psignal_internal dumps the whole ring the moment SpringBoard is SIGKILLed, so flow before the log window can no longer be evicted by the ring buffer. clover_sb_note_current now follows a SpringBoard restart instead of latching the first task forever: it exchanges the pointer atomically, releases the old task reference, clears every per-generation sample field and prints sbtask gen= so each generation is visible. The driver gives the new class a 256-line tee budget, and both gates assert the ring, the dump and the generation line. Kernel 8fbd8b43cd6f431cde708f41afe93f47e05b43a771e192fdb407f771a4f52bcf, payload 56 MiB; device readings are pending boot 16.", "Round227-readback (boot 16): three SpringBoard generations. A was born stuck and SIGKILLed at ~614.7 s leaving no receive records (its rcvsum/rcv0..31/killsig/exit all fell outside the readable window that starts at 617.04 s). B=pid 27 received normally from 614 to 636 s (rcv32 t=614 tid=0x712 .. rcv63 t=636 tid=0x748, threads 0x712/0x722 as in r217), then sat in one wait for 15.5 s and was SIGKILLed by backboardd at 651.53 s (exit pid=27 rv=0x9); the boot-15 stall pattern reproduced. C=pid 229 latched at 653.24 s (sbtask gen=1 pid=229; gen=1 proves B was the first latch and A never entered a mach trap), was still alive and receiving at 906 s (sbm2 t=906 rem=6c03, sbport h=...40000000 - the boot-15 id=40000000 message is taken this time), yet produced no new UI frame (the r180 frame lines stop at 653.2 s, retire#4 done=4; the screen stayed on the backboardd progress bar client pid=58) and then the 900 s deadline panic at 912 s killed a potentially successful boot. Two instrumentation defects for r228: the one-shot dump guard was consumed by generation A so B's kill had no dump, and the dump reads the live ring while printing (rcv32 printed at 617.04 s, rcv63 at 649.46 s - 32 s for the tail; the 16 s gap at 620-636 s is printf slowness, with r217 samples, the watchdogd crash and the 4 s beats all normal in between).", "Round228 fixes both defects and buys generation C the time r227 proved it needed: the kill dump guard now records the victim pid (clover_r228_dumped_pid), so every SpringBoard generation dumps its own receive-ring window; each ring entry carries cre_pid/cre_gen stamped from task_pid(current_task()) and clover_sb_gen_read() at note time, so a reading names its generation instead of guessing; the dump copies the ring into a stack snapshot under hw_lock (two-argument macro - LCK_GRP_NULL) and prints from the copy, so printf slowness can no longer race the writer; and a compact rcdump summary plus the three newest rce lines go through clover_emmc_probe_say into the driver's 64-slot probe ring, the one path that reaches the card even when the msgbuf window is gone before the panic drain. The tee class becomes { \"clover r228: \", \"r228-rcv\", 480, 0, 0, 0 } (129 lines per dump x 3 generations = 387 <= 480) and every old r227 tag line moves to r228 so no unclassed line bypasses the budget. The unattended deadline moves 900 -> 1800 s (checker window 60..1800 inclusive) with host WAIT=2100 and LANDING_WAIT=2100, because generation C was alive, backboardd-presenting and healthy at 906 s when the deadline killed a potentially successful boot.", "Round228 on boot 17 paid for itself three times over: the kill of pid 27 at 497 s carried its own dump to the card through the driver probe ring (rcdump t=497 n=64 tot=660 plus three rce lines stamped pid=27 gen=0, the newest under a second before the kill); generation 2 (pid 213) lived from ~500 s to the last beat at 1771 s and its blocked send MOVED - the send to 115:lsd (nm=6003) got a reply somewhere between 1399 and 1522 s and the stall is now on 58:backboardd nm=3403 (sbport cnt=0 ql=6 seq=3 rn=2227 sr=1); and r180 painted past the 653 s ceiling for the first time - swap#4 accepted at 1468.3 s, copy#4 217 ms 9216000 bytes, retire#4 presented=4, then frame#4 t=1009s and frame#5 t=1019s both full-screen (pixels=2301667 box=0x0..1199x1919). What the round did not see is the 1482-1800 s screen census: the 512-line kernel ring spends about half its budget on noise (141 bare fl=0x14809021 vt=1 fs=apfs event lines, 97 r170 exit churn lines, 14 CoreAnalyticsHub nags). watchdogd exited at 987 s (rv=0x5 ns=2) and nobody killed pid 213 after that - the 1800.16 s deadline panic did (ticks=335739).", " Round229 keeps the deadline at 1800 s and cuts the two things that hid the answer last boot: the driver tee now drops the bare fl=0x14809021 vt= apfs event tails, keeps two lines per nagging producer and four r170 exit lines per command plus one tee filter count row at drain, and the kernel samples the receiver of the blocked send -- when the current sbm2 request owner parses as pid:backboardd it takes that task with lck_mtx_try_lock after SpringBoard own lock is already dropped, prints up to four threads as tid:state:wait_event:continuation:pc, and reads the same port object through the sender name with tag bb. The sampler caps itself at 24 firings, the row stays under the tee 320-byte record, and the new rows get their own probe class so the ring budget cannot starve them.", " Round229 boot 18 read the receiver and it answered: the sampled backboardd threads are all state=1|65 which is TH_WAIT and TH_WAIT|TH_WAIT_REPORT per bsd/kern/thread.h:479, their continuation is exactly _ipc_mqueue_receive_continue resolved with nm against this build's kernel, and their user pc is the same shared-cache _mach_msg2_trap stub the blocked SpringBoard thread sits in, while the send batch's own port reads cnt=0 -- so the message left the queue and backboardd is waiting on the next hop, which is what round230 reads. The tee filter returned fl=233 nag=3166 exit kept=20 dropped=225 and moved the ring start 901 -> 779 s, and the new first noise is CloverBlock r190 sync-in/sync-out at 241 of 504 lines. The screen answer to the round's open question is negative: one r180 client row at 1728 s and no swap or frame anywhere in 779-1812 s, so boot 17's two full-screen frames were backboardd's progress, not a stable state. The sampler's 24 firings are counted per beat, so the budget was spent by 787 s and only one row survived in the ring; round230 fires on a changed batch signature instead.", "Round230 was measured on boot 19: the ring starts at 648.6 s after the tee dropped 347 CloverBlock r190 sync lines (8+8 kept), and the backboardd firings show its in-flight threads are pure receivers (rem=0) rather than blocked senders. The hop row printed x3's local half, not the receive name -- in this ABI the receive name is x5's high half, as r221's rn field already showed -- so round231 prints x5 and x6. The destination port records imq_receiver_name=0x2e2b, imq_msgcount=0 and imq_seqno=3, so the message was enqueued, taken, and left no waiter on that queue at the sample. One backboardd thread and one SpringBoard thread sit in _ulock_wait_continue for the whole boot; round231 records the user lock address.", "Round231 was measured on boot 20: the hop names now come from x5's high half and all 63 rows are receives (rem=0) on three names (0x7f03, 0x790f, 0x6c03). ipc_object_translate returns KERN_INVALID_RIGHT (kr=17) for every one of them, so those names carry neither a SEND nor a RECEIVE right: they are port sets or dead names, not ports, and the hop has no next port object to name. The sampler stopped at 1195 s because clover_bb_sample is still called inside the npick > 0 && m2sig-changed branch (kern/task.c:11386), so once SpringBoard generation 1 stopped changing its in-flight batch no further bb rows were printed even though the ring reaches 1813 s. The two persistent waiters sit in _ulock_wait_continue on user locks 0x105d8f0f4 and 0x16f6dd720 (x0=0x1000001, UL_COMPARE_AND_WAIT|ULF_NO_ERRNO); the other st=1 rows are idle _workq_unpark_continue threads. SpringBoard's destination port nm=4103 reports cnt=0 seq=3 rn=0x147bb wq=0 in all three samples at 1445/1567/1699 s, so the receiver that took the message waits on the port set; round232 must translate with MACH_PORT_RIGHT_PORT_SET and walk the members. The screen has one r180 client row at 1385.96 s and no swap or frame anywhere in 730.5-1813.0 s; the 1800 s deadline panicked with a user-mode elr and ticks=344872, boot 20.", "Round232 (boot 21) read the port sets open: the independent 20 s beat covered 727-1760 s (18 beats, f=8..25), and every hop name (4a03, 7803, 6c03) translated as MACH_PORT_RIGHT_PORT_SET with member tables printed each beat (45 rows). Only member a003 moved (seqno 49 to 56 between 1395 and 1517 s); 635f stayed at 52 and every member of 4a03 reported 0:0. The blocked destination 5e03 is a plain port owned by backboardd (o=0xfffffff8743a6ce0, receive name 3e2b, cnt=0, seq=3) and is not among the eight visible members of any set, but 4a03 reports all=11 and 7803 all=9, so three and one members were hidden by the print cap and round233 must print them all and mark the object match. SpringBoard thread 0x910 carries x16=-47 and op=0x40700420e, which decodes as receive-only plus STRICT_REPLY|RCV_SYNC_WAIT with rcv_name 1e03 and expected port 5e03, so it waits for a reply to the request it sent to 5e03 rather than blocking in a send; the fourth hop signature (tid 0x33c, op 0x500040011, rem=e747, id=0x30000000) is the only sender, and thread 0x3be waits on the user lock 0x100b90194. The kernel ring ends at 1763.1 s, 37 s before the deadline; boot 21 has no kind-20 panic record and misc block 1 is empty, so the landing came from the r198 pre-armed recovery BCB and the deadline record is missing for the first time, which round233 must answer with a beat that does not depend on any task entering mach_msg2.", "Round233 (boot 22) shows the new speakers alive and the channel itself as the limit: the beat thread fired at 808 s with rep=4e0f (a send-once right already dead, kr=15), the member dump printed 8 of the 11 members of set 5903 with all eight at cnt=0 seq=0 (receive names listed, owners 58:backboardd+ps and 58:backboardd), the lock words 0, 0x4203, 0x7d0fd50 and 0xffffff00 all resolved to ow=0x0, and sampling kept running to t=1764 (r232 bbset 44 rows) through a wall of 1768.883 s. Three defects are visible in that frame, not in the device: the r233-bb probe class budget of 256 lines was exhausted by 808 s (census seen=3187 kept=736 throttled=45 lap=2; r229-bb 64 and r231-bb 192 were already capped at 1249 s and 1127 s, while r232-set's 128 was never reached); the t=783 fire printed eight per-fire rows before the member rows, so with kTeePushPerPass = 16 (CloverSdhci.cpp:559) exactly the first eight member rows fit and i=8..10 went into gTeeThrottled (+3 of the 45); and clover_bb_lock_word reads the raw ulock value, while XNU's own ulock_owner_value_to_port_name() calls ipc_entry_name_mask() (bsd/sys/ulock.h:43, osfmk/ipc/ipc_entry.c:812), which ORs 0x03 into the low gen byte, so 0x4202 is port 0x4203 and the lock is not unowned -- the conversion was skipped, not the lock. The last slot of the ring is torn mid-write (newline missing), and boot 22 again has no kind-20 record and an empty misc block 1.", "Round234 (boot 23) closed the owner column and then cut its own boot short: every bblock row reads own=1777dc3/ffffff03 ow=0x0, which is ipc_entry_name_mask() resolving 0x4202 to port 0x4203 exactly as ulock_owner_value_to_port_name() does, and an unresolved owner is a dead thread port (port_name_to_thread refuses stale thread-control names on purpose, so the waiter gets EOWNERDEAD) -- the column was a closed door by design, not an arithmetic bug. The probe then hit the ipc_space.h:173 assert inside ipc_entry_lookup because clover_port_recv_task() looked up a receive name in a task whose space ipc_space_terminate() had already cleared (fairplayd's crash loop), so the reading became the boot's last line at 753 s. The lesson is the same shape as r151's: a sampler that dereferences other tasks must guard is_active(space) under the space read lock, and r235 adds exactly that guard (the fixed tree holds only one ipc_entry_lookup call site, so the guard is complete).", "Round235 (boot 24) removed the assert and the sampler lived to 1789.6 s, which makes the frame a finished reading and two of its answers negative. The 11 members of set o=fffffff59bd739d0 are 5803/5903/5a03/4803/10013/15403/d70b/d40b/7e03/4a17/1103 and the blocked destination 4c03 is none of them; 4c03 reads cnt=0 ql=6 seq=3 rn=2b2b wq=0, the same shape as 5e03 on boot 21 and 4503 on boot 20, so the request was delivered and taken and the reply is absent rather than queued on a port no visible set serves. SpringBoard (pid 247) is not blocked in its send: tid 0x952 is receive-only with STRICT_REPLY rem=4c03 rn=a03 rs=4000, while tid 0x1364 sends 40 bytes (bits=0x1513, remote 203, local 1640b) to a path whose seq is 130. backboardd is not kernel-blocked either: its main thread 0x42d sits in _ulock_wait_continue with UL_COMPARE_AND_WAIT on user lock 0x101691604 expecting 0, a userspace condition nobody signals, and its receivers wait on 7f03/6103/8203/4507. The boot's own defect is on the deadline side and it is new: boot 24 has no kind-20 record, no drain enter line, an empty misc block 1, and the TWRP landing proves only that round198 pre-armed the BCB, while the driver ring carries six dma deadline / read gave up / card recover sequences near the end -- so the panic sink failed silently exactly where the card was busy, and the deadline fact needs a path that does not pass through the panic screen.", "r236's three knives all landed on boot 25. The deadline record in flight slot 60 reads fired after 1800 s at t=1800760 ms ps=0x01e800f6 ticks=313678 cnt0=0xef30b36 cnt1=0x81ae42466 freq=19200000 elapsed=1800.005s: the timer IRQ wrote its own block before panic() on the forced path that needs neither gFlightArmed nor a ready card, and the twelve entries immediately before it (fairplay pid 429, ps=0x01f800f0) each finished in 1-2 ms, so the card was healthy at the deadline and boot 24's silence was not a card fault.", "Round 236's panic markers bracket the sink: stage0 t=1800925 rc=0 and stage1 t=1800932 rc=113 (=100+slot 13) with log_ready=1 host=0x3b2cc log_first=13320216 drained=0 boot=25 gates=0x7; slot 13 is report lba 13320242, so the panic text reached the card for the first time, and drained=0 is expected because the stage-1 marker precedes panicDrainRings(). The drain then entered with append_rc=113 and exited wrote=24 dropped=0 unseen=0 tee_passes=8 probe=19.", "The flight clock is not the kernel clock: flightCounterMs(gFlightStart) starts when the driver arms, so the deadline's 1800.760 s sits about 12.1 s behind the kernel msgbuf's 1812.9 s; the 512-row ring window is 1008.2-1812.9 s, and the beats at 1782/1786/1794/1798 s read miss=163/164 stuck=8 recov=8 stage=idle.", "Round 236's user-stack capture is the first statement about what backboardd waits on that does not pass through the kernel: 112 bbustk rows over 33 sample times (1003-1753 s, 53 tids), with main thread 0x42f sampled 31 times and byte-identical every time (sp=1701eb810 fp=1701eb830 lr=1922f8a80 fn=6 1922f8e40 1006963e4 192355c9c 192356cc0 1922fe3f8 1922fee74); the other 81 rows are idle workqueue threads at __pthread_wqthread+0x168.", "Register evidence at that wait: pc=1ce526bdc = libsystem_kernel ___ulock_wait+0x8, x0=0x1000001 (UL_COMPARE_AND_WAIT|ULF_NO_ERRNO), x1=0x100c8f0d4, x2=0 (expected), x3=0 (forever), and the bblock word is still 0, so nothing has signalled the object since the wait began.", "Host symbolization for boot 25: the shared-cache slide is 0x2da0000, found by enumerating slide candidates while preserving each anchor's in-page offset and validated by BL/BLR pairing (score 6.25, no coincidental candidate); the chain resolves to libdispatch 0x18f558a4c+0x34 (___ulock_wait stub at 0x18f558a7c), 0x18f558e0c+0x34, the invoke thunks 0x18f5b5c84+0x18 and 0x18f5b6cb0+0x10, and the main-queue drain 0x18f55e138+0x2c0, with a tail call at 0x18f558824 explaining the absent frame. backboardd's own slide is 0x666000 (r218 killsrc ulr 0x1006d8144 minus image offset 0x72144), which puts the block frame at image offset 0x303e4.", "The ulock address is a heap object, not a static __DATA slot: x1=0x100c8f0d4 is object+0x34, so the dispatch object header is at 0x100c8f0a0, and boot 24's 0x101691604 differs by 0xa02530, which is not a page multiple and cannot map to one image offset under any page-aligned slide. backboardd's main thread is therefore inside a block in its own executable, waiting forever on a heap dispatch object whose value word remains 0, while its four port-set receivers and 81 idle workqueue threads are healthy.", "Parked for r237: libdispatch local names (the 685,817,856-byte .symbols subcache carries a dyld_v1 arm64 header, mappingCount 1 at 16 KiB, and no image table; the host has no dsc_extractor, ipsw or capstone), the backboardd block symbol (rootfs is encrypted, only the 0x303e4 offset exists), and whether ___ulock_wake ever targets that word.", "Round 237's ulock table read back as 48 rows over six beats (1062-1733 s): eight addresses, no overflow line, every return code 0 and every blocked wait woken. The busiest is 0x1f7e51580 with w=b=k=s=7 at op 0x1000002; 0x16ff6f720 reads w=2 b=2 k=1 s=1 at op 0x1000001; the other six each read one. Fifteen waits in the whole window is consistent with libdispatch parking rarely, but the address the stack waits on (0x15dd8f944) never appears, so the table proves the recorded waits are healthy, not that the stuck wait was recorded.", "The absence has two allowed explanations and the code distinguishes neither: clover_ulock_dump prints only the first eight non-empty slots, and the four hooks drop any wait whose pid is not clover_bb_target_pid, which stays 0 until the SpringBoard sampler first sees a message addressed to '<pid>:backboardd' (first such sample near t=1007 in boot 26). The bbobj row already shows the wait at t=1012, so a wait that began before the latch is the more likely loss.", "Boot 26's object header is the same on all nine samples (t=1012 to 1753): tid=0x461, a=0x15dd8f944, base=0x15dd8f910, isa=0x1f7e54bf0, val=0x100000002, w=0. Subtracting the shared-cache slide 0x3610000 for boot 26 puts isa at 0x1f4844bf0 inside the same high cache mapping where image_for_vmaddr returns no image, and the +0x34 wait word is still zero. The other 17 bbobj rows are false positives on non-lock words.", "The ten-frame stack, sampled 109 times with tid=0x461 byte-identical every time, resolves through cache slide 0x3610000 and backboardd slide 0xeaa000 to the ___ulock_wait stub 0x18f558a7c (+0x34), 0x18f558e0c+0x34, backboardd image offset 0x303e4, the BLR x8/x1 thunks 0x18f5b5c84+0x18 and 0x18f5b6cb0+0x10, the drain 0x18f55e138+0x2c0, 0x18f55ecf8+0x17c, 0x18f568698+0xfc and 0x18f567f14+0x194, and finally libsystem_pthread __pthread_wqthread+0x11c and _start_wqthread+0x8. This corrects boot 25's reading: the waiter is a libdispatch workqueue thread, not the main thread; the 0x303e4 block is entered through the continuation machinery and waits inside the block.", "SpringBoard is still queued at the deadline: the last sbm2 at t=1788 shows the send to 58:backboardd with rem=5603, and bbset at t=1801 reads eleven queued messages with the newest sequence 0x985. Boot 26 ran to the 1800 s deadline (last kernel line 1801.604) and the panic path's BCB took, but the boot-26 kind-20 record did not reach the report window.", "Round 238 (boot 27) moved the filter into sys_ulock.c and matched the waiting process by name: the stuck address 0x101691ce4 is in the table from t=464 with w=1 b=1 k=0 s=0 wr=0 sw=0 op=1000001 and cw=0 on all six beats, and the final counters read seen=5181 filt=4966 stored=163 over=52 open=1 -- 4966 waits belonged to other processes, 215 belonged to backboardd, 163 were stored and 52 were dropped by the twelve-slot cap. r237's absence was the pid latch plus the eight-row print, not a missing wait.", "Round 238 also identified the object and the blocked code path on the host. The wait word is object+0x34 = dg_gen, the isa 0x1f9748bf0 minus boot 27's cache slide 0x4f04000 is 0x1F4844BF0 = OS_dispatch_group, and the +8 word 0x100000002 is the refcount pair rather than dg_state. One enter, zero leaves and zero wakes mean the group count never reached zero in-process. backboardd image offset 0x303e4 is the return address of 0x1000303e0 bl _dispatch_group_wait inside a block at 0x1000303c4 whose x19 is the block, [block+0x20] is the captured self (BKButtonHapticsController), [self+0x20] is _homeButtonDefinition and [definition+0x38] is a dispatch group waited on forever; the block is built at 0x10002fef4 in IMP 0x10002fe4c, which also holds the cmp x22,#2 BSPlatform query that decides whether the block runs at all. 0x10002fe4c's selector and the definition's +0x38 ivar name are still unknown because the rootfs is encrypted and the relative method-list name offsets did not resolve.", "Round 239 (boot 28) confirmed the host-proven chain on the device, field by field, and then found the fix in the reference port instead of a kernel knife. The stuck group reads b=fffffffd g=0 cnt=1 wait=1 notif=0 (one enter, zero leaves, generation never advanced), exactly the libdispatch-1477 prediction; the bbchain row found the block through the waiter's own frames (fi=0 fn=10), and inv=0x100ccc3c4 minus this boot's backboardd slide 0xC9C000 is 0x1000303c4, the host-proven invoke body, with [block+0x20]=controller and [controller+0x38]=the waited group. The group isa 0x213770bf0 minus cache slide 0x1EF2C000 is 0x1F4844BF0 = OS_dispatch_group, the same class as boot 27. The decisive comparison is with ~/UniXNU-sheng, which boots the same iPadOS 17.7.11 image to a full idle desktop and has no backboardd stall in its record: sheng's ADT publishes a buttons node with home-button-type=2 and button-names hold/voldown/volup (no menu/home entry). Disassembling backboardd 0x2fe8c fixes the branch direction: cmp x22,#2 then b.ne 0x2fedc, so homeButtonType==2 falls through, logs 'not configuring SSHB because we don't have a real home button' and returns without building the 0x303c4 waiting block; only !=2 dispatches it. clover's ADT publishes product-name/model=iPad7,1 but no buttons node, so iOS takes the iPad7,1 (J120AP, home-button) default and stalls. The Mi Pad 4 has no Apple SSHB haptics home button either, so r240 mirrors sheng's buttons node (home-button-type=2) -- a truthful device description that removes the cause, rather than faking a dispatch-group leave in the kernel.", "Round 240 (boot 29) proved the buttons node alone does not clear the stall: with /buttons/home-button-type=2 present and asserted, the deadlock returned byte-identical -- the stuck group still reads b=fffffffd g=0 cnt=1 wait=1 (one enter, zero leaves) and bbchain still resolves inv=0x1000303c4 to the host-proven SSHB haptics block through this boot's backboardd slide. So BSPlatform.homeButtonType did not become 2 from /buttons. The mandated sheng comparison found the real source: MobileGestalt derives the home-button answer from the /product node, not /buttons, and clover's /product said Mi Pad 4 LTE / iPad7,1 -- a real iPad WITH a mechanical home button -- while sheng's --ipad-identity /product describes a home-button-less iPad Pro (12.9-inch) (2nd generation) (artwork-device-subtype 2732, compatible-device-fallback iPad6,7, thin-bezel 1), which is the configuration that boots this same image to the desktop. r241 mirrors that whole /product block.", "Round 241 mirrors sheng's full home-button-less iPad Pro /product identity in scripts/make-clover-adt.py (product-name/product-description iPad Pro (12.9-inch) (2nd generation), artwork-device-idiom pad, artwork-device-subtype 2732, artwork-scale-factor 2, artwork-display-gamut sRGB, compatible-device-fallback iPad6,7, thin-bezel 1), keeping the r240 buttons node and the r239 group/chain probes so the next frame reads whether the wait is gone. check-clover.py gained /product assertions and both payload-title assertions moved to clover r241; the ADT grew 13792->14140 bytes (+348 = the product fields) and verify-clover-payload.py exits 0 with the r239 bbgrp/bbchain/bbnochain markers retained. Device reading is boot 30, pending.", "Round 241 (boot 30) proved the /product identity alone does not clear the stall either: with both /buttons/home-button-type=2 and sheng's full home-button-less iPad Pro /product published, backboardd still dispatched the SSHB haptics block and the bbgrp rows still read b=fffffffd g=0 cnt=1 wait=1 every beat, with the bbchain block->self->group pointers unchanged and no UI progress past the r180 client#6 frame. Two single-node hypotheses are now disproven on the device; since r205's /chosen/display-scale demonstrably reaches userland, the ADT is read -- what was wrong was the claim about which gestalt inputs feed BSPlatform.homeButtonType.", "Round 242 mirrors the two remaining gestalt inputs clover lacked versus sheng: the root target-type J120 (IODTPlatformExpert publishes hw.target from it, and libMobileGestalt reads hw.product/hw.target together for the device identity) and the /chosen dev-fused security tuple (certificate-production-status=0, effective-production-status-ap=0, certificate-security-mode=1, effective-security-mode-sep=1, MobileGestalt's security status that routes mobileactivationd to its native Hactivation branch). check-clover.py pins both plus the r240/r241 nodes, so a regression to a partial identity fails the gate. Device reading is boot 31, pending. If boot 31 still stalls, the next step is host disassembly of -[BSPlatform homeButtonType] from ~/clover-out/dyld-cache to pin the real value path before touching the ADT again.", "Round 242 (boot 31) proved the whole identity does not move the wait either: bbgrp still reads b=fffffffd g=0 cnt=1 wait=1 on every beat, and bbchain's inv minus the boot's backboardd slide is still the invoke body the host proved. Three node-set hypotheses are now dead on the device -- boot 29 buttons-only, boot 30 product-only, boot 31 whole-identity. Per the pre-declared fallback the ADT gets no more guesses, and host disassembly of the extracted shared cache pinned the getter: -[BSPlatform homeButtonType] (BaseBoard IMP 0x18f6eeecc, once token 0x1f48945f0, stack block invoke 0x18f6fe3a0 -- the 28-character name length matches the block symbol exactly) computes MGGetSInt32Answer of the obfuscated question JwLB44/jEB8aFDpXQ16Tuw with default 0, and libMobileGestalt's handler for it (0x1a0207a38 in subcache .11, CFSTR home-button-type at 0x1e7c9c530) resolves IORegistryEntryFromPath of IODeviceTree:/buttons and copies that property -- so r240's node was the right target all along, and the one thing never observed is whether the kernel publishes that path into the plane. Split-cache forensics note: mapping entries are 32 bytes (<QQQII>), and chained pointers store the full slid VM address in their low 36 bits.", "Round 243 adds no ADT change; it adds a reading. IOStartIOKit.cpp gains clover_iodt_census(secs), one-shot behind a static guard, called at the tail of the proven backboardd sampler: it walks the IODeviceTree plane two levels deep printing every node name, then repeats MobileGestalt's own four lookups -- /buttons with the home-button-type OSData length and u32, /product, /chosen with display-scale as the positive control r205 already proved readable, and the plane root's target-type -- as clover r243: lines under tee class r243 (budget 64, one-shot so it cannot crowd the beat rows). check-clover.py pins the census needles and the once guard; verify-clover-payload.py asserts census/census-nodes/census-hbt/census-buttons in the image. If /buttons is missing from the plane while the ADT bytes carry it, the break is plane publication and the fix belongs to the kernel, modelled on sheng's proven tree; if it is present with home-button-type=2 and the wait still stands, the disassembled getter chain is re-opened instead.", "Round 243 (boot 32) proved the census runs and proved the ring rotates it away: the drained window covers only the last ~771 s of the 512-record msgbuf, the one-shot printed on the first full beat (~t=500), and the bbgrp/bbchain rows of the same call confirm the sampler reached the tail -- so the reading existed and arrived unseen. The deadlock itself is unchanged (SpringBoard pid 27 killed by backboardd again, r180 shows a fresh framebuffer client). Round 244 moves the trigger, not the instrument: clover_iodt_census returns before the latch while secs < 1500, so the one shot fires inside the window the panic drain reads back.", "Round 244 stacks one patch (zzzzzzzzzzzzzzzzzzzzzzzzzzz-clover-r244.patch, 29 z, LATE head) editing only the census body r243 added; check-clover.py pins the gate string and that the gate sits ahead of the latch (an early beat consuming the one shot would return to invisible); the printed rows keep the clover r243: prefix so the tee class and verifier strings stay as shipped.", "Round262 shipped the unfiltered census and it earned its keep in both directions: it killed a branch (no backboardd thread is parked in a driver call) and it exposed two limits of the instrument, recorded with the reading rather than next round -- the cap was hit on every beat (threads=17 shown=14, so some threads were never said), and a continuation cannot distinguish an idle receiver from a reply waiter. It also caught a misreading before it shipped: r238's w/b/k/s are cumulative counters (waits/blocked/woken/wakes in the patch's own struct), so the row w=14 b=14 k=14 s=15 is a hot uncontended lock in the shared cache, not fourteen threads piled on one lock. r263 raises the cap to 20, prints the hidden count, and adds the deadline and the port owner.", "Round263 found the field the census reads was invented: this XNU's struct thread has no block_deadline (the compile says so), and the timed wait really lives in thread->wait_timer -- waitq.c:1391 arms it with timer_call_enter_with_leeway, thread.h:762-764 carry the pointer plus wait_timer_armed, and timer_call.h:73 is the absolute tc_soft_deadline. dl= therefore prints seconds left (0 = no timer armed, so an untimed wait), converted with the same absolutetime_to_nanoseconds the sample already uses so a row and its t= share one clock. Lesson: an instrument's field names come from this kernel's headers, not from another port's memory.", "Round263 shipped dl=/peer= and boot 50 answered with both a result and an instrument defect: all 43 census rows have dl=0, so no thread in the task armed a wait timer -- there is no timed wait anywhere in backboardd -- while peer= carries no information because the row took x[6] as a send-right name. This kernel's own decoder (osfmk/ipc/mach_msg.c:934 with struct mach_msg2_trap_args, osfmk/mach/mach_traps.h:465) packs x3 low32 = msgh_remote_port (the send right), x3 high32 = msgh_local_port, x5 high32 = rcv_name, x6 = rcv_size_and_priority, x7 = timeout. Read correctly, 27 of the 43 rows sit in the trap and exactly one holds a send right at all (tid 0x40c, remote 0xcb03 awaiting a reply on rcv 0xf007, in four consecutive beats); the rest have MACH_PORT_NULL as remote, so they wait to be messaged rather than awaiting a reply, and 0x40c is the only outstanding request in the process. That is the second occurrence of the same class of mistake -- r220 already logged 'Round219 read these words one register off' (task.c:12541) -- so a register convention goes back to this kernel's source before it becomes an instrument, and a field that cannot resolve must not be printed in the same shape as a field that is absent.", "boot 51 (round264-payload.img, image e0384cac) is the first frame in this port that names a debtor outside the waiting process: the census row tid=43d remote=6b0f rcv=c903 mc=0 sr=1 dl=0 to=0 repeats at t=1308/1434/1571/1694, and peer= resolves to pid 140 with comm com.apple.datam... -- XNU stores only MAXCOMLEN 16 bytes, so the truncation is the kernel's, not the instrument's, and the only matching image path is the datamigrator XPC service under DataMigration.framework (no datam* label among the 523 LaunchDaemons plists, so it is launched on demand). Header counters moved as predicted: rx=10/10/9 receivers with remote==0, tm=0 timed waits again. Read sr=1 as the kernel's own held reply right for an in-flight MACH_SEND_REPLY message, not as third-party capacity; the load-bearing pair is mc=0 (no reply) with dl=0/to=0 (never expires)." , "r266 SHIPS THE IDENTITY FIELD (v0.6.45, 41-z patch on top of r265): boot 52 proved the debtor waits on kernel events, and the peer row could not describe them because it carried no wait_event -- a port wait has rcv=/remote= as identity, an EVFILT_WORKLOOP note and a mach semaphore have only we=. The row gains we=/pc=, and one user stack per distinct continuation (CLOVER_BB_STACKS 3, deduped by continuation so three slots buy three different kinds of sleep rather than three idle workers) is walked with the peer pmap AFTER the task lock is dropped, which check-clover.py pins by comparing the two offsets in the patch. New tee class r266-stack at 64 lines. Artifacts: kernel f88fba8c, image 8ecee77c, boot 53 in flight.", "boot 54 = round267-payload.img (kernel aff36458, amfi 276383e7 with the two sites moved to file 0x1acb0e4/0x1acb16c as task.c grew, normalized 239778e4, image 2da88dcc, 58720256 B) landed with 37 wait-owner rows in the window and collapsed the debtor's stall to one thread: tid 0x34b/0x34c/0x3ee/0x5eb/0x784 of pid 138 all report hint=0x10 ak=1 owner=tid 0x34d with the same ctx=0x100f0c840, and ctx is kqwl_dynamicid, so five equal values mean one workloop and one owner -- boot 53's five distinct we= were the five per-caller knotes of that one workloop, not five locks. 0x34d sleeps on a real mach semaphore: its row reads cont=fffffff0072c26c8 and we=fffffff00700620c, which are this build's own _semaphore_wait_continue and _semaphore_event (nm -n on mach.development.bcm2837.unstripped.noctf), and SEMAPHORE_EVENT is CAST_EVENT64_T(&semaphore_event) at sync_sema.c:61, with dl=0. Two readings had to be narrowed against source before publishing: kdp_sema_find_owner's owner is pid_from_task(sem->owner) and create_semaphore writes s->owner = task (sync_sema.c:128, commented task that owns semaphore), so owner=pid 138 names the creating task and NOT anyone who owes a signal; and kdp_ulock_find_owner leaves owner=0 by design for the UL_COMPARE_AND_WAIT* opcodes, so backboardd's tid 0x413 hint=0xa owner=0 ctx=1018798d4 says only that the wait carries no owner field, not that a holder vanished. The kernel also permutes its own addresses: VM_KERNEL_UNSLIDE_OR_PERM adds the per-boot vm_kernel_addrperm for anything outside the slid text (mach/vm_param.h:403-407), which is why that semaphore's ctx prints as c00b39f54ef961b -- a stable identity within the boot, not a readable address, and not a bad pointer (this board's nm finds no KASSAN symbol at all).",
"boot 55 = round268-payload.img (kernel 3b448a83, amfi e4da3453 -> normalized f66aa037, image f2db2cf2) lands r268's three-way split on its middle branch: the debtor (pid 142, com.apple.datam-, 8 threads, wait=8 run=0) parks tid 0x36c on count=-1 srights=1 otype=0 -- one waiter queued and exactly one send right left in the whole system, and otype=0 is IOT_PORT (osfmk/ipc/ipc_object.h:185), not an unknown type. Somebody can signal it and has not: neither a structural dead wait nor a wrong-moment read.",
"the same row's receiver=- is my field choice failing again, not the kernel refusing: a semaphore's port is made by convert_semaphore_to_port with IPC_KOBJECT_ALLOC_NONE (\"just make the naked port\", osfmk/kern/ipc_kobject.h:234), so a send-only port has no receiver space at all and ip_receiver is legitimately zero. That is the fourth time I carried the previous round's identity field onto a different wait object after writing the lesson down following boot 52.",
"the tree already had the correct lock order and I did not use it: task.c:11200 clover_port_recv_task does is_read_lock -> is_active -> ipc_entry_lookup -> io_lock(obj) -> ip_get_receiver() under the port lock. ip_get_receiver asserts ip_mq_lock_held (osfmk/ipc/ipc_port.h:528-532) -- not the io_lock_held my r268 comment claimed -- and the checker ban on the call form '= ip_get_receiver(' was written for that wrong reason, so it forbids the only safe use while the raw field read this round shipped is unsafe in general: for a port not in a space that same slot holds ip_destination, a different object type. boot 55 read zero and got away with it.",
"the flash test exposed an instrument-channel defect of its own: with the board sitting in TWRP, run-clover-unattended.sh's 'an adb device is already up' shortcut set SKIP_RECOVERY=1, which is also the gate on the --flash-cache block -- so the run flashed nothing, decoded the window the PREVIOUS payload's boot had left (boot 54), and exited 0 with every number real and none of it this round's. A declared flash now hops recovery -> fastboot first, and the card's own boot counter, read while recovery is still up, must have moved before a window is called a result (exit 6 otherwise); check-clover.py pins the hop, the read and the refusal, and boot 55's run prints 'the boot count moved: 54 -> 55'.",
"host symbolization of the r266 user frames works, and the sentence I shipped an hour earlier saying it cannot was wrong: the cache headers' region table is UNSLID while the board prints slid runtime addresses, and pc - poff = 0x180000000 is the identity VME_OFFSET + (pc - vme_start) collapses to, not a measurement of slide=0. scripts/decode-clover-slide.py now recovers the slide from the card: the eight instruction words of a clover r221: sbm2x row are byte-searched through the extracted subcaches, each hit yields one candidate slide, and a candidate that is not page aligned is impossible because one byte of the cache cannot be mapped twice -- boot 55 rejects 0x2f44ff80 (from .13) and keeps 0xd100000 (from .23), which all four sbm2x rows agree on. Two of my own bugs also had to die first: image headers were scanned one per 0x1000 when the cache packs them every 32 bytes (825 images found instead of 5000+, and most frames read as 'in no image'), and N_STAB was written as 0x0E when the stab mask is 0xE0 and N_SECT is 0x0E, which skipped every defined symbol so no name ever printed. With those fixed, boot 55 says: the run-loop thread is _mach_msg2_internal/_mach_msg_overwrite/_mach_msg under CoreFoundation's _CFRunLoopRunSpecific under libxpc -- it is waiting for an XPC reply; tid 0x36c, the semaphore waiter and workloop owner, sits entirely inside /usr/lib/system/libdispatch.dylib (a dispatch_semaphore taken by datamigrator's own code); and tid 0x36d, a workloop waiter, runs through /System/Library/PrivateFrameworks/DataMigration.framework (+0x1838) into libxpc twice. The frames at 0x1009... are the main executable's own mapping, which needs a separate slide the card does not currently print.",
"Round269 reads the semaphore's port under io_lock() with ip_in_a_space()/ip_get_receiver(), which replaces round268's unlocked field read: for a port that is not in any space the same slot aliases ip_destination, so the raw read can hand back a pointer that is not an ipc_space at all and the is_task dereference after it is a panic. boot 55's empty receiver= also has a reason now: ipc_kobject_alloc_port() puts every kernel-object port in ipc_space_kernel, and ipc_space_create_special() (osfmk/ipc/ipc_init.c:159) never sets that space's is_task, so a mach semaphore has no receiving process to name, ever -- the row prints kspace instead of a blank.",
"Round269 asks who holds the send right through the kernel's own reverse lookup, ipc_hash_lookup() (osfmk/ipc/ipc_hash.h:80), not a table scan: the per-space hash maps object to name and, per its own comment at ipc_hash.c:139, only pure send rights are entered there (receive, send-once, port-set and dead-name are not), so a hit is a task that can signal the semaphore while a scan would also name the receiver. Each lookup runs under is_read_lock plus an SMR section, after the peer task lock is dropped, once per census through a latch, over pids 1..400 with probed= and scanned= printed.",
"Round269's first draft was self-certified clean by a syntax check that printed only the first forty diagnostics of task.c -- whose thousand pre-existing -Wcast-function-type-strict warnings occupy them all -- so five real errors nearly shipped: proc_rele undeclared (a hard error in this C dialect), proc_find/proc_task used from an out-of-scope declaration (implicit int return would truncate the pointer), and two subscripts of the incomplete struct ipc_entry_table. scripts/check-clover-xnu-syntax.py replaces that harness: it runs the compile_commands.json flags verbatim, never truncates errors, treats implicit-declaration, incomplete-type and out-of-scope as hard, and takes its exit code from the compiler.",
"boot 56 answered the sender-right question on all four census fires: `clover r269: srhost t=1793 pid=139 tid=370 port=fffffff4b364b880 hit=139 name=2d23 type=10000 scanned=77 probed=77` -- the one send right in the system is held by the debtor's OWN task, and scanned==probed==77 shows every live process was looked at rather than stopped at the cap. `receiver=kspace` confirmed the ipc_space_kernel reading. So the desktop stall is a deadlock inside com.apple.datamigrator itself (threads=8 wait=8 run=0: one thread on a mach semaphore, five libdispatch workloop workers whose r267 owner is that same thread, one mach_msg receiver, one parked workqueue), while backboardd's tid=49c waits on an XPC reply to remote=cb07 whose queue reads mc=0. Nothing external can break that cycle, and rendering is nowhere in it -- CPU-first stands.",
"boot 57 answered the IPI question in the negative and moved the problem: over four census fires (t=1338..1723) armcpu_ipi_sent and armcpu_ipi_interrupts are both zero, so the scheduler never once asked for a cross-CPU wake-up; meanwhile armcpu_core_timer reads 224585,0,0,0,0,0,0,0 -> 291290,0,0,0,0,0,0,0, i.e. seven of the eight cores the ADT declares take no architectural timer interrupt at all. Read next to boot 56's datamigrator (8 threads, none runnable, a dispatched block that never runs), the shape is 'the scheduler believes cores exist that never come back', which also retires the row-269 note that sheng's sheng-smp=1 was just a vendor switch: it is the one SMP-related difference, and our own porting record already admits 'the online-CPU count has not been measured'.",
    "boot 57 reproduced boot 56 rather than merely agreeing with it: the debtor pid moved 139 -> 142 with the boot while the semaphore (count=-1, srights=1, receiver=kspace) and its self-held send right (hit=the same pid, scanned=probed=77) did not, and its own census line reads `threads=8 shown=8 hidden=0 wait=8 run=0` -- an in-process deadlock in com.apple.datamigrator seen twice is a property of this port, not of one lucky boot. The same frame refuted r270: sent=0 recv=0 over four fires, so no cross-CPU wake-up was ever requested, and the per-core timer tally is 224585,0,0,0,0,0,0,0 -> 291290,0,0,0,0,0,0,0, which is the board saying seven of the eight cores it was told about never take a tick. What neither reading can separate is 'cores exist and are idle' from 'cores were never registered', because a board delivers an interrupt to a cpu the kernel never started; r271 measures that directly.",
    "boot 58 answered r271 in the hardest branch available: three census fires read `clover r271: cpu t=1339 real=1 max=8 reg=1 start=0 run=1 s=00000000 r=10000000 tm=223730,0,0,0,0,0,0,0` (247650 at t=1479, 292260 at t=1733). reg=1 is a strong reading, not a weak one -- CpuDataEntries[i].cpu_data_vaddr is written only by cpu_data_register() when that core itself comes up (arm_init.c:456 fills the boot slot), and this tree has no pass that pre-allocates a slot per device-tree cpu -- so no second cpu ever entered the kernel; real_ncpus=1 and MAX_CPUS=8 means the ADT's eight cores are a declaration, not an online count. start=0 must not be read as 'no cpu is running': the boot cpu never goes through processor_start(), and run=1 with r=10000000 and tm=223730 is the positive reading that the one cpu is alive. The two instruments also agree exactly -- the kernel's own cpu_stat.timer_cnt[0] equals the driver's armcpu_core_timer[0] at each fire and all seven other slots are zero on both sides -- so r270's sent=0 and this reg=1 are two faces of one fact: a single-cpu machine never needs a cross-cpu wake-up. That closes the SMP branch for this bug without overstating it: the debtor (pid 146) reads threads=8/9 wait=8/9 run=0 and its one send right is still inside its own task (hit=146 name=3903 scanned=78 probed=78), so seven more cores would not signal it either; the desktop question goes back to the workloop's own wl_request event, while multi-core itself stays open as a fidelity gap.",
    "r272 was planned as a measurement and turned into a host-side proof first, and the proof is stronger than expected in one place and weaker in another. Stronger: the shipped prelinked image (nm over out/clover/kernel/kernel.macho) has **no AppleARMSMP symbols**, because iokit/conf/files.arm64:7 lists AppleARMSMP.cpp as `optional iokitcpp` and this build does not enable it -- so the only processor_start() callers left are AppleARMSMP.cpp:232/515 (absent) and IOCPU.cpp:311, which is why reg=1 needs no guesswork. Weaker: my first write-up said an attempt would end at IOPMGR.cpp:45 panic(\"enableCPUCore is unimplemented\"); that is not this board's story -- drivers/CloverPMGR/CloverPMGR.cpp:104-112 already overrides every cpu-power hook with unimplemented(168..176) and unimplemented() panics \"CloverPMGR: unimplemented power operation %u\", so an attempt that reached the hook would have rebooted the board long before 1800 s. Boot 58 not panicking therefore says 'the hook was never called' -- an inference from absence. r272's tee token is what turns it into a measurement of the caller: cpu_start() in osfmk/arm64/cpu.c:909 prints, processor_should_kprintf (processor.c:1081) only silences CLPC transitions, and the allowlist gate (teeLineMatches) runs before the class table, so a class without its token admits nothing -- which is exactly what check-clover.py now pins, along with \"no r272 patch file may exist\".",
    "boot 59 spent a boot to measure \"did the kernel try to start a secondary cpu\" and the honest answer is that the instrument cannot see the moment it asks about: cpu_start() printed 0 lines, but the window on the card spans t=1273..1814 while that line could only exist before t=10 s, so the ring had already overwritten it. Nor is there a positive control: the two non-clover lines in the window arrived through their own paths -- CloverSdhci.cpp:3788 sets kTeeNagToken = handleNagTimerExpiry, and the Sandbox line matched only because teeTokensMatch searches anywhere in the line and apfs is allowlisted -- so the frame cannot even prove the token is live. Sixth recurrence of the \"instrument cannot see what it asks about\" family and the first one caused by the ring horizon rather than a budget. The census rows themselves repeated boot 58 exactly (real=1 max=8 reg=1 start=0 run=1, kernel timer count equal to the driver tally at every fire), so the single-core fact is now three boots deep; what remains unmeasured is the attempt, and measuring it requires a counter printed late rather than a line printed early.",
    "Round273 shipped as v0.6.62 and its first lesson is about headers, not waitloops: reading struct kqworkloop from osfmk/kern/task.c is not possible, because an osfmk translation unit includes <sys/eventvar.h> from EXPORT_HDRS, where the BSD_KERNEL_PRIVATE half (workq_threadreq_s, workq_tr_state_t, the WORKQ_TR_STATE_* names) has been stripped -- scripts/check-clover-xnu-syntax.py proved it with ten 'unknown type name' errors pointing into build/xnu/ios-obj/EXPORT_HDRS/bsd/sys/eventvar.h plus 'use of undeclared identifier WORKQ_TR_STATE_BINDING' at task.c:12033, before anything was flashed. The shape that works is the one the kernel already uses for this same question: the read goes into bsd/kern/kern_event.c (line 2661, next to kdp_workloop_sync_wait_find_owner, and walking the same kn -> knote_get_kq() -> KQ_WORKLOOP -> kqwl_request path) while task.c passes the wait-event word and takes back an indexed uint64 array, exactly as it already does for the kdp_*_find_owner calls. Because that contract is positional, check-clover.py now pins both index tables (CLOVER_WL_* and CLOVER_WL_OUT_*) item by item and forbids bsd-private member accesses on the task.c side -- a comment may name a type, code may not hold one. Second lesson, applied before the fact this time: the peer row gained wl=<count of workloop waiters in this fire> as a built-in positive control, because a workloop wait is one of several shapes the debtor's threads have been seen in, and 'no r273 row' is a reading only when the header says wl=0 -- r272's ring-horizon failure must not be repeatable by accident.",
    "Self-correction shipped as v0.6.63, and it is about my own citation habits rather than the board: while writing round273 I cited a second r272 flight ('boot 60', the debtor's threads moved from hint=10 to hint=2) into four documents -- board.toml's title, the development log, README and porting.toml. After v0.6.62 went out, that reading's artifact was gone: ~/UniXNU/out/clover/flights/ holds only the boot-59 set (window dump, .pre-flash, .txt), no *boot60* file exists anywhere on the machine, and no remaining file carries a 'boot 60' slot marker, so the claim could not be re-verified even though I had read it once. A reading that no durable artifact carries is not a reading, so all four citations are removed here; the wl= positive control stays, because its own reason never depended on that claim (an instrument must separate 'no waiters' from 'instrument silent'). New rule for the next round: before citing a boot, name the file in out/clover/flights that still proves it, and correct shipped prose by shipping a new version instead of rewriting published history.",
    "Round273's own reading (card boot 60, artifact out/clover/flights/boot61-r273.txt) landed on the middle of the three pre-declared branches and killed the other two: all five workloop waiters (tids 360/361/388/49a/823) report the same kq=fffffff7c46b8d00 and dyn=10170c840 with kqpid=141, so 'five workers sleep on one loop inside their own process' is now a measurement, not an inference; tr=5 is WORKQ_TR_STATE_BOUND with tt=35f, so the workqueue DID hand over a servicer (the thread-count-limit branch is dead), and ow=0 means kqwl_owner was empty -- which retroactively explains boot 59's owner=3b7: r267 reached it through the bound-request-thread branch, not through a thread servicing the loop. kc=0 says no events are queued, so the fault is 'the thread that took the work cannot leave', not 'work arrived and nobody picked it up'. Thread 0x35f is the same fire's semaphore waiter (hint=6, count=-1, srights=1, hit=141 name=3d1b) and its user stack, at this boot's slide 0x16700000, is libdispatch all the way down except frames 1..4, which are datamigrator's own main image (0x101177d50/0x1011799fc/0x10117a1a0/0x1011743d0): the workloop handed its servicer thread to the process's own code and that code is doing a blocking dispatch_semaphore_wait inside it. The wl= positive control paid for itself immediately -- the first fire printed wl=5 but only 2 rows, the other three lost to the per-pass push cap -- so 'rows < wl' is now read as a tee drop, never as a fact.",
    "Round274 shipped as v0.6.65 (kernel normalized 62a9eb3f, image bc04e7f2) with one question, and one method item. The method item is how the patch is now made: the generator replays round273's task.c hunk onto the round271 file and refuses to emit the patch unless the result is byte-identical to the tree before round274's own edits, then re-applies round274 and compares against the tree again -- a chain check in both directions, because 'this patch applies' alone cannot tell a new round from a duplicate of an old one. The other half is a cost judgement: naming the debtor's four main-image frames from the host alone is possible in principle (require bl at frame-4 for all four addresses and the candidate-slide band collapses to about the size of __text, 64 KiB here), and I started writing that tool. It is not cheaper than the measurement -- round274 is one printf of the first four map entries, already validated by the same lock the census holds -- so the host side stays a cross-check and the board number is the reading. My half-written script tripped on the section_64 layout twice (offset lives at +48 and entries stride 72, not +64/80), which is the same mistake family as guessing an ABI: if a structure is not read through the tree's own definition, it gets misread.",  "r274 read back on boot 61 (artifact out/clover/flights/boot62-r274.txt): the board-reported base (`e0=100a09000-100a29000`, 128 KiB = __TEXT's own size) and the host's brute-forced slide are the same number, and datamigrator's four main-image frames unslide to identical addresses on both boots, so the naming is not a one-boot artifact. scripts/clover-name-main-image.py (LC_FUNCTION_STARTS boundaries plus __stubs/__objc_stubs resolved through bind and selref entries, because `nm` reports no symbols) reads them as: a 32-byte function that takes `-sema` and calls dispatch_semaphore_wait(sem, DISPATCH_TIME_FOREVER); its caller does alloc/init, setDelegate:, activate and then -waitUntilPreboardDidFinishUnlock; that caller is reached from -_unlockKeyBagUseOfForceIsAuthorized; and the five parked workloop waiters are inside -migrateCheckingNecessity:...:migrationResultHandler: -> -startMigrationAndOrBlockIfNecessaryWithClientInvocation:buildVersion:migrationStarterBlock: -> dispatch_sync. The debtor's block is therefore a device-unlock wait, and this board's r252 ledger already shows PreBoard asking for IODeviceTree:/arm-io/sep and missing it. My stated expectation that e0 would be __PAGEZERO was wrong -- e0 is __TEXT -- which does not affect the use, since the base is what was wanted.",  "r275 shipped as a precondition measurement, not a fix (v0.6.67, image 6c241bac, normalized kernel f9a9fb63): the only proposed repair for the unlock wait is sheng's owned keystore, whose guard publishes it only when the AppleKeyStore *metaclass* is absent -- a precondition never read on this board, which links the stock kernelcache and carries the class strings. Patch z*49-clover-r275.patch touches one file, iokit/Kernel/IOStartIOKit.cpp, inside the gIOServicePlane walk clover_iodt_census already runs (no second iterator: two whole-plane walks would take the registry lock twice for one question), and prints three rows -- the two metaclass lookups, one row per service whose name contains KeyStore with its own class beside it, and a tally repeating walked=/stopped= so that a zero is only a zero after a finished walk. The tee gains class r275-aks (64) *and* the r275 exemption from the sixteen-push per-pass cap, because these rows ride the r243 census burst that boot 36 measured as already spent: a truncated keystore row reads exactly like an empty plane, which is r272's false negative again, and check-clover.py now pins both halves. The PreBoard census planned in the same note as r275 did not ship and is deferred: it only matters on the class=1 branch. Housekeeping that turned out to be a real defect: the LATE_PATCH list in build-xnu-4k-baseline.sh had two lines starting with `for LATE_PATCH in`, so the second was a continuation whose words (`for`, `LATE_PATCH`, `in`) were silently tried as patch paths every build; it is one loop again and the checker asserts the count.",  "r275 read back on boot 62 (artifact out/clover/flights/boot63-r275.bin.txt): sheng's precondition is measured, not assumed -- `clover r275: aks class=0 userclient_class=0` and `aks walked=127 stopped=0 keystore_services=0`, both metaclass lookups absent, the walk finished well inside kCloverSvcCap, and the plane holds no keystore-named service, so the guarded publish in the upstream driver is legal here. The same window still points at the same blockage: the debtor is pid 137 with e0=100d8a000 (128 KiB = __TEXT, same shape as boot 61) on two beats, seventeen r273 workloop rows, and r252 line 27 is still PreBoard asking for IODeviceTree:/arm-io/sep and missing it. Instrument defect found in my own needle and fixed before the port: the driver names its service 'Native keystore state service' (lowercase keystore, NativeKeyStoreEvents.cpp:145) while clover_name_has matched the case-sensitive substring 'KeyStore', so a successful publish would have kept reading keystore_services=0 -- the same family of instrument that cannot see the thing it asks about, this time inverted. r276 matches names case-insensitively and also matches the class symbol, so any instance of AppleKeyStore appears whatever it is called, and the class row's own 0 -> 1 transition is the positive control for the port.",  "r276 ships the keystore that r275 measured as absent, and fixes its own needle in the same pass. Three objects join libNativeLegacyDisplay.late.a through the existing display builder: the vendored drivers/NativeKeyStoreEvents/NativeKeyStoreEvents.cpp byte-identical to ~/UniXNU/drivers (check-clover.py diffs the two; its upstream host test test_closed_boundary.py passes here unchanged, so the closed boundary is gated on the host), package/CloverKeyStoreProbe.cpp supplying the six C symbols the driver links against behind offline-key-events=1 and clover-aks=1, and the census patch z*50-clover-r276.patch which prints the publish's own state because this board has CONFIG_XNU_BOOT_PROGRESS=n and the probe runs at bsd_autoconf, twenty minutes before the ring the panic drain can reach. The board arg is renamed where renaming is legal: sheng-aks is read by the board's own probe, so clover may spell it clover-aks without touching vendored bytes, which is the exact test that keeps sheng-touch-hid spelled as it is. A real bug the archive contract caught rather than the linker: clover_keystore_probe() was defined outside the extern \"C\" block, mangled, and the build said 'defined by no archive member' instead of failing in the link fifteen minutes later. A second silent defect in the same build chain, found the hard way: the LATE reversal list in build-xnu-4k-baseline.sh had this round's head entry written as a bare filename without its $ROOT/patches/xnu/ prefix, and because the loop only reverses a patch whose 'apply --reverse --check' succeeds, a path it cannot find is skipped without a word -- so the newest patch was never reversed while its neighbours were, and three kernel builds died in bsd_init.c, a file this patch does not touch. check-clover.py now parses the loop itself and requires every entry to carry the prefix, to exist on disk, and the list to be at least forty entries long; the guard was positively controlled by putting the bare name back and watching the checker exit 1 naming it. And the honest non-claim: r252's missing=IOService:/IOResources/AppleKeyStore row is a path lookup while the driver registers under the name 'Native keystore state service', so that row may survive this round and only class-matched callers (libaks, MobileKeyBag) find the service; written into board.toml before the flash so a still-present absence is not misread as a failed port.",  "r276 shipped the keystore and boot 63 could not say whether it worked: the census printed nothing at all (26 r243 rows in boot 62 became 0), the kernel log stops at 1499.386105 -- one second before the census' own `secs < 1500` gate -- and the card carries no panic-window record for boot 63 either. Never-called, died-mid-walk and printed-but-never-carried are the same shape on the card because every census row reaches it through the msgbuf tee, which is allowed sixteen block writes per pass and was already running seconds behind. One reading from that boot does stand, and it has an in-run positive control: inside the same for-loop that still printed 49 `clover r267: own` rows and 14 `clover r273: wl` rows at t=1237/1361/1487, the semaphore branch went from 3 rows and 1 hint=6 rows in boot 62 (whose nearest beat is t=1368) to 0 and 0 -- so `dispatch_semaphore_wait(..., FOREVER)`, the wait that r274 named as -waitUntilPreboardDidFinishUnlock, is not present in boot 63's three recorded beats, while the workloop stall (same kq=fffffff27da80100, tr=5 tc=0 tt=37c, ow=0, five waiters) is unchanged. Round277 changes what is measured not at all and how it is seen entirely: the census now announces enter, a bounded waiting heartbeat, progress every thirty-second service, the walk's end and the aks reading on r212's driver probe relay -- a 64-slot ring sequenced and boot-stamped, which does not ride the kernel log. No second keystore knob, no third registry iterator, and the payload pins the four relay literals by their whole format strings.",  "Round277 shipped an instrument no boot has yet been alive long enough to exercise: boot 64's carried log ends at 726.799008 s, six hundred seconds before the census gate, so its relay rows are absent for a reason that says nothing about the relay. The control settles what the two short boots mean. Reflashing round-275's archived payload (boot 65) ran to 1813.708278 s, printed 26 r243 census rows and wrote a panic-window record for itself, while both keystore boots (63 at 1499.386105 s, 64 at 726.799008 s) stopped with no census row and no panic record -- and the control shows MORE whole-card recoveries (9) than either of them (7/7), so the eMMC is not the variable and the port is. That makes the regression mine, and round278 bisects it with one position-pinned gate: clover-aks-nosvc=1 registers the AppleKeyStore metaclasses and returns before allocating the service, so aks class= should still read 1 (that row asks OSMetaClass, not the registry) with stage=2, service=0 and ks_classes=0. A boot that reaches the deadline then means a service userland can open ends the board; a boot that still stops means the linked code or the offline-key-events=1 argument does, before anything is published. The gate is a bisect and comes out next round either way. Also logged against myself: a whole-file regex with re.S replaced 2333 lines of board.toml including kernel_args, caught within seconds by check-clover.py's KeyError and reverted -- a title that long is a line, and is edited as one.",
    "Round278 read (boot 66, artifact ~/clover-out/round278-v0.6.72-payload.img sha e343f3db) settled the bisect: registering the AppleKeyStore metaclasses while withholding the service lived to the 1800 s deadline with the whole census printed -- enter secs=1543, walking 32/64/96, svc-walk end visited=127 stopped=0 classes=0, done nodes=9, and aks class=1 userclient_class=1 beside stage=2 service=0 ks_names=0 ks_classes=0 -- while both boots that published the service stopped at 1499.386 s and 726 s with no census row and no deadline record. The early end therefore tracks the published service, not the linked code, not the boot argument and not the card: the control boot showed MORE card recoveries (9 against 7/7). Two of my own readings were retracted in the same pass -- boot 63 had no r252 ledger rows at all, so its zero AppleKeyStore misses testify to coverage and not to a hit, and the round277 relay is drained only by the panic sink (panicProbeFlush has one caller, inside clover_emmc_panic_append), so a boot that ends without panicking structurally cannot deliver a relay row and boot 64 read zero rows that were never evidence about the census. Round279 moves the reading to the channel proven to reach the card every beat (boot 63 carried 511 kernel-log lines with no panic): the probe now prints the publish, each open, each refusal and the first 24 selector calls with pid and comm, CloverSdhci gets class r279-aks with 96 lines plus a per-pass exemption, the census keeps the same counters as the copy that does not ride that pipe, and the clover-aks-nosvc knob is deleted from the probe and board.toml as round278 promised -- pinned negatively by the checker, five positive controls run. Build lessons: this kernel makes strcpy a three-argument macro, and build payload exits 0 while silently omitting the trust cache and scratch ramdisk unless --trust-cache/--data-ramdisk are passed; verify-clover-payload.py caught the second one. Artifacts: kernel 27296824, amfi ab1d619a (exec-hook sites still 0x1ace0e4/0x1ace16c), normalized 3a850828, payload f17321f6.",
    "Round279 read (boot 67, artifact ~/clover-out/round279-v0.6.73-payload.img sha f17321f6) answered the question it was built for and retired the round before it: the published service really is used -- stage=3, service=fffffff8116fff20, opens=56, calls=213, sel7=58 sel14=3 sel17=81 sel35=3, and 38 keystore-named plane entries at 1543 s where the withheld boot had none -- and the board lived past the 1800 s deadline to 1814.081553 s. That reverses half of round278: \"publishing the service ends the boot early\" was a two-versus-one correlation and boot 67 publishes and survives, so the claim is downgraded to unproven. What did not change is the desktop: the r252 ledger is present and covered on this boot (asks path=6 key=4 notes=10 whos=3) and lists no AppleKeyStore miss at all -- audiomxd asked for it 28 times in the boot without the service -- the unlock wait stays away (r268=0, hint=6 gone), yet the debtor workloop (pid 151) still shows tr=5 tc=0 tt=3c2 ow=0, backboardd still holds the one unanswered send (rem=3e03 mc=0 sr=1), and runningboardd killed AccessibilityUIS with 0x8badf00d. The round's own instrument failed measurably: zero r279 rows came back, and sorting the boot's kept kernel lines by timestamp shows they span 1458.7 s to 1814.1 s -- the tee kept 758 lines into a 512-record ring -- so every open and call printed between 470 and 1500 s was pushed, kept, and rotated out. A row printed before the ring horizon is not a reading. Round280 keeps the question and changes the schedule: nothing prints on the event, the first eight opens, eight refusals and twelve calls are copied into fixed tables, and a one-shot IOTimerEventSource on the published service's own work loop says the tables at 1600 s -- after the census gate, before the deadline -- with a rows open=/call=/dropped= line so a full table and a busy system cannot look alike. Build lessons: getName() belongs to IOObject, so the timer owner needs OSDynamicCast(IOService, owner); and when an archive step fails the kernel.macho on disk is still the previous round's -- the sha being identical to last round is the tell, not an accident to be grateful for.",
    "Round280 read (boot 68, artifact ~/clover-out/round280-v0.6.74-payload.img sha b7c56271) returned no r280 row at all, and that absence is the reading: the board stopped at 1324.217 s, before the 1600 s table the round was built around, and before the retrospective line it would have printed there. The beat itself kept running to the last second while its per-100 s line count fell 192 -> 143 -> 97 -> 44, which separates a board that stops executing from a tee that stops keeping: a dropped tee would lose lines, not slow the beat. No panic record exists for the boot, so none of this kernel's own panic paths wrote the ending. That makes three same-shaped early stops at three different times (726, 1324, 1499 s) against three boots that reached 1813/1814 s (65, 66, 67), i.e. an intermittent event uncorrelated with the keystore publish -- round278's causal claim is withdrawn a second time, this time with the denominator attached. The host-side lead came from TWRP's own dmesg: msm_watchdog 17817000.qcom,wdt: MSM Watchdog Initialized, and /proc/iomem showing 17817000-17817fff : msm-watchdog, so the APSS watchdog lives at 0x17817000; the prelinked roots carry com.apple.driver.AppleARMWatchdogTimer and boot 67 shows a watchdogd thread at a BRK trap, while sheng's own BootWatchdogPolicy.c writes com.apple.watchdogd into disabled.plist behind sheng-disable-watchdogd=1.",
    "Round281 ships two measurements and no causal change. First, the keystore state line becomes periodic -- one compact row every 120 s from 240 s on the published service's own work loop, with the open/call tables every fifth row (600 s) -- because both previous failures were the same mistake: a reading with a fixed speaking time describes only boots that outlive it, and boot 68 died 276 s short of the one table round280 had. Second, the same timer reads 0x17817000 EN/STS/BARK/BITE through the CloverInput MMIO shape (IODeviceMemory::withRange, kIOMapInhibitCache, volatile load plus dsb sy) and prints bark_ms/bite_ms at the driver's 32765 Hz, so the watchdog hypothesis either produces a number comparable to the early-stop gaps or dies. The arm is deliberately split from the publish: clover_aks_arm(NULL) runs between stage=1 and stage=2 on the resource service's work loop, and a second call after stage=3 only arms if the first had nowhere to run, so a refused publish can no longer take the hardware row down with it. Artifacts: kernel 9c031702 (8 r281 strings, 0 r279/r280), amfi 532c9a50, normalized 4dfdc0d3 (972 stamps zeroed), payload 4ff2446a archived as ~/clover-out/round281-v0.6.76-payload.img, verify-clover-payload.py green on all seven r281 pins and both \"gone\" negatives. The flight is boot 70 and is blocked on the board not being attached to USB; no reading is claimed for it.",
    "Round281 read (boot 69, file boot70-r281.bin.txt) killed the hardware-watchdog hypothesis with its own positive controls: both WDT rows read en=0 armed=0 intmask=0 sts=0 with bark/bite at the 16.001/32.002 s reset defaults, while the same schedule kept speaking (fire 5 -> 6, keystore stage=3, opens 26 -> 30, calls 90 -> 109, refused=0, boot id=69). watchdogd BRKd twice under different pids but cannot reset an unarmed watchdog. The card channel is now known to lag: its newest flight entry is 11.3 s older than the kernel's last line, so last log line is not last execution. The TWRP PMIC PON reading says only PS_HOLD release plus hard reset, which cannot separate a software reboot from a hardware watchdog; the APSS watchdog is exonerated by the register rows, not by PON.",
    "Round283 (v0.6.78) puts the reset record where the reset cannot take it: a twenty-word slot in IMEM's unclaimed 0x660..0x6af gap, inside the page the restart-reason cell already maps cache-inhibited. Words: magic CLOV283, kind, pid, aux, caller pc, CNTVCT, 24 bytes of text, then BEAT283, beat count and last CNTVCT. First writer wins, so the panic screen's text survives a later restart hook; three writers sit on the funnels (PEHaltRestartInternal for halt/restart types, reboot_kernel with pid/comm/howto, the panic screen with its format string before its own PSCI reset), and CPU0 alone stamps the heartbeat in ArmCpu::interrupt, touching only words 9..11. clover_unattended_begin reads the previous boot's record, prints one named or unnamed line with the beat, clears all twenty words, then publishes the pointer and writes the fastboot cell. The line has its own tee class r283-reset with the per-pass exemption because the arming pass also carries the census. Build: kernel 65e9c08b, amfi c6af79b0, normalized 71c5ecfa (973 stamps), payload ae909772 archived as ~/clover-out/round283-v0.6.78-payload.img, both verify gates exit 0 (userdata window not applicable: trustcache and seed bytes unchanged). Reading rule for boot 71: kind 1/2/3/4 names halt/restart/reboot(2)/panic screen; unnamed with a nonzero beat means the reset did not pass through any known kernel entry, and unnamed with beat=0 means the slot was probably never armed.",
    "Round284 (v0.6.79) fixes the one-shot line's horizon death after boot 70 proved it: the r283 verdict line had zero hits in the frame, and the frame's boot ran only about fourteen minutes before a spontaneous reset short of the 1800 s deadline (no panic report, no flight record; card wedges at t around 600-623 s with r169 gave up, r215 card recover, r172 dma deadline and a 1087 ms write settle), while the r282 GPU rows printed normally at t=374/494/614 (gpu_ahb=1, both eMMC controls 1, cx_on=0 gx_on=0 gfx3d_en=0 cxo_en=1). The line had entered msgbuf, the tee copied it into the 512-record kernel ring, and the fourteen-minute boot rotated it out -- reading exactly like a slot that was never touched. Round284 changes the two IOLog calls in clover_unattended_begin to sdhciSay so the identical string also lands in the 64-record driver verdict ring, which drains on the block path outside the tee horizon; the copy is pushed before the ring is armed, stays pending in RAM, and is the first record the drain writes once the logfs window is known. The line format, the read-then-clear-then-publish order, the record layout and all three writers are unchanged; the only new behavior is the durable copy. check-clover.py now refuses a bare IOLog of the verdict and requires the sdhciSay form. Build: kernel d5b28b78, amfi 92658e15 (exec-hook sites still 0x1ad20e4/0x1ad216c), normalized 295743ba (973 stamps), payload 93e6f053 archived as ~/clover-out/round284-v0.6.79-payload.img, both verify gates exit 0 (userdata window not applicable). The same boot recovers boot 70's IMEM record, which is still in SRAM because TWRP does not run this kernel.",
 "Boot 78 is the second consecutive silent, no-panic reset and its ring ended differently from boot 77's: the last kernel record (seq 2183, clover r229 sbport t=718 bb) is COMPLETE and checksummed ok, where boot 77's successor slot was BAD (newline missing). Neither boot has a kind-20 panic slot (the newest is seq 47, boot 76's deadline), neither reached the 1800 s deadline, and clover r289 counts 0 in both, so this is not the data-abort path Round289 instruments -- the machine stopped between two printfs and left no last words.",
 "Two channels that look like they bound a silent reset do not, and boot 78 says so explicitly. Landing in TWRP is not a reading: Round198 pre-arms the recovery BCB every boot, so ANY reset lands there and the channel has no discriminating power. The driver verdict ring cannot bound the death in time either: boot 78 wrote 40 records (seq 0..39), all eMMC arming plus tee and cap notices, and none carries a timestamp; seq is one counter shared by both rings (slot = seq mod slot count: verdict 39 = 39 mod 64, kernel 124 = 2172 mod 512), so 'no driver row while the kernel ring was still filling' means the driver had nothing to say, not that it died first. The missing instrument is one timestamped driver-side heartbeat written into the verdict ring without msgbuf.",
 "Round283's IMEM cross-reset record is now structurally explained rather than merely absent: it has read unnamed in three consecutive boots and the words are not ours. Boot 78 printed magic=6d881000008909f0 beat=397593712610837 beatcnt=1370614659995, another window printed magic=ed88000200a909f8 beat=403443458069358 beatcnt=1371352791997; read as CNTVCT those beatcnt values mean 71386 s and 71425 s of uptime while the boot that wrote them ran 718 s, and a beat count that large is not a tick count either. The arm-time reader zeroes words 0..19 and the ArmCpu beat writes words 9..11, so a surviving record would read as ours. It does not: between our boots IMEM 0x660 belongs to the firmware. Round196 moved the BCB out of IMEM into the misc partition for exactly this reason, and Round283 rebuilt a record on the channel that round judged dead -- the rule going forward is to check whether a cross-reset channel has already been written off before arming an instrument on it. Because a POR-class reset leaves no IMEM either way, this reading bounds nothing about the reset's type.",
 "The one correlation found across both silent deaths: a watchdogd took a fatal brk #1 shortly before each. Boot 78 printed clover r199 ubrk pid=213 comm=watchdogd pc=lr=0x100e8cb0c at 675.998797 s (death 42.8 s later) with r193 crit rv=0x5 sig=5 fatal=1 sigcrash=1 followed by 'panic-on-crash disabled via boot-arg'; boot 77 printed the same shape for pid=227 pc=lr=0x101349b0c at 1064.392658 s (death 184.04 s later). Round200's ubrk2 row carries start=0x100e82000 off=0xab0c and the instruction window bti j; bl <target>; brk #1 (d503201f 9400026b d4200020), i.e. a call declared noreturn returned and the compiler's trap killed the thread. Slide plus offset is enough to name the callee on the host from the OS volume's watchdogd, which is where this goes next. It is a correlation, not a cause: the APSS watchdog read at 617 s says en=0 armed=0, 59 s BEFORE the trap, and no beat covers the interval between trap and death, so a watchdog armed later is not excluded. Battery was measured in recovery and does not explain it either: capacity=100 voltage_now=4359607uV current_now=0 temp=250 status=Full.",
 "Round292 retracts that correlation and names the trap. The watchdogd brk is a call to libSystem __os_crash: the r200 code window (d503201f bti j, 9400026b bl +0x9ac, d4200020 brk #1) resolves through __stubs entry 47 and GOT slot 0x1000101e0, and the string at x0 of the call reads connect_to_kext() unexpectedly failed - unable to lookup watchdog KEXT service. The brk is the compiler guard after a noreturn call returns, not a watchdog action. It is background noise, and the refutation is a boot rather than an argument: the same ubrk row appears in boot 71 (t=1671.275), boot 73 twice (t=2866.356, t=4055.340), boot 76 (t=1336.199), boot 77 and boot 78, and boot 76 then ran on to the 1800 s deadline and wrote r148 deadline panic into the panic ring with no silent reset at all; the trap-to-death gap is 43 s, 184 s and unbounded. What the driver actually has is AppleARMWatchdogTimer in the prelinked image (13 references, and apfs.kext lists it in OSBundleLibraries) with no device-tree match, because make-clover-adt.py emits no wdt or watchdog node and the stock personality matches wdt,s5l8960x under provider AppleARMIODevice -- the r240/r241 shape. This round does not add the node: no census row has ever named an AppleARM* class on this board, so the missing thing to measure is whether AppleARMIODevice has a plane here at all. The instrument change is the watchdog reading itself. Round281 sampled 0x17817000 every 120 s and boot 78 got one row at 617 s, 101 s before it died, so the reading the hardware-bite hypothesis needs could not have been in the log. The aks timer now fires every 4 s and keeps the old output density (state row every thirtieth fire, tables every fifth state row), prints EN/STS/BARK/BITE only when they change, and tags every row why=first, why=chg or why=ctrl so a missing chg row reads as nothing moved rather than as a dead timer -- the ctrl row is the evidence the sampler is alive. The keystore table dump moves to the first fire because the earliest table the old schedule produced was 720 s and boot 78 died at 718.84 s. The watchdog row gets its own tee class r281-wdt placed ahead of r281-aks, since teeProbeClass is first-match-wins and a one-shot bark must not spend the keystore budget.",
  "Round293 is a reading-discipline round, and it exists because round292's frame nearly shipped a false sentence. Boot 79 ended like 77 and 78 -- no kind-20 record anywhere in a raw scan of 1217 blocks, no deadline reached -- yet the flight decoder printed \"the deadline fired after 1800 s\" and a panic-sink reading, both of which were boot 76's: the deadline's ticks/cnt0/cnt1 matched boot 76's own r148 row bit for bit, and the panic markers' extra[6] said 76. Only the panic record carried a boot id (r236); entries, beats and the deadline record had none, so a ring whose writer stopped mixed two boots silently. gBootId is now stamped into word 35 of every flight record written without extras and into the deadline's extra[10] (word 45), read-clover-log.py attributes each group and prints \"STALE: boot N never wrote one, so this group says nothing about this boot\" instead of drawing the conclusion, refuses the cross-boot entry/beat gap comparison, and its --selftest carries both the negative variant (deadline/panic slots rewritten with boot_id-1) and the congruent positive control that must still print \"deadline fired after 1800 s\". Two more rows were asked what they cannot answer: the r283 line printed the heartbeat's counters without the magic that says whether the slot was ever ours (boots 77 and 79 both read \"unnamed\", values shaped like nothing this driver writes -- beatmagic=%llx splits \"not our channel\" from \"ours, and the hook never fired\"), and run-clover-unattended.sh described a landing as a cause (\"TWRP's adb came up: the deadline's BCB took\" -- r198 pre-arms a recovery BCB every boot, so any reset lands there; the runner now names the landing and points at the card for the deadline). Watchdog answer for boot 79, from the resolution r292 bought: fire 151 at t=860 s and fire 211 at t=1101 s both read en=0 armed=0 sts=0 with bark/bite at reset values and no chg row anywhere up to the last kernel line at 1184.031391 s -- within the horizon this boot allowed, the silent stops do not come from the APSS watchdog, and the next suspect side is AOP/PON. Lesson filed with the instrument-horizon rule it came from: a record without a writer identity is a record that will be attributed to the wrong boot the moment its writer stops.",
  "Round294 closes two instrument channels and opens one control, all three from boot 80's frame. The r283 IMEM cross-reset record is retired by the word r293 added to it: beatmagic=801a082d822c1192 is not BEAT283 and the record magic is not CLOV283, so offset 0x660 was never this driver's slot -- the previous boots read unnamed because the channel is somebody else's memory, not because a hook failed to fire. The PMIC PON latch was tested the cheap way before any kernel instrument was built for it: a deliberate warm software reset (adb reboot recovery) produced byte-identical power-on/power-off reason lines to a silent reset, so the latch cannot discriminate and an SPMI PON probe was cancelled rather than spent -- filed as a negative control, which excludes the instrument's power, not the PON branch. The APSS watchdog stays excluded for a fourth boot (t=737.611779 and t=1098.120726 both en=0 armed=0 sts=0, bark/bite at reset values, no chg row). What r294 puts in their place is the timeline: r290's two GPUCC branch-enable writes reached the board for the first time as boot 77, and boots 77-80 are the four silent resets (718 s, 1184 s, 1248 s, 1335 s), while the two longest boots (73 at 3145 s with no deadline, 76 reaching its own 1800 s deadline panic) both predate them -- so r294 removes those writes and nothing else on that path, with the falsification clause written into the source before the flash.",
  "Boot 81 kills this port's first causal hypothesis, and kills it with the instrument that was rolled back. Round294 took r290's two GPUCC branch-enable writes out and the fifth silent reset still landed at 997.261788 s (last kernel tee line clover r223: sbport t=997 rem nm=2e03), with zero kind-20 records under boot 81 and the deadline/panic slots still carrying boot 76 -- stamped un-stamped and STALE: boot 81 never entered the sink, exactly as round293 designed them to say. The rollback is read off the card rather than asserted: r290's own branch row shows rbcpr=0/1 rbbm=0/1 with both branch RCGs back to 80000000, i.e. the two votes really were withheld this boot, so what is excluded is those two writes and not that boot 81 never reached the two beats. The five silent resets are now 718/1184/1248/1335/997 s -- a band, not a second, and boot 73 (3145 s) and boot 76 (1800 s deadline) being earlier stays a correlation now that the causal branch is dead. r294b is the pre-registered follow-up and asks the only variable-level question left, with no code and no new release: re-flash the archived round289-v0.6.86-payload.img, the last image of this port that reached its own deadline, and see whether the old image also silent-resets now. If it does, the payload is not the variable (card state, per-boot accumulation, temperature or battery are) and the GPU line leaves the reset suspect list entirely, sending the hunt back to the whole-chip reset source with no usable AOP/PON instrument. If it reaches 1800 s again, the difference lives in post-r290 images and the next cut is clover-gpu=0 -- a boot-argument bisect that tests whether the three new reads of an unpowered block cost anything. Per r288's rule the judgement was written before the flash, and it is the second run of the same image that makes it a control.",
  "Boot 82's frame also re-drew the desktop blocker's map, and a host re-check re-drew its words. (1) The wait this port kept citing is no longer on stage: clover r268 rows and hint=6 are 0 in both boot 81 and boot 82, consistent with the older reading that the semaphore disappeared after round276's keystore. Its mechanism is now fully read off ~/clover-out/datamigrator.macho: the only dispatch_semaphore_signal in MigratorAlternateAppDelegate sits in alternateSystemApp:didExitWithStatus: behind two ANDed gates -- cbz on the status (must be 0) and cbz on _MKBDeviceUnlockedSinceBoot -- while alternateSystemAppDidLaunch:, alternateSystemApp:didTerminateWithSignal: and alternateSystemApp:didFailToLaunchWithError: only log. So that wait wanted 'PreBoard exits cleanly' AND 'MobileKeyBag says unlocked since boot'; a PreBoard killed by a signal or failing to launch never releases it. (2) The attribution needs half a retraction: dyld_info -objc names the class as MigratorAlternateAppDelegate (called from -[DMMigrator _unlockKeyBagUseOfForceIsAuthorized]), the selector string exists only in the main executable, and BKDisplayLinkManager is zero hits in that binary and in all 54 cache slices (the cache carries AXDisplayLinkManager and TKDisplayLinkManager). (3) The chain is one hop longer than the docs said: datamigrator (pid 147) shows threads=7 wait=7 run=0 wl=3 and its tid=38e holds an unanswered send, remote=7e0f sr=1 rmc=0 peer=187:com.apple.migra -- and the peer=/comm= fields are cut at 15 characters, which is what also truncated com.apple.datam, so pid 187's identity is unreadable rather than unknown: the cache offers com.apple.migration and com.apple.migrationpluginwrapper and no way to choose. round295 widens both fields (positive control: pid 58's row must print com.apple.backboardd in full) and replaces the two hardcoded pids with a transitive walk of the send chain, four hops, with the endings printed as readings: no_send, no_owner, self_reference, depth_limit.",
  "Two more negative controls came out of the same landing, both host-side and both cheap. The platform's own cross-reset record is empty: /dev/block/by-name/rawdump, the only dump partition on this board (128 MiB), reads md5 fde9e0818281836e4fc0edfede2b8762 on the device and byte-for-byte the same after a full host pull, with a non-zero byte count of zero -- no ramdump has ever been staged here, for any of the six resets; apdp and msadp turn out to be Xiaomi attestation certificates, ddr a training blob, ssd 8 KiB of binary, and pstore is empty. And the physical readings taken at that landing (temp=250 = 25.0 C, charger_temp=294, die_health=Cool, status=Full, capacity=100, voltage_now=4360340) are nine minutes late, which per round293's own rule cannot be read as 'it was not hot at the reset' -- so the fix is host-side and payload-free: run-clover-unattended.sh must snapshot power_supply/thermal and the rawdump head the moment TWRP's adb comes up, before it reads the card's log window.",
  "Boot 82 spends round294b -- no code, no release, just the archived round289-v0.6.86-payload.img reflashed, which is the second run of the same file boot 76 ran when it reached its own 1800 s deadline -- and it pre-registers which branch is which. That run silent-reset at 707.103272 s: zero kind-20 report records under boot 82 (the 16 in the window belong to boots 55/56/58/59), the deadline record prints un-stamped because round289 predates round293's boot stamp, and both panic markers still read boot=76 with STALE: boot 82 never entered the sink. Same bytes, different ending, twice over (r294 removed the two writes and boot 81 still died; r294b removes the whole generation and boot 82 still dies) => the payload is not the variable in the six silent resets (718/1184/1248/1335/997/707 s) and the GPU line leaves the reset-suspect list, so the clover-gpu=0 bisect planned as branch (b) is cancelled rather than run.", "boot 87 (r298/v0.7.2) answered the question r298 was built to ask, in the field that does not depend on a name translating: tlink= came back no at hops 1, 2 and 3, and at every one of those hops the previous hop's tspace= equals this hop's own space= -- the port hop N sent into is received by exactly the task hop N+1 belongs to, three times over, inside one address space each. What does not match is the name: that task calls the port 0x3207/0x3507/0x2903 while the thread the census sampled is blocked on 0x4503/0x1003/0xd0b. So the debt chain is real at task level and the open cell is which thread waits on the received name. verr=17 gave the second half: KERN_INVALID_RIGHT (kern_return.h:151) is returned by ipc_object_translate() only after ipc_right_lookup_read() succeeded and the entry's type holds neither right, so those three names exist and are not a receive right nor a send right -- a port set (what a run-loop mach_msg usually waits on) or a send-once right, which this instrument cannot separate because it never got an object. That also settles boots 84/85 from the mechanism side: the leaf's own d0b carries verr=17, so its qmc=0 qsr=0 were never read rather than read-empty. Two instrument debts stay open: cap=send rows read qmc=/qsr= off nrcv while verr= describes frcv, so those columns still have no return code of their own; and the helper keeps only the last of its two attempts, so the RECEIVE code never reached the card. The boot ran to its own 1800 s deadline (elapsed=1800.003s, panic markers signed boot 87), making four boots in this family three different endings, and every other row is unchanged: WDT en=0 armed=0 for an eleventh boot, keystore opens 44->49 calls 165->186 with all four selector counts rc=0, GPU census the same 13 words, bus verdict=102, one dma-deadline rejection instead of six, and r283/tee-seen absent inside a window that only covers t=1444.5..1815.1 -- read as outside the horizon, not as not happening.",
  "Round299 is the first round in this area that ships a switch and an instrument in the same breath, and the instrument's shape is taken from two lessons already paid for. The SMP state is published as state on the beat (clover r299: smp ... printed inside every census fire, immediately under the r271 row it extends) rather than at attach time, because r272 proved that a line spoken before t=10 s is unreachable in a ring whose window is the last ~370 s; and each of its seven per-core columns can fail for its own reason and says so -- the driver's step ladder (st=), its own failure slot (fl=), the firmware's return code (rc=), the MPIDR we asked for against the MPIDR the core read (want=/seen=), and the entry address handed to PSCI (entry=). The last one exists specifically because rc=-4 INVALID_ADDRESS is a verdict about an argument, not about the call: without entry= a firmware 'no' and our own ml_static_vtop returning 0 print identically, so the driver now short-circuits the second case with fl=9 rc=-1002 before it ever issues the SMC. req= is the parsed boot-arg re-published by the driver, which is how a 'the switch never arrived' outcome stays separable from 'the switch arrived and the ask failed' -- the failure mode that kept eleven boots of reg=1 unexplained.",
  "Boot 88 also exposed a fourth shape of 'a row that is not there': the census fire printed its whole front half -- r229 bb, r229 sbport, r234 sbown, r262 census, r270 ipi, r271 cpu, r299 smp -- and the ring's newest slot is that r299 row, while the rows boot 87's fire put after it (r262 th, then the r296/r298 chain) are absent in this frame. The three classes involved are all exempt from the per-pass push cap and no 'capped at' notice names them (this window names only r153/r155/r170-open/r181/r187/r189), so a cap would require a drop without its notice -- the exact defect r249/r251 removed. The honest reading is that the write stream stopped there, but the instrument cannot tell 'a fire interrupted' from 'a fire that printed half its rows', because a fire carries no completion marker. Registered as this round's debt: make one fire self-attest (a done= count, or a fire sequence number inside the r299 row), so the next boot's missing chain rows stop being an inference.", "Round306 SHIPPED (v0.7.16): boot 95 left exactly one reading -- the census tail is 0 rows on both channels -- and three causes produce that shape identically: (a) the thread never reached the fire row, (b) it reached it and the driver relay refused every hand-off, (c) the rows are in the relay's BSS ring while every consumer returned at its own guard. Each gets its own number this round. Kernel zzz(63)-clover-r306.patch, osfmk/kern/task.c:13718: a bare-printf step row 'clover r306: step t= seq= pid= th= hidden=' placed after 'clover_bb_chain_hops = 0;' and before snprintf(fire). It deliberately does NOT call clover_census_row -- the relay is the thing under test and a copy cannot ride the pipe it measures -- and it is deliberately not on the tee exemption list, passing only through the generic 'clover r' token, so it travels printf -> msgbuf -> tee -> kernel ring (kind 22): a second leg that is not the one being judged. th= counts the thread rows actually printed and hidden= is call - cn, so this one row separates 'got here' from 'how many printed'. Driver CloverSdhci.cpp: probeFlush's merged guard 'if (!gVerdictFirst || !gHost || gRingBusy[kRingDriver]) return 0;' is now three named exits counted in gProbeBlocked[3] (unarmed/host/busy, :525, cumulative and never cleared because there are two readers), and each exit SPEAKS FROM THE EXIT ITSELF (:4980, capped at 4) via teeSay -- legal there precisely because teeSay only writes the driver's own RAM ring, no lock, no sleep, no card, while the path it reports on is by definition one that cannot do a block write. Producer-side exits counted too: empty/zero-length hand-offs (gProbeEmptySay, :3598) and over-length truncations (gProbeCutSay, :3604). The report line gains a third print branch 'nothing = gProbeCalls && !gProbeFlushed' (:5049): before this round it only spoke when something was in flight, which is exactly why boot 95 could not tell 'the relay refused' from 'nobody called it'; the five new numbers are copied onto that line as well (:5066, 'blocked=%u/%u/%u empty=%u cut=%u'). Residual limit, written into the code instead of papered over: if !gVerdictFirst the silence line itself cannot reach the card either -- and then the frame is empty in a way that says so, while the unarmed count still survives to the next boot because it is never cleared. Contract: tee class 'clover r306: ' / r306-step budget 64 (:1115) plus the 'r306' exemption (:4656); check-clover.py pins the step row's format string, the five counters, the nothing branch and two negatives (the merged guard must be gone, the 'CloverSdhci r304: probe' token must be gone); its 'the copy does not ride the relay' check reads CODE LINES ONLY -- the first version tripped on its own inserted comment naming clover_census_row. verify-clover-payload.py's probe-beat-flush needle is the whole new format string and adds probe-silent and census-step. r306 reverse-applies before r305 and r304 in LATE_PATCH because it inserts above the block r304 wrote and r305 reordered, and an apply failure in that loop is silent. Artifacts: kernel 05762cb2 -> AMFI 5d4e3afd (both cuts at VA 0xfffffff004ab40e4 / 0xfffffff004ab416c, file 0x1ad70e4 / 0x1ad716c, encodings byte-identical to every previous round) -> normalized f1586403 (973/973 object stamps) -> in-card 32287fdc; image round306-v0.7.16-payload.img 9a5e9bbf, 58,720,256 B; ADT 14,384 B, trustcache 7c369ce0, ramdisk 614b8356. Grepping the image's own kernel: three r306 rows present, 'CloverSdhci r304: probe' absent. Gates: check-clover ok, verify 48 OK / 0 FAIL, driver -Werror clean, task.c syntax exit=0 hard=0. PRE-REGISTERED boot 96 outcomes, written before the flash: step present with fire on neither channel => stopped inside the hand-off plus snprintf lines; step present AND fire present => 'never got there' is formally retired and the question moves back onto the reader; step absent => the thread really did not reach that beat, the same branch as r305's (c); step and fire present but no th/done => stopped after fire. A missing step row carries NO evidence about the relay's refusals -- it must not be used to infer (b). For the relay: whichever of unarmed/host/busy is non-zero names which guard held; all three zero with empty and cut also zero while calls>0 is the number boot 95 could not emit ('nobody put anything into the relay'). The clocks stay as r305 measured them: if two boots' arming_offset disagree, nothing gets ordered, per v0.7.14. Still owed and not pretended settled: the drained= ownership debt and the smp-off same-image control round.", "Boot 96 (round306 readback, v0.7.16) paid both instruments and moved the silence somewhere else. The relay spoke for the first time by saying nothing: four 'CloverSdhci r306: probe why=tail wrote=0 seen=0 pend=0 flushed=0 ... blocked=0/0/0 empty=0 cut=0' rows -- all four printed by r306's new third branch, since neither of the two old conditions held -- give 'the relay was never handed a row' as a reading rather than an inference. (\u4e59) the relay refused and (\u4e19) every consumer blocked at its guard are BOTH excluded by numbers on the card, and the same cumulative counter read a second time by a second reader at the sink agrees ('drain enter boot=96 ... tee=1 append_rc=4 probe_seen=0'). The step row is absent, so the walk never reached task.c:13718 -- and this absence is no longer a ring-horizon problem, by three links: the card already holds the r299 row (so the tee's cursor is past it), the sink ran kPanicTeePasses=8 further teeKernelLog() passes (32 KiB of scan against roughly 1 KiB written by that beat), and the step class is on the exemption list so the 16-push-per-pass cap cannot eat it while the post-sink card write is proven accepted by the drain-enter row itself. The interval is now ':13703 closing brace' to ':13728 clover_census_row', which contains three integer increments, a comment and two printf/snprintf calls. The clocks still agree and still cannot order: the marker reads k=576s / arming_offset=11777ms against the census head at [576.330590], and the 197 ms gap to the beats' 11974-11991 offsets IS the one-second truncation of kernelSeconds(), not a measurement. The sentence still did not land (append_rc=4, zero boot-96 kind-20 slots). Eighth-core boot nine across eight images reproduces field for field (real=8 reg=8 start=7 run=8, req=1 con=1 run=7 st=07777777, sent=278476 recv=278361, head row threads=16 shown=16 hidden=0 wait=16 run=0); the deadline record on the card is still boot 87's, so this boot never reached 1800 s, and 'r283: last reset unnamed' is the tenth unnamed silent reset (band 642.7/~645/661/746/835/555/742/617/576, charger_temp=337). One defect in r306's own shape, caught on its first boot: the 'nothing' budget is global (4), so why=tail spent every one of them and why=drain -- the consumer that runs at the scene -- never got to speak. Rule recorded: a bounded silence report must budget per speaker, or the earliest voice buys out the last one.",
  "Round316 leaves the report channels alone and moves one image-level marker instead: scripts/verify-clover-payload.py used to prove the manifest walk had been linked by finding the eight SHNGROOT bytes in the kernel, and that pin is now known-bad -- a byte-wise signature compare lets the optimizer fold eight consecutive ASCII into immediates, so no image built from this source contains that string while each of the nine refusal tags the walk can print is present exactly once as a CString. The verifier therefore pins the walk by its exits (root-magic, root-count, system-bounds, data-geometry, datawin, root-code) and reads 48 OK / 0 FAIL against round316-v0.7.28-payload.img. The same round is why the board title moved to clover r316: the payload identity is the only row that says which build a card frame came from.",
   "Round318 adds one report channel and leaves the rest alone: the r318-input tee class (32 bytes) with its per-pass cap exemption, so the two new rows can land in the card text without being dropped by the cap, and scripts/verify-clover-payload.py gained two needles (r318 raw segment row, r318 core row) that read the exact format strings; the 263-check build verifies 48 OK / 0 FAIL. The round also produced the first boot-103 attempt with no reading at all: after a cold flash the board answered adb from TWRP about a minute later, then every block read (misc, both logdump paths, logfs, mmcblk0p56, mmcblk0p39) failed and the device left adb/fastboot within a few more minutes. That shape is neither the 1800 s deadline firing nor evidence of an r318 kernel panic; a stale boot-recovery BCB left in misc is the unproven candidate, and nothing was written while reading.",
   "Round342's reader half: scripts/read-clover-log.py learns the ring rule from the card instead of from the tree reading it. PINNED_SLOTS = 4 and PINNED_HEADS (in slot order) mirror the layer; card_pinned(data, first_lba) returns (declared value or None, why) and finds the r174 arming row BY ITS HEAD across the whole ring. The first version looked in the slot the rule assigns, which is circular -- it used the rule under test to fetch the reading that tests the rule -- and negative N65 is what proved the difference. Five silences each get their own sentence: no arming row anywhere, a row without a pinned= column, two declarations that disagree, a declaration that disagrees with the head table, and a declaration sitting in a slot it should not. decode(..., pinned=None) keeps round341's semantics word for word, so an old card still reads; with a declaration it continues past an empty pinned slot instead of breaking (an empty pinned slot is a named absence, not the end of the ring) and adds two problems: a pinned row sitting in someone else's slot, and a pinned slot holding a row nobody pinned to it. POSITIVE CONTROL ON A REAL CARD: boot 121 is a pre-round342 image, and the new leg said so at decode line 144 -- 'no r174 arming row lies anywhere in this ring, so this card declares nothing: an image before round342 pinned that row, read by round341's congruence' -- then read the card under the old rule and named the fallback. That is a named absence rather than a 0-hit grep. scripts/test-clover-sdhci.py now forwards the host model's problems BY NAME (fail(f'the sdhci host model named: {line}'), falling back to the tail only when the model named nothing), because (stdout+stderr)[-N:] plus the gate's six-name cap hid N60's own verdict; this is the second occurrence of the layer-31 shape and both truncations are gone. The negative battery scripts/test-clover-716-negatives.py runs 68 cases with 0 problems (~/clover-out/round342-pinned-slots/negatives.stdout last line); the nine new cases N60..N68 each go RED naming themselves and restore byte-identically. OWNERSHIP GAP PAID: scripts/test-clover-sdhci.py, scripts/test-clover-sdhci-geometry.py and scripts/test-clover-716-negatives.py had no owning area, so the upstream gate would have failed with 'add its owner area and paths'; the first two now belong to storage beside scripts/test-clover-block.py and the battery belongs here beside scripts/check-clover.py. The assembled tree was re-built before the tree-side gate because scripts/ is copied into it (layer 26); the five scripts and the layer hash identically in repo and tree, and both gates EXIT=0."
,
  "Round344 host half: the reader selftest builds a third family from the probe own literal (the per-record row) and asks the state row for pick=/grewn=/p58= by name, each family against its own enum ceiling; verify pins four CStrings instead of two; the negatives suite is 90 cases and N86 now rewrites the r344 literal, so the whole suite runs 0 problems (the pre-change run was 90 cases, 1 problem: N86 could not find the old literal and reported NOT TESTED).",
  "Round343 pays two host-instrument debts and adds the offset-chain gate. #732: run-clover-unattended.sh gains --serial and require_serial(), resolves the board once, exports ANDROID_SERIAL, and dies 2 when more than one board is attached and no --serial is given rather than guessing the first (boot 122's readback had two boards on the bus and the old awk first-field-exit selector picked whichever came first); the gate synthesizes eight bus states and asserts the refusal names both serials, that require_serial is never called inside a command substitution (a subshell would swallow its exit code), and that no bare first-field selector survives. #735: read-clover-log.py's [ring rule] line now prints unconditionally through ring_rule_sentence(pinned, why) -- both the read-declaration-4 branch and the declares-nothing branch have a sentence -- because boot 122's correct card produced no line under the old why-only criterion (a declaration sitting in its own slot returns why=None, so the reader was silent on a good card; layer 13). #736: check-clover.py walks each display column name to the offset that fills it and bans done=%s, presented=%s and frames=%s on code lines only, since a comment explaining the ban must not itself contain the banned string (layer 23). The negatives battery is 90 cases (N69-N90 new), 0 problems, each restored byte-identical (~/clover-out/round343-column-names/negatives.log).",
  "Round346 opens the port sets boot 125 could only count. The probe reads the same four hops through MACH_PORT_RIGHT_PORT_SET, walks pset->ips_wqset under the lock the translate returns, and copies each member port's object, imq_msgcount, ip_srights and imq_receiver_name into clover r346: bbsm rows, with clover r346: bbset2 carrying the member count and whether the sampled thread's wait_event is that set. clover r346: bbhop states each hop's thread id, wait_event, continuation and pc, because the hop order is only the task's thread order; the bbsend row gains unread= next to debt= so a failed translate stops counting as an empty queue, and scan=pset points at the set rows. The r346 patch is additive after r331 in patches/xnu/series and identical in both repositories; check-clover.py pins the set walk, the three row shapes, the debt/unread split, the tee classes and the exemption, and nine negative tests each turn the gate red for their own reason and restore byte-identically (~/clover-out/round346-negatives.log). prepare-clover-tree.py now finds the base repository as the device repository's sibling (accepted only when drivers/SoftwareAES is there) instead of reading tree/patches/xnu, which format 2 links from the device repository as soon as the device carries its own series.",
  "Boot 126 (r346 image) read the sets back: hn=3, cand=3 debt=1 unread=2; hop0 is set 4303 with three members (5103/4403/5203, all q=0, sr=1), hop1 is set 7103 with seven (6c07 sr=0, 6813/6a07/ff07/e377 sr=1, 9203 sr=6, de13 sr=2, all q=0), hop2 is a real receive port a903 with sr=0 and no send-right holder among 137 probed pids. hop0/1 cont=fffffff0072622ac is _ipc_mqueue_receive_continue measured in this round's own kernel; match=0 on both sets is a cleared wait_event (the threads were already awake and resuming) and not evidence against their being the receivers; hop2 cont=0 with state=TH_RUN means it was running in the trap, which is why it translated. The port-set premise holds, the debt/unread split holds, and the next question moved to the members: nine of ten member ports do hold send rights (9203 has six) while every member queue is empty, so the shape is doors that can be posted to and no mail, not a missing right.",
  "Boot 127 read the member census and then aborted inside the kernel's printf: set 4f03's three members all read q=0 sr=1 ms=1 own=1 hits=0 (backboardd holds one send right of its own on each, made once), and set 6d03's 9403 read q=0 sr=5 ms=0 own=1 hits=4 (four reverse-hash holders plus one name in backboardd's own table, with ip_mscount zero, which is a different history from a door made once). Four bbsmh rows landed, then clover r289: abt at t=645.372913 with pc/lr in ___doprnt and far=0x6c: bbsmhold passed hc[j * 16], one character, where %s needs the address; r331's bbsh row carried the same latent argument and had never printed because its hits were zero on every earlier boot. r348 fixes both to hc + i * 16 / hc + j * 16 and adds a gate block that requires those two address forms, requires the two element forms removed, and refuses any added line that reintroduces them; its eight negative tests each go red for their own reason and restore byte-identically. Nothing else moved: rows, tee classes, title token and cadence are unchanged apart from the round title.",
  "Boot 128 completed the census after the argv fix and named the holders: set 4e03's three members all read q=0 sr=1 ms=1 own=1 hits=0, and set 6303's member 9103 read q=0 sr=6 ms=0 own=1 hits=5 with two holder rows resolved to launchd (pid 1, its name 11f03) and SpringBoard (pid 27, its name 7003), while member e003 read sr=2 ms=1 hits=1 with one holder at pid 177. The third hop was again a receive port with no send-right holder. r349 follows each named holder into its own task with a try-locked census (clover r349: holdth: threads, waiters, runners, trapped; clover r349: holdt: up to two trapped threads with state, wait event, continuation, pc, receive name and send destination), so the next reading is what SpringBoard itself is doing at the moment it holds the key, and the gate pins the call site, the try-lock, the release and both row shapes with ten negative tests restored byte-identically.", "Round354 adds the r354 gate block to scripts/check-clover.py: three byte-identical patch copies, series presence and order after r352, the four noinline literal pairs, 36 '+\\tstatic <decl>' pins and the exact removed-line set (four bare storage-class lines plus the 36 declarations, nothing else); both title assertions move to startswith('clover r354:'). Nine ad-hoc negatives each went red for their own reason and restored byte-identically (~/clover-out/round354-negatives.log, all-negatives-pass). The measured frame budget -- 5344 B sampler, ~12.8 KB deepest chain against the 16 KB kstack -- is what the gate's shape protects.", "Round355 adds the r355 gate block to scripts/check-clover.py: three byte-identical patch copies, series presence and order after r354, nine added pins (the two new snapshot reads, the widened obj_held call, the once-walk call site, both branch endings and the bbonceh row) and two removed pins (the old debt= and bare unread= branch endings -- they must be replaced on both branches, which is what keeps the shape rule honest), the tee class and the exemption; both title assertions move to startswith('clover r355:'). Eleven negatives each went red for their own reason and restored byte-identically (~/clover-out/round355-negatives.log, all-negatives-pass), including the branch-ending case that proves the removed-pin leg cannot be satisfied by replacing one branch only.", "Round356 adds the r356 gate block to scripts/check-clover.py: three byte-identical patch copies, series presence and order after r355, fourteen added pins covering the doc comment, the three-leg translate trio with SEND first, the main/error/skip/naming row literals, the once-walk call and the call site's rem == rn equality test, plus the pure-addition assertion -- the patch may remove no line, because a deletion here would be a previous round's reading the next boot cannot re-make; both title assertions move to startswith('clover r356:'). Fifteen negatives each went red for their own reason and restored byte-identically (~/clover-out/round356-negatives.log, all-negatives-pass), including the removed-line case, the tee-order case proving the first-match rule bites, and the call-site case where skip and census would collapse into one silent leg.", "Round358 adds the gate block for the round: the new patch in three byte-identical copies, its series position after r357, the x1/x2 split and the hoprr legs pinned as added literals, exactly 14 replaced lines pinned by name and by count, and the r358 tee classes with their per-pass exemption. check-clover.py exits 0 from the device repository; 23 negative cases each turn it red for its own reason and restore every byte (round358-negatives.log).", "Round359 adds the gate block for the round: the new patch in three byte-identical copies, its series position after r358, the psmrcv/bbth/bbt literals and their two call sites pinned as added lines, and the removed-line count pinned at 0 because the round is pure addition. check-clover.py exits 0 from the device repository; 17 negative cases each turn it red for their own reason and restore every byte (round359-negatives.log); boot 139's self-sample overflow is recorded in the mirror paragraph below.", "Round360 adds the gate block for the round: the new patch in three byte-identical copies, its series position after r359, the rembits literal, the entry lookup and the type/urefs/sorights/receiver legs pinned as added lines, and the removed-line count pinned at 0. check-clover.py exits 0 from the device repository; 16 negative cases each turn it red for their own reason and restore every byte (round360-negatives.log).", "Round361 adds the gate block for the round: the new patch in three byte-identical copies, its series position after r360, the kotype/kobject and copyinmap legs pinned as added lines, and exactly 5 replaced lines pinned by name and count (the comment re-shape, the signature and the call site). check-clover.py exits 0 from the device repository; 16 negative cases each turn it red for their own reason and restore every byte (round361-negatives.log).", "Round362 changes the unattended runner's landing rule: adb_serial matches recovery only and an Android adb is asked for recovery; --boot-after-flash authorises the 2048-byte misc BCB by default; the BCB write/reboot/watch is retried up to RECOVERY_RETRIES=3; and a persistent QUSB_BULK node ends the watch in ten seconds with exit 7 (EDL needs a power cycle, and this host has no firehose loader). check-clover.py pins all four properties and exits 0; the round's 15 negative cases each turn it red for their own reason (round362-negatives.log). Boot 144's window is on the card, unread because the reset landed in EDL.", "Round363 adds the last landing rule: an EDL landing (QUSB_BULK) is below the bootloader, so neither the BCB nor either tool reaches it, and the only exit is a firehose reset. The runner now takes EDL_TOOL/EDL_LOADER (default ~/clover-out/edl/edl.py and the Mi Pad 4 prog_firehose_ddr.elf staged there), issues `reset` with a 60 s bound and no partition write, and keeps watching; when either file is missing it says so and the landing still needs a power cycle. Boot 144's data pointer was read (io=0) but the words still do not form a message header, so the selector stays unjudged.", "Round364 adds the neighbouring-window probe around the trapped message pointer and the first real EDL attempt. That attempt failed on the host python (the system 3.9 has no docopt) and then on the landing's mode: PID 0x900E is Sahara memory-debug, where the stock tool dumps gigabytes of RAM and refuses reset. The runner now uses EDL_PYTHON (default /opt/homebrew/bin/python3.13) and the local edl.py honours CLOVER_SAHARA_RESET=1, sending SAHARA_RESET_REQ instead of dumping; the gate pins both. Whether that leaves 0x900E is the next landing's test; if it is refused, the power cycle stays in limits.", "Round365 adds the remtrap row (option64, voucher|id, rcv_size|priority) so the trap is identified without trusting a buffer read, and records why the build needed three attempts: a transient TLS failure fetching the DriverKit headers (21 headers repopulated through the GitHub contents API), and the now-familiar lost task.o after a failed compile, which archive-09 reports as Unavailable real kernel imports [_current_task] until a bare kernel pass restores it. check-clover.py exits 0; the round's negative cases cover the new columns.", "Round366 closes the Sahara recovery: a USB port reset of the Qualcomm node (idVendor 0x05c6) first clears the memory-debug error state, then the local edl.py branch sends SAHARA_RESET_REQ and the board resets into TWRP by itself -- measured on 2026-11-10 with no hand involved. The runner now does both steps inside edl_reset() and the gate pins them. The round also reads the IOKit request body (rembody) behind the SEND bit of boot 145's real header.", "Round367 adds the default sample latch: when the beat finds no target, it latches pid 58 (backboardd) without touching the task reference discipline, so a boot whose sampled sender addresses someone else still runs the burst. Boot 147 is the measured cause: 1805 s of uptime, r221 rows on tid 0x6dd with destination 132:lsd, and ent=0 fired=0 for the whole boot. check-clover.py pins the latch and exits 0.", "Round368 makes the beat fire every 20 s instead of once: boot 148's window showed target=58 at t=180 and target=0 at 913/1033/1157, because the generation-change path clears the global and nothing re-arms it. The fire now carries a local target and re-resolves backboardd through proc_find when the global is zero, skipping the sample without touching references when the resolve fails. check-clover.py pins the three replaced lines and exits 0.", "Round369 is a control result: boots 149 and 150, both carrying r368's local target, stopped at about 170 s (newest flight entries 167088 ms and 170952 ms, zero aborts) while boot 148 on r367 ran past 1200 s. The local target is reverted and the fix moves to the line that lost the target, the generation-change clear of clover_bb_target_pid; the pid is still re-checked with proc_find. check-clover.py pins the revert and the retained line.", "Round370 adds the kobject vptr to remkobj so the user client's class can be named on the host, and records a cross-image control series: boots 149-153 (r368, r369, r367 again, r370) all stopped between 167641 and 173023 ms, while boot 148 on the same r367 image reached 1805 s. The early stop is therefore not one round's code; the next control is an older image or a sampler-disabled boot.", "Round371 is the control result behind its fix: boot 154 on the older r360 image ran to 750339 ms with no default latch, while boots 149-153 (r368, r369, r367 again, r370) all stopped between 167088 and 173023 ms, and boot 148 on the same r367 image reached 1805 s -- a race in the default-latch path. The sampler now replaces its task argument with the sampled task when task_pid(sb_task) differs, so the names it reads are indices in the space it reads them from.", "Round372 separates the first sample from the boot: every stop so far came right after the t~180 sample while the r360 control without the default latch ran to 750 s, so the fire is held until t=600 s. A boot that still stops near 170 s without a sample names something other than the sampler; a boot that reaches 600 s and stops at the first sample names the sampler."]
completion = ["Every claimed milestone has a reproducible command, a matching source revision and an accessible result."]
limits = ["Source references describe implemented behavior; host and device status need their own evidence.", "There is no serial console after the menu, so a frame is a photograph or a logfs read."]
next_action = ["r248 fixes the channel, not the census: ~/UniXNU/scripts/unixnu/payload.py wrote the board title into EFI/UniXNU/unixnu.toml as title = \"...interpolated\", and r246/r247 titles contain getPlane(\"IODeviceTree\") -- the first inner quote ended the TOML string, the firmware (UniXNULib/Config.c, parser Toml.c) lost the xnu entry and the board booted a menu with no OS, which is why those two flashes carry zero records: the boot counter stayed 34 (bootIdClaim writes the first card record of a boot at ring arming), the flight region has no entry and no beat, and the panic slots still name boot 33. r247 blamed svc->release(); that line is still wrong per IORegistryEntry.h:993 and stays fixed, but neither it nor the census ever ran on the board.", "The emitter now writes title = {json.dumps(title)} and parses the manifest it generated (tomllib) before shipping it, requiring the first xnu entry to carry the round title, Payloads/kernel.macho and the deadline; check-clover.py pins those three shapes, forbids the unescaped form and demands this round keep a quote in its title so the escaping is really exercised, and verify-clover-payload.py parses the shipped unixnu.toml and compares title/kernel/deadline against board.toml. Proven against the archive: round247-payload.img FAILs as unparsable at line 9 column 441, round245-payload.img parses.", "Control boot, same host and card: round245-payload.img flashed again reached its 1800 s deadline and landed in TWRP by itself (boot counter 35, 512 kernel-log lines, 20 probe lines, 64 verdict lines). So the environment is sound and only the r246/r247 manifests were broken.", "boot 36 = round248-payload.img (kernel e642de94 = r247 code, amfi 5aa1f160 -> normalized 7f0c4bf3, manifest 1343 B sha 8331c68a) flashed with scripts/run-clover-unattended.sh --flash-cache --boot-after-flash --allow-misc-bcb. Read plane byname=/buttons byname=/hbt byname= for the userland question and svc total=+stopped=+button-family= for whether any service on this board could ever issue the controller-ready notification, against the four branches in notes/development-log.md.", "r249 moved the census out of the tee's 16-push per-pass cap (CloverSdhci reserved now matches r234-set, r243 and r250). boot 37 proved the fix: 22 census rows arrived with no loss, including plane byname=ok, buttons byname=present, hbt byname len=4 u32=2, svc total=123 stopped=0 button-family=2 (svc buttons, svc IOHIDResource), model=iPad7,1 and census done nodes=9. Both branches r246 pre-wrote are refuted -- the plane name was right and a button-family service exists and is not stopped -- so the kernel's publication side is clean, and r240's reading that userland got a non-2 loses its basis.", "r250 measures the question instead of the answer: patches/xnu-clover/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz-clover-r250.patch (33 z, head of the LATE reverse list, on top of r247) notes every user-client registry path it resolves and every property it reads whose name contains the button substring, in eight text rows said live and replayed from the census burst; a new tee class (clover r250: / r250-mgq, 32) shares the exemption, and verify-clover-payload.py now requires mgq-asks, mgq-row and mgq-none in the shipped kernel -- round249-payload.img reports all three ABSENT, so the probes discriminate.", "Three traps r250 caught on the host before any boot was spent: IOCopyLogNameForPID() returns a +1 OSString and not a char pointer (take getCStringNoCopy(), then release); OSNumber has no public byte length (getDataByteLength() is OSData's, size is protected at libkern/c++/OSNumber.h:80), so the OSNumber branch reports len=0 by design and that is the encoding rather than a missing measurement; and is_io_registry_entry_from_path sits two hundred lines above the recorder, so it needs a forward declaration. All three are pinned in check-clover.py, which also refuses a round title with no double quote in it.", "boot 38 = round250-payload.img (kernel 62754e4d, amfi 236c4f7e with both sites still at 0x1ac00e4/0x1ac016c, normalized 7458e152, image cc044a4c, 58720256 B, ADT 14344) read with scripts/run-clover-unattended.sh --flash-cache --boot-after-flash --allow-misc-bcb --wait 2100. The verdict is the r250 block: a row naming a process and a home-button-type value puts the bug in how the answer is read, so the next cut is the one-shot sysctl behind bl 0x52aa38; only the nobody-asked line means userland never queried the registry, and then the cut is sheng's HID home provider (build-native-hid-input.py into the kernel archives, NativeHidInput.late.o plus hid-original-bindings.o into the clover display archive, package/CloverHidInputProbe.cpp called from CloverPMGR, boot args offline-hid-input=1 offline-hid-home=1); no clover r250 line at all is an instrument that never shipped, which per r248 is a manifest question and not a reading.", "boot 38 answered the question r250 was built to ask: asks path=9 key=6 notes=15, and SpringBoard (pid 27, then 269 after its restart) and PreBoard (pid 167) each resolve IODeviceTree:/buttons (val=1 is a non-null fromPath) and read home-button-type back len=4 val=2. audiomxd (pid 138) resolves the path and asks no key, so the filter is not counting bystanders. Four lines close in one frame: the ADT node is not missing, the plane name is not wrong, /buttons is reachable, and userland does ask -- the value is published, reachable and read correctly, while backboardd (pid 58) is still blocked at t=1399 on base=100c7c920 b=fffffffd g=0 cnt=1 wait=1.", "the same frame indicts the recorder twice, and both are the r249 class of bug -- an instrument eating its own decisive reading. row = rows[notes % 8] wraps, so from the ninth note it overwrites the first; notes=15 means the seven earliest asks are gone, and those are exactly the ones a smaller pid would have made, which is where backboardd sits. The dump prints slot order rather than time order (row 7 is t=465, the oldest, rows 0..6 are t=491..790), and comm= spends its 16 bytes on a pid prefix. r251 adds no instrument: 24 rows, chronological print from the computed wrap point, the tail of the process name, and a per-process counter line so the asks total and the surviving rows can never disagree silently again.", "settle the host question before the next flash: boot 38 says userland receives 2, while r242 read the homeButtonType branch as ==2 merely logging and skipping SSHB and !=2 arming the dead wait. Both cannot hold unless the value backboardd uses does not come from this registry (another source, or cached before any query), a different key is what it reads, or that branch was read backwards again the way r245 corrected r240. Disassemble the home-button-type fetch in libMobileGestalt and its caller in the shared cache first; do not spend a boot on the difference.", "boot 39 (round251-payload.img, kernel 54322ea6, amfi c85e4002 with both sites moved to file 0x1ac40e4/0x1ac416c as the kernel grew, normalized 443ea5f3, image e92e3d08) closes the button number question: who pid=58 comm=backboardd path=3 key=3, two of those keys are home-button-type returning len=4 val=2. backboardd receives 2, so applyDefinitions: takes its ==2 early return and the forever dispatch_group_wait belongs to _configureAsync/SyncWithBlock:, which never call homeButtonType. What is missing is the single dispatch_group_leave at 0x100030ca8 next to the _BRController ready log, not a button number. The census still arrives whole.", "the same frame produced the first property this board has ever been asked for and does not have: function-button_halleffect on the same /buttons node, recorded as len=0 val=0, which is how the recorder encodes a null answer. It was visible only because the name contains the button substring, so r252 (patches/xnu-clover/z*35-clover-r252.patch, head of the LATE reverse list) records absent properties and unresolvable paths as their own class -- 16 rows plus a total, printed from the same exempt burst -- gated on the asking process rather than the name: only pids already in the button tally are recorded, because an unfiltered miss list would fill the ring with capability probes and push out the rows that answer the question.", "the tee class moves with the prefix in the same round: r251-mgq becomes r252-mgq with the budget raised from 48 to 64 (worst case one total line, eight who lines, 24 rows, one misses line and 16 miss rows), verify-clover-payload.py requires mgq-miss and mgq-missrow alongside the earlier four, and check-clover.py refuses a miss recorder that is not gated on the tally, any printf left under the stale r251 prefix, and a broken format literal -- one of this round's own edits put a real newline inside a string and clang answered with nine errors pointing nowhere near it.", "boot 40 is read against the miss list and nothing else: a haptics/SSHB/BK-shaped name there picks the next thing to publish; a list containing only function-button_halleffect means the gap is not a registry property and the next cut waits on the _BRController trigger source the host investigation is pinning; misses total=0 means the UI processes already have everything they ask for, the desktop is purely an event nobody posts, and the ADT side closes for good.",
    "boot 41 (r253, first boot with com.apple.driver.AppleM68Buttons linked) is the shortest boot of this port and the verdict on that experiment: the kernel log ends at 12.744 s with 'AppleM68Buttons:0x100000150 start' and the panic record reads 'handleStart failed to instantiate function-button_hold' @AppleM68Buttons.cpp:336. The driver matches /J120AP/buttons -- the first child that node has ever had -- and dies in its own start, so the census, the property recorder and the backboardd sampler produced nothing. Host-side the kext's own __cstring says what it wanted: a hardcoded button-name table (hold, menu, volup, voldown, ringerab, ringeren, halleffect, halleffect1, hesattach, halleffect2, skey, help, helpdouble, app) followed by home-button-type, function-button_%s and 'failed to instantiate %s'. handleStart builds function-button_<name> for every name on that list and a synthesized ADT node has none of them; the name it died on, hold, is the first entry of our own button-names.",
    "The control board closes the question: UniXNU-sheng/scripts/make-sheng-adt.py:185-186 publishes the identical buttons node (same button-names hold/voldown/volup, same home-button-type = 2, no function-button_* at all) and reaches the desktop with this same iPadOS 17.7.11 image, because UniXNU-sheng/board.toml has no [kernel.prelink] section at all -- its buttons arrive through its own ShengHidInput. What clover lacks is therefore not Apple's driver but any driver that publishes the HID buttons. r254 takes the root back out and pins the absence in both checkers: check-clover.py asserts the root is not listed, verify-clover-payload.py asserts the class name, the format string and the personality are not in the image, because seeing them again would mean the board is back to dying at thirteen seconds.",
    "r254 also fixes the third self-truncation of the recorder, on the evidence of boot 40: 'misses total=153 shown=16' where those sixteen rows were four names repeated (soc-generation alone took eight), and 'CloverSdhci r195: r252-mgq probe lines capped at 64'. The miss table is now one row per distinct name with a count (CLOVER_MG_MISSES 32), the live print moved off the button rows -- the census replays them -- onto the miss rows, whose first-seen order no later dump can restore, and the r252-mgq tee class budget went 64 to 128.",
    "Next after boot 42: wire drivers/NativeHidInput the way sheng does -- merge build/native-hid-input/NativeHidInput.late.o with hid-original-bindings.o into the clover display archive, add scripts/build-native-hid-input.py to board.toml [kernel] archives, call package/CloverHidInputProbe.cpp from CloverPMGR, and keep the boot args offline-hid-input=1 offline-hid-home=1 until the probe proves it stays offline. Read it the way every round has been read since r245: does the census name a button driver in svc=, does button-family= grow, does backboardd's bbgrp still report wait=1. Do not change home-button-type.",
  "boot 43 = round255-payload.img (kernel 4f24248e, amfi 86e3da5b with the two exec-hook sites now at file 0x1ac70e4/0x1ac716c as the archive grew, normalized 74efdcce, image cc044a4c-size 58720256 B) answered the wiring question and only the wiring question: the census now names IOHIDInterface, IOHIDEventDriver and an IOHIDEventServiceUserClient in svc=, button-family= goes 2 to 5 and svc total= 122 to 128 -- the board's only IOHIDDevice is the owned one, so the original family matched it and userland opened its event service, with no panic anywhere in the boot. The wait is unchanged: backboardd (pid 58) still shows bbgrp cnt=1 wait=1 notif=0. Two readings are missing and both are the instrument's fault, not the board's: no clover r255: line is in the window because the probe speaks once at the late entry (t about 25 s) while the card keeps 512 rows from t=1208 s (msgbuf lap=24), so stage=/published=/property_seen= were never readable; and the r252 miss list still records backboardd asking for DisplayIntegrated (count=14, first at t=485 s), the very key the probe publishes after matching. r256 therefore makes the verdict a slow heartbeat -- one line every 120 s inside the r255-hid class budget of 32 -- so whatever window survives carries the state, and then reads the second witness: if DisplayIntegrated/Built-In stop accumulating the publish landed and the resolver needs something else; if they keep accumulating it is on the wrong node, and the next cut is where backboardd actually copyProperty()es them. Do not change home-button-type.",
  "boot 45 = round257-payload.img (kernel 0a712dec, amfi 940b6b44, normalized 41c10a41, image 7e4aeb55, 58720256 B) closed the input question and opened a different one: the beat reads Built-In=1 PrimaryUsagePage=1 PrimaryUsage=1 published=1 seen=1 deviceBuiltIn=0 with presses=3 asks=1080, and the r252 absence list fell from 288 notes / 32 names to 188 / 26 with all seven removed names HID-shaped (Built-In, DisplayIntegrated, HIDVirtualDevice, StandardType, CapsLockLanguageSwitch, KeyboardLanguage, AppleBluetoothRemote) and only the deeper Manufacturer added -- userland walks our device and is answered now. The desktop is still not there and the ten user frames of the thread still waiting on the heap group (pid 58 tid 0x3fe, base=127d7a9e0 b=fffffffd cnt=1 wait=1) all resolve inside AssistantServices.framework with the wait point in Home.framework, while r239's single-leave reading (0x100030ca8 next to the _BRController haptic-asset log) describes the stack group (tid 0xec7, base=16f01bb4c b=1 wait=1), which is also still waiting. Two waiters, not one: the round240-257 story was too narrow. Two candidates die on sheng: it publishes no haptics/taptic/vibra node and none of soc-generation/product-id/is-muse, and it reaches the desktop without them. Next round profiles the heap group the way r239 profiled the stack one -- who allocated it, its dq list, who waits, who must leave it -- before any further HID or ADT work. Do not change home-button-type."
 , "r265 SHIPS THE TURN-AROUND (v0.6.41, 40-z patch zzzz...z-clover-r265.patch, on top of r264 and first in LATE_PATCH): clover_bb_peer_task hands the receiver task back as an object rather than a label, because a task can exit while its threads are walked and the caller keeps a reference; clover_bb_peer_census walks at most twelve of its threads and resolves each of ITS waiters in the debtor space, so the next hop prints for free; and the census row grew rmc=/rsr=, the queue depth of the port the request was sent to. It never calls the sampler -- the two would share the dedupe statics and the second pass would swallow the first rows -- which check-clover.py now forbids by literal. Boot 52 fork, pre-declared: rmc>0 means the message is still queued and nobody is reading it, so the peer rows already name what blocks the debtor; rmc=0 with backboardd still asleep means it took the work and did not answer, so the question moves to what that job needs. BOOT 52 LANDED ON THAT BRANCH (v0.6.44): rmc=0 rsr=1 on the debtor port, and its own census shows 8-10 threads all asleep -- five in _filt_wlwait_continue (kqueue EVFILT_WORKLOOP requests), one in _semaphore_wait_continue, one idle receiver with remote=0, two idle workq workers -- tm=0, run=0, and NOT ONE thread holding a send right. Both chains raised on 2026-11-02 die in the same frame: no keybagd round trip, no backboardd/datamigrator mutual wait; it waits on kernel events (five workloop notes and a semaphore), not on ports. The gap is mine -- the pth row dropped we=, and for a non-port wait the wait-event word is the only identity the row has, so one note or five is unreadable. r266 puts we= and pc= back on the peer rows and takes one user stack each from a wlwait and a semaphore thread, which decides between libdispatch wl_request and DataMigration plugin waits (DMWaitForExecutePluginsSignal, DMWatchdogPluginsAfterTimeout, DMImposePluginArtificialHang are all in the image): plugins that never ran would be a desktop blocker with nothing to do with a GPU."
, "r268 asks the one thing r267 could not: who is able to signal that semaphore. From thr->waitq.wq_q take the struct semaphore itself (sync_sema.h:52-59: task_link, waitq, owner, port, ref_count, count) and print sc= (sem->count, negative means waiters are queued), sp= (sem->port->ip_srights, how many send rights still exist) and the receiver's pid:comm, on a row of its own beside the hint=6 owner row. Three shapes separate with those numbers: sp=0 means no task can ever signal it and the missing thing is a publisher, the same structural verdict rmc=/sr= gave for the port in r265; sp>=1 with sc<0 means somebody holds the right and has not used it, which sends the question back to which component; sc>=0 means the count was already given and the reading moment was wrong. Leave ull_opcode (the UL_UNFAIR_LOCK versus COMPARE_AND_WAIT split) for r269 rather than chasing two questions in one round, and keep the CPU-first rendering decision unchanged: boot 54 supports no render-completion wait at all -- backboardd's fifteen waiters are eleven port receivers, two parked work-queue threads and one owner-less ulock.",
"r269 asks where that single send right lives: from sem->port, walk tasks' ipc entry tables in clover_port_recv_task's lock order (is_read_lock, is_active, scan is_table[0].ie_size for ie_object == port) and print 'clover r269: srhost port= pid= comm= name=' with how many spaces and entries were scanned and whether anything matched; the r268 row gains the bare port= so the two name the same object, and the receiver read moves behind io_lock plus ip_in_a_space -- with the checker ban reversed into a requirement to use the accessor. Three outcomes, one reading: the name is in pid 142's own space -> a within-process deadlock and the next question is who inside that task owes the signal; the name is in another task -> the census gets a new debtor and r265's machinery moves onto it; nothing matches anywhere -> the srights=1 is the reference convert_semaphore_to_port donated to the port itself, no task can signal it, and the dead wait becomes proven instead of inferred.",
    "r273: go back to the desktop with the workloop question, one question in one round. Boot 56/57/58 established the debtor (com.apple.datamigrator, pid drifts 139/142/146) is deadlocked inside its own task with eight or nine threads asleep and its own single send right, and boot 59 confirmed single-core is not the cause (extra cores supply no signaler). What has no reading yet is the sentence \"five workers sleep on one kqwl and no new one was ever created\": for a wlwait waiter the wait event IS the struct knote -- kdp_workloop_sync_wait_find_owner in bsd/kern/kern_event.c opens with kn = (struct knote *)event, then knote_get_kq(kn) and a KQ_WORKLOOP check -- so from the waiters r265 already lists the census can reach the kqworkloop and print what the kernel thinks about it: kqwl_request.tr_state and tr_thread (did XNU ask the workqueue for a thread, and did one get bound), kqwl_owner, kq_state bits, kq_count/kq_p (events queued and unhandled) and kqwl_dynamicid to prove the five waiters name one loop. Branches fixed in advance: tr_state at WORKQ_TR_STATE_IDLE with kq_count=0 means nothing ever arrived, so the question is who was supposed to post -- that is an outside-the-process answer and sends the search back to the plugin chain; a request in BINDING/BOUND state naming a thread that is itself asleep is a within-loop cycle and the next cut is that thread's wait; a request asked and never bound means the workqueue refused to add a thread, and the cut is the thread-count limits in bsd/pthread/pthread_workqueue.c for this proc. Deferred, not discarded: the cpu_start() attempt counter (calls + cpu bitmask + a boot-count sentinel) is the fidelity line item -- its shape is recorded in notes/development-log.md so it cannot be lost, and it is worth a patch only after the desktop question is answered, because it does not unblock anything.",
    "The flash path is proven end-to-end rather than assumed: boot 56 went recovery -> adb reboot bootloader -> fastboot flash cache -> the 1800 s deadline -> recovery, and the round268 gate printed 'the boot count moved: 55 -> 56' before any reading was trusted. The four minutes of USB silence after the hop were enumeration latency, not a dead board -- the flash landed and the frame is real.",
    "r273 is SHIPPED (v0.6.62, image b35a50b9516005c78c22eb02d2321fbc78fdcfe29ff193bd0ad6850f9febff34) and supersedes the plan written above; boot 61 reads it. Three shapes decided in advance: a row with tr=0 and ow=0 means the kernel never asked the workqueue for a servicer on that loop, so the search goes back to whoever was supposed to post onto it -- outside the process, the plugin chain again; a row with tr=4/5 (BINDING/BOUND) whose tt= names a thread the same census prints asleep is the within-loop cycle, and the cut is that thread's own wait -- boot 59's owner=3b7 lands here if it turns out to be kqwl_owner rather than a bound request; tr=1/2 (NEW/QUEUED) with tt=0 means XNU asked and the workqueue never added a thread, and then the code to read is bsd/pthread/pthread_workqueue.c's thread-count limits, not the wait graph. dyn= decides whether several waiters name one loop, kqpid= says whose process owns it. If every fire prints wl=0 the workloop is not where the debtor waits in this boot, and the next question is whatever wait the rows show in its place. Still deferred, recorded so it is not lost: the cpu_start() attempt counter (cs=/bits= printed late with a boot-count sentinel), the ull_opcode reading for the UserLock kind, and naming the debtor's main-image frames.",
    "r274 asks the one question the reading leaves, and it is the item I had parked on the fidelity list: the main image's load address. Shared-cache frames are already nameable (slide pinned by the sbm2x byte search), but frames 1..4 of the bound servicer are datamigrator's own Mach-O, so without its base I cannot say which call inside the workloop service path waits on that semaphore. The census already holds peer->map (round266 took its pmap from there), so print the first few vm_map_entry start/end pairs as clover r274: map t= pid= e0s= e0e= e1s= e1e= e2s= e2e= e3s= e3e= and let the host subtract. Local ~/clover-out/datamigrator.macho then turns the four addresses into functions. With names the fork is explicit: either that code must not block synchronously inside a workloop (post/redrive instead), or the signal it waits for belongs to a thread this same loop has parked -- different cuts, and I should not pick one before I can read the function. One question per round: no semaphore re-read, no knote ident, no wq counters in the same flight.",
    "r274 is SHIPPED (v0.6.65, image bc04e7f2) and boot 61 reads it. Expected: e0 is __PAGEZERO (0-0x100000000) and e1's start is the base datamigrator's __TEXT was loaded at, so subtracting it from 0x101177d50 / 0x1011799fc / 0x10117a1a0 / 0x1011743d0 gives four vmaddrs inside __text (0x100003040-0x100012b38 in the local ~/clover-out/datamigrator.macho), which name the function that takes the semaphore inside the workloop service path. Two outcomes and they are different cuts: the caller is datamigrator's own plug-in/step machinery, and either it must not block synchronously inside a workloop (post-and-return, or let libdispatch redrive), or the post it waits for is owed by a thread this same loop parked -- the five waiters and 35f are all that is left of the process, so the second case means the dependency is a cycle in the code, not a scheduling shortage. If ne= is small or none of the four frames falls inside e0..e3, the image I assumed is not the one mapped there and the next round prints more entries or the vnode path instead. Still deferred: the cpu_start() attempt counter, ull_opcode for the UserLock kind, and the shared-cache slide for a boot whose r221 row is absent.",  "r274 added no configuration key: the kernel patch is 48z-clover-r274.patch (one file, four hunks, pure additions in osfmk/kern/task.c), the tee class is r274-map (32), and board.toml's title is the reading above. r275 changes the object of the question, not the instrument family: census PreBoard (the process that would owe the unlock notification) in the debtor's shape -- threads/wait/run plus per-thread hints and stacks -- and print one line saying whether any AppleKeyStore service exists in the IORegistry, because sheng reaches the desktop with its own AppleKeyStoreState (package/KeyStoreProbe.cpp behind sheng-aks=1, answering 'no passcode, unlocked since boot') rather than a real SEP. No lock-state emulation, no MobileKeyBag answers and no keystore driver until that wait is actually measured. Still owed from r273: rows fewer than wl= is a tee drop and never a fact, and the cpu_start() attempt counter stays behind the desktop question.",  "read r275 on boot 62 (flights/boot63-r275): class=0/userclient_class=0 with a finished walk is the green light to port sheng's NativeKeyStoreEvents behind an owned-probe boot arg, which needs .late.o staging in scripts/build-clover-gop-legacy-display.py and a board-side probe twin that prints its counters on the beat instead of into boot_progress_ext (CONFIG_XNU_BOOT_PROGRESS=n here); class=1 means a service of that class already exists and the question becomes who registered first and who owns the UserClient, which is where the deferred PreBoard census earns its place; walked=/stopped=1 means the round measured nothing and the walk budget or the census window has to be fixed before any keystore conclusion is drawn.",  "r276 ports the keystore now that its precondition is measured: vendor drivers/NativeKeyStoreEvents into the device repo (already compiled clean here with the real arm-driver flags, 242664-byte object, source unchanged), add package/CloverKeyStoreProbe.cpp supplying its six externs behind clover's own boot args offline-key-events=1 and clover-aks=1, stage it through the same .late.o treatment as NativeHidInput (strip __DATA,__mod_init_func, globalize __GLOBAL__sub_I_NativeKeyStoreEvents.cpp, require identical __text), call it next to clover_hid_input_probe() in native_legacy_display_late_probe(), and print the counters on the beat because CONFIG_XNU_BOOT_PROGRESS=n here. Decision written in advance: class=1 and keystore_services>=1 on the next boot with the semaphore wait gone is the win condition; class=1 with the wait unchanged means the notification is not what datamigrator waits for, and the PreBoard census -- thread table plus per-thread hints and stacks -- becomes the round instead.",  "read r276 on boot 63 (flights/boot64-r276): aks class=1 with ks_classes>=1 and stage=3 is the publish confirmed by the same instrument that certified the precondition; class=1 with ks_classes=0 means the census' folded match is still blind and that is an instrument bug to fix before any conclusion; stage=0 means the probe was never called, which points at the entry-point wiring rather than at keystore semantics. The verdict that matters is on the debtor, not on this row: whether the semaphore census line still reads count=-1 with hit=<the debtor itself> and whether the five r273 workloop waiters persist. If the class is published and the unlock wait is unchanged, datamigrator is not waiting on this notification and the next round is the PreBoard census planned in the r274 note (threads/wait/run plus per-thread hints and stacks) -- not a second keystore knob.",  "read r277 on boot 64 (flights/boot65-r277): no relay row at all means the sampler's beat never reached the census and the next cut is the beat producer, not the walk; enter with no walking row means the census died between the metaclass lookup and iterateOver; a walking= that stops at N with no end row names the position; and an aks relay row carrying class=1 proves round276's publish happened and was merely never carried, which reopens the semaphore question directly -- the boot 63 reading already suggests the unlock wait is gone while the five workloop waiters persist, so if the keystore is confirmed and the desktop still does not appear, the next round is the PreBoard census planned in the r274 note (threads/wait/run plus per-thread hints and stacks), not another keystore knob and not the GPU.",  "read r278 on boot 66 (flights/boot67-r278): the first question is how far the boot gets. If it reaches the deadline with a panic record and the census relays enter/walking/end plus aks with stage=2, service=0, ks_classes=0 and class=1, the keystore port is innocent up to the published service and round279 removes the gate and investigates the user-client contract (opens, refused opens, selector histogram) as the thing that ends the board. If the boot still stops before 1500 s with no panic record, the gate is not the difference and the next cut is to drop the vendored driver objects from libNativeLegacyDisplay.late.a while keeping the probe's counters, which separates linked code from boot argument. Either way round277's relay rows get their first real reading, and the clover-aks-nosvc knob must not survive the answer.",
    "boot 68 (round280, artifact to be ~/clover-out/round280-v0.6.74-payload.img) is read from one late table instead of a stream of event rows, decided before the flash: no `aks late` row at all means the timer never fired or the tee lost it, and then the census counters -- opens=/calls=/sel7=/sel14=/sel17=/sel35= -- are the reading and the next cut is handing the table to the census (a board patch); `open 0 pid=... comm=datamigrator` with rc=0 rows puts the remaining stall downstream of the keystore, so the next cut is that workloop's five waiters; an all-`e00002c7` table means the callers were rejected and the client contract still needs filling.",
 "Boot 78 leaves one question worth more than any new register: what stopped the machine twice with no panic, no deadline and no last words. Round292 therefore (a) names watchdogd+0xab0c's callee on the host -- the OS volume mount path is already established, so this costs no flash -- and (b) puts a timestamp on the driver's own channel: one CNTVCT-bearing heartbeat row into the verdict ring, written without msgbuf, so the next silent death has a bound that does not depend on the kernel still being willing to print. The GPU cell waits for a sourced CPR4/LDO enable sequence and is not the bottleneck.",
  "Boot 80 is read against four pre-registered branches, in this order. (a) The flight groups should all name boot 80; a group still stamped with an older boot means the extraWords==0 condition in flightWrite is wrong and the round's central fix did not ship. (b) If the deadline and panic slots print STALE for boot 80, this is the fourth silent reset -- and the new DMA row is then the only fresh distinction: spin means this driver stopped looking before the card's budget ran out, deadline means the card held the line past 600 ms. (c) A beatmagic equal to BEAT283 alongside \"unnamed\" makes the channel ours and indicts the reset hook itself; a different magic retires the 0x660 slot as a channel outright, which r196 already argued and r283 re-broke. (d) A third boot of armed=0 on 0x17817000 moves the hardware question to AOP/PON, where this register has no reach. The desktop blocker is unchanged: backboardd's single outstanding XPC request to datamigrator and the five waiters on the debtor workloop.",
  "Boot 82 answered round294b before anything else could: the archived round289 image, second run of the same bytes that reached 1800 s on boot 76, silent-reset at 707.103272 s -- so the payload is not the variable, the GPU line is out of the reset-suspect list, and the planned clover-gpu=0 bisect is cancelled rather than run. round295 therefore spends its board time on the desktop chain, not on the reset: widen peer=/comm= past 15 characters (positive control -- pid 58's row must print com.apple.backboardd in full), then walk the send chain transitively for four hops instead of censusing the two hardcoded pids, printing each hop's pid/comm/remote-port/outstanding-send and an ending reading (no_send, no_owner, self_reference, depth_limit). Criteria were fixed before the flash: a chain that ends at a task whose threads show dl=0 and sr=0 is the leaf and the next round asks why its answer never comes; a cycle means two services wait on each other and the fix is whoever breaks the ring first; a chain that reaches com.apple.SpringBoard sends this line back to the round206 SIGKILL shape; four hops not enough means more depth, not more guessing. Alongside it, and independent of the payload: run-clover-unattended.sh should snapshot /sys/class/power_supply, /sys/class/thermal and the first bytes of by-name/rawdump the moment TWRP's adb appears, because the boot-82 physical readings were nine minutes late and cannot speak for the moment of the reset.", "r295 is SHIPPED (v0.6.99, payload sha 81853304..., kernel e698a3e5 / amfi 2507bfc0 / normalized 65dd99c3, patch zzzz...zz(54)-clover-r295.patch) and it repairs the instrument before asking the question again: p_comm is MAXCOMLEN+1 = 17 bytes (bsd/sys/param.h:95), so widening the reader recovers nothing the field never held -- the untruncated name is taken from the executable's vnode in bsd/kern/proc_info.c, the one file of this tree where struct proc and struct vnode are both complete, through vnode_getname()/vnode_putname(), called with no task lock held because that KPI takes the name-cache lock and can allocate, and stamped with a four-state ex= (ok/noproc/notext/noname) so a blank exec= says why it is blank. clover_bb_chain replaces the one-hop census: four hops, one row each, and every stop is a printed verdict (lock_busy/no_trap/no_send/no_owner/self_reference/cycle/depth_limit) with a visited-pid guard; peer references are taken and dropped only through clover_bb_peer_task and it never calls clover_bb_sample, so waiter-equals-debtor cannot recurse. The tee class is 128 rows and exempt from the per-pass cap, because a chain the cap cuts at hop four is indistinguishable from a chain that ended at hop four. That host snapshot also shipped: run-clover-unattended.sh now grabs power_supply, thermal and the rawdump header at the first moment recovery's adb exists, before reading the card. Boot 83 is read against criteria written before the flash: hop=0 must print exec=backboardd (a - with ex=noname means truncation was not this instrument's only fault and the chain reading waits); hop=1 should be datamigrator; hop=2 is where com.apple.migration and com.apple.migrationpluginwrapper separate -- for the desktop those are two different things. GPU stays untouched (boot 82 cleared it as a reset suspect) and the reset-source line now waits on several boots of the automated landing snapshot rather than on new payload code.", "boot 83 read back what r295 asked and the instrument held: hop=0 prints exec=backboardd ex=ok (the positive control), all six rows carry ex=ok so the second name source never came back empty, and every hop row ends with a verdict. The debt chain is now named end to end -- 58 backboardd -> 148 com.apple.datamigrator -> and the leaf differs between the two fires (t=657 pid 166 exec=osanalyticshelper, t=797 pid 202 exec=com.apple.migrationpluginwrapper), which is how boot 82's two-candidate ambiguity resolved: it is the plugin wrapper, and the pid moved from 187, so the old pid must not be cited. datamigrator's own send changes port and target per fire (5403 then 5907), so 'datamigrator waits on X' needs a timestamp with it. The leaf's end=no_send is the round's remaining instrument gap and r296's whole subject: the code's no_send means the thread inside the mach trap has x3==0, i.e. it is receiving only, and because the capture rule keeps the first thread with x3!=0, that thread's rcv=/to= and the receive-side rmc/sr were never read -- so the card cannot yet say whether the reply is already queued. r296 reads those three and the four branch criteria are written in notes/development-log.md. Boot 83 is the seventh silent reset in the same band (kind-20 records 0 under this boot, the panic markers still read boot=76 with STALE never-entered-the-sink, the deadline slot is still the un-stamped old record; landing bounded by host wall clock to 884-1253 s of uptime), the WDT row reads en=0 armed=0 with no chg for an eighth boot, and the last card activity is 829.762 s of kernel ring / 909897 ms of flight against a reset near 1200 s. The landing snapshot ran on its own for the first time, about 25 s after the reset, and immediately showed why the nine-minute-late one was biased: charger_temp=322 with status=Charging versus 294 and Full nine minutes later, so late readings understate by roughly 2.8 C -- enough to make 'not hot at reset' an unsupported claim rather than a refuted one; rawdump's first 512 bytes are still all zero, so no ramdump is staged for the seventh reset either, and emmc_therm's -40 is an unconnected sensor, not a reading.",
  "Round296 SHIPPED (v0.7.0) and adds no configuration key: one kernel patch (55 z then -clover-r296.patch, six hunks all inside clover_bb_chain in osfmk/kern/task.c) rewrites the chain row in place -- cap=send|recv|none says whose thread those three count columns describe, the receive-only thread's rcv=/to= go back into the existing columns, and qmc=/qsr= are that receive port's own msgcount and send-rights, read with the existing clover_sb_port_mail() (translate prefers RECEIVE, takes only the object lock, allocates nothing, blocks nothing) called after lck_mtx_unlock() the way r295 requires for vnode_getname(). no_send keeps its name on purpose so boot 83's rows still line up. check-clover.py pins the whole printf literal, the three cap values, the frcv capture, the mail call on frcv, seven end= verdicts, byte identity with the loader copy, LATE_PATCH order (r296 before r295 because it rewrites what r295 wrote), the sdhci r296-chain class and its per-pass exemption, and now also forbids thread_block( inside the walk; verify-clover-payload.py requires the r295 literal to be gone from the kernel while still present on the deletion side of the r296 patch -- that is what proves a rewrite rather than a second similarly-shaped row.",
  "Boot 84 read it back: the leaf row is cap=recv thid=2e5 rcv=1917 remote=0 to=ffffffff qmc=0 qsr=0 end=no_send, so r296's positive control held (rcv is not zero -- that thread really is inside MACH_RCV) and the chain is one hop deeper than boot 83: backboardd(58) -> com.apple.datamigrator(144) -> com.apple.migrationpluginwrapper(189) -> installcoordinationd(126), the last one receiving. Of the four pre-registered branches (b) is the one lit: the port it waits on holds no message (qmc=0) and reports no send rights (qsr=0), so who was supposed to hold the right to speak to it is an image-side question; (a) and (c) are excluded. (d) holds literally but must be discounted: to=0xffffffff is finite, which at the conventional millisecond unit is about 49.7 days, and this boot had roughly 110 s left before its own deadline, so it is not a wait that wakes itself -- and the unit is an inference from the convention plus the send-side to=0 in the same rows, not something this board measured. Recorded so nobody over-trusts it: in a cap=recv row rmc=/rsr= are un-read initial values, so the four zeros on that line are two readings and two absences.",
  "Next for the desktop line (r297): port names are per-task indices, so hop=2 remote=7f07 in 189's space and hop=3 rcv=1917 in 126's space cannot be compared by this instrument, yet branch (b) only means something if they are the same port. r297 prints the ipc_object identity the mail read already has in hand (robj=/rvobj=, plus same=1|0|? against the previous hop). Two branches fixed before flashing: same object with qmc=0 means the request never entered that queue or was already taken by another thread, and the next step is the kernel-side enqueue/wake path; different objects mean installcoordinationd is listening on a port other than the one the request went to, and the next step is a census of its own ipc entries (r234's route) naming that object's index and its msgcount -- the shape of a message queued where nobody listens.",
  "Boot 84 also ends the silent-reset streak without any control changing: it lived to its own deadline (--flight prints deadline fired after 1800 s at t=1802889 ms boot=84 ps=0x01f800f0 elapsed=1800.014s, both panic stage rows stamped boot=84, and the report window holds a kind-20 record for boot 84 for the first time since boot 76). The 707-1335 s band keeps its six entries; this is an eighth sample landing outside it, not a refutation. r281 wdt printed three rows with t= moving each beat (positive control) and still read en=0 armed=0 intmask=0 sts=0 with bark/bite at reset values, so APSS stays excluded. The r283 last-reset row appears zero times in this window and that is the ring horizon, not a reading: the window covers 1449.77-1815.14 s and that row lives earlier, with its copy in the flight region. Landing snapshot run two: charger_temp=327, battery 26.0 C, status=Charging, directly comparable to boot 83's 322/25.0 because both were taken at landing; emmc_therm=-40 is an unconnected sensor. rawdump head zero for the third boot running.",
  "Boot 85 is the control round for v0.7.0: the identical image (round296-v0.7.0-payload.img, sha 8557297c...) was cold-flashed again at 16:02 to separate 'is the instrument stable' from 'is the ending a property of the image'. Instrument: stable -- eight r296 rows in two fires, the same four-service chain (backboardd -> datamigrator -> migrationpluginwrapper -> installcoordinationd), the leaf again cap=recv with qmc=0 qsr=0, and the only things that changed are the pids (144/189/126 -> 147/191/119) and the port names (remote=7f07 -> 5707, rcv=1917 -> 1e0b). That is the cross-task-index problem presenting itself a second time, unprompted. Ending: not a property of the image -- boot 85's newest card activity is flight entry seq 241088 at t=1680923 ms and there is no boot-85 deadline record and no boot-85 panic sink marker (both still boot 84's, printed STALE), so this is the seventh silent no-panic reset, bounded from above by the missing deadline record rather than by the wall clock: it stopped between 1681 s and 1800 s. The band is seven entries (718/1184/1248/1335/997/707/this boot) and 'when does a boot end' is now a distribution on one payload, which completes r294b's 'the load is not the variable': the image is not the variable either. WDT printed twice with t= moving (1468.178, 1592.118) and still en=0 armed=0 why=ctrl; clover r283: reads zero in a window spanning 1387.0-1675.0 s, which is the ring horizon with the copy in the flight region, not a reading. keystore counters kept climbing (stage=3, opens 88->100, calls 387->442, owner=IOResources). Landing snapshot three: charger_temp=327 / status=Charging / die_health=Cool, matching boot 84's landing value, and rawdump head all zero for the fourth boot running.",
  "Round297 SHIPPED (v0.7.1) and boot 86 is running it: patches/xnu-clover/zzz(56)-clover-r297.patch adds clover_sb_port_obj(), which translates RECEIVE then SEND, reads no field, io_unlocks and returns only the identity -- so a port freed between hops can make the comparison say no but cannot fault. Each hop now prints a second row 'clover r297: hop=%u t=%llu prev=%lx rvobj=%lx robj=%lx link=%s', paired with the chain row by hop= and t=. It is a second row because the longest r296 row measured 227 bytes on boot 84 and three %lx pointers plus link=unknown add 79: 306 of a 320-byte record that truncates rather than splits, with end= sitting at the tail. Tee class r297-chain budget 128 plus its per-pass exemption; LATE_PATCH reverses r297 before r296; both gates green (check-clover EXIT=0, verify-clover-payload EXIT=0 with the new bb-chain-link needle pinned whole). No bit is written.",
  "Next for the desktop line (read boot 86 against two branches written before the flash). (a) link=yes on a hop whose qmc=0 means the request was addressed to the very port that is blocked and the queue is empty -- the next cut belongs in the kernel's post-and-wake path, and the verified names to walk are ipc_mqueue_send() and the thread_block(ipc_mqueue_receive_continue) at osfmk/ipc/ipc_mqueue.c:1214 (there is no port_waitq in this XNU; the first draft of this sentence cited one and was corrected before shipping). (b) link=no means installcoordinationd waits on a port that is not the one hop 2 wrote to, which is an image-side question: census its own entry set (r234's machinery) and find where the request actually landed. link=unknown is also a reading: one of the two names did not translate. Positive control that must hold either way: hop=0 prints prev=0 link=-, and every r296 row has a matching r297 row -- half a pair means a class got capped or a literal did not link. A third thing worth recording if it appears: robj stable across the two fires of the same boot says the port is not being rebuilt between fires.",
  "GPU line stays read-only and its cell is now named precisely: map the DT-declared CPR4 fuse window (cpr4-ctrl@05061000, second reg = <0x00784000 0x1000> in sdm660-regulator.dtsi:536) and read fuse rows 65, 71, 73 at +0x208/+0x238/+0x248 -- the stride is cpr3-util.c BYTES_PER_FUSE_ROW=8, archived with sha256 2f3c672d... -- because those three rows are what the vendor's ldo_mode_allowed() consults before vdd_gfx may enter LDO mode at all. This needs a fourth IODeviceMemory::withRange (the driver maps three today: GCC 0x00100000, GPUCC 0x05065000, GPU core 0x05000000), so it deliberately ships as its own round rather than folded into the kernel patch: if a boot goes wrong with both in it, nobody can say which one did.",
  "boot 86 = round297-v0.7.1-payload.img (66d2e29b, kernel 0e7bb9fc -> amfi 370c781d -> normalized b8044988) read with scripts/run-clover-unattended.sh: eight r296 rows paired with eight r297 rows in two fires (t=1131, t=1399), positive controls held (hop=0 prints prev=0 link=-; every chain row has its partner), and the link column came back in all three states -- no for every pair where both names translated (hop=1 in both fires, hop=2 in the second), unknown at the hop the question was aimed at because the leaf's rcv=d03 does not translate into an object in either fire. So branch (a) never appeared and (b) only half lit: the walked chain is not a request/reply chain, but the decisive comparison is unread.",
  "boot 86 also withdrew a reading this file recorded twice. qmc=/qsr= and rvobj= share one translation -- clover_sb_port_mail() and clover_sb_port_obj() both try RECEIVE then SEND and both return with the out-parameters at their initialised 0 when it fails (osfmk/kern/task.c:11364-11379 and :11410-11423). The leaf's name demonstrably fails to translate, so boot 84's and boot 85's qmc=0 qsr=0 have two readings (nothing queued, or the queue was never read) and their rows carry no return code to choose between them -- the image-side verdict (b) loses its support rather than being refuted. The same round exposes a second defect: rvobj translates frcv (the first thread found inside the trap, task.c:12772) while a cap=send row prints nrcv (the first thread whose x3 is non-zero, :12781), so hop=0's rvobj=0 is ambiguous. The leaf is unaffected because cap=recv sets the two equal.",
  "Round298 is designed against exactly those two defects and answers the question without needing the failing translate: every translation carries its own return code (rerr=/verr=), the row says which name rvobj used (vname=), and hop N reads ip_receiver_name and ip_receiver off the object its own remote= names (tname=/tspace=) beside this task's itk_space (space=), printing tlink=yes|no|unknown. Those two fields are the receiver task's own name and space for that port -- written by ipc_port_init() at osfmk/ipc/ipc_port.c:846-847 and cleared when the receive right dies -- so tname compares with hop N+1's rcv= inside one address space, which is the comparison port names could never support across spaces. What is deliberately NOT tried is a walk of the space's is_table: that needs the space lock, and this chain runs beside a wedged userland.",
  "The silent-reset line grows its eighth entry and stays a distribution: boot 86's ring ends at 1711.714 s, the flight region's newest entry is a launchd 8-block write at t=1701831 ms with the card answering normally, and there is neither a boot-86 deadline record nor a boot-86 sink marker (both still boot 84's, printed STALE) -- so the reset lies between 1712 and 1800 s, the bound coming from the missing record rather than the wall clock. Band: 718/1184/1248/1335/997/707/1681/1712-1800 s, three outcomes on one payload family. WDT read en=0 armed=0 for a tenth consecutive boot, the landing snapshot ran a fourth time (charger_temp=327, die_health=Cool, rawdump head all zero for a fifth boot), and the r283 line arrived unnamed again with the full column set.",
 "boot 87 (round298-v0.7.2-payload.img, image ccd22262) is read from the r298 row and answered the question r298 was built for: tlink= came back no at hops 1..3 while each hop's tspace= equals the next hop's own space=, so the chain is confirmed at task level and the missing piece is which thread of that task waits on the received name. The positive controls that had to hold did: no clover r297 row anywhere, 8 r296 rows paired with 8 r298 rows, hop=0 printing prev=0 link=- tlink=-.",
 "next on this area, in order. (1) r300 SHIPPED the fire self-attestation (v0.7.4, z*59-clover-r300.patch, tee class r300-fire 64, exempt from the per-pass push cap) and boot 90 read it as nothing at all: fire and done are themselves 0 rows, and the kernel ring's seq runs 1194..1705 with no gap, so the verdict is 'not measured', not 'no tail' -- the mistake was mine, both rows ride the pipe they were built to audit (printf -> msgbuf -> tee -> card ring). One correction that control round bought: the missing tail was never one suspect -- r262 is NOT in the tee's per-pass exemption list (its class budget of 384 was far from full), so throttling is a legal explanation for the thread rows, while r296/r298 ARE exempt with class budgets of 128 unreached, so their absence cannot be read as throttling at all; boots 88 and 89 show both absences together, which is why done= carries th= and chain= as two numbers rather than one. (2) r301 SHIPPED the second copy for the highest-value sentence on this board (v0.7.6, drivers only: gPanicStash + the drain's r301 rows, negative-asserted to stay out of the tee table) and boot 91 gave it no reading at all -- no drain enter, no r301 row, the sixth shape outside the five pre-registered branches. What boot 91 exposed instead is one step more basic: the panic marker and the live block request share gFlightBlock, and because that buffer is streamed to the card while other call sites rebuild it, the record the reader finds is a hybrid that decodes as a reading (boot 88 has the identical hybrid, so this predates r301). The host reader now rejects such a slot and prints the scene fields instead, which stops the misreading; The device-side payment is SHIPPED as r302 (v0.7.8, drivers only): gFlightMarker is a buffer the verdict events own, CLVM signs each verdict in the word after its own extras, the sentence is written blind into sector 44 + boot id % 12 with nothing read first, and it happens inside the sink so no later flush is needed. Boot 92 read r302 back and landed on two of the seven pre-registered branches -- marker side (a) magic=yes and sentence side (f) blind ok=0 chars=352 (notes/development-log.md section 'Round302 reading'): the exclusive buffer and the CLVM signature hold, the sentence still cannot reach the card, and the sink refuses every flight write after its first while the verdict ring keeps landing, so the next device move is r303 -- give flightPanicText and flightPanicMark a writePioBlock failure self-attestation the way r298 gave the translations rerr=/verr=, so ok=0 stops meaning just 'refused' and starts naming what refused it. After that, the same non-pipe copy still has to be applied to r300's own two rows before the census-tail question can be closed -- until they get a copy too, their absence stays uninterpretable. (3) The image-vs-core-count control round for that tail is still owed and deliberately not run: either an eight-core boot with armcpu-smp off or a pre-r299 image with it on, one variable only. (4) The mainline debt, unchanged and still free of the 'one core is starved' alternative: census the receiving task's own ipc entries for the name its sender wrote to (tname= 0x3207/0x3507/0x2903) and say whether any thread waits on it -- the r233/r234 entry machinery already reads those tables. (5) One word closes r298's own residual: print the ipc_entry bits that ipc_right_lookup_read() already returns (vbits=), which separates port set from send-once without needing an object, and give qmc=/qsr= a return code of their own so the 'a 0 only counts when its own code says 0' rule can also be applied on cap=send rows.",
 "boot 88 (round299-v0.7.3-payload.img, image fda745f8) read the SMP question and it came back positive -- r271 real=8 max=8 reg=8 start=7 run=8 with per-core timer counts on all eight, r299 req=1 con=1 run=7 st=07777777 fl=0 rc=0 x7, r270 sent=344711 recv=344557 where boot 87 read 0/0 -- while the desktop blocker did not move at all: the same fire printed pid=58 threads=17 wait=17 run=0 and the backboardd send still reads cnt=0 ql=6 sr=1. Eight cores is therefore an excluded explanation for the missing reply, on hardware, in one reading. What did change is the reset line's shape: this boot is the ninth silent no-panic reset and the family's earliest (kernel ring ends 835.009 s, no boot-88 deadline record and no boot-88 sink marker, host pulled the card at 19:14:16 after an 18:58 cold flash), whereas v0.7.0-v0.7.2's four boots either reached 1800 s or stopped after 1681 s. Load and image are already excluded as variables (r294b, boot 85), so core count is the remaining one -- and one sample is not a result: the next move on this line is a control boot of the identical round299 image, the way r294b re-ran round289. WDT en=0 armed=0 for a twelfth consecutive boot, keystore opens 9->25 calls 29->79 refused=0, I2C verdict=102 twice, GPU census unchanged, zero dma-deadline rejections this window, landing snapshot seventh (charger_temp=327 temp=250 die_health=Cool) and the rawdump head all zero for a seventh boot.",
  "boot 89 = the control boot for the eight-core image (round299-v0.7.3-payload.img, image fda745f8, flashed unchanged with scripts/run-clover-unattended.sh --flash-cache --boot-after-flash --allow-misc-bcb --out round299-control-boot89-window.bin). Instrument: the census header, r270, r271 and r299 all arrived and the r299 row is boot 88's row byte for byte; the thread rows and the chain rows are absent again (0 of each), where the round298 image's boot 87 put 33 r262 th rows and 8+8 chain rows in a comparable ring. Outcome as first written: tenth silent no-panic reset, ring last line 661.003 s, flight's newest entry for boot 89 a block read at 650.759 ms by pid 252 mapssync with stuck=1 recov=1, newest beat 536.228 s, no kind-20 record for boot 89, no deadline record (the card's still names boot 87), and the second panic slot is an unwritten one (boot=0 gates=0x0()). Reading: the absence of the fire tail is a property of this image, not of one boot, and r300 is the instrument that says which mechanism. CORRECTED BY BOOT 90, twice: silent is the wrong word for boot 89 -- this window carries drain enter boot=89 verdict=1 tee=1 append_rc=2, panic tail ... boot=89 lap=30 and drain exit boot=89, and panicDrainRings() has exactly one caller (clover_emmc_panic_append), so boot 89 reached the panic sink and only its text was refused; and 'a property of this image' is no longer supported either, because boot 90 shipped a different image and lost the same tail (see the next entry).",
  "r300 is SHIPPED (v0.7.4) as the instrument round: kernel f87752bb after amfi at file 0x1ad70e4/0x1ad716c and normalisation, payload e48677987c2dbe351ce63f52b5d114049d9eb547c1f83a546c6431841c7d0d26, 58720256 B, six files in EFI/UniXNU/Payloads (compared against the r299 image: only the kernel grew), ADT 14384 B with 8 cores. It adds no boot argument and changes no hardware path -- two printf rows, one fire counter and two row counters in osfmk/kern/task.c -- which is what makes boot 90 usable as the control for the reset-band claim as well as the read-back of the instrument.",
  "boot 90 (round300-v0.7.4-payload.img, image e4867798, host pulled the card at 20:56:05 after a 20:43:07 cold flash) read r300 back and it answered nothing: clover r300: fire and clover r300: done are BOTH absent from the card, 0 rows each. That is not the ring horizon -- I walked the 512 kernel-log records and their seq runs 1194..1705 with no gap, so the card-write layer lost nothing, and the r299 row of that fire is seq 1657 (t=698.750532) while seq 1658 is somebody else's row 227 ms later (t=698.977911). Every one of the five pre-registered branches starts from a fire row being present, so all five missed and the reading is the sixth shape: not measured. The instrument's own fault is named in the log: those two printf rows ride the same pipe they were built to test (kernel printf -> msgbuf -> tee -> card ring), which is exactly the one-copy-that-does-not-use-the-tested-pipe rule, and I printed the copy inside the burst.",
  "boot 90 also ended the silent-reset naming: the flight panic slot reads panic seq 0 slot 0 t=686630ms stage=0 log_ready=1 host=0x20fdf rc=0 boot=90 gates=0x7(armed,bcb,text) -- the entry marker landed and the exit one did not -- and the verdict ring carries drain enter boot=90 ... append_rc=2, panic tail lines=3 unseen=0 lap=29, r184: panic drain wrote=0 and drain exit boot=90. panicDrainRings() is called from one place, inside clover_emmc_panic_append, so this boot reached the panic sink; append_rc=2 is panicAppendText() failing on the READ it does before writing (CloverSdhci.cpp:8824) while host=0x20fdf says the controller was owned at that instant, and the sink tries once and never retries. Consequence: no kind-20 record for boot 90, so the panic sentence -- which is the one thing that would name this family's deaths -- is lost even though the death was named. Same reading for boot 89 (append_rc=2, lap=30). Clock alignment (boot 87: sink marker at 1803.044 s against a ring that ends at 1814 s; boot 90: newest flight entry 736.590 ms against a ring line at 746.396 s) puts the driver clock ~9.8 s behind kernel seconds, so boot 90 entered the sink at kernel ~696 s and the census fire whose tail vanished is at 698.75 s, inside the window where the guard was owned -- flight shows 148.669 s between the newest beat (587.938 s) and the newest block entry (736.607 s), with card busy 5285 ms at 715.8 s in the same frame. This is registered as a shared suspect, NOT as a cause: boot 88 never entered the sink and lost the same tail.",
  "Three instrument debts are open after boot 90, in the order they will be paid: (1) r301 -- the panic sentence needs a copy that does not go through the pipe the sink is using: keep the text in RAM when the append returns rc<100 and let the drain say it into the driver verdict ring, which demonstrably reaches the card on boots 89 and 90; (2) the tee's own status row (r175: tee seen= kept= throttled= lap=) is capped at 12 prints per boot (kTeeCensusMax) and boot 90 spent all twelve by seen=3191 with lap=2, so the late numbers -- the only ones that could separate a lapped burst from an unprinted one -- are unreadable; the panic drain's lap= is the sole surviving late count (53 for boot 87, 30 for boot 89, 29 for boot 90, so per-second lag is comparable and does NOT explain the tail); (3) the census tail's loss correlates with core count (single-core boots 86/87 delivered 41 and 33 thread rows; eight-core boots 88/89/90 delivered none) and the image-vs-cores split needs a whole control round of its own -- either an eight-core boot with armcpu-smp off or a pre-r299 image with it on -- so it is registered, not run.",
  "r301 is SHIPPED (v0.7.6) as the payment for debt (1): the panic sentence now has a copy that does not ride the pipe the sink is tested on. Drivers only -- no kernel patch, no boot-arg, no tee class, no change to panicAppendText()'s one-shot shape (its rc encoding is the patcher's contract). clover_emmc_panic_append copies its argument into gPanicStash (kPanicStashBytes=480, the same cap as a report record body, non-printing bytes folded to spaces) immediately after it raises gPanicActive and before flightPanicMark (0, 0, text != nullptr), so the copy exists before anything can refuse; panicDrainRings() then says it into the driver verdict ring in kPanicStashPart=240 character pieces (CloverSdhci r301: panic text rc=%u chars=%u part=%u %s), gated on gPanicAppendRc < 100 because rc >= 100 means the kind-20 record landed and repeating it would make the host read one panic as two, and it always says the status row CloverSdhci r301: panic copy rc=%u chars=%u said=%u. The reason a queued ring row is a better bet than a second block write is measured, not assumed: boot 90's five drain rows (drain enter, panic tail, r184: panic drain wrote=0, r229: tee filter, drain exit) are on the card as kind 21 slots 40-45 said by driver with valid sums while saying wrote=0 themselves -- the drain wrote nothing, the periodic flushes during the panic screen's 15 s reset delay retried the ring and landed. check-clover.py pins both format strings, both constants, both ordering rules, the single panicAppendText (text, length) call site, forbids %.*s (a truncated copy reads as a shortened sentence instead of a split one) and adds the negative assertion that no 'clover r301' token may enter the tee table -- if the copy rides the tested pipe the round is worthless. verify-clover-payload.py gained panic-text and panic-copy needles in the r212 cell. Four positive controls were run (drop the stash constant, drop the rc < 100 gate, move the rows after panicProbeFlush, add an r301 tee class), each EXIT=1 naming its reason, and the driver restored byte-identical. While wiring this the checker's three fixed 600/900-character sink-body windows were replaced by slices bounded on the function's closing brace: the new comment block had pushed the calls out of the window and produced three false FAILs. Kernel 527b5d84, amfi/normalised e4450f90 (both AMFI cuts still at file 0x1ad70e4/0x1ad716c), payload d5c2c984bd029c2685e298c9784d57499ec61b574c8aecb54460fc3c1af34e03 as round301-v0.7.6-payload.img. Boot 91's reading is pre-registered in notes/development-log.md section Round301 (5): first ask whether drain enter boot=91 exists at all -- if not, this boot never reached the sink and r301 has nothing to say, which is boot 88's shape and not a failure of the round. With a drain present, panic copy rc=/chars=/said= splits five ways: rc>=100 with chars>0 and said=0 means the record carries the sentence and the copy correctly stayed quiet; rc<100 with chars>0 and said=1 or 2 is the first time this board's ending is readable as words; rc<100 with chars=0 means the screen called the sink with no text, so 'no sentence' becomes measured rather than inferred and the next question is who passes nullptr; rc<100 with chars>0 and said=0 means the ring refused it too, which moves the debt from one copy to no copy and is read against r184 wrote=/dropped= and drain exit probe_pend=; and a drain enter with no panic copy row means the drain broke before the copy, so the RAM itself is in question. Three readings ride along and are NOT this round's conclusion: whether the census tail (r262: th, r296, r298) comes back, whether r300's fire/done come back -- they still ride msgbuf+tee, so debt (1) is only fully closed when they get a copy too -- and whether the ending lands in the 660-940 s band a fourth time.",
  "boot 91 (round301-v0.7.6-payload.img, image d5c2c984, cold flash 21:38, card pulled 21:50) landed outside all five pre-registered branches -- the sixth shape: no drain enter boot=91 and no r301 row of any kind on the card, so this boot gives r301's copy no reading at all. Eight cores came up a fourth time across a third image (r271 real=8 max=8 reg=8 start=7 run=8, r299 req=1 con=1 run=7 st=07777777 fl=0 rc=0 x7 entry=0,a3203000 x7, r270 sent=271685 recv=271562) and the desktop cell did not move (r262 census t=642 pid=58 threads=15 shown=15 hidden=0 wait=14 run=1 rx=9 followed by 0 r262: th rows and 0 clover r300 rows -- the tail is now absent four boots in a row across three images; run= is not evidence). What this boot did show is a worse defect than the one r301 was paying for: the flight region's panic slot reads event=5 dir=3 t=631323ms with word 35 = 91 and the other seven extras zero, while the same record's header carries blocks=8 and a live stage_lba/stage_pid/comm=osanalyt. Enumerating every flightWrite call site proves no single call can produce both field sets: 5/3 comes only from flightPanicMark, while blocks= and a live stage come only from flightEnter and the beat, and the boot stamp is written only on the extraWords == 0 path those two use. gFlightBlock is the one shared record buffer -- each call zeroes it, rebuilds words 0..34, appends extras, and writePioBlock streams the FIFO straight out of that same buffer -- so a concurrent block request during the sink's own transfer rewrites the record while it is being sent and the card receives a hybrid. boot 88's slot is byte-for-byte the same shape, so this is neither r301-induced nor a one-off.",
  "The reading boot 91 forces: both branches stay alive and I do not pick. (a) the sink entered, the marker's first words landed, the append was refused and the drain's rows never got a flush before reset; (b) the sink never entered and the 5/3 pair has another author. They are inseparable because a marker record carries no magic of its own, so any kind-23 record that happens to sit in that slot is decoded as a marker -- the decoder printed stage=91, which is r293's boot stamp read at the stage offset. Fixed on the reader side this round (host only, nothing on the card changed): decode_flight now rejects a panic slot whose written-ness fields are all zero (stamp, gates, log_ready, log_first) and prints it as 'not a marker: its eight extras were never written', keeping blocks/stage/pid/comm as scene evidence, so a hybrid can no longer masquerade as a reading. --selftest builds a hand-made chimera (event 5, dir 3, blocks=8, live stage/pid/comm, stamp only at word 35) and asserts the rejection fires, the line prints, and no line reports stage=91 as a marker; short-circuiting the judgement makes the selftest fail with AssertionError; the restored file is byte-identical. Re-run over three windows: boot 89 rejects comm=chronod blocks=0, boot 91 rejects the osanalyt hybrid, boot 90 output unchanged -- the rule does not misfire on honest records. This stops the misreading; it does not pay the device-side debt.",
  "Band and clock cross-check for boot 91: lower bound 642.684 s from the kernel ring's last line (apfs_trim_to_prev_fsize at 642.683981; this boot's ring carries no panic text row), upper bound about 7xx s from the read-back wall clock minus recovery and dd. The marker's own t=631323 ms plus the ~9.8 s driver-vs-kernel offset measured on boot 87 lands at ~641.1 s, and the flight region's newest request at 631320 ms falls in the same second -- the two clocks cross-validate for the first time, which is what made a hybrid decodable at all. The eight-core family is four boots at four different times (88: 835-9xx, 89: 661-7xx, 90: 746-7xx, 91: 642.7-7xx): the distribution reading has landed a fourth time and being early is now a property of the family, but the image-vs-core-count vote still has not been cast -- only the control round in the ordered entry can cast it.",
  "r302 is SHIPPED (v0.7.8) as the payment for the two device-side debts boot 91 named, and its shape comes from sheng, read first per the board rule (~/UniXNU-sheng: the panic sink never touches the storage stack -- it copies the text into a RAM global, paints the framebuffer and parks; one writer thread owns the only buffer it writes; one-shot records carry magic SHLOG001 with the certifying header written LAST; slots are chosen by slots_written modulo the count, so nothing is read before it is written). Four moves here. (1) gFlightMarker is a record buffer owned by the verdict events alone -- deadline, panic marker and the sentence build there (buf = forced ? gFlightMarker : gFlightBlock) while traffic stays in gFlightBlock -- so a concurrent request can no longer rewrite a verdict while it streams out of the same buffer, which is how boots 91 and 88 got one sector holding event 5/3 next to blocks=8 and a live stage/pid/comm=osanalyt. (2) kFlightMarkerMagic CLVM is written in the word right after the record's own extras and after them (deadline word 46, marker 43, sentence 126), the reader looks it up per event and prints 'magic=absent (pre-r302 payload, or a sector that was never a marker)' instead of inventing a field. (3) The sentence's slot is boot id modulo twelve -- the twelve sectors 44..55 that sat unowned between the entry ring and the beats -- with nothing read first, because the pre-read is the thing boot 90 lost its text on: panicAppendText reads all sixteen report slots to find the oldest, boot 90's read was refused with host=0x20fdf, one attempt, no retry. (4) It is written inside the sink, before the exit marker, reusing r301's gPanicStash and gated on append_rc < 100 for the same reason the ring copy is, so this board's ending has, for the first time, a path that needs no later flush -- and boot 91 is a boot where no later flush came. One block holds 352 of the 480 characters with the full length in the header's blocks= word, so chars < total on the card reads as a truncated record rather than a shorter panic. One trap thought through before touching code: the sentence sits in one fixed sector per boot, so advancing *seqp would push the entry ring's cursor and rotate every request record the next boot reads; seq is gBootId for that event and the increment is skipped, and both are pinned. A status row CloverSdhci r302: blind ok=%u chars=%u total=%u slot=%u is said unconditionally to separate a refused write from a drain that never ran, and r302 is negative-asserted out of the tee class table. panicAppendText's rc encoding, its single non-retried call, and the exit marker's position are untouched. Kernel 1237fa95, amfi with both cuts still at file 0x1ad70e4/0x1ad716c, normalized f2c048bc; payload f26c10376eb0d9f9017d0897b1fd8d27cf55f17305824c999227aa807dd08284 as round302-v0.7.8-payload.img, 58,720,256 B. check-clover.py EXIT=0 and verify-clover-payload.py EXIT=0 with 50 OK plus a new panic-blind-row needle; six mutation controls each EXIT=1 naming its reason (drop the signature line, revert buf to the single traffic buffer, move the blind write after the exit marker, add a readPioBlock to the sentence writer, let the sentence advance the entry cursor, empty the reader's FLIGHT_MAGIC_WORD table -- that last one also fails --selftest); both files restored byte-identical. Boot 92's seven states are pre-registered in notes/development-log.md section Round302 (5): marker side magic=yes / rejected-while-drain-entered (the branch that would move the diagnosis from buffer rebuilding to transfer replay) / neither marker nor drain, and sentence side present-with-words / ok=1-but-absent / ok=0-with-chars / ok=0-with-none. What r302 does not pay: the census tail still rides msgbuf+tee, so r300's fire/done and the thread rows stay uninterpretable until they get a non-pipe copy of their own, and the image-vs-core-count control round is still owed.",
  "boot 92 (round302-v0.7.8-payload.img, image f26c1037, cold flash 22:33, card pulled 22:45) read r302 back and landed on two of the seven pre-registered branches. Marker side (a): the flight panic slot reads panic seq 0 slot 0 t=564828ms stage=0 log_ready=1 host=0x286c8 rc=0 drained=0 boot=92 magic=yes gates=0x7(armed,bcb,text) -- the exclusive buffer and the CLVM signature hold, and boot 91's hybrid (event 5/3 next to blocks=8 and a live stage/pid/comm) is gone; but slot 1 is still boot 87's STALE stage=1 record, so boot 92's own exit marker never landed. Sentence side (f): the verdict ring says CloverSdhci r302: blind ok=0 chars=352 total=480 slot=8 (slot 8 = 92 % 12) and the flight region says no sentence record -- the blind write had 352 characters ready and was still refused. Three writes share one failure: drain enter carries append_rc=2 (the pre-write read inside panicAppendText, same refusal as boots 89/90), the sentence blind write reads ok=0, and the exit marker is absent, while the entry marker -- the first write of the sink -- landed. The asymmetry that matters is in the verdict ring's own timeline (seq 39-52, all boot 92): seq 39/40 are r172: dma cmd lba=27830960 then r159: multi read fail lba=27830960 before the drain, and seq 51/52 are r169: read gave up lba=27830960 then r215: card recover why=gaveup after it, while the drain's own rows land between them -- so the card is not dead, it refuses the sink's flight writes in particular, and the diagnosis moves from 'who rebuilds the buffer' to 'who replays/refuses the transfer', which is exactly what pre-registered branch (b) said the rejected-while-drain-entered shape would do. The report ring's last kind-20 is boot 87 (16 slots, seq 34-49 = boots 52,53,54,55,56,58,59,60,61,62,65,66,74,76,84,87): boots 88/89/90/91/92 all entered the sink and none left a panic record, so append_rc=2 is now five boots in a row. Ending band: beats 416-452 s, sink entry at 564.828 s, flight entries continue to t=645439 ms with every request stuck=1 recov=1, and no boot-92 deadline record, so the reset is after 645 s and before 1800 s -- the eight-core family is now five boots at five times (88: 835-9xx, 89: 661-7xx, 90: 746-7xx, 91: 642.7-7xx, 92: ~645-7xx) and the distribution reading lands a fifth time; the image-vs-core-count vote is still uncalled. What boot 92 leaves as the next device-side move (r303): the sentence now has a write path that needs no later flush, but that write returns false in the sink with no self-attestation -- flightPanicText and flightPanicMark should say why writePioBlock failed the way r298 made the translations say rerr=/verr=, so ok=0 stops meaning just 'refused' and starts meaning what refused it.",
  "Round303 SHIPPED (v0.7.10) pays the desktop mainline -- boot 87 §⑩ debts (4) and (5) -- not the driver-side sentence move that entry was written anticipating. patches/xnu-clover/zzz(60)-clover-r303.patch, six hunks in osfmk/kern/task.c: (a) a new per-hop row 'clover r303: hop=%u t=%llu rpid=%d rnm=%x rentr=%d rvbits=%x rwait=%u rwtid=%llx rbusy=%d', paired with the r298 row by hop=/t=, walks the receiving task's OWN ipc entries for the name its sender wrote to (rnm=tname) and says whether any of that task's threads waits on it (rwait/rwtid, counted under lck_mtx_try_lock -- try, never lock, because this census speaks beside a wedged userland); (b) clover_sb_port_obj() gained uint32_t *vbits, so the r298 row now ends vb_r=%x vb_v=%x -- the ipc_entry type bits from the ipc_right_lookup_read() that already succeeded -- which separates port set from send-once from dead-name for the name that failed to translate (verr=17) without ever needing an object; and (c) clover_sb_port_mail() gained int *err so the r296 row's qmc=/qsr= carry qerr=%d, finally applying the standing rule 'a 0 only counts when its own return code says 0' to the cap=send rows. One precondition was checked before writing the census rather than assumed: ipc_right_lookup_read() SMR-derefs &space->is_table, so the row guards next->itk_space != IPC_SPACE_NULL and reports rentr=-2 instead of faulting -- the same guard shape the rest of the file uses. The r303 row gets its own tee class r303-hop budget 128 plus the per-pass push exemption; r296/r298 keep every existing column in place and only gain a tail field, so boots 50-88 still line up against 89+. check-clover.py EXIT=0 and verify-clover-payload.py EXIT=0 with a whole-line bb-receiver-census needle and the r296/r298 needles moved onto their new fragments (a cut literal leaves the prefixes green and these three rows are the round's whole answer). Kernel d19361ee (both AMFI cuts still at file 0x1ad70e4/0x1ad716c, VA unchanged), normalized 3da8fdb5; payload 3c2e7be48a683e611eb85e5470923d0b8eb654621e4308aa1e568a72f4df894b as round303-v0.7.10-payload.img, 58,720,256 B. Boot 93's reading is pre-registered in notes/development-log.md section Round303 (5): rent r=0 + rvbits=20000(RECEIVE) + rwait>0 closes the task-level chain; rvbits=80000(PORT_SET) is boot 87's guessed branch and the first time this instrument can tell a port set from a send-once; 40000/100000 redraw the chain shape; a nonzero rentr other than -2 means the sender's object and this name are not the same entry; rbusy=1 and rwait=0 are two different absences (locked vs unlocked-and-none). What this round does NOT pay: the driver-side writePioBlock self-attestation boot 92 asked for, the census tail's non-pipe copy, and the image-vs-core-count control -- boot 93 is another same-family vote, still not the control.",
  "boot 93 (round303-v0.7.10-payload.img, image 3c2e7be4, cold flash, card pulled to TWRP) read r303 back and gave it no reading at all -- and the reason is the census-tail debt, not the r303 row's content. The census fired once, at t=555 s, and that header IS on the card as one of the newest rows in the kind-22 ring (clover r262: census t=555 pid=58 threads=18 shown=18 hidden=0 wait=17 run=1 rx=6, seq 1571, ring span 255.4-555.4 s) together with r270/r271/r299, but every per-hop tail row -- r262 th, r296, r298, r300 and the new r303 -- is 0 rows on the card, so rentr/rvbits/rwait/vb_v/qerr were never taken and none of the five pre-registered branches had input. The mechanism is the r212 one: the census tail rides printf -> msgbuf -> tee -> ring and the tee pumps only on block I/O tails; this card's flight region stops issuing block requests at t=543654 ms, the census printed at 555 s with no later block tail to pump it, and -- decisively -- boot 93 never entered the panic sink at all (both markers STALE: boot 92's entry marker with magic=yes and boot 87's exit marker; the deadline record is still boot 87's), so there was no drain to retry the ring either. The reading is therefore not branch (a) or (b): throttle, ring-horizon and no-later-flush are indistinguishable on this boot, and it is the standing census-tail debt (§Round303 5 said so and marked it NOT this round's conclusion) now confirmed to swallow r303 -- a sixth boot in a row, across five images. Eight-core identity held (r271 real=8 max=8 reg=8 start=7 run=8, r299 req=1 con=1 run=7 rc=0 x7, r270 sent=261965 recv=261866); landing charger_temp=356 (highest in the family), die_health=Cool. Ending: this is the family's FIRST boot that did not even reach the sink, stopping near 555 s -- earlier than the prior five (642.7/645/661/746/835 s) -- another same-family vote, the image-vs-core-count control still not run. Next device move (r304, a mainline PREREQUISITE not a new question): give the census tail a copy that does not ride the tested pipe -- route r262 th / r296 / r298 / r300 / r303 through the driver RAM ring + periodic and panic flush the way r212 already does for the kernel probes, so a fire that lands at the ring edge on a boot that never reaches the sink still reaches the card. Until that copy exists the desktop-mainline cell is unmeasured and must be recorded neither as a failure nor as branch (a)/(b). The driver-side writePioBlock self-attestation boot 92 asked for remains unpaid and behind this prerequisite. This boot 93 readback ships no new payload (host-only).",
  "Round304 SHIPPED (v0.7.12) pays the census-tail prerequisite §Round303 (6) named, and nothing else: the tail rows now have a copy that does not ride the pipe under audit. Two halves. Kernel patches/xnu-clover/zzz(61)-clover-r304.patch, osfmk/kern/task.c only: a new clover_census_row(line) does printf then clover_emmc_probe_say(line, strlen(line)) -- r212's relay, unchanged -- and the six print sites (r262 th, r296, r298, r303, r300 fire, r300 done) become snprintf into a 256-byte crow plus that helper, with every format literal kept byte-identical so boots 50-93 still line up against 94. Driver CloverSdhci.cpp:4799 probeFlush (why, cap): r212's drain re-read the whole window every pass, which was fine while it was the only consumer and wrong the moment a second one existed because the same row would land twice, so all three consumers (tail/beat/drain) now walk one atomic cursor gProbeNext and only advance past a row the card accepted; an unsealed slot waits at most kProbeSealRetries=4 passes and is then skipped and counted, a refused ringWriteRecord does not advance (the row is retried, not paid for one busy card), and each pass caps at 16 records. Two new pumps beside the panic drain: the guarded block tail (end of flushVerdictRing, why=tail) and CPU0's 4 s beat (clover_emmc_flight_beat, why=beat) -- so a boot that stops at 555 s and never enters the sink still gets its tail onto the card. The row's own field pend=seen-next is the number boot 93 could only infer: rows that exist in the driver's BSS and are not on the card. Preconditions measured before writing, not assumed: kProbeTextBytes=256 against the widest historical row r296 at 228 bytes, so the two copies truncate at the same byte and the card and the console cannot disagree about a field; probe_say only touches BSS (atomic fetch_add, copy, release seal -- no lock, no sleep), which is what the census path, mid try-lock-and-drop walk of another task's threads, is allowed to call; and in build-xnu-4k-baseline.sh's LATE_PATCH r304 reverses before r303 because it edits lines r262/r296/r298/r300/r303 themselves wrote. Scope kept to the literal debt: only the five pre-registered row families were relayed -- r267/r265 rows still ride the tee -- and check-clover.py holds three negative assertions (exactly 6 relay sites, the old whole-window re-read may not come back, no thread_block/simple_wait/lck_mtx_lock/proc_lock/sleep/hw_lock_lock on the census path). Kernel 12a76a2450ac7bcb41c8b1ec689d3a18485fbb85559ae331efe427fb95f43085 (both AMFI cuts still at file 0x1ad70e4/0x1ad716c, VA unchanged), normalized 3acfb517247c63574ad84161fc794fd56f0a15dc43162e82f82999016e1e1098; payload 431a70d3a4dbbadedbfd2e871acef98b58beb9fb63db9d6686949cbaf8e2621e as round304-v0.7.12-payload.img, 58,720,256 B. check-clover.py EXIT=0 and verify-clover-payload.py EXIT=0 with three new needles -- census-relay, census-relay-onecopy (each relayed format string occurs exactly once in the built kernel), probe-beat-flush -- and the title assertions moved to clover r304. No host change: read-clover-log.py has decoded kind-25 probe records since r212. Boot 94's reading is pre-registered in notes/development-log.md section Round304 (5): (a) tail complete means the five r303 branches finally have input and the desktop-mainline cell is measured for the first time; (b) fire without done and pend>0 means consumption never finished -- read dropped= next to decide whether the 64-slot relay became the new horizon; (c) no kind-25 record and no probe why= line means the driver consumer never ran and must not be read as the kernel not copying; (d) seen=0 wrote=0 means the dual delivery is not in this image, a build-identity finding not a census finding; (e) one family present and another absent is content, not pipe. What this round does NOT pay: the driver-side writePioBlock self-attestation boot 92 asked for, and the core-count-vs-image control -- boot 94 is another same-family vote, still not the control.",
  "boot 94 (round304-v0.7.12-payload.img, image 431a70d3, cold flash, card pulled to TWRP, boot 93 -> 94) exonerated the pipe and indicted the code. The relay works: five 'CloverSdhci r304: probe why=tail' rows with seen 13/14/31/48/55, each with next==seen and pend=0, skipped/stalled/refused/dropped all zero, and 55 kind-25 records reading ok on the card -- and the positive control is the same relay carrying the r207/r208/r211/r218/r226 kill-scene families through untouched, with the new single cursor producing no duplicated row. Yet all six relayed census rows -- r300 fire, r300 done, r262 th, r296, r298, r303 -- are 0 rows in BOTH kind 22 and kind 25: the fire stops at its own fourth header row (r262 census t=741 threads=19 shown=19 -> r270 -> r271 -> r299 at [741.380886]) and nothing after it exists anywhere on the card. That is none of the five pre-registered states; it is the new one -- the pipe is alive and the rows never entered it. One earlier statement is withdrawn with this reading: boot 93's 'the card stopped issuing block requests at 543.6 s so no later tail could pump the tee' compared two different clocks. The flight region's t= field is milliseconds since the driver armed the region (flightCounterMs(gFlightStart), CloverSdhci.cpp:3642/3715/7603), not kernel uptime; the two clocks differ by 11.83 s on boot 93 and 11.65 s on boot 94 -- but each of those numbers, including the 12.09 s one from boot 87's deadline record, was obtained by subtracting a pair whose simultaneity is exactly what is under test, so none of them is a measurement; what stands is the structural fact that the flight t= is milliseconds since the driver armed the region (CloverSdhci.cpp:7603), inside XNU, so flight ms <= kernel secs and boot 94's marker is bounded below at kernel 729.75 s and not bounded above (see the next entry). Strictly, r304 rules out 'produced before the last tail pump and left unpumped' (seen would exceed 55), leaving 'never produced' or 'produced after the last pump with no pump left to carry it'. Two new cells fell. (1) This boot's panic-sink entry marker LANDED -- t=729750ms stage=0 rc=0 drained=0 boot=94 magic=yes gates=0x7(armed,bcb,text) -- which converts to kernel ~741.4 s, i.e. between the r299 row and the fire row: for the first time the seven-boot tail absence has a same-boot panic scene, so it reads as 'the fire dies there', not 'the rows printed and nobody carried them' [the conversion and the ordering are retracted by the next entry; what stands is same-boot co-location with the order undecidable]; the last boot that had per-hop rows (87) is also the last image from before r299 put eight cores online, so the core-count-vs-image vote now goes to cores without being the control. (2) r302's marker is verified on a real panic at last (own buffer, own magic, blind slot: rc=0), while the 480-byte sentence ring is still frozen at boot 87's seq 49, no why=drain report exists and boot 94's stage=1 exit record is not on the card (slot 1 still holds boot 87's) -- the family shape narrows to 'the sink entered, the entry marker is writable, and nothing after it reached the card', [the next entry drops drained=0 from this evidence: on a marker it is structurally always 0], which promotes the still-unpaid writePioBlock failure self-attestation from hygiene to a mainline blocker: without the sentence there is no name for whatever acts at the census row. Third cell: r304's own premise was wrong -- all five reports say why=tail and zero say why=beat, because probeFlush(\"beat\") sits after flightWrite(kFlightEventBeat) and clover_emmc_flight_beat() returns early while the host is taken (CloverSdhci.cpp:3911-3941); this boot's beat records stop at 602343 ms (gap 127406 ms to the newest entry), so the second consumer never ran. That is an instrument defect, not a reading. Ending band: 642.7/~645/661/746/835/555/742 -- eighth same-family vote, colocated with the census fire on the kernel clock only (last ring row 742.03 against the r299 row at 741.38), not with the marker; landing snapshot charger_temp=365 (family high), die_health=Cool. Next move r305, three small items, no new question: (1) swap clover_census_row to relay BEFORE printf, which separates 'the thread reached this row' from 'this row got into msgbuf' -- if kind 25 shows r300 fire and kind 22 does not, the stop is in the console path, and if neither shows it the fire never reached that statement; (2) [superseded by the next entry: probeFlush writes the card and a card write needs the host ticket, so the consumer cannot precede the guard] count the starved beat instead; (3) pay the writePioBlock self-attestation so the sentence can reach the card and name what acts at the census row. Until then the desktop-mainline cell stays unmeasured -- neither a failure nor branch (a)/(b), and not an instrument failure either: the instrument proved itself this boot. CORRECTION (v0.7.14, host-only) to the two entries above, found by going back to the code and to the files after shipping them. (1) The boot 94 entry places the panic-sink entry marker 'between the r299 row and the fire row' by adding a ~11.65 s clock lag to its flight timestamp, and that lag is circular: the 11.83 s, the 11.65 s and boot 87's 12.09 s each come from subtracting a pair of events whose simultaneity is the very thing under test. The card does hold one genuinely commensurate pair -- the deadline record carries t= (ms since arming) and cnt0/cnt1 (the same cntvct counter at the first tick and at now), and boot 87 reads t=1802871 ms against elapsed=1800.003 s, so the driver armed 2.868 s BEFORE the first timer tick (ArmCpu.cpp:647/664/670). The missing cell is first-tick versus the kernel log epoch, and it is on no card read so far. Because gFlightStart is assigned in the driver's bring-up (CloverSdhci.cpp:7603) the sign is bounded -- flight ms <= kernel secs -- so boot 94's marker sits at kernel >= 729.75 s with no upper bound. Ordering undecidable, and the two live readings differ in kind: the fire died at the panic, or the panic began seconds earlier and the census head rows are collateral of a panic already in progress. A new fact argues against treating this as a short interval at all: boot 87's single census fire ran from its head row at [1781.971356] to its last chain row at [1800.081238], so one fire occupies tens of seconds (its t= field is computed once, at the head). What survives of the boot 94 reading: the relay's positive control, the six relayed rows 0 in kind 22 and kind 25 alike, the same-boot panic scene, and the image-versus-tail correlation (87 is the last boot with per-hop rows and the last image before r299 put eight cores online) -- a correlation, still not the control. (2) drained= is not a reading. gPanicDrained is written only inside panicDrainRings (CloverSdhci.cpp:4873-4876), and the drain runs at :9221, after BOTH markers (:9212 stage=0, :9220 stage=1), so no marker can ever print anything but 0; boot 87's stage=1 marker, whose sentence demonstrably reached the card as kind-20 slot 12 seq 49, prints drained=0. The evidence that nothing after the entry marker reached the card is the missing stage=1 record for boot 94 (slot 1 still boot 87's), the kind-20 ring frozen at boot 87 seq 49 and zero why=drain reports -- and those three cannot separate 'did not run' from 'ran and the card write was refused', which is exactly the shape the unpaid writePioBlock self-attestation exists for. The column itself is now instrument debt. (3) The pre-registered r305 item 'move the beat consumer ahead of the owner/guard returns' is unsafe: probeFlush reaches the card through ringWriteRecord -> writePioBlock (CloverSdhci.cpp:3529), which needs the host ticket, so ahead of the guard it would create the second writer in interrupt context that r210 has been avoiding. It is replaced by two smaller items: count each early return of clover_emmc_flight_beat (gPanicActive / owner held / under 4 s, :3911-3941) and print those counters (held=, young=, panic=) with the next report that does run, so a starved beat becomes a reading rather than an absence; and write one flight record carrying the kernel's own seconds together with the driver's flight ms, read at a single code point, which is the cell (1) shows is missing before any sink-versus-census ordering can be read. The relay-before-printf item and the writePioBlock self-attestation are unchanged. Full text: notes/development-log.md, section 'Round304 reading correction'. This correction ships no new payload (host-only).",
  "Round305 SHIPPED (v0.7.15) pays the three pre-registered items and opens no new question. Kernel patches/xnu-clover/zzz(62)-clover-r305.patch, osfmk/kern/task.c only: clover_census_row() now calls clover_emmc_probe_say() BEFORE printf, and the printf at its old position is removed -- the deletion is the instrument, because a row that reaches the relay but not the console and a row that reaches neither are now different readings (kind 25 with no kind 22 pair = the walk got there and the console is where it stopped; neither = the walk never got there). LATE_PATCH reverses r305 before r304, since it reorders the line r304 wrote. Driver, three instruments: (1) the beat's own starvation counted -- gBeatStarved[4] (CloverSdhci.cpp:592) tallies each early return (panic active :3995, owner held :3997/:4006, under 4 s :4020, blind :4026) and the counters are cumulative, never cleared on read, because the consumer that can be starved cannot be the only reporter of its own starvation -- an instrument defect caught before shipping, when the first draft delivered them only inside the beat record; (2) one record carrying both clocks at one code point -- kernelSeconds() (:3727-3729, absolutetime_to_nanoseconds(mach_absolute_time())) in the beat's extra[0] and in the panic marker's extra[8], with gBootId at extra[12] in both (:4046, :9326), which is exactly the cell v0.7.14 said was missing before any sink-versus-census ordering could be read; (3) writePioBlock's three no-exits name themselves -- pioFail() (:3237) records kind/status/words/ms plus gPioAttempt (:3849) taking 100+event / 21 / 22 / 20 per call site, so the sink's silence can finally separate 'the drain did not run' from 'it ran and the card refused the write'. The block-tail report line (probe report, :4980) gains 'starve=a/b/c/d pio=code/status/w@ms ch=attempt' and carries the same four counters the beat does, cumulative since arming. Reader: read-clover-log.py re-lays the flight words for the new record shapes (FLIGHT_BOOT_WORD={1:35,2:35,3:47,4:45,5:41,6:37}, FLIGHT_MAGIC_WORD={4:46,5:48}) and prints k=/arming_offset=/starve=/pio=. Gates: check-clover.py EXIT=0 with the patch-shape, post-image ordering (relay before printf), must-remove-old-printf, forbidden blocking calls, driver needles, a NEGATIVE assertion that the starvation counters are never cleared, the three report-line needles and the decoder needles; verify-clover-payload.py EXIT=0 with probe-beat-flush extended to the whole new format string. Kernel 68ce7dc9, AMFI 924b7243 (both cuts still at file 0x1ad70e4/0x1ad716c, VAs unchanged, encodings 0x34000229->0x14000011 and 0x36000520->0xd503201f), normalized 82d8992b, in-card ad5ba323; ADT e37eca9a (14,384 B), trustcache 7c369ce0, ramdisk 614b8356; payload c52f1f0012901092e539ef8edf801d19be8d5f3e3347d34f6d5524995d44103a as round305-v0.7.15-payload.img, 58,720,256 B. Boot 95's reading is pre-registered in notes/development-log.md section Round305 (7): relay rows without console rows = console-side stop; neither = never reached; both = the tail is finally measurable and the five r303 branches get input for the first time; starve counters nonzero with a later report = the beat pump is innocent and the census stop is content; pio attempt nonzero = the sink's silence has a name.",
  "boot 95 (round305-v0.7.15-payload.img, image c52f1f00, cold flash, card pulled to TWRP, boot 94 -> 95) put the kernel clock's last word on the card and cashed in the two-clock instrument in the same boot. (1) The newest kernel ring rows of the whole boot are the census head block: [616.939083] r262 census t=616 pid=58 threads=24 shown=20 hidden=4 wait=23 run=1 rx=8, then [616.939108] r270 sent=290272 recv=290132, [616.939148] r271 real=8 max=8 reg=8 start=7 run=8, [616.939185] r299 req=1 con=1 run=7 st=07777777 rc=0 x7 -- and nothing after. So eight-core identity reproduced for a sixth boot and the walk demonstrably reached the head row. (2) The reordered relay landed on pre-registered branch (c): kind-25 has 0 boot-95 records (the 23 in the window are boot 94's residue) and kind-22 has 0 rows of r300 fire/done, r262 th, r296, r298, r303 either, which puts the stop inside the 29 lines between task.c:13595 and task.c:13714 (three increments and the snprintf of the fire row) -- and does NOT conclude it: this boot had no SIGKILL scene (killsrc/killustk/skst 0 rows), so the relay's only caller was the census itself, 'probe_say refused everything' stays unexcluded, and the tail report's own print condition (wrote>0 || pend>0) explains its own silence. (3) The two-clock instrument validated and paid immediately: arming_offset reads 11861/11855/11841/11835 ms over four consecutive beats (0.2 % per 12 s), the last beat that ran is at kernel 497 s (flight 485165 ms) against the census head at 616.9 s, so the beat was starved for ~120 s read on ONE clock -- the number v0.7.14 declared unreadable. The entry-marker-versus-census ordering is still NOT asserted: the extrapolation error covers it. (4) The third instrument is live with nothing to report: pio=0/0x00000000/0w@0ms ch=0 total=0 (no block write refused anywhere up to 497 s) beside starve=0/0/29267/31, where held=31 is the starvation itself, young=29267 is the 4 s gate doing its job and miss=31 is the same-frame positive control. (5) sink/deadline unmoved: both markers stale (boot 94's entry, boot 87's exit), magic=absent, deadline record still boot 87's, zero sentences, r283: last reset unnamed -- the ninth unnamed silent reset, band now 642.7/~645/661/746/835/555/742/617, landing charger_temp=342. (6) A reading this round produced and then blocked: boot 94's stale marker decoded through the new tables printed k=1129076301s arming_offset=1129075571250ms, so read-clover-log.py now gates every new field on r305_own() -- the record's boot id must equal the payload generation the reader's layout assumes -- printing 'clocks unreadable: an older payload's words are here' instead, with a foreign-boot positive/negative control in the selftest. Rule: a new field must state which image generation carries it. Next hand r306, two items, both already implied: (1) make the relay's own silence speak -- count each early exit of clover_emmc_probe_say (not armed / ring full / over length / verdict not yet up) and add 'calls>0 with wrote=0' to the report line's print condition; (2) give 'the thread got here' a copy that does not ride the relay -- a bare-printf step row after the three increments at :13705 and before snprintf(fire), deliberately NOT via clover_census_row, because the relay is the thing under test. Still owed besides: the drained= ownership debt and the smp-off same-image control round.", "Round307, three items. (1) Split the 'nothing' report budget by why (tail/beat/drain each its own) and carry calls= and probe_seen= on it, so the consumer that runs at the scene can still speak. (2) After the three increments at task.c:13704-13706, add a second copy of 'got here' that does NOT ride the kernel log -- call clover_emmc_probe_say directly with a 'clover r307: pre' row so it lands on kind 25. This is now legitimate: round306 proved the relay is a bystander nobody called, so the pipe under audit is the kernel log/tee, not the relay. The two reads separate what the card cannot separate today: kind-25 pre present with no kind-22 step = a kernel-log/tee loss (back to the horizon); neither = the walk stopped below :13707; both present with fire/th still absent = stopped in snprintf/clover_census_row (back to branch (a)). (3) FINALLY run the control round: flash the same round307 image twice and boot the second time with armcpu-smp=0. Boot 87 was 'one core plus a different image', and the eight-core era now has ten boots -- whether the missing tail belongs to the image or to the core count has still never been separated, and this is the round that separates it. Still owed: the drained= ownership debt.",
  "Round307 SHIPPED (v0.7.17) pays the three items the boot 96 reading pre-registered. Driver: gProbeSilenceSay, gProbeNothingSay and gProbeReports become arrays indexed by probeWhySlot(why) -- tail, beat, drain, other -- because boot 96 spent all four nothing slots on why=tail while the consumer that actually ran, why=drain, never spoke; the report row and the guard-exit row each carry calls= (passes that ran) beside the existing seen= (rows ever sealed), and both row tokens move to CloverSdhci r307: probe so an older image's row cannot be read as this generation's. Kernel patches/xnu-clover/zzz(64)-clover-r307.patch, osfmk/kern/task.c only: after clover_bb_chain_hops = 0; at :13706 and before round306's step printf at :13738, the walk hands \"clover r307: pre t= seq= pid= th= hidden=\" straight to clover_emmc_probe_say() at :13724 with no printf -- legal now because r306 proved the relay is a bystander nobody called this boot, so the pipe under audit is the kernel log and tee, and a copy may not ride the pipe it measures. verify-clover-payload.py adds census-pre, census-pre-relay-only (the pre string appears exactly once in the kernel) and probe-report-generation (the r306 token must be gone from the shipped kernel). check-clover.py pins the patch's order (counters, then the pre block, then the comment that opens round306's step block; the step printf itself is outside the hunk's context so the bound is the comment), forbids any printf(\"clover r307 row, forbids a blocking call between the relay hand-off and the counters, demands the byte-identical upstream copy and r307 ahead of r306 in LATE_PATCH, and negatively pins the retired single counters and the r306 token. Chain: kernel b3037960 -> AMFI 8c4a0cb8 -> normalized cbf8f75a -> in-card a71a18fc; image 0aa8e893, 58,720,256 B.",
  "boot 97 (round307-v0.7.17-payload.img, cold flash, boot 96 -> 97) lands on pre-registered branch (b), and for the first time that absence has a second leg. The kernel ring covers 258.616-490.544 s (seq 1090-1601) and holds exactly one census head -- [448.907920] r262: census t=448 pid=58 threads=16 shown=16 hidden=0 wait=15 run=1 rx=9 -- followed in the same beat by r270/r271/r299, then a 3.7 s gap to [452.616469]; the pre row (kind 25) and the step row (kind 22) are both 0 rows, as are fire/done/r262: th/hop. The relay's own numbers say refusal is impossible: drain enter boot=97 ... probe_seen=0, and the drain pass reports calls=139065 wrote=0 seen=0 next=0 pend=0 blocked=0/0/0 empty=0 cut=0 -- clover_emmc_probe_say() has exactly two early exits (empty text, oversized-then-truncated), both counted, both 0 -- so seen=0 reads as nobody called it, which EXCLUDES branch (a) (the tee lost the step row) instead of leaving it unread. The stop interval is therefore task.c:13679-13707, and that span holds no lock, no sleep and no card write: what is left is that the thread carrying the walk stopped descending. This boot has no SIGKILL scene (killsrc/killustk/skst 0 rows), so killed-on-the-census-beat is neither proven nor excluded; r308 changes the question to who is running the census. r307 item (1) paid the same boot: 9 report rows split tail 4 (calls=1/2/3/4), beat 4 (calls=168/448/631/902), drain 1 (calls=139065) against boot 96's four-tail-zero-drain, so the consumer that ran on site finally has a voice and it says the queue was already empty. The sink ran and none of it reached the card: r301: panic copy rc=2 chars=480 said=2, r302: blind ok=0 chars=352 total=480 slot=1, r184: panic drain wrote=0 tee_passes=8, and the first refused block write since arming is on the card -- pio=1/0x00000000/0w@445924ms where boot 96 read 0/0x0/0w@0ms -- with starve=0/895/38329/54 naming 895 beat passes refused while panicking. The deadline record is still boot 87's, so this boot never reached 1800 s, and [490.544416] r180: frame#5 is the newest kernel row of the whole boot. Eight cores for an eleventh boot across nine images, field for field (real=8 max=8 reg=8 start=7 run=8, req=1 con=1 run=7 st=07777777 fl=00000000 rc=0 x7, sent=222806 recv=222710, head threads=16 shown=16 hidden=0 wait=15 run=1); r283: last reset unnamed is the eleventh unnamed silent reset, band 642.7/~645/661/746/835/555/742/617/576/>=490; charger_temp=346, capacity=100, Charging. The desktop cell still has no reading.",
  "One instrument defect caught in this round's own reading: the drain exit row's probe_pend=11 was read as eleven relay rows still behind it, and the pend=0 on the same pass refutes that, because the field is filled by gRingPending[kRingDriver] -- the whole driver ring -- not by the relay's seen-minus-next. A column whose name says one thing while carrying another manufactures a plausible false number with no fault anywhere in the system, so r308 item (1) either renames it ring_pend= or fills a real probe_pend= and raises that row's token with it.",
  "boot 98 (round307-smp0-control-payload.img, image 2c1827b9, the SAME normalized kernel cbf8f75a with only kernel_args differing -- round307-smp0-payload.json reads armcpu-smp=0 and has no armcpu-smp=1) did not answer the tail question and instead returned the control round to the instrument. The whole census family is 0 rows in this window: r262 (head and th), r229 bb, r270 ipi, r271 cpu, r299 smp, r296, r298, r300 fire/done, the r306 step row and the r307 pre row -- searching the window for r262 returns nothing -- so neither pre-registered branch (tail arrived / tail still zero) had a subject, and the image-versus-core-count cell stays owed. Absence from the ring is not absence of the walk, with two loss paths measured in this very boot: the ring covers 256.569-524.995 s and the tee's own line reads seen=3284 kept=779 throttled=56 lap=2, so the 16-push-per-pass cap (CloverSdhci.cpp:4691, which returns without pushing while the read cursor keeps advancing -- non-exempt lines are lost for good; r262/r229/r271 are not on the exemption list, r296/r298/r299/r300/r303/r306 are) ate 56 lines and the msgbuf writer overtook the cursor twice (:4762). Boot 97's claim that the walk never reached :13704 stands because of the relay leg, which rides none of that; boot 98's relay leg reads the same seen=0 with blocked=0/0/0 empty=0 cut=0 across its own nine rows, but pre sits AFTER the three counters, so that leg cannot say whether the burst entered at all. The one mechanism reading that does stand is local: clover r234: beat t=299 and t=419 both carry pid=0 rn=0, meaning the sampling target had still not latched (the beat thread calls clover_bb_sample only when clover_bb_target_pid is not zero, task.c:11217, and the latch comes from a batch naming <pid>:backboardd, task.c:14390), while the r224/r225 batch rows keep arriving every four seconds -- and the next heartbeat row would only print at 539 s, past the ring's newest line, so whether it latched after 419 s is NOT readable and must not be asserted for the boot.",
  "What boot 98 actually adds is a shape the family has not had: an ending with no card record at all, measured rather than missing. Its own four beats read t=491279/495284/499291/507307 ms with k=503/507/511/519 s, arming_offset=11721/11716/11709/11693 ms, starve=0/0/87601..90104/25..26 and pio=0/0x00000000/0w@0ms total=0 -- panicked is zero for the whole boot and no block write was ever refused (boot 97: panicked=895 and the first refusal at 445924 ms) -- the twelve entry records sit at 511517..511528 ms doing ordinary reads for navd(78) and homed(161), both panic markers still belong to boots 96 and 87, the sixteen sentence slots hold no boot-98 line and the deadline record is still boot 87's, so this boot never entered the panic sink and never reached 1800 s. The host log brackets the end: flashed and rebooted 05:37:31, TWRP's adb seen 05:55, caught by the pre-armed BCB (round198 makes a non-panic reset land there too, so the landing names neither cause nor deadline). The end is therefore an interval, [~525 s, ~1044 s], and by the sixth instrument layer it is NOT converted into the next reset-timing vote. The display cell gets a free reading that still does not count: retire#1..#4 with done=presented=frames=1..4 between 465 and 481 s and frame#5 pixels=45460 box=305x811..970x1108, nearly all black (ff000000/2258540) -- presenting runs on a one-core boot too, and what the desktop cell asks for is still what is on the screen.",
  "r308 item (2) is rewritten by this round's own control design, which was the flaw it found: the pre-registered test was a single-core boot reading reg=1 start=0, but that row is produced by the very burst whose absence the round was testing -- the judge rode in the thing judged (the sixth and ninth layers wearing one more coat). So r308 now is: (1) fix probe_pend=; (2) move both reached-the-burst and the core count onto the relay -- say clover r308: enter t= pid= target= with the r271 core summary, handed to clover_emmc_probe_say() on entry to clover_bb_sample() BEFORE the thread walk, because boot 98 proved a tee-riding copy cannot carry evidence in a boot with lap=2; (3) re-run the control round and let that tee-independent row decide whether the round counts, then separate image from core count for the tail. Positive control that the instrument itself is fine: boot 98's relay consumer ran 7257 passes (boot 97 reached only 902) and still read seen=0 with blocked=0/0/0, empty=0, cut=0, and after splitting the budget both why=tail and why=beat spoke in this boot too.",
  "Round308 SHIPPED (v0.7.18) moves the judge off the judged pipe. Kernel patches/xnu-clover/zzz(65)-clover-r308.patch, osfmk/kern/task.c: three rows are sealed on the driver relay before anything prints -- clover r308: beat t= target= ent= fired= same= cap= gone= notask= busy= reg= start= run= from clover_r308_beat_row(), called by the beat thread after clover_ulock_dump(secs) so it runs whether or not a target ever latched (this is the positive control the relay's seen=0 has been missing since boot 96: every other producer on this board sits inside a conditional branch, so a zero cannot tell a dead path from a live one nobody walked), and clover r308: smp-pre / smp-post, relay-only with no printf, one before the r299 row's printf and one after it returns, carrying r271's own reg=/start=/run= locals -- between those two rows there is exactly one statement, which is the statement boot 97 stopped at with no blockable code in the window. bb_fired/bb_same left the sampled function's frame for file scope along with enters/capped/gone/notask/busy, because a counter readable only by a row the burst itself prints measures the instrument. Driver CloverSdhci.cpp: the drain exit row's probe_pend= printed gRingPending[kRingDriver] (the tee ring's backlog), so it is renamed ring_pend= and probe_pend= now carries gProbeSeq - gProbeNext, with the token at CloverSdhci r308: drain exit; new tee class r308-relay (64) and r308 added to the per-pass-cap exemption list so the beat row's console copy is not eaten by the throttle the row exists to measure. Gates: check-clover ok (pins each r308 row appearing exactly once, forbids a console copy of the bracket rows and any clover_census_row, requires the file-scope counters and the deletion of the old statics, requires the position chain ctm[7]); -> smp-pre -> Round299 -> smp-post -> clover_census_seq++ and beat after clover_ulock_dump, negatively pins the r212 drain-exit token, demands the byte-identical upstream patch and r308 ahead of r307 in LATE_PATCH), verify-clover-payload EXIT=0 (new keys relay-bracket, relay-bracket-onceliteral, beat-accounting, exit-generation), read-clover-log --selftest ok, task.c syntax exit=0 hard=0, CloverSdhci -Werror plus object audit. Chain: kernel 185955ea -> AMFI ff5c1972 (same two encodings as r305-r307) -> normalized 7e669d95 (973/973 stamps, _clover_fastboot_reason present); image ~/clover-out/round308-v0.7.18-payload.img sha256 ae4baa8a, 58,720,256 B. Boot 99 judgement branches and the new control-round validity test are written down before the reading in development-log Round308 items 6 and 7.",
"Boot 99 (round308-v0.7.18, image ae4baa8a, armcpu-smp=1) read the new leg back and none of the four pre-registered branches holds. The relay is proven alive: ten clover r308: beat rows on kind 25 (t=660..1753) with seven printf copies in the kernel ring, and the driver's own report climbing seen= from 0 to 62 with next==seen, pend=0, blocked=0/0/0, empty=0, cut=0, so branch (d) is excluded and boots 96/97/98 keep their relay-based conclusions. The reading itself is target=0 ent=0 fired=0 same=0 cap=0 gone=0 notask=0 busy=0 reg=8 start=7 run=8, ten rows byte-identical: clover_bb_sample() was never entered all boot, so smp-pre and smp-post are absent as a consequence rather than as a second finding, and searching the whole window (64 kind-21 + 49 kind-25 + 512 kernel rows) for backboard returns zero hits. Eleven boots of where-the-census-tail-broke now have, for this boot, an answer that rides no pipe under trial: nobody called it. Two further cells. This boot did not end like the eleven before it: it lived to its own deadline (fired at 1802875 ms, elapsed=1800.000s, beats k=1801..1813s, pio=0 the whole boot, sink entry marker rc=0 magic=yes host=0x0), which is recorded as lived at least 1816 s and ended by our own panic, not as a reset-timing vote (layer six). And the drain left no account at all: no drain enter, no CloverSdhci r308: drain exit, no tee report, even though verify-clover-payload proves that row's bytes are in the image, so the round's own exit line has no reading and the only live candidate (host=0x0: the drain needs an SDHCI host ticket, r302's blind marker does not) is booked as a candidate, not a fact. Userspace has a new shape: SpringBoard is pid 27, alive at 1683-1688 s, sending to nm=2803 (cnt=2 ql=6) whose owner will not resolve (sbown rem nm=2803 own=- nine beats running) while a303 and 7403 both resolve to 27:SpringBoard itself; launchd SIGKILLed pids 173/174/175 UARPUpdaterServi; keystore clients all rc=0 (keybagd 11 and 46, ReportCrash 97, akd, biomed, containermanagerd, fairplayd); HID still published=1 seen=1 presses=3 with r260 verdict=102; GPU unchanged (gx_on=0, w1c=80000038, wdt en=0 armed=0). The desktop cell is unread and the reason is named: the ring's oldest line is 772 s while boot 98's frame rows sit at 465-481 s, so zero frame rows here is a horizon, not an absence of frames -- what that cell owes is a desktop reading that does not travel with the horizon. Boot 100 (control, image 9354aec6, same normalized kernel 7e669d95, kernel_args carries armcpu-smp=0 and not =1) now calibrates the instrument rather than the board: valid only if this boot's beat row is on the card and reads reg=1 start=0 for itself; if it still reads reg=8, reg= on the relay is not a measure of cores and every inference drawn from it this round is withdrawn. One deviation to quote with that round: board.toml payload.title is baked into the image as unixnu.toml and verify-clover-payload compares the two for equality, so this readback version reverted the title to the text the boot 99 image really carries; the control image was built after a one-apostrophe edit, so its baked title differs by that apostrophe while its kernel is the same 7e669d95 and only armcpu-smp differs.", "boot 100 (round308-smp0-control-payload.img, image 9354aec6, the same normalized kernel 7e669d95 with armcpu-smp=0) is the first control round that actually ran: its own three kind-25 beat rows read target=0 ent=0 fired=0 same=0 cap=0 gone=0 notask=0 busy=0 reg=1 start=0 run=1 at t=177/297/418, and armcpu-smp=0 is visible twice -- in round308-smp0-payload.json kernel_args (one whole string, not a list, so iterating it as a list returns empty and that is a query bug, not a missing argument) and in the shipped unixnu.toml bytes ending armcpu-smp=0 with no =1 anywhere. Layer twelve is paid: the judge no longer rides the burst it judges. Generations are still per-slot (the window keeps boot 99's eight kind-25 and three kind-21 rows, four of them beat rows reading reg=8 start=7, so a text search would drop an eight-core reading into a single-core boot); boot 100 itself is 512 kernel lines seq 961..1472 contiguous, 54 verdict lines, 6 relay lines, relay accounting seen=3 next=3 flushed=3 dropped=0. The gate is now named: clover_bb_sample() has exactly one call site (task.c:11290) conditioned on clover_bb_target_pid != 0, and that latch closes only when a sampled SpringBoard batch names a remote owner matching <pid>:backboardd (:14498..14509, cleared on every SpringBoard generation at :11133). This boot opened it once -- r221 sbm2 t=433 ro=58:backboardd -- and the next beat row that could say ent>=1 was due at 538 s while the boot ended at ~477 s, so the eleven-boot census absence is a cadence hole, not a pipe failure and not a core count. Boot 99 section 2 is corrected with it: that section used a whole-window grep for backboard as its evidence, which its own 772..1714 s horizon cannot support; the conclusion survives on ent=0 across ten rows instead. Cores are still not the reset clock: single core ends at 477.1/525.0 s against eight-core 490.5..1816 s, overlapping, n=2, no cause claimed. The desktop cell loses a wrong sentence: every boot 88..98 carries 28..34 r180 client rows for pid 58 with presented= up to 4, so boot 99's zero rows were the horizon, and boot 100 presents three frames of a 9216000 B 1920x1200 RGBA buffer that is 98.1% opaque black with 41548 non-black pixels inside box=305x887..755x1029 (boot 98 grew the same box to 305x811..970x1108 at 45460 px) -- content on the panel, not the desktop, reproduced across two images and two boots. One real instrument bug surfaced: the r170 exec and exit rows divide clock_get_uptime() by 1000000000 (kern_exec.c:2050, kern_exit.c:1519) while this board ticks at 19267584 Hz, so their t= is compressed 51.90x -- measured: t=4s rows land at ring 229.6..251.9 s and t=7s at 390.5 s. Every r170 t= reading is void (pid/comm/ppid/rv/code are unaffected), and the comment's stated purpose of telling a spinning loop from a slow one never worked. r309 is pre-registered with four relay items (r309: exec/exit with true seconds and the r170 token pinned absent, r309: latch at the moment the latch closes, r309: cen-in/cen-out around the sampler with fields from the same variables, r309: drain-in as the first statement of panicDrainRings needing no host ticket), plus boot 102 four mutually exclusive branches and boot 101 (same image, eight cores, already flashing) judged only on whether ro= stays all-dash or names backboardd once more.", "boot 101 (round308 image replayed, eight cores) caught the gate opening: six r308 beat rows t=783..1392 all read target=0 ent=0 with reg=8 start=7 run=8, and of seventeen r221 sbm2 samples thirteen name ro=121:lsd, three ro=-, and exactly one ro=58:backboardd at t=1418. Thirty-six microseconds later r234 sbown names own=58:backboardd (1418.401750) and r262 census prints its head (1418.401786), then r270/r271/r299 finish at 1418.401896, while the driver's last recorded block request sits at 1406793 ms -- the same second (beat seq 218 puts t=1381416 ms at k=1393 s, so driver milliseconds run about 11.6 s behind kernel seconds). So the eleven-boot absence is renamed once more: the census head has appeared before, what has never arrived is the tail (r262 th, r296, r298, r300 fire/done), and the row that reports the latch closes on a 120 s cadence while the event that closes it is one sample in seventeen. A new instrument debt opens with it: smp-pre reached the card and smp-post did not, and that is not a verdict on printf, because the relay's legs are the driver's own 4 s beat (CloverSdhci.cpp:4166) and a block-I/O tail (:4257), and printing a 270-byte row is itself block traffic, so one flush between the two writes explains the asymmetry -- a relayed row being produced is not a relayed row landing inside a second. Tenth nameless silent reset, this boot at least 1418 s. r309 then shipped as v0.7.21 (kernel 0c8cbe24, normalized 3f7bf462, payload 58720256 bytes, both gates green): exec/exit moved to real seconds under the r309 token with the r170 token pinned absent in patch and image; latch relayed the instant the target goes non-zero; cen-in as the sampled function's first statement plus cen-out at all seven named exits, relay-only with no printf copy; flight sector 63 event 7 drain-in written from the first statement of panicDrainRings before its gates, with the tee row drain legs in= as its second leg -- row without sector means the sink refused its own write, neither means it never reached the drain. Two self-inflicted build incidents became permanent needles: the LATE_PATCH entry was typed with 67 z instead of 66, its reverse --check failed silently, r309 stayed in the tree and the replay died in bsd_init.c:987 (third time this trap bit), so check-clover.py now requires every LATE_PATCH path to name a real file; and a one-element for hand in ('...') without its comma iterated characters, turning one assertion into 51 false failures. The title string was rewritten twice -- once for the boot 101 corrections above, then to put a quoted phrase back in, because the repo requires this round's title to carry a double quote so the firmware escaping stays exercised by every shipped image.", "boot 102 (round309 v0.7.21 image 944e0964, eight cores) is the boot where all four r309 instruments answered, and the reading that matters is not the census: the clock now agrees with the ring (exec pid=146 t=424s lands at [424.073104]), the gate spoke on the spot (r309 latch t=566 pid=58 name=3c03, after four r308 beat rows read target=0 ent=0 fired=0 one after another), cen-in t=580 ent=1 and smp-pre both reached the card, and the r299 row is itself the newest line of the whole kernel ring (slot 254 of 512). So the missing tail, cen-out and smp-post cannot be read as printf never returned: flushVerdictRing() always moves the kernel ring before it runs probeFlush tail, and that last relay pass reported wrote=2 with seen=7 next=7 pend=0 -- it delivered cen-in plus smp-pre and found nothing left pending, which is exactly the shape a smp-post sealed one instruction later would leave (the fourteenth layer, same cell). The named reading is in the sink: the flight marker is stage=0 only (the other slot still holds boot 87 stale words), kind 20 carries no boot-102 sentence, the blind sentence record is absent, sector 63 drain-in is absent and the CloverSdhci r309 drain legs row never printed -- while that same marker says log_ready=1 with the text gate open. panicAppendText() therefore never returned: the card refused everything cannot explain four consecutive absences on the forced raw-PIO path that had just succeeded in the same millisecond. The shape fits: the last block record is entry seq 166867 t=569031ms read pid=111 comm=chronod, the marker is t=569031ms, and the beat path that would recover a stuck card had written nothing for 81 s (newest beat seq 73 t=487827ms) -- with the other cores stopped by the panic that read is an orphan and the sink's first poll waits for a completion that never arrives. sheng keeps its panic sink off the storage stack; our r301, r302 and r309 each only added another write to the leg that can hang. So round310 is two changes, not another counter: quiesce the card before the sink writes anything (the stuck-request recovery the beat path already uses), and carry the relay sealed and consumed cursors inside marker stage=0, which is proven to land, so the census bracket no longer waits on the drain. Timing cell: this boot ends at 581 s and it is a panic with a marker, not an unnamed reset; the distribution is now 642.7, ~645, 661, 746, 835, 555, 742, 617, >=1418, boot 99 at >=1816 and this one at 581. Judgment for boot 103, written before the reading: if marker stage=0 and stage=1 both appear (or either the kind-20 or the blind sentence arrives) the card really was quiesced and the panic reason is readable for the first time; if stage=1 is still missing while drain-in arrives, quiescing is not enough and the drain moves ahead of the append; if both are missing, even the recovery did not run and the next hand is a controller reset that clears state without waiting for a completion. If the new marker words say sealed is greater than consumed, the census cell closes on the spot: the tail was produced after the last flush, not lost.",
"round310 (v0.7.22, kernel 1bce8ac3, amfi baa0e973 with both sites still 0x1adb0e4 and 0x1adb16c, normalized 9eebcf9b, payload 93721069 = ~/clover-out/round310-v0.7.22-payload.img, 58720256 B, both gates 0 FAIL) is the round that stops arguing from absences inside a path that contains a hardware wait. Boot 102 entered the panic sink, landed marker stage=0 t=569031ms boot=102 magic=yes with log_ready=1 and the text gate open, and then wrote nothing: no sentence, no blind copy, no marker stage=1, no sector 63 drain-in, no CloverSdhci r309 drain legs row -- four absences on the same forced raw-PIO path that had succeeded one instruction earlier in the same millisecond, which names one call that did not return, not four refusals (the fifteenth layer). What it was waiting for is on the card: marker host=0x28c1d is a live ticket, the stage word had gone back to idle, the newest request record is entry seq 166867 t=569031ms read pid=111 comm=chronod in that same millisecond, and the beat path that would have taken the ticket away last wrote at seq 73 t=487827ms, 81204 ms earlier. sheng keeps its sink off the storage stack entirely; ours cannot, because the drain is the point, so r310 takes the one lesson that transfers -- the sink must not be the context that waits on a busy controller. panicQuiesceCard (CloverSdhci.cpp:9607, called at :9673 before the first marker) reads stage, owner and the two inhibit bits; where a ticket is held it steals with the beat's own compare-and-swap, and where the machine is still running with no holder it takes the host with tryTakeHost first, because cardRecoverHeld writes reset registers and doing that under somebody else's request is forbidden to both contexts; then it runs the watchdog's own ladder, says CloverSdhci r310: quiesce steal|idle stage= inhibit= owner= ok= probe=/ and flushes the rings while it still owns the host. Seven readings, and 7 (host never armed) is separate from 0 (the door was idle) on purpose -- one word may not mean two things. cardRecoverHeld gains force=false: the per-boot cap and the 15 s cooldown exist to protect later requests, and a boot that is ending has none, so without the flag the sink would report a refusal it never attempted. marker(0) grows from 13 words to 18: the relay's sealed and consumed cursors (the census bracket boot 102 could not settle, now carried inside the record that is proven to land) plus quiesce, stage and owner; neither group rides the tee budget or the kind-25 relay, because a judging path may not be delivered by the pipe it judges. The host now keeps three signature positions for the same sector (43, 48, 53) and prints the new columns only when magic_at is 53, so an r309 record cannot have its own kernel second read as a cursor. Boot 103, written before the reading: marker stage=0 AND stage=1 (or either sentence leg) means the card really was laid down and the panic reason is readable for the first time; stage=1 missing while drain-in arrives means a second lock is inside the sink and the drain moves ahead of the append; both missing means even the recovery did not run and the next hand is a controller reset that clears state without waiting for a completion; quiesce=0 with the same four absences moves the suspect onto the raw-PIO path itself; quiesce=2 or 4 is a card story, not a sink story; quiesce=5 means a core was still running through the panic; quiesce=7 voids every sink reading taken before it; and a door that reads idle with owner=0x0 while the marker still carries a live host ticket is the threshold being read before the marker, not a card nobody holds.",
"round324 (v0.7.35, kernel rebuilt: prelink 77caf731 -> amfi 7b5fbc42 -> normalized 1ac95197 with 973/973 object stamps blanked, ADT 14384 B byte-identical to r322 so ephemeral stays reverted, payload 369173b0 = ~/clover-out/round324-v0.7.35-payload.img, 58720256 B, check-clover.py EXIT=0 and verify-clover-payload.py EXIT=0 51 OK/0 FAIL) is the two-hands round the user chose: arm the APSS watchdog so a HANG can self-land TWRP, and move the per-beat debt ladder from SpringBoard onto backboardd itself. Hand one (package/CloverKeyStoreProbe.cpp): the WDT at 0x17817000, read-only since r281/r292, is now WRITTEN once past t>=300 s -- BARK(0x10)/BITE(0x14)/EN(0x08)/RST(0x04) in watchdog_v2.c's own order, BITE the 20-bit max 1048575 (~32 s), BARK 3 s under, EN bit0 only (bit1 is UNMASKED_INT_EN, which would give a bark FIQ not a reset), then a pet every 4 s. The gate is the boot arg clover-wdt-arm=1 (board.toml line 2391), not a compile default: drop the line, the whole hand is gone. A kernel that stops scheduling lets the countdown lapse and bites to a hard reset the r198 recovery BCB lands in TWRP -- the unattended read-back of a hang that no prior round could produce (boot 109's en=0 armed=0 all boot is exactly the hole). It does not preempt the 1800 s deadline: a boot that keeps the timer firing keeps the WDT fed, so it only covers the case the deadline cannot. The r281 state row gained req=/pet= so three readings an en-only column cannot separate: req=0 (not armed by design), req=1 armed=1 pet high (alive and fed), req=1 armed=0 (write did not take -- TrustZone locked, honest). Positive control unique to this image: clover r324: wdt-arm t=%u bite_ms=%u at=%u. Hand two (osfmk/kern/task.c, patches/xnu-clover/zzz(67)-clover-r324.patch, 4 hunks): boot 109 read hops=2 but not the owner name, because the r234 bbhopo row printed once inside the change-gated census burst and the console tail dropped it -- an instrument-horizon landing problem, not a code gap. r324 latches the first resolved hop's remote port and owner name into four new volatile file-scope cells on the walk that already computes them (clover_bb_debt_rem/hn/set/name; set stored last so a reader that sees it set also sees the name; cleared on an hn==0 fire), and the beat thread re-states it EVERY beat through r308's proven-survives driver relay clover_emmc_probe_say AND printf -- the fourteenth-layer copy that does not ride the pipe it measures -- as clover r324: bbwhy t=%llu pid=%d fired=%u hn=%u rem=%x set=%u state=%s owner=%s. Four states each with its own absence reading (thirteenth layer: 0 is not 'nothing happened'): never_walked (fired=0, the walk never ran), no_hop (fired>0 hn=0, a real reading -- backboardd idle), hop_owner (set=1 + name, the debt itself), hop_unresolved (a hop but no owner resolved this beat). Driver CloverSdhci.cpp: two independent tee classes r324-wdt(8, prefix the SPECIFIC clover r324: wdt so it does not shadow bbwhy) and r324-bbwhy(24 = the beat count a WDT-shortened boot can produce). check-clover.py pins the boot arg, the three probe arm needles, the patch file + its bbwhy format string + debt_hn decl + the set=1 store, and both tee class lines; verify-clover-payload.py pins two kernel CStrings r324-wdt-arm / r324-bbwhy and moves the aks-say-wdt needle onto the new req=/pet= shape. Boot 110 read-back is pre-registered in notes/development-log.md section Round324 (5): (A) does the arm land -- r324: wdt-arm present + req=1 armed=1/0/pet; (B) the debt owner name -- bbwhy state=hop_owner/owner=<service> is the reading boot 109 owed, no_hop means the stop moved, never_walked is an instrument gap not 'no debt'; (C) does a hang now self-land TWRP at ~719+32 s with the card holding boot 110's own reset record and NO manual pull; (D) ephemeral must stay ABSENT so 110 lines up against 109. First payload attempt omitted --data-ramdisk/--trust-cache and verify correctly went red on scratch-data.img MISSING / kernel.macho.trustcache MISSING (r245's same trap); rerun with both flags green.",
"boot 110 (read back of round324-v0.7.35, ~/clover-out/clover-log-window-boot110.bin, no new image -- version stays v0.7.35): hand ONE WORKS and closed the infrastructure gap the user reported twice. The r281 state row reads en=1 armed=1 intmask=0 bite=1048575 bark=950280 req=1 pet=21->60 (boot 109 was en=0 armed=0 all boot) -- the APSS watchdog really got enabled and fed by the 4 s timer. The board then hung ~558 s (no r281 wdt row after 558 while other threads still log to ~612 s, so the aks timer itself starved) and the countdown lapsed: no deadline record (the card's is boot 108's STALE), no panic (misc block 1 empty, both markers STALE boot 108/87), yet run-clover-unattended.sh line 10 saw TWRP's adb come up on its own -- 'the board reset and the pre-armed BCB landed it in recovery' -- and read the window with ZERO manual pull. That is the first time a HANG (not a panic, not a deadline) was auto-read, and the control is boot 109 (en=0) not self-landing. Caveat kept honest: the designed one-shot positive control `clover r324: wdt-arm` (printed once at ~t=300) is ABSENT from the card -- the 512-line kernel ring only retains back to ~t=395, so the ~300 s row rotated off; the periodic r281 state row (req=/pet=, 4 s) is the second leg and it survived, which is why the conclusion holds. hand TWO did NOT capture the debt owner and the cause is named, not guessed: every `clover r308: beat` row reads target=0 ent=0 fired=0, i.e. the per-beat sampler thread never latched a target, and the r324 bbwhy block sits inside clover_bb_beat_thread's `if (clover_bb_target_pid != 0)`, so it never ran on either leg; backboardd only fires on the CHANGE-gated census (r309 latch t=603 pid=58 -> r229 bb t=607 pid=58 hops=4 wait=8 -> r308 smp-pre t=607), and that family's owner rows (bbhopo/r267/r303) are dropped by the tail exactly as in boot 109. So backboardd IS blocked and the debt DEEPENED (hops 2->4), but who it blocks on is still uncaptured. r325 opens the per-beat gate to pid 58 unconditionally (or moves the debt latch+relay onto the change-gated path itself) -- a once-per-burst row cannot be evidence; the per-beat cadence must be faster than the event it judges. No new image this round; hand 1's arm (clover-wdt-arm=1) is unchanged and r325 reuses it.",
"r325 (v0.7.36, kernel rebuilt: prelink 58a382c8 -> amfi 182f3213 with both sites still 0x1ae00e4 and 0x1ae016c and their r163/r164 encodings -> normalized c593405a with 973/973 object stamps blanked, ADT 14384 B so ephemeral stays reverted, payload e08bdd66 = ~/clover-out/round325-v0.7.36-payload.img, 58720256 B, check-clover.py EXIT=0 and verify-clover-payload.py EXIT=0 51 OK/0 FAIL, display archive re-audited against this kernel with build-report kernel_sha256 58a382c8 and late_object a6fd5f5c) is the correction round plus the one hand it asked for. Boot 110 read back that the debt-owner ladder never printed, and re-reading this repo’s own log says the registered cause was backwards: the latch DID open at t=603 (r309 latch pid=58 is on the card) and the census fired at 607 (r229 hops=4), but this boot kept only the beats at 181/301/421/547, all pre-latch, and the next was due at 667 in a boot that ended near 612 -- so the defect is cadence, the very thirteenth-layer rule round324 quoted and then broke: moving a once-per-burst row onto a once-per-120s row is slower than the event, not faster. r325 stops waiting for a clock: patches/xnu-clover/*-clover-r325.patch (68 z, sorts after r324) adds char hopown[4][24] to clover_bb_sample, copies each hop’s already-resolved owner name into it (no new port lookup), and after the hop loop seals one row per fire on the driver relay BEFORE the printf -- clover r325: bbnow t= pid= fired= hn= rem= set= state= o0= o1= o2= o3= -- so the whole chain, not just hop 0, arrives in the window boot 110 proved the relay survives (r309 cen-in at 607 reached the card). Three absences stay separable: bbnow silent with r229 present is code that did not compute; both silent is a boot whose change gate never opened and must not be read as no debt; and state=no_hop is a reading that backboardd had no blocked send. Driver CloverSdhci.cpp: tee class r325-bbnow (32) plus the per-pass-cap exemption, because the row prints inside the census burst, a half-eaten burst reads as an empty one, and the relay copy does not ride that cap -- the two copies are each other’s control. r324’s beat row and the clover-wdt-arm=1 arm stay byte-for-byte so boot 111 lines up against 110 and 109. Two build traps caught on the way and both recorded: the plain python3 has no tomllib, and the replay broke on bsd_init.c:987 although this round touches only task.c -- that is the symptom of the LATE_PATCH list never having been told about r324, so the reversal stripped r309 and its neighbours while the newest patch stayed un-strippable; r325 and r324 now sit at the head of that list and the three-phase replay (zero, forward 133, reverse 67, replay 133) is green. Boot 111 is pre-registered in notes/development-log.md section Round325: (A) do o0..o3 name the debt, (B) which of the three absences this is, (C) the r324 arm must still read en=1 armed=1 req=1 pet= and the board must still land in TWRP by itself -- losing that is a regression, not a boot that did not hang, (D) the ADT must stay ephemeral-ABSENT.",
"boot 111 (read back of round325-v0.7.36, ~/clover-out/clover-log-window-boot111.bin, no new image -- version stays v0.7.36): the pre-registered absence branch B(1) is what landed, and for the first time it is a reading rather than a hope. The single backboardd fire this boot is row-by-row on the card: r229: bb t=712 pid=58 f=1 hops=4, then r229 sbport, r234 sbown own=58:backboardd, r262 census threads=19 shown=19 wait=18 run=1, r270 ipi, r271 real=8 reg=8 start=7 run=8, r299 smp req=1 con=1 run=7 -- and nothing after, because the kernel entered its panic sink in the same second (flight marker t=700237ms k=712s boot=111 magic=yes stage=0 rc=0 probe=8/8 pend=0). The relay proves the same cut from the other side: boot 111 sealed 8 kind-25 lines, last one r308 smp-pre t=712, and no smp-post -- so the stop sits between the core counts and the hop walk, exactly where r325 put its row. Therefore clover r325: bbnow, r324 bbwhy, r234 bbhopo, r231 bbhop and r300 done are all zero rows: that segment never ran. Three corrections to this repo’s own archive. (1) r325’s premise was wrong: sealing at the fire only helps if the fire reaches the hop loop, and hn/hrem[] are filled at task.c:13592 -- hops=4 is already printed by the r229 row -- so the seal has to sit right under that row, inside the millisecond band this boot proved deliverable (cen-in and smp-pre both reached the card there). (2) boots 110 and 111 self-landed in TWRP by two different deaths: 110’s panic markers are STALE (never entered the sink -- a bare reset), 111 entered the sink and stopped after marker(0), the boot 102 shape again. The armed-watchdog leg holds both boots, but the two readings must not be merged. (3) boot 111’s cause of death has no reading and must not be written as a watchdog bite: the r281 wdt rows are change-gated (their silence after t=542 says only that the signature did not change, and the class budget 48 was not spent), other families run to 712, and bark 29 s / bite 32 s after the last pet lands at ~574 s, not 712. Display side moved one frame further than boot 110 and still is not a desktop: frame#0..#5 all at box=305x811..970x1108 pixels=45460, swap#4 accepted, retire#4 presented=4, five framebuffer clients -- so the stop-the-loop condition is not met. r326 is pre-registered in notes/development-log.md section Round325 reading item 5: move the four-owner seal to the row right after r229: bb, same fields, relay first then printf, and judge boot 112 on A (bbnow present with o0 a service name closes the debt owner open since boot 109), B (bbnow with hn>0 and o0=- indicts the owner lookup, not the placement), C (bbnow absent while r229: bb present means no fire at all this boot and the beat gate becomes the mainline again), D (arm still en=1 armed=1 req=1, ADT still ephemeral-ABSENT).",
"round326 (v0.7.37, kernel rebuilt: prelink 1c26112e -> amfi ae18bf02 with both exec-hook sites rewritten -> normalized 6822bee8 with 973 object stamps zeroed; payload.json self-reports kernel_sha256=6822bee8, which is how this round proves the shipped kernel is the normalized one and not the stale out/clover/kernel copy; round326-v0.7.37-payload.img 820b7782efaa27a0, 58720256 B, different from boot 111 e08bdd66; check-clover EXIT=0 from out/clover/tree, verify-clover-payload 51 OK / 0 FAIL with r326-bbnow present, r325-bbnow-gone present and ADT ephemeral-storage ABSENT) moves one row and retires one premise. Boot 111 measured the premise instead of inferring it: the only fire of clover_bb_sample in that boot printed r229, r234 sbown, r262, r270, r271 and r299 into the kernel ring between .248337 and .248550, and the relay sealed cen-in and smp-pre in that same second but no post-line, so the segment round325 sealed the hop owners in sits below the last segment the card ever received rows from. Zero bbnow rows is therefore a placement fault, not an absence of debt. The seal now sits immediately after the r229 line, where hn, hrn, hloc and hrem are already filled and hops=4 is already a printed field, names the four hop owners itself, and goes to the driver relay first and to the console second. One deliberate deviation from the pre-registration: the seal does not write the r324 clover_bb_debt latch, because that latch is bbwhy s only writer and a second writer would make set= mean two producers -- it uses a local count and renames the column res=. Round324 s beat row, its latch and the clover-wdt-arm=1 watchdog are byte-unchanged and no boot arg moved, so boot 112 lines up against 110 and 111. Patch zzz(69)-clover-r326.patch is reversed ahead of r325, r324 and r309 in LATE_PATCH because it deletes lines inside blocks those rounds added, and check-clover now asserts the patch added lines and deleted lines separately: a plain substring test would pass a round that shipped both rows. Boot 112 is pre-registered in notes/development-log.md Round326 item 5: A bbnow with a service name in o0 means the debt owner is named for the first time since boot 109; B row present with hn>0 and o0=- means placement is fixed and resolution is the remaining suspect; C still zero rows with r229 present means no fire this boot and the per-beat target=0 branch becomes the mainline again; D en=1 armed=1 and ephemeral ABSENT still hold, and the desktop cell is read from frame, presented and box.",
"boot 112 (read back of round326-v0.7.37, ~/clover-out/clover-log-window-boot112.bin, no new image -- version stays v0.7.37): the placement half of this round is closed and the reading half opened a stranger shape. clover r326 bbnow arrived on both channels (relay slot 2 seq 66, kernel ring slot 65 at 885.179096) inside the same t=882 fire whose r229, sbport and sbown rows precede it and whose r262 census follows it -- boot 111 read zero rows of the same instrument, so r325 was a placement fault exactly as registered, not an absence of debt. The row reads hn=4 rem=0 res=0 state=hop_unresolved with all four owner columns dash, and that dash is only half explained: hop 0 remote port name is 0 (MACH_PORT_NULL), so the naming helper was never called. The question who does backboardd block on becomes a sentence with no send peer in it, and the two rows beside it say what is being waited for: r229 sbport nm=2f03 ms=0 sr=1 plus r234 sbown nm=2f03 own=58 backboardd -- an empty receive queue on backboardd own port. Three causes of dash (remote zero, remote equal to local, asked and no name) still cannot be told apart, and a second correction lands here: hloc is x[3]>>32 while x3 carries a 32 bit port name, so its high half is caller residue -- the rows below that print lo= have been printing the owner of residue and must be re-read that way. Hand one held for a third boot with zero manual steps (TWRP adb came up, r198 recovery BCB pre-armed rc=100 written=1, misc block 1 empty) and boot 112 has boot 110 shape, not boot 111: both panic markers STALE, this boot never entered the sink. What boot 112 does not give is the arm state itself: the card says CloverSdhci r195 r281-wdt probe lines capped at 48 and the ring horizon is 628 s, so zero r281 wdt rows in the window -- three self-landings are real, three armed readings are not. Desktop cell unchanged: frame#4 box=305x811..970x1108, presented=4, census threads=18 against boot 111 19; smp-post still zero. round327: split the dash into null, self and fail by cause and carry the four raw remote names r0 r1 r2 r3 in the same row so that ambiguity cannot recur, and if all four read null the mainline moves from walking the debt to naming who should have sent to 2f03, which means bringing the r303 receiver census into this proven band. No new image this round.",
"round327 (v0.7.38, kernel rebuilt: prelink 6b2bae71 -> amfi 28e08787, both exec-hook sites rewritten at 0x1ae00e4 and 0x1ae016c with the r163/r164 encodings -> normalized 5f07606d with 973 object stamps zeroed; payload.json self-reports kernel_sha256=5f07606d, which is how this round proves the shipped kernel is the normalized one and not the stale out/clover/kernel copy; round327-v0.7.38-payload.img 9f53fa5d33002a74, 58720256 B, different from boot 112 s 820b7782; check-clover EXIT=0 from the repo and from out/clover/tree (12 archives, 22 objects ABI-checked); verify-clover-payload 51 OK / 0 FAIL with r327-bbnow present, r326-bbnow-gone present, r325-bbnow-gone present and ADT ephemeral-storage ABSENT) changes only what the debt row can say, because boot 112 closed the placement and opened the semantics. That row landed on both channels, so where it is sealed is no longer the question; what it read is: hn=4, rem=0, four dashes. One dash covered three facts at once -- no remote port to name, a remote whose owner the walk could not find, and a name computed but not carried -- and the next hand needs the first apart from the second. The four slots are now causes: null = that hop s remote port name is 0, fail = a remote was asked and this task s ipc space returned no owner after all three ipc_object_translate legs plus the clover_port_recv_task fallback, anything else = that owner as pid:comm. res= (a hop-0-only flag) becomes named= and asked= counts; state= gains hop_null beside no_hop / hop_unresolved / hop_owner; and r0..r3 carry the four remote port names in the raw in the same row, so a literal and the word it was computed from are one reading (layer eleven). hrem[4] is zero-initialised because the row prints all four slots while the hop walk fills only hn -- uninitialised slots would print stack residue as if it were a port name. The hrem != hloc skip is deleted, not reused: hloc is x[3]>>32, caller residue the trap never defines as a port name (boot 112 correction 4-1), so it no longer gets a vote on whether a name is asked for. That is also why this round does NOT ship the self literal the pre-registration named: deciding self would need hloc, so a self-loop is instead read off the owner name itself (58:backboardd standing in o0= says it plainly). Patch zzz(70)-clover-r327.patch is reversed ahead of r326, r325, r324 and r309 in LATE_PATCH because it rewrites the very block r326 wrote, and a failure in that loop is silent. Two gate shapes were learned this round and both are pinned: an added-line needle on clover_emmc_probe_say is wrong for a round that keeps the channel (that line is context, so the assertion is now the reverse one -- the patch must not DELETE the relay copy), and a rule that no added line may mention hloc has to read code lines only, because this round s own comment quotes the comparison it removes -- the gate went red on itself first. tee class and exemption prefix move to r327-bbnow (32, per-pass cap exempt); board.toml title and both title assertions move to clover r327:. Round324 s beat row and latch, the clover-wdt-arm=1 watchdog and every boot arg are unchanged, so boot 113 lines up against 110/111/112. Boot 113 is pre-registered in notes/development-log.md Round327 item 5: A any slot holding a name that is not null or fail names the debt owner for the first time since boot 109 (a name equal to 58:backboardd is a self-loop -- a reading, not a closure); B state=hop_null with r0..r3 all zero means none of the four waits has a sender, so the mainline moves from walking the debt to asking who should send into port 2f03, which is r303 s receiver census pulled into this proven band; C state=hop_unresolved with asked>0 and named=0 indicts the owner resolver, not the row; D bbnow still absent while r229: bb present means no fire at all this boot and the per-beat target=0 branch becomes the mainline again; E comparability -- ephemeral still ABSENT, r319: last control present, the arm leg still readable only as a self-landing (three self-landings are not three bites), and the desktop cell read from frame / presented / box.","boot 113 read back (round327-v0.7.38-payload.img 9f53fa5d, card window clover-log-window-boot113.bin ac24461d33d9b7f8, decoded .txt 1926 lines) lands branch C and turns the instrument on itself. The row is on both channels again -- relay slot 59 seq 59 boot 113 and kernel ring [565.436709], still between r234: sbown and r262: census -- so the placement holds a fourth time, and the burst still ends at r299: smp with zero r231: bbhop rows in boots 111, 112 and 113. The reading is hn=3 state=hop_unresolved asked=1 named=0 o0=null o1=null o2=fail o3=- r0=0 r1=0 r2=7513 r3=0, so the four dashes of boot 112 are now three different causes: two hops have no send-side destination at all, one hop was asked and got nothing, and the fourth slot was never walked. What this round really produced is the observation that the seal asked only one column: x[3] low is the SEND destination, while the receive name of each trapped thread sits in hrn=x[5]>>32, computed in the same frame and never put in the row. The positive control is on the same boot and proves the resolver and the space both work -- r221: sbm2 ... rem=2e03 ... ro=58:backboardd -- so null does not read as backboardd owing nobody, it reads as a receive-only call having no send target. Two columns were re-paired from the source rather than from memory this round: rn= takes r[5] high and rs= takes r[6] low, and an earlier count in this repo s own notes had dc= and rn= on the wrong halves. One old assertion is withdrawn: round326 item 4-1 called hloc=x[3]>>32 caller residue, inferred from boot 112 s four dashes, but that same column is r221 s loc= and is named by the same resolver, so its status is unproven, not residue. Landing for boot 113 is the first in the series that only the watchdog explains: no deadline record, no marker for this boot (the two on the card are STALE boots 111 and 87), r281: wdt en=1 armed=1 req=1 pet=60 last at t=546, kernel ring last at 565.4369, bark 29 s and bite 32 s put the reset near 578 s. Fourth zero-human landing on the armed watchdog. Host-side debt recorded: run-clover-unattended watched 2220 s and reported neither adb nor fastboot, while the board later sat in recovery holding boot 113, so WHO returned it to TWRP has card evidence and WHEN has none; the reading came from a manual dd. Round328 hand: in the same proven band, ask every hop s receive column -- owner name plus that port s imq_msgcount -- with null / fail / name per cause, rcv= and q= raw words, and state= switched to any column naming. Pre-registered A: a receive name appears, and q>0 means a message already sits in the port undelivered while q=0 means nobody sent; B: receive all null means the x16=-47 gate is selecting the wrong threads; C: receive all fail alongside r2=7513 failing indicts clover_sb_port_owner s translate legs rather than the column choice; D: comparability -- wdt armed row and r319: last present, desktop still read from frame / presented / box, and the stop condition stays reaching iOS, not producing a reading.","round328 (v0.7.39, kernel rebuilt: prelink 85146864 -> amfi 2907d7c4, both exec-hook sites still at 0x1ae00e4 and 0x1ae016c with the r163/r164 encodings -> normalized 0f666cf8 with 973 object stamps zeroed, 52404224 B; round328-v0.7.39-payload.img 3a9eee3e, 58720256 B, different from boot 113 s 9f53fa5d; payload.json self-reports kernel_sha256=0f666cf8; check-clover EXIT=0 from the repo and from out/clover/tree (12 archives, 22 objects ABI-checked); verify-clover-payload 51 OK / 0 FAIL with r328-bbrcv present, r327-bbnow STILL present because this round adds a row instead of replacing one, r326-bbnow-gone present, r325-bbnow-gone present and ADT ephemeral-storage ABSENT; boot args unchanged byte for byte so boot 114 lines up against 113) asks the column boot 113 said we had never asked. A new row clover r328: bbrcv seals in the same proven band, immediately after r327 s seal, and for each of the hn hops it asks hrn[i] = x[5]>>32 -- the receive name -- through the same resolver on the same task, then reads that port s queue with the existing helper clover_sb_port_mail (task.c:11506), which returns imq_msgcount, srights AND an error code. Columns: c= the four owner names dot-joined, v= the four raw receive port names, q= msgcount, s= srights, e= the error each read came with; absent names split by cause again (null = hrn[i] is 0, fail = asked and nothing answered, otherwise the owner), with rnamed=/rasked= counting the two branches and rstate= in four words rcv_none/rcv_owner/rcv_unresolved/rcv_null. Both copies ride (driver relay plus console printf). hrn[4] is now zero-initialised where it was bare uint32_t hrn[4];: the row prints four slots while the hop walk fills hn of them, and uninitialised slots read as stack residue -- the same lesson r327 learned for hrem, paid here for the other column. Three deviations from the pre-registration, all on disk: (1) r327 s state= is NOT redefined -- folding the receive column into it would let one word name two columns and would destroy the boot 112/113 two-channel control, so the receive column says so in its own words; (2) the raw column is v=, not the pre-registered rcv=, because the row already carries c= names and q= counts and rcv= would read as a third count -- v=/c= is value/name; (3) the queue is read through clover_sb_port_mail rather than the clover_sb_port_state leg, because that helper already carries int *err, and a distinction that must be read (a helper s zero versus a real zero, r303) must not be created by a new uninstrumented branch. The gate went red once this round, on its own needle: it asked for the cross-line substring \"rcv_unresolved\" : \"rcv_null\", but the ternary is wrapped for the 84-column rule so no single added line holds it. The fix is two needles, each literal required on its own -- a line break is layout, not semantics, and a needle that pins whitespace between two literals makes an unrelated re-wrap fail the contract (layer eighteen). Before flashing, the full row format string was checked to exist in the normalized kernel as one CString, so the format itself was not folded away (seventeen). Patch zzz(71)-clover-r328.patch (95 lines, two hunks, byte-identical to the UniXNU/patches/xnu copy, proven reverse-to-r327 then forward before shipping) is reversed ahead of r327 in LATE_PATCH because both its hunks use r327 s lines as context. tee class and exemption prefix r328-bbrcv (32, exempt from the per-pass cap so the console copy cannot be capped while the relay copy survives). Boot 114 is pre-registered in notes/development-log.md Round328 item 6: A any c= slot naming an owner, read with that slot s q= -- q>0 means mail already sits in the port unread (delivery/scheduling), q=0 with e=0 means nobody sent; B c= all null with v= all zero means those trapped threads are not receiving at all and the x16 == -47 gate is selecting the wrong objects; C rstate=rcv_unresolved with rasked>0 and rnamed=0 -- read against boot 113 s half-refutation (same boot, same function named rem=2e03 as 58:backboardd), so first check whether v= lands in another space before indicting the resolver; D comparability -- r327: bbnow still on both channels, r319: last control present, r281 wdt en=1 armed=1 present, e= = -1 slots must sit beside c=null (this round s own sentinel, not a port error), and the desktop cell still read from frame / presented / box; the stop condition stays reaching iOS, not producing a reading.","round329 (v0.7.40, HOST-ONLY ROUND: built, gated, archived and released, NOT flashed -- the board could not be restarted, so the round was chosen by reading sheng, not by asking the card. Kernel rebuilt: prelink a72937c7 -> amfi 3610be15 with both exec-hook sites still at 0x1ae00e4 and 0x1ae016c (encodings 0x34000229->0x14000011 and 0x36000520->0xd503201f) -> normalized d340ed02 with 973 object stamps zeroed, 52404224 B; round329-v0.7.40-payload.img e9c41a1f, 58720256 B; payload.json self-reports kernel_sha256=d340ed02 so the shipped kernel is the normalized one; check-clover EXIT=0 from the repo and from out/clover/tree (12 archives, 22 objects ABI-checked); verify-clover-payload 51 OK / 0 FAIL with r329-dispstate present, r329-dispstatecut present and r327-bbnow / r328-bbrcv STILL present because this round adds rows instead of replacing any; boot args byte-for-byte identical to round328 by field diff. Why an instrument and not a fix -- four research conclusions, all on disk: (1) boot 113 s wait is already answered (selector 6 ... -> 00000000 is success; swapId reached 4 and no fifth came), so what is missing is not a refusal but the ability to see whether anyone kept asking; (2) selector 55 s e00002c7 is stock -- IOMobileFramebufferLegacy vtable slot 202 is an unconditional return 0xe00002c7 stub in the shipping binary, so sheng-vsync=120 neither causes nor cures it and IOMFBDisplayRefresh has no reader anywhere in the cache; (3) the three r252: miss properties are HID/audio identity that sheng does not publish either, so they are a red herring; (4) what sheng genuinely has and this port lacks is a CALLER: its package/BootLog.c pulls all four legacy display report helpers that round180 vendored, and here all four have zero callers. This round does NOT wire those helpers -- they stay dead and the debt stays on the books -- it publishes the same report itself, from the same counters and the same three object words, as one periodic row: clover r329: dispstate ms= fires= seen= client= calls= fails= regall= regs= grew= hot= s6= done= presented= frames= vs= log=/ logdrop=. It rides the display driver s own work loop (a 30 s IOTimerEventSource, started unconditionally and stopped in both stop and free), because a cadence gated on a boot argument cannot be the instrument that reads what that argument controls -- the gate asserts startStateBeat() contains no PE_parse_boot_argn. Two trigger sites, one producer: the beat, plus one fire inside interpose(); the second is the discriminator that separates the display work loop stopping from nobody calling. Columns follow the same rules this repo has been taught: the clock is ms= and never t= (t= already means seconds since first frame in this file and seconds since boot in the kernel rows, and negative needles forbid both t= and us=), absent values print - per cause rather than as a zero, grew= prints - until there is an earlier sample to subtract, regall= (every call) sits beside regs= (only the slots kept) so starvation is countable, vs=0/0/0 is a reading because its producer always exists in this file, and log=/logdrop= count the r180 96-line budget from inside the refusal branch -- boot 113 spent 55 of those lines, which is exactly why a missing row could not be told from an event after line 96. The row itself bypasses that budget (a witness cannot be silenced by the thing it witnesses) and a 320-byte card record cannot testify that its own tail survived, so a second row dispstatecut carries the width it needed. Two containment traps were handled on purpose: r329-dispstatecut is a superstring of r329-dispstate and teeProbeClass takes the FIRST prefix match, so the longer token is listed first and check-clover asserts find(dispstatecut) < find(dispstate); and the class budget is 96 = 1800 s deadline / 30 s = 60 beats plus at most 8 client-fired rows. Two self-caught errors recorded: a local uint32_t presented shadowed the row buffer char presented[16] and the archive refused to compile (renamed to shown -- a column being same-source with its expression does not mean the local must share its name), and board.toml s on-card title originally claimed this round wires two of the helpers, which is false while they have no caller; the title now says the round publishes the report itself and keeps the helper debt, and since the title ships inside unixnu.toml the payload was rebuilt after the correction (the kernel did not change). One host-side finding came out of that rebuild: adt_sha256 changes on every single build of identical inputs, because /chosen s random-seed is a 64-byte property re-rolled each time -- diffs of three ADTs (r328, r329, and a third r329 rebuild, kept in ~/clover-out/round329-adt-compare/) show every difference inside offsets 397..460 and nowhere else, and zeroing those 64 bytes makes all three byte-identical at d7eaf753. So the ADT has a named comparator now, and round324 s claim that its ADT was byte-identical to round322 s was never checkable by adt_sha256: at the time only the 14384-byte size was comparable. Next flash stays round328-v0.7.39 so boot 114 reads r327 s send row and r328 s receive row un-confounded; dispstate first gets a reading at boot 115, pre-registered in notes/development-log.md Round329 item 8: A the row lands on two or more beats about 30000 ms apart -- the display work loop is alive -- and then grew= separates backboardd having stopped asking from it still asking while presented= does not move; B fires=1 only, from the client, and nothing after -- the loop stopped, which is the one reading this round exists to make, with r319: last and r281 armed=1 as the channel positive control; C no row at all while log= approaches 96 or logdrop>0 -- starvation, which forces every past judgement resting on a missing row to be re-read; D dispstatecut present -- the row does not fit 320 bytes, so the next hand narrows columns rather than accepting truncation. r330 s first two items are booked: the comment-only round that withdraws the int-209/int-210 citations in NativeLegacyDisplay.cpp and tightens the probe s own closes-the-difference sentence, and the four report helpers still needing a caller.",
"round330 (v0.7.41, HOST-ONLY ROUND, second one running: the board still cannot be restarted, so nothing was built that ships. Kernel, payload, board.toml [payload] title and every boot arg are byte-unchanged -- moving the title would force a payload rebuild while the next flash is still round328-v0.7.39 and dispstate first gets a reading at boot 115. What changed is the read-back path, in two places. (1) scripts/run-clover-unattended.sh now writes one timeline file per run, $(basename $OUT).timeline.txt, one section per watch, for all four windows (wait-fastboot, wait-adb, watch-landing, after-deadline): every poll records BOTH tools answers (adb_serial and fastboot_serial) plus elapsed seconds, written when either answer changes and otherwise once a minute, closed by a named result (adb / fastboot / timeout / neither) with an ioreg -p IOUSB -w0 tree snapshot at open and at close, and the four failure messages plus the final success line name the file. The reason is on disk: ~/clover-out/round328-boot114-unattended.log (932 B) ends in neither TWRP's adb nor fastboot within 2220s and ~/clover-out/*.timeline.txt had no member at all, while the card carries WHO put the board back (misc BCB, panic markers, watchdog counters) and nothing anywhere records WHEN it came back. The two candidates that sentence hides are 2220 s apart -- a landing just after the window closed, versus a reset that never reached this host -- and the old loops only spoke when something appeared, so a silent window left no artifact. That is the same defect this port keeps finding on the card side, in shell: an instrument that answers only its interesting case cannot date its own silence. The tree, not a name match, is sampled because the question is whether the board enumerated in ANY mode, and the mode where it might is one neither tool sees -- this host's own ioreg carries a QUSB_BULK_SN device, which is a Qualcomm diag/EDL name that adb and fastboot both miss (different SN, so it does not implicate clover; it proves the branch is visible). (2) scripts/read-clover-log.py --selftest now builds round329's dispstate and dispstatecut rows from the probe's own format literal instead of retyping them: joined_literal() folds the adjacent C literals the compiler folds (the r329 format is split in two for the 84-column rule, and a needle or a test pinned on one half would pass while the shipped row renamed a column in the other), fill_conversions() substitutes each conversion left-to-right with a single regex so %llu is never eaten as %u, and the test asserts no % is left, the row is strictly narrower than the kDispStateRowBytes read out of the same source (216 B and 63 B filled), and kDispStateRowBytes 320 <= SECTOR - len(PREFIX) - 1 = 488 -- so the ceiling the probe imposes already sits inside one card record and the panel can never split this row, a conclusion that holds for any values the counters take. The sample values are stand-ins, not a boot reading, and nothing is judged on them. Gates: three new needles negative-tested one by one and each named in the output (delete the timeline_open watch-landing line, remove f=$(fastboot_serial) from watch_landing(), append an unclosed if to the script), the file restored from backup and diff -q identical afterwards; a new gate that had never existed now runs bash -n on the read-back script, because until this round its syntax was only ever tested by running it on the board's clock, where a typo costs a 2220 s window nobody read. check-clover.py EXIT=0 from the repo and from out/clover/tree (12 archives, 22 objects ABI-checked); read-clover-log.py --selftest green; verify-clover-payload.py re-run against the archived round329-v0.7.40-payload.img e9c41a1f EXIT=0 with 0 FAIL, r329-dispstate / r329-dispstatecut / r327-bbnow / r328-bbrcv all present and unixnu.toml title ok. One dry run with no board attached and no card written (bash scripts/run-clover-unattended.sh --wait 6 --skip-recovery --out /tmp/r330-run/window.bin) produced the 1,970 B timeline with poll lines at elapsed 0/60/120 s -- the heartbeat fires, it is not only a change recorder. Flash plan unchanged: boot 114 is still round328-v0.7.39 judged by Round328 item 6 branches A-D, boot 115 is round329-v0.7.40 judged by Round329 item 8 branches A-D, and the first run that carries a timeline is judged by the three branches pre-registered in notes/development-log.md Round330 item 7 (close:adb / close:fastboot gives the landing time; all-poll-dash plus a USB tree with nothing resembling this board raises the reset-did-not-reach-this-host branch; all-poll-dash plus a new Qualcomm-diag-shaped device means the window was never the question). The constraint that keeps that reading honest: a timeline testifies only to what was present, so a silent window is a statement about this host, never about the board.",
"round331 (v0.7.42, HOST-ONLY ROUND, third one running: the board is still away, so the image is built, gated and archived but NOT flashed and the next flash stays round328-v0.7.39-payload.img. kernel d9305939 -> amfi+normalized 1e5871a2 (normalize rewrote the amfi file in place, so both archived names carry the same bytes), payload e7b14b6a = ~/clover-out/round331-v0.7.42-payload.img, 58720256 B, payload_kernel_sha256 0692a048, kernel_args byte-identical to round328-payload.json, hardware_tested false, check-clover.py EXIT=0 from the repository and from out/clover/tree, verify-clover-payload.py EXIT=0 with 51 OK / 0 FAIL) asks the one question boots 112 and 113 left open, outward from the object: who holds a send right to the port backboardd waits on. One kernel patch, patches/xnu-clover/zzz...z(74)-clover-r331.patch, byte-identical in UniXNU/patches/xnu/, reverses before r328 in LATE_PATCH. Two legs kept separately because they disagree by construction: leg A is ipc_hash_lookup over pid 1..400, and osfmk/ipc/ipc_hash.c:173-175 states that only pure send rights are entered into that reverse table, so its count is a lower bound and is printed beside ip_srights -- hits<sr is itself a reading; leg B walks the waiter's own ipc_entry table comparing ie_volatile_object, the field ipc_right.c:176 uses for a racy reader, which is the leg that can say the send right is backboardd's own. The object is held with ip_reference for the whole scan (ipc_object_translate returns it locked and unreferenced), each space is read under is_read_lock/is_active/smr_ipc_enter/smr_entered_load, scan= carries one literal per way of not having a reading (no_cand, no_space, xlate, notport, no_srights, own_only, hash_only, holders, no_holder), cand=/debt= count over every hop while the row picks the first debt, probed=/walked= print the two horizons, bbsh/bbown detail rows carry ty= beside raw= because IE_BITS_TYPE_MASK is 16..20 while EX_RECEIVE is bit 21, and three tee classes plus the r331 per-pass-cap exemption exist so that a row the cap ate can never read as a scan that found nothing. sheng offers nothing to copy here -- its patches/xnu/*.patch touch only kern_exec.c, processor.c, sched_clutch.c and two pexpert headers, task.c is untouched. New column names throughout (scan=/ownnames=/walked=/probed=/scanned=/cand=/debt=): boot 100's t= lesson applies to a name as much as to a unit, and check-clover.py now refuses state=/own=/ent=/set=/res= on this row. Reading branches S-A..S-E for the first boot carrying the row are pre-registered in notes/development-log.md section Round331 (7).",
"round331b (same release, host-only, no product code changed so payload e7b14b6a stays valid and no version was spent): the repository gate itself went red -- the arbiter host model asserted at clover_power_host.cpp line 470, an assertion that shares no code with round331's task.c patch, and it reproduced load-dependent (1 red in 3 idle runs, 2 red in 6 runs with eight busy children). The cause is two clocks read as one: the model's fake PMIC paced itself with usleep (50) while pa_wait() counts patience in polls, and on a host already running a build the kernel coalesces that sleep past the wall time the poll budget takes -- so the gate was judging this machine's scheduler, not the arbiter (the thirteenth-layer rule pointed at the gate for the first time). Fixed structurally rather than tuned until green: sched_yield instead of a timer sleep, a channelLock between rearm() and serve(), kPolls sized for a loaded host with kPollsNoAnswer for the legs that assert the poll ENDS, and scripts/test-clover-power.py now runs the binary twice -- idle and loaded:<os.cpu_count()> -- so the promise is tested instead of assumed. Four needles, each with a negative test and its output archived under ~/clover-out/round331b-evidence/: kPolls back to 200000 fails the loaded leg at line 419 while idle passes (that leg is now a regression pin, not an extra run), losing sched_yield, renaming channelLock and writing usleep back each make the gate refuse. The sleep ban is judged on comment-stripped code lines, because two comments legitimately name the old call -- eighteenth-layer rule, and this round was itself once judged red by a needle that could not tell a comment from code.",
   "round332 (v0.7.43, HOST-ONLY ROUND, fourth running, and a comment-only one: the board is still away, so round332-v0.7.43-payload.img 4543912c1b87a2db5c4aabd73f685913d5a7b9a4384d9cad293b0295861bf3f6 is built, gated and archived but NOT flashed; kernel prelink 6e0c96b5 -> amfi 756123ef -> normalized 3b34a354113ff90f, which payload.json names as kernel_sha256, and kernel_args are byte-identical to round328/round331). What it closes is the debt README carried since round330: the three files this repository compiles into the shipping kernel -- drivers/NativeMobileDisplay/NativeLegacyDisplay.cpp, drivers/NativeHidInput/NativeHidInput.cpp, package/CloverLegacyDisplayProbe.cpp -- used twelve citations shaped `int-NNN`. Counted on 2026-11-05 against all three trees (~/clover-out/round332-citation-audit/audit.md): the device repo has the shape in 3 files and no ledger; the base repo has it in 34 files and no ledger (docs/drivers/native-adreno.md cites int-148/int-150 in prose with nothing to look them up in); sheng uses the same shape in its own files but the four colliding numbers are about different subjects (its int-143 is sheng-gpu-pause-us blocking before a submit, its int-243 is an App Library swipe), and eight of our twelve never appear there -- so the reference board is a negative result for this question, not a source. Every claim kept its content and gained its status: nine comment sites now read \"inherited claim, no record in this repository\", and each says why it cannot be checked here. Two were worse than unsourced. int-210's claim that the render server keeps a 1/60 s heartbeat off IOMFBDisplayRefresh was contradicted by round329's own host scan (no reader of that property in the iPadOS 17.7.11 shared cache) and the branch is inert anyway (grep -c sheng-vsync board.toml = 0). int-243's early-retire timing sits behind native_legacy_gpu_offer(), which returns false without gpuHandoffPresenter -- sheng-fb-gpu is not in this board's args -- and the only row that prints native_legacy_early_retires, 'gpu hand-off refused ... early_retires=', has 0 hits in ~/clover-out/clover-log-window-boot113.bin.txt, so that number can never be produced by any image this board ships. int-131's queue-overlap claim was replaced by the only on-disk evidence that bears on it: boot 113's swap#1 520.047 -> retire#1 530.257 -> ... -> swap#4 559.593 -> retire#4 561.082 is strictly serialized with current=0 pending=0 at every retirement, so validated[8] stays as a guard and not as a reading. int-162/int-163 (HID edge contacts) stay unanswerable for a different reason and it is now on the gap table: native_touch_edge_stats[0..3] is incremented in RAM and no row prints it. check-clover.py gained check_citation_integrity(): it walks this repository's authored drivers/** and package/** .cpp/.h (paths resolving into the base repo are skipped -- that tree is not this gate's authority), bans the int-\\d{3} shape and the round-relative subject, and requires the citation-rule header plus the marker phrase in the three files that held the labels; both gates report 'citation shapes banned in 34 authored sources'. Four negative cases (re-add a label / delete a header / replace the marker / re-add the sentence) each turn it red and the files restore byte-identical: ~/clover-out/round332-citation-audit/negatives.log. The gate's first red was its own: the header text quoted the banned sentence verbatim, so a ban written as prose about that sentence trips the ban -- same shape as round331b's usleep rule, one level further (layer 18 item 5). 'Nothing behavioural changed' was then measured rather than asserted (~/clover-out/round332-citation-audit/kernel-text-exec-diff.txt): __DATA_CONST, __DATA and every other data segment are byte-identical to round331's normalized kernel and __TEXT_EXEC differs in 4 bytes of 8,617,984 -- two MOVZ immediates, 670->676 and 628->634, which objdump places in the .cold.1 panic blocks of _native_legacy_backend_guard and _native_legacy_gop_mapping_observed with x0 pointing at 'NativeLegacyDisplay: leaf=%u ... @%s:%d' and 'NativeLegacyDisplay: wrong mapping owner @%s:%d'. panic() embeds __LINE__, and this round added exactly +6 lines above those two sites in CloverLegacyDisplayProbe.cpp (git diff -U0: +4 at the header, +2 at the 502 hunk). Two more differences are per-build and must be excluded before comparing any two kernels -- LC_UUID in the Mach-O header and __PRELINK_INFO's _PrelinkKCID <data> (~/clover-out/round332-citation-audit/other-segment-diffs.txt), the kernel-level twin of round329's ADT random-seed finding. Practical consequence for the flash order: a comment-only round is not a hash round, and since r332 changes no behaviour it does not need its own boot -- it rides along with the next round that does.", "Boot 114 (round328-v0.7.39-payload.img, image 3a9eee3e...) was read without re-flashing: the board came back in TWRP, the card boot counter already read 114, all 12 flight records and 4 beats were written by boot 114, and the tee ring carried the r328 row (clover r328: 3 hits, clover r329 and clover r331: 0 -- this boot ran the r328 image). The pre-registered A-D split landed on A, and inside A on the q=0-and-e=0 sub-branch: hn=3 rstate=rcv_owner rnamed=3 rasked=3, v=4203.7303.a903.0, e=17.17.0.0. Two things this row does not say, stated because they are easy to over-read. (1) 58:backboardd in the name column is close to tautological -- clover_sb_port_owner tries SEND then RECEIVE in the sampled task own space (task.c:11438-11446), so a thread blocked in a receive names itself; the reading is the third slot, which translated (e=0) with q=0 and s=0, meaning no send right exists anywhere for that port -- nobody can post, so the debt is a message that does not exist, not a delivery or scheduling gap. (2) The two +ps slots are backboardd own port sets, and a set is struct ipc_pset (ipc_pset.h:77-84) with no ip_messages and no ip_srights, so their q=0/s=0 are the helper zeros behind e=17 (KERN_INVALID_RIGHT, counted from kern_return.h:151 this round rather than quoted from r303 comment) -- the set-membership question has no instrument on this card, and the leg that could answer it is in tree at mach_port.c:1268-1287 (translate as MACH_PORT_RIGHT_PORT_SET, ips_object_to_pset, waitq_set_foreach_member_locked, ip_get_receiver_name(ip_from_waitq(wq)), ips_mq_unlock) with zero lines of it written by us; task.c has 0 hits for ip_set_members and the card has 0 rows of clover r233, so the old checklist item named port-set members is not that leg. Branch B (the x16 == -47 gate picked non-receivers) and branch C (resolver failing wholesale) are excluded by the row own literals, and B exclusion is the first time this shape is read as blocked-in-a-receive instead of inferred. Boot 115 is round329-v0.7.40 (e9c41a1f...), judged by Round329 item 8 A-D; the patch chain was checked rather than assumed -- scripts/build-xnu-4k-baseline.sh:264-266 still applies r331, r328 and r327, so r327: bbnow and r328: bbrcv must both be present in that image and an absence there reads as a channel fault before it reads as a behaviour change. One new instrument debt, quantified instead of asserted: across every archived window the card shows clover r283: last reset unnamed 29 times, last reset kind= 0 times and the heartbeat magic 0 times, so the reset-naming leg has never once worked on this board; boot 114 wrote no deadline record and no fresh panic marker (kernel ring stops at 605.930356, newest sdci entry at 593758 ms), so the card cannot say how that boot ended, and the missing positive control is a same-boot write-then-read-back of the heartbeat cell printing beat_ok=. The D-branch check that an e=-1 slot must sit beside c=null was NOT exercised this boot (hn=3, all three hrn non-zero) and is recorded as untested, not passed.",
   "round332d (v0.7.44, HOST-ONLY, no image change): the citation gate round332 shipped was red on the assembled tree, and the red was the gate's own criterion -- it decided \"am I running from the tree\" with cwd != REPO, which is false for the documented tree-side run (cd out/clover/tree && python3 scripts/check-clover.py) because the build drops its own copy there, so cwd and REPO both become the tree and the check demanded package/CloverLegacyDisplayProbe.cpp from a checkout whose package is a symlink to the base repository. Fixed on a path property -- is_tree = cwd != REPO or (REPO/\"package\").is_symlink() -- so both ways of being in the tree take the same branch, and the absent-source message now names who judges the rule instead of calling the shape of a checkout a broken rule. Its own silence got the same treatment: a tree run scans 0 sources this repository authors (the tree's drivers/* all resolve into the base repo, which the same exemption skips), and \"banned in 0 authored sources\" reads like a clean sweep, so the summary now says the sweep is not there. Six negative branches, ~/clover-out/round332d-gate-evidence/negatives.log: repo root with all three files missing = 3 errors; cwd moved into a subdirectory = notice; header stripped = red; marker phrase replaced = red; tree-shaped checkout with cwd == REPO and package symlinked (the exact red before the fix) = notice, 0 errors; package made a real directory without the probe (a genuine deletion) = still red. Both gates then EXIT=0 (repo: citation shapes banned in 34 authored sources; tree: 12 archives, 22 objects ABI-checked, kernel read). Retraction recorded in the README gate table: round332 wrote \"both gates report 34\", which was only ever measured on the repository side.",
   "boot 115 (round329-v0.7.40, e9c41a1f, read back by the unattended runner end to end -- the first boot whose landing time was measured): this boot owns ring slot 57 and its r328 row has the same shape boot 114 produced (hn=2, two +ps hops named 58:backboardd, v=4503.6403.0.0, q/s all 0, e=17.17.0.0), while the t=605 hn=3 rows in the same dump sit in slots labelled boot 114 and are therefore not readings of this boot. The r329 dispstate row landed ten times with 30 s spacing plus two off-cadence client-interpose fires; grew= is non-zero three times and presented= moves 2 -> 4 in the same window, which retires both \"backboardd stopped asking\" and \"the debt sits before the next swap\" and leaves \"no fifth swap after the fourth\". hot=6:7/3/e00002d5 with s6=1|3 80000000 0 -> e00002d5 makes selector 6 the busiest caller of the boot and its last return kIOReturnBusy -- named from our own constant table (drivers/NativeUfs/tests/RootCommands.cpp:13), since no IOKit header exists on any of these machines, so the word is ours and not the vendor's. vs= read 0/0/0 on all ten rows: this legacy object never started a refresh tick. dispstatecut produced 0 rows (320 B held), log= peaked at 63/96 with logdrop=0, and neither stock assertion (swap_wait_gated, CommandWake) appears this boot. How it ended: all 12 flight entries and 4 beats are boot 115, the deadline record is still boot 108's, both panic markers are STALE with \"boot 115 never entered the sink\", the last kernel line is 503.658 s and the timeline closed with adb at elapsed 814 s -- the landing moment is measured while the 310 s in between is still covered by no instrument. The r283 naming leg, recounted over a named corpus (~/clover-out/*-window.bin.txt, 80 files), is 23 unnamed / 0 kind / 0 matching beat magic; round328's 29:0:0 is corrected here because it did not name which files it swept. Next hand already shipped: boot 116 = round331-v0.7.42 (e7b14b6a), judged by dev-log section Round331 item 7, S-A through S-E.",
   "boot 116 (round331-v0.7.42, e7b14b6a, read back by the unattended runner; timeline ~/clover-out/round331-boot116-window.bin.timeline.txt 15,177 B): r331 fired once and landed on S-E -- scan=xlate, hits=0 beside probed=0 and scanned=0, so that zero is 'not counted' and not 'counted empty'. Reading the patch back (patches/xnu-clover/*-clover-r331.patch:87-93) says what e=17 is: clover_port_obj_held() tries ipc_object_translate for RECEIVE, then for SEND, and keeps the second kern_return_t, so KERN_INVALID_RIGHT is bounded to 'this name translates to neither right in backboardd's own space'. The r328 row of the same fire names four hops with e=17.17.17.0 -- only hop 3 translates -- so the round's real finding is about the instrument's own siting: r331 translates only the hop pick chose (hop 0) and never asked the hop that does translate. The fix is to print every hop, not to add a column, and it is booked behind boot 117. The same frame overturns this area's own headline: r180 swap rows retire to #12 (r329's continuous done=12 presented=12 frames=12, ring slot 57) and the caller is pid 86, IOMFB_FDR_Loader, while pid 58's record reads calls=0 -- so 'the picture stops at the fourth swap' was a property of one client on one boot, not of the pipeline, and the question is now 'swaps keep retiring and the desktop still is not there'. That also exposes how the r329 beat row picks its record: client= means 'the pid==58 record', which on this boot is the idle one, so calls=0 there is honest and misleading at the same time; r333's event row carries pid= for that reason, and the beat row owes either following the busiest selector-6 client or printing a per-client grew= (dev-log section Round333 item 5).",
   "round333 (v0.7.46, kernel rebuilt: prelink b205274f -> amfi 0bc68e3c with both exec-hook sites still 0x1ae00e4 and 0x1ae016c -> normalized 32a60807 with the 973 object stamps zeroed; payload ~/clover-out/round333-v0.7.46-payload.img 7b72720c2e3224012913207ed22b9ff30f5a12a47c9315382c0ce5d10eb4c768, 58,720,256 B, kernel_args byte-identical to round331-payload.json -- this round adds no boot argument): the selector-6 swap wait gets a row of its own, package/CloverLegacyDisplayProbe.cpp reads the state the wait depends on before forwarding the call and prints it after, with ret= beside it, so the door state and the result are two groups of words (clover r333: bbswap ms= swap= opt= ret= pw= ps= np0..np5 sent= s72= gap= pair= pid=, over-width escapes through clover r333: bbswapcut). The geometry is host-decoded and on disk at ~/clover-out/round333-forensics/ (latched swapID = dword at client+0xf8, wake-leg array base 0x110 stride 0xb0 six slots read as qwords with cmp x8,#0 for empty and 0xe00002dd when taken, the two family queries = dwords at display+0x16d0/+0x16e0), and every way of not having a reading gets its own literal (off/absent/null/none/full). Two deviations from the design are on the row: notified= ships as sent= because native_legacy_vsync_notify is the stock sender bound at scripts/build-clover-gop-legacy-display.py:210 and the only reachable producer is NativeLegacyDisplay.cpp:118 -- so B-branch silence is about this port's leg, not about whether anybody woke the client -- and pid= was added because boot 116 proved two clients exist. It bypasses the 96-line cloverLog budget and owns its tee class (r333-bbswap 64, r333-bbswapcut 8, ordered short-token-first, exempt from the per-pass cap); check-clover.py pins those three shapes and all four negatives went red individually then restored byte-identical (~/clover-out/round333-gate-evidence/negatives.log), which also wrote a rule: the negative-test script is itself an instrument, and its first defect -- a pattern that missed the table's two-space indent -- raised before its restore step and left CloverSdhci.cpp mutated. verify-clover-payload.py adds four needles (51 OK / 0 FAIL) and the two stock 5-second sentences were measured for reach, not asserted: they are present in BOTH round331 and round333 images, so their only possible negative is a missing prelinked family slice. Pending: boot 117 = round333-v0.7.46, judged by dev-log section Round333 item 7 A/A-prime/B/C/D/E, grouping rows by pid= before reading any of them.",
   "boot 117 (round333-v0.7.46, 7b72720c, read back by the unattended runner; timeline ~/clover-out/round333-boot117-window.bin.timeline.txt): the bbswap row landed -- 38 rows, 0 bbswapcut, all pid=58 (boot 116's IOMFB_FDR_Loader made no selector-6 call this boot), and the pre-registered branch A holds: np0..np5 read null on every row with zero off, so the class-size defence reached all six slots and the emptiness is a reading, not a bound -- the wake leg has no port at all, which the same boot's regall=0/regs=0 and s72=0 on every row agree with. That makes B and E structurally unreachable, and it also retires the row's own premise for two columns: swap= is 0 on all 38 rows while the same boot's r180 rows print input swapIds 0..4 with retire#4 presented=4, so client+0xf8 was never written (consistent with a wait that never armed) and gap= in that state is the interval between selector-6 calls, not a wait duration -- its largest value, 12525 ms, must not be read as 'waited 12.5 s', and branch D is refuted independently by the two stock 5-second sentences appearing 0 times. The round's most useful negative: the succeeding shape (opt=80000001 -> 0, 17 rows) and the failing shape (opt=80000000 -> e00002d5, 19 rows) read the SAME pw=1 ps=0 before the call, so +0x16d0/+0x16e0 do not discriminate them and branch C is not supported by those two words -- naming the producer of the busy return is a host disassembly job, booked as r334 before any third guessed offset goes on this row (sheng is negative here: its kIOReturnBusy uses are only GpuPowerProbe.cpp:898/1009). Two of the 38 rows begin with somebody else's un-terminated audit text and the one at 726.723301 lost its tail at 'gap=2099 pa' -- that is the kernel msgbuf's line limit, not our 320 B cap, which is what bbswapcut=0 proves; the fix is reader-side counting of rows that do not start with a timestamp, not a newline inside the probe. r331 landed on S-E a second time in the same fire (scan=xlate cand=4 debt=4, while r328's fourth hop translates with e=0), which re-proves that the next hand there is per-hop printing. Pending: boot 118 = r334 (bbsend per hop + the busy-word named on the host, criteria written before code).",
   "round334 (v0.7.48, TOOLING CONTROL ROUND, the image boot 118 will run): the main checkout fast-forwarded to merge 4d380e2 and this board's kernel was rebuilt from the merged tooling with every device source unchanged -- kernel e49b480f -> amfi+normalized 15b4b5636611982a (both exec-hook cuts printed: cbz w9 -> b, tbz w0,#0 -> nop) against round333's 32a60807. Naming the per-build slots first (LC_UUID, _PrelinkKCID), the section deltas are __TEXT_EXEC +1328, __TEXT.__const +304, __cstring +310, __DATA.__data +40, __common +7168, __BOOTDATA.__init_entry_set +24 with __DATA_CONST byte-identical, so this is a behaviour round, not a hash round (~/UniXNU/out/migration-clover/step3-tooling-merge-kernel-delta.txt). boot-args are byte-identical to round333, the root image and trust cache hashes are unchanged, and the card rows keep their r333 tokens: only the menu title says r334, and it carries six double quotes again because check-clover.py:5455 requires the escaping that lost boots 35/36 to be exercised by every shipped manifest. Three instrument findings came out of the round. (1) Retiring the kernel work tree is three operations, not one: the build uses out/clover/tree/.cache/xnu-work, that clone carries the headers prepare-xnu-source.py downloads (EXTERNAL_HEADERS/TrustCache, 21 extra iokit/DriverKit), and archives 01..16 compile it before build-xnu-4k-baseline.sh applies any patch -- a pristine clone fails at TrustCache/API.h and then at mockfs_fsnode.c:157. (2) The merge also renamed docs/drivers/native-novatek-touch.md to sheng-novatek-touch.md (793f852) while 6d1fd59 rewrote its rule 3 from writing host tests to running existing ones; both are new to this line (git merge-base --is-ancestor against 4d380e2^1 says neither is in the first parent). Six README citations broke, and swapping only the path would have passed the gate while pointing at the wrong clause, so each was re-pinned by content: 16-37 -> 18-39, 73-85 -> 77-89, 87-98 -> 91-102, 120-128 -> 120-132, 130-137 -> 141-148; three driver source-header comments still name the old path and are registered for r335, because editing a .cpp would break this round's single variable. (3) A third per-build slot: kernel.macho.adt differs every build because make-clover-adt.py:219 writes os.urandom(64) into /chosen random-seed -- two builds with identical arguments differ in exactly one 64-byte run at 396..459 and are byte-identical once it is zeroed, so exclude it before comparing ADTs across rounds. Artifacts: payload ~/clover-out/round334-v0.7.48-payload.img 7a04b738144a3fcf (58,720,256 B), boot.img 196b284fc1511961, in-volume kernel.macho b85fc677a885554c equals payload.json payload_kernel_sha256; both gates EXIT=0 and verify 51 OK / 0 FAIL on the archived image (~/clover-out/round334-build/). Machine note: Homebrew's python3.13 interpreter had been overwritten by a self-execing /bin/sh launcher at 00:34, which hung every build and reader on this host until it was repointed at the surviving app-bundle Mach-O; brew reinstall python@3.13 is the canonical restore.)",
   "round335 (v0.7.51, CODE ROUND, the image boot 119 will run -- not flashed in this session): three columns move and two new instruments ship. (1) #694 kernel side: task.c no longer asks only the picked hop -- clover_bb_send_holders_row is called from a loop over every hop r328 named (task.c:14258 in the work tree, the row call now reads (int) i), so boots 116 and 118 each printing one bbsend row whose nm= equalled the picked hop while the only hop that translated was the fourth can no longer be confused with no debt elsewhere. check-clover.py drops the old pick needle and pins the new shape with two landable ones (the loop header and the (int) i call), so a revert fails on those. (2) #698 probe side: the swap-wait row is renamed clover r335: bbswap and swap= is replaced by the call argument arg= (32-bit, because the family stores it with str w8) plus done=/cur=/list= read BEFORE the call, and gap=/pair= now key on arg; this retires Round333 (4)s first half, which said the latch was never written -- host disassembly shows the helper writes [client+0xf8] on entry and zeroes it before returning, so a pre-call 0 was the cleared cell, not a statement about the argument. (3) #699 reader side: read-clover-log.py --tee prints tee lines: N stamped=S glued=G plus up to three un-stamped heads, measured against the real boot-118 archive: 512 records, 507 stamped, 5 glued, one of the three examples being our own clover r221: sbm2 row -- rows reaching the card are not the same as rows owning a line (~/clover-out/round335-build/reader-699-on-boot118.log). #713 also re-pins three driver source-header comments that still named docs/drivers/native-novatek-touch.md before the merge renamed it. Build chain and its one new trap: retiring the work tree is checkout (tracked files only) plus rm of the files the patches CREATE, then build-xnu-4k-baseline.sh -- which applies every patch but then fails its own link with undefined _native_* driver exports because archives 01..16 are built by the orchestrator BEFORE it, so a non-zero exit from that script alone is expected when it is used as the pre-patch step and is NOT the build result; the verdict comes from unixnu build kernel, and for background runs only the *_EXIT= lines appended to the log count, never the wrappers exit code. Artifacts: prelink kernel.macho ff3fab14103067dc -> amfi f5f61239bef0ef57 (both cuts printed: cbz w9 -> b, tbz w0,#0 -> nop) -> normalize-kernel-macho.py without --output, which rewrites that same file in place (02cc441676f014a3, 52,404,224 B; r333/r334 kept a separate -normalized.macho only because they passed --output) -> payload 19e7bb104b96d40f (58,720,256 B), payload_kernel_sha256 149555ecc288e771, in-volume unixnu.toml 2884 B. Repo gate EXIT=0, tree gate EXIT=0 (12 archives, 22 objects ABI-checked), verify on the archived image 51 OK / 0 FAIL with r335-bbswap and r335-bbswapcut present.",
   "boot 119 (round335-v0.7.51, 19e7bb104b96d40f, cold-flashed and run; NOT read back): ~/clover-out/round335-boot119-unattended.log 1,326 B ends UNATTENDED_EXIT=6. The two fastboot watches closed as expected (0 s and 4 s, 81ffcaaa, flash cache wrote 57,344 KB) and then the after-deadline watch polled 37 times with both tools empty and closed 1794021554 2221 - - close:neither -- 2221 s against a 2220 s budget, the same overflow shape boot 118 produced -- with QUSB_BULK_SN:F6548A52@01143000 in the USB tree photographed at that close (~/clover-out/round335-boot119-window.bin.timeline.txt, 11,824 B). So this is section Round330 (7) T-B: the board reset and this host enumerated it in download mode, which is the one mode neither adb nor fastboot reads. All four pre-registered branches of section Round335 -- A (#694 four bbsend rows keyed on this boot own v=), B (#698 arg=/done=/cur=/list= and B1-B5), the (4) empty verdicts and the (5) glue counts -- have the card text as their subject, and the card was not read, so all four are recorded as NOT JUDGED, not as negatives: a zero produced by not asking is not a zero produced by asking (layer 13). Nothing is lost -- the card still holds boot 119 and its counter already reads 119 -- and the read is one --skip-recovery dd once the board is physically back in TWRP, which is how boot 118 was read. EDL-side firehose writes were not attempted: irreversible and not a path this project uses. A five-minute re-poll confirmed the board does not leave EDL on its own.",
   "round335b (v0.7.52, HOST-ONLY, no image change, #716): the read-back path now says which silence it saw. Writer side, scripts/run-clover-unattended.sh: usb_landing_class() returns edl / diag / no-node from the USB tree at the close, and the two watches that can close silent (watch_landing, watch_after_deadline) interpolate it into the close label, so the line is close:neither-edl; the gate pins exactly two occurrences because a third would mean a watch that cannot close silent was given a silent verdict, and zero or one is the half-fix. The exit-6 sentence no longer re-measures the bus at verdict time -- that would describe the host at the moment of printing while the board may already have moved -- it quotes the timeline own close line (closing= from tail -n 1 of $TIMELINE) and falls back to saying it could not quote. Reader side, scripts/read-clover-log.py: --timeline <window.bin> segments the file, counts polls per watch, keeps the open and close USB trees without letting them eat the poll rows, and reports each close as a reading keyed by BOTH the watch and the close suffix, because the same neither-edl means the deadline had not fired yet when the board reset in watch-landing and means the budget expired in after-deadline. Runs whose close line predates this fix are classified from their own usb at close tree and the sentence says the class is derived and was not reported by the writer; a close line with no tree to derive from prints UNKEYED=[watch/label] rather than guessing. Measured, not asserted: the two old artifacts (boots 118 and 119) each now report after-deadline/neither-edl=1 with the derived-class note (~/clover-out/round335b-gate-evidence/boot118-timeline-read.log, boot119-timeline-read.log), the live bus classifies edl while the board sits in download mode (live-usb-tree-at-r335b.txt), and removing the bulk node gives no-node while substituting a diag string gives diag (negative-controls-classifier.log). Six negatives each turn the gate red and restore byte-identical (negatives.log): classifier deleted, QUSB_BULK not grepped, after-deadline left classless, verdict re-measuring, a watch key removed from the reader, and the reader no longer running its timeline leg. The last one was green at first and the cause was the needle: a plain substring test on timeline_selftest() is satisfied character-for-character by def timeline_selftest():, so deleting the call while keeping the definition passes -- the pin now anchors to the call line. The round also caught its own README: the tree-side run reported EXIT=0 while judging stale copies, because out/clover/tree/scripts is COPIED at assembly (scripts/unixnu/tree.py:92) and a host-only round builds nothing, so the tree held a checker with 0 occurrences of the new pin and a Nov-5 copy of the runner. Refreshing with unixnu tree --device /Users/zhouzhou/UniXNU-clover (absolute path; --device takes a directory) makes the two sides judge the same text: the reader copies then md5-match byte for byte (533f32bdab095713cc7188d300ea5449) and both gates EXIT=0, verify on the r335 archive still 51 OK.",
   "round336 (v0.7.53, HOST-ONLY FORENSICS ROUND, no image, no flash: why the landing mode regressed from boot 117's automatic TWRP to boots 118/119 EDL). The regression is one measured sentence, and ~/clover-out/round336-forensics/close-labels-by-watch.txt keys every close line by the watch that wrote it -- the same keying round335b shipped on the reader side: boot 115 after-deadline close:adb 814s, boot 116 close:adb 969s, boot 117 close:adb 890s, boot 118 close:neither 2221s (class derived: edl), boot 119 close:neither 2221s (class derived: edl). So the board has not returned to TWRP by itself since boot 117 -- this is not 'came back but was not seen', because 115/116/117 are not neither-rows at all and the comparison therefore does not depend on the new classifier or on its derived-class error. Half the writer side is now excluded: r198-prearm-rows.txt shows CloverSdhci r198: recovery BCB pre-armed rc=100 written=1 byte-identical on boots 115, 117 (landed TWRP) and 118 (landed EDL), so 'we wrote the recovery flag wrong' is not the explanation -- and boot 116 absence there is a rotation loss in a 64-row driver ring, not a non-run, so it counts as a missing reading and not as a counter-example. flight-and-sink-both-stale.txt excludes the panic path the same way: on both 117 and 118 the on-card deadline record still belongs to boot 108, both panic markers read STALE: boot N never entered the sink, and neither boot has a drain-in or sentence record, so the two boots never entered the panic path and the difference lives outside it, in the silent reset itself (last kernel line: 117 at t=730,054 ms, 118 at t=637,541 ms). The round own finding is about the reset-source cell: r283-all-sightings.txt sweeps grep -rh 'clover r283' over ~/clover-out/*-window.bin.txt and judges 24 sightings -- 0 rows with kind=, 0 rows whose record[9] equals our own heartbeat BEAT283 (0033383254414542), 0 rows reading all zeros. Boot 118 shows magic=69a0000300a109d0 beatmagic=801a086e432839b2 and the older batch repeats 00a109d0 (3 times) and 00a909f0 (2 times) in the low half of magic, with beatmagic= sharing a ..1a08.. byte shape. Three candidates, one left standing: it is not 'our record is there but unnamed' (that needs kind= or at least our BEAT283), and it is not 'the cell is cleared each boot' (that needs zeros), so it is that the 160 bytes from IMEM 0x660 are rewritten by firmware every boot -- which means r283 write-previous-boot/read-next-boot is structurally unable to answer the question it was built for, and our driver additionally zeroes that same region at boot start. r293 added beatmagic= to split unnamed into two kinds; the split worked and the answer is 'the channel is not ours', so the standing 23/0/0 sentence must be read as 'this instrument asks the wrong object', not 'this instrument has never been lucky' -- the seventeenth-layer lesson (a needle in the artifact is not a reading of the thing) in its reset-cell form. Two next hands, neither allowed to cost an extra flash. HOST SIDE (r337, no board needed): timeline_poll() asks only adb and fastboot each tick, and EDL is exactly the node neither tool sees, so 'when did the board enter EDL' is unmeasurable -- 117 last kernel line 730s and 118 637.5s, while the EDL node appears only in the tree captured at close. The fix has the same shape as #716: record usb_landing_class as the third answer of every poll, which makes 'entered EDL right at the reset' and 'entered EDL only when the budget expired' two distinguishable readings. BOARD SIDE, after boot 119 is read: change channel -- sheng already has this path working with a host model (~/UniXNU-sheng/package/BootResetCore.h: find the SDAM APID through the SPMI PMIC arbiter at PPID 0x071, write the reboot-reason cell byte 0x48 mask 0xfe shift 1 value 2 = bootloader, plus package/tests/boot_reset_host.c), but that table is SM8550 arbiter v7 while this board arbiter is v3 (measured in section Round313), so the SDM660/PM8998 SDAM PPID and registers must be pinned from our own DT and vendor sources first -- no code before the facts, or we would be writing our bytes into somebody else cell again; CloverPower already has the arbiter and the readAt() plumbing, what is missing is facts not pipeline. And one hard flash gate this round adds to the README gap table, so the next round does not treat it as process fussiness: boot 119 card is still unread, and a cold flash of cache is the hand that overwrites that card, so NO new image may be flashed until --skip-recovery has read boot 119 back (building and archiving remain allowed; r311/r313 no-flash rounds are the documented shape for this).",
   "round337 (v0.7.54, HOST-ONLY INSTRUMENT ROUND, no image, no flash, #718): the landing class is now asked at every poll, which is the part round335b could not date. Writer side: timeline_poll() samples usb_landing_class itself -- not at its four call sites, because a sampling a watch has no parameter for cannot be forgotten -- puts it in the sixth field of the poll row, and includes it in the state that decides whether a row is written, so a mode change makes a row even when adb and fastboot both read `-` through the whole transition, which is exactly this case. usb_landing_class gained a fourth answer, ioreg-fail: an empty return from the host tool is this host failing to answer, not a bus with no Qualcomm node, and the two must not share a word. The classifier is now RUN by the gate rather than grepped: check-clover.py extracts the function body, stubs ioreg, feeds four trees (empty / QUSB_BULK_SN / Diag@ / Mi Pad 4) and requires ioreg-fail|edl|diag|no-node in order. Reader side: TIMELINE_ROW's sixth field is optional, so the boots 118/119 artifacts still parse and are reported as class-polls=not-asked-by-this-writer rather than as a quiet bus; each watch prints class-polls=<elapsed>s:<class> at its changes, class-at-open= derived from that run's own open tree (and saying it is derived), and a close label whose class differs from the newest poll is reported as a change between them instead of being folded into one state; the summary prints poll class asked in N/M so the writer generation is the first thing a reader sees. Measured: the writer dry run really emits the class per row (~/clover-out/round337-gate-evidence/writer-dryrun-class-column.log, `1794023864 0 - - poll edl` -- the class alone triggered it), and the two pre-round337 artifacts now bracket the EDL onset for the first time: both after-deadline watches read class-at-open=no-node and close neither-edl, so the left edge exists while the onset is still only bounded inside the 2221 s window -- from the next unattended run it is bounded by the 2 s poll cadence. Two self-caught errors, both procedural and both written down. (1) The first live-bus sample returned no-node while the bus holds QUSB_BULK_SN:F6548A52: I sampled run-clover-unattended.sh with awk while the negative-test script was mid-mutation, so I read a mutated classifier. The rule is that a file under negative test is not an instrument at the same time; re-sampled after the run returned edl (live-bus-class-at-r337.txt). (2) Negative case N8 was GREEN at first, and the cause was the gate's own pin: requiring the substring ioreg-fail in the script is satisfied by the sentence that explains why that branch exists -- the twenty-third layer's next shape, an explanatory sentence feeds the existence pin of the very literal it describes. Replacing that pin with the stubbed four-tree run turned N8 red; twelve cases now each go red and restore byte-identical (negatives.log). The script also stopped matching a substring once and started matching the nth occurrence, because the two silent verdict sentences quote the timeline with the same text and the new needle counts them (exactly two) -- N4 and N10 are the two sites. The verdict-sentence ban is a negative pin now: no say/die line may interpolate the classifier, since a message that re-measures the bus describes the host at printing time. Both gates EXIT=0 after `unixnu tree` reassembled the scripts first -- the r335b rule applied as process rather than discovered again, with all four scripts byte-identical on both sides (123eb802 / 5bdb709a / 7b9124b1 / cea3fa6b) -- and verify on the round335 archive is unchanged at 51 OK / 0 FAIL. The flash rule from round336 stands: no new image may be cold-flashed before boot 119's card is read back, and this round ships no image (kernel, payload and boot-args untouched).",
   "round338 (v0.7.55, HOST-ONLY FACTS ROUND, no image, no driver code, no flash, #719): the two premises round336 queued a board-side hand on are replaced by readings on disk, and the IMEM record gets a measured denominator. Three vendor files are archived verbatim so nothing has to be remembered: notes/sources/sdm660/msm-poweroff.c (734 lines, sha256 febf2eccb8526a4e), boot_stats.c (105 lines, 4fd7113b1755f4dc) and qpnp-power-on.h (142 lines, c6c27856db96ea9c). The geometry instrument scripts/test-clover-imem-geometry.py now parses the child map from both archived device-tree sources as integers (children parsed: board=8 vendor=8, two-source disagreements=0), attributes every word the reset record touches to an owner, and reports that restart_reason@65c ends at 0x660, that the record spans 0x660..0x6ff, that the largest contiguous free run from the record offset is 80 bytes = 10 words while the record declares 20, and that 6 of those 20 words are not entirely free (boot_stats@6b0 owns 4 of them read-only plus 2 indexed writes, kaslr_offset@6d0 owns more) -- so the next resize is measured against a map, and the driver's unconditional boot-start zeroing loop is shown wiping four words that belong to the firmware. boot_stats.c carries zero writel in this repository (the kernel only readl_relaxed), while store_kaslr_offset() writes 0xdead4ead plus the slide. Two corrections follow. (a) round336's beat=/beatcnt= columns are re-attributed: words[10]=0x6b0 and words[11]=0x6b8 are inside boot_stats@6b0, so those two columns are a cell with two writers, not this driver's heartbeat -- and the sweep over 24 sightings shows the ratio between them is not constant across boots (min 289.0, max 367.6, stdev 15.1), which is why round336's all-zeros test could convict neither way. word[9]=0x6a8 is genuinely in the unclaimed run and 0 of the 19 rows that print it carry BEAT283. (b) The board-side next hand is withdrawn as written: this board's own device tree declares no SDAM at all (grep -c -i sdam over the 16,612-line clover.dts prints 0) and its SPMI peripherals are qcom,pm660@0 and qcom,pm660l@2, not PM8998, so sheng's SM8550 v7 SDAM route is a route with no declared door on this board, not a different address. One claim this round made and then withdrew against the vendor source: dload_type@1c is NOT the EDL arm cell and drivers/soc/qcom/dload_mode.c does not exist in this SoC's tree -- +0x1c selects the download DESTINATION (EMMC_DLOAD_TYPE 0x2 at msm-poweroff.c:388, cleared at :390, read back at :362-366), and EDL is armed by an SMC into TrustZone (enable_emergency_dload_mode(), :202-227) whose memory leg needs qcom,msm-imem-emergency_download_mode, a node that both archived device-tree sources count zero. A second mismatch is now a gate: kRestartFastboot is 0x77665501, and of the 12 restart_reason writes the instrument parses (cmd string 7, in_panic 1, unconditional else 2, no branch opener 2, one compiled out by #if 0) three carry that value -- labelled other@557, else@572, else@580 -- while the vendor's reboot bootloader writes 0x77665500 (line 522): agreement check 0 of 3. What that does NOT establish is recorded next to it: the PMIC PON_SOFT_RB_SPARE channel has never been read by this repository. Instrument defects this round caught in its own tool: labelling a write by the nearest line (which called the unconditional else at :580 a panic value, the exact mistake the table exists to prevent) and then by the nearest branch-lookalike (which hung the probe write at :690 on an else whose scope had closed); the shipped rule is brace-depth containment -- a label comes from the branch that lexically contains the write, and unbalanced conditionals or a nonzero brace count at the end are fatal. The arbiter host model now names its operands: six burst asks go through require_burst(), which prints rc, status, lastSid, wantSid, served, lastAddr and both byte strings before it aborts; the loaded-leg flake was NOT reproduced (a diagnostic copy ran 8/8 clean under one busy process per core) so what is settled is only that a future red is attributable -- wrong lastSid or wrong bytes with the right lastSid keeps the arithmetic question live, rc=PA_E_POLL is this machine, and bytes differing while lastSid matches with rc OK is the harness publishing DONE before its RDATA was visible. The gate runs the geometry script instead of grepping it, counts the children in each archived block itself and compares, reads kRestartFastboot out of drivers/CloverSdhci/CloverSdhci.cpp, requires a vendor row named bootloader that is NOT our value, and forbids any writel in the archived boot_stats.c; negatives N17-N21 added, 21 cases each red for its own reason with byte-identical restores. Both gates EXIT=0 after reassembling the tree (this round edited scripts/*, so out/clover/tree/scripts is a stale copy otherwise), and verify-clover-payload.py reruns 51 OK / 0 FAIL against the round335 archive: no image was built or flashed.",
   "round338b (boot 119 read back, the flash gate closes, and round335's four pre-registered branches all judged): route --allow-misc-bcb without --flash-cache, board verified in fastboot as product clover / serialno 81ffcaaa, watch-landing closed adb in 13 s, boot counter sector on the card reads 119 so the data is boot 119's own. round337's per-poll classifier ran on a real path for the first time (six-field poll rows, two no-node readings -- TWRP enumerates as MI PAD 4@01143000, which is no Qualcomm node, so no-node is a reading and not a gap). Branch A: this boot's r328 row is hn=3 rnamed=3 v=4603.7203.400b.0 e=17.17.17.0, not the 4 of boots 117/118, so A2 holds per hop (hop=0/1/2 all scan=xlate e=17 with nm= matching this boot's own v= group in order) and A3 is judged by rows == cand= (3 candidates x 3 fires = 9 rows, none missing) -- the missing hop is a reading, not a lost row -- while A1's positive control could not be reached and is recorded as an empty verdict, not a pass. Branch B: 4 rows of clover r335: bbswap and zero of the old r333 strings; the single busy row is opt=80000000 ret=e00002d5 arg=1 done=1, so B2 holds, and the second leg is a different producer: the vendored line clover r180: client pid=58 selector 6 1 80000000 0 -> e00002d5 done=1 presented=1 independently reports the same arg and opt, 4/4 with our rows. B3 holds (opt=80000001 with arg==done returns 0), and cur=0/list=0 in 4/4 rows means the family had no current object and no pending chain while done already equalled arg: e00002d5 is neither a port story nor a frame-in-flight story, it is a latch nobody advances. pw=1 ps=0, sent=0 and np0..np5=null all reproduce boot 117's shape. A mistake caught before it was written down: reconstructing boot 117's call counter from its swap= column would have made arg==done trivially true on 38 rows, because that column is constant zero -- asking A with A, not a second leg; the old boots carry no done= column and structurally cannot judge B2. Reader side 5: tee lines 512 stamped=501 glued=11 sums to the total, so no third unrecognised shape, and the glue reproduces. This boot reached presented=2 (boot 116 printed 12, boots 117/118 factory rows printed 04), its last periodic row is at 565.0 s and the card ends at 583.7 s with the deadline record still boot 108's and both panic markers STALE -- a silent reset again. From here the code hand has a denominator: shrink the IMEM record to the measured 10 free words, stop zeroing boot_stats/kaslr_offset, decide kRestartFastboot's name or value, and add the owed instrument that reads restart_reason@65c before and after our own write.",
   "round339 (v0.7.56, CODE ROUND, the board-side hand round338 queued; cold-flash boot 120): four changes, and every denominator comes from scripts/test-clover-imem-geometry.py rather than from a comment. (A) The reset record is now kResetRecordWords = 10 -- the instrument's own row reads \"largest contiguous free run starting at the record offset: 80 bytes = 10 words\" and \"span 0x660..0x6af\". The loop used to wipe twenty words because a comment said the gap was twenty; words 10..14 are boot_stats@6b0 and 0x6d0..0x6db is kaslr_offset@6d0, so every boot this driver erased four read-only firmware KPI counters and the vendor kernel's KASLR slide. (B) The two heartbeat counters move to their own free cell at kResetBeatOffset = 0x6e0 (span 0x6e0..0x6ef), which is round338 ③'s \"beat=/beatcnt= are not this driver's heartbeat\" enforced in code. (C) kRestartFastboot = 0x77665501 becomes kRestartBootloader = 0x77665500: of the 12 restart_reason writes in the archived msm-poweroff.c the one labelled bootloader is line 522's 0x77665500, while 0x77665501 is other@557 plus the unrecognized-command arm and two unconditional else arms. The panic screen's BOOTLOADER_WORD moves to the same literal so one cell does not mean two writers (negative case N23 pins the pair). (D) The two instruments round336 owed, both through sdhciSay and not the tee ring: \"clover r339: beatctl wrote= read= magic_wrote= magic_read= ok=\" writes a sentinel no timer can produce and reads it back in the same breath before clover_imem_beat is published, so a boot without beatmagic= is now a statement about the firmware and ok=0 retires the whole record instead of re-guessing it; \"clover r339: mark wrote= before= after=\" reads the restart cell before the store, because the value found there belongs to the boot that ended. The gate needle on (C) is INVERTED rather than deleted: the agreement check must print N of N with N at least one and printed \"1 of 1 rows ... (asked about 12 writes, 1 of them compiled out)\", and N20 turns red if the constant moves back. Not done, as pre-registered: no misc BCB change, no PMIC channel (this board declares pm660/pm660l and zero sdam nodes), no new boot-arg -- git diff --stat board.toml is the title line alone. The same round closed round338's open \"the cause is NOT settled here\" and the answer was neither hypothesis: the fake PMIC in drivers/CloverPower/tests/clover_power_host.cpp stored DONE before the answer it promises with DONE became visible, so under host load 347 of 4000 model runs polled a flag whose own per-channel record still described the previous transaction (240 no serve answered this ask, 107 a different peripheral). Per round331b's rule the budget was not tuned to green: four __atomic_thread_fence(__ATOMIC_RELEASE) before the DONE stores plus the reader's ACQUIRE, five new gate needles (the DONE-store count must equal the release count), and three new negative cases N30/N31/N32; the same 500 loaded runs then read 0 failures. No driver or PowerArb.h behaviour changed -- the defect was in the host model.",
   "round339b (v0.7.57, HOST-ONLY INSTRUMENT ROUND, no image, no driver code, no flash, #721): boot 120 handed back two readings, and one of them is a defect in this repository's own sentence. READING ONE -- the run wrote the payload, the board left fastboot, and the after-deadline watch (~/clover-out/clover-log-window.bin.timeline.txt, section opened 2026-11-07T06:55:15Z, budget 2220 s) polled no-node through elapsed 722 s and edl at 726 s, closing as close:neither-edl at 2220 s. So the reset's onset is bracketed to 4 s and it is ~1074 s BEFORE the 1800 s deadline, which makes branch M-A an empty verdict rather than a pass: the question it asks -- does the landing mode still come from the misc BCB -- was never put this boot, so the rename is neither confirmed nor refuted and its retraction condition stays registered. M-B/M-C/M-E need boot 120's card; EDL neither writes storage nor loses it, and reading it means physically returning the board to TWRP. M-D stays deferred to boot 121 as pre-registered; M-F already held host-side (1 of 1, N20 red). READING TWO -- the same run's verdict sentence printed 'that window closed as id' (~/clover-out/unattended-r339-boot120.log:10). The cause is on the write side: timeline_close photographs 60 lines of the USB tree UNDER the close line, and both verdict sites took the fifth field of the last line of the file, so they quoted a field of that tree as their own verdict. Measured on the same 174-line artifact: the old extraction returns id, the new timeline_last_close() returns close:neither-edl. The worse half is in the gate: round337 pinned the EXPRESSION (the tail form must appear, exactly twice), so it pinned an expression that was wrong -- the same lesson as N8 one round after N8, except here every character was present and the arithmetic was the defect. So the needle is now a run: scripts/run-clover-unattended.sh gains timeline_last_close(), which restarts its scan at each # watch header (the file is appended across runs, so without the reset an older window's close becomes this one's verdict) and matches only five-field lines (a close line has five, a poll row six, an ioreg row whatever it has); both verdict sites call it. In check-clover.py the old presence needle is withdrawn and replaced by a ban on the tail-extraction shape at a verdict site, a count of the helper call equal to two, and three synthetic timelines the gate RUNS through the function body cut from the shipping script: close-then-tree must yield close:neither-edl, an older window's close with this one still open must yield empty (so the sentence says no-close-line rather than borrow a reading), and two closes in one window must yield the later. Negative suite 32 -> 35 cases, 0 problems, every restore byte-identical: N4/N10 follow the new call, and the three new cases each break something only a run can see -- N33 puts the tail form back inside the helper (the ban does NOT catch it, because that string no longer sits after a verdict assignment; the probe turns it into IOUSBHostDevice, and names itself), N34 deletes the header reset (returns close:adb for a window that never closed), N35 renames the helper. Both gates EXIT=0 after unixnu tree reassembly, with the script and checker byte-identical between repository and tree (dea47223 / 66ab991c). No image was built or flashed: drivers/ and board.toml are untouched in this commit, so boot 120's card still belongs to v0.7.56.",
   "round340 (v0.7.58, HOST-ONLY INSTRUMENT ROUND, one driver comment line, no image, no flash, #653): the card's geometry has been typed in three files since round176 and nothing compared them -- CloverSdhci.cpp writes the rings, read-clover-log.py re-declares the same numbers under its own names, run-clover-unattended.sh dd's a third copy of the size -- so a two-sector disagreement between the writer and the reader is a record that was never read, which is round319's and round191's silence aimed at the writing side. scripts/test-clover-sdhci-geometry.py now makes that one measurement with five legs, and the gate RUNS it and reads its report rather than grepping any of the three tables: pairwise over the 22 names both files declare (each file's own arithmetic resolves its derived names), region tiling (the ten named regions must tile [0, 1217) exactly on each side -- an overlap is boot 91's two-writers-one-sector arriving from geometry rather than from a reader, a gap is a sector nobody owns inside a window people trust), a words leg that checks what the driver's comment claims about the constant beside it, a shape leg on the eight writer lines and eleven header words the roundtrip replicates, and the roundtrip itself: four records built from the driver's arithmetic and decoded by importing the reader's own decode(), with two controls (two sectors earlier, one sector later) that must find nothing. Readings: 22 of 22 agree, both tables tile exactly, the three window copies say 1217/623104 together, rings asked with {0: (21, 25), 1: (22,)}. Two facts fell out: the driver's own comment said kRingRamSlots=128 is deeper than either card ring while its table says {64, 512}, so the staging ring is deeper than the driver's ring and shallower than the kernel's (the comment is corrected; one line for one line, file still 10140 lines, so no __LINE__ anywhere moves and the round claims no hash change -- an argument, not a measurement, falsifiable by the next rebuild's __TEXT_EXEC diff); and the window size, previously three separate needles, is now one comparison. Two instrument defects were caught by the script's own first runs and are the thirtieth layer's second half: an existence needle pinned to an expression was satisfied by the reader's --selftest copy of that expression (the main-path ask is now anchored to its own assignment and required exactly once, and the driver's word-5 literals are the third voice, because the roundtrip's two legs pick the kinds together and could only ever agree with themselves), and a parser aimed at the wrong file raised a traceback while printing instead of naming what it failed to read. Seven negative cases (N36-N42) each require the sentence only their own leg can print. Not claimed: that the card actually holds records at these sectors -- that answer belongs to boot 120's card, which still needs the board back in TWRP.",
   "round341 (v0.7.59, CODE ROUND, the sixth driver gets a bus-free layer; built, gated, released and NOT flashed by this entry -- the flash follows as boot 121, #653): every decision the driver makes about a record now lives in drivers/CloverSdhci/SdhciLogCore.h (375 lines) -- the window's geometry, the ten header words and their positions, the body clamp, the byte rule, the sum, which slot a cursor lands in, whether a ring was full, whether a relay slot was still unconsumed, and how a kernel line is assembled under its bound. What stayed in CloverSdhci.cpp (10140 -> 10083 lines) is what cannot be modelled: register reads, the completion poll, IOKit objects and every CloverSdhci rNNN: string, so boots 41 through 120 remain byte-comparable. drivers/CloverSdhci/tests/clover_sdhci_host.cpp (669 lines, 13 cases) compiles the same header the driver does and scripts/test-clover-sdhci.py (424 lines) drives it at rates the board has never produced; the build gate RUNS that test instead of grepping it, and scripts/test-clover-sdhci-geometry.py gained a leg for every local the driver binds from a layer call (attributed by enclosing brace depth, unbalanced braces judged red rather than guessed at). Seven findings, each with its own denominator measured over the archived readings BEFORE the change: (1) the probe relay counted seq >= kProbeSlots, a position and not a backlog -- latent, 0 of 575 archived probe rows ever reached 64; (2) a kernel line longer than the 320-byte bound destroyed the byte that arrived when the buffer was full and assembled the rest as a second row the allowlist drops silently, while the constant's own comment said truncated-not-split: LIVE, 631 of 104,819 archived kind-22 records have a body of exactly 320; (3) the writer summed the text as it arrived but stored the filtered bytes, so one control byte makes an intact record one no decode believes -- latent, 0 mismatches over 106 windows / 6,714 + 54,272 records; (4) panicAppendText spelled the ten word