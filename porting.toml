configuration = ["firmware.config = clover; firmware.dsc = Platforms/Xiaomi/cloverPkg/clover.dsc.", "bootimg.image uses header version 0, 4096-byte pages and base-relative load offsets; the ABL adds the DRAM base.", "No [[bootimg.dtb_node]]: the stock tree already carries the splash node, and the firmware patches it in place."]
procedure = ["Build uefi-clover separately and pass it as --uefi when the payload or boot image is assembled.", "Inspect the firmware memory map against facts/ before changing a reservation.", "Cold-flash the cache partition and read the panel; there is no serial console after the menu."]
findings = ["The firmware publishes a GOP framebuffer, but this XNU kernel learns about it through /chosen and the entry probe, not through a platform display driver.", "The payload does not travel in a ramdisk: this firmware has no ramdisk filesystem driver, so UniXNU reads it from the cache partition.", "The firmware DTB is an input to the boot image; the separately generated ADT is the tree XNU consumes.", "Round160 extends the checker the firmware step runs: a userdata host gate that lost its pinned seed or its three-window rule now fails the firmware build, not the destructive flash.", "Round164 uses the same firmware volume; the board checker now asserts the round164 menu title and the two new payload/kernel contracts.", "Round165 also ships the unchanged firmware volume; only the checker's menu-title assertion moves to clover r165.", "Round166 ships the same firmware volume and only moves the menu-title assertion to clover r166; the checker addition covers the driver's untrusted batch default and the new signature-dump patch.", "Round167 ships the same firmware volume and only moves the menu-title assertion to clover r167; the checker now also asserts writeSettled, the stop-command check, the CACHE_CTRL switch and the three-sample read trust rule.", "Round168 ships the same firmware volume and only moves the menu-title assertion to clover r168; the checker adds the two give-up lines, the 30 s guard and the 4 s settle bound, and rejects the two-second hand-over and the flat two-second request base.", "Round169 ships the same firmware volume and only moves the menu-title assertion to clover r169; the checker adds the card-busy line, the stage-tagged read line and abortReadTransfer, and rejects the four-second settle and the once-per-boot read give-up.", "Round170 ships the same firmware volume and only moves the menu-title assertion to clover r170; the checker asserts the 48-line check_np cap and the 16-line cache-directory cap, and rejects the two uncapped r153 format strings the throttle replaces.", "Round171 ships the same firmware volume and only moves the menu-title assertion to clover r171; the checker now asserts batchDelivered and kContentErrorMask, both CACHE_CTRL switches and the flush export, the two IOLock guards and their allocation gate, and rejects the retired gBlockGuard CAS, a block guard published without its lock, a flush that never re-enables the cache, and a getWriteCacheState that hardcodes false.", "Round172 reads the firmware's own transport back out of the dump it left: SDHCI_CAPABILITIES 0x742dc8b2 has CAN_DO_ADMA2 (0x00080000) and CAN_64BIT (0x10000000) set and CAN_DO_SDMA (0x00400000) clear, and the verification header's last HOST_CONTROL was 0x38, which is ADMA64 (0x18) plus the 8-bit bus (0x20). The boot loader was already DMA-ing on this controller, so the path round172 adds is the one the firmware used, and check-clover.py now pins both the descriptor layout and that reading.", "Round173 puts writes on the transport the firmware used: the same 12-byte ADMA2 descriptor table, the same 64-bit HOST_CONTROL field, and CMD25 with TRANSFER_MODE's DMA bit set beside MULTI and BLK_CNT_EN. check-clover.py therefore stops refusing SDHCI_TRNS_DMA on a write transfer mode and instead requires that a DMA write only be attempted after a PIO control round trip on the same blocks reported control=1.", "Round174 adds no new controller mode: the verdict writer keeps the PIO path it inherited and issues no command beyond the single-block read/write pair already audited, while check-clover.py now refuses any CloverSdhci verdict line that still calls IOLog directly -- a reading that belongs on the card cannot be left on the panel by accident.", "Round175 adds no controller mode and issues no command of its own: the tee only reads kernel memory and hands what it keeps to the round174 verdict writer. check-clover.py now refuses any path between teeConsumeLine and teeKernelLog that calls IOLog or sdhciSay, because printing what was copied out of the kernel log would feed the tee its own words and take bsd_log_lock inside the block guard.", "Round176 ships the same firmware volume and moves the menu-title assertion to clover r176. check-clover.py now requires the two rings to tile -- kRingCardSlots {64, 512} with kRingOffset {64, 192} and the reader's own arithmetic 64 + 2*64 = 192, 192 + 2*512 = 1216 -- requires exactly one call site that pushes kernel text (teeConsumeLine), caps the tee census at 12 lines, and refuses the single-ring names verdictPush, gVerdictBlock, kVerdictSlots and kVerdictOffset, because a leftover of the retired shape is a ring that silently never flushes.", "Round177 ships the same firmware volume and only moves the menu-title assertion to clover r177. Its checker additions are host gates run as subprocesses: normalize-kernel-macho.py --selftest replays 17 normalisation rules and check-cs-blob-structure.py --selftest replays 14 cs_validate_csblob rejection rules, and the checker requires the normalizer to sit after the AMFI patcher in AGENTS.md, because the patcher moves bytes the identity fields would otherwise have to describe.", "Round178 changes no firmware module and no memory map: the mu-clover tree is untouched and the round reaches the card through the prelink archive build, so the only firmware-visible contract is the payload title. Its checker additions pin the new guard primitives and require the hand-off call to appear in both the read and the write loop.", "Round179 changes no shipped byte. The menu title stays clover r178 because the payload is the round178 archive; the only additions are a host-side audit of the display family and its gate in check-clover.py, which pins the audited constants and refuses to run without a built kernel rather than invent one.", "Round180 changes no firmware module and no memory map: the mu-clover tree is untouched, UEFI still publishes the splash framebuffer at 0x9D400000 and the boot header stays v0. The firmware-visible part of the round is what the shipped image now promises at boot -- three display boot arguments in board.toml -- and what scripts/check-clover.py demands around them: it refuses a defconfig with CONFIG_XNU_NATIVE_LEGACY_DISPLAY on whose [kernel] archives omits the Legacy builder, refuses the reverse, refuses either boot argument missing, and refuses CONFIG_XNU_NATIVE_MOBILE_DISPLAY alongside it because the MDP5 driver has no hardware on this board. The round adds no firmware command and no new UEFI module.", "Round181 extends scripts/check-clover.py with a three-part contract for the new driver: the CloverInput archive, the defconfig line, the clover-input boot argument and the SHENG_PMGR schedule have to name each other; the driver source itself has to keep the shapes that make a transaction real (a SW_RESET write per transfer, the kQupMaxTagsLen tag array, the (address << 1) | 1 read tag, kQupTagV2DataRdStop, return finishTransfer (), the clover-input boot arg and a closing clover_emmc_flush_cache ()); and two negatives are asserted -- no write-only chip path, and no MX counter writes, which FIFO mode forbids. The menu title has to read clover r181, and the PMGR tail order unattended-then-emmc-then-input is checked by position, not by good intentions.", "Round183 ships the same firmware volume, moves the menu-title assertion to clover r183 and widens the contract that pins driver constants to the firmware's own device tree from 26 addresses to 30: qcom,smem@86000000 with its 0x200000 size and both smp2p nodes at 17911008 now have to agree with DspRegs.h before scripts/check-clover.py passes. The round adds no firmware command, no new UEFI module and no memory-map change -- which is the point of it: the ADSP and WiFi image regions it scans are memory this boot's firmware neither maps nor clears, so a scan that reads zero is a statement about the boot loader's PIL pass, not a verdict on the silicon.", "Round182 changed no firmware module either; its board.toml edit is the CloverPower archive entry and the menu title, and the SPMI windows it reads are declared by the same firmware DTB the boot image carries, which is why scripts/check-clover.py can bind driver-header bases to that tree.", "Round184 ships the same firmware volume -- round184-boot.img is byte-identical to round183's 196b284f -- and moves the menu-title assertion to clover r184. What it changes about the firmware contract is how a boot ends: with no deadline the board never came back to fastboot by itself, and the panel turned out to be a fixed-grid printer rather than a scrolling console, which round183's frame proves (its first row is still the kernel's own version banner, its last row is part(3)). Readings therefore have to come off the card, and off the card before the reset the deadline causes.", "Round185 ships the same firmware volume -- round185-boot.img is byte-identical to round184's 196b284f -- and moves the menu-title assertion to clover r185. Nothing the firmware owns moves: the log window changes which partition the driver writes to, and that is a fact of the card's GPT which the driver already walks at mode >=14, not a change to the memory map, the boot header or the payload geometry.", "Round186 ships the same firmware volume -- round186-boot.img is byte-identical to round183/184/185 196b284f -- and only moves the menu-title assertion to clover r186. Nothing the firmware owns moves: the round adds a kernel-side namei reading, the memory map and boot header are untouched, and the payload still reaches the board from the cache partition.", "Round188 ships the same firmware volume -- round188-boot.img (196b284f) is byte-identical to round183 through round187; the round moved only the kernel inside the payload.", "Round192 ships the same firmware volume -- round192-boot.img (196b284f) is byte-identical to round183 through round191, because the round touched one driver and no DXE module. scripts/check-clover.py gained the r192 contract in the same round: the menu title must say r192, the bring-up must no longer contain if (cacheSize && cacheCtrlBefore == 0) {, cacheOn must read what the card reports, and the skipped-commit line must sit before acquireBlockGuard. The cold flash still writes only the cache partition.", "Round193 changes nothing the firmware loads: the payload lives on the cache partition and the boot image stays byte-identical to r191/r192.", "Round194 likewise changes nothing the firmware loads: round194-boot.img is still 196b284f, byte-identical to r183 through r193, and the only written partition is still cache.", "Round195 changes nothing the firmware loads: round195-boot.img is still 196b284f, byte-identical to round183-194. The panic screen is patched into the kernel payload, so both of this round's changes travel in the cache partition's image only.", "Round200 changes no firmware input: boot.img is not rebuilt, so round200-boot.img is the round183-199 196b284f, and the only firmware-visible fact is that the kernel grew one page, moving the two AMFI cuts from file 0x1aad0e4/0x1aad16c to 0x1ab10e4/0x1ab116c while their virtual addresses stayed put.",
  "Round316 touches no firmware: no uefi-clover change and no mu-clover revision change; the payload is built against the same firmware tree as round313-v0.7.25-payload.img.",
   "Round318 touches no firmware: no uefi-clover change and no mu-clover revision change; the payload is built against the same firmware tree as round317-v0.7.29-payload.img.",
   "Round342 touches no firmware: no uefi-clover change, no mu-clover revision change, and the payload is built against the same firmware tree as round341-v0.7.59-payload.img. What this area owns besides board.toml is scripts/check-clover.py, and that file changes for an instrument reason: when it forwarded the sdhci host model's problems it kept only the first six names. Negative N60 (rename a pinned row head in both the layer and the reader, a change only a card can see) went red, but the forwarded reason did not contain its own verdict 'a pinned slot held no record' -- the six-name cap and the runner's tail truncation stacked and cut exactly the line that said what broke. The cap is removed; every named line is forwarded, each still bounded at 150 characters. Both gates EXIT=0 after the change (repo side: DT 40 addresses against 230 device-tree nodes, 107 inline asm statements separated, 11 drivers documented, citation shapes banned in 36 authored sources).",
  "Round344 touches this area only through the shared board.toml, and only its [payload].title: the round token moves to r344 and names the new display rows. Every value this area owns is byte-identical to r343; the entry is recorded here because the file is shared.",
  "Round343 adds no firmware key: the firmware still renders the payload title, which now reads clover r343. Its share of the round is scripts/check-clover.py, which grew the #736 offset-chain gate -- it walks each swap-row column name to its snprintf operand, to dispTxt[slot], to the kDisplayOffsets constant, to the number disassembled out of the stock kernel's latch writer, and prints the whole chain beside the verdict (22 columns against 22 operands), so a name that drifts from the offset filling it goes red at the link that broke.", "Round354: boot 133's beat thread overflowed its 16 KB kernel stack on the first sampler fire (ESR 0x96000047 in oslog_stream's frame push, sp/far below the kstack base) because the four heavy helpers were inlined into clover_bb_sample (frame 0x2aa0 = 10912 B). The fix is patches/xnu/<83z>-clover-r354.patch: four __attribute__((noinline)) marks plus 36 census/user-frame scratch arrays moved to single-writer static buffers, because the noinline cut alone still measured 0x2700 (9984 B). The final sampler frame is 0x14e0 (5344 B, lldb on the linked kernel) and the deepest chain bb_sample -> holder_sample -> holder_door -> printf is about 12.8 KB against the 16 KB stack. patches/xnu/series applies it after r352 (line arch:../../../patches/xnu/<83z>-clover-r354.patch), and this area now claims patches/xnu/** because the series line loads that copy -- the r354 gate pins the three copies byte-identical (md5 f865b85465ec2b0a45c0e480c5ecbbd7).", "Round355 adds patches/xnu-clover/<84z>-clover-r355.patch: clover_port_obj_held reads ip_sorights and ip_mscount under the same translate lock it already holds, and send_holders_row runs r352's cross-space SEND_ONCE walk (clover_port_once_holders) on the leaf port it now returns referenced, printing so=/ms=/once=/och=/ocp=/ocs= on BOTH bbsend branch endings and naming each holder in new clover r355: bbonceh rows. The reference discipline differs from r352's holder_door call on purpose: obj_held hands back the port ip_reference()'d under the translate lock, so the walk needs no extra io_reference. patches/xnu/series applies it after r354 (line arch:../../../patches/xnu/<84z>-clover-r355.patch) and the gate pins the three copies byte-identical (md5 93eda62a9ea3d35badbc5421bb0a61f9), because the walk's stack safety is exactly r354's noinline cut. Measured after build: clover_bb_sample frame 0x14f0 = 5360 B (+16 B over r354, compiler slot reuse), deepest chain ~12.9 KB against the 16 KB kstack, so the promised noinline fallback was not triggered.", "Round356 adds patches/xnu-clover/<85z>-clover-r356.patch: clover_bb_holder_send runs the r355 snapshot onto the send destination rem=x3 that SpringBoard's trapped thread carries in its own task space -- translate SEND first (a destination usually holds no receive right), then RECEIVE and PORT_SET, then r352's once-walk on the referenced leaf -- and prints a clover r356: holdrs row with q=/sr=/ms=/so=/once=/och=/ocp=/ocs= (an e= row when all three translations fail), an explicit skip=same row when rem == rn, and the named holders in clover r356: holdrsh rows. The patch is pure addition -- it removes no line at all, and the gate asserts exactly that. patches/xnu/series applies it after r355 (line arch:../../../patches/xnu/<85z>-clover-r356.patch) and the gate pins the three copies byte-identical (md5 6ed0925555e85e3a3554971a58c4d185). Measured after build: the sampler frame is unchanged at 0x14f0 = 5360 B, the new helper frame is 0x3f0 = 1008 B in the same shape holder_door has, and the deepest chain is still ~12.9 KB against the 16 KB kstack, so r354's noinline fallback was not triggered.", "Round358 adds the r358 patch to the series after r357: patches/xnu-clover/<87z>-clover-r358.patch, md5 62a005d23185ec35185f3812ef9c9728, three copies byte-identical, and patches/xnu/** is this area's because the series line loads that copy. The firmware is untouched -- no uefi-clover revision, no bootimg node, no menu setting -- and it renders the title, which now reads clover r358. The round's prelinked kernel is md5 9a61ddcabd845e897f9271177b8466a1 / sha256 6b1f8366f97b279957806c584f2b02786b900920b2f34f1156ba3b9a2fd66d4c; patch-clover-amfi.py moved the same two branches at file offsets 0x1af30e4/0x1af316c (amfi sha256 1ea400c5d34d55713e89532308f753bc6f0978e3b5384699d38524586f7e4226) and normalize-kernel-macho.py zeroed 973 object stamps (a5993fc6430a1b36c93a90c6552f2db7eb450d11840d7e5db7ce234a5db6e93c).", "Round359 adds patches/xnu-clover/<88z>-clover-r359.patch, md5 a33991e5a696b748a000f60fafb471f4, to the series after r358; the three copies are byte-identical and patches/xnu/** is this area's because the series line loads that copy. The firmware is untouched -- no uefi-clover revision, no bootimg node -- and it renders the title, which now reads clover r359. The prelinked kernel is md5 293d1f0f49f2909e56c178c3df341e68 / sha256 3ac5456ca47b4a2c79ddbb26f0727dca8df758fee45ddff9e26427fe2a72747f; AMFI kept the same two branch sites (amfi sha256 a995cf70f65aeab388930ac667719f42c4fde665d2dfd7c0380acc1ea1b452a3) and normalization zeroed 973 stamps (6afe2821f0853ddecfef1a0e7facf140a236cb593438633f235dfd0dc9bd704c). The first cut of the patch overflowed clover_bb_self_sample's four thread slots on boot 139 (ten trapped threads, no bound inside the pass) and was re-cut before this image.", "Round360 adds patches/xnu-clover/<89z>-clover-r360.patch, md5 8b071802b0c20a03d763d5dba42ce69d, to the series after r359; the three copies are byte-identical and patches/xnu/** is this area's because the series line loads that copy. The firmware is untouched -- no uefi-clover revision, no bootimg node -- and it renders the title, which now reads clover r360. The prelinked kernel is md5 471635372bf75d60fc44ebd4733d5de9 / sha256 1574099c6983369cee061daee21e9ebeff8cebc594b19054984d1528ff63b3ef; AMFI patched the same two branches at file offsets 0x1af70e4/0x1af716c (VA unchanged; the round's code moved the layout 0x4000 further, amfi sha256 dcdf0d7693973dd4bb0f844e3dde95282ee521c2b9a73ad66b80878d735c14b3) and normalization zeroed 973 stamps (65f17e13cf3ab3fe6cf0acc060fa7dd7ec0545f8e1c470d018fb466015a98ded).", "Round361 adds patches/xnu-clover/<90z>-clover-r361.patch, md5 017a64f3a8dfa71a0e3fe77072d90537, to the series after r360; the three copies are byte-identical and patches/xnu/** is this area's because the series line loads that copy. The firmware is untouched and renders the title, which now reads clover r361. The final prelinked kernel is md5 d358c9340046ccdab4e2c390f77fa3c4 / sha256 a6b7c255a8344e3c454ea6e8295e1c9160baf6b94433b670de9d2d72114af876; AMFI patched the same two branches at 0x1af70e4/0x1af716c (amfi sha256 ba3b2c7ee55917a1f8da0b04c9c8b5d246f10145fbd6568d7c2ffa2dc895751e) and normalization zeroed 973 stamps (4f26d10ae1f8f90237a7c3a29450e60f3af3181c8ae9d956f7c5736df1bf61c3). Three builds were needed: ip_kobject() is a field, not a function (port->ip_kobject); the failed compile deleted task.o and archive-09 then reported Unavailable real kernel imports [_current_task] until a bare kernel pass restored it; and plain copyin reads through the beat thread's map, not the sampled task's (copyinmap(task->map, ...)).", "Round362 adds patches/xnu-clover/<91z>-clover-r362.patch, md5 16416fbc6c88c4899e8b14d073ee20a1, to the series after r361; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r362. The prelinked kernel is md5 e7f09638dda96c7acbfd113ecef3e072 / sha256 e35ecc9a945f35c897883d3982a632bc3223ac316bc1eb1b4ae6d16f5d84abe0; AMFI kept the same two branches (amfi sha256 e063a541d0c1fe4a62f7395466ff3a5dd75e29f25ac4d81f79c0422f9805aa44) and normalization zeroed 973 stamps (d1d3df7922b5222000816a4316fe10cafb08c0d0fbbf099c4727762abdda1910). Boot 144 did not come back: the reset landed the board in EDL (QUSB_BULK), which is below the bootloader and cannot be written from this host; the card still holds that window and one power cycle recovers it.", "Round363 is a host-only round: no kernel patch, no new payload and no board.toml change, so the image on the card is still round362's. Its share of the files is scripts/check-clover.py, which gains the EDL-reset pins (the helper, the two host paths, the timeout and the two sentences), and the note that boot 144's window was read through the host BCB after an EDL landing rather than by the payload's own reset.", "Round364 adds patches/xnu-clover/<92z>-clover-r364.patch, md5 e27d78da1c238fe267e41c72a67c8d35, to the series after r362 (the r363 round had no kernel patch); the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r364. The prelinked kernel is md5 4467ba3e823717b82a8b64d833fd4345 / sha256 6dc4fa472446591868affcff7dc6e612cb49a011459b92c560d83ebfa67c9c0f; AMFI kept the same two branches (d7bda6f3dd70c2812df285f15a963426ec38070ba7302c3f57c343f7174f8258) and normalization zeroed 973 stamps (7911da041c9c35a5acdc772c171e1471f276fba7ddc231cdef8a2add60ba554f). Boot 145 landed in Sahara memory-debug (PID 0x900E), below EDL, and the window is unread until a power cycle.", "Round365 adds patches/xnu-clover/<93z>-clover-r365.patch, md5 38fcf563c346896bd15833288558240d, to the series after r364; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r365. The prelinked kernel is md5 3258212e999316b4e39712fdc6b52609 / sha256 70e481bd664fb24bf576b22e0333146a493ecec8a1753e1e5e1eed0a25e4329c; AMFI kept the same branches (527473734d41e025cc7bf69d2b7621e01648c1575a8263e0f58bced784923c8b) and normalization zeroed 973 stamps (6b9c240602a0d9fb885db6e755b8ef1802870ff5e6e12899063029d2478a5857). The image is staged: the board is still in Sahara memory-debug and no flash happened this round.", "Round366 adds patches/xnu-clover/<94z>-clover-r366.patch, md5 3019d5f30a5cf7c0e24d6dd278aad833, to the series after r365; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r366. Boot 145 (round364 image) finally read a valid header at the trap's pointer: bits 0x1513 (remote COPY_SEND, local MAKE_SEND_ONCE), size 0x55c, remote 0x6f0f (kotype 29, the IOKit connect port), local 0x6b07 (the reply port), id 0xb31 -- a 1372-byte synchronous IOKit request. Boot 146 (round365 image) had two port-set hops and no send destination, so the register criteria were not judged. The r366 prelinked kernel is md5 / sha256 recorded in the build log; the image is staged, not yet flashed.", "Round367 adds patches/xnu-clover/<95z>-clover-r367.patch, md5 157603db792c0e3609d0735f6f303800, to the series after r366; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r367. The prelinked kernel is md5 fa65794811f86339e4051540dff50c7b / sha256 f39014dccb087e0b204252bc247793273126e723fc3df8d172733a4953abb890; AMFI 0bc024fbcbdaa1d1ceda98f497c7f8cbd74fc1ea00bcd66cb6b6628a6b598ed0, normalized 890cdf0227912410a4e99cf3d9ee26c319ea62650b1e23a17136f8a80e4f9423. Boot 147's window is the reason: it reached 1805 s with ent=0 fired=0 because the target latch never opened.", "Round368 adds patches/xnu-clover/<96z>-clover-r368.patch, md5 1c3b0b8f5c660497a45167194f987c31, to the series after r367; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r368. The prelinked kernel is md5 4f83552c0f119e7c66c238c3c9c7259c / sha256 2ef2d7f86f053d2218e04b7f324d2c9a88b130f26af6f305b6dc4b5607400cab; AMFI ece43d852794861e6510db6002a7f853d25e152ea197feb1cf033c6fade672e1, normalized e70feb280bca7d697b477c4b7c70b611f720d60b3ea3053aa6b97571675e5a7f. Boot 148 showed the latch opening once and later beats reading target=0 again.", "Round369 adds patches/xnu-clover/<97z>-clover-r369.patch, md5 74541d2313b9f5cb024c6324ea38af37, to the series after r368; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r369. The prelinked kernel is md5 af37309729b1fa60cbd595c75b8a6566 / sha256 2d0c0afab0b561c8dc81342974dcb20f270048a8e6f3cca014061ccdd406d386; AMFI 64bfadbc77b48a4c1bc9c2adacadee4fb840ecef9d65ad9b8446eb2f304524a6, normalized 44558fe208a5d267bbba9f75945fcba130a2232b59a6356286c58ba45b831604. Two boots of the r368 image (149, 150) both stopped at about 170 s, so its fire shape was reverted.", "Round370 adds patches/xnu-clover/<98z>-clover-r370.patch, md5 5865bd4a2d2909d4e993712ae85fea4b, to the series after r369; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r370. The prelinked kernel is md5 d338189ad02bc207c1483c8bcb699ac2 / sha256 504aa5e1bd8e703d7b0f5ad99a4ec3cbc440b7f6932abf6b816f55c6ccf463ed; AMFI eedc9e5904a28614a06e5f9376ec83ba2ea8f1af9c6e61d54a47aa37fef24c44, normalized 29b61829b7fbe473671c1adaedf2792699a68d5ec4c31541e0e2b87969751025. Boot 153 carried the image and stopped at 167641 ms before any send hop.", "Round371 adds patches/xnu-clover/<99z>-clover-r371.patch, md5 9f9fc1619d91f571ab0b7c090bd4376c, to the series after r370; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r371. The prelinked kernel is md5 3fd7e01e7635ad83c80d1c2c5e105eb2 / sha256 19f1fd4f99160e1dda533851f9fa86a8ec2188290d0444aafd1d886cb7c62f9c; AMFI 9c85ca92f6995862133eee1aa2097749d4b96cda474c5bbb5fc00ccd928b0b78, normalized 105f57c3c5ec5452ab2d6939adb029cb1309d6191dd70bdf84d72028d279a1e1.", "Round372 adds patches/xnu-clover/<100z>-clover-r372.patch, md5 5215758da9fa0a114694a6fa3a9c1daa, to the series after r371; the three copies are byte-identical. The firmware is untouched and renders the title, which now reads clover r372. The prelinked kernel is md5 269dc24bc30928f2f8c3662878716b51 / sha256 8a97bcca981bd706c28cb86122ecd487aa02c97b40f9b498ca288c6c2e6ccd82; AMFI fe0d3506c21d4abebb95a6c571fdfcda81f3041d32c2e86b7c5de8cad7980dce, normalized 7f55eedee1ced873817fb210161d83cc9d53e2a9d00282cc758e5f0d7adbf8f8."]
