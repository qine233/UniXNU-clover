[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["board.toml", "scripts/make-clover-adt.py", "scripts/build-clover-display-stub.py", "drivers/ArmCpu/**"]
inputs = ["DRAM at 0x80000000 with size 0x80000000 (2 GiB).", "ABL framebuffer at 0x9D400000 with size 0x02400000; reserved carve-outs for PIL, venus and the firmware FD.", "Payload owned-memory request 0x40000000 (1 GiB), the largest obviously free low-bank request."]
configuration = ["The payload declares owned_memory_size = 0x40000000 and dram_size = 0x80000000.", "The entry probe identity-maps the framebuffer into TTBR0 before the MMU is enabled, then seeds _vinfo for the panic screen."]
procedure = ["Compare facts/ memory dumps, the firmware map, the ADT and the splash reservation before changing a range.", "Run the region checks in scripts/check-clover.py, which reject overlapping windows."]
findings = ["The DarwinBoot window cannot start below 0x9D400000 and the framebuffer lies outside it, so the bootstrap map never reaches the framebuffer. The mapper in the probe builds the missing TTBR0 entries explicitly.", "The kernel switches TTBR0 to its own tables in arm_vm_init; after that point the probe can no longer paint, which is why later frames are timed resets.", "There is no SMMU driver; none of this board's enabled DMA engines is programmed by XNU.", "Round164 leaves every memory window, boot argument and owned range unchanged; the only kernel-side change is a signature-hash policy in ubc_subr.c.", "Round165 again leaves every window, boot argument and owned range unchanged; its kernel-side change is confined to the eMMC read path.", "Round167 also leaves every window, boot argument and owned range unchanged; the driver adds write confirmation, level-gated writes, a CACHE_CTRL clear and the three-sample read trust rule only.", "Round168 leaves every window, boot argument and owned range unchanged; only the block driver's wait bounds and retry ladder change.", "Round169 leaves every window, boot argument and owned range unchanged; only the block driver's read-failure stop, pre-read card-idle wait and wider write waits change.", "Round170 leaves every window, boot argument and owned range unchanged; only kernel print sites change.", "Round171 leaves every window, boot argument and owned range unchanged; only the block driver's completion criterion, cache policy, lock and batch size change.", "Round172's DMA runs through a bounce this driver owns: IOBufferMemoryDescriptor::inTaskWithOptions(kernel_task, kIODirectionInOut | kIOMemoryPhysicallyContiguous | kIOMemoryMapperNone, 64 KiB + one 4 KiB table, 4096), retained for the whole boot and refused outright if getPhysicalSegment reports a run that is not one contiguous segment, not page-aligned, or (on a 32-bit DMA host) past 4 GiB. That is the same four checks sheng's NativeUfs applies to its own bus buffer, and it is what keeps a caller's APFS or dyld buffer from ever having to be walkable by this bus.", "Round173 reuses the one bounce the read path already owns: the caller's words are copied into gAdma.dataVirt before the descriptor table is built and cacheCleanInvalidate runs on the data as well as the table, because on the write side the CPU cache holds bytes the card must see. No caller buffer is ever walked by the bus, and the same four physical-address checks from sheng's NativeUfs guard it.", "Round174 adds no DMA buffer: the verdicts are assembled in a static RAM ring and handed to the same unguarded single-block PIO writer, so no caller buffer is walked by the bus and the round173 cache contract for DMA writes is untouched.", "Round175 allocates nothing: the scan cursor, the single line buffer and the counters are static, and the kernel buffer is read where the kernel left it. Every pass re-reads msg_magic, msg_size, msg_bufx and msg_bufc instead of caching them, because bsd/kern/subr_log.c can relocate msg_bufc at runtime; a changed base prints tee buffer moved and resets the cursor rather than trusting a stale offset.", "Round176 grows only static storage: the staging ring becomes two rings of 128 slots x 320 bytes of text with their length, cursor, sequence, pending, dropped and busy arrays, still allocated at link time and still no IOBufferMemoryDescriptor -- the split costs RAM, not a DMA buffer. The kernel message buffer is read where the kernel left it, its four fields re-read every pass, and nothing in this round walks a caller buffer through the bus.", "Round177 leaves every window, boot argument and owned range unchanged. Its new script rewrites bytes in the kernel file on the host -- 962 symbol n_value stamps, one 16-byte LC_UUID and one 24-character KCID string -- allocates nothing at boot, changes no executable segment and does not change the file length, so no memory map moves.", "Round178 leaves every window, boot argument and owned range unchanged. It adds three driver globals and two static functions, allocates nothing at boot and walks no caller buffer differently; the request deadlines keep their round169 arithmetic and only the interval they measure changed, because guarded time now accumulates across hand-offs instead of restarting per request."]
completion = ["The ADT memory map, the firmware reservations and the owned range do not overlap, and the boot reaches the root mount with the framebuffer mapped."]
limits = ["The record covers the handoff window and the splash region; DRAM sizing beyond those comes from the firmware map.", "No DMA engine is validated through an SMMU."]
next_action = ["Attach the firmware memory map and each DMA consumer when a driver starts using one."]

