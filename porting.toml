findings = ["sheng's network area is an ath12k PCIe device with MHI and QRTR. clover has neither the same device nor the same transport.", "Round164 leaves the network inventory unchanged.", "Round167 leaves the network inventory unchanged.", "Round168 leaves the network inventory unchanged.", "Round169 leaves the network inventory unchanged.", "Round170 leaves the network inventory unchanged.", "Round171 leaves the network inventory unchanged.", "Round172 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round173 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round174 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round175 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round176 adds no network work; WCN3990 WiFi and Bluetooth stay without a driver. The board.toml edit this round is the menu title, nothing else.", "Round177 adds no network work; WCN3990 WiFi and Bluetooth stay without a driver. The board.toml edit this round is the menu title, nothing else.", "Round178 adds no network work; WCN3990 WiFi and Bluetooth stay without a driver. The board.toml edit this round is the menu title, nothing else.", "Round179 and Round180 add no network work either; WCN3990 WiFi and Bluetooth still have no driver and no transport. Round180's board.toml edit is a display archive swap, three display boot arguments and the menu title -- none of them names a bus, a firmware path or a network stack, and the area's own paths are still limited to board.toml.", "Round181 changes no network fact: WCN3990 WiFi and Bluetooth stay unclaimed, and no packet path is involved. Its share of the round is the board.toml archive line, boot argument and title.", "Round182 adds no network work; its board.toml edit is the CloverPower archive entry, the clover-power=3 argument and the menu title.", "Round183 names WCN3990's heap entries without touching the chip: the shared heap is read for the wlan_msa row (0x85700000 + 0x100000) and the wlan_guard row (0x85600000 + 0x100000) and each region is scanned 16 pages deep for the ELF magic word, which says whether any firmware was ever placed there by this boot. The subsystem register block at 0x18800000 + 0x800000 is deliberately not mapped, no icnss driver exists, and there is no MHI, QRTR or packet path of any kind, so a zero-filled wlan region is a question about the boot loader's firmware loads rather than a verdict on WCN3990.", "Round184 sends no packet, reads no WCN3990 or qcom,icnss register, and only stops the round183 image scan from running this boot by commenting clover-dsp=3 out -- so the wlan MSA question is unanswered, not answered. What round183 did establish stands as this area's input: the shared heap is alive, its $TOC partition table parses, and part(3) carries host pid 1, which is ADSP.", "Round185 runs no DSP probe and touches no ADSP path: the CloverDsp archive is still built and still parked, and the round183 fork line (adsp_edge / adsp_loaded) still has no reading because the panel filled before it, which is precisely why this round spends itself on the card instead of the panel.", "Round186 adds no networking code and no new writer on the card: both probe print sites go through the same kernel log tee (kind 22) that already carries every other reading, and each site caps itself at 24 lines so a spawn loop cannot fill the ring.", "Round192 adds no networking code: the only writer on the card is still the log tee, and this round actually removes one writer of a sort -- the boot no longer turns the eMMC write cache on, so every log record is on the medium when its write returns instead of waiting in a cache that a commit has to drain.", "Round193 leaves the network area untouched; the new boot argument is consumed only by proc_should_trigger_panic in the kernel.", "Round200 leaves the network area untouched: the r200 probe opens no socket, and its two new register dumps come from the user breakpoint path."]
