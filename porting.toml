findings = ["sheng's GPU area targets Adreno 740 with AdrenoMetal, AirNir and the SM8550 platform. The register layout, GMU firmware and submission format are different on Adreno 512.", "Round164 leaves the GPU inventory unchanged.", "Round167 leaves the GPU inventory unchanged.", "Round168 leaves the GPU inventory unchanged.", "Round169 leaves the GPU inventory unchanged.", "Round170 leaves the GPU inventory unchanged.", "Round171 leaves the GPU inventory unchanged.", "Round172 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round173 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round174 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round175 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round176 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round177 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round178 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round180 adds no GPU work; Adreno 512 stays without a driver, and the display archive it links is not one -- the driver reads the splash framebuffer the firmware handed over and reaches no GPU path. The swap-path arguments that would involve a GPU (sheng-fb-gpu, offline-legacy-transfer/retire) are compiled in but deliberately not passed.", "Round181 changes no GPU fact: the Adreno 512 still has no driver and no iOS display stack behind it. Its share of the round is board.toml only -- the CloverInput archive entry, the clover-input=3 argument and the r181 menu title.", "Round182 adds no GPU work and changes no GPU fact; its board.toml edit is the CloverPower archive entry, the clover-power=3 argument and the menu title.", "Round183 adds no GPU work; Adreno 512 still has no driver, no GMU firmware and no command submission, and the display archive it links in is the same round180 one, re-audited rather than rebuilt from new bindings. Its share of the round is board.toml only -- the CloverDsp archive entry, the clover-dsp=3 argument and the r183 menu title.", "Round184 moves neither display argument nor GPU surface: the three round180 legacy-display boot arguments stay, the phase 2 to 4 switches stay absent, and no Adreno or MDP5 code is reached. Its share of board.toml is the three instrument arguments that left kernel_args, the unattended deadline that returned, and the r184 menu title.", "Round185 changes no display byte: the three offline-legacy arguments remain the only display phase switch shipped, and the Legacy archive re-audited against this round's kernel still produces compiled_object_sha256 1b6c134e and late_object_sha256 a061787e with all 193 original bindings unmoved -- the closed-loop re-audit passing is the evidence that the archive linked into this kernel is still qualified against it.", "Round186 changes no display switch, no boot argument and no binding. The Legacy archive was rebuilt against this round kernel and the closed-loop audit passed with compiled_object_sha256 1b6c134e and late_object_sha256 a061787e -- byte-identical to round183/184/185 -- 193 original bindings unmoved and family_text_sha256 still the 2e044ee6 sheng pins, which is the evidence that the shipped payload carries exactly the audited bytes even though the link layout moved by 0x4000.", "Round192 changes no display switch, no boot argument and no binding. The Legacy archive is rebuilt against this round's kernel but its probe readings (r180) and the display boot args are byte-for-byte the same, and the cache decision happens after the display probe has already run.", "Round193 leaves the GPU area untouched; no payload layout, archive or boot argument used by the display path changes.", "Round200 leaves the display area untouched: the fifteen-archive link is unchanged, the legacy display archive is still the round180 build with the same two object hashes, and the r200 readings come from the user breakpoint path, not from the display probe."]
