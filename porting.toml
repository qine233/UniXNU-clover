next_action = ["r234 and r235 add no configuration key: both rounds move only the payload title (clover r234, then clover r235) and ship one kernel patch each under patches/xnu-clover/ (zzzzzzzzzzzzzzzzzzzz-clover-r234.patch for the port-set work, zzzzzzzzzzzzzzzzzzzzz-clover-r235.patch for the is_active(space) guard), with no boot argument, defconfig line, archive entry or identity field moving.", "r236 stays inside the same contract: the deadline record and the panic-sink marker are driver and kernel-patch work, and the backboardd stack capture rides the existing sampler, so kernel_args keeps clover-unattended=1800 and the three parked instruments stay parked.", "r237 also adds no configuration key: the ulock wait/wake accounting rides the existing probe ring and the stack walker, so kernel_args keeps clover-unattended=1800 and nothing else moves.", "r314 stays inside the same contract: no configuration key, no boot argument and no register written -- the round moves only comments, documentation and two checker functions, so the shipped difference from round313 is confined to DWARF line tables, measured rather than assumed: two builds of this tree give different amfi files (97639a36 vs 4b687d6b) and one normalized image (3fd3032b, PROVE PASS). Next driver work is judged by check-clover.py from both places (repository: drivers documented: 11; out/clover/tree: 12 archives, 22 objects ABI-checked, kernel read), and the open items are the ordered ones in notes/unixnu-doc-conformance.md section 5 -- they need the board, so boot 103 is read first.", "Round315 is a documentation round: no configuration key, no boot argument and no image. It narrows AGENTS.md to what the README may contain -- tables only, one row per driver in the new per-driver progress table (gap owned, wiring with board.toml line numbers, the eight documented clauses as check/cross/dash with a reason, latest on-board reading, next step, blocker), while every reading and retraction stays in notes/development-log.md; and it fixed the one README link that pointed at a notes file which never existed (notes/display-bringup.md)."]

