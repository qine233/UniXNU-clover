findings = ["sheng's input area uses ShengHidInput, ShengNovatekTouch and QcomGeniSpi for an SM8550 Novatek sensor. Those drivers do not match this board's controller.", "Round164 leaves the input inventory unchanged.", "Round167 leaves the input inventory unchanged.", "Round168 leaves the input inventory unchanged.", "Round169 leaves the input inventory unchanged.", "Round170 leaves the input inventory unchanged.", "Round171 leaves the input inventory unchanged.", "Round172 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round173 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round174 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round175 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round176 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. The board.toml edit this round is again the menu title, nothing else.", "Round177 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. The board.toml edit this round is again the menu title, nothing else.", "Round178 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. The board.toml edit this round is again the menu title, nothing else.", "Round180 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. Its board.toml edits are the display archive swap in [kernel].archives, three display boot-args and the menu title.", "Round181 is the first code on this bus. drivers/CloverInput transcribes QUP v2 I2C-3, SDM660 GCC (CBCR/RCG) and TLMM from three named sources and writes the disagreements out instead of smoothing them: the device's own clover.dts (i2c@c177000 with children focaltech@38 and gt9xx@5d, i2c_3_active, ts_int_defalut putting gpio67 at 16 mA, interrupts = 0x00 0x61 0x00 so SPI 97 = INTID 129), mainline 7.2.y (i2c-qup.c, gcc-sdm660.c with GCC_REG_OFFSET(reg) = 0x100000 + reg, pinctrl-sdm660.c, clk-rcg2.c, clk-branch.c, edt-ft5x06.c) and Xiaomi's 4.19 CAF (i2c-msm-v2.c, drivers/input/touchscreen/gt9xx_zql6019/gt9xx.c). The one real disagreement is the bit-clock field packing, resolved toward mainline because its arithmetic can be checked by hand while the vendor tree's own header, driver and clk code disagree with each other. Mode 3 asks each candidate the first read its own upstream driver asks -- 0x8040 for Goodix (2-byte big-endian register), register 0x00 and the 22-byte name at 0xBB for EDT/FocalTech -- because a NACK only means something against a real register. Transfers follow the upstream shape: SW_RESET at the head of each one, FIFO mode with zero MX counters and REPACK_EN, rx tags written into the output FIFO, and a completion test stricter than upstream because the done bit and the byte count have to agree or the transfer is reported as a timeout rather than as short data.", "Round182 repairs a defect in this area's own header: kQupPhys shipped as 0x00c17700 -- six digits, a hundredth of the real QUP base, a window with no QUP in it -- and is now 0x0c177000, decoded from this board's facts dump (i2c@c177000/reg 0070170c 00060000). No r181 reading was affected by the shape of the mistake, because that boot's report printed the declared geometry rather than reaching the bus, which is the whole reason round182's checker binds driver-header bases to device-tree nodes instead of trusting a review.", "Round183 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched and the QUP base repaired in round182 is not re-touched. Its board.toml edits are the fifteenth archive entry, the clover-dsp=3 argument and the menu title. The DT binding the checker now runs covers this driver's windows and the new DSP windows in the same table -- 30 addresses against 230 device-tree nodes -- so a one-digit base typo in any board driver header fails the round, not the photograph.", "Round184 parks CloverInput rather than removing it: the archive, the defconfig line, the PMGR schedule position and every register shape in the driver are untouched, and only clover-input=3 leaves the boot arguments, so the instrument is one comment away from running again. The question it was built to ask is answered by the v0.5.40 frame -- no address ACKed with done xfers=4 nack=4 timeout=0, a bus that was driven and two addresses that did not answer -- and the next answer there needs a rail, which is the power area's to give.", "Round185 adds no input code and runs no input probe: the CloverInput archive is still built, its boot argument is still parked in a board.toml comment, and the touch rails stay unproven. What this round changes is only where the driver's readings are written, so the I2C question this area owns is handed on unchanged.", "Round186 leaves the touch instrument parked: CloverInput is still built and still scheduled behind eMMC, clover-input stays commented out of board.toml, and the checker section this round adds pins the new spawn patch rather than any QUP or Goodix constant.", "Round192 leaves the touch instrument exactly as round183 parked it: CloverInput is still built and still scheduled behind eMMC, clover-input stays absent from kernel_args, and the four NACK/timer readings are unchanged. Nothing in this round touches QUP or the panel.", "Round193 leaves the touch instrument untouched; the watchdog policy is a kernel-side decision and does not change any QUP/I2C reading.", "Round200 leaves the touch instrument untouched: QUP v2 I2C-3, both candidate addresses and the three clover-input modes are exactly as round181 left them, and this round reads no I2C register."]
completion = ["Touches map to the display, contacts keep stable IDs, releases arrive, and buttons produce HID reports."]
limits = ["No input device is published to iOS: this round asks for an ACK and decodes an identity, it does not attach a driver, take the gpio67 interrupt (INTID 129 is named and never enabled) or parse a contact report.", "No power rail has been proven. Both device-tree touch nodes declare supplies and the driver issues no SPMI transaction, so a no-answer reading is the expected outcome of a live bus with a dead panel, not evidence that the controller is absent.", "The bit-clock field packing disagrees between mainline and Xiaomi's 4.19 tree; mainline is used because it is checkable by hand, but only a reading on hardware can say which one this silicon answers to."]
next_action = ["Cold-flash round182 and read both stamps in one frame: the r181 lines (declared geometry, whether bring-up reached fifo out=/in=/clk=, whether either address ACKed) and the r182 enable bytes for the two rails those nodes declare as supplies -- round181's no address ACKed; rails unproven is the line round182 exists to answer.", "An ACK opens the next gate in order -- Goodix config-sensor-id and config version read-back, then the config file the vendor sends, then the 0x8041 touch-point register with gpio67 as an interrupt. A NACK with both rails state=off is a software question the power area now owns; a NACK with a rail state=on sends the next round back to the bus, the reset timing and gpio67's drive strength.", "The r182 burst line also constrains this area: burst no, singles yes means every multi-byte touch read (the 22-byte EDT name, the Goodix config block) has to be issued one byte at a time until a frame proves otherwise."]

