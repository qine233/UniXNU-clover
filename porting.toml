[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["scripts/check-clover.py", "scripts/read-clover-log.py", "scripts/check-cs-blob-structure.py", "scripts/run-clover-unattended.sh", "scripts/decode-clover-address.py", "scripts/decode-clover-cache-offset.py", "scripts/dump-clover-facts.sh", "scripts/test-clover-power.py", "scripts/test-clover-dsp.py", "board.toml"]
inputs = ["Panel output after the boot menu, logfs slots in the eMMC, IMEM restart-reason cell at 0x146bf000+0x65c.", "Panic screen and entry probe as the only reporters."]
configuration = ["boot-progress=2 and debug-enabled in /chosen enable the checkpoints.", "clover-unattended=<seconds> arms the ArmCpu deadline and the panic-screen reset into fastboot; the shipped boot leaves it out.", "read-clover-log.py reads logfs on the host; decode-clover-address.py maps a kernel address to a symbol."]
procedure = ["Run the checker for the changed area and keep its command and output.", "Read the last completed checkpoint and the first failing operation from the panel; link the captured frame.", "If a probe is silent, state whether it was not reached or was reached and printed nothing."]
findings = ["Three evidence levels are different facts: source shape, host check and device frame.", "r151's silence came from reading cn_pnbuf before vn_open_auth initialized it; r153 moved the read after the call. A silent probe is never proof that the code did not run.", "The r154 syscall-536 probe printed nothing even though .01 opened, which places the wall before the mapping syscall.", "The 524 ms lock timeout can fire during a slow 16 KiB read; ml-timeout-lock-panic-scale=40 is part of the shipped diagnostic frame.", "Round160 taught this checker the userdata host gate: scripts/verify-userdata-window.py must exist and keep its pinned seed, three-window rule and last-window rule, so the destructive image cannot be flashed with a gate that stopped reading it.", "Round164 changes the menu-title assertion to r164 and teaches the checker the kernel-side skip patch, the two-signature AMFI patcher and the verifier's new assertions; no probe was added, and both halves are binary/source patches recorded in the storage and packaging areas.", "Round165 adds one evidence row that is also a repair: CloverSdhci r165: readcheck reports two batch reads and 32 single-block reads of the same 16 KiB with a word-diff count and the first differing index, and CloverSdhci r165: batch reads disabled for this boot marks the fallback. The checker asserts the drain, reset, prepare and check functions and the read loop's gReadBatchTrusted gate; verify-clover-payload.py asserts both strings in the image.", "Round166 keeps the A/B row as an observation, not a policy switch, and adds the exec-side signature dump clover r166: sig n= mo= off= size= w=.../.../.../... for the first eight blobs the loader reads. The checker asserts the untrusted default, the two r166 strings and the patch's dump; verify-clover-payload.py asserts the image carries both strings plus the dump format, and the host-side image clearance (OS window mounted, every file readable, three SuperBlob magics) is recorded as evidence rather than assumed.", "Round167 adds two write-side readings and one policy reading: CloverSdhci r167: write cache size= ctrl= off= rsp= st= says whether the eMMC write cache was on and is now off, CloverSdhci r167: write not ready lba= blocks= rsp= st= polls= names the first write CMD13 never confirmed, and CloverSdhci r167: readcheck ... trusted=... plus batch reads trusted for this boot or single-block reads for this boot records which read path the boot actually used. The checker asserts writeSettled, the stop-command result, the CACHE_CTRL constant, the scaled deadlines, the three-sample rule and the absence of the 160 us per-word gap in the write path; the verifier asserts the same four strings in the payload image.", "Round168 turns four wait bounds into readings: CloverSdhci r168: block guard waited ms fires once past 250 ms, CloverSdhci r168: write settle took ms polls= once a counted write took more than 500 ms to be confirmed, and read gave up lba= blocks= done= st= or write gave up lba= blocks= done= is printed once when the whole retry ladder fails. The r167 frame that motivated them had no panic and no give-up line: disk5 and disk1 both returned EIO (error 5) at fixed block numbers while a single checkpoint flush took 22.7 s, so the driver's own 2 s guard and 200 ms settle were timing out a card that was merely busy. The checker rejects the old two-second hand-over and the flat two-second request base and asserts the 30 s guard and 4 s settle; the verifier asserts the four new strings.", "Round169 turns a read failure into a stage and a stop: CloverSdhci r169: card busy ms fires once past 250 ms of waiting for the card before a read, CloverSdhci r169: read <stage> lba= blocks= done= st= names up to eight failures with the stage (guard, idle, deadline, gave up) that produced them, and the CMD12-before-reset path is asserted in source. The checker also rejects the four-second settle and the once-per-boot read give-up it replaces; the verifier asserts the card-busy and staged-read strings in the image.", "Round170 is the counter-lesson to r151's silence: a probe without a cap is its own blind spot. r169 read clean because the read fix worked, then said nothing else because one uncapped printf filled the panel with clover r153: check_np dyld_flags=0x0 -- a line with no pid, from a syscall every process calls several times, on a kernel that only names the exit reason of critical processes. The exec/exit pair added this round is the first reading that names the process, so a respawn loop and a merely slow boot stop sharing one photograph.", "Round171 is the frame where a driver reading named its own bug. r169's stage tags turned a wall of disk1: general error into eight lines that all say guard with st=00000000, which is a different failure from every read failure this project had chased: nothing on the wire went wrong, the caller simply never got the card. The paired reading -- tx_flush took 102001275 us and 120000602 us on disk5, against 22708252 us in the r168 frame -- shows the wait was the write-through policy r167 chose, and w=1024/1024 st=0x21 shows the batch criterion rejecting work it had itself delivered. Three of this round's four fixes therefore come from readings that already existed; the fourth (sizing the trust gate from the request) was found on the host, because raising kReadChunkBlocks would have silently disarmed the r167 gate that decides whether batch reads are trusted at all.", "Round172 makes the transport itself readable: dma up names the bounce's physical address, the capability word, the interrupt enable and the host-control byte the firmware left, dmacheck carries both paths' milliseconds and KB/s, and each DMA refusal prints one of at most eight CloverSdhci r172: dma path|slot|cmd|deadline|error|stop lba= blocks= st= err8= hctl= lines with the ADMA_ERROR byte, which is what distinguishes a table the host rejected from an address the bus rejected. A frame with dma up and no dmacheck is a boot whose multi-block command was never trusted; a frame with no dma up is a controller that refused the bounce.", "Round173 makes the write transport readable: wrcheck carries both runs' milliseconds and KB/s, control= and dma= say which of the two round trips completed, diff=/first= name the first mismatching word, w=/g= print the original bytes against the bytes read back, and st= prints both INT_STATUS words. A frame with no wrcheck line at all is a boot whose first multi-block write never happened; a frame with control=0 is the medium or the PIO path, not DMA.", "Round174 makes the frame survive the panel: read-clover-log.py decodes both windows, orders the kind-21 ring by the sequence stamp in header word 8 so a wrapped ring still reads oldest to newest, names a bad bytes-sum or a missing prefix instead of silently dropping the record, and carries a --selftest that round-trips the writer exact header layout -- which scripts/check-clover.py executes as a build gate. run-clover-unattended.sh now dd-s 128 sectors and prints the report window and the verdict ring as separate sections, so a missing verdict section means a boot that predates round174 rather than a decoder that stopped looking.", "Round175 gives the card the kernels own words, not just the drivers: read-clover-log.py attributes every kind-21 record to driver or kernel from the CloverSdhci line prefix, --tee and --driver select one producer each, the selftest now writes a ring that mixes both kinds and asserts the split, and check-clover.py executes that selftest as a build gate. The unattended summary reports how many ring entries came from the kernel log and warns when the ring armed but brought no kernel lines.", "Round176 makes the two producers readable as two facts rather than one merged stream: read-clover-log.py decodes kind 21 as the driver ring and kind 22 as the kernel ring, refuses a record whose kind does not match the ring it was read from (a driver line surfacing under --tee is reported, not printed as kernel text), keeps --driver as a filter over whichever ring is open, and its --selftest now builds both rings, asserts each rings single producer, asserts the kernel ring contains no driver line, asserts the adjacency arithmetic 64 + 2*64 = 192 and 192 + 2*512 = 1216, and still prints broken records with the mismatch named. run-clover-unattended.sh dumps 1216 sectors, decodes both windows under their own headings, counts each, and warns twice: armed tee with zero kernel lines, and any driver line inside the kernel ring -- which is the tee echoing itself and the one reading that invalidates the whole window.", "Round177 adds two host gates that check-clover.py executes rather than greps: normalize-kernel-macho.py --selftest replays 17 rules (convergence of two synthetic builds, idempotence, preserved length, the counted stamps, a non-object stab left alone, a version-3 UUID carrying the RFC 4122 variant, the KCID as the same digests tail, nothing outside the derived fields moving, and four refusals -- non-Mach-O, missing LC_UUID, no object stamps, truncated file), and check-cs-blob-structure.py --selftest replays 14 cs_validate_csblob rules before the same script is run against build/clover-root/launchd.macho and must accept it. The checker also asserts the normalizer sits between the patcher and the payload step in AGENTS.md. A round that forgets the step now fails a gate instead of quietly shipping a kernel no one can reproduce.", "Round178 adds one reading to the driver ring: CloverSdhci r178: read|write handoff lba= blocks= done= cuts= waits= worst= ms, at most four lines per boot and reported by the holder that cut, while round168 block guard waited stays as the once-per-boot longest wait. cuts= above zero is the proof the guard changed hands inside one transfer; worst= says what a waiter paid for it. Both go through sdhciSay, so neither depends on the panel scrolling past them.", "Round179 adds a diagnostic that never touches the device: scripts/audit-clover-mobile-graphics-legacy.py answers, from out/clover/kernel/kernel.macho alone, whether the display class the next round has to impersonate is the original one. The gate checks the audit's pinned constants and forbids it from claiming a runtime observation, because the four identity numbers it prints are inferred from the registration site, and the file where the meta class record lives is zero-filled until load.", "Round180 adds a third speaker to the kernel ring without adding a channel: the display probe's lines go through IOLog with the clover r180: stamp, which round176's allowlist already keeps, so read-clover-log.py --tee yields the phase-1 reading after one cold flash and one dd. Its verifier gained check_legacy_display, because from this round the claim 'the display stack is code' can only be checked in the payload -- six needles, three boot-arg gates, the r180 stamp and two probe format strings. The same round had to widen the round164 fingerprint from exact bytes to masked regexes: one byte in it was an ADRP page delta, and a kernel that grew by one page made a present patch read as absent.", "Round181 reports through the channel round176 built, not a new one: the driver runs last in sheng_pmgr_run() -- after clover_emmc_run() and ending in clover_emmc_flush_cache() -- so its 37 clover r181: lines reach the card-backed kernel ring (kind 22) before the boot continues, and the tee allowlist needed no change because the shared prefix clover r was already whitelisted (the per-driver round stamps may differ; the display probe still says clover r180). The readings are cut so a silence is never ambiguous: xfer ... NACK means somebody was asked and answered, xfer ... timeout means the byte count and the done bit disagreed, bring-up stopped at verdict= names the step that failed, and no address ACKed; rails unproven, sda= scl= status= op= says the bus was tried and which four words to read next. The driver never panics -- once the readings are the product, stopping the boot is losing them.", "Round182 makes two silences impossible to fake: check-clover.py binds 26 driver-header physical constants against 230 device-tree nodes -- which is how the six-digit kQupPhys got caught on the host instead of on the panel -- and scripts/test-clover-power.py, a pthread model of the SPMI arbiter, runs as a gate that check-clover.py executes, so a power report built on a window nobody declared cannot ship.", "Round183 teaches the checker three things at once. A wiring contract: the CloverDsp archive, its CONFIG_XNU_EXTRA_LD_ARCHIVES line, the clover-dsp argument (anything but 1, 2 or 3 is refused) and CONFIG_XNU_SHENG_PMGR have to name each other, and the PMGR tail order unattended-then-emmc-then-input-then-power-then-dsp is checked by position rather than by good intentions. A shape contract for a read-only instrument: the bounded walks stay bounded -- heap size against the TOC, entry.data + entry.size against smem.size, a non-power-of-two cacheline refused, the SMP2P magic/version/total_entries/pid identity checks, the end-marker comparison return at == end ? DS_OK : DS_E_CANARY, DS_E_RANGE -- and four forbidden symbols (windowWrite, ds_write, kSmp2pSet, IOMemoryDescriptor::withAddress) make the absence of a write path an assertion instead of a promise; parse_defines() also learned static const so the driver's own constants can be pinned by value, including the four magics in word form. And a second host model as a gate: scripts/test-clover-dsp.py compiles drivers/CloverDsp/tests/clover_dsp_host.cpp over a synthetic 128 KiB heap, runs 189 assertions and must exit zero, so a heap decoder that silently accepts a corrupt table cannot ship. The reader side did not move: the report travels on the kind-22 ring round176 built, through the tee's clover r allowlist, and read-clover-log.py --tee still needs one cold flash and one dd.", "Round184 makes the card the reading channel of record, for two reasons the round183 frame supplied: the panel is a printer that stops drawing when full, and a boot with no deadline never returns to fastboot for a host to read. So scripts/check-clover.py now requires clover-unattended= in board.toml's kernel_args, requires it to be a bare number and to sit between 60 and 1800 seconds -- the ceiling is what scripts/run-clover-unattended.sh's own WAIT can still catch -- and still refuses armcpu-clock-panic=, which measured the scheduler rather than the boot. The same checker pins the panic sink's exported signature and requires panicDrainRings () inside its body, because a drain hung outside the sink is a drain that never runs. read-clover-log.py and the 1216-sector dd are unchanged: the drain writes into the kind-21 and kind-22 rings the reader already walks.", "Round184's first flash attempt read nothing and the reason was on this side of the cable: --flash-cache flashed the payload and then went straight to recovery, so the image just written was never booted and the 1216 sectors on the card still belonged to the *previous* boot. The script now has --boot-after-flash -- reboot normally, let the firmware enter XNU, and wait for the board to come back to fastboot by itself, exiting 6 if it never does -- and it warns when a fresh flash is followed by an immediate read. The other half of the observation is recorded rather than fixed: after that run the tablet was absent from USB entirely (empty `fastboot devices` and `adb devices`, and scripts/check-clover.py's own host list shows only hubs, a microphone, a headphone adapter and a receiver), the three archived runs under ~/clover-out never got past `waiting for fastboot`, and no clover-logfs.bin has ever been produced here. So the card's write side is proven every frame and its read side is not proven yet on this host, which is why the drain line the round added prints what it wrote and what it dropped instead of assuming anyone will read it back.", "The retry of that run settled which half of the channel is actually missing, and it was not the half the previous paragraph blamed. TWRP was up the whole time: the board answered as adb state `recovery` (`81ffcaaa`, `ro.product.device=clover`, `ro.twrp.version=3.7.1_12-1-clover-th3fron3`) while `adb_serial()` matched only state `device`, so the 180 s wait was a false negative produced by this host, not a boot that never reached recovery. Two more host defects fell out of the same run: TWRP's adbd puts dd's own statistics on the same stream as the block data, so `adb exec-out dd` came back 622677 bytes instead of 622592 and no length check could be trusted until dd's stderr was redirected on the device side; and the file-level gate that required `UXNULOG1` at offset 0 asserted something a logfs window does not promise -- the report window appends, so slot 0 is only live on the boots whose cursor happened to land there. With those three fixed the read path works: one dd of /dev/block/mmcblk0p39 issued from this host returns the whole window and no stream noise. The script itself has not been re-run end-to-end since the fix -- the board left the USB bus minutes later and is not reachable again until it is put back into recovery by hand -- so what is proven here is the exact command the script now runs, not a clean exit of the script. What it returns is the finding. All 16384 sectors of that partition -- sysfs start 12320768, exactly kLogfsFirstLba -- are byte-identical to ~/clover-out/round127-logfs.img, with zero differing sectors, zero `UXNU` headers, zero record bodies and zero `CloverSdhci` prefixes anywhere in 8 MiB. Since the flash of 2026-10-26, no byte from CloverSdhci has reached this partition, in any boot, including the round174 verdict ring, the round176 kernel ring and the round184 panic drain. The cause is in this driver's own arming order: gVerdictFirst, gVerdictReady, gTeeReady and gPanicLogReady are set only on the branch that runs after the boot has *read an existing record* out of the report window (drivers/CloverSdhci/CloverSdhci.cpp:6110-6118, `logNewestFound20 == 0` takes the other way out), so a partition that stopped holding a record -- which is exactly what flashing an APFS container over logfs sector 0 did -- can never arm, never write, and so never regain the record its own arming needs. The channel is self-sealing, and no amount of reading can tell that from a card that simply had nothing to say, which is why the drain prints wrote=/dropped= instead of being believed. One alternative theory was tested and rejected on the same board: 4 KiB block addressing, which would have displaced every write by 8x, is not what happened -- the recovery-side queue reports logical 512, physical 512 and hw_sector_size 512, and `blockdev --getbsz` printing 4096 is Linux's buffer-cache block size, not the card's addressing unit. The round184 deadline itself did fire in the sense that the board stopped being reachable and restarted by itself a few minutes after the payload came up from cache, and it did not come back to fastboot: no `fastboot devices` row appeared while this host watched, and a board that has booted our kernel is invisible on USB anyway because the USB device mode in schedule item 5 does not exist -- so the IMEM-to-fastboot hand-off is still unproven on this unit rather than disproven.", "Round185 is the round that log channel stops being circular: the arming condition round174 recorded as the first thing to change is changed, and both host readers move with it. scripts/read-clover-log.py now defaults --first-lba to 13320216 and says so in its help text (a pre-round185 card has to be read with 12320768), its dump default is clover-log-window.bin, and --selftest is rebased on the new window; scripts/run-clover-unattended.sh tries bootdevice/by-name/logdump, then by-name/logdump, then mmcblk0p56 before falling back to logfs, still one dd of 1216 sectors with a 622592-byte length gate. What remained unproven was the driver half, and the flash this round shipped answered it: kind-21 slot 0 (lba 13320280, seq 0) carries the armed line verbatim -- first=13320216 sectors=131072 report=13320216 driver=13320280 kernel=13320408 -- so the round174 self-lock is broken and the card holds this project's records for the first time: 17 verdict-ring entries (r159 link, r167 readcheck diff=0/0 trusted=1, r172 dmacheck got=1024 kbs=2000/0 trusted=1, r173 wrcheck control=1 dma=1 diff=0/0 trusted=1, the r174/r175/r176 arming lines, two tee census rows, first DMA read and write) and 352 consecutive kernel-ring entries covering 8.66 s to 34.28 s. Two honest blind spots came with the same frame: the report window holds no kind-20 record -- the photographed userspace panic (boot task failure: required boot task executable not found) never reached the card, because clover_emmc_panic_append is the kernel panic exit and a boot-task failure exits by a different path (or after the capture window) -- and the kernel ring ends at 34.28 s mid-exec of pid=12 usermanagerd, before the photographed panic. The frame also carries the desktop-blocking readings: all three volumes mount, exec pid=1 comm=launchd is clean, the dyld shared cache maps with map2 <- err=0, the early boot tasks fsck, mount, seputil, mobile_obliterator, apfs_boot_util, MSUEarlyBootTask and cc_fips_test all exit rv=0, keybagd alone exits rv=0x4700, and one tee race artifact is visible (a msgbuf line copied while the kernel was still writing it interleaves (1) syscall-unix 55 into the keybagd exit row, and (apply-protobox) into its exec row), which says the tee's line boundary is not atomic under concurrency but does not change either reading.", "Round186 adds the reading the panel could not give: launchd compares a required boot task spawn result with 2 and panics with required boot task executable not found, and neither the console nor the card said which path it looked up or how far that lookup got. zzzz-clover-spawn-why.patch re-resolves the failing path one component at a time for pid 1 only, at most 24 times per site, printing err/n/path/stop/good/fs/on/mflags/retry, and the loader site prints its own line so a missing dyld is never read as a missing boot task; one retry of the whole path separates a sticky failure from a one-off. It prints only -- the errno returned to userland is untouched -- so check-clover.py asserts the patch deletes no source line, pins the nine shapes the probe depends on (including vnode_mount and the two format strings) and refuses the retired r185/r170 strings, while verify-clover-payload.py reads both encoded strings out of the shipped image.", "Round186 readings: the probe fired exactly once and on the benign path -- spawn-why err=2 n=1 path=/usr/appleinternal/sbin/launchd.development stop=/usr/appleinternal good=/usr fs=apfs on=/ mflags=14809021 retry=2 -- so the required-boot-task ENOENT the previous frame photographed did not happen this boot, and what launchd is waiting for is usermanagerd (pid 12: exec at 37.193360, open of the dyld shared cache at 37.233612, then no line for the remaining 34 s of the capture), not a boot task it could not find; keybagd was the only non-zero exit (rv=0x4700 = EX_OSERR 71) while fsck, mount, seputil, mobile_obliterator, apfs_boot_util, MSUEarlyBootTask and cc_fips_test all exited 0. That moves the round187 question from a missing file to the syscall or mach trap usermanagerd entered and never returned from.", "Round187 splits that question in two on purpose. A mach trap never reaches BSD code (handle_svc sends trap_no < 0 straight to mach_syscall), so a probe only in unix_syscall would report silence for half the surface and silence would be misread as no activity; the patch therefore calls clover_sys_why_mach() from sleh.c and keeps the body in systemcalls.c where p_comm is reachable. The filter is by comm rather than pid (pids drift per boot, and fsck/mount/seputil would flood a 512-line ring), and each line has a budget with a periodic heartbeat (512 entries, 128 failures, every 128th thereafter) so exhaustion of the probe is distinguishable from a hang. A unix-fail line is the other half of the judgement: a call that returned an errno and a call that never returned look identical from user space, and only that line separates them.", "Round187 readings: usermanagerd last entered write_nocancel on fd 1 (code 397) at 63.066398 with nothing after it and only a mach_msg2_trap before it, while keybagd entered reboot(2) at 48.875134, was denied with EPERM by Protobox's syscall filter and left through exit(71) -- its hard-coded fatal path, not a crash. The fail budget saturated at n=128 at 59.792130, so the last seconds of failures are missing by design.", "Round188 keeps the r187 prints untouched and adds three readings around them in zzzzz-clover-syswhy2.patch: unix-write prints fd, length and the first 64 bytes of the buffer, unix-path resolves the path behind every failing open/stat/access (openat reads x[1]), and unix-wrote prints the write return value. It is still log-only -- no return value and no errno changes -- and the checker now scopes its no-old-round-strings rule to added lines, because the r187 prints are the patch's context.", "Round189 keeps every r187 and r188 print and fixes three readings in zzzzz-clover-syswhy3.patch: open_dprotected_np takes its path from x[0] (r188 read x[1], its flags word 0x701, so all twelve err=2 path lines came out empty), every successful open now prints the descriptor it returned and its path, and sleh.c prints the mach trap's kern_return_t after mach_syscall() returns. Entry and fail budgets rise to 4096/256 with a 64-entry heartbeat because the r188 entry budget saturated at 67.190819 and left the last thirteen seconds unread; the tee per-pass push budget doubles to 16 because r188 throttled 694 of 1598 lines. Two build facts are now recorded rather than rediscovered: the LATE reverse list must take syswhy3 and syswhy2 together, since r189 edits lines r187 added and r187 stops being reversible the moment it is applied; and the kernel build compiles out/clover/tree/.cache/xnu-work, not ~/UniXNU/.cache/xnu-work, which is a separate clone of the same revision. Payload images are not byte-reproducible -- two builds of one kernel differ by the 64 random bytes of ADT /chosen/random-seed -- while the in-volume kernel is.", "Round190 answers the one call the r189 frame ends on. That frame's last line is fcntl(3, 0x55 = F_BARRIERFSYNC) at [112.438859], followed by 187 s of kernel-ring silence to the 300 s reset with no panic and no watchdog line; the 1020-byte session table had already been written (ret=1020 err=0) and fsync and renameatx_np had both returned, so the wall is the barrier or whatever follows it. A kernel-side printf alone cannot settle that: the tee only pumps msgbuf in guarded block-request tails, so a barrier that hangs leaves its own exit line in msgbuf waiting for a pump that never comes. Hence a two-sided bracket. zzzzz-clover-syswhy4.patch prints the exit of the five calls that can wait on storage (fcntl, fcntl_nocancel, fsync, fsync_nocancel, renameatx_np) with a 128-entry budget and the same 64-entry heartbeat, still log-only. The driver writes its own start to the card before the first CMD6: clover_emmc_flush_cache() calls sdhciSay with CloverSdhci r190: flush-in once the block guard is held and before switchExtCsd (kExtCsdCacheCtrl, 0), drains msgbuf and the verdict ring right there, and prints flush-out after the commit with both response/status words and the elapsed milliseconds; the guard wait it reports comes from the new gGuardLastWaitMs. CloverBlock::commitCache() adds sync-in, sync-out ok=0|1 and a one-shot sync pending=0, so a barrier with nothing to commit is a third state rather than an indistinguishable silence. The reading rule is what the frame is for: flush-in without flush-out names our own CMD6 or guard path, no flush-in at all puts the wall above the block layer, and a flush-out says the card took the commit. The build taught one lesson the hard way: a device patch must be copied into out/clover/tree/patches/xnu/ or the kernel is built without it and nothing says so -- the first r190 kernel shipped without the patch and only verify-clover-payload.py's barrier bracket assertion (unix-out ABSENT) caught it.", "Round191 turns the r190 frame's entry-without-exit into a five-stage reading and moves the wait off the card. That frame ends on CloverSdhci r190: flush-in flushes=0 on=1 size=65536 wait=0 ms followed by no flush-out, with the kernel ring left at CloverBlock r190: sync-in pending=144: the barrier did reach commitCache(), the guard wait was zero, and this boot's first commit of 144 dirty blocks never returned. The old shape explains the 187 s: after each switchExtCsd the driver called waitCardReady(), which polls CMD13 up to 100 times and each poll spins up to kCommandSpinLimit (1 << 22) reads of SDHCI_INT_STATUS, so a card busy writing its cache to media was asked a question instead of being watched. flushSettle() replaces that with the host's own SDHCI_PRESENT_STATE DATA_INHIBIT bit, bounded by EXT_CSD byte 246 (CACHE_FLUSH_TIMEOUT, 10 ms units) clamped to [1000, 180000] ms, and only then asks for status with a dozen CMD13s. Each of the five records is written and drained before its own step runs, so the next frame's last line is the step that stopped: flush-go (cf/bound/ps/inh), flush-c1, flush-w1 (ready/to/busy/polls/rsp/st/smp/mk/ps/ms), flush-c2, flush-w2. switchExtCsd gained a spins out-parameter so a command that never left (st=0 spins=<limit>) reads differently from a timeout or a CRC. Nothing outside the commit path changed; boot.img is byte-identical to round183-190 and the cold flash writes the cache partition only.", "Round192 reads that frame and stops committing rather than waiting harder. The r191 frame's only stage record is flush-go cf=0 bound=30000 ps=01f800f0 inh=0: the card declares no CACHE_FLUSH_TIMEOUT (cf=0, so the bound defaulted to 30 s), the host was not busy before the first CMD6 and DATA_INHIBIT was clear, so the card entered the commit command healthy and simply never answered it. The second and more binding finding is structural: every r191 stage record, flush-in/flush-out and the r184 panic drain all leave through flushVerdictRing() -> writePioBlock() to the same card, so a card holding DAT0 for the commit refuses the records that describe it -- that commit was unobservable as well as unbounded, and one more record inside it would only add a line that cannot land. The bring-up therefore no longer issues switchExtCsd (kExtCsdCacheCtrl, 1): cacheOn is now what the card itself reports (cacheSize != 0 && cacheCtrlBefore != 0), which on this card is ctrl=0/on=0, so the write path falls back to the write-through shape r159-r170 ran, where every chunk already waits for READY_FOR_DATA in TRAN and the 102 s/122 s measured in r170 was already being paid. F_BARRIERFSYNC now returns immediately, so a boot task that syncs stops being parked behind it. The r171 line still prints (it is the reading that will say ctrl=0 on=0) and the whole r191 flush body stays live for a card that ships with its cache on. The early return is no longer silent: CloverSdhci r192: commit skipped size=%u on=%u (once) separates a commit that had nothing to do from a flush path that went missing. check-clover.py asserts the enable block is gone, pins the new cacheOn expression and the skipped line, and requires that line to precede acquireBlockGuard so it cannot wait on the writer it exists to avoid; verify-clover-payload.py's new cache ownership reading asserts the r192, r171 and r191 strings are all in the shipped image.", "Round193 separates the two facts a watchdog death produces: the r170 line says the process died with ns=2/code=0x5, and the r193 line says which crash-behavior bits, fatal reason and deadline made proc_handle_critical_exit panic; a frame with the first and no second is a missing probe, not a missing crash.", "Round194 reads the r193 frame as two limits rather than a fault. The report window holds three records: a watchdogd exit and two 300.00 s deadline panics; the verdict ring is clean end to end (29 records, the last being r192 commit skipped size=131072 on=0); and the kernel ring's 2048 writes end at 312.89 s with launchd still reaping and exec'ing. The round answers the three questions that frame left open: whether the boot reaches the desktop if the deadline does not cut it (900 s), whether a deadline panic's own reset lands in fastboot (fb=, now drawn before the sink so the card carries it), and what the kernel said after its first hundred seconds (the probe cap). The host half is fixed in the same round: on this XBL fastboot reboot recovery is performed as an ordinary reboot and oem reboot-recovery is an unknown command, so scripts/run-clover-unattended.sh writes a 2048-byte Android BCB with command=boot-recovery to misc and reboots, which landed in TWRP in 14 s twice; a board that comes back to fastboot instead exits 4 and is reported, never retried.", "Round195 reads round194's frame as two failed readings rather than a failed round. The deadline itself held: slot 3 carries clover r148: unattended deadline 900 s with ticks=143722, and the host saw the board return to fastboot on its own. What the card did not carry was fb=, because PANIC_LOG_BYTES is 480 and that row is drawn after every other reading, so the reset's destination was still a panel-only fact; the record now gets it as its second line. The kernel ring covered 802.00-911.94 s with r155 292, r153 100 and r170-open 99, and the producers are fairplayd.A2's crash-respawn loop re-reading the dyld cache; 512 slots at about 4.6 lines per second is 110 s, so SpringBoard at 213.70 s and Early boot complete at 233.16 s were evicted. Read the next frame by fb= first, then by the ring's span and the first class its budget stopped.", "Round197 read the 238 s reset as one that never reached XNU's panic path: the panic window's newest record was still r196's 900 s deadline, misc read back zero because TWRP clears the BCB on entry, and APFS had run out of space at 214.668048 s on a 32 MiB Data seed. A BCB written only from the panic sink cannot cover a reset from the PMIC, the firmware or a user-space fault.", "Round198 writes the BCB at the end of the GPT walk in coldBringUp, where the log rings open and no block driver has published yet, and leaves the panic sink's call idempotent; the frame's verdict ring carries CloverSdhci r198: recovery BCB pre-armed rc=100 written=1 and the board reached TWRP on its own after the 900 s deadline. The Data seed is now 1 GiB and the frame has no ENOSPC line at all; the new wall is SpringBoard, which exits rv=0x5 ns=2 code=0x5 0.3-0.4 s after every exec (24 times in this frame) while watchdogd exits the same way.", "Round200 turns the visible trap address into a slide-independent identity. The same sleh.c path now prints a second line carrying the vm_map entry around the trap pc, the file offset (VME_OFFSET plus pc minus start), the eight instructions that lead into the brk and x0-x3/x8/x16/x17. The cold frame read 14 r200 lines paired one-for-one with the r199 lines: watchdogd foff 0xab0c across four different map bases with identical code, liveactivitiesd 0x5c6924f8, SpringBoard 0x3a17b2ec; all three stop on inter-function brk padding, and head= reads zero for the two shared-cache mappings, which is why it is only evidence on a standalone executable. The 900 s deadline, the fb=1 preface on every panic record, the self-written BCB that lands the board in TWRP and the 622592-byte window decode all still hold.", "Round201 reads the trap through the same build's dyld shared cache: foff is the shared-region offset (pc - 0x180000000), not a file offset, and cross-boot slide changes make it boot-specific. The eight code words self-certify the place in dyld_shared_cache_arm64.09, cache vmaddr 0x19f3df2ec, image FrontBoardServices, function 0x19f3dee70+0x47c; the fatal record's string is “failed to find the main CADisplay”, so SpringBoard's SIGTRAP is the absent display stack, not a wild jump. scripts/decode-clover-cache-offset.py resolves LC_FUNCTION_STARTS and the export trie in the .dyldlinkedit subcache and exits non-zero when the words do not match.", "Round212 makes the frame attributable before it makes it readable. A kind-24 counter at sector 1216 is read and incremented once per boot and copied into header word 9, --boot checks it and every printed record shows boot=; the panic window rotates by header word 8 instead of refusing when full; the drain says enter (panic_first, verdict, tee, append_rc, probe_seen) and exit (wrote, dropped, tee_passes, probe, probe_drop, probe_pend) even when the guard is unavailable; panicTailRead drops its gTeeReady gate, validates msgbuf itself and always says its status row over the whole buffer; and clover_emmc_probe_say() holds the kernel kill lines in a 32-slot x 256-byte RAM ring that the drain forwards as kind 25. This frame delivered the attribution but not the probe test: boot=1 everywhere it matters, a boot-0 r184 line that is provably a leftover, zero kind-25 rows because SpringBoard's last exec is [152.198182] and the backboardd kill (457 s in round210) never came -- the boot froze at 194.18 s first.", "Round216's boot-5 frame is the first one where the kill point lands without a self-inflicted panic: the report window carries only unattended-deadline records, the drain says enter boot=5 append_rc=113 probe_seen=8 and wrote=13 dropped=0 unseen=0, and all five sbthr rows reach the card. Every thread reads kin=2 kstk=0000000000000000 (states 1/65/65/1/1, wait channels non-zero except thread 2, mt=0 for all), so all kernel stacks were handed off and sbthk has no rows at all -- that half of round211 is structurally unavailable for continuation-parked threads, because machine_stack_handoff leaves kernel_stack at 0 until the thread is dispatched again. The rows also did not print at the kill: killsig/upc/skst are stamped 420.773441-420.773512 and the five sbthr rows at 460.217851-460.217993, 39.44 s later, with exit pid=27 at 460.301116, where round207's boot-3 frame had 197 ms between kill and exit. The only blocking point between skst and the first sbthr is task_lock(task) in clover_task_threads, and other kernel lines keep landing throughout that interval (430.4 s ubrk, 439.7 s r188 rows), so the console is not the delay: the target task's lock was held for the whole 39 s. The five saved user states are not SpringBoard's code either -- at slide 0 (this boot's r200 row reads map=1 start=0x180000000 end=0x20c000000) every pc/lr falls inside the extracted cache's read-only data mapping 0x1e638c000+0x531c000, so the walk read a task already in teardown. Round217 therefore stops blocking on task_lock in the signal path and samples before the kill.", "Round218's boot-7 frame names the killer and the wait. killsig lands at [536.991377] with upc=0x1d5dad100, which disassembles to ___kill+0x8, and ulr=0x100ce0144; with backboardd's slide of 0xC6E000 that LR is image offset 0x72144, the return from the second bl _kill inside 0x100072050 -- a loop that walks the captured system-shell set, logs Killing %{public}@. for each element and calls kill(pid,9). The function carries the BKSystemShellSentinel strings and is reached from a libdispatch block (all four killustk frames are libdispatch), so the killer is backboardd's system-shell watchdog, not a crash handler. exit pid=27 arrives at [560.121938], 23.1 s after the signal, where round217 saw 18 ms; the gap is unexplained but no longer blocks attribution. On the SpringBoard side the main thread (tid 0x104) sits in mach_msg2 (x16=-47) with fp chain f2/f3 at __BKSDisplayGetMainScreenInfo+0xa4 and _BKSDisplayServicesStart+0x78 through t=417..444, switches to dispatch-mach receive frames (cache 0x1d2f55f34/0x1d2f562dc) from t=481, and reaches mach_port_mod_refs (x16=-19) at t=536, 0.57 s before the kill; it