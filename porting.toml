and a 204-byte call at 413 s with remote 0x807, reply 0x903 (same id class 0x400000cf) -- and ipc_object_translate's owner walk puts both remote ports on launchd (pid 1); the reply port 0x903 belongs to SpringBoard itself, and a 369 s sample still shows one call to runningboardd (pid 26). From 424 s the same thread is in a 16,384-byte receive-only call on 0x903 and does not move until the kill at [449.509949], exit at [449.514325] (4.4 ms later, against 23.1 s in round218); a second thread (0x30a) waits on a 20-byte receive on 0x1003. The receive buffer still carries remote name 0x5a03 whose owner no longer resolves, because the send-once right was consumed -- so the reply mechanism itself works. Client list stays pid 58/56/164 and backboardd presents three frames, so no SpringBoard thread ever creates an IOMobileFramebufferUserClient. The blocker is therefore a synchronous XPC to launchd that never returns, not a crash and not the display handshake; Round221's boot-10 frame names the blocked trap and reads the request body. The main thread (tid 0x102) shows the same pair at 390, 413 and 470 s: pc=0x1d1454b58, lr=0x1d1458224, with code words d65f03c0.928005f0.d4001001... -- a mach trap stub (ret / mov x16,#0x2f / svc #0x80), not a brk, so the foff/code path of decode-clover-cache-offset.py does not apply; a byte search over the 54 cache files finds the stub only in dyld_shared_cache_arm64.23 at unslid vm 0x1cb780b58, which fixes this boot's slide at 0x5CD4000. With that correction the PC is libsystem_kernel.dylib _mach_msg2_trap (+0x8, the ret after svc) and the LR is _mach_msg2_internal (+0x4c), so round220's libxpc attribution was wrong: the immediate caller is inside libsystem_kernel and the real caller is further up the untaken user stack. The 204-byte send at 413 s (remote 0x807 on launchd, reply 0x903) carries @CPX@|handle|instance, where @CPX@ is the XPC serialization marker; the 24-byte calls at 390/404 s and the 40-byte send by tid 0x466 at 470 s have no four-byte printable run. Every other sampled SpringBoard thread sits at ___workq_kernreturn+0x8, so only the main thread and one secondary thread are blocked in mach_msg2. The kill lands at [479.004840], exit at [479.093986] with rv=0x9; visible client rows are pid 56 and pid 168, and a sixth client appears only at 907 s (pid 87), so SpringBoard never opens one. poff is slide-inclusive (VME_OFFSET + pc - vme_start): feeding the runtime address to --addr resolves through the .25 mapping and misnames the image, so the slide has to be recovered from the code words first.", "Round222 named the blocked call: the SpringBoard main thread (tid 0x104) was sampled four times between 403 and 436 s with an identical six-frame user chain, _mach_msg_overwrite+0x1ec -> _mach_msg+0x14 -> libdispatch 0x18f56dd28+0x20c -> libdispatch 0x18f56e2a4+0x38 -> libxpc _xpc_connection_send_message_with_reply_sync+0x100 -> Foundation thunk 0x186e80d04+0xc, with slide 0xB5C0000 recovered from that boot's own code words; the thunk is a single tail call (bl 0x187548f50) into libxpc's synchronous send, so x30 returns to the thunk itself. At 395.171 s the thread sent a 24-byte empty-body synchronous request to launchd port 0x3f07 (msgh_id 0x5b9173, reply port 0xa03, 16 KiB), and from 403 s every sample is a pure receive (op=40700420e, b=0, sz=0, rn=a03, rs=4000) until backboardd killed it with SIGKILL at 446.42 s (spid 58) and it exited at 456.1 s with rv=0x9. No reply ever arrived. launchd did not respawn SpringBoard between 450 s and 912.9 s, while bluetoothd and fairplayd.A2 kept spawning and exiting in pairs every ~5 s. The neighbouring threads were notify_post (0x168), an XPC send (0x40f), a 36-byte logd send carrying h=13.0.1b03.0.0.2d52 (0x411) and __kernelrpc_mach_port_is_connection_for_service+0x80 (0x41c). Round223 therefore reads the kernel-side state of both ports (ip_messages, ip_msgcount, ip_waitq, ip_mscount, ip_srights, ip_receivers, ip_kobject) and dumps the first queued message header, to separate a reply that arrived but never woke the waiter from a reply launchd never sent.", "Round223's boot-12 frame answers r222's fork with the ports' own state and says launchd never replied. At 443.990512 s the main thread (tid 0x104) is still in the 24-byte synchronous send (op=400304003, rem=0x2e03 owned by launchd, loc=0x1d03, voucher 0xa03, id=0x5b9173), and both ports were read in the same millisecond: the launchd port holds two messages (ip_msgcount=2, qlimit=6, imq_seqno=0) with that request as the first queued kmsg (msgh_id 0x5b9173), while reply port 0x1d03 has ip_msgcount=0 and imq_seqno=20, so no reply is waiting and r222's a03 was the voucher, not the reply port. A second 204-byte request (id 0x400000cf, rem=0x807) went out at 464.500653 s and was also left queued (msgcount=1, seqno=1386). From 472.88 s the thread blocks in a pure receive on 0x1d03 with a 16 KiB buffer, while port 0x7a03 reads ip_msgcount=1, ip_receiver_name=0, ip_receivers=0, ip_kobject=0 and only 2 send rights: a 308-byte message stays queued on a port with no receiver. At 537.342943 s the request names port 0x6003, owned by lsd (ro=117:lsd) from 547 s; there the queue does drain (seqno 0 to 1) but the reply port still receives nothing through the last sample at 590.237788 s. The kill also slipped: r207 fired kill(9) at 498.928036 s with ns=-1, and SpringBoard exited only at 599.286642 s (rv=0x9, ns=2, code=0x9). The wakeup path is therefore not the fault: launchd did not consume its request, and the later lsd request was consumed without an answer. r224 must move the sampler to launchd (pid 1) and lsd.", "Round224 is the frame that retires r223's conclusion instead of confirming it: 60 samples of pid 1 between 431 and 911 s show four or five threads and none of them inside ipc_mqueue_receive -- one in _sigsuspend_nocancel, one or two in _semaphore_wait_trap with wait_event equal to the shared _semaphore_event sentinel, two or three in ___workq_kernreturn -- while the 204 B request's target port 807 reads cnt=0 seq=1372 rn=107 ms=1 sr=162 in the same millisecond the send is sampled, so launchd did take 1372 messages and dispatch workers receive on demand rather than parking a thread on the port. SpringBoard is the side that actually blocks: at 447.918 s and 469.247 s its main thread sits in ipc_mqueue_receive with one 308/272 B id=40000000 message on 7b03/1d07 and rn=0 ms=0 sr=2 rcv=0/0, then SIGKILL lands at 475.351 s and exit rv=0x9 at 475.482 s with no respawn before 912 s. The window holds no launchd-sent mach message at all because the r221 sender probe still samples only SpringBoard, which is the gap r225 closes; and a peer line is a torn snapshot on purpose -- task->lock does not protect thread fields -- so only a repeated pattern across beats counts as one fact.", "Round225 puts the sender on the record and retires the missing-reply theory: at 606.098539 s launchd's thread 0x482 sits in _mach_msg2_trap sending a 64-byte message (msgh_bits 0x00000012 = MOVE_SEND_ONCE, msgh_id 0x20000000) to a send-once right named 4c85f, and at 730.375394 s the same thread sends a 116-byte complex message (0x80000012, one descriptor) to a send-once right named 4744f; both bodies carry the xpc vocabulary the r221 string hunt found in libxpc.dylib -- CPX@, then error in the first and rec_execcnt and req_pid in the second. A send-once right has no send right to copy, so clover_sb_port_state's ipc_object_copyin(...MAKE_SEND...) returns kr=17 (KERN_INVALID_RIGHT) on both and that number says nothing about the port's health. The user stacks resolve to _mach_msg2_trap, _mach_msg and _mach_msg_overwrite once the walker's cache file offsets 626241b0 and 62623fb8 are rebased at 0x180000000 and slid by this boot's 0x16ae0000; the four deeper frames land in no cache mapping and are withheld. SpringBoard's reply port a03 is read eleven times between 422 and 491 s: cnt=0 ql=5 rn=a03 ms=1 sr=1 with seq rising 26 to 29 to 30, so replies do arrive and are taken at once, and the same window shows SpringBoard's main thread 0x104 in a MIG send+recv on rem=7c03/753b rn=a03 -- the launchd-does-not-reply conclusion of r223 and r224 does not hold on this boot. The process still dies: backboardd (spid=58) signals SIGKILL at 497.143890 s, the kill site reads upc 0x1e2625100 = ___kill+0x8 with instruction 0x540000e3 (svc), and ulr 0x10086a144 is not outside that range at all: backboardd's boot-14 slide is 0x7F8000, so ulr minus slide = 0x100071ee4, the return address of the second `bl _kill` (0x100071ee0) inside the Killing %@ helper that otool -tvV shows on the host, the same image-offset family as r218's 0x72144 batch-kill path; exit is at 497.336066 s with rv=0x9 and no respawn through 900 s. backboardd keeps presenting its own progress region (pixels=41586 box=305x887..755x1029, 2262414 of 2304000 pixels black, client pid 58) across the kill. Hex fields: sz=40 means 64 bytes and sz=74 means 116 bytes.", "Round226 (boot 15, payload 62f8d60c...) read the kill site from the killer's own registers: at 532.091901 s backboardd (spid 58) kills SpringBoard (pid 27) and kreg0 gives x0=0x1b (27), x1=0x9 (SIGKILL), x2=0x1, while kreg4 gives pc=0x1d2975100 (libsystem_kernel ___kill+0x8, the svc), lr=0x100763144, sp=0x16f70d860; kreg2 carries x20=0x1006f1000, backboardd's image base, so lr - x20 = 0x72144, the same Killing %@ helper return r218 found through a different slide, now with the pid argument confirmed in x0. kraw0/kraw1 hold the sixteen raw words under sp and are recorded untranslated. The reply port 5203 went seq=3 at 472 s to seq=11 at 480 s and then stayed cnt=0 ql=5 seq=11 rn=5203 ms=0 sr=0 through the kill at 532 s, while the r221 sender trace shows thread 0x104 issuing mach_msg2 with rem=5903 rn=1d03 at 480/508/525 s and the r223 queue on 5903 holding one 134-byte message (bits=0x20111211 id=0x40000000) nobody took: replies stop at 480 s and the process then sits on one wait. Exit is 532.120416 s with rv=0x9 and sbgone t=536 pid=27 is the death as a reading. The receive probe printed nothing because its 32-line budget is global and the kernel log tail only starts at 469.32 s, and because clover_sb_note_current latches the first SpringBoard task forever; r226 could not tell those two causes apart. Screen is still only backboardd's progress bar (frame#0..#3 pixels=41586 box=305x887..755x1029, client pid=58 presenting at 532.91 s).", "Round227 (built for boot 16) stops printing receives live: ipc_mqueue.c keeps the last 64 distinct blocking receives in a fixed kernel ring (port, port-set object, kind, message id, queue length, sequence, remote, local, voucher, size, body words), deduplicated on port/kind/count/sequence/id/size, and psignal_internal dumps the whole ring the moment SpringBoard is SIGKILLed, so flow before the log window can no longer be evicted by the ring buffer. clover_sb_note_current now follows a SpringBoard restart instead of latching the first task forever: it exchanges the pointer atomically, releases the old task reference, clears every per-generation sample field and prints sbtask gen= so each generation is visible. The driver gives the new class a 256-line tee budget, and both gates assert the ring, the dump and the generation line. Kernel 8fbd8b43cd6f431cde708f41afe93f47e05b43a771e192fdb407f771a4f52bcf, payload 56 MiB; device readings are pending boot 16.", "Round227-readback (boot 16): three SpringBoard generations. A was born stuck and SIGKILLed at ~614.7 s leaving no receive records (its rcvsum/rcv0..31/killsig/exit all fell outside the readable window that starts at 617.04 s). B=pid 27 received normally from 614 to 636 s (rcv32 t=614 tid=0x712 .. rcv63 t=636 tid=0x748, threads 0x712/0x722 as in r217), then sat in one wait for 15.5 s and was SIGKILLed by backboardd at 651.53 s (exit pid=27 rv=0x9); the boot-15 stall pattern reproduced. C=pid 229 latched at 653.24 s (sbtask gen=1 pid=229; gen=1 proves B was the first latch and A never entered a mach trap), was still alive and receiving at 906 s (sbm2 t=906 rem=6c03, sbport h=...40000000 - the boot-15 id=40000000 message is taken this time), yet produced no new UI frame (the r180 frame lines stop at 653.2 s, retire#4 done=4; the screen stayed on the backboardd progress bar client pid=58) and then the 900 s deadline panic at 912 s killed a potentially successful boot. Two instrumentation defects for r228: the one-shot dump guard was consumed by generation A so B's kill had no dump, and the dump reads the live ring while printing (rcv32 printed at 617.04 s, rcv63 at 649.46 s - 32 s for the tail; the 16 s gap at 620-636 s is printf slowness, with r217 samples, the watchdogd crash and the 4 s beats all normal in between).", "Round228 fixes both defects and buys generation C the time r227 proved it needed: the kill dump guard now records the victim pid (clover_r228_dumped_pid), so every SpringBoard generation dumps its own receive-ring window; each ring entry carries cre_pid/cre_gen stamped from task_pid(current_task()) and clover_sb_gen_read() at note time, so a reading names its generation instead of guessing; the dump copies the ring into a stack snapshot under hw_lock (two-argument macro - LCK_GRP_NULL) and prints from the copy, so printf slowness can no longer race the writer; and a compact rcdump summary plus the three newest rce lines go through clover_emmc_probe_say into the driver's 64-slot probe ring, the one path that reaches the card even when the msgbuf window is gone before the panic drain. The tee class becomes { \"clover r228: \", \"r228-rcv\", 480, 0, 0, 0 } (129 lines per dump x 3 generations = 387 <= 480) and every old r227 tag line moves to r228 so no unclassed line bypasses the budget. The unattended deadline moves 900 -> 1800 s (checker window 60..1800 inclusive) with host WAIT=2100 and LANDING_WAIT=2100, because generation C was alive, backboardd-presenting and healthy at 906 s when the deadline killed a potentially successful boot.", "Round228 on boot 17 paid for itself three times over: the kill of pid 27 at 497 s carried its own dump to the card through the driver probe ring (rcdump t=497 n=64 tot=660 plus three rce lines stamped pid=27 gen=0, the newest under a second before the kill); generation 2 (pid 213) lived from ~500 s to the last beat at 1771 s and its blocked send MOVED - the send to 115:lsd (nm=6003) got a reply somewhere between 1399 and 1522 s and the stall is now on 58:backboardd nm=3403 (sbport cnt=0 ql=6 seq=3 rn=2227 sr=1); and r180 painted past the 653 s ceiling for the first time - swap#4 accepted at 1468.3 s, copy#4 217 ms 9216000 bytes, retire#4 presented=4, then frame#4 t=1009s and frame#5 t=1019s both full-screen (pixels=2301667 box=0x0..1199x1919). What the round did not see is the 1482-1800 s screen census: the 512-line kernel ring spends about half its budget on noise (141 bare fl=0x14809021 vt=1 fs=apfs event lines, 97 r170 exit churn lines, 14 CoreAnalyticsHub nags). watchdogd exited at 987 s (rv=0x5 ns=2) and nobody killed pid 213 after that - the 1800.16 s deadline panic did (ticks=335739).", " Round229 keeps the deadline at 1800 s and cuts the two things that hid the answer last boot: the driver tee now drops the bare fl=0x14809021 vt= apfs event tails, keeps two lines per nagging producer and four r170 exit lines per command plus one tee filter count row at drain, and the kernel samples the receiver of the blocked send -- when the current sbm2 request owner parses as pid:backboardd it takes that task with lck_mtx_try_lock after SpringBoard own lock is already dropped, prints up to four threads as tid:state:wait_event:continuation:pc, and reads the same port object through the sender name with tag bb. The sampler caps itself at 24 firings, the row stays under the tee 320-byte record, and the new rows get their own probe class so the ring budget cannot starve them.", " Round229 boot 18 read the receiver and it answered: the sampled backboardd threads are all state=1|65 which is TH_WAIT and TH_WAIT|TH_WAIT_REPORT per bsd/kern/thread.h:479, their continuation is exactly _ipc_mqueue_receive_continue resolved with nm against this build's kernel, and their user pc is the same shared-cache _mach_msg2_trap stub the blocked SpringBoard thread sits in, while the send batch's own port reads cnt=0 -- so the message left the queue and backboardd is waiting on the next hop, which is what round230 reads. The tee filter returned fl=233 nag=3166 exit kept=20 dropped=225 and moved the ring start 901 -> 779 s, and the new first noise is CloverBlock r190 sync-in/sync-out at 241 of 504 lines. The screen answer to the round's open question is negative: one r180 client row at 1728 s and no swap or frame anywhere in 779-1812 s, so boot 17's two full-screen frames were backboardd's progress, not a stable state. The sampler's 24 firings are counted per beat, so the budget was spent by 787 s and only one row survived in the ring; round230 fires on a changed batch signature instead.", "Round230 was measured on boot 19: the ring starts at 648.6 s after the tee dropped 347 CloverBlock r190 sync lines (8+8 kept), and the backboardd firings show its in-flight threads are pure receivers (rem=0) rather than blocked senders. The hop row printed x3's local half, not the receive name -- in this ABI the receive name is x5's high half, as r221's rn field already showed -- so round231 prints x5 and x6. The destination port records imq_receiver_name=0x2e2b, imq_msgcount=0 and imq_seqno=3, so the message was enqueued, taken, and left no waiter on that queue at the sample. One backboardd thread and one SpringBoard thread sit in _ulock_wait_continue for the whole boot; round231 records the user lock address.", "Round231 was measured on boot 20: the hop names now come from x5's high half and all 63 rows are receives (rem=0) on three names (0x7f03, 0x790f, 0x6c03). ipc_object_translate returns KERN_INVALID_RIGHT (kr=17) for every one of them, so those names carry neither a SEND nor a RECEIVE right: they are port sets or dead names, not ports, and the hop has no next port object to name. The sampler stopped at 1195 s because clover_bb_sample is still called inside the npick > 0 && m2sig-changed branch (kern/task.c:11386), so once SpringBoard generation 1 stopped changing its in-flight batch no further bb rows were printed even though the ring reaches 1813 s. The two persistent waiters sit in _ulock_wait_continue on user locks 0x105d8f0f4 and 0x16f6dd720 (x0=0x1000001, UL_COMPARE_AND_WAIT|ULF_NO_ERRNO); the other st=1 rows are idle _workq_unpark_continue threads. SpringBoard's destination port nm=4103 reports cnt=0 seq=3 rn=0x147bb wq=0 in all three samples at 1445/1567/1699 s, so the receiver that took the message waits on the port set; round232 must translate with MACH_PORT_RIGHT_PORT_SET and walk the members. The screen has one r180 client row at 1385.96 s and no swap or frame anywhere in 730.5-1813.0 s; the 1800 s deadline panicked with a user-mode elr and ticks=344872, boot 20.", "Round232 (boot 21) read the port sets open: the independent 20 s beat covered 727-1760 s (18 beats, f=8..25), and every hop name (4a03, 7803, 6c03) translated as MACH_PORT_RIGHT_PORT_SET with member tables printed each beat (45 rows). Only member a003 moved (seqno 49 to 56 between 1395 and 1517 s); 635f stayed at 52 and every member of 4a03 reported 0:0. The blocked destination 5e03 is a plain port owned by backboardd (o=0xfffffff8743a6ce0, receive name 3e2b, cnt=0, seq=3) and is not among the eight visible members of any set, but 4a03 reports all=11 and 7803 all=9, so three and one members were hidden by the print cap and round233 must print them all and mark the object match. SpringBoard thread 0x910 carries x16=-47 and op=0x40700420e, which decodes as receive-only plus STRICT_REPLY|RCV_SYNC_WAIT with rcv_name 1e03 and expected port 5e03, so it waits for a reply to the request it sent to 5e03 rather than blocking in a send; the fourth hop signature (tid 0x33c, op 0x500040011, rem=e747, id=0x30000000) is the only sender, and thread 0x3be waits on the user lock 0x100b90194. The kernel ring ends at 1763.1 s, 37 s before the deadline; boot 21 has no kind-20 panic record and misc block 1 is empty, so the landing came from the r198 pre-armed recovery BCB and the deadline record is missing for the first time, which round233 must answer with a beat that does not depend on any task entering mach_msg2.", "Round233 (boot 22) shows the new speakers alive and the channel itself as the limit: the beat thread fired at 808 s with rep=4e0f (a send-once right already dead, kr=15), the member dump printed 8 of the 11 members of set 5903 with all eight at cnt=0 seq=0 (receive names listed, owners 58:backboardd+ps and 58:backboardd), the lock words 0, 0x4203, 0x7d0fd50 and 0xffffff00 all resolved to ow=0x0, and sampling kept running to t=1764 (r232 bbset 44 rows) through a wall of 1768.883 s. Three defects are visible in that frame, not in the device: the r233-bb probe class budget of 256 lines was exhausted by 808 s (census seen=3187 kept=736 throttled=45 lap=2; r229-bb 64 and r231-bb 192 were already capped at 1249 s and 1127 s, while r232-set's 128 was never reached); the t=783 fire printed eight per-fire rows before the member rows, so with kTeePushPerPass = 16 (CloverSdhci.cpp:559) exactly the first eight member rows fit and i=8..10 went into gTeeThrottled (+3 of the 45); and clover_bb_lock_word reads the raw ulock value, while XNU's own ulock_owner_value_to_port_name() calls ipc_entry_name_mask() (bsd/sys/ulock.h:43, osfmk/ipc/ipc_entry.c:812), which ORs 0x03 into the low gen byte, so 0x4202 is port 0x4203 and the lock is not unowned -- the conversion was skipped, not the lock. The last slot of the ring is torn mid-write (newline missing), and boot 22 again has no kind-20 record and an empty misc block 1.", "Round234 (boot 23) closed the owner column and then cut its own boot short: every bblock row reads own=1777dc3/ffffff03 ow=0x0, which is ipc_entry_name_mask() resolving 0x4202 to port 0x4203 exactly as ulock_owner_value_to_port_name() does, and an unresolved owner is a dead thread port (port_name_to_thread refuses stale thread-control names on purpose, so the waiter gets EOWNERDEAD) -- the column was a closed door by design, not an arithmetic bug. The probe then hit the ipc_space.h:173 assert inside ipc_entry_lookup because clover_port_recv_task() looked up a receive name in a task whose space ipc_space_terminate() had already cleared (fairplayd's crash loop), so the reading became the boot's last line at 753 s. The lesson is the same shape as r151's: a sampler that dereferences other tasks must guard is_active(space) under the space read lock, and r235 adds exactly that guard (the fixed tree holds only one ipc_entry_lookup call site, so the guard is complete).", "Round235 (boot 24) removed the assert and the sampler lived to 1789.6 s, which makes the frame a finished reading and two of its answers negative. The 11 members of set o=fffffff59bd739d0 are 5803/5903/5a03/4803/10013/15403/d70b/d40b/7e03/4a17/1103 and the blocked destination 4c03 is none of them; 4c03 reads cnt=0 ql=6 seq=3 rn=2b2b wq=0, the same shape as 5e03 on boot 21 and 4503 on boot 20, so the request was delivered and taken and the reply is absent rather than queued on a port no visible set serves. SpringBoard (pid 247) is not blocked in its send: tid 0x952 is receive-only with STRICT_REPLY rem=4c03 rn=a03 rs=4000, while tid 0x1364 sends 40 bytes (bits=0x1513, remote 203, local 1640b) to a path whose seq is 130. backboardd is not kernel-blocked either: its main thread 0x42d sits in _ulock_wait_continue with UL_COMPARE_AND_WAIT on user lock 0x101691604 expecting 0, a userspace condition nobody signals, and its receivers wait on 7f03/6103/8203/4507. The boot's own defect is on the deadline side and it is new: boot 24 has no kind-20 record, no drain enter line, an empty misc block 1, and the TWRP landing proves only that round198 pre-armed the BCB, while the driver ring carries six dma deadline / read gave up / card recover sequences near the end -- so the panic sink failed silently exactly where the card was busy, and the deadline fact needs a path that does not pass through the panic screen.", "r236's three knives all landed on boot 25. The deadline record in flight slot 60 reads fired after 1800 s at t=1800760 ms ps=0x01e800f6 ticks=313678 cnt0=0xef30b36 cnt1=0x81ae42466 freq=19200000 elapsed=1800.005s: the timer IRQ wrote its own block before panic() on the forced path that needs neither gFlightArmed nor a ready card, and the twelve entries immediately before it (fairplay pid 429, ps=0x01f800f0) each finished in 1-2 ms, so the card was healthy at the deadline and boot 24's silence was not a card fault.", "Round 236's panic markers bracket the sink: stage0 t=1800925 rc=0 and stage1 t=1800932 rc=113 (=100+slot 13) with log_ready=1 host=0x3b2cc log_first=13320216 drained=0 boot=25 gates=0x7; slot 13 is report lba 13320242, so the panic text reached the card for the first time, and drained=0 is expected because the stage-1 marker precedes panicDrainRings(). The drain then entered with append_rc=113 and exited wrote=24 dropped=0 unseen=0 tee_passes=8 probe=19.", "The flight clock is not the kernel clock: flightCounterMs(gFlightStart) starts when the driver arms, so the deadline's 1800.760 s sits about 12.1 s behind the kernel msgbuf's 1812.9 s; the 512-row ring window is 1008.2-1812.9 s, and the beats at 1782/1786/1794/1798 s read miss=163/164 stuck=8 recov=8 stage=idle.", "Round 236's user-stack capture is the first statement about what backboardd waits on that does not pass through the kernel: 112 bbustk rows over 33 sample times (1003-1753 s, 53 tids), with main thread 0x42f sampled 31 times and byte-identical every time (sp=1701eb810 fp=1701eb830 lr=1922f8a80 fn=6 1922f8e40 1006963e4 192355c9c 192356cc0 1922fe3f8 1922fee74); the other 81 rows are idle workqueue threads at __pthread_wqthread+0x168.", "Register evidence at that wait: pc=1ce526bdc = libsystem_kernel ___ulock_wait+0x8, x0=0x1000001 (UL_COMPARE_AND_WAIT|ULF_NO_ERRNO), x1=0x100c8f0d4, x2=0 (expected), x3=0 (forever), and the bblock word is still 0, so nothing has signalled the object since the wait began.", "Host symbolization for boot 25: the shared-cache slide is 0x2da0000, found by enumerating slide candidates while preserving each anchor's in-page offset and validated by BL/BLR pairing (score 6.25, no coincidental candidate); the chain resolves to libdispatch 0x18f558a4c+0x34 (___ulock_wait stub at 0x18f558a7c), 0x18f558e0c+0x34, the invoke thunks 0x18f5b5c84+0x18 and 0x18f5b6cb0+0x10, and the main-queue drain 0x18f55e138+0x2c0, with a tail call at 0x18f558824 explaining the absent frame. backboardd's own slide is 0x666000 (r218 killsrc ulr 0x1006d8144 minus image offset 0x72144), which puts the block frame at image offset 0x303e4.", "The ulock address is a heap object, not a static __DATA slot: x1=0x100c8f0d4 is object+0x34, so the dispatch object header is at 0x100c8f0a0, and boot 24's 0x101691604 differs by 0xa02530, which is not a page multiple and cannot map to one image offset under any page-aligned slide. backboardd's main thread is therefore inside a block in its own executable, waiting forever on a heap dispatch object whose value word remains 0, while its four port-set receivers and 81 idle workqueue threads are healthy.", "Parked for r237: libdispatch local names (the 685,817,856-byte .symbols subcache carries a dyld_v1 arm64 header, mappingCount 1 at 16 KiB, and no image table; the host has no dsc_extractor, ipsw or capstone), the backboardd block symbol (rootfs is encrypted, only the 0x303e4 offset exists), and whether ___ulock_wake ever targets that word.", "Round 237's ulock table read back as 48 rows over six beats (1062-1733 s): eight addresses, no overflow line, every return code 0 and every blocked wait woken. The busiest is 0x1f7e51580 with w=b=k=s=7 at op 0x1000002; 0x16ff6f720 reads w=2 b=2 k=1 s=1 at op 0x1000001; the other six each read one. Fifteen waits in the whole window is consistent with libdispatch parking rarely, but the address the stack waits on (0x15dd8f944) never appears, so the table proves the recorded waits are healthy, not that the stuck wait was recorded.", "The absence has two allowed explanations and the code distinguishes neither: clover_ulock_dump prints only the first eight non-empty slots, and the four hooks drop any wait whose pid is not clover_bb_target_pid, which stays 0 until the SpringBoard sampler first sees a message addressed to '<pid>:backboardd' (first such sample near t=1007 in boot 26). The bbobj row already shows the wait at t=1012, so a wait that began before the latch is the more likely loss.", "Boot 26's object header is the same on all nine samples (t=1012 to 1753): tid=0x461, a=0x15dd8f944, base=0x15dd8f910, isa=0x1f7e54bf0, val=0x100000002, w=0. Subtracting the shared-cache slide 0x3610000 for boot 26 puts isa at 0x1f4844bf0 inside the same high cache mapping where image_for_vmaddr returns no image, and the +0x34 wait word is still zero. The other 17 bbobj rows are false positives on non-lock words.", "The ten-frame stack, sampled 109 times with tid=0x461 byte-identical every time, resolves through cache slide 0x3610000 and backboardd slide 0xeaa000 to the ___ulock_wait stub 0x18f558a7c (+0x34), 0x18f558e0c+0x34, backboardd image offset 0x303e4, the BLR x8/x1 thunks 0x18f5b5c84+0x18 and 0x18f5b6cb0+0x10, the drain 0x18f55e138+0x2c0, 0x18f55ecf8+0x17c, 0x18f568698+0xfc and 0x18f567f14+0x194, and finally libsystem_pthread __pthread_wqthread+0x11c and _start_wqthread+0x8. This corrects boot 25's reading: the waiter is a libdispatch workqueue thread, not the main thread; the 0x303e4 block is entered through the continuation machinery and waits inside the block.", "SpringBoard is still queued at the deadline: the last sbm2 at t=1788 shows the send to 58:backboardd with rem=5603, and bbset at t=1801 reads eleven queued messages with the newest sequence 0x985. Boot 26 ran to the 1800 s deadline (last kernel line 1801.604) and the panic path's BCB took, but the boot-26 kind-20 record did not reach the report window.", "Round 238 (boot 27) moved the filter into sys_ulock.c and matched the waiting process by name: the stuck address 0x101691ce4 is in the table from t=464 with w=1 b=1 k=0 s=0 wr=0 sw=0 op=1000001 and cw=0 on all six beats, and the final counters read seen=5181 filt=4966 stored=163 over=52 open=1 -- 4966 waits belonged to other processes, 215 belonged to backboardd, 163 were stored and 52 were dropped by the twelve-slot cap. r237's absence was the pid latch plus the eight-row print, not a missing wait.", "Round 238 also identified the object and the blocked code path on the host. The wait word is object+0x34 = dg_gen, the isa 0x1f9748bf0 minus boot 27's cache slide 0x4f04000 is 0x1F4844BF0 = OS_dispatch_group, and the +8 word 0x100000002 is the refcount pair rather than dg_state. One enter, zero leaves and zero wakes mean the group count never reached zero in-process. backboardd image offset 0x303e4 is the return address of 0x1000303e0 bl _dispatch_group_wait inside a block at 0x1000303c4 whose x19 is the block, [block+0x20] is the captured self (BKButtonHapticsController), [self+0x20] is _homeButtonDefinition and [definition+0x38] is a dispatch group waited on forever; the block is built at 0x10002fef4 in IMP 0x10002fe4c, which also holds the cmp x22,#2 BSPlatform query that decides whether the block runs at all. 0x10002fe4c's selector and the definition's +0x38 ivar name are still unknown because the rootfs is encrypted and the relative method-list name offsets did not resolve.", "Round 239 (boot 28) confirmed the host-proven chain on the device, field by field, and then found the fix in the reference port instead of a kernel knife. The stuck group reads b=fffffffd g=0 cnt=1 wait=1 notif=0 (one enter, zero leaves, generation never advanced), exactly the libdispatch-1477 prediction; the bbchain row found the block through the waiter's own frames (fi=0 fn=10), and inv=0x100ccc3c4 minus this boot's backboardd slide 0xC9C000 is 0x1000303c4, the host-proven invoke body, with [block+0x20]=controller and [controller+0x38]=the waited group. The group isa 0x213770bf0 minus cache slide 0x1EF2C000 is 0x1F4844BF0 = OS_dispatch_group, the same class as boot 27. The decisive comparison is with ~/UniXNU-sheng, which boots the same iPadOS 17.7.11 image to a full idle desktop and has no backboardd stall in its record: sheng's ADT publishes a buttons node with home-button-type=2 and button-names hold/voldown/volup (no menu/home entry). Disassembling backboardd 0x2fe8c fixes the branch direction: cmp x22,#2 then b.ne 0x2fedc, so homeButtonType==2 falls through, logs 'not configuring SSHB because we don't have a real home button' and returns without building the 0x303c4 waiting block; only !=2 dispatches it. clover's ADT publishes product-name/model=iPad7,1 but no buttons node, so iOS takes the iPad7,1 (J120AP, home-button) default and stalls. The Mi Pad 4 has no Apple SSHB haptics home button either, so r240 mirrors sheng's buttons node (home-button-type=2) -- a truthful device description that removes the cause, rather than faking a dispatch-group leave in the kernel.", "Round 240 (boot 29) proved the buttons node alone does not clear the stall: with /buttons/home-button-type=2 present and asserted, the deadlock returned byte-identical -- the stuck group still reads b=fffffffd g=0 cnt=1 wait=1 (one enter, zero leaves) and bbchain still resolves inv=0x1000303c4 to the host-proven SSHB haptics block through this boot's backboardd slide. So BSPlatform.homeButtonType did not become 2 from /buttons. The mandated sheng comparison found the real source: MobileGestalt derives the home-button answer from the /product node, not /buttons, and clover's /product said Mi Pad 4 LTE / iPad7,1 -- a real iPad WITH a mechanical home button -- while sheng's --ipad-identity /product describes a home-button-less iPad Pro (12.9-inch) (2nd generation) (artwork-device-subtype 2732, compatible-device-fallback iPad6,7, thin-bezel 1), which is the configuration that boots this same image to the desktop. r241 mirrors that whole /product block.", "Round 241 mirrors sheng's full home-button-less iPad Pro /product identity in scripts/make-clover-adt.py (product-name/product-description iPad Pro (12.9-inch) (2nd generation), artwork-device-idiom pad, artwork-device-subtype 2732, artwork-scale-factor 2, artwork-display-gamut sRGB, compatible-device-fallback iPad6,7, thin-bezel 1), keeping the r240 buttons node and the r239 group/chain probes so the next frame reads whether the wait is gone. check-clover.py gained /product assertions and both payload-title assertions moved to clover r241; the ADT grew 13792->14140 bytes (+348 = the product fields) and verify-clover-payload.py exits 0 with the r239 bbgrp/bbchain/bbnochain markers retained. Device reading is boot 30, pending.", "Round 241 (boot 30) proved the /product identity alone does not clear the stall either: with both /buttons/home-button-type=2 and sheng's full home-button-less iPad Pro /product published, backboardd still dispatched the SSHB haptics block and the bbgrp rows still read b=fffffffd g=0 cnt=1 wait=1 every beat, with the bbchain block->self->group pointers unchanged and no UI progress past the r180 client#6 frame. Two single-node hypotheses are now disproven on the device; since r205's /chosen/display-scale demonstrably reaches userland, the ADT is read -- what was wrong was the claim about which gestalt inputs feed BSPlatform.homeButtonType.", "Round 242 mirrors the two remaining gestalt inputs clover lacked versus sheng: the root target-type J120 (IODTPlatformExpert publishes hw.target from it, and libMobileGestalt reads hw.product/hw.target together for the device identity) and the /chosen dev-fused security tuple (certificate-production-status=0, effective-production-status-ap=0, certificate-security-mode=1, effective-security-mode-sep=1, MobileGestalt's security status that routes mobileactivationd to its native Hactivation branch). check-clover.py pins both plus the r240/r241 nodes, so a regression to a partial identity fails the gate. Device reading is boot 31, pending. If boot 31 still stalls, the next step is host disassembly of -[BSPlatform homeButtonType] from ~/clover-out/dyld-cache to pin the real value path before touching the ADT again.", "Round 242 (boot 31) proved the whole identity does not move the wait either: bbgrp still reads b=fffffffd g=0 cnt=1 wait=1 on every beat, and bbchain's inv minus the boot's backboardd slide is still the invoke body the host proved. Three node-set hypotheses are now dead on the device -- boot 29 buttons-only, boot 30 product-only, boot 31 whole-identity. Per the pre-declared fallback the ADT gets no more guesses, and host disassembly of the extracted shared cache pinned the getter: -[BSPlatform homeButtonType] (BaseBoard IMP 0x18f6eeecc, once token 0x1f48945f0, stack block invoke 0x18f6fe3a0 -- the 28-character name length matches the block symbol exactly) computes MGGetSInt32Answer of the obfuscated question JwLB44/jEB8aFDpXQ16Tuw with default 0, and libMobileGestalt's handler for it (0x1a0207a38 in subcache .11, CFSTR home-button-type at 0x1e7c9c530) resolves IORegistryEntryFromPath of IODeviceTree:/buttons and copies that property -- so r240's node was the right target all along, and the one thing never observed is whether the kernel publishes that path into the plane. Split-cache forensics note: mapping entries are 32 bytes (<QQQII>), and chained pointers store the full slid VM address in their low 36 bits.", "Round 243 adds no ADT change; it adds a reading. IOStartIOKit.cpp gains clover_iodt_census(secs), one-shot behind a static guard, called at the tail of the proven backboardd sampler: it walks the IODeviceTree plane two levels deep printing every node name, then repeats MobileGestalt's own four lookups -- /buttons with the home-button-type OSData length and u32, /product, /chosen with display-scale as the positive control r205 already proved readable, and the plane root's target-type -- as clover r243: lines under tee class r243 (budget 64, one-shot so it cannot crowd the beat rows). check-clover.py pins the census needles and the once guard; verify-clover-payload.py asserts census/census-nodes/census-hbt/census-buttons in the image. If /buttons is missing from the plane while the ADT bytes carry it, the break is plane publication and the fix belongs to the kernel, modelled on sheng's proven tree; if it is present with home-button-type=2 and the wait still stands, the disassembled getter chain is re-opened instead."]
completion = ["Every claimed milestone has a reproducible command, a matching source revision and an accessible result."]
limits = ["Source references describe implemented behavior; host and device status need their own evidence.", "There is no serial console after the menu, so a frame is a photograph or a logfs read."]
next_action = ["r243 - no ADT change: the boot 31 frame kept bbgrp cnt=1 wait=1 with the whole identity in the tree, so the round ships one kernel patch (patches/xnu-clover/zzzzzzzzzzzzzzzzzzzzzzzzzz-clover-r243.patch, LATE list head, 28 z so it replays after r239) adding the one-shot IODeviceTree census to IOStartIOKit.cpp and its call at the tail of clover_bb_sample, plus the r243 tee class (64) in CloverSdhci, the census needles in check-clover.py and the four image strings in verify-clover-payload.py; board.toml title is clover r243 and kernel sha is 825c4d6a58e83cd1abcbbcc9ca25b2d6ea326cdc29efd393a1c7c00094d2e633 (round243-kernel-amfi.macho), payload cf5992448eef8c321ff60a50bcddb4fa895d2ad4d2a57e3a9c3a3d3f7395c2f6.", "Read boot 32 from ~/clover-out/round243-log-window.bin after the 1800 s deadline lands the board in TWRP. The census lines to read are clover r243: node (what the plane publishes), path buttons= and hbt len=/u32= (what MobileGestalt reads), with scale=data and target=J120 as the positive controls. The success reading is still the absence of the stuck bbgrp/bbchain wait plus SpringBoard progressing past the backboardd reply.", "The census splits the remaining world in two: /buttons missing from the plane while the ADT bytes carry it puts the fix in kernel plane publication (IODeviceTreeAlloc/MakeReferenceTable), modelled on sheng's proven tree; /buttons present with home-button-type=2 and the wait still standing re-opens the disassembled getter chain, whose only unpinned thread is the small method list name-cell decode."]

