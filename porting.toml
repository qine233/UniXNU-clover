next_action = ["Round175 changes who gets to speak from the card, not what is measured: the verdict ring now carries two producers, so --tee answers what the kernel said and --driver answers what the transport decided, both ordered by the sequence stamp. Read the two against the report window in the same 128-sector dump. The first question the tee has to settle is the one three photographs could not: whether clover r154:, clover r166: sig and the round170 exec and exit pairs keep appearing with new pids and advancing timestamps, or stop appearing at all. tee seen=, kept= and lap= separate a kernel that stayed silent from a ring that could not keep up.", "Round183 adds a third question the same single dump answers. After one cold flash and one dd, read-clover-log.py --tee yields the r183 heap census (header, listed=, beyond=), the doorbell word and each SMP2P item's own decode, the two image scans and finally clover r183: verdict adsp_edge=seen|not seen adsp_loaded=pages nonzero|pages zero. A frame whose map line names a failed window is a payload-geometry question, not a DSP question -- the heap is DRAM the shipping kernel took out of its allocator, so if this boot's map does not carry it the reading stops there and says so.", "A silent r183 report is still ambiguous in exactly one documented way: the instrument runs last in sheng_pmgr_run(), after the card is armed, so no r183 line at all means the boot never reached the PMGR tail rather than that the heap is empty. The r182 rail lines and the r181 bus lines are the markers that separate the two."]

