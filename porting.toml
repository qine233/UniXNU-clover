[[area]]
id = "diagnostics"
status = "implemented"
components = []
paths = ["scripts/check-clover.py", "scripts/read-clover-log.py", "scripts/check-cs-blob-structure.py", "scripts/run-clover-unattended.sh", "scripts/decode-clover-address.py", "scripts/dump-clover-facts.sh", "board.toml"]
inputs = ["Panel output after the boot menu, logfs slots in the eMMC, IMEM restart-reason cell at 0x146bf000+0x65c.", "Panic screen and entry probe as the only reporters."]
configuration = ["boot-progress=2 and debug-enabled in /chosen enable the checkpoints.", "clover-unattended=<seconds> arms the ArmCpu deadline and the panic-screen reset into fastboot; the shipped boot leaves it out.", "read-clover-log.py reads logfs on the host; decode-clover-address.py maps a kernel address to a symbol."]
procedure = ["Run the checker for the changed area and keep its command and output.", "Read the last completed checkpoint and the first failing operation from the panel; link the captured frame.", "If a probe is silent, state whether it was not reached or was reached and printed nothing."]
findings = ["Three evidence levels are different facts: source shape, host check and device frame.", "r151's silence came from reading cn_pnbuf before vn_open_auth initialized it; r153 moved the read after the call. A silent probe is never proof that the code did not run.", "The r154 syscall-536 probe printed nothing even though .01 opened, which places the wall before the mapping syscall.", "The 524 ms lock timeout can fire during a slow 16 KiB read; ml-timeout-lock-panic-scale=40 is part of the shipped diagnostic frame.", "Round160 taught this checker the userdata host gate: scripts/verify-userdata-window.py must exist and keep its pinned seed, three-window rule and last-window rule, so the destructive image cannot be flashed with a gate that stopped reading it.", "Round164 changes the menu-title assertion to r164 and teaches the checker the kernel-side skip patch, the two-signature AMFI patcher and the verifier's new assertions; no probe was added, and both halves are binary/source patches recorded in the storage and packaging areas.", "Round165 adds one evidence row that is also a repair: CloverSdhci r165: readcheck reports two batch reads and 32 single-block reads of the same 16 KiB with a word-diff count and the first differing index, and CloverSdhci r165: batch reads disabled for this boot marks the fallback. The checker asserts the drain, reset, prepare and check functions and the read loop's gReadBatchTrusted gate; verify-clover-payload.py asserts both strings in the image.", "Round166 keeps the A/B row as an observation, not a policy switch, and adds the exec-side signature dump clover r166: sig n= mo= off= size= w=.../.../.../... for the first eight blobs the loader reads. The checker asserts the untrusted default, the two r166 strings and the patch's dump; verify-clover-payload.py asserts the image carries both strings plus the dump format, and the host-side image clearance (OS window mounted, every file readable, three SuperBlob magics) is recorded as evidence rather than assumed.", "Round167 adds two write-side readings and one policy reading: CloverSdhci r167: write cache size= ctrl= off= rsp= st= says whether the eMMC write cache was on and is now off, CloverSdhci r167: write not ready lba= blocks= rsp= st= polls= names the first write CMD13 never confirmed, and CloverSdhci r167: readcheck ... trusted=... plus batch reads trusted for this boot or single-block reads for this boot records which read path the boot actually used. The checker asserts writeSettled, the stop-command result, the CACHE_CTRL constant, the scaled deadlines, the three-sample rule and the absence of the 160 us per-word gap in the write path; the verifier asserts the same four strings in the payload image.", "Round168 turns four wait bounds into readings: CloverSdhci r168: block guard waited ms fires once past 250 ms, CloverSdhci r168: write settle took ms polls= once a counted write took more than 500 ms to be confirmed, and read gave up lba= blocks= done= st= or write gave up lba= blocks= done= is printed once when the whole retry ladder fails. The r167 frame that motivated them had no panic and no give-up line: disk5 and disk1 both returned EIO (error 5) at fixed block numbers while a single checkpoint flush took 22.7 s, so the driver's own 2 s guard and 200 ms settle were timing out a card that was merely busy. The checker rejects the old two-second hand-over and the flat two-second request base and asserts the 30 s guard and 4 s settle; the verifier asserts the four new strings.", "Round169 turns a read failure into a stage and a stop: CloverSdhci r169: card busy ms fires once past 250 ms of waiting for the card before a read, CloverSdhci r169: read <stage> lba= blocks= done= st= names up to eight failures with the stage (guard, idle, deadline, gave up) that produced them, and the CMD12-before-reset path is asserted in source. The checker also rejects the four-second settle and the once-per-boot read give-up it replaces; the verifier asserts the card-busy and staged-read strings in the image.", "Round170 is the counter-lesson to r151's silence: a probe without a cap is its own blind spot. r169 read clean because the read fix worked, then said nothing else because one uncapped printf filled the panel with clover r153: check_np dyld_flags=0x0 -- a line with no pid, from a syscall every process calls several times, on a kernel that only names the exit reason of critical processes. The exec/exit pair added this round is the first reading that names the process, so a respawn loop and a merely slow boot stop sharing one photograph.", "Round171 is the frame where a driver reading named its own bug. r169's stage tags turned a wall of disk1: general error into eight lines that all say guard with st=00000000, which is a different failure from every read failure this project had chased: nothing on the wire went wrong, the caller simply never got the card. The paired reading -- tx_flush took 102001275 us and 120000602 us on disk5, against 22708252 us in the r168 frame -- shows the wait was the write-through policy r167 chose, and w=1024/1024 st=0x21 shows the batch criterion rejecting work it had itself delivered. Three of this round's four fixes therefore come from readings that already existed; the fourth (sizing the trust gate from the request) was found on the host, because raising kReadChunkBlocks would have silently disarmed the r167 gate that decides whether batch reads are trusted at all.", "Round172 makes the transport itself readable: dma up names the bounce's physical address, the capability word, the interrupt enable and the host-control byte the firmware left, dmacheck carries both paths' milliseconds and KB/s, and each DMA refusal prints one of at most eight CloverSdhci r172: dma path|slot|cmd|deadline|error|stop lba= blocks= st= err8= hctl= lines with the ADMA_ERROR byte, which is what distinguishes a table the host rejected from an address the bus rejected. A frame with dma up and no dmacheck is a boot whose multi-block command was never trusted; a frame with no dma up is a controller that refused the bounce.", "Round173 makes the write transport readable: wrcheck carries both runs' milliseconds and KB/s, control= and dma= say which of the two round trips completed, diff=/first= name the first mismatching word, w=/g= print the original bytes against the bytes read back, and st= prints both INT_STATUS words. A frame with no wrcheck line at all is a boot whose first multi-block write never happened; a frame with control=0 is the medium or the PIO path, not DMA.", "Round174 makes the frame survive the panel: read-clover-log.py decodes both windows, orders the kind-21 ring by the sequence stamp in header word 8 so a wrapped ring still reads oldest to newest, names a bad bytes-sum or a missing prefix instead of silently dropping the record, and carries a --selftest that round-trips the writer exact header layout -- which scripts/check-clover.py executes as a build gate. run-clover-unattended.sh now dd-s 128 sectors and prints the report window and the verdict ring as separate sections, so a missing verdict section means a boot that predates round174 rather than a decoder that stopped looking.", "Round175 gives the card the kernels own words, not just the drivers: read-clover-log.py attributes every kind-21 record to driver or kernel from the CloverSdhci line prefix, --tee and --driver select one producer each, the selftest now writes a ring that mixes both kinds and asserts the split, and check-clover.py executes that selftest as a build gate. The unattended summary reports how many ring entries came from the kernel log and warns when the ring armed but brought no kernel lines.", "Round176 makes the two producers readable as two facts rather than one merged stream: read-clover-log.py decodes kind 21 as the driver ring and kind 22 as the kernel ring, refuses a record whose kind does not match the ring it was read from (a driver line surfacing under --tee is reported, not printed as kernel text), keeps --driver as a filter over whichever ring is open, and its --selftest now builds both rings, asserts each rings single producer, asserts the kernel ring contains no driver line, asserts the adjacency arithmetic 64 + 2*64 = 192 and 192 + 2*512 = 1216, and still prints broken records with the mismatch named. run-clover-unattended.sh dumps 1216 sectors, decodes both windows under their own headings, counts each, and warns twice: armed tee with zero kernel lines, and any driver line inside the kernel ring -- which is the tee echoing itself and the one reading that invalidates the whole window.", "Round177 adds two host gates that check-clover.py executes rather than greps: normalize-kernel-macho.py --selftest replays 17 rules (convergence of two synthetic builds, idempotence, preserved length, the counted stamps, a non-object stab left alone, a version-3 UUID carrying the RFC 4122 variant, the KCID as the same digests tail, nothing outside the derived fields moving, and four refusals -- non-Mach-O, missing LC_UUID, no object stamps, truncated file), and check-cs-blob-structure.py --selftest replays 14 cs_validate_csblob rules before the same script is run against build/clover-root/launchd.macho and must accept it. The checker also asserts the normalizer sits between the patcher and the payload step in AGENTS.md. A round that forgets the step now fails a gate instead of quietly shipping a kernel no one can reproduce.", "Round178 adds one reading to the driver ring: CloverSdhci r178: read|write handoff lba= blocks= done= cuts= waits= worst= ms, at most four lines per boot and reported by the holder that cut, while round168 block guard waited stays as the once-per-boot longest wait. cuts= above zero is the proof the guard changed hands inside one transfer; worst= says what a waiter paid for it. Both go through sdhciSay, so neither depends on the panel scrolling past them."]
