id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["drivers/ArmCpu/**", "scripts/make-clover-adt.py", "scripts/build-arm-driver.py"]
inputs = ["Eight Kryo 260 cores: cpu0 to cpu3 at MPIDR 0x0..0x3 (A53), cpu4 to cpu7 at 0x100..0x103 (A73).", "GIC distributor and CPU interface on SDM660; timer INTID 19; PSCI method SMC."]
configuration = ["The ADT enables all eight CPUs with cpu_regs = 0x0,0x1,0x2,0x3,0x100,0x101,0x102,0x103.", "kernel_args selects armcpu-timer-intid=19, and since round299 also armcpu-smp=1 plus armcpu-self-ipi=1. The secondary-core gate is spelled armcpu-smp because round299 renamed it out of the source board's name (it was sheng-smp, which is why eleven boots of this board's args never mentioned it and reg stayed 1). armcpu-self-ipi is passed as an enabler, not a hypothesis: osfmk/kern/machine.c clears SIGPdisabled only when a core takes its first IPI, so without it cpu_signal() keeps skipping a freshly started core -- r270's sent=0 recv=0 therefore only shows the scheduler never asked, and the two are told apart by the driver's own step counters versus r270's sgi= bits. armcpu-spi-ipi stays absent because its hardcoded SPI IPI numbers 1008..1015 are above this GIC's range (boot 74's panic screen read GICD_TYPER=0x7b04f3, ITLinesNumber=19, i.e. SPIs end at INTID 671); armcpu-smp-remote-gic is deliberately absent too, because this board's GICR base and stride are read from its own ADT and nothing in r299 needs a second redistributor mapping. The tick-count watchdog that ships with ArmCpu is disarmed unless clover-unattended= is passed."]
procedure = ["Regenerate the ADT with scripts/make-clover-adt.py and read the encoding back with the checker.", "Record per-CPU entry, timer interrupts and inter-processor interrupt delivery on a boot that reaches them."]
findings = ["The kernel builds ARM64_BOARD_CONFIG_BCM2837 with MAX_CPU_CLUSTERS 1. A cluster-type property with two clusters fails machine_routines.c:1099, so the ADT omits cluster-type and the eight cores form one flat SMP cluster.", "armcpu-spi-ipi is sheng's GICv3 shape, not a generic switch; clover's GIC uses SGIs for IPIs.", "Round82 measured the timer INTID and the tick; later rounds use the tick as the panic screen's coordinate.", "Round181 adds CloverInput to scripts/build-arm-driver.py's component list, archiving into build/clover-input, so the driver is compiled with the flags the XNU build recorded for IOPlatformExpert.cpo.json and audited for ARM64/iOS 17 like every other board driver. It deliberately does not inherit -mgeneral-regs-only -- that constraint belongs to CloverSdhci's post-panic screen -- and it needs no extra include path because InputRegs.h is quoted from next to the source. No CPU, timer or interrupt-arrival fact changed: the QUP interrupt INTID 129 is named in the report and never enabled, because every transfer here is polled.", "Round183 changes one line in scripts/build-arm-driver.py and no CPU fact. The board builders replay the XNU compile record build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json -- 479 arguments, --target=arm64-apple-ios17.0.0, -nostdlibinc -- and a full XNU pass rewrites that record without any -isysroot in it, while the four device builders add -Wall -Wextra -Werror, so clang answers -Wincompatible-sysroot. The builder now pins the iPhoneOS SDK from xcrun only when the record names none, which keeps a record that already carries a sysroot authoritative. The eight-core list, the timer INTID, the polled-transfer rule and the deliberate absence of -mgeneral-regs-only are exactly as round181 left them.", "boot 57 (r270) puts the two halves of this area's open question on different footings. IPI delivery: never requested -- sent=0 recv=0 in every frame of the window, so whatever the CPU driver believes about ICC_SGI1R_EL1, the scheduler never asked it to wake a second core. Core presence: the per-core timer tally is 224585,0,0,0,0,0,0,0 climbing to 291290,0,0,0,0,0,0,0, i.e. the board delivered architectural timer interrupts to logical core 0 alone for the whole 1800 s, while the ADT declares eight cpus (check-clover.py prints 'ADT 14384 bytes, 8 cores'). Those readings are consistent with 'cpus 1-7 were never started' and with 'they were started and parked', and the driver cannot tell them apart because it counts interrupts, not processors; r271 asks XNU directly, through the array cpu_data_register() fills.", "boot 87 (r298, v0.7.2) put this area's baseline on the card: clover r271: cpu t=1514 real=1 max=8 reg=1 start=0 run=1 s=00000000 r=10000000 tm=237841,0,0,0,0,0,0,0 and again at t=1781 with tm=278509. The three numbers separate what was missing: max=8 means ml_parse_cpu_topology() counted all eight cpu nodes out of the ADT, reg=1 means ml_processor_register() ran once (the boot CPU), start=0 means no second core was ever asked to enter. So neither the device tree nor MAX_CPUS is the gap. The gap is that the code which asks is switched off: drivers/ArmCpu/ArmCpu.cpp already carries the whole secondary path -- probe() accepts a non-boot cpu nub only when the boot-arg parses (:226-241, the arg is still spelled sheng-smp because that is where the driver came from), finishSecondary() registers the processor and hands the mach processor to the kernel (:512), startCPU() issues PSCI 0.2 CPU_ON (SMC64 0xc4000003) with the kernel's physical reset vector after cleanToMemory of that page (:872-885), and the new core wakes its own redistributor, enables the GIC, installs its handler and counts itself up through armcpu_smp_step 5/6/7 (:573-598). Three prerequisites were re-checked on this board rather than assumed: psciConduit() reads /psci method and the ADT publishes method=smc (scripts/make-clover-adt.py:272) -- the same conduit the panic screen has been driving for years with PSCI SYSTEM_RESET, which is the positive control this area owns; the eight reg values match the archived sdm660.dtsi MPIDR list 0x0..0x3 and 0x100..0x103 bit for bit; and BCM2837 does not define HAS_CLUSTER, so ml_parse_cpu_topology() folds every core into cluster 0 by the phys_cluster_id = (cluster_type == CLUSTER_TYPE_P) branch (machine_routines.c:1094-1103) and the MAX_CPU_CLUSTERS 1 assert is not reached -- sheng's MAX_CPU_CLUSTERS 2 belongs to its publishing E/P cluster identities, which this ADT deliberately does not.", "Round299 SHIPPED (v0.7.3) and found the gap where boot 87's row left it: not topology, not MAX_CPUS, not missing driver code, but a switch named after another board. probe() now reads PE_parse_boot_argn(\"armcpu-smp\", ...) (:226-241), start() reads armcpu-smp and armcpu-smp-remote-gic, and board.toml passes armcpu-smp=1 with armcpu-self-ipi=1. startCPU() additionally records what it hands the firmware -- armcpu_smp_entry[logicalId] = ml_static_vtop(LowResetVectorBase) -- and short-circuits with fl=9 / psci_rc=-1002 when that translation returns 0, because PSCI CPU_ON is a three-argument call and its -4 INVALID_ADDRESS otherwise means 'the firmware rejected the address' without saying whose address it was or whether we ever sent one. The reading is a new kernel row, clover r299: smp t= req= con= run= st=... fl=... rc=... want=... seen=... entry=..., printed inside the same census fire immediately under the r271 row rather than once at attach: r272 already proved that anything which speaks before t=10 s is outside the card's ~370 s window. want= vs seen= is the driver's own MPIDR expectation against the MPIDR the new core actually reads, so a core that arrives at the wrong address is visible; req= (the parsed boot-arg, published by the driver as state) separates 'the arg never reached the kernel' from 'the arg arrived and the ask failed'. Tee class r299-smp budget 64 plus its per-pass exemption, LATE_PATCH reverses r299 before r298, and both gates are green before flashing.", "Boot 88 (round299-v0.7.3-payload.img, image fda745f8) read that row and it came back in the pre-registered 'cores up' state: req=1 con=1 run=7 st=07777777 fl=00000000 rc=0 x7 entry=0,a3203000 x7, and beside it r271 read real=8 max=8 reg=8 start=7 run=8 s=01111111 r=11111111 with all eight per-core timer counts non-zero (59695 down to 5073). want=/seen= differ only by MPIDR bit 31 (Aff3-valid), which the driver's own test masks off -- ArmCpu.cpp:590 compares (mpidr & 0xffff) against (affinity & 0xffff) and parks a core in wfe with fl=1 on a mismatch, so seen=0x80000001 is want=1: seven cores, the right seven. seen[0]/entry[0] are zero because the boot core does not run initCPU()/startCPU(), which is 'nobody wrote that slot', not a measured 0. The same fire's r270 row answers the second half: sent=344711 recv=344557 with sgi counts on all eight cores where boot 87 read 0/0, so the cores are used and not just present -- and armcpu-self-ipi=1 is confirmed as the enabler it was registered as (machine.c clears SIGPdisabled only on a core's first IPI). The firmware never denied anything: rc=-3, the branch left unproven before flashing, did not appear."]
completion = ["Every enabled CPU reaches its entry point and timer handling runs on the boot CPU.", "Boot 88 (r299/v0.7.3) met the first half on hardware: clover r271: cpu t=835 real=8 max=8 reg=8 start=7 run=8 s=01111111 r=11111111 with per-core timer counts 59695,43260,35219,25964,18180,11705,4748,5073 -- all eight registered, all eight counted their own architectural timer -- and clover r299: smp t=835 req=1 con=1 run=7 st=07777777 fl=00000000 rc=0,0,0,0,0,0,0,0 want=0,1,2,3,100,101,102,103 seen=0,80000001,80000002,80000003,80000100,80000101,80000102,80000103 entry=0,a3203000,a3203000,a3203000,a3203000,a3203000,a3203000,a3203000, which is the pre-registered 'cores up' state read field by field: req=1 proves armcpu-smp=1 reached the driver, con=1 proves psciConduit() read /psci method=smc, rc=0 seven times proves the firmware accepted CPU_ON (the DENIED branch this area listed as unproven is now excluded), st=7 per secondary with fl=0 means each core woke its redistributor, enabled the GIC, installed its handler and passed its own affinity check, and entry=a3203000 is the kernel physical reset vector handed to PSCI with fl!=9 so ml_static_vtop never returned 0. want=/seen= differ only in MPIDR's bit 31 (Aff3-valid), which the driver's own test (ArmCpu.cpp:590) masks off: it compares (mpidr & 0xffff) with (affinity & 0xffff), so seen=0x80000001 is want=1 and seen=0x80000100 is want=0x100 -- seven cores, the right seven. seen[0]=0 and entry[0]=0 are 'nobody wrote that slot' (the boot core does not go through initCPU()/startCPU()), not a measured zero.",
  "Boot 89 (control boot, same bytes as boot 88) reproduced it: eight registered, seven started, eight running, and 296411 IPIs sent against 296290 received, with the r299 row identical to boot 88's field for field.",
  "Boot 90 reproduced it again on a different image (round300-v0.7.4): real=8 reg=8 start=7 run=8, the r299 row identical once more, 250500 IPIs sent against 250415 received -- so the bring-up path holds across images, not only across two boots of one image."]
limits = ["A faithful two-cluster description needs a kernel with MAX_CPU_CLUSTERS >= 2; this kernel does not have one, and r299 does not need it because no cpu node carries cluster-type.", "What boot 88 proved is presence, not scheduling quality: eight cores registered, started and taking IPIs, with no measurement of whether the scheduler spreads work the way iPadOS expects (no per-thread affinity or cluster-identity reading -- this ADT deliberately publishes one flat cluster).", "The online-CPU count is measured, not assumed, on both sides of the change: boot 87 read registered 1 of 8 topology slots with nothing started, boot 88 read real=8 reg=8 start=7 run=8."]
next_action = ["Boot 90 (round300-v0.7.4) is the third eight-core boot and the second image: r271 real=8 max=8 reg=8 start=7 run=8 with non-zero timer counts on all eight, r299 req=1 con=1 run=7 st=07777777 fl=00000000 rc=0 x7 byte-identical to boot 88's and boot 89's row, r270 sent=250500 recv=250415. So the bring-up path is reproducible across images, not just across boots of one image, and the desktop still did not move in the same fire (threads=24 shown=20 hidden=4 wait=22, sbport bb cnt=0 ql=6, debtor own=58:backboardd). What boot 90 was supposed to add -- a number for the missing census tail -- it did not: fire= and done= are themselves 0 rows on the card, so the image-vs-core-count question that boot 89 left open is still open, and the reset band is now three eight-core boots at 661-7xx, 746-7xx and 835-9xx s against four v0.7.0-v0.7.2 boots at 1681-1800 s or the 1800 s deadline: a distribution, with core count and image still unseparated. The next move on the core line is therefore not another core reading. Boot 91 (round301-v0.7.6, image d5c2c984) is a fifth eight-core boot and it gave r301 no reading at all -- no drain enter, no r301 row -- while its panic slot turned out to be a hybrid of two writers on the one shared gFlightBlock (event/dir 5/3 from flightPanicMark mixed with blocks=8 and a live stage/pid/comm=osanalyt from the request path, boot 88 byte-identical), so the marker record cannot be trusted until it owns its buffer and its magic. The next hand is therefore r302, shaped by sheng's panic path (which never touches the storage stack: RAM copy, single-owner writer buffer, magic header written last, counter-indexed blind write with no pre-read): marker of its own, magic of its own, and a sentence write that needs no later flush. Then one control round -- eight cores with armcpu-smp off, same image -- to split image from core count.", "r270 measured IPI delivery and its answer changed with r299: boots 57 and 87 read sent=0 recv=0 with sgi= all zero, boot 88 read sent=344711 recv=344557 with per-core sgi 72687,70129,60763,52767,31488,25582,17658,13580. So armcpu-spi-ipi stays retired -- the IPIs that flow are SGIs, exactly the path armcpu-self-ipi=1 enables -- and the earlier negative is now read as 'no second core existed to ask', not 'the scheduler never asks'.", "Boot 95 (round305-v0.7.15, image c52f1f00) is the sixth eight-core boot and the fourth image carrying the row: r271 real=8 max=8 reg=8 start=7 run=8, r299 req=1 con=1 run=7 st=07777777 fl=00000000 rc=0 x7, r270 sent=290272 recv=290132 -- identical field for field again, and this time the census head row at [616.939083] is the newest kernel line of the entire boot, so the cores are not the variable that stops the walk. The image-vs-core-count control (armcpu-smp off, same image) is still not run.", "Boot 96 is the ninth eight-core boot across eight images and reproduces the family field for field (r271 real=8 reg=8 start=7 run=8, r299 req=1 con=1 run=7 st=07777777 rc=0x7, r270 sent=278476 recv=278361, census head threads=16 shown=16 hidden=0 wait=16 run=0), so 'one core too busy' keeps getting weaker as an explanation for the missing census tail -- r306 proved the relay was never handed a row this boot (blocked=0/0/0 empty=0 cut=0 seen=0, and probe_seen=0 read again by the sink). The reset band gained a tenth vote at 576 s (642.7/~645/661/746/835/555/742/617/576). The smp-off same-image control round has still not been run; it is registered as r307 item (3) and is now the round that settles image-vs-core-count."]

