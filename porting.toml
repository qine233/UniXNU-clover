[[area]]
id = "cpu"
status = "implemented"
components = []
paths = ["drivers/ArmCpu/**", "scripts/make-clover-adt.py", "scripts/build-arm-driver.py"]
inputs = ["Eight Kryo 260 cores: cpu0 to cpu3 at MPIDR 0x0..0x3 (A53), cpu4 to cpu7 at 0x100..0x103 (A73).", "GIC distributor and CPU interface on SDM660; timer INTID 19; PSCI method SMC."]
configuration = ["The ADT enables all eight CPUs with cpu_regs = 0x0,0x1,0x2,0x3,0x100,0x101,0x102,0x103.", "kernel_args selects armcpu-timer-intid=19. armcpu-spi-ipi and armcpu-self-ipi are deliberately absent: they exist for the multi-core case, the online-CPU count has not been measured, and the driver's SPI numbers are hardcoded for a GIC with more INTIDs.", "The tick-count watchdog that ships with ArmCpu is disarmed unless clover-unattended= is passed."]
procedure = ["Regenerate the ADT with scripts/make-clover-adt.py and read the encoding back with the checker.", "Record per-CPU entry, timer interrupts and inter-processor interrupt delivery on a boot that reaches them."]
findings = ["The kernel builds ARM64_BOARD_CONFIG_BCM2837 with MAX_CPU_CLUSTERS 1. A cluster-type property with two clusters fails machine_routines.c:1099, so the ADT omits cluster-type and the eight cores form one flat SMP cluster.", "armcpu-spi-ipi is sheng's GICv3 shape, not a generic switch; clover's GIC uses SGIs for IPIs.", "Round82 measured the timer INTID and the tick; later rounds use the tick as the panic screen's coordinate.", "Round181 adds CloverInput to scripts/build-arm-driver.py's component list, archiving into build/clover-input, so the driver is compiled with the flags the XNU build recorded for IOPlatformExpert.cpo.json and audited for ARM64/iOS 17 like every other board driver. It deliberately does not inherit -mgeneral-regs-only -- that constraint belongs to CloverSdhci's post-panic screen -- and it needs no extra include path because InputRegs.h is quoted from next to the source. No CPU, timer or interrupt-arrival fact changed: the QUP interrupt INTID 129 is named in the report and never enabled, because every transfer here is polled.", "Round183 changes one line in scripts/build-arm-driver.py and no CPU fact. The board builders replay the XNU compile record build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/IOPlatformExpert.cpo.json -- 479 arguments, --target=arm64-apple-ios17.0.0, -nostdlibinc -- and a full XNU pass rewrites that record without any -isysroot in it, while the four device builders add -Wall -Wextra -Werror, so clang answers -Wincompatible-sysroot. The builder now pins the iPhoneOS SDK from xcrun only when the record names none, which keeps a record that already carries a sysroot authoritative. The eight-core list, the timer INTID, the polled-transfer rule and the deliberate absence of -mgeneral-regs-only are exactly as round181 left them."]
completion = ["Every enabled CPU reaches its entry point and timer handling runs on the boot CPU."]
limits = ["A faithful two-cluster description needs a kernel with MAX_CPU_CLUSTERS >= 2; this kernel does not have one.", "The online-CPU count is an assumption until a frame reports it."]
next_action = ["Measure secondary-CPU entry and IPI delivery after the root and dyld path are resolved."]

