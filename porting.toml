ntouched; boot counter 120): four of round339's six criteria are absent together -- zero r339: mark, zero r339: beatctl, zero r283: last reset in either branch -- and the cause is slot arithmetic, not the budget: sdhci_ring_slot is cursor % 64, cursor and seq increment together per successful write, so slot == seq % 64 for a boot, and the three one-shot rows printed by clover_unattended_begin before the ring is armed are exactly that boot's seq 0..2, which the next lap (seq 64..67, 68 writes into 64 slots) overwrites. Measured over 96 archived windows with a decodable driver ring: 50 wrapped and carry the row 0 of 50; 46 did not wrap and 31 carry it, the other 15 being boots 3..70, before the ring copy existed. Absence and wrap are the same fact in every archive. M-A stays an empty verdict, now with card evidence (no deadline record this boot -- the card's is boot 108's -- and both panic markers STALE), so the 0x77665500 rename remains neither confirmed nor refuted. M-F already held. The next hand is instrument, not board: pin the ring's first slots so periodic writes cannot reach the one-shot rows, keeping the region [64,192) intact so the tiling and window arithmetic do not move, and register that the reader's (slot, seq) wrap test must stop assuming the congruence. boot 121 is the control round for the refactor and is pre-registered to LOSE those three rows again -- if they are present before the pin lands, the reading to check is the maximum seq, not the fix.",
   "round342 (v0.7.60, CODE ROUND, the storage ring's one-shot rows get a home; built, gated, verified, archived and released -- the flash follows as boot 122, #727-#730): the hand taken is the second of the two candidates section Round339 (6) registered -- pin slots, not re-send on a beat -- because pinning adds no ring pressure and changes no existing row's text. drivers/CloverSdhci/SdhciLogCore.h claims four slots by row head (kRingPinnedSlots = 4, sdhci_pin_index, sdhci_ring_slot's floor + cursor % (slots - floor)), CloverSdhci.cpp computes the pin once and hands it to both the lba and the header, and the r174 row now prints pinned=4 so the card declares its own layout. The fourth pin is the declaring row itself: boot 121's decode line 144 shows what happens when it rolls -- the reader finds no declaration and falls back to round341's congruence forever. scripts/read-clover-log.py learns the rule from the card by head search (the first version was circular and N65 caught it), keeps five distinct silence sentences, walks past an empty pinned slot, and with pinned=None reproduces round341 exactly. Two instrument defects were found by this round's own negatives rather than remembered afterwards: N60 went red without naming itself because the runner forwarded a tail and the gate capped names at six, and both truncations are removed. 68 negatives, 0 problems. Build readings: kernel 2f0bf1e7 -> amfi d83dab76 -> normalized ff652788 (973 stamps), __text +972 B and __cstring +47 B against r341, payload c61da28866f059a6 = ~/clover-out/round342-v0.7.60-payload.img at 58,720,256 B, dual gates EXIT=0, verify EXIT=0 51 OK / 0 FAIL, display archive re-audited against this kernel and all 184 IOMobileFramebuffer addresses unchanged. NEXT, and pre-registered before the card is read (notes/development-log.md section Round342 (6)): cold-flash cache with run-clover-unattended.sh --flash-cache ~/clover-out/round342-v0.7.60-payload.img --boot-after-flash --allow-misc-bcb --out ~/clove