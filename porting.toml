inputs = ["SDHCI host at 0xc0c4000, eMMC card left by firmware in HS200, 8-bit, 200 MHz.", "GPT windows: OS, Cryptex1,SystemOS and the appended scratch Data window inside the userdata partition; cache is the payload partition.", "APFS container on the OS window and a 32 MiB APFS Data seed (volume UUID FC1A580E-2D67-48FC-B8CF-87422A319340) appended as a third SHNGROOT entry; mockfs root image and a three-module trust cache."]
configuration = ["drivers/CloverSdhci publishes the eMMC windows, switches the link to HS_TIMING=1, 8-bit and 50 MHz after identification, and proves it with LBA 1 before raising gBlockReady.", "drivers/CloverBlock exposes the windows to IOStorageFamily, publishes the Data window writable, and answers native_ram_block_volume_seed() / native_verified_block_manifest_sha384() for the owner mounts.", "clover-emmc=21 reads EXT_CSD and walks the GPT; clover-apfs=3 loads apfs.kext and publishes the OS volume; no rd= argument exists.", "patches/xnu-clover/zzy-clover-owner-root-trust.patch accepts the owner-provided root; zzy-clover-systemos-mount.patch turns the SystemOS union, boot manifest and Data mount on inside kern_exec.c and IOKitBSDInit.cpp."]
procedure = ["Verify GPT windows, the APFS container and the appended Data entry on the host before flashing.", "Run scripts/verify-userdata-window.py --crc --apfs on the exact sparse file a userdata flash will use; it refuses anything but OS + SystemOS + Data with the writable flag, a seed that does not hash to the pinned image, or an image past the partition.", "Cold-flash cache, and userdata only after the exact fastboot command is declared and approved; the Data mount writes only inside the appended 32 MiB window.", "Run scripts/check-clover.py and scripts/verify-clover-payload.py after changing the driver or the payload."]
findings = ["Round137 mounted the APFS root; round143 union-mounts the SystemOS volume at exec; round150 accepts the unsealed root through the owner audit instead of an rd= alias.", "The SystemOS volume carries the dyld shared cache. Round153 read a directory open, the main cache and .01 with err=0 and both header words dyld_v1 arm64, but dyld_flags=0x0 and syscall 536 is not entered.", "Round156 removed the 160 us per-word FIFO wait: reads are level-gated, use CMD18 in 32-block batches and CloverBlock hands over 16 KiB at a time. Round157 makes CMD12 R1b-complete and rejects DATA_CRC, DATA_TIMEOUT, DATA_END_BIT and ADMA_ERROR instead of accepting a damaged block.", "Round159 completed the link: after identification the driver sends CMD6 HS_TIMING=1 and BUS_WIDTH=8, programs the 50 MHz sdcc1_apps_clk_src row and reads the GPT signature at the new rate, falling back to 400 kHz if any step is refused. The same round appends a 32 MiB APFS Data seed as a writable SHNGROOT window, so the kernel's owner Data mount has a card-backed /private/var.", "The round159 frame shows the whole storage chain working: the three CloverBlock manifest/data rows, seed data bsd=disk5s1 bytes=33554432, APFS mount-complete volume DawnData with UUID FC1A580E-2D67-48FC-B8CF-87422A319340, then load_init_program for /sbin/launchd. dyld opened the cache directory, the main cache and .01 with err=0, read a dyld_v1 arm64 header from both and registered the 224 KiB .01 signature blob with err=0 in 189 ms; 16 KiB blobs take 7 ms, about 1-2 MB/s versus 25 KB/s before round156.", "Round160 adds the host gate for that image: scripts/verify-userdata-window.py expands the all-RAW sparse container, checks the SHNGROOT model and the Data bytes in place, and optionally recomputes the container CRC-32 and mounts the seed read-only to prove its volume UUID. The round159 archive passes with 9,416,212,480 bytes, three windows, CRC 0x6c29b693 and UUID FC1A580E-2D67-48FC-B8CF-87422A319340.", "The slow PIO path still measures about 25 KB/s, so a 16 KiB batch holds a buffer lock longer than XNU's 524 ms lock timeout. ml-timeout-lock-panic-scale=40 raises that deadline to about 21 s.", "The second frame from the same round159 image shows launchd running and spawning logd and dasd, but every child's exec fails in ubc_cs_blob_add with EBADEXEC (85), load_code_signature returns LOAD_FAILURE (4), and AMFI kills the process with 'dyld signature cannot be verified'; launchd respawns forever (pids 13621 to 13675). A host check of 044-76040-038.dmg puts logd 4882a798, dasd db318f4f, dyld b479f90e and launchd 1d52c697 all inside the 2478-entry static trust cache, and their blobs are structurally valid (logd: signature at 224912, 21120 bytes, fade0cc0, inner length 3108, five indexes), so the gate is before MACF and the suspect is the bytes the kernel reads or the LC_CODE_SIGNATURE offset/size.", "Round163 stops measuring and removes the last gate it can see: the prelinked AMFI exec hook at VA 0xfffffff004ab40e4 tests the signature check result and CS_REQUIRE_LV before jumping to the allow path. The 4-byte cbz (34 00 02 29) is replaced by b (11 00 00 14) at kernel.macho file offset 0x1a830e4, so the hook always takes the allow path. Only the payload is rebuilt from that kernel copy; the EBADEXEC root cause is untouched.", "The r163 frame proved that branch was not the killer: with check failed and CS_REQUIRE_LV clear the cbz is not taken. Round164 NOPs the real decision at VA 0xfffffff004ab416c (file 0x1a8316c, tbz w0,#0, 20 05 00 36 to 1f 20 03 d5), whose w0=0 means no valid signature and falls through to the kill at 0xab4210. The same round adds zzy-clover-dyld-cache-skip.patch: on a 4K kernel a 16K-signed blob is marked csb_native4k_skipped and cs_native4k_prepare returns without reading the whole codeLimit, while cs_validate_hash accepts the faulted page. The 3.7 GiB dyld caches at 1-2 MB/s would otherwise spend tens of minutes per exec deriving 4K hashes. EBADEXEC (85) from cs_blob_init_validated is still untouched.", "The round164 frame closes the AMFI question and opens the read-path one: the kill line is gone, yet every child still reports unable to create a validated cs_blob object: 85 and load code signature error 4, pids keep climbing, and mediaserverd ends with Too many corpses being created. The same frame carries APFS's own integrity failure: apfs_jhash.c:146 disk0s1 Data hash mismatch for 16384 bytes at offset 12128256 in compressed data stream 102 of inode 162 (expected jhash 2e6c78f0..., got 0d13...), Verification failed with error 94, then apfs_pagein_with_verification reports Corrupt read data. Here 102 is the data-stream number, not a byte count.", "Round165 treats that as a block-layer bug rather than a signature-policy one: every read command starts with drainReadFifo (read BUFFER until DATA_AVAILABLE clears) and prepareReadPath, any failed transfer or leftover FIFO triggers resetReadPath (SDHCI_RESET_DATA), and the first full batch runs a one-shot A/B check that compares two CMD18 reads with 32 CMD17 reads of the same 16 KiB. Disagreement sets gReadBatchTrusted = false and the rest of the boot reads single blocks. Every outcome prints CloverSdhci r165: readcheck lba=... batch=.../... single=... diff=.../... first=.../... m=... s=...; a rejected batch adds CloverSdhci r165: batch reads disabled for this boot.", "Round166 retires the batch instead of trusting it: gReadBatchTrusted starts false, so every read this boot is the single-block sequence every round before r156 used, and checkReadPath still prints the A/B row as evidence about its one 16 KiB sample. The same round adds the missing resetReadPath on readDataBlock's command-response refusal, and zzy-clover-exec-sig-bytes.patch prints dataoff, datasize and the first four words of the first eight code-signature blobs load_code_signature reads. The host side cleared the image first: the whole OS window mounts and reads file by file (~6 GB, decmpfs included) with no hash or I/O error, and launchd, dyld and trustd all carry a fade0cc0 SuperBlob at their LC_CODE_SIGNATURE offsets, so the wrong bytes can only be produced on the device.", "The r166 frame moves the wall from wrong read bytes to the writable container: launchd_cache_loader[22] exits with namespace 2 subcode 0xa (SIGBUS), initproc death panics the machine, and APFS prints apfs_scan_verify:2467: disk0s1 failed to read ... followed by Container corruption detected by apfs_scan_verify while Persona 1000 loads. APFS says read failure, not checksum mismatch, and the same boot still opens the SystemOS caches with err=0 after a whole boot of single-block reads, so the batch was not the cause. The only difference from r161, where the same driver read 3.7 GiB of cache, is that the Data volume was written during the persona step.", "Round167 repairs the write path and restores batched reads behind a three-sample gate. writeSettled waits out SDHCI_DATA_INHIBIT and then polls CMD13 until R1_READY_FOR_DATA and R1_STATE_TRAN; a batch or block that is not confirmed is not counted and prints CloverSdhci r167: write not ready lba= blocks= rsp= st= polls=. writeMultiBlock checks sendStopCommand and resets the data circuit on a dirty phase. writePioBlock drops the 160 us per-word gap for level-gated writes, and both request deadlines scale as frequency * 2 + blocks * frequency / 200. At mode 21 the driver reads EXT_CSD CACHE_SIZE and clears CACHE_CTRL (byte 33) unless it is already zero, logging CloverSdhci r167: write cache size= ctrl= off= rsp= st=. checkReadPath now reads the same 16 KiB three times (two CMD18, 32 CMD17) and sets gReadBatchTrusted only when all three agree exactly; it prints CloverSdhci r167: readcheck lba= ... trusted=... and then either batch reads trusted for this boot or single-block reads for this boot.", "The r167 frame has no panic: launchd keeps exec'ing, but the block layer reports disk5: general error several times, tx_flush:1173: disk5 tx xid 531 took 22708252 us to flush (22.7 s), then disk1: general error, apfs: buf_bread(0x20): disk1 buf_bread() failed, error = 5, ctx->dev_read(507): disk1 dev_get err 5 reading blkno 31134 and 91811, and apfs_fs.c:1033 apfs_fs_read_tree (gr=1074). Error 5 is the EIO this block device hands APFS; two disks failing at fixed block numbers in the same window means APFS is re-asking, not that the media rotted. Round168 treats the three short bounds as the cause: writeSettled now allows 4 s and prints CloverSdhci r168: write settle took ms polls= once past 500 ms; acquireBlockGuard waits 30 s and prints CloverSdhci r168: block guard waited ms once past 250 ms; read requests use 5 s + 20 ms per block and write requests 10 s + 200 ms per block; a batch read gets one clean retry before the single-block fallback and each single block gets three attempts; a write batch whose settlement times out is reset and re-sent once. Only a full ladder failure returns EIO and prints CloverSdhci r168: read gave up lba= blocks= done= st= or write gave up lba= blocks= done= once.", "The r168 frame answers the write question and opens the read one: disk5 no longer reports general error and the 22.7 s tx_flush is gone, but disk1 returns EIO (error 5) on every 16 KiB buf_bread at unrelated block numbers (580, 108169, 91610, 102029; num read errs 0 to 6), apfs_ntree_read returns retval 5, and every daemon's compressed file fails in decmpfs_fetch_uncompressed_data with errno 5. The same boot still reads the SystemOS caches with err=0, so the medium and link are intact. The driver was asymmetric: a failed write batch has sent CMD12 since r157, while a failed single-block read only reset the host data circuit. A card left in the data state ignores the reads that follow, turning one failure into a cascade.", "Round169 stops the card on every read failure: abortReadTransfer sends CMD12 (R1b) and then resets the host, and readDataBlock uses it on both refusal branches. waitCardIdle runs before a read's first command, waits for SDHCI_DATA_INHIBIT to clear and CMD13 to report R1_READY_FOR_DATA in TRAN for up to 30 s, prints CloverSdhci r169: card busy %llu ms once past 250 ms, and sends CMD12 before giving up; the request deadline starts after it. writeSettled allows 30 s instead of 4 s, the write request base is 30 s, and both write retry paths wait for the card before re-sending. reportReadFailure prints at most eight CloverSdhci r169: read %s lba=%u blocks=%u done=%u st=%08x lines tagged guard, idle, deadline or gave up, replacing the once-per-boot read give-up.", "The r169 frame closes the read-path question: no panic, no disk1 or disk5 general error, no buf_bread error = 5, no dev_get err 5, no decmpfs or ChunkCompression errno 5 and no apfs_jhash Data hash mismatch, and the only driver reading is CloverSdhci r169: block guard waited 31 ms -- 31 ms, not 30 s, with no card busy line and no stage-tagged failure, so the read path never entered its failure branch. Stopping the card with CMD12 before resetting the host, and waiting for DATA_INHIBIT plus CMD13 READY_FOR_DATA|TRAN before a read's first command, is what broke the cascade.", "Round170 changes only the kernel's own reporting on this path: shared_region_check_np now prints at most 48 lines and only when dyld_flags changes or the pid is 8 or lower, a successful open of /System/Library/Caches/com.apple.dyld prints at most 16 times while a failed open and the main cache and .01 opens stay uncapped, and every exec and every exit prints one line with pid, ppid, boot seconds and the exit namespace and code. The r169 frame is therefore evidence about the card and not about the process tree, and the cap is what should make the next frame readable.", "The r170 frame reads further than any previous one and names its own cause. launchd printed Early boot complete twice, exec and exit probes show different comm values with climbing pids and advancing boot seconds (exec pid=38 t=66 comm=accessoryupdater; exit pid=54 t=29 rv=0x4000 ns=-1 code=0x0 comm=zproxy), so the process tree is progressing rather than looping, and then initproc exited -- exit reason namespace 2 subcode 0xa (SIGBUS) panicked the machine. Every failed read in the frame reports the same stage: CloverSdhci r169: read guard lba=16526882 blocks=1 done=0 st=00000000 and seven siblings, st=00000000 meaning the host raised no error at all -- the read lost the block guard, not the medium. The holder is named two lines later: tx_flush:1173: disk5 tx xid 526 took 102001275 us to flush and xid 527 took 120000602 us, against 22.7 s in the r168 frame, so r167's CACHE_CTRL-off write-through had grown into a two-minute hold on the only card. Everything downstream follows that shape: disk1/disk3/disk5 general error, nx_buf_bread error = 5, _vn_rdwr_dev_read got err 5 at blknum 96950 through 92439 (num read errs 1 to 23), apfs_nstream_read retval 5, decmpfs_fetch_uncompressed_data err 5, and launchd's Missing executable detected for identityservicesd whose path lives on disk1. One more reading closes the read path: CloverSdhci r159: multi read fail lba=29165200 blocks=8 st=0x21 w=1024/1024 -- all 1024 words arrived, but st=0x21 is DATA_AVAIL|RESPONSE with no DATA_END, because this host only raises end-of-transfer for a multi-block PIO after the stop, so r157's criterion had been rejecting fully delivered batches and forcing single-block reads forever. Round171 changes four things accordingly. batchDelivered(status, words, total) accepts a batch whose word count is complete and whose DATA_CRC / DATA_END_BIT / ADMA_ERROR bits are clear, both drain loops break on DATA_END only when the FIFO no longer offers words, and a refused stop is retried once and reported (CloverSdhci r171: batch stop refused lba= blocks= (once)); writes still require delivered and stopped. The card's write cache is switched back on at bring-up (CloverSdhci r171: write cache size= ctrl= on= rsp= st=) and committed by an exported clover_emmc_flush_cache() that writes EXT_CSD CACHE_CTRL=0, waits for the card to return to TRAN, and writes 1 again, printing CloverSdhci r171: flush failed flushed= back= if either half is refused; CloverBlock counts outstanding writes in gWritesSinceFlush, commits only when that counter is non-zero, answers doSynchronizeCache / requestIdle / doSynchronize with commitCache(), reports the card's real cache state from getWriteCacheState, and writes through immediately for any write inside the logfs window because no filesystem sits above it to sync and the boot that writes the last record ends in a hard reset (CloverBlock r171: first commit blocks= cache= on= flushes=). Both guards become IOLocks the way sheng's NativeUfs serializes its window reads -- gBlockLock in CloverSdhci and gBatchLock in CloverBlock -- so a second caller waits instead of failing or silently degrading to one block at a time, and the wait keeps its r168 reading. kReadChunkBlocks goes 32 to 128, and because that constant had also been the trust gate's trigger, checkReadPath takes its sample from the request (min(blocks, 128), gate at four blocks) so a 16 KiB APFS read can still earn batch trust; the readcheck row gained sample=%u.", "Round172 puts reads on ADMA2 behind a word-for-word gate. The descriptor layout is transcribed from this tablet's own 4.19 CAF tree (drivers/mmc/host/sdhci.h: struct sdhci_adma2_64_desc is cmd u16, len u16, addr_lo u32, addr_hi u32, 12 bytes, ATTR_VALID 0x21, ATTR_END 0x02, and sdhci-msm.c:5646 sets NO_ENDATTR_IN_NOPDESC, so the last transfer entry carries END and there is no terminating NOP); the table is built in a page-aligned buffer, cleaned to memory, and read by the host while the CPU waits on the same DATA_END / content-error bits as the PIO path. checkDmaPath() then reads one request twice -- the r171 batch PIO path and ADMA -- and only sets gDmaTrusted when both complete and every word matches, printing CloverSdhci r172: dmacheck ... diff= first= ms=.../... kbs=.../... trusted=. The gate runs only after gReadBatchTrusted, and the DMA chunk falls through to the PIO batch on refusal, so the worst case on the frame is round171 with a line next to it. Writes stay on PIO deliberately: a wrong DMA write does not return EIO, it changes the card.", "Round173 gives the write side the same transport, behind a stricter gate. A DMA write is attempted once per boot, only on 16 blocks of the logfs window at kLogfsFirstLba + 4096, and only with the bytes that path read back a moment earlier: first a PIO control run (write, settle, read, diff) must prove the medium round-trips that run at all, then the DMA run must put the same words back and be read out again by single-block PIO, and only control=1 with diff=0 on both sides sets gWriteDmaTrusted. The LBA always comes from the command argument, so a malformed descriptor table can corrupt the content of that logfs run but cannot move a write into userdata. Settle failures are not charged to the eight-failure retirement because they are the card's programming time, matching the PIO batch. Panic-screen and bring-up logfs writes keep calling writePioBlock directly and stay outside this path.", "Round174 moves the readings off the panel and onto the card: every CloverSdhci verdict goes through sdhciSay, which prints the line and parks it in a 32-slot RAM ring, and flushVerdictRing writes the oldest pending records -- four per pass, two 512-byte LOG1 blocks each -- into kind-21 slots starting at logfs sector 64, clear of the panic window. The flush runs only from a transfer tail that already holds the block guard and uses the unguarded primitives, so it cannot queue a wait behind itself; a full ring overwrites its oldest line and counts the drop instead of blocking.", "Round175 puts a second producer on the same verdict ring without touching the transport: at each already-guarded request tail the driver drains up to 4096 kernel-log bytes before spending the guard on the card, keeps only allowlisted lines (clover r, CloverBlock, apfs, decmpfs, load code signature, AMFI, launchd, initproc, vm_fault, shared_region, panic), drops its own CloverSdhci lines because the ring already carries them, and pushes at most four per pass through the same unguarded single-block writer from round174.", "Round176 gives that second producer its own window instead of a second pointer: kind 21 keeps sectors 64..191 with 64 card slots and four lines per pass, kind 22 takes sectors 192..1215 with 512 slots and eight, both written by the same unguarded single-block primitive at the same three guarded tails, both indexed by their own cursor and sequence so a wrapped ring still reads oldest-first. The tee's own state lines stay in kind 21, which makes kind 22 mean one thing -- what the kernel said -- and lets the host assert that a kind-22 dump filtered by driver prefix counts zero. The write target is still the cache partition and the panic slots at sectors 0..31 are still untouched, with the round173 write gate at sector 4096 clear of both rings.", "Round177 changes nothing the storage stack measures: same drivers, same two rings, same payload geometry. What it closes host-side is the last open reading from the round162 respawn loop -- scripts/check-cs-blob-structure.py replays the 14 rejection rules cs_validate_csblob applies to a code-signature blob and accepts this boards launchd, so EBADEXEC was never the kernel misjudging blob shape; the blob the kernel rejected is structurally valid by the kernels own rules, and what it lacked were the bytes, which is the read and flush path rounds 171 onward address.", "Round178 makes the block guard change hands between chunks: a read or write run cuts after every 128 delivered blocks, records the time it owned the host, unlocks and re-queues. That is the second half of round171, which turned a refusal into a wait but left the wait at the head of a request, so a page fault at another volume could only ever be served between whole transfers -- the eight read guard ... done=0 st=00000000 rows in the round170 frame are reads the card never refused. Falling back to single blocks counts toward the same cut, so a boot whose batch is untrusted still cuts every 128 blocks. The flush region deliberately keeps one owner: it waits on the cards own cache programming, where a newcomer would only queue on the same DATA_INHIBIT bit.", "Round184 adds one write path to CloverSdhci and it is the path that runs when nothing else can: the exported panic sink clover_emmc_panic_append keeps its name and signature (the patcher's PANIC_SINK contract) but its body now appends the panic record through panicAppendText and then calls panicDrainRings (), which gives the tee kPanicTeePasses = 8 passes over the kernel msgbuf, keeps the newest kPanicDrainCap = 48 records of each ring dropping the oldest first, writes with the same unguarded single-block PIO primitive its own two panic writes already use, and stops on the first refused write rather than retrying. It cannot wait on a block guard a dead thread may be holding, and the worst case is bounded inside the 20 s reset window. Its own line, CloverSdhci r184: panic drain wrote=%u dropped=%u tee_passes=%u, is written after both rings drain so a quiet ring cannot be mistaken for an empty one. No geometry moves: still kind 21 at logfs sector 64 and kind 22 at sector 192.", "Round185 moves the driver's log window off logfs (p39, which the shipped boot now mounts as its own root APFS container) onto logdump (p56, 13320216..13451287, 64 MiB), and re-arms the rings from the card's own GPT entry alone: gPanicLogReady, gVerdictReady and gTeeReady no longer require that this boot read an existing record out of the report window -- the condition that let round127's flash lock them off forever, on every boot, with no hardware failure involved. Arming is gated on the entry being at least 192 + 2*512 = 1216 sectors long and reports either one armed line or one of two refusal lines that both say rings stay disarmed. The record format, the two rings' relative geometry and round184's panicDrainRings are unchanged; the r173 write-gate sample is the single judgement that moved with the window, and scripts/check-clover.py now refuses the old logfs-bounded form and the deleted mode-20 arming block.", "Round186 moves no window (the logdump contract from round185 stands: first=13320216, 1216 sectors) and touches no storage driver. What it adds is a reading about the volumes themselves: the probe reports the filesystem name, mount point and vfs flags of the last component a failed path did resolve on, so a boot task that cannot be found is reported together with the volume its parent directory lives on -- the difference between not staged, staged on the other volume, and mounted in the wrong union order. The round also records an unfixed build dead end: unixnu runs [kernel].archives before XNU and build-corecrypto-14.py nms every object in link.filelist, so an identity stamp that deleted kern_exec.o aborts the next build before the compiler ever runs; round186 got past it with a one-shot object pass rather than a fix.", "Round186 readings: the logdump window and the tee stayed armed for a boot that ran much longer than the previous frame -- the kernel ring carried 352 consecutive lines from 8.66 s to 37.23 s and the verdict ring held its 17 driver entries -- while the report window held no kind-20 record, which is the round185 blind spot again and not a new fault: no panic happened, so the drain that writes a report had nothing to write. The boot instead stops with usermanagerd alive inside the kernel after opening the dyld shared cache, which is the reading round187's syscall probe is built for.", "Round187 again moves no window and no storage driver. What the logdump ring will now carry is where the two stuck boot tasks went: patches/xnu-clover/zzzzz-clover-syswhy.patch prints unix-in (code and the first two argument registers) and unix-fail (the errno, excluding EJUSTRETURN and ERESTART) from unix_syscall(), plus mach-in from handle_svc() before mach_syscall(), all filtered to comm usermanagerd and keybagd. The driver rings and the tee are untouched, so a frame that shows these lines also proves the card is still being written after usermanagerd stops, which is what separates a process stuck inside the kernel from the whole channel going quiet.", "Round187 readings: the logdump ring came back with 1602 decoded lines, no kind-20 record, and a tee census of seen=1330 kept=513 throttled=493 idx=120071 stopped at the last block request, so the silence after 63.066398 means no syscall and no block I/O rather than a quiet kernel.", "Round188 moves no window and no storage driver: the logdump contract from round185 stands (first=13320216, 1216 sectors in one dd), and the round only adds kernel-side prints that the same tee copies into the same ring.", "Round192 gives the eMMC write cache back to the card, and the frame is the reason. r191 turned the cache on because EXT_CSD byte 33 read 0, then the first commit never returned: the r191 ring ends at flush-go cf=0 bound=30000 ps=01f800f0 inh=0 with no flush-c1, no flush-out, no sync-out and no r184 panic drain. The structural half is worse than the timeout: every in-commit record is mirrored to the same card through writePioBlock, so a card holding DAT0 for the commit refuses the records that describe it, and the commit is unobservable as well as unbounded. The bring-up therefore stops issuing switchExtCsd (kExtCsdCacheCtrl, 1); cacheOn is now cacheSize != 0 && cacheCtrlBefore != 0, which on this card is ctrl=0/on=0, so writes fall back to the write-through path r159-r170 ran, where each chunk already waits for READY_FOR_DATA in TRAN. F_BARRIERFSYNC returns immediately instead of parking a boot task, the r171 cache line still prints as the evidence that on=0, and the five-stage r191 flush body stays live for a card that ships with its cache on. The early return prints CloverSdhci r192: commit skipped size=%u on=%u once, so a skipped commit cannot be read as a missing flush path.", "Round194 caps the r187/r189 per-call probe lines at 48 in the kernel-ring tee (kTeeProbeKeepMax). The r193 dump is the reason: the ring's 512 slots were written 2048 times between 211.16 s and 312.89 s -- four wraps -- so the oldest surviving record was 101 s old on a 313 s boot, and the per-call lines are the highest-rate producer among the lines the tee keeps. On reaching the cap the tee writes one CloverSdhci r194: syscall probe lines capped at 48 line and drops the rest, so a truncated probe set is a reading rather than a silent absence. Nothing else about the transport changes.", "Round195 replaces round194's single 48-line probe budget with five per-class budgets in the kernel-ring tee: r153 24, r155 32, r170's opens 32, r187 24, r189 24; each class writes one CloverSdhci r195 line into the driver ring when its budget runs out, and r170's exec/exit lines stay uncapped. Round194's frame is why: capping r187/r189 only moved the flood, and r153/r155/r170-open (driven by fairplayd.A2 crash-respawning and re-reading the dyld cache) took 491 of the ring's 512 records, leaving the ring covering 110 s of a 912 s boot.", "Round200 adds no block path: the driver's only change replaces the r199 tee class with r200-ubrk, whose prefix covers the second breakpoint line and whose 64-record budget leaves room for both lines of all 24 traps without letting them push the exec/exit pairs out of the ring. The frame that carried this round's readings was written through the unchanged read/write/guard/flush code: 17 verdict records and 512 kernel lines, ending with the r195 cap line and the r184 panic drain written=0 dropped=0 tee_passes=8.", "Round212 changes no block-path command, but its frame ends the same way earlier: the flight chain is seq 53675..53686 at t=181878..181885 ms, twelve consecutive 8-block reads from lba 31076568 to 31076656 (Data volume offset 12,751,152 sectors, about 6.08 GiB), every one retiring with prev=read/8/0ms/8, ps=0x01f800f0 and no inhibit bit, and the last entry has no successor. The 4-slot beat ring holds seq 29..32 at 128857/132863/136863/168893 ms with miss rising 3->3->3->10, pend=0/0, so the last beat is 12,992 ms older than the last entry and the guard was already being missed. The kernel ring stops at [194.181939] CloverBlock r190: sync-out ok=1 pending=8, which is where the flight clock's zero point (about 12.3 s) puts the stall at 194.18 s -- earlier than round211's 352.19 s and round210's 911.92 s. The guard is taken by a request that never returns and acquireBlockGuard() uses IOLockLock with no timeout, so every later block request, the panic sink included, queues behind it forever.", "Round213 replaces the host IOLock with a ticket that has a bound: gHostOwner, gHostArmed and gHostTickets replace gBlockLock, a waiter gives up after kGuardWaitMs=60000 ms and reports the owner and stage instead of sleeping forever, and the ticket is a token that release compares and swaps, so a holder the watchdog has thrown out cannot clear a new owner. Before taking the ticket the waiter resets the controller (CMD and DATA), waits for the reset bit to fall, sends CMD12, clears INT_STATUS and resets the read path, so a request abandoned mid-transfer cannot leave the host inhibited for the next one. The old holder checks guardLost(token) at every loop head, in the read chunk hand-off and after c1/w1 of the commit, and leaves with a record rather than driving CMD6 against a controller that now belongs to someone else.", "Round213 can also end a request the holder cannot: the holder publishes a stage (0 idle, 1 entry, 2 idle wait, 3 check, 4 adma, 5 batch, 6 single, 7 settle, 8 tail, 9 tee, 10 flush, 11 commit) and the CPU0 beat reads stage, stamp, stage again, so a stage that has not moved for kGuardStuckMs=75000 ms is visible as stuck; the beat then resets the controller, drops the ticket and records one kind-20 line with stage, direction, lba, blocks, pid and held milliseconds. The flight entries grow from 22 to 35 words to carry stage, stage age, stuck and recovered counters, steals, the stage at which a holder was thrown out with its lba, blocks, pid and direction, the current pid, and the first 8 bytes of the caller comm -- the next frame can name the thread that read at 6.08 GiB.", "Round213 writes both properties into the gates: check-clover.py now fails if IOLockAlloc or IOLockLock appears anywhere in drivers/CloverSdhci, so the round212 hang cannot come back as a refactor, and verify-clover-payload.py requires the three r213 lines (ticket armed with wait and stuck bounds, guard wait gave up with owner and stage, guard stuck with stage, direction, lba, blocks, pid and held ms) in kernel.macho. scripts/read-clover-log.py decodes the 35-word record, prints the stage names and the caller comm, and its selftest covers the new columns.", "Round213 packages the prelink kernel at 52,215,808 bytes, sha256 2ce6bd02b2add96b18b3556d1f5ce17f91d772faadebe3b3cac6dfac036f9f82, patches AMFI at file 0x1ab20e4 and 0x1ab216c -- 0x1000 later than round212 because the driver grew -- and normalises the patched copy to 968 zeroed stamps with the derived LC_UUID and KCID, sha256 69c725297adb7b1219ee01f974e7d67d3f8bbc4ad49b6dffe7a3a06a6c24d730. The payload is 58,720,256 bytes, sha256 52020deca43374d4510aa2c90b6392c77c676fb23db45230827061e7a2bf4853, carrying in-volume kernel 913efcf11999bd47c59c5880a2bd61df46ce18d49bada7f1834b92646837f6b0, the unchanged 13,556-byte ADT shape (2166038e) and trustcache 7c369ce0. check-clover.py and verify-clover-payload.py both report ok, including the build-varying-fields and r213 host-ticket gates.", "Round213's frame is boot 2 with the ticket armed (r213: host ticket armed, wait=60000ms stuck=75000ms) and 37 driver rows that all carry boot 2; the flight chain now names the caller: 12 entries from t=407460 to 407468 ms, each an 8-block read at lba 28103552 upward by pid 133 (chronod) with a zero-completion predecessor, and four beats whose newest is t=377047 ms.", "The card stops taking writes at [418.465029], the last line the tee carried (apfs_trim_to_prev_fsize), with no guard stuck, no guard wait gave up and no drain enter, and the report window still holds 12 boot-0 records: the round213 watchdog either never fired or its software reset plus CMD12 could not revive the card, so the stop is a dead card again rather than a stuck ticket. The boot did live past 418 s, which is later than round209 (357.9 s) and round212 (194.2 s).", "Round214 rebuilds the watchdog recovery as a full card re-initialisation (clock off, power off, CMD0/CMD1/CMD2/CMD3/CMD9/CMD7, 50 MHz restore), records its outcome as one verdict line, and turns the panic landing into one bit: gFlightStuck non-zero writes boot-fastboot instead of boot-recovery, so the host learns whether the watchdog fired even when the card refuses every write.", "Round214's boot-3 frame closed the watchdog question: the ticket was intact (37 driver lines, stuck/recov/steal all 0), the last twelve requests were 8/64/128-block reads at 397.135-397.377 s that all completed in 145 ms or less, the kernel tee's last line was [408.1000164] sync-out ok=1 pending=464, the CPU0 beat stopped at 397.084 s, and nothing reached the card between 408.1 s and the 900 s deadline. So the card stopped answering under a request that still held the ticket, and the 75 s watchdog could never fire because every request's own deadline ends the hold first.", "Round215's boot-4 frame did not exercise the silence criterion because this boot's card never went silent: flight reached 436.258 s (last entry read lba=28752264 blocks=8 comm=contexts), the CPU0 beat reached 429.129 s, stuck/recov/steal stayed 0 and no r215 card recover line exists, so the wedge is intermittent (408 s before, past 436 s here). What the frame did prove is the kill point landing whole: backboardd killed SpringBoard at 448.547 s and the ring carries r212 drain enter boot=4 append_rc=112 probe_seen=3, panic tail lines=3 unseen=0, r184 panic drain wrote=11 dropped=0, drain exit probe=3 probe_drop=0, i.e. the three r207/r208/r211 probe rows all reached the card. The panic is no longer the deadline but a Kernel data abort at pc 0xfffffff0072cde20 lr 0xfffffff0072cdd6c, both inside _clover_task_threads (+0x180 and +0xcc): the round211 thread-stack walker faults on its own traversal. The six skst frames resolve to _psignal_internal, _kill, _unix_syscall, _sleh_synchronous, _fleh_synchronous and fleh_dispatch64_common, which is the sender backboardd's kill stack, not a SpringBoard thread, so they cannot say what SpringBoard was waiting on.",
 "Round292 read a flight region that has been on the card since round210 and decoded by nobody: read-clover-log.py --flight existed for eighty rounds and run-clover-unattended.sh never called it. Sectors 40..63 hold twelve block-request entries (pid, comm, lba, blocks, stage) and four beat slots carrying their own CNTVCT every 4 s. Decoding the archived windows shows that in both silent resets no new read or write request starts 11-12 s before the stop (boot 78: last beat 707.437 s, last entry 707.848 s -- an 8-block read at lba 30386448 by pid 224 recorded at stage=entry -- while the kernel tee printed to 718.840606 s; boot 77 is the same order at 1235.848, 1236.492 and 1248.429585), whereas boot 76, ended by the deadline, pairs the opposite way: entries at 1802.582 under a beat 126.2 s old, and boot 74 a beat 371.7 s stale, which is starvation -- clover_emmc_flight_beat() takes the host with a try and returns without writing a slot when the guard is held (CloverSdhci.cpp:3727-3757), so a stale beat means traffic, not a dead card. This finding then corrected its own first wording, which said the block layer went quiet: flightEnter is only called from the read path (:2787) and from clover_emmc_block_write (:5058). clover_emmc_flush_cache (:5801) and both ring flushes write the card through ringWriteRecord -> writePioBlock (:3411/:3430) with no entry and no guard, so tee rows kept reaching the card through those 11 s. What the flight region can say is that no new read or write request began; it cannot say the disk was idle and it cannot say the disk hung. The two arms that separate a stopped driver timer from a card that stopped answering are the last beat (a direct driver write) against the last tee row (which needs a guarded operation to flush it), read as card arrivals rather than as kernel timestamps. A second structural limit stays: an entry is written by flightEnter and a completion only shows up as the prev= of the next entry, so the newest entry cannot tell a request still in flight from a finished one nobody followed, and the beat cannot write a record while a request holds the guard -- which is exactly the case it would need to describe.",
  "Round293 names the exit that refused a transfer. Both DMA wait loops can leave two ways -- the per-request budget (frequency/5 + blocks*(frequency/20), 600 ms for 8 blocks at 19.2 MHz) or this driver's own kCommandSpinLimit spin guard -- and the row printed \"deadline\" for either, so boot 79's four read refusals and one write refusal could not say whether the card held the data line past its budget or the driver stopped looking first. The stage is now spin|deadline|error|stop and both rows end in ms=/budget=/polls=; check-clover.py counts the two new ternaries and rejects the old literals, verify-clover-payload.py pins the two full format strings in the shipped kernel. Card churn stays demoted with evidence, not taste: 4-9 re-inits appear in every archived boot including the ones that ended in a clean panic, and the reporters cap at 8 lines -- chronic noise, not the killer.",
  "Round294 spends a control on the flight region rather than a new instrument: the DMA refusal rows r293 added are on the card, and boot 80 shows what they can and cannot say yet -- its one refused transfer is named cmd (an r173 write command phase, st=00018000) and prints ms=0 budget=0 polls=0 because the command phase measures nothing, so the spin-versus-deadline split still awaits its first data-phase refusal. Card churn is counted, not argued: two r215 re-initialisations on boot 80 (n=1, n=2) against the same chronic pattern. And boot 80's flight group self-attributes -- 12 entry records and 4 beat records all stamped boot 80, while the deadline slot and both panic markers still hold boot 76 and print un-stamped / STALE, which is exactly the failure r293 was built to prevent.",
  "Boot 81 is the first frame where round293's DMA exit names bite, and they all bite the same way: four refused transfers, every one named deadline (ms=1147 budget=600 polls=62 / ms=1213 budget=600 polls=29 / ms=6208 budget=600 polls=17 / ms=2387 budget=600 polls=96, with st=00000003 err8=00 hctl=3c), and spin never appears. Every wait therefore ran past its own per-request budget before giving up rather than this driver stopping early -- the distinction the stage name was added to make, with its first reading. All four are reads, and they sit in the same boot that silently resets at 997 s, so the names say the transfer genuinely stalled and do not yet say the card is the culprit; the budget is frequency-scaled (frequency/5 + blocks*(frequency/20) = 600 ms for 8 blocks at 19.2 MHz) and ms=6208 is ten times it.",
  "Round316 moves the CloverBlock manifest walk and request arithmetic into a bus-free header (drivers/CloverBlock/BlockCore.h) and gives it a host model that the build gate runs rather than merely reads: 15 groups in drivers/CloverBlock/tests/clover_block_host.cpp compiled by scripts/test-clover-block.py, asserting card-absolute LBAs published from partition-relative offsets, row order independence, the per-window identity and 32-byte digest, each of the nine refusals with the number it prints, the half-open log-window overlap, and that reportMaxValidBlock() and the request bound cannot disagree about the last serviceable block. Behaviour is preserved line by line: every refusal keeps its legacy panic tag through manifestStep(), and the zero-length-buffer hole stays open on purpose -- blk_admit_request() takes has_buffer explicitly so the model can assert the hole instead of quietly turning it into a new refusal. Two contracts were corrected rather than worked around: scripts/verify-clover-payload.py had to stop looking for the SHNGROOT bytes (the optimizer folds eight consecutive ASCII into immediates, so that string is in no image while each of the nine refusal CStrings is present once), and drivers/CloverBlock/README.md had to stop citing check-clover.py by line number -- a file edited nearly every round, whose own pins moved under it this round..",
  "Round318 touches storage only through the tee: drivers/CloverSdhci/CloverSdhci.cpp gains one probe class (\"clover r318: \", \"r318-input\", budget 32) and its exemption prefix, so the decoded and raw rows of one I2C segment cannot be split by a per-pass cap -- round181's bus= column was the masked word, so a cap that kept the decoded row and ate the raw one would restore exactly the blind spot the round removes. No block I/O, window, cache or flush behaviour changes, and the kernel is rebuilt from the same 12 archives.",
  "Round320 is a board/ADT change made against sheng, not a driver change. boot 107 moved the desktop stall forward and named it: the framebuffer path is live (r180's presented/copy/scanout/retire all ok), but SpringBoard's main thread idles on one unanswered PreBoard data-migration XPC (migrationpluginwrapper spawns t=653, port 0x6003 stuck pr=0 to=0 for 140 s, census wait=19 run=1) -- neither GPU nor touch. sheng boots this same image to the desktop, and the one /chosen difference that accounts for it is ephemeral-storage, which make-sheng-adt.py:148 quotes as the switch os_variant_uses_ephemeral_storage() reads so datamigrator skips every migration and SpringBoard leaves PreBoard. clover never set it: make-clover-adt keyed the property off packed_data_ramdisk alone, and this board's root is the volatile --data-ramdisk mockfs (packed_data_ramdisk=false), so it was structurally out of reach. Round320 decouples the switch onto writable_root = data_ramdisk or packed_data_ramdisk, so the volatile root now carries /chosen/ephemeral-storage = u32(1); a persistent Data root still excludes it (persistent_data), matching sheng's rule that a non-volatile root is not ephemeral. No register write, no boot arg, kernel byte-identical to r319 (verified: the delivered payload's in-volume kernel is 0 bytes different from round319's). check-clover requires the property present AND valued u32 1 -- presence alone is the fifteenth layer's trap, because os_variant tests the value, and u32 0 leaves SpringBoard in the exact PreBoard wait boot 107 caught -- and verify-clover-payload pins it in the delivered image. This is a falsifiable experiment: if boot 108 still idles on 0x6003, the ephemeral hypothesis is excluded and the next look is the migrationpluginwrapper service itself, not another ADT word.",
  "Round321 is the boot 108 read-back of round320, and it resolves the experiment the other way round320 pre-registered against: the ephemeral property did not fail, it moved the gate. The boot 107 named stall (port 0x6003, migrationpluginwrapper) is gone from boot 108's window -- SpringBoard's main thread (lo=27:SpringBoard+ps, tid=0x129, op=40700420e) is now blocked every beat, t=878 to the readback bottom at t=1745 (through the 1800 s deadline), on one synchronous mach_msg whose remote port 0x2f03 has both its owner (ro=) and holder (ho=) reading pid 122 = chronod. The 12 to=ffffffff rows on other tids (0x413/0x4b4) are sends to MACH_PORT_DEAD, which return MACH_SEND_INVALID_DEST immediately -- noise, not the hang. So skipping migration with ephemeral-storage carried SpringBoard out of the PreBoard data-migration check and one step further, to a chronod round-trip that chronod (which is alive -- it owns 0x2f03) does not answer. The honest scope: the block MOVED (measured -- boot 107 and 108 name the blocking port on the same per-beat r221 sampler), but no instrument reads os_variant_uses_ephemeral_storage()'s return value directly, and migrationpluginwrapper spawned at t=653 is below the 512-line ring horizon by readback, so 'because ephemeral' is a strong inference while 'no longer on the migration port, now on the chronod port' is the reading. Next is the same follow-the-wait ladder that named backboardd's owner (r230/r267/r303), retargeted at chronod pid 122, and it must ride the per-beat r221/r223 family (which lands) rather than the census tail (0 rows across boots 94-108).",
  "Round322 reverts round320's ADT change on a corrected reading of sheng. Round320 added /chosen/ephemeral-storage citing make-sheng-adt.py:148 as proof sheng skips migration to reach the desktop; boot 108 showed the skip only moved the stall (SpringBoard left the migration port and now idles on a chronod round-trip), and sheng's real desktop boot uses persistent_data=true with NO ephemeral-storage (make-sheng-adt.py:95: \"no ephemeral-storage, so first-boot data migration runs\") -- round320 cited the wrong line. The porting lesson generalizes: os_variant_uses_ephemeral_storage() is a LIE you tell the whole of userland, not a migration-only switch, so on a board whose /private/var is actually the card's real mounted window (clover [userdata] mmcblk0p64) asserting a volatile root may itself be what keeps a daemon (chronod) from answering. This round is the cheap falsifiable A/B, kernel byte-identical to r319/r320: make-clover-adt stops emitting ephemeral-storage (ADT back to 14384 bytes, -40), check-clover and verify-clover-payload flip from require-present to require-ABSENT (the r120 root-matching negative shape), both title needles name r322. Product round322-v0.7.34-payload.img 1aebc9f7..., dual gates EXIT=0 (verify 51 OK / 0 FAIL). boot 109 pre-registers both branches: back to boot 107's migration wait => clover lacks sheng's complete persistent Data substrate and route 2 (a real persistent root) is the answer; migration completes and chronod answers => round320's skip was the block itself. No instrument reads os_variant's return value directly, so either way the causal chain is inferred from the card's port names, not measured.",
  "Round323 is the boot 109 read-back of round322 (no new image; board 1aebc9f7 stays on the card, user manually recovered it to TWRP). The revert is validated as route 1: reverting ephemeral did NOT fall back to boot 107's migration wait and did NOT re-trap -- on the same byte-identical kernel and same per-beat r221 sampler, boot 108's ro=122:chronod appears 8 times through past t=1495 while boot 109 has it 0 times, datamigrator[179] actually spawns (apply-protobox, migration runs), and SpringBoard's main thread moves past chronod to launchd (@CPX@) then cfprefsd (pr=56ff00). The display path is engaged for the first time ever: boot 108 has 0 r180 framebuffer clients, boot 109 opens five IOMobileFramebufferUserClient processes (pid 86/87/58/56/74) and runs a full swap->copy(9.2 MB)->scanout ok->retire->present cycle (swap#1->#3, presented=2). This directly serves route b (real render path): the missing-frame gate is no longer the blocker. But it is NOT desktop: frame#1 colours report a whole black screen (ff000000 x2,262,414) plus one 450x142 box (other=41543), presented stops at 2, and the new debt is backboardd (tid=0x12d now ro=58:backboardd, port 0x4203; r262 census pid=58 threads=22 wait=21 run=1). So the stall moved a second consecutive cell boot 107->108->109 (migration->chronod->backboardd). Two instrument-horizon limits stay honest: (1) no instrument separates 'idle at a (partial) desktop waiting on backboardd events' from 'hung on a backboardd round-trip' -- presented=2-then-silent leans hung, but the user pulled it before the 1800 s deadline so there is no clean landing; (2) the board does not auto-return to TWRP because the on-card WDT reads en=0 armed=0 all boot (r281) -- a hang never trips panic or a hardware bite, so r196/r198's auto-land works only for a panic/reset, not a deadlock. Next ladder: retarget the per-beat r229/r262 family from SpringBoard onto what backboardd itself waits on, and name who draws the one box / why SpringBoard commits only that one view.",
   "Round342 is this area's round: the driver ring stops erasing its own one-shot readings. MEASURED CAUSE, on two cards rather than in a comment: under round341's rule sdhci_ring_slot() returned cursor % 64 while cursor and seq incremented together, so slot == seq % 64 held for every record and the head of a boot's own ring was overwritten by its tail. boot 120 wrote 68 records and lost seq 0..3; boot 121 (~/clover-out/boot121-card.bin, 623,104 B; decode ~/clover-out/boot121-card.txt, 1912 lines) wrote 72 and lost seq 0..7 -- the 64 decoded driver records carry seq 8..71, 64 distinct slots, kinds {21:50, 25:14}, all boot 121, 0 congruence counterexamples and 0 header problems. All four row heads this round pins are 0 hits in that decode, so section Round339's M-B/M-C/M-E stay empty judgments: the absence was the ring's arithmetic, not the board's answer. FIX, in the bus-free layer drivers/CloverSdhci/SdhciLogCore.h: kRingPinnedSlots = 4 with four head literals (kPinHeadLastReset, kPinHeadBeatCtl, kPinHeadMark, kPinHeadRingArmed) whose lengths derive from sizeof rather than a second typed number; sdhci_pin_index(text, length, which) claims a slot by row head for the driver ring only and returns -1 otherwise; sdhci_ring_slot(which, cursor, pin) returns pin when pin >= 0 and floor + cursor % (kRingCardSlots[which] - floor) otherwise, floor 4 for the driver ring and 0 for the kernel ring. sdhci_ring_lba() and sdhci_build_header() take that same pin, computed once in CloverSdhci.cpp's ringWriteRecord() -- one derivation, two consumers. WHY FOUR AND NOT THE REGISTERED THREE: the fourth head is the r174 arming row that declares the layout, now printed as 'CloverSdhci r174: verdict ring armed lba=%u slots=%u pinned=%u'. If the declaring row keeps rolling it is erased by the same arithmetic, the reader never learns the rule and falls back forever -- boot 121's decode line 144 is that exact sentence. Four is the minimum that closes, not a spare. WHAT DID NOT MOVE: the driver region is still [64,192) with 64 slots, the kernel ring [192,1216) still has 512 slots with nothing pinned and its congruence intact, the window is still 1217 sectors, the ten header words keep their positions and kinds, and the 480-byte clamp is untouched -- only word 7's derivation changed, and only for the driver ring, so round340's tiling leg and round341's window arithmetic are regression-pinned rather than broken. The host model drivers/CloverSdhci/tests/clover_sdhci_host.cpp gains a pinned_slots case that writes four pinned rows beside 200 periodic ones and reads every slot back, showing the boot word advance in a rolling slot while a pinned head keeps its home. Negative N62 earned its place during the round: kRingPinnedSlots = 3 beside a four-entry table compiles and passes every existence needle while silently dropping the declaring row back into the rolling branch. NOT YET JUDGED ON THE BOARD: boot 122 is pre-registered as P-A..P-E in notes/development-log.md section Round342 (6) -- the arming row present in slot 3 with pinned=4, the three one-shot rows present together in slots 0/1/2, congruence counterexamples appearing only in the rolling branch, the region and kernel ring unbroken, and M-A explicitly still allowed to be an empty judgment. This round changes where a reading is stored, not the behaviour of any peripheral.",
  "Round344 keys the driver tee table on the new display heads: r343-dispstate becomes r344-dispstate, and the per-record family adds r344-dispclient with its cut branch, budgets 96/8/128/8 and one per-pass exemption token (r344-disp). The swap family keeps its r343 head because its shape did not move. No storage code, ring arithmetic, DMA path or verdict class changes.",
  "Round343 touches CloverSdhci only to keep its tee-row tokens in step with the display probe: the r329/r335 tokens become r343, per-token budgets unchanged (96/8 and 64/8). The ring geometry round342 pinned -- driver region [64,192), four pinned slots, kernel ring 512 slots, 1217-sector window -- is untouched, so boot 122's card (four one-shot rows present, rolling congruence broken in exactly the 60 rolling slots, absent seq the four squeezed out) reads identically under round343.", "Round354 adds patches/xnu-clover/<83z>-clover-r354.patch to the same series the storage probes ride; no ring geometry, LBA window, tee budget or cadence moved. The gate pins the patch's bytes in all three copies and its series position after r352, so the storage reading path this area owns boots unchanged -- the fix only keeps the beat thread alive long enough to write its rows.", "Round355 adds one tee class to CloverSdhci, { \"clover r355: bbonceh\", \"r355-bbonceh\", 64, 0, 0, 0 }, and the \"r355\" token to the per-pass exemption chain: the holder names ride the same r331 burst as the counts that introduce them, and a cap that keeps once= while dropping the bbonceh rows is the half-pair r249 refuses. Ring geometry, LBA windows, the pinned one-shot slots and every other budget are untouched, so the r341 congruence and r342 pinning readings still apply.", "Round356 adds two tee classes to CloverSdhci, { \"clover r356: holdrs\", \"r356-holdrs\", 64, 0, 0, 0 }, and { \"clover r356: holdrsh\", \"r356-holdrsh\", 64, 0, 0, 0 }, with the token \"r356\" in the per-pass exemption chain. The two entries are ordered so the longer name is listed first: teeProbeClass answers with the FIRST prefix match and \"holdrs\" prefix-matches \"holdrsh\", so the wrong order would let the naming rows spend the main row's budget and starve the pair -- the gate pins both entries and their order. Ring geometry, LBA windows, the pinned one-shot slots and every other budget are untouched.", "Round358 changes drivers/CloverSdhci only in its tee table: r358 classes for holdrsh/holdrr/holdrs and the new hoprr, listed holdrsh-before-holdrs and exempt from the per-pass cap. The ring geometry round342 pinned -- driver region [64,192), four pinned slots, 512-slot kernel ring, 1217-sector window -- is untouched, so a boot-122-style card reads identically.", "Round359 changes drivers/CloverSdhci only in its tee table: r359 classes for bbth/bbt/psmrcv, listed bbth before bbt because the first-prefix matcher would otherwise send the header into the per-thread budget, and exempt from the per-pass cap. The ring geometry round342 pinned is untouched.", "Round360 changes drivers/CloverSdhci only in its tee table: one r360-rembits class and its per-pass exemption. The ring geometry round342 pinned is untouched.", "Round361 changes drivers/CloverSdhci only in its tee table: two r361 classes (remkobj, remcall) and their per-pass exemption. The ring geometry round342 pinned is untouched.", "Round362 changes drivers/CloverSdhci only in its tee table: one r362-remcall class and its per-pass exemption. The ring geometry round342 pinned is untouched.", "Round364 changes drivers/CloverSdhci only in its tee table: one r364-remwin class and its per-pass exemption. The ring geometry round342 pinned, the window arithmetic and the cadence are untouched; the row is a read-only window read on the sampled task's map.", "Round365 changes drivers/CloverSdhci only in its tee table: one r365-remtrap class and its per-pass exemption. Ring geometry and cadence untouched.", "Round366 changes drivers/CloverSdhci only in its tee table: one r366-rembody class and its per-pass exemption. Ring geometry and cadence untouched.", "Round367 changes no driver: the tee table is untouched, ring geometry and cadence are unchanged. The record entry exists because board.toml moved with the title.", "Round368 changes no driver: the tee table is untouched, ring geometry and cadence are unchanged. The record entry exists because board.toml moved with the title.", "Round369 changes no driver: the tee table is untouched, ring geometry and cadence are unchanged. The record entry exists because board.toml moved with the title.", "Round370 changes no driver: the tee table is untouched, ring geometry and cadence are unchanged. The record entry exists because board.toml moved with the title.", "Round371 changes no driver: the tee table is untouched, ring geometry and cadence are unchanged. The record entry exists because board.toml moved with the title.", "Round372 changes no driver: the tee table is untouched, ring geometry and cadence are unchanged. The record entry exists because board.toml moved with the title."]
completion = ["The OS root mounts, the SystemOS volume is union-mounted, /private/var is the card's Data window, launchd executes, and dyld maps the shared cache without a MAC or signature refusal."]
limits = ["The Data window is a 32 MiB scratch seed, not the full /data partition; it is writable but small, and it is appended between the two GPT copies rather than declared by the GPT.", "The launchd-to-daemon path is blocked inside ubc_cs_blob_add: the kernel rejects each main binary's signature blob with EBADEXEC (85) before MACF, even though the same file's cdhash is in the 2478-entry static trust cache and the host blob is structurally valid. The suspect is what the kernel read, not the trust decision. Round164 removes both AMFI deny branches and skips the whole-file 4K hash without explaining the 85; the most likely shape is a truncated blob read (logd's signature is 21,120 bytes at file offset 224,912, crossing a 16 KiB batch boundary).", "The shared-region mapping syscall 536 still has no reading: each exec dies in the respawn loop before the mapping result can be observed. With AMFI bypassed this is the next candidate wall.", "There is no UFS, virtio-block or native verified-root component; sheng's storage stack is SM8550-specific.", "The 85 and the APFS read failure are not yet proven to share one cause. Round167 repairs three write-path defects and the missing CACHE_CTRL clear, but the r167 image has not been measured; if APFS still reports a corrupt container after this flash, the Data seed itself needs a host-side check before another firmware change.", "Batch reads are trusted again only when the two CMD18 samples and the 32 single-block samples of one 16 KiB read agree word for word; any disagreement keeps the whole boot on single blocks, so a frame with trusted=0 is a read-path verdict, not a performance one.", "A checkpoint flush still took 22.7 s even with batched writes, so write throughput remains the slowest link; the r168 settle reading gives the card's own programming time before the clock, bus width or DMA path is changed again.", "The r167 frame cannot show whether the write cache was turned off or whether batch reads were trusted: both lines had scrolled out of the photo, so the EIO diagnosis rests on the two disk error rows and the flush time, not on those readings.", "Round172's ADMA2 path is a second transport with no measurement behind it yet. It cannot make a boot read wrong -- the gate is a word-for-word comparison against the already-trusted PIO batch, every refusal falls back to PIO, and eight failures retire DMA for the boot -- but until the frame shows dmacheck ... trusted=1 with its two kbs= numbers, the throughput this port can claim is still round159's 1-2 MB/s. The write path is left on PIO on purpose: a wrong DMA write does not return EIO, it changes the card, so it needs a pattern write and a PIO read-back before it gets the same trust.", "The descriptor layout is transcribed from this tablet's own 4.19 CAF tree, and the CAF tree is a maintenance dependency, not a contract: if a later Qualcomm kernel changes the 64-bit descriptor field order or reintroduces a terminating NOP descriptor, the on-device dmacheck row is what catches it, and the checker pins the provenance strings so a silent divergence shows up as a failed check rather than a corrupted read.", "Round173's write gate is a second transport with no measurement behind it either: until a frame shows wrcheck ... control=1 diff=0/0 trusted=1, the only write throughput this port can claim is round170's measurement of a 102 s checkpoint flush. The gate costs one thing it should be said plainly: it rewrites 16 logfs blocks with their own bytes, so a medium that cannot hold a write inside that window loses those log slots while keeping userdata untouched -- that is the whole blast radius, and it is why the sample run lives in logfs rather than on the root volume.", "Round174 spends up to four records -- eight block writes -- at the tail of each guarded request, so a boot whose requests never reach a tail keeps its verdicts in RAM and writes nothing, and a ring that fills before a flush loses its oldest line (the drop is counted, never blocking) rather than the card.", "Round175 shares that 32-slot ring with the kernels own lines, so a busy daemon can push a driver verdict out of it before the card ever sees it; the per-pass caps -- 4096 bytes scanned, four lines pushed -- and the tee kept=/throttled=/lap= counters are what separate an evicted reading from a reading that was never made. Widening the channel means another window on logfs, not a second pointer in this one.", "Round176 took that other window, so eviction is now bounded per producer: 512 kernel lines and 64 driver verdicts, each overwriting only its own oldest entry. What is still lost is depth, not the other speaker -- a boot with more than 512 allowlisted kernel lines loses its earliest kernel text, and a driver that says more than 64 things since the last flush loses its oldest verdict, which the dropped counter reports. The tee census is capped at 12 lines for the same reason round170 capped the panel: bookkeeping must not become the content."]
next_action = ["Round216 fixes the round211 thread-stack walker before it asks anything else: the boot-4 panic is a Kernel data abort with pc=0xfffffff0072cde20 and lr=0xfffffff0072cdd6c, both inside _clover_task_threads (+0x180 and +0xcc), so the walker faults on its own traversal at the kill point and destroys the frame it was written to explain. Disassemble that function and bound the thread/stack walk (null and tag checks before each dereference, stop at the task's thread count instead of chasing the list) so a snapshot cannot panic the kernel.", "Then take the receiver's stack, not the sender's: skst currently resolves to backboardd's _psignal_internal/_kill/_unix_syscall chain. In the psignal path, match the target pid or task and walk the target's threads, so the next frame says what SpringBoard was waiting on when SIGKILL arrived.", "The r215 recovery stays armed but unproven: keep the silence criterion and the per-request ladder as they are, and only re-read them once a frame actually goes silent; this boot's card lived past 436 s with stuck/recov/steal at 0.",
  "Round316 pre-registers one boot 103 reading that needs no board-side work to interpret: the clover-apfs=3 path prints CloverBlock r159: boot os=X+Y system=Z+W data=U+V, and those six numbers come from exactly the arithmetic the new host model walks. If they match the same card's earlier frame, the refactor changed no semantics and BlockCore.h becomes the reference; if one differs while CloverSdhci's reported GPT extent did not, the pure layer and the old implementation disagree somewhere -- feed that manifest to the model, it names which of the nine refusals it is. A root-magic / root-count / *-bounds / *-geometry / datawin panic is round159 classification, not an r316 regression; and a missing row whose panic sink shows the card was made idle before the first write means the walk never ran, which must not be read as bad arithmetic.."]

