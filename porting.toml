findings = ["sheng's input area uses ShengHidInput, ShengNovatekTouch and QcomGeniSpi for an SM8550 Novatek sensor. Those drivers do not match this board's controller.", "Round164 leaves the input inventory unchanged.", "Round167 leaves the input inventory unchanged.", "Round168 leaves the input inventory unchanged.", "Round169 leaves the input inventory unchanged.", "Round170 leaves the input inventory unchanged.", "Round171 leaves the input inventory unchanged.", "Round172 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round173 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round174 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round175 adds no input driver and no device-tree fact; the touch panel is still untouched. The board.toml edit this round is the menu title, nothing else.", "Round176 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. The board.toml edit this round is again the menu title, nothing else.", "Round177 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. The board.toml edit this round is again the menu title, nothing else.", "Round178 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. The board.toml edit this round is again the menu title, nothing else.", "Round180 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched. Its board.toml edits are the display archive swap in [kernel].archives, three display boot-args and the menu title.", "Round181 is the first code on this bus. drivers/CloverInput transcribes QUP v2 I2C-3, SDM660 GCC (CBCR/RCG) and TLMM from three named sources and writes the disagreements out instead of smoothing them: the device's own clover.dts (i2c@c177000 with children focaltech@38 and gt9xx@5d, i2c_3_active, ts_int_defalut putting gpio67 at 16 mA, interrupts = 0x00 0x61 0x00 so SPI 97 = INTID 129), mainline 7.2.y (i2c-qup.c, gcc-sdm660.c with GCC_REG_OFFSET(reg) = 0x100000 + reg, pinctrl-sdm660.c, clk-rcg2.c, clk-branch.c, edt-ft5x06.c) and Xiaomi's 4.19 CAF (i2c-msm-v2.c, drivers/input/touchscreen/gt9xx_zql6019/gt9xx.c). The one real disagreement is the bit-clock field packing, resolved toward mainline because its arithmetic can be checked by hand while the vendor tree's own header, driver and clk code disagree with each other. Mode 3 asks each candidate the first read its own upstream driver asks -- 0x8040 for Goodix (2-byte big-endian register), register 0x00 and the 22-byte name at 0xBB for EDT/FocalTech -- because a NACK only means something against a real register. Transfers follow the upstream shape: SW_RESET at the head of each one, FIFO mode with zero MX counters and REPACK_EN, rx tags written into the output FIFO, and a completion test stricter than upstream because the done bit and the byte count have to agree or the transfer is reported as a timeout rather than as short data.", "Round182 repairs a defect in this area's own header: kQupPhys shipped as 0x00c17700 -- six digits, a hundredth of the real QUP base, a window with no QUP in it -- and is now 0x0c177000, decoded from this board's facts dump (i2c@c177000/reg 0070170c 00060000). No r181 reading was affected by the shape of the mistake, because that boot's report printed the declared geometry rather than reaching the bus, which is the whole reason round182's checker binds driver-header bases to device-tree nodes instead of trusting a review.", "Round183 adds no input driver and no device-tree fact; edt-ft5406 over blsp_i2c3 is still untouched and the QUP base repaired in round182 is not re-touched. Its board.toml edits are the fifteenth archive entry, the clover-dsp=3 argument and the menu title. The DT binding the checker now runs covers this driver's windows and the new DSP windows in the same table -- 30 addresses against 230 device-tree nodes -- so a one-digit base typo in any board driver header fails the round, not the photograph.", "Round184 parks CloverInput rather than removing it: the archive, the defconfig line, the PMGR schedule position and every register shape in the driver are untouched, and only clover-input=3 leaves the boot arguments, so the instrument is one comment away from running again. The question it was built to ask is answered by the v0.5.40 frame -- no address ACKed with done xfers=4 nack=4 timeout=0, a bus that was driven and two addresses that did not answer -- and the next answer there needs a rail, which is the power area's to give.", "Round185 adds no input code and runs no input probe: the CloverInput archive is still built, its boot argument is still parked in a board.toml comment, and the touch rails stay unproven. What this round changes is only where the driver's readings are written, so the I2C question this area owns is handed on unchanged.", "Round186 leaves the touch instrument parked: CloverInput is still built and still scheduled behind eMMC, clover-input stays commented out of board.toml, and the checker section this round adds pins the new spawn patch rather than any QUP or Goodix constant.", "Round192 leaves the touch instrument exactly as round183 parked it: CloverInput is still built and still scheduled behind eMMC, clover-input stays absent from kernel_args, and the four NACK/timer readings are unchanged. Nothing in this round touches QUP or the panel.", "Round193 leaves the touch instrument untouched; the watchdog policy is a kernel-side decision and does not change any QUP/I2C reading.", "Round200 leaves the touch instrument untouched: QUP v2 I2C-3, both candidate addresses and the three clover-input modes are exactly as round181 left them, and this round reads no I2C register.", "Round259 resumes the bus instrument and puts a synthetic finger on the bus in the same flight: clover-input=3 is back in kernel_args with a tee class of its own (r181-i2c, budget 24, because an unbudgeted producer is a ring that starts late), and package/CloverHidInputProbe.cpp now uses the sink the driver hands it instead of only counting it -- the first beat that has an event driver writes native_touch_count=1 at (15240, 10160), the driver's own axis maxima so the point lands mid panel after transformCoordinate, runs NativeHidInput::touchNotify through IOWorkLoop::runAction (inline on the work-loop thread, IOWorkLoop.cpp:572), waits 50 ms so the press is not folded into the lift, writes the lift, and never does it again. This area therefore reads in two kinds now: the r181 lines say whether a real panel answers on the bus, and the beat's touch=/reports= say whether a synthetic one reached the HID stack -- the last shape difference left against the board that boots a desktop, since r258 had already copied the digitizer collection, DigitizerCollectionDispatch and the device-side Built-In.", "Round260 changes how this area's answer arrives, after boot 47 showed the instrument working and unreadable: mode 3 ran and spoke 42 lines at t=12 s, the kernel ring on the card kept its last 512 rows and that boot's window began at t=1194.04 s, so the flight came back with no bus answer at all -- not a NACK, an absence, which is the worse outcome. UniXNU-sheng does not have this failure because its drivers do not print: package/TouchProbe.cpp:29 keeps `char native_touch_rows[4][120]`, package/BootLog.c:340-356 re-composes those rows onto the medium every 2 s, and BootLog.c:96/:806 drains a 512-line Wi-Fi ring with a persistent cursor. A reading survives there because it is state. CloverInput has had that state since round181 (clover_input_observation[16], defined at its line 241 to outlive a log ring) and never re-published it, so the beat now re-says all sixteen slots as one `clover r260: bus` line with its own tee class -- nothing recomputed, nothing asked twice, one set of bus transactions per boot and many readings of it. mode=0 is printed too: an instrument that never ran has to say so rather than go quiet.", "Boot 48 read the state r260 publishes: every beat carried `clover r260: bus mode=3 map=0 hw=20070000 io=c0a5 op=90 err=0 status=10000c8 state=1d clk=315 ack=0 id=0,0 xfers=4 timeout=0 nack=4 verdict=102`, which is round183's answer in one line -- controller driven, both candidate addresses NACKing all four sub-transfers, no timeout. The bus question is therefore answered and belongs to the power area now, not to this one.", "Round261 is host forensics on the wait this area's synthetic finger was sent to test, and it moves the question off input: boot 48's waiting thread (pid 58, tid 0x408, r238 name-matched to backboardd) sleeps in `ulock_wait2(UL_COMPARE_AND_WAIT|ULF_NO_ERRNO, 15bd8e6d4)` -- group base +0x34, `wr=0 cw=0`, age 877 s -- and its ten decoded user frames run VisualLogger -> libVFXCore x6 -> a backboardd frame -> libVFXCore, where the call the thread is inside is `descriptionForRootObject:` on the local class `BKTouchHitTestContextMap`, reached from the `canceling paths %{public}@ -- %{public}@ (ts:%{public}@)` logging helper that `-[BKHIDDirectTouchEventProcessor _queue_enumerateDigitizersForDisplay:usingBlock:]` calls (selector and class recovered from the chained-fixup tables of the stripped binary: `dyld_info -objc` for the method ranges, lldb-disassembled `__objc_stubs` entries for the selrefs, the class ref decoded through its rebase into a local `class_ro`). So the dead wait is backboardd's own touch-event pipeline blocked inside a render-side framework, and the thread's identity changes boot to boot (boot 45 read AssistantServices/Home, boot 48 reads libVFXCore/VisualLogger) while the group's ledger does not (127d7a9e0, 145d08b30, 15bd8e6a0 -- same `b=fffffffd cnt=1 wait=1 notif=0`). What the port has to answer is which completion performs the leave, and the first branch is the gpu area.",
  "Round316 changes nothing in the input area -- its board.toml edit is the title only, clover-input=3 still ships, and the two panel rails remain the precondition that has never been read.",
   "Round318 splits every decision CloverInput reads out of a register word into a bus-free header (drivers/CloverInput/InputCore.h, 885 lines, includes only <stdint.h> and InputRegs.h) with a host model the build gate runs rather than merely reads -- 15 groups / 263 checks in drivers/CloverInput/tests/clover_input_host.cpp, compiled and executed by scripts/test-clover-input.py, held by check-clover.py's # Round318. block (10 layer needles, 48 driver call sites, 14 second-copy needles that must all be absent) and proven to run by a controlled red test (GATE_RED_EXIT=1 with the model's own failure line, restored to e5626d80..., GATE_RESTORED_EXIT=0). The finding here is about the instrument, not the panel: r181's bus= column is I2C_STATUS & kI2cStatusErrorMask, and this board's MAIN mask is 0x38000FC where the vendor takes 0x380003C, so SDA BIT(26) and SCL BIT(27) -- the two bits that would name a held bus -- lie outside both masks and could never appear in bus=, while r181's sda=/scl= read TLMM IO of gpio10/11, whose mux is blsp_i2c3, i.e. the wrong location for a QUP status question. CloverInput therefore gains two rows per poll, clover r318: xfer ... status= err= res= sda= scl= op= (raw words plus the two sensor bits) and clover r318: core ... flags= err= res= iovr= ouvr= iur= oovr=, each printed once per loop from raw reads taken once; the r181 rows are byte-identical. A second instrument debt is paid in the same round: kPinIntrTargetMask used to be 0x1f00 with shift 5 (bits [12:8], overlapping no field), and the cut is now 3 bits at bit 5 derived from shift+width (pinctrl-msm-mainline.c:1054), so every frame from boots 41-102 whose tgt= was read as garbage becomes re-cuttable from the same row's cfg=. No new boot argument: clover-input=3 still ships, and the two panel rails remain the precondition that has never been read. Not flashed yet: the row shape is pre-registered for boots 103/104 in dev-log Round318 (10). The round also archives the nine vendor sources the decodings were read from and the host-model runner, and this area's paths now claim all ten so the upstream gate has an owner to name when any of them changes.",
   "Round342 changes nothing for input: no CloverInput source, no InputCore.h decision, no tee class and no boot argument moved (clover-input=3 unchanged), and the only board.toml edit is the [payload] title. The r318 xfer/core rows and their re-cuttable cfg= column stand as written, and the two panel rails remain the precondition that has never been read. The pinned-slot change lives in the storage driver's ring, so an input row that happens to be relayed through it keeps its text and its tee budget; what changes is only which slot a record with a pinned head lands in, and no CloverInput row has such a head.",
  "Round344 touches this area only through the shared board.toml, and only its [payload].title: the round token moves to r344 and names the new display rows. Every value this area owns is byte-identical to r343; the entry is recorded here because the file is shared.",
  "Round343 moves no input fact: board.toml carries only this round's menu title (clover r343) and clover-input=3 stays where round342 left it. No touch or I2C register, verdict or boot argument changes; the round is confined to three display column names and two host instruments.", "Round354 changes the board title and nothing in the input instrument: no QUP, I2C or HID fact moved. The title records the beat-thread stack fix that keeps the periodic rows (including the input verdict rows) firing instead of dying on the first sampler fire.", "Round358 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged. No QUP, I2C, HID or interrupt fact moved; the round's receiver leg is an IPC question above the transport.", "Round359 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged. No QUP, I2C, HID or interrupt fact moved.", "Round360 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round361 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round362 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round364 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round365 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round366 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round367 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round368 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round369 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round370 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round371 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged.", "Round372 moves no input fact: the shared board.toml title is the only file this area touches and clover-input=3 is unchanged."]
completion = ["Touches map to the display, contacts keep stable IDs, releases arrive, and buttons produce HID reports."]
limits = ["No input device is published to iOS: this round asks for an ACK and decodes an identity, it does not attach a driver, take the gpio67 interrupt (INTID 129 is named and never enabled) or parse a contact report.", "No power rail has been proven. Both device-tree touch nodes declare supplies and the driver issues no SPMI transaction, so a no-answer reading is the expected outcome of a live bus with a dead panel, not evidence that the controller is absent.", "The bit-clock field packing disagrees between mainline and Xiaomi's 4.19 tree; mainline is used because it is checkable by hand, but only a reading on hardware can say which one this silicon answers to."]
next_action = ["Round313 moved this area's precondition in both directions: the two touch rails are no longer unreachable because of an unknown layout -- CloverPower now takes its floor plan from the arbiter's own version word -- and the shipped boot argument is clover-power=1, which names the band but reads no rail. So the enable bytes arrive only when the power area raises the mode after the band is named, and until then a NACK here still means 'no chip answered and the rails are unproven', not 'the controller is dead'.", "Cold-flash the r181+r313 pair and read both stamps in one frame: the r181 lines (declared geometry, whether bring-up reached fifo out=/in=/clk=, whether either address ACKed) and the r313 block (arbiter_ver four legs, band=, the map census, the per-rail ownership line); the two rails' enable bytes follow in the round after the band is on the record -- round181's no address ACKed; rails unproven is the line round182 exists to answer.", "An ACK opens the next gate in order -- Goodix config-sensor-id and config version read-back, then the config file the vendor sends, then the 0x8041 touch-point register with gpio67 as an interrupt. A NACK with both rails state=off is a software question the power area now owns; a NACK with a rail state=on sends the next round back to the bus, the reset timing and gpio67's drive strength.", "The r182 burst line also constrains this area: burst no, singles yes means every multi-byte touch read (the 22-byte EDT name, the Goodix config block) has to be issued one byte at a time until a frame proves otherwise."]

[[area.evidence]]
kind = "source"
reference = "drivers/CloverInput/InputRegs.h"
result = "Every offset and every bit transcribed from a named source, with the three-source provenance (device DT, mainline 7.2.y, Xiaomi 4.19 CAF) written out instead of averaged: DT size 0x600 against the 4 KiB page actually mapped, GCC_REG_OFFSET(reg) = 0x100000 + reg, the two rival 400 kHz encodings kept side by side, the QUP v2 tag values 0x81/0x82/0x83/0x85/0x86/0x87, REPACK_EN, MX_CONFIG_DURING_RUN, and both candidate addresses with the registers their own drivers read first"

[[area.evidence]]
kind = "source"
reference = "drivers/CloverInput/CloverInput.cpp"
result = "Board-local instrument: AHB vote, RCG re-parent to GPLL0 with the 400 kHz divisor, CBCR branch enable, TLMM gpio10/11 onto BLSP I2C function 2 with the DT's drive strengths, one SW_RESET per transfer followed by a polled master-gen that requires STATE_VALID, FIFO-mode tag segments drained until the byte count and the done bit agree, the vendor gt9xx reset timings with gpio67 at 16 mA, and the two identities decoded per gtp_get_fw_info() and edt-ft5x06.c. Three modes, opt-in by boot argument, no path that panics, and it ends in clover_emmc_flush_cache() so the readings leave the device"
