configuration = ["CONFIG_XNU_SHENG_PMGR=y reuses sheng's PMGR hook; clover-pmgr=2 selects the board integration.", "The board drivers are chained as C entry points in sheng_pmgr_run(), in the order the checker asserts by position: clover_unattended_begin(), clover_emmc_run(), clover_input_run(), clover_power_run(), clover_dsp_run().", "drivers/CloverPMGR publishes ApplePMGRNub so AMFI's PMGR lookup succeeds.", "clover-power=N selects drivers/CloverPower's read-only PMIC instrument (1 arbiter identity, floor-plan verdict and APID map census, 2 add the two PMIC revid identities, 3 add the two LDO enable and voltage readings). Round313 ships 1: it writes no byte, starts no transaction, and its job is to name the band. No rail is written, enabled, or reconfigured by any mode."]
procedure = ["Document each clock, regulator and firmware-owned state before enabling a transition.", "Read the AMFI start lines and the PMGR observation cell from a frame.", "Before any rail is switched, take the arbiter's own answer for who may write that APID (cnfg + 0x700 + 4*apid) from a read-only boot."]
findings = ["AMFI waits for a service matching ApplePMGRNub and panics when none exists. The board driver publishes that service without owning a real PMGR.", "No battery, charger, CPU-frequency or suspend policy is implemented.", "Round180 changes no power control. Its configs/clover_defconfig edit is CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y, which selects a display archive and touches no clock, regulator or PMGR state, and the three new boot arguments are display phases rather than power knobs. The clover-pmgr=2 contract, the ApplePMGRNub publication and the absence of any battery or charging data are exactly as round178 left them.", "Round181 adds one tail call to sheng_pmgr_run() -- clover_input_run() after clover_emmc_run(), because the touch instrument's only way off the device is the log ring CloverSdhci sets up -- and one archive to CONFIG_XNU_EXTRA_LD_ARCHIVES; a device repository has no IOKit personality slot, so board drivers are chained as C entry points. It touches no power hardware: both DT touch nodes declare supplies and this driver issues no SPMI read or write and no PMIC register at all, which is exactly why a no-answer reading is expected rather than conclusive, and why the GCC/BLSP clock enables it does perform are votes for a bus clock rather than a rail.", "Round182 is the first transaction against a PMIC on this board, and it is a read. drivers/CloverPower maps the SPMI PMIC Arbiter v5 windows the device tree itself declares at qcom,spmi@800f000 -- core 0x0800f000+0x1000, chnls 0x08400000+0x1000000, obsrvr 0x09400000+0x1000000, intr 0x0a400000+0x220000, cnfg 0x0800a000+0x3000 -- refuses any version outside the v5 band (below 0x50000000 the APID map would live at 0x800, at or above 0x60000000 the layout is sheng's v7 0x2000/0x20 pair), walks the 448-entry map at core+0x900 with the vendor's own tie-break (first mapping wins, replaced only by one this EE owns) and its separate IRQ rule (the last APID carrying bit 24), and reads cnfg+0x700+4*apid to print which execution environment may write each APID before anyone attempts a write. Mode 2 asks the two PMICs' revid blocks and refuses to name a chip whose +0x04 byte is not 0x51; mode 3 reads the two rails the touch nodes declare as supplies -- ldo-a11 (PPID 0x04a, sid 0) and ldo-b3 (PPID 0x242, sid 2) -- at 0x01..0x05, 0x40/0x41, 0x45 and 0x46, decoding microvolts only for the L660 subtypes whose FTSMPS426 layout mainline proves. Read-only is structural, not a promise: every transaction is an EXT_READL on an observer channel (vendor rule: from v2 on rd_base is obsrvr, wr_base is chnls), the chnls page is mapped per rail APID only to read its own ACC_ENABLE/IRQ_STATUS, and the single write in the driver is the read command into that command register, which is what a read is. check-clover.py therefore refuses the strings windowWrite and kPmicArbWriteOp in the source, and scripts/test-clover-power.py -- a pthread model of the arbiter that re-decodes every command and asserts its opcode is a read -- runs as a build gate, including a case with no server thread at all so the poll bound has to be what ends it.", "Round182 also repairs the input area's base address: drivers/CloverInput/InputRegs.h shipped kQupPhys as 0x00c17700, a six-digit literal that is a hundredth of the real QUP and lands where no QUP exists. It is now 0x0c177000, decoded from this board's own facts dump (i2c@c177000/reg 0070170c 00060000, little-endian four-byte groups), and the class of typo is closed off rather than re-reviewed: check-clover.py's check_device_tree_constants() now binds each driver header's physical constants to the device tree (26 addresses against 230 nodes), including all ten spmi cells and an observer-block window contract that refuses a mapping past the DT's own 0x1000000.", "Round183 adds the third tail call to sheng_pmgr_run() -- clover_power_run() then clover_dsp_run(), the DSP instrument last because the heap it reads only means something after the block driver has armed the rings that carry its report -- plus one archive in configs/clover_defconfig's CONFIG_XNU_EXTRA_LD_ARCHIVES and one line in scripts/build-clover-pmgr.py: the conditional iPhoneOS SDK pin, because a full XNU pass rewrites IOPlatformExpert.cpo.json without --isysroot and the builder's own -Wall -Wextra -Werror turns that into -Wincompatible-sysroot. No power hardware is touched and no SPMI transaction is issued by drivers/CloverDsp: the ADSP's vdd_cx rail (pm660l L9, the two device-tree cells 0x180 and 0x186a0) is named here only because it is what the schedule's fifth item turns into a power question if the heap says the DSP was never loaded. The arbiter reading, the APID map, the ownership answer and both revid identities are exactly as round182 left them, and the enable path is still closed.", "Round184 stops scheduling CloverPower for this boot: clover-power=3 is commented while the archive, its defconfig line and its position after eMMC stay exactly where round182 put them. The ownership reading the area was waiting on did not arrive, because the hardware reading was a refusal -- the core version word fell outside the v5 band, no APID was claimed, and neither ldo-a11 nor ldo-b3 was read. Reopening this area means answering what that version word is, and that answer now needs the card rather than a photograph.", "Round313 answers the version question by changing the instrument rather than looking again. round183's photographed frame printed two transcriptions of one %08x of one variable (core=03000000 on one line, ver=30000000 on the next), and no re-reading of that photo can settle it: 0x03000000 falls below V2_MIN and has no known layout, 0x30000000 is v3 and VEND:1144-1155 spells its layout out in full -- so the fix is four renderings plus a repeat read plus a named band plus a control that does not go through the table (arbiter_ver hex= dec= nib= again= stable=, then band= with both neighbouring floors, then core+0004 decoded twice with differs=), and a reading channel that is text off the card rather than a photograph (two new tee classes, r182-power and r313-power, 48 lines each, on the reserved exemption chain). The floor plan itself became data: struct pa_layout with one row per band and pa_layout_for() mirroring VEND:1212-1224 and MAIN:2102-2110 branch for branch, because two independent trees both give v3 a layout and round182's single is-it-v5 test left the touch rails, the Wi-Fi rails and the GPU's pm660l_s3 leg without an ownership answer for a reason that was really 'we only wrote down one band's addresses'. Four things move between bands (APID map base 0x800/512 against 0x900/448; observer stride 0x1000*ee+0x8000*apid against 0x10000*ee+0x80*apid; the ACC_ENABLE/IRQ_STATUS/CLEAR words living in intr on v2/v3 and in chnls on v5; owner ACC_STATUS base intr+0x100000 for v2, +0x200000 for v3, +0x10000*ee for v5) and three do not (the cnfg+0x700+4*apid ownership word, the CMD/STATUS/RDATA0 block, the PPID extraction and fmt_cmd_v2 encoding from v2 up), which is why one transaction path survives three tables. Mapped extents follow the band too: under v2/v3 the observer and interrupt windows are mapped as the DT declares them whole, the way VEND:1227-1236 ioremaps them, because a 64 KiB observer block at a 0x8000 per-APID stride covers APID 0 and half of APID 1 -- refusing every rail above that would be a self-inflicted horizon. Two silent mis-addressings were caught and fixed rather than commented: round182 indexed the owner/ACC-status word by APID where VEND:522-523/:542 index it by 32-APID group (the two agree only for APIDs 0 and 1), and under v2/v3 a chnls page was being read and printed as an access-port enable when those three words are intr offsets in that band -- the driver now maps no chnls page there and says so on the report. IRQ ownership is band-dependent too (v5 reads map bit 24, v2/v3 take the cnfg owner per VEND:860-861), so the boolean irq_owner= became irq_ee= plus irq_src=map_bit24|cnfg_owner|unknown: the column and the expression that fills it now share provenance. The host model, not the comment, found that the two known tables are asymmetric: a v3 walk over a v5-shaped map silently succeeds with every APID shifted by +64 and a changed tie-break shape, while the reverse direction returns PA_E_NOENTRY -- nothing downstream of pa_layout_for() catches the direction that does answer, which is why the version word gets four legs. One divergence from both trees is named rather than buried: the vendor's else-chain is unbounded above (VEND:1222-1224, MAIN:2102-2110 would drive a v6 or v7 arbiter with the v5 table), this port stops at V6_MIN and returns PA_E_VERSION with the word printed, and the fix if a board ever lands there is a fourth row, not a widened bound. Sources are archived so the line numbers are citable: notes/sources/sdm660/spmi-pmic-arb.c (1,382 lines, sha256 bedee16415c7290c2c07414623edc8af16b185f475e3512bb963e7c67076754c) and spmi-pmic-arb-mainline.c (2,182 lines, sha256 52e78067daedd326af49c09033932c84bdcdd8a1a9df77e4fc7ae12d18cf153b); design and pre-registered reading branches in notes/power-bringup.md."]
completion = ["AMFI reaches its start path and the board's declared power controls respond."]
limits = ["The PMGR service is a compatibility publication, not a full PMGR implementation.", "No battery or charging data is published."]
next_action = ["Cold-flash round313-v0.7.25-payload.img after boot 103's on-card scene is read, and take the clover r313: block off the card with scripts/read-clover-log.py --tee -- not a photograph: arbiter_ver hex=/dec=/nib=/again=/stable=, band= with both neighbouring floors, the layout= line, core+0004 with differs=, the map census and the per-rail ownership line.", "Judge it against the seven pre-registered branches in notes/power-bringup.md section 8: band=v3 with mapped>0 makes the schedule's second gate (who may write that APID) an answer for the first time; band=v3 with mapped=0 is an empty table, which is a firmware question and not a wrong band; stable=0 or a version moved under us line voids every offset reading of this boot, and no branch may pick the read it likes; band=none with hex=03000000 is a contradiction to explain (v1 has no obsrvr/chnls split while this DT declares five windows), not a code change.", "Only after the band is named does this area raise the mode: 2 asks the two revid identities, 3 reads the two enable bytes round181's rails-unproven is waiting on. If the revid burst says burst no, singles yes, every later multi-byte read -- including the two voltage bytes -- has to be issued one byte at a time and that cost is booked in the same round.", "Add a battery/charger source only after the boot path is resolved."]

