next_action = ["User decision 2026-11-02: do not start the Adreno 512 driver. Feed the desktop from the CPU first; hardware bring-up (RSBC/GBIF/CP, RB-side ucode, SMMU, rails) is deferred until a reading proves the wait can only be completed by real rendering.", "The r262 reconnaissance found the seam sheng itself uses: it publishes an IOService named AGXDeviceUserClient with an AGXAccelerator : IOAcceleratorES class -- deliberately that name so stock sandbox profiles allow IOServiceOpen -- as a stage separate from the CP/uCode work (UniXNU-sheng/package/GpuPowerProbe.cpp:1206-1216, drivers/NativeAdreno/NativeAdrenoPublish.cpp, NativeAdrenoAccelerator.cpp). Publishing that shell with no GMU and no CP is therefore a step taken from sheng's own ordering, not a new invention; what neither board proves is a software rasterizer at all (sheng's AirNir is a turnip/Vulkan bridge, and IR3 is the a6xx+ ISA, so a5xx cannot reuse it).", "Boot 50 still gates the branch: a dl= nonzero row naming a peer= means the leave is owed by a service and this area stays untouched; boot 50 answered it the second way -- no timed wait anywhere, and the one outstanding request is a single send right whose owner r264 names off x3. boot 51 then reordered this area: the one outstanding send in the process is addressed to pid 140, whose comm is truncated by XNU itself at 15 characters (char comm[16] in the resolver) and matches exactly one image path, /System/Library/PrivateFrameworks/DataMigration.framework/XPCServices/com.apple.datamigrator.xpc. So an XPC round trip nobody answers is the first suspect for the desktop, ahead of the device shell; the shell stays planned, and its narrowed minimum (enumeration plus newTextureWithDescriptor: and the objects it returns) is unchanged for when it is reached.", "Parallel workstream opened 2026-11-02 at the user's direction, superseding the CPU-only sequencing while leaving the desktop path CPU-first: the r282 candidate is the read-only a5xx probe described in notes/gpu-bringup.md (chipid, GPUCC, GDSC, SMMU identification, no writes, no clock or rail changes), and its three-way decision table is written down there before the code exists.", "Boot 77 decided Round290's question: gfx3d=1/1 and rbbm=1/1 with cxo=1/0 and rbcpr=1/0. Because gx GDSC never closes, gfx3d has no reason to leave HALT, so the surviving suspect is the supply, not the rate -- and programming the RCG from the §5.1 table is explicitly NOT the next step. r291 therefore reads the GFX LDO registers that §5.6 now sources -- inside the GPUCC mapping the DT extent already covers (0x0506e000 is 0x9000 into reg = <0x5065000 0x10000>), not a fourth window -- and reads 0x18 VREF (decode µV = val*5000 + 375000), 0x1C PWRSWITCH_CTRL and 0x28 status (LDO_READY=BIT(2), LDO_VREF_SETTLED=BIT(4)) beside the same-beat gx_on. Criteria fixed before the flash: LDO_READY=0 or µV decoding to 375000 means the corner was never raised and the debt is CPR4/vdd_gfx; LDO_READY=1 with a raised µV while gx_on stays 0 means the rail is innocent and the next look is at the GDSC's own wait fields and gpu_gx_domain_addr. 0x24 (defined but never read by the driver) and 0x34 (outside the DT window) stay untouched, and the 6-fuse-corner vs 7-pwrlevel mismatch is not concluded on this round.",
 "Boot 78 closed the GPU line's reading phase and opened a writing phase it cannot yet fund: vdd_gfx sits powered down with its reference unprogrammed, so the next GPU step is a rail write, and the sequence that would make that write sourced (enable_ldo_mode() at msm_gfx_ldo.c:325, msm_gfx_ldo_voltage_enable() at :819, the corner-to-voltage table coming from CPR4 fuse at 0x00784000, sdm660-regulator.dtsi:536) is not on disk with a sha256. Until it is, no rail write ships. Meanwhile the project's dominant blocker moved off this cell: two consecutive silent, no-panic resets (boot 77 at 1248.429585 s, boot 78 at 718.84 s) have to be bounded before anything else on the board can be observed.",
  "Round294 is the GPU line's first control round, and it is also the reason the mainline's silent resets are now a GPU-line question: the two writes removed are this area's own -- BIT(0) into GPUCC rbcpr 0x1054 and rbbmtimer 0x10d0, added by r290 as the votes the DT clock list still owed, and every boot that has carried them ended in a silent pre-deadline reset. The branch reads stay (r290's row still asks en/halt for all four), so the round answers whether the AP dies because of those two votes or in spite of them. The read-only half widens the rail baseline: GpuRegs.h now names every register the vendor's msm_gfx_ldo.c names from 0x00 to 0x30 (with two recorded exceptions -- 0x20 is unnamed in that file, so the census prints it without a name, and ADC_CTL 0x34 is outside the DT's reg = <0x0506e000 0x34>), and clover_gpu_report_ldo_words() prints the 13 words on the same post and beat schedule as r291's three-word row, which keeps its own row so boots 78-80 stay comparable. Boot 80 re-prints the rail state verbatim (uv=375000, sts=0, pdn=1 with cx_on=1 beside it), so the corner was never raised is now a three-boot reading rather than a single frame. Writing to the rail is still unfunded: the full enable sequence needs a sha256-sourced copy of enable_ldo_mode()'s PWRSWITCH_CTRL order and the corner-to-voltage table, and none is on disk yet. Desktop stays CPU-first.",
  "boot 86 is the first board reading taken after that correction, and it agrees: three fires of r290/r291/r294 plus nine r286 census rows all print vref=0 val=0 uv=375000 ctrl=80000038 pdn=1 sts=0 with every LDO word zero -- under the shipped DTB (qcom,cpr-corner-allow-ldo-mode = <0x00 x7>, qcom,cpr-corner-allow-closed-loop the same, qcom,cpr-fuse-corners = <0x06> in ~/mu-clover/Resources/DTBs/clover.dtb) that is the configured state and not a fault, so no corner-fuse read is needed to explain it and the cancelled fuse round stays cancelled.",
  "The cell that is still open is the supply a register word cannot name: gfx_mem_acc_vreg / qcom,acc-sel-l1 at <0x01fcf004 0x4> (sdm660-regulator.dtsi:510-518, and verify the same node in the shipped clover.dtb before mapping it). One read-only word. Then the RPM-SMD level for pm660l_s3 (vdd_cx), which CloverPower cannot answer over SPMI because its two rails are ldo-a11-vcc_i2c and ldo-b3-vdd (CloverPower.cpp:624-626) and a level question belongs to qcom,rpm-smd-regulator -- a request this port has never sent, which is itself the statement to write down.",
  "Round311 (v0.7.23) ships the cell item above, read-only, and it had to open a fourth window to get there: 0x01fcf004 sits above GCC's 0x00100000+0x94000 (which ends at 0x194000) and below GPUCC/the core, so no extent this line mapped since round286 reaches it. The node is verbatim in the shipped clover.dtb (dtc :7633-7645) -- regulator@01fcf004, compatible qcom,mem-acc-regulator, reg-names acc-sel-l1, qcom,corner-acc-map <0x01 0x00>, bit-pos 0 / bit-size 1, phandle 0x163, and cpr4-ctrl@05061000 names it as mem-acc-supply -- and it declares no clocks and no supply, which is what makes this read not the unclocked-bus gamble round282 declined. The row is \"clover r311: gpu t= fire= mem_acc map= answered= raw= l1= corner= [gpucc=1 cx_on= gx_on=]\" in three shapes, in its own tee class (r311-gpu, 32) and exempt from the per-pass cap, because which shape it took IS the reading and a cap that ate the answered row would report an answering page as an unmapped one. answered= is tested on the word BEFORE the field is masked: with bit-size 1, 0xffffffff masks to 1, which is corner 1's own map value -- the fifteenth layer's one-word-may-not-mean-two-things in this cell. GpuRegs.h is registered in the DT gate for the first time (its four bases and sizes, eight cells), which takes the gate from 30 to 38 addresses against 230 nodes; the withRange count assertion moved 3 -> 4 with its reason replaced (the old text only held for the LDO, which genuinely rides the GPUCC extent). Nothing is written: the four store helpers against this window are pinned absent. The horizon is stated in gpu-bringup 5.13 and dev-log Round311 -- a raw=00000000 cannot be split between \"corner 2's real value\" and \"a page that reads zero\", because the only other DT node on that 4 KiB page is qpdi@1fc1000 and nothing proves its clocks are up. Five readings (甲–戊) are pre-registered for the boot that carries the row; this release was flashed to nothing -- boot 103 stays on the card and is read first.",
]
