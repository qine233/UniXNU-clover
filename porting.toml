schema_version = 1

[device]
name = "clover"
soc = "SDM660"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi Pad 4 8\" LTE uses a board-owned eMMC path, an Apple device tree generated from two device trees, uefi-clover firmware and an ESP payload. This record describes implementation coverage and the evidence required for each milestone."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitattributes", ".github/**", "unixnu.lock", "AGENTS.md"]
inputs = ["SDM660 board facts, iPadOS 17.7.11 build 21H461, clover defconfig, pinned XNU and firmware sources.", "Two device trees pinned as refer sources in feeds.toml and the unit's own facts/ dump."]
configuration = ["board.name = clover; board.soc = SDM660; board.os_profile = ipados-17.7.11-21H461.", "The kernel arguments are the board contract: serial=3, debug=0x14e, boot-progress=2, clover-pmgr=2, clover-apfs=3, clover-emmc=21, cs_enforcement_disable=1, -no_slto_panic and ml-timeout-lock-panic-scale=40.", "The board's own instrument selectors are appended in round order -- offline-mobile-graphics-load=1, offline-legacy-register=1 and offline-legacy-phase=1 (round180), clover-input=3 (round181), clover-power=3 (round182), clover-dsp=3 (round183) -- and scripts/check-clover.py cross-checks each one against its archive entry, its CONFIG_XNU_EXTRA_LD_ARCHIVES line and its driver source, so an argument that selects nothing fails the round instead of booting silently.", "This repository owns no submodules. ArmCpu, CloverSdhci, CloverBlock, CloverPMGR, CloverInput, CloverPower and CloverDsp are in-tree drivers; shared XNU sources and the component catalog come from UniXNU."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig clover_defconfig --device ../UniXNU-clover from UniXNU.", "Run ./unixnu status --json --device ../UniXNU-clover and review the defconfig, archives and patch order.", "Run scripts/check-clover.py; the firmware step runs the same checker from the assembled tree."]
findings = ["sheng selects SM8550 components through [components] include. clover instead names explicit archive builders in [kernel] archives and keeps an Apple-style prelink root list, because the clover drivers are board-local rather than catalog components.", "sheng's OWNER_* and BOOT_PROGRESS switches cannot be enabled from clover_defconfig: build-xnu-4k-baseline.sh gates them behind NATIVE_VIRTIO_BLOCK, whose archive would define the native_verified_block_* symbols a second time. patches/xnu-clover/zzy-clover-owner-root-trust.patch and zzy-clover-systemos-mount.patch set the two object-local macros instead.", "The porting record is the same schema sheng maintains; .github/workflows/porting-record.yml runs the shared validator on every push.", "Round164 changes one payload title and adds no configuration key: board.toml only names the round in [payload] title. The kernel build additionally reads patches/xnu-clover/zzy-clover-dyld-cache-skip.patch copied into ~/UniXNU/patches/xnu/.", "Round165 again adds no configuration key: only the payload title names the round, and the kernel change is confined to drivers/CloverSdhci. The checker's title assertion moves to clover r165.", "Round166 adds no configuration key either: the title carries clover r166, the driver change is source only, and the new kernel half is patches/xnu-clover/zzy-clover-exec-sig-bytes.patch copied into ~/UniXNU/patches/xnu/. The build tree must be fully patch-applied before the archive step and zzy-clover-dyld-cache-skip must be reversed before the kernel step, because that patch overlaps the native-4k hunk it builds on.", "Round167 adds no configuration key: the title carries clover r167 and every change is inside drivers/CloverSdhci (CMD13 write confirmation, scaled request deadlines, EXT_CSD CACHE_CTRL clear, and batch reads trusted only when two CMD18 samples agree with 32 single-block reads).", "Round168 also adds no configuration key: the title carries clover r168 and the change is confined to drivers/CloverSdhci's wait bounds and retry ladder (4 s write settlement, 30 s guard hand-over, wider request deadlines, batch/single retries before EIO).", "Round169 adds no configuration key either: the title carries clover r169 and every change is inside drivers/CloverSdhci (CMD12 before the host reset on a failed read, a 30 s card-idle wait before the first read command, 30 s write settlement and a 30 s write request base, and eight stage-tagged read-failure lines).", "Round170 adds no configuration key: the title carries clover r170, and the kernel half is one patch stack of three -- zzy-clover-shared-region-why2.patch regenerated with the two print caps, zzy-clover-shared-region-why3.patch re-anchored above it, and the new zzy-clover-shared-region-why5.patch for bsd/kern/kern_exec.c and bsd/kern/kern_exit.c. A probe must not be inserted into a block an earlier-named patch added, because build-xnu-4k-baseline.sh decides whether a patch is already on the tree with git apply --reverse --check, and editing that patch's own lines makes the check fail and the build abort.", "Round171 adds no configuration key: the title carries clover r171 and every change is inside drivers/CloverSdhci and drivers/CloverBlock (a multi-block completion criterion that counts delivered words, the card's write cache switched back on with an explicit commit, and two IOLocks replacing two bounded spin guards). No XNU patch was touched.", "Round172 changes no board constant: board.toml carries only this round's menu title, and the ADMA2 register and descriptor definitions the driver needs live in drivers/CloverSdhci/SdhciRegs.h with their CAF 4.19 provenance, so the host description and the device facts stay in the same two places they were in round171.", "Round173 changes no board constant: board.toml carries only this round's menu title, and the write gate's sample run is derived from the logfs window CloverSdhci already publishes from the card's own GPT entry, so no new geometry enters the board description.", "Round174 changes no board constant: the only board.toml edit is the menu title that names the round, and the verdict ring sits at a fixed sector offset inside the logfs window CloverSdhci already derives from the card own GPT entry, so no new geometry or partition number enters the board description.", "Round175 changes no board constant again: the only board.toml edit is the menu title that names the round. The tee reads the kernel message buffer through msgbufp, declared under XNU_KERNEL_PRIVATE in bsd/sys/msgbuf.h and already visible to this driver, so no defconfig key, boot arg, device-tree fact or partition geometry moves.", "Round176 changes no board constant either: the only board.toml edit is the menu title that names the round. The second ring is a second fixed offset inside the same logfs window the driver already derives from the card's own GPT entry (kind 21 at sector 64 for 128 sectors, kind 22 at sector 192 for 1024), and the tee still reads msgbufp through XNU_KERNEL_PRIVATE, so no geometry, boot arg or defconfig key moves and the write target is still one partition.", "Round177 adds no configuration key: the only board.toml edit is the menu title that names the round. The recipe gained one step between the AMFI patcher and the payload build, scripts/normalize-kernel-macho.py, so AGENTS.md and this record describe one more command rather than one more knob.", "Round178 adds no configuration key: the board.toml edit is the menu title that names the round, the change is confined to drivers/CloverSdhci, and no boot argument, window or defconfig switch moves. The checker title assertion moves to clover r178.", "Round179 adds no configuration key either: its board.toml edit is the menu title and its only artifact is a host-side ABI audit. Round180 changes one switch and retires one. configs/clover_defconfig gains CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y and loses build/native-legacy-display-stub/libNativeLegacyDisplayStub.a from CONFIG_XNU_EXTRA_LD_ARCHIVES; board.toml's [kernel] archives swaps scripts/build-clover-display-stub.py for scripts/build-clover-gop-legacy-display.py and [payload] kernel_args gains offline-mobile-graphics-load=1, offline-legacy-register=1 and offline-legacy-phase=1. The arguments that would open display phases 2 to 4, the IOSurface/GPU swap path or the MDP5 driver (offline-legacy-validate/transfer/retire/pm, sheng-fb-gpu, CONFIG_XNU_NATIVE_MOBILE_DISPLAY) are deliberately absent, so kernel_args is still the single place that says which part of the display stack is allowed to run -- and CONFIG_XNU_NATIVE_LEGACY_DISPLAY is now one of the three keys the board's contract cross-checks rather than a knob nobody reads.", "Round181 adds one switch and one boot argument and moves no identity field: [kernel].archives gains build-arm-driver.py CloverInput, configs/clover_defconfig's CONFIG_XNU_EXTRA_LD_ARCHIVES gains build/clover-input/libCloverInput.a, and [payload] kernel_args ends with clover-input=3 (1 dump-only, 2 bring-up, 3 probe -- the checker refuses any other value). The memory map, partitions, IPSW identity and payload geometry are untouched.", "Round182 adds no switch and retires none: its board.toml edit is the menu title plus the CloverPower archive entry, and drivers/CloverPower reads only windows the device tree already declares.", "Round183 adds one archive, one defconfig line and one boot argument and moves no identity field: [kernel].archives gains build-arm-driver.py CloverDsp as its fifteenth entry, configs/clover_defconfig's CONFIG_XNU_EXTRA_LD_ARCHIVES gains build/clover-dsp/libCloverDsp.a as its fifth archive, and [payload] kernel_args ends with clover-dsp=3 (1 heap header and partition table, 2 add the APCS doorbell, 3 add the ADSP and WiFi image scans -- the checker refuses any other value). The recipe also gained a documented rule rather than a knob: out/clover/.config is a copy cmd_defconfig makes, so adding an archive to configs/clover_defconfig without re-running ./unixnu defconfig clover_defconfig --device ../UniXNU-clover links a kernel that never saw the new line and the link dies on Undefined symbols for _clover_dsp_run. The full filename is required because configs/clover alone errors with available: clover_defconfig.", "Round184 removes three boot arguments and returns one: board.toml's [payload] kernel_args loses clover-input=3, clover-power=3 and clover-dsp=3 -- commented in place, not deleted -- and gains clover-unattended=300, the deadline round149 took out. No defconfig key, archive entry, memory map, partition or identity field moves: the three instruments are still built and still scheduled behind eMMC, and scripts/check-clover.py now names the state instead of failing on it (archive present plus argument absent is parked and legal, archive absent plus argument present is an error, and a parked argument that comes back still has to land in {1, 2, 3})."]
completion = ["board.toml parses, every pinned source resolves, two checkers pass, and the record names each area this board implements or plans."]
limits = ["A local source override can differ from the published pin; record the effective source with the verification result.", "The record describes this repository. The uefi-clover repository owns its firmware implementation."]
next_action = ["Compare the effective status output whenever a defconfig, source pin or patch changes, and update the affected area's findings."]

