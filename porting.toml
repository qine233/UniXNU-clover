next_action = ["Transport chosen (Round312): a MMIO-visible ICNSS subsystem, not PCIe -- this device tree has no PCIe host node.", "The arbiter-version cell that blocked this area is now instrumented, not guessed (Round313): CloverPower picks its floor plan off the version word the way VEND:1212-1224 and MAIN:2102-2110 do, and the shipped clover-power=1 boot prints that word four ways with a repeat read and a band verdict. So the Wi-Fi rails are no longer unread because of an unknown layout -- they are unread because the round has not been flashed, and that ordering is this area's to respect: no rail reading is claimed here until the r313 block comes off the card.", "Then the rails the chiplets name: pm660_l5/l6/l9/l19 for Wi-Fi, pm660l_l3 plus pm660_l11 for touch. All are qcom,rpm-smd-regulator, so their state is readable while their ownership is not ours, and this boot chain has never sent an RPM regulator request.", "membase 0x18800000 comes last, and only with the GPU round282 discipline: its clocks sit in rpmcc, so a bare read of that page is the unclocked-bus gamble; no positive control, no verdict.", "No Wi-Fi driver: the iOS kernelcache has no consumer for this chip, so a working transport would not move a single pixel."]
