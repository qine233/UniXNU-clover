inputs = ["The two touch candidates the device tree declares on blsp_i2c3 -- Goodix gt9xx@5d (the fitted vendor driver is gt9xx_zql6019) and EDT/FocalTech focaltech@38 -- plus the board's volume and power buttons, which this round does not touch."]
