it is the CloverPower archive entry, the clover-power=3 argument and the menu title.", "Round183 names WCN3990's heap entries without touching the chip: the shared heap is read for the wlan_msa row (0x85700000 + 0x100000) and the wlan_guard row (0x85600000 + 0x100000) and each region is scanned 16 pages deep for the ELF magic word, which says whether any firmware was ever placed there by this boot. The subsystem register block at 0x18800000 + 0x800000 is deliberately not mapped, no icnss driver exists, and there is no MHI, QRTR or packet path of any kind, so a zero-filled wlan region is a question about the boot loader's firmware loads rather than a verdict on WCN3990.", "Round184 sends no packet, reads no WCN3990 or qcom,icnss register, and only stops the round183 image scan from running this boot by commenting clover-dsp=3 out -- so the wlan MSA question is unanswered, not answered. What round183 did establish stands as this area's input: the shared heap is alive, its $TOC partition table parses, and part(3) carries host pid 1, which is ADSP."]
