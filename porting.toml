schema_version = 1

[device]
name = "clover"
soc = "SDM660"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Mi Pad 4 8\" LTE uses a board-owned eMMC path, an Apple device tree generated from two device trees, uefi-clover firmware and an ESP payload. This record describes implementation coverage and the evidence required for each milestone."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".gitattributes", ".github/**", "unixnu.lock", "AGENTS.md"]
inputs = ["SDM660 board facts, iPadOS 17.7.11 build 21H461, clover defconfig, pinned XNU and firmware sources.", "Two device trees pinned as refer sources in feeds.toml and the unit's own facts/ dump."]
configuration = ["board.name = clover; board.soc = SDM660; board.os_profile = ipados-17.7.11-21H461.", "The kernel arguments are the board contract: serial=3, debug=0x14e, boot-progress=2, clover-pmgr=2, clover-apfs=3, clover-emmc=21, cs_enforcement_disable=1, -no_slto_panic and ml-timeout-lock-panic-scale=40.", "The board's own instrument selectors are appended in round order -- offline-mobile-graphics-load=1, offline-legacy-register=1 and offline-legacy-phase=1 (round180), clover-input=3 (round181), clover-power=3 (round182), clover-dsp=3 (round183) -- and scripts/check-clover.py cross-checks each one against its archive entry, its CONFIG_XNU_EXTRA_LD_ARCHIVES line and its driver source, so an argument that selects nothing fails the round instead of booting silently.", "This repository owns no submodules. ArmCpu, CloverSdhci, CloverBlock, CloverPMGR, CloverInput, CloverPower and CloverDsp are in-tree drivers; shared XNU sources and the component catalog come from UniXNU."]
procedure = ["Read https://unixnu.com/porting/device-repository and https://unixnu.com/porting/records.", "Run ./unixnu defconfig clover_defconfig --device ../UniXNU-clover from UniXNU.", "Run ./unixnu status --json --device ../UniXNU-clover and review the defconfig, archives and patch order.", "Run scripts/check-clover.py; the firmware step runs the same checker from the assembled tree."]
findings = ["sheng selects SM8550 components through [components] include. clover instead names explicit archive builders in [kernel] archives and keeps an Apple-style prelink root list, because the clover drivers are board-local rather than catalog components.", "sheng's OWNER_* and BOOT_PROGRESS switches cannot be enabled from clover_defconfig: build-xnu-4k-baseline.sh gates them behind NATIVE_VIRTIO_BLOCK, whose archive would define the native_verified_block_* symbols a second time. patches/xnu-clover/zzy-clover-owner-root-trust.patch and zzy-clover-systemos-mount.patch set the two object-local macros instead.", "The porting record is the same schema sheng maintains; .github/workflows/porting-record.yml runs the shared validator on every push.", "Round164 changes one payload title and adds no configuration key: board.toml only names the round in [payload] title. The kernel build additionally reads patches/xnu-clover/zzy-clover-dyld-cache-skip.patch copied into ~/UniXNU/patches/xnu/.", "Round165 again adds no configuration key: only the payload title names the round, and the kernel change is confined to drivers/CloverSdhci. The checker's title assertion moves to clover r165.", "Round166 adds no configuration key either: the title carries clover r166, the driver change is source only, and the new kernel half is patches/xnu-clover/zzy-clover-exec-sig-bytes.patch copied into ~/UniXNU/patches/xnu/. The build tree must be fully patch-applied before the archive step and zzy-clover-dyld-cache-skip must be reversed before the kernel step, because that patch overlaps the native-4k hunk it builds on.", "Round167 adds no configuration key: the title carries clover r167 and every change is inside drivers/CloverSdhci (CMD13 write confirmation, scaled request deadlines, EXT_CSD CACHE_CTRL clear, and batch reads trusted only when two CMD18 samples agree with 32 single-block reads).", "Round168 also adds no configuration key: the title carries clover r168 and the change is confined to drivers/CloverSdhci's wait bounds and retry ladder (4 s write settlement, 30 s guard hand-over, wider request deadlines, batch/single retries before EIO).", "Round169 adds no configuration key either: the title carries clover r169 and every change is inside drivers/CloverSdhci (CMD12 before the host reset on a failed read, a 30 s card-idle wait before the first read command, 30 s write settlement and a 30 s write request base, and eight stage-tagged read-failure lines).", "Round170 adds no configuration key: the title carries clover r170, and the kernel half is one patch stack of three -- zzy-clover-shared-region-why2.patch regenerated with the two print caps, zzy-clover-shared-region-why3.patch re-anchored above it, and the new zzy-clover-shared-region-why5.patch for bsd/kern/kern_exec.c and bsd/kern/kern_exit.c. A probe must not be inserted into a block an earlier-named patch added, because build-xnu-4k-baseline.sh decides whether a patch is already on the tree with git apply --reverse --check, and editing that patch's own lines makes the check fail and the build abort.", "Round171 adds no configuration key: the title carries clover r171 and every change is inside drivers/CloverSdhci and drivers/CloverBlock (a multi-block completion criterion that counts delivered words, the card's write cache switched back on with an explicit commit, and two IOLocks replacing two bounded spin guards). No XNU patch was touched.", "Round172 changes no board constant: board.toml carries only this round's menu title, and the ADMA2 register and descriptor definitions the driver needs live in drivers/CloverSdhci/SdhciRegs.h with their CAF 4.19 provenance, so the host description and the device facts stay in the same two places they were in round171.", "Round173 changes no board constant: board.toml carries only this round's menu title, and the write gate's sample run is derived from the logfs window CloverSdhci already publishes from the card's own GPT entry, so no new geometry enters the board description.", "Round174 changes no board constant: the only board.toml edit is the menu title that names the round, and the verdict ring sits at a fixed sector offset inside the logfs window CloverSdhci already derives from the card own GPT entry, so no new geometry or partition number enters the board description.", "Round175 changes no board constant again: the only board.toml edit is the menu title that names the round. The tee reads the kernel message buffer through msgbufp, declared under XNU_KERNEL_PRIVATE in bsd/sys/msgbuf.h and already visible to this driver, so no defconfig key, boot arg, device-tree fact or partition geometry moves.", "Round176 changes no board constant either: the only board.toml edit is the menu title that names the round. The second ring is a second fixed offset inside the same logfs window the driver already derives from the card's own GPT entry (kind 21 at sector 64 for 128 sectors, kind 22 at sector 192 for 1024), and the tee still reads msgbufp through XNU_KERNEL_PRIVATE, so no geometry, boot arg or defconfig key moves and the write target is still one partition.", "Round177 adds no configuration key: the only board.toml edit is the menu title that names the round. The recipe gained one step between the AMFI patcher and the payload build, scripts/normalize-kernel-macho.py, so AGENTS.md and this record describe one more command rather than one more knob.", "Round178 adds no configuration key: the board.toml edit is the menu title that names the round, the change is confined to drivers/CloverSdhci, and no boot argument, window or defconfig switch moves. The checker title assertion moves to clover r178.", "Round179 adds no configuration key either: its board.toml edit is the menu title and its only artifact is a host-side ABI audit. Round180 changes one switch and retires one. configs/clover_defconfig gains CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y and loses build/native-legacy-display-stub/libNativeLegacyDisplayStub.a from CONFIG_XNU_EXTRA_LD_ARCHIVES; board.toml's [kernel] archives swaps scripts/build-clover-display-stub.py for scripts/build-clover-gop-legacy-display.py and [payload] kernel_args gains offline-mobile-graphics-load=1, offline-legacy-register=1 and offline-legacy-phase=1. The arguments that would open display phases 2 to 4, the IOSurface/GPU swap path or the MDP5 driver (offline-legacy-validate/transfer/retire/pm, sheng-fb-gpu, CONFIG_XNU_NATIVE_MOBILE_DISPLAY) are deliberately absent, so kernel_args is still the single place that says which part of the display stack is allowed to run -- and CONFIG_XNU_NATIVE_LEGACY_DISPLAY is now one of the three keys the board's contract cross-checks rather than a knob nobody reads.", "Round181 adds one switch and one boot argument and moves no identity field: [kernel].archives gains build-arm-driver.py CloverInput, configs/clover_defconfig's CONFIG_XNU_EXTRA_LD_ARCHIVES gains build/clover-input/libCloverInput.a, and [payload] kernel_args ends with clover-input=3 (1 dump-only, 2 bring-up, 3 probe -- the checker refuses any other value). The memory map, partitions, IPSW identity and payload geometry are untouched.", "Round182 adds no switch and retires none: its board.toml edit is the menu title plus the CloverPower archive entry, and drivers/CloverPower reads only windows the device tree already declares.", "Round183 adds one archive, one defconfig line and one boot argument and moves no identity field: [kernel].archives gains build-arm-driver.py CloverDsp as its fifteenth entry, configs/clover_defconfig's CONFIG_XNU_EXTRA_LD_ARCHIVES gains build/clover-dsp/libCloverDsp.a as its fifth archive, and [payload] kernel_args ends with clover-dsp=3 (1 heap header and partition table, 2 add the APCS doorbell, 3 add the ADSP and WiFi image scans -- the checker refuses any other value). The recipe also gained a documented rule rather than a knob: out/clover/.config is a copy cmd_defconfig makes, so adding an archive to configs/clover_defconfig without re-running ./unixnu defconfig clover_defconfig --device ../UniXNU-clover links a kernel that never saw the new line and the link dies on Undefined symbols for _clover_dsp_run. The full filename is required because configs/clover alone errors with available: clover_defconfig.", "Round184 removes three boot arguments and returns one: board.toml's [payload] kernel_args loses clover-input=3, clover-power=3 and clover-dsp=3 -- commented in place, not deleted -- and gains clover-unattended=300, the deadline round149 took out. No defconfig key, archive entry, memory map, partition or identity field moves: the three instruments are still built and still scheduled behind eMMC, and scripts/check-clover.py now names the state instead of failing on it (archive present plus argument absent is parked and legal, archive absent plus argument present is an error, and a parked argument that comes back still has to land in {1, 2, 3}).", "Round185 adds no configuration key and moves no window into the board description: the only board.toml edit is the menu title that names the round, and the log window's base stays a driver constant derived from the card's own GPT entry (logdump, first=13320216, size=131072) rather than a new key. The three parked instrument arguments and clover-unattended=300 are exactly where round184 left them.", "Round186 adds no configuration key: the only board.toml edit is the menu title that names the round, and the round itself is one kernel patch (patches/xnu-clover/zzzz-clover-spawn-why.patch) that prints and changes no behaviour. The three parked instrument arguments and clover-unattended=300 are exactly where round184 left them. What the round adds to the contract is a naming rule the checker now pins: save-xnu-patch.py diffs the work tree against HEAD plus every earlier-named patch touching the same files, so a board patch that sorts before another patch of the same file inherits that patch content -- which is why this one is named zzzz-.", "Round188 adds no configuration key: board.toml only renames the menu to clover r188, and the kernel change is patches/xnu-clover/zzzzz-clover-syswhy2.patch copied into the base tree's patches/xnu for the build. The three parked instruments stay parked and clover-unattended=300 is unchanged.", "Round192 changes no configuration key and no boot argument: board.toml only renames the menu to clover r192, so the next frame's title names the round that gave the write cache back to the card. The cache switch this round removes is a driver decision (CloverSdhci bring-up), not a board.toml gate, and no kernel_arg moved.", "Round193 adds panic_on_crash_disabled=1 to kernel_args: a watchdogd SIGTRAP is not a fatal crash on this board, and scripts/check-clover.py refuses a payload that loses the argument.", "Round194 raises the unattended deadline from 300 s to 900 s in kernel_args (clover-unattended=900). The r193 frame is why: that boot was still moving at 312.89 s -- SpringBoard started at 213.70 s and was alive for the rest of it, Early boot complete printed at 233.16 s -- so the 300 s reset ended a working boot rather than a fault, and everything after it was lost. scripts/check-clover.py keeps its 60..1800 s window, so the value is still the only constraint and no other key moved.", "Round195 adds no configuration key: the unattended deadline stays clover-unattended=900 and the payload title stays clover r193. What changed is the panic record's preface (scripts/xnu-panic-screen.c appends fb= to the log copy right after the panic message, through a log-only path) and the kernel-ring tee's budgets in drivers/CloverSdhci/CloverSdhci.cpp, which are five static entries rather than a boot argument.", "Round196 adds no configuration key: the title carries clover r196, the driver writes a 2048-byte Android BCB (command=boot-recovery) into misc (LBA 13180952, first two sectors, the rest zeroed) from the panic path after the ring drain, gated by the unattended arm and a once-per-boot latch, and the kernel prints the exit-reason description for every signal death (three per command name, eight names). The host script now waits for either recovery adb or fastboot after the payload's own deadline; the IMEM word is still recorded, but this XBL does not act on it. The kernel build must reverse zzzzzz-clover-crash-why.patch before zzz-boot-progress.patch, because the round196 probe sits inside boot-progress's own context. The cold flash then showed both halves working: the host saw TWRP's adb before any fallback, so the panic's own BCB was honoured, and fb=1 landed as the record's second line; the same frame also named the stop, usermanagerd opening /private/var/keybags/persona.kb, getting ENOENT and aborting with Daemon failed to load persona manifest., which is why the device's Data volume itself (not the payload) is the next target.", "Round199 adds no configuration key: the payload title carries clover r199, drivers/CloverSdhci/CloverSdhci.cpp gains one tee class (clover r199: ubrk , 48 lines) and patches/xnu-clover/zzzzzzz-clover-user-brk-why.patch hooks boot_progress_user_breakpoint to print pc/lr/sp/cpsr/esr/ec/brk plus pid and comm for the first 24 pids at two hits each. The reading is what matters: over 900 s the kernel printed 23 lines and the 48-line budget was never exhausted. SpringBoard dies eight times on brk #0 (esr=0xf2000000 ec=60 brk=0x0) with pc==lr==0x1bdc472ec every time, 0.26-0.45 s after each exec -- a brk #0 is neither __builtin_trap (brk #1) nor a ptrauth check failure (comment 0xC470-0xC47F), and lr==pc means nothing called into it from a return address the kernel can read. liveactivitiesd dies five times on brk #1 with pc fixed at 0x1e015e4f8 and lr=pc-0x2c, so it does have a real caller. watchdogd dies ten times on brk #1 inside its own executable (pc differs per pid, low 12 bits always 0xb0c). Both shared-cache pcs are identical across pids within one frame, which is how they were classified as shared-cache; naming 0x1bdc472ec is left to round200 because no dyld shared cache exists on the host to symbolize against. The r193 panic-on-crash suppression still holds (panic-on-crash disabled via boot-arg, nine times) and the boot reached the 900 s deadline with the r198 recovery BCB pre-armed, so the board fell into TWRP by itself.", "Round200 adds no configuration key: the round200 fields are the payload title (board.toml now names clover r200) and the kernel patch. patches/xnu-clover/zzzzzzz-clover-user-brk-why.patch keeps its r199 line and appends a second line per trap, clover r200: ubrk2, carrying x0-x3/x8/x16/x17, the trapped PC's vm_map entry (start, end, off=pc-start and foff=VME_OFFSET(entry)+off, which does not move with the ASLR slide), the eight instructions that led into the brk (from pc-16 unless the PC sits in the page's first 16 bytes), the first 16 bytes of the segment (a dyld_v1 cache header when the trap is in the shared cache), and up to three message strings copyin'd from x0-x2 when those registers look like user addresses. The budget is 24 traps (48 lines) per boot and 2 per pid, and the driver tee class is r200-ubrk with 64 lines. vm_map_lookup_entry runs under the read lock and copyin runs after it is released, because copyin may fault and take the write lock. The round's build-side finding is in verify-clover-payload.py: the dyld cache hash-skip fingerprint used to pin the adrp's 21-bit page difference (0xd0ffd154), and round200's extra page of text moved it to 0xb0ffd154, so the gate reported a missing patch that was in the source and in the image; all four bytes of that instruction are now free while every register, struct offset and tested bit stays pinned. The kernel grew by one page, so the AMFI cuts moved from file 0x1aad0e4/0x1aad16c to 0x1ab10e4/0x1ab116c with the virtual addresses unchanged.", "Round202 starts the display: offline-legacy-phase=4 replaces phase 1, and offline-legacy-gop/pm/validate/transfer/retire are one chain with it -- the GOP range becomes an /arm-io display-subsystem, IOMobileFramebufferLegacy probes, attaches and starts on it, and the logical power pair plus the swap validator, scanout transfer and retirement travel with the phase that makes them reachable. The reading is the user client, not the late: lines (those print before the kernel log ring is armed): five processes opened IOMobileFramebufferUserClient between 326 and 363 s, selector 6 answered success with done/presented still zero, and validateSwap() was never called, so there is no swap yet. SpringBoard's trap moved from FBSDisplayMonitor to the FBSDisplayMode initialiser at FrontBoardServices 0x19f3d0500+0x244, which asserts with 'FBSDisplayMode cannot be configured as requested : %@' when one of its nine parameters fails validation and its ninth argument is 1. The host script's landing budget also grew a fixed DEADLINE_SLACK=120 s: the payload's 900 s deadline is counted from its own boot, so round202's own reset landed after the old budget had closed.", "Round203 raises the user-breakpoint reading to four lines per pid and only inside the dyld shared cache (start 0x180000000, end 0x208400000): the identity line, x4-x7, x19-x28 and the stack words x0 and x29 point at. It adds no configuration key; the payload title carries clover r203 and the new format strings are the contract the two checkers assert.", "Round204 gives SpringBoard its own eight slots and a 72-line budget: by the time it asserted, every generic slot and every budgeted line had gone to daemons that respawn. The probe now reads the mode object from x19 (x0 is a tagged NSString receiver), which printed the layout isa / width 1200 / height 1920 / integer scale 0 / computed double scale 0.0 / refresh 60.0 / gamut / hdr / rotation 3 / virtual, with x28 = 1 selecting the fatal branch. Width, height and refresh were already right; both scale fields were zero.", "Round205 adds one ADT property: /chosen/display-scale as a single u32 set to 2, so a 1200x1920 panel becomes a 600x960 point surface. The evidence is in libMobileGestalt.dylib, whose literal context is IODeviceTree:/chosen followed by display-scale and display-rotation; the keys were absent, so MobileGestalt answered zero and FBSDisplayMode rejected it. check-clover.py adds display-scale to REQUIRED_CHOSEN and asserts both the value and the one-cell length. The probe-side offline-legacy-unit-scale= boot argument stays forbidden because it would fight the ADT property startHardware matches.", "Round206 is the first frame on the wire: swap #1/#2/#3 accepted, frame #0/#1/#2 with 41586 changed pixels in 305x887..755x1029, copy 93 ms for 9216000 bytes, scanout #3 ok, retire #3 done=3 presented=3, and selector 6 tracking done/presented 0->3. The frame is black: 2262414 of 2304000 pixels are ff000000. SpringBoard appears once in the 512-record ring, as exit pid=27 rv=0x9 at 417.535062 with namespace 2 code 9 -- a reason the kernel synthesises on the default-kill path, so it names no sender. The r170 t= field is clock_get_uptime, not process runtime, and it runs about 50x slower than the ring timestamps (8 s at ring 417.5, 14 s at 758.1; mach_continuous_time 8.41 s at 437.9, 11.52 s at 600.2) while the 900 s deadline lands at ring 909 s, so ring time is real time and the kernel timebase is the slow one. Round206 adds no configuration key.", "Round207 corrects round206 and names the sender: SpringBoard's SIGKILL is backboardd's kill(2). patches/xnu-clover/zzzzzz-clover-crash-why.patch prints, on the default-kill path and before any lock, the receiver (pid/comm/ppid), the signal_reason namespace and code, proc_getcsflags(p), the sender (current_proc, kernproc for a kernel thread), __builtin_return_address(0) and &psignal_internal; the budget is eight receiver names at four lines each, forty lines per boot, and the driver tee class is r207-kill with 48 lines. The reading is killsig pid=27 comm=SpringBoard ppid=1 sig=9 spid=58 scomm=backboardd ns=-1 code=0x0 cs=0x22000301 ra=fffffff0076ffd7c anchor=fffffff007700b54. The anchor equals the link-time address, so nothing slides; scripts/decode-clover-address.py maps ra to _kill+0x140, a userspace kill(2) call inside backboardd -- not launchd, not jetsam, not AMFI. The CS word is CS_SIGNED|CS_DYLD_PLATFORM/CS_NO_UNTRUSTED_HELPERS|CS_KILL|CS_HARD|CS_VALID and carries no CS_KILLED, so no signature check killed it. The backboardd in this IPSW names the reason itself: _pingSystemShellForCollectiveWatchdog:, _collectivePingSystemShellSet, collectiveWatchdogPing, and the strings watchdogPing: system app claims it is no longer alive and Killing %{public}@. Round207 also retracts round206's timebase sentence: clock_get_uptime returns mach_absolute_time in raw ticks and the r170 t= field divided that by 1e9, so it was never seconds; ten ring/boot pairs, including 243.477 against 4674661937/19200000 = 243.472, all agree to 1.0000, and the 900 s deadline measures 899.5 s of CNTVCT, so the kernel timebase, mach_absolute_time, mach_continuous_time and the ring timestamps are one clock. Round207 adds no configuration key.", "Round208 reproduced neither the kill nor any later progress: the kernel ring holds no clover r207 or r208 line, its last row is [167.198224] fairplayd.A2 exit, and the 900 s deadline panic reports ring used=0x2ef with wr 751 bytes past rd but panic drain wrote=0 dropped=0, so the ring stopped gaining rows at 167.198 s while seq only reached 772 of 512 slots. teeKernelLog runs only on block I/O tails, so that silence means no block I/O completed for the next 732 s; CloverBlock's r190 sync-in pending=512 with sync-out ok=1 at 157.12 s is the last suspicious row before it. The timebase is not involved: ticks=170596 is the ArmCpu timer interrupt count, and cnt1-cnt0 measures 899.5 s. This frame cannot separate a stopped kernel from processes parked in uninterruptible waits, so round209 reads the msgbuf tail from the panic sink itself, which is the one path that still writes after block I/O stops.", "Round209 reads the msgbuf tail from inside the panic sink, and what it found is that the sink itself could not write. The deadline fired at 900 s -- the ArmCpu timer kept interrupting to the end and the panic reset brought the board to TWRP at 01:14:04 -- and the kernel ring in that window runs to seq 1166 with its last row [357.924561] clover r180: client pid=58 first selector=68, far past round208's 167.198 s: watchdogd's brk at 290.9/301.8 s, liveactivitiesd's brk at 312.1/317.8/321.8 s, bluetoothd's exits at 344.8/345.2 s, the APFS trim at 348.7 s and the display client's selectors 12/6/27/84/50 at 355.5 s and 68 at 357.9 s all arrived first. The report window holds eleven kind-20 records and every one is older: slot 10 is round208's own deadline panic (ticks=170596 cnt0=ed2faa6 cnt1=414cb588e) and slots 11..15 are zeros, so this frame's panic screen wrote no record at all. The verdict ring's CloverSdhci r184: panic drain wrote=0 dropped=0 tee_passes=8 row is round208's leftover as well: had this frame's drain run, panicTailRead would have pushed its three lines plus one status row and wrote could not be zero. The landing in TWRP is no evidence either, because round198 pre-arms the recovery BCB during bring-up (recovery BCB pre-armed rc=100 written=1). So the kernel was alive at 900 s and the card was not -- no block I/O completed after 357.9 s, since the tee only pumps on block tails and the drain wrote nothing -- and an append that succeeded at round208's deadline failed on this frame's. The reading is one transfer stopped in flight with the controller inhibited, not a stopped kernel, which is why round210 records the flight itself: clover_emmc_block_read/write writes a kind-23 record (seq, direction, lba, blocks, previous result and milliseconds) at entry into sectors 32..63 of the log window, an ArmCpu timer on CPU0 calls a beat every 4 s that samples SDHCI_PRESENT_STATE's CMD/DAT inhibit bits and takes the block guard with IOLockTryLock, and read-clover-log.py prints that region.", "Round210 adds no configuration key either: the title carries clover r210, the driver half records every block request at entry (kind 23 in sectors 32..63: seq, direction, lba, blocks, previous result and milliseconds) and an ArmCpu timer on CPU0 beats every 4 s with SDHCI_PRESENT_STATE's CMD/DAT inhibit bits plus an IOLockTryLock on the block guard, and read-clover-log.py grew --flight. Reading that frame back overturns round209: the entry chain runs to seq 184683 at t=900664 ms with ps=0x01f800f0 and 0..7 ms per request including 120- and 128-block reads, the beat chain runs seq 175..178 to 897566 ms with miss=46 constant and pend=0/0, and the panic sink did write (panic tail lines=3 unseen=0 refused=0 drop=0; kernel ring to 911.924696). The card and the block path were healthy up to the deadline and the controller was never inhibited. The stop is the kill at 457.346085: backboardd(58) sends SIGKILL to SpringBoard(27) with cs=0x22000301, ra=fffffff0076ffd7c and sender upc=0x1da501100, identical to rounds207/208, then exit rv=0x9. A sbthr snapshot shows SpringBoard holding only five threads, none with tid==pid, all in TH_WAIT (two with TH_WAIT_REPORT), and their pcs symbolize into DiagnosticRequestService and libswift_StringProcessing rather than the display stack. The panic append itself wrote no kind-20 record even though the ring drain succeeded, so round211 records panicAppendText's return code in the status row and pushes that row into the driver ring instead of the kernel ring (round209's placement made read-clover-log.py misreport it as a driver row), and prints every receiver thread's lr/sp plus six kernel stack frames from machine.kstackptr, and the sender's current thread, at the kill point.", "Round211 loses the reading it went for, and the loss is the block path, not the probe: this frame's flight chain ends at t=341015 ms on an 8-block read (lba=28308144) with no successor, the last CPU0 beat is t=340978 ms with ps=0x01f800f0, miss=21 and pend=0/0 and no beat follows, so the guard was taken by a request that never came back; the kernel ring's last row is [352.186939] CloverBlock r190: sync-out ok=1 pending=152. The machine lived to the deadline: eight kind-20 records land with cnt1=0x414c363c0..0x415005334 (913 s of CNTVCT) and fb=1, one per CPU, all on ArmCpu.cpp:644/647, so every CPU's unattended timer fired on its own. The panic sink wrote its two blocks and the r184 row reports wrote=4 dropped=0 tee_passes=8, yet panicTailRead produced nothing -- not the tail lines and not its status row -- and its only early return is the gTeeReady gate, which nothing in the driver clears, so either the flag read 0 at panic or that r184 row is older than this boot; no record carries a boot identity, so the frame cannot tell those apart. The kernel ring's CloverSdhci r211 kill lines never existed because the tee pumps only on block I/O tails and the panic path never read the buffer. Round212 therefore gives the kernel probes their own delivery: clover_emmc_probe_say() copies each line into a 32-slot RAM ring inside the driver (no card, no guard, no msgbuf) and the panic drain pushes it into the driver ring before writing, gBootId (CNTVCT at arming) rides word 9 of every record with boot= in the arming row, the drain says enter before any guard and exit at the end and flushes the driver ring through panicDriverFlush() even when the guard refuses, the tail read loses its gTeeReady gate and scans the whole msgbuf for 48 lines while always saying its status row, and the panic window becomes a seq-ordered ring because this frame's eight appends filled it.", "Round212 adds no configuration key again: the title carries clover r212, the driver reads and increments a kind-24 counter at log-window sector 1216 (record lba 13321432) and stamps it into header word 9 of every record, and read-clover-log.py grew --boot and a boot= column. The frame that followed proves the point of the boot id: 35 of the 36 driver records are boot 1, the single boot-0 record is the previous boot's r184 panic-drain line, and all twelve kind-20 panic records are boot 0, so this boot's panic wrote nothing at all. read-clover-log.py also stopped counting a filter as a listing -- decode(expect_kind=25) records a wrong kind as a problem and still returns the record, so --probe --count had reported 36 probe rows for a frame that carries none; main now filters with of_kind() before counting, and the selftest asserts that --probe selects only kind 25."," Round217 read the kill before it happened: the trylock walker logged sbbusy=0 and the sampler emitted 15 sbs rows and five sbthr rows at the kill itself, and exit followed 18 ms after the signal instead of 39 s. The five threads sit in TH_RUN/TH_RUN|TH_IDLE with user pcs that, after this boot slide 0x1050c000, all land in libsystem_kernel syscall stubs (+0x18e8, +0x1b58, +0x1970, +0x4bdc, +0xdb58), so no kernel-side wait is the cause. SpringBoard never created an IOMobileFramebufferUserClient (clients are pid 86, 58, 97, 56, 74) while backboardd keeps presenting 305x887..755x1029 black boxes, so the missing step is SpringBoard own render start-up."]
completion = ["board.toml parses, every pinned source resolves, two checkers pass, and the record names each area this board implements or plans."]
limits = ["A local source override can differ from the published pin; record the effective source with the verification result.", "The record describes this repository. The uefi-clover repository owns its firmware implementation."]
next_action = ["r234 and r235 add no configuration key: both rounds move only the payload title (clover r234, then clover r235) and ship one kernel patch each under patches/xnu-clover/ (zzzzzzzzzzzzzzzzzzzz-clover-r234.patch for the port-set work, zzzzzzzzzzzzzzzzzzzzz-clover-r235.patch for the is_active(space) guard), with no boot argument, defconfig line, archive entry or identity field moving.", "r236 stays inside the same contract: the deadline record and the panic-sink marker are driver and kernel-patch work, and the backboardd stack capture rides the existing sampler, so kernel_args keeps clover-unattended=1800 and the three parked instruments stay parked.", "r237 also adds no configuration key: the ulock wait/wake accounting rides the existing probe ring and the stack walker, so kernel_args keeps clover-unattended=1800 and nothing else moves."]

