findings = ["sheng's network area is an ath12k PCIe device with MHI and QRTR. clover has neither the same device nor the same transport.", "Round164 leaves the network inventory unchanged.", "Round167 leaves the network inventory unchanged.", "Round168 leaves the network inventory unchanged.", "Round169 leaves the network inventory unchanged.", "Round170 leaves the network inventory unchanged.", "Round171 leaves the network inventory unchanged.", "Round172 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round173 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round174 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round175 adds no network work; WCN3990 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round176 adds no network work; WCN3990 WiFi and Bluetooth stay without a driver. The board.toml edit this round is the menu title, nothing else.", "Round177 adds no network work; WCN3990 WiFi and Bluetooth stay without a driver. The board.toml edit this round is the menu title, nothing else.", "Round178 adds no network work; WCN3990 WiFi and Bluetooth stay without a driver. The board.toml edit this round is the menu title, nothing else.", "Round179 and Round180 add no network work either; WCN3990 WiFi and Bluetooth still have no driver and no transport. Round180's board.toml edit is a display archive swap, three display boot arguments and the menu title -- none of them names a bus, a firmware path or a network stack, and the area's own paths are still limited to board.toml.", "Round181 changes no network fact: WCN3990 WiFi and Bluetooth stay unclaimed, and no packet path is involved. Its share of the round is the board.toml archive line, boot argument and title.", "Round182 adds no network work; its board.toml edit is the CloverPower archive entry, the clover-power=3 argument and the menu title.", "Round183 names WCN3990's heap entries without touching the chip: the shared heap is read for the wlan_msa row (0x85700000 + 0x100000) and the wlan_guard row (0x85600000 + 0x100000) and each region is scanned 16 pages deep for the ELF magic word, which says whether any firmware was ever placed there by this boot. The subsystem register block at 0x18800000 + 0x800000 is deliberately not mapped, no icnss driver exists, and there is no MHI, QRTR or packet path of any kind, so a zero-filled wlan region is a question about the boot loader's firmware loads rather than a verdict on WCN3990.", "Round184 sends no packet, reads no WCN3990 or qcom,icnss register, and only stops the round183 image scan from running this boot by commenting clover-dsp=3 out -- so the wlan MSA question is unanswered, not answered. What round183 did establish stands as this area's input: the shared heap is alive, its $TOC partition table parses, and part(3) carries host pid 1, which is ADSP.", "Round185 runs no DSP probe and touches no ADSP path: the CloverDsp archive is still built and still parked, and the round183 fork line (adsp_edge / adsp_loaded) still has no reading because the panel filled before it, which is precisely why this round spends itself on the card instead of the panel.", "Round186 adds no networking code and no new writer on the card: both probe print sites go through the same kernel log tee (kind 22) that already carries every other reading, and each site caps itself at 24 lines so a spawn loop cannot fill the ring.", "Round192 adds no networking code: the only writer on the card is still the log tee, and this round actually removes one writer of a sort -- the boot no longer turns the eMMC write cache on, so every log record is on the medium when its write returns instead of waiting in a cache that a commit has to drain.", "Round193 leaves the network area untouched; the new boot argument is consumed only by proc_should_trigger_panic in the kernel.", "Round200 leaves the network area untouched: the r200 probe opens no socket, and its two new register dumps come from the user breakpoint path.", "Round311 adds no network work: it opens the GPU line's fourth window (mem-acc acc-sel-l1 at 0x01fcf004) and ships unflashed while boot 103 stays on the card.", "Round312 is this area's first reading round and it is host-only. The transport is now a fact rather than a guess: the flashed DTB carries qcom,icnss@18800000 with membase 8 MiB and no PCIe host controller node anywhere in the file (pcie appears only inside the pcie0-hwev reg-names string at dump line 2143), and the vendor driver for that compatible -- notes/sources/sdm660/icnss.c, sha256 1c7cfa6d9a8d573d014b901fa9da88b6d94ca628f8e8304188f4d0101f2d70b6 -- contains zero occurrences of pci, maps membase once and never readls it (:2256 hands the block to the MSA pool), so icnss_hw_power_on() at :574 is only vreg_on plus clk_init and the real channel is QMI over service-locator.", "Round312 finds every dependency of that chiplet held by RPM: pm660_l5 and the pin-controlled l6/l9/l19 are all qcom,rpm-smd-regulator (three of them with qcom,enable-with-pin-ctrl following HW_EN1), and both cxo_ref_clk_pin and the ANOC2 SMMU's smmu_aggr2_noc_clk come from qcom,rpmcc.", "Round312 measures this area's ceiling instead of assuming it: ~/UniXNU/out/ipsw/21H461/kernelcache.decompressed carries exactly one WLAN driver family, AppleBCMWLAN with its BusInterfacePCIe and IO80211Controller, and nothing that can match qcom,icnss. Even rails-up, firmware-up and QMI-up would leave iOS with no consumer, so the network area stays read-only instrumentation and does not take effort away from the desktop's missing pixels.", "Round312 corrects two things the next round would have inherited as premises. The touch supplies are pm660l_l3 (fixed 3000000 uV, dump line 5553) and pm660_l11 (1775000..1950000 uV, line 5250), both qcom,rpm-smd-regulator, and pm8950 appears nowhere in this board's DT -- the CloverInput comment claiming PM8950 rails through SPMI was a vendor-tree analogy and is withdrawn. Those two enables have still never been read: r182 mode 3 stopped at not a v5 arbiter (03000000) on the round183 frame, under a line that already said rails unproven. Touch-NACK-because-unpowered is therefore neither proven nor ruled out, and the arbiter-version cell comes before any rail claim.",
  "Round316 changes nothing for the network area: the r312 verdict stands (this board tree has no PCIe host controller node and iOS has nothing that could bind qcom,icnss), so the area stays read-only reconnaissance and its board.toml row is the title only.",
   "Round318 changes nothing for the network area: the r312 verdict stands (this board tree has no PCIe host controller node and iOS has nothing that could bind qcom,icnss), so the area stays read-only reconnaissance and its board.toml row is the title only.",
