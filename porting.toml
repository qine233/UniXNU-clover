[[area]]
id = "storage"
status = "implemented"
components = []
paths = ["drivers/CloverSdhci/**", "drivers/CloverBlock/**", "scripts/make-clover-root.py", "scripts/make-clover-apfs-container.py", "scripts/make-clover-sparse.py", "scripts/make-clover-trust-bundle.py", "scripts/append-data-window.py", "scripts/verify-userdata-window.py", "scripts/seed-data-skip-setup.py", "patches/xnu-clover/**"]
inputs = ["SDHCI host at 0xc0c4000, eMMC card left by firmware in HS200, 8-bit, 200 MHz.", "GPT windows: OS, Cryptex1,SystemOS and the appended scratch Data window inside the userdata partition; cache is the payload partition.", "APFS container on the OS window and a 32 MiB APFS Data seed (volume UUID FC1A580E-2D67-48FC-B8CF-87422A319340) appended as a third SHNGROOT entry; mockfs root image and a three-module trust cache."]
configuration = ["drivers/CloverSdhci publishes the eMMC windows, switches the link to HS_TIMING=1, 8-bit and 50 MHz after identification, and proves it with LBA 1 before raising gBlockReady.", "drivers/CloverBlock exposes the windows to IOStorageFamily, publishes the Data window writable, and answers native_ram_block_volume_seed() / native_verified_block_manifest_sha384() for the owner mounts.", "clover-emmc=21 reads EXT_CSD and walks the GPT; clover-apfs=3 loads apfs.kext and publishes the OS volume; no rd= argument exists.", "patches/xnu-clover/zzy-clover-owner-root-trust.patch accepts the owner-provided root; zzy-clover-systemos-mount.patch turns the SystemOS union, boot manifest and Data mount on inside kern_exec.c and IOKitBSDInit.cpp."]
procedure = ["Verify GPT windows, the APFS container and the appended Data entry on the host before flashing.", "Run scripts/verify-userdata-window.py --crc --apfs on the exact sparse file a userdata flash will use; it refuses anything but OS + SystemOS + Data with the writable flag, a seed that does not hash to the pinned image, or an image past the partition.", "Cold-flash cache, and userdata only after the exact fastboot command is declared and approved; the Data mount writes only inside the appended 32 MiB window.", "Run scripts/check-clover.py and scripts/verify-clover-payload.py after changing the driver or the payload."]
findings = ["Round137 mounted the APFS root; round143 union-mounts the SystemOS volume at exec; round150 accepts the unsealed root through the owner audit instead of an rd= alias.", "The SystemOS volume carries the dyld shared cache. Round153 read a directory open, the main cache and .01 with err=0 and both header words dyld_v1 arm64, but dyld_flags=0x0 and syscall 536 is not entered.", "Round156 removed the 160 us per-word FIFO wait: reads are level-gated, use CMD18 in 32-block batches and CloverBlock hands over 16 KiB at a time. Round157 makes CMD12 R1b-complete and rejects DATA_CRC, DATA_TIMEOUT, DATA_END_BIT and ADMA_ERROR instead of accepting a damaged block.", "Round159 completed the link: after identification the driver sends CMD6 HS_TIMING=1 and BUS_WIDTH=8, programs the 50 MHz sdcc1_apps_clk_src row and reads the GPT signature at the new rate, falling back to 400 kHz if any step is refused. The same round appends a 32 MiB APFS Data seed as a writable SHNGROOT window, so the kernel's owner Data mount has a card-backed /private/var.", "The round159 frame shows the whole storage chain working: the three CloverBlock manifest/data rows, seed data bsd=disk5s1 bytes=33554432, APFS mount-complete volume DawnData with UUID FC1A580E-2D67-48FC-B8CF-87422A319340, then load_init_program for /sbin/launchd. dyld opened the cache directory, the main cache and .01 with err=0, read a dyld_v1 arm64 header from both and registered the 224 KiB .01 signature blob with err=0 in 189 ms; 16 KiB blobs take 7 ms, about 1-2 MB/s versus 25 KB/s before round156.", "Round160 adds the host gate for that image: scripts/verify-userdata-window.py expands the all-RAW sparse container, checks the SHNGROOT model and the Data bytes in place, and optionally recomputes the container CRC-32 and mounts the seed read-only to prove its volume UUID. The round159 archive passes with 9,416,212,480 bytes, three windows, CRC 0x6c29b693 and UUID FC1A580E-2D67-48FC-B8CF-87422A319340.", "The slow PIO path still measures about 25 KB/s, so a 16 KiB batch holds a buffer lock longer than XNU's 524 ms lock timeout. ml-timeout-lock-panic-scale=40 raises that deadline to about 21 s.", "The second frame from the same round159 image shows launchd running and spawning logd and dasd, but every child's exec fails in ubc_cs_blob_add with EBADEXEC (85), load_code_signature returns LOAD_FAILURE (4), and AMFI kills the process with 'dyld signature cannot be verified'; launchd respawns forever (pids 13621 to 13675). A host check of 044-76040-038.dmg puts logd 4882a798, dasd db318f4f, dyld b479f90e and launchd 1d52c697 all inside the 2478-entry static trust cache, and their blobs are structurally valid (logd: signature at 224912, 21120 bytes, fade0cc0, inner length 3108, five indexes), so the gate is before MACF and the suspect is the bytes the kernel reads or the LC_CODE_SIGNATURE offset/size.", "Round163 stops measuring and removes the last gate it can see: the prelinked AMFI exec hook at VA 0xfffffff004ab40e4 tests the signature check result and CS_REQUIRE_LV before jumping to the allow path. The 4-byte cbz (34 00 02 29) is replaced by b (11 00 00 14) at kernel.macho file offset 0x1a830e4, so the hook always takes the allow path. Only the payload is rebuilt from that kernel copy; the EBADEXEC root cause is untouched.", "The r163 frame proved that branch was not the killer: with check failed and CS_REQUIRE_LV clear the cbz is not taken. Round164 NOPs the real decision at VA 0xfffffff004ab416c (file 0x1a8316c, tbz w0,#0, 20 05 00 36 to 1f 20 03 d5), whose w0=0 means no valid signature and falls through to the kill at 0xab4210. The same round adds zzy-clover-dyld-cache-skip.patch: on a 4K kernel a 16K-signed blob is marked csb_native4k_skipped and cs_native4k_prepare returns without reading the whole codeLimit, while cs_validate_hash accepts the faulted page. The 3.7 GiB dyld caches at 1-2 MB/s would otherwise spend tens of minutes per exec deriving 4K hashes. EBADEXEC (85) from cs_blob_init_validated is still untouched.", "The round164 frame closes the AMFI question and opens the read-path one: the kill line is gone, yet every child still reports unable to create a validated cs_blob object: 85 and load code signature error 4, pids keep climbing, and mediaserverd ends with Too many corpses being created. The same frame carries APFS's own integrity failure: apfs_jhash.c:146 disk0s1 Data hash mismatch for 16384 bytes at offset 12128256 in compressed data stream 102 of inode 162 (expected jhash 2e6c78f0..., got 0d13...), Verification failed with error 94, then apfs_pagein_with_verification reports Corrupt read data. Here 102 is the data-stream number, not a byte count.", "Round165 treats that as a block-layer bug rather than a signature-policy one: every read command starts with drainReadFifo (read BUFFER until DATA_AVAILABLE clears) and prepareReadPath, any failed transfer or leftover FIFO triggers resetReadPath (SDHCI_RESET_DATA), and the first full batch runs a one-shot A/B check that compares two CMD18 reads with 32 CMD17 reads of the same 16 KiB. Disagreement sets gReadBatchTrusted = false and the rest of the boot reads single blocks. Every outcome prints CloverSdhci r165: readcheck lba=... batch=.../... single=... diff=.../... first=.../... m=... s=...; a rejected batch adds CloverSdhci r165: batch reads disabled for this boot.", "Round166 retires the batch instead of trusting it: gReadBatchTrusted starts false, so every read this boot is the single-block sequence every round before r156 used, and checkReadPath still prints the A/B row as evidence about its one 16 KiB sample. The same round adds the missing resetReadPath on readDataBlock's command-response refusal, and zzy-clover-exec-sig-bytes.patch prints dataoff, datasize and the first four words of the first eight code-signature blobs load_code_signature reads. The host side cleared the image first: the whole OS window mounts and reads file by file (~6 GB, decmpfs included) with no hash or I/O error, and launchd, dyld and trustd all carry a fade0cc0 SuperBlob at their LC_CODE_SIGNATURE offsets, so the wrong bytes can only be produced on the device.", "The r166 frame moves the wall from wrong read bytes to the writable container: launchd_cache_loader[22] exits with namespace 2 subcode 0xa (SIGBUS), initproc death panics the machine, and APFS prints apfs_scan_verify:2467: disk0s1 failed to read ... followed by Container corruption detected by apfs_scan_verify while Persona 1000 loads. APFS says read failure, not checksum mismatch, and the same boot still opens the SystemOS caches with err=0 after a whole boot of single-block reads, so the batch was not the cause. The only difference from r161, where the same driver read 3.7 GiB of cache, is that the Data volume was written during the persona step.", "Round167 repairs the write path and restores batched reads behind a three-sample gate. writeSettled waits out SDHCI_DATA_INHIBIT and then polls CMD13 until R1_READY_FOR_DATA and R1_STATE_TRAN; a batch or block that is not confirmed is not counted and prints CloverSdhci r167: write not ready lba= blocks= rsp= st= polls=. writeMultiBlock checks sendStopCommand and resets the data circuit on a dirty phase. writePioBlock drops the 160 us per-word gap for level-gated writes, and both request deadlines scale as frequency * 2 + blocks * frequency / 200. At mode 21 the driver reads EXT_CSD CACHE_SIZE and clears CACHE_CTRL (byte 33) unless it is already zero, logging CloverSdhci r167: write cache size= ctrl= off= rsp= st=. checkReadPath now reads the same 16 KiB three times (two CMD18, 32 CMD17) and sets gReadBatchTrusted only when all three agree exactly; it prints CloverSdhci r167: readcheck lba= ... trusted=... and then either batch reads trusted for this boot or single-block reads for this boot."]
completion = ["The OS root mounts, the SystemOS volume is union-mounted, /private/var is the card's Data window, launchd executes, and dyld maps the shared cache without a MAC or signature refusal."]
limits = ["The Data window is a 32 MiB scratch seed, not the full /data partition; it is writable but small, and it is appended between the two GPT copies rather than declared by the GPT.", "The launchd-to-daemon path is blocked inside ubc_cs_blob_add: the kernel rejects each main binary's signature blob with EBADEXEC (85) before MACF, even though the same file's cdhash is in the 2478-entry static trust cache and the host blob is structurally valid. The suspect is what the kernel read, not the trust decision. Round164 removes both AMFI deny branches and skips the whole-file 4K hash without explaining the 85; the most likely shape is a truncated blob read (logd's signature is 21,120 bytes at file offset 224,912, crossing a 16 KiB batch boundary).", "The shared-region mapping syscall 536 still has no reading: each exec dies in the respawn loop before the mapping result can be observed. With AMFI bypassed this is the next candidate wall.", "There is no UFS, virtio-block or native verified-root component; sheng's storage stack is SM8550-specific.", "The 85 and the APFS read failure are not yet proven to share one cause. Round167 repairs three write-path defects and the missing CACHE_CTRL clear, but the r167 image has not been measured; if APFS still reports a corrupt container after this flash, the Data seed itself needs a host-side check before another firmware change.", "Batch reads are trusted again only when the two CMD18 samples and the 32 single-block samples of one 16 KiB read agree word for word; any disagreement keeps the whole boot on single blocks, so a frame with trusted=0 is a read-path verdict, not a performance one."]
next_action = ["Cold-flash cache with ~/clover-out/round167-payload.img. Read CloverSdhci r167: write cache ... off=1 and CloverSdhci r167: readcheck ... trusted=... first; then watch whether apfs_scan_verify's failed to read and Container corruption detected disappear, and whether launchd_cache_loader still exits with SIGBUS. A trusted=0 row keeps the boot on single blocks and is a read-path verdict; a write not ready row names the first unconfirmed write."]

