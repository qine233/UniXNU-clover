inputs = ["UEFI GOP framebuffer at 0x9D400000, 1200x1920, stride and pixel format published by uefi-clover.", "No MDP5 or DSI driver is selected."]
configuration = ["CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y makes build-xnu-4k-baseline.sh force-load build/native-legacy-display/libNativeLegacyDisplay.late.a by exact path, after re-hashing that archive and every source named in its build-report.json, and compiles the probe calls into bsd_init.o and IOUserClient.cpo.", "The display stub is retired: no archive named libCloverDisplayStub.a is built or linked, and scripts/build-clover-display-stub.py is deleted so a tree copy cannot resurrect it.", "Phase 1 is what ships: offline-mobile-graphics-load=1 gates the probe entry, offline-legacy-register=1 lets it register and construct one IOMobileFramebufferLegacy, offline-legacy-phase=1 stops it before attach and start. The swap-path arguments (offline-legacy-validate/transfer/retire/pm, sheng-fb-gpu) and phases 2/3/4 are deliberately not passed.", "The panic screen and entry probe still paint directly through the framebuffer mapping; that path is unchanged and does not depend on this archive."]
procedure = ["Build the kernel, then re-run scripts/build-clover-gop-legacy-display.py against out/clover/kernel/kernel.macho and read the two object hashes in build/native-legacy-display/build-report.json: the archive is built before the link, so the rebuild is what shows the shipped image still qualifies at every pinned binding.", "Cold-flash cache with the round180 payload, return to recovery, run scripts/run-clover-unattended.sh and scripts/read-clover-log.py --tee; the three phase-1 lines land on the card's kind-22 ring, not on the panel.", "Only after phase 1 reads back does a phase become openable: 2 waits for the IOSurface root, 3 adds the GOP nub plus attach and start, 4 hands frames to the presenter."]
findings = ["sheng's display area uses GopFramebuffer, AppleARMBacklight and the SM8550 DPU. None of those describes this board's MDP5/DSI path.", "clover's framebuffer is used only for boot diagnostics, not for iOS presentation.", "Round163 leaves the display path and the panic screen unchanged.", "Round179 qualifies the original Legacy display class inside this board's own kernel image, with no runtime involved: the family executable text matches the hash every port of this family was audited against, the three protected constructors still load their vtables the way the original does, the base/service/Legacy vtables have 262/262/358 live entries, exactly the nine documented abstract slots are left at the kernel pure-virtual stub, and IOService::newUserClient with the four-argument ABI occupies slot 141. The class identity that sheng could only observe from a stopped VM is derived from instructions here: the family carries exactly one meta class registration with instance size 0x18a0, its name and parent arguments decode to IOMobileFramebufferLegacy and its parent record, and the getter that sits right before the registration thunk materialises the record that the class accessor materialises again.", "Round180 turns that qualification into linked code. The archive is built from this device repository's drivers/NativeMobileDisplay -- the builder refuses the base module, whose NativeMobileDisplay.cpp still claims the main display only for v_display == 1, while on this ARM port that field is the Text/Graphics flag -- and every one of its 193 original bindings is an address inside Apple's family text that the builder re-reads instruction by instruction from this kernel before it will emit the archive. Re-run against the freshly linked image, the family text is the same 225140 bytes at 0xfffffff00576c000, all 193 bindings land where they did, and both objects are byte-identical; the 160 slot addresses that did move are the inherited native entries and the nine pure-virtual leaves, which live in other kexts' text and move with kernel growth. archive_sha256 is not evidence of reproducibility: ar stamps each member with its mtime, so two consecutive runs give different archives over identical objects.", "The patch-replay order bit this round: zzy-clover-dyld-cache-skip.patch shares ubc_subr.c and ubc_internal.h context with the earlier native-4k-signature-hash-cache.patch, so once the newer one is applied neither patch passes --reverse --check and the replay stops. The build sequence now reverses the newest patch first, the same convention the script already uses for the three base patches that overlap root/exec context.", "The payload verifier's round164 byte fingerprint also taught something: one byte in the hash-accept group is the ADRP immlo, i.e. the page delta to its target, and the display archive growing the kernel text by a page made a present patch read as absent. The three groups are now masked regular expressions -- address-encoding bytes are wildcards, register numbers, immediates and the condition are not -- pinned in check-clover.py as len(re.findall(pattern, kernel)) == 1.", "Round183 changes one line in scripts/build-clover-gop-legacy-display.py -- the same conditional iPhoneOS SDK pin the other three record-replaying builders got, because a full XNU pass leaves --isysroot out of the compile record and -Werror turns the mismatch into -Wincompatible-sysroot -- and touches no display code. It then re-ran the post-link audit against this round's freshly linked kernel for the second time in this project: kernel_sha256 1c48bac7, the family text still the same 225,140 bytes at 0xfffffff00576c000, compiled_object_sha256 1b6c134e and late_object_sha256 a061787e byte-identical to the previous round and all 193 bindings where the audit said they would be. That is the first round in which the kernel grew (16,384 bytes, a fifteenth archive) and the display class provably did not move, which is the reproduction evidence this audit exists to produce."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation works."]
limits = ["Nothing has been read back from hardware for this archive: original_instructions_modified, driver_initialized, display_presented and device_observed are all False in its report, and the board's display evidence is still the panic screen and the entry probe.", "Phase 1 never attaches or starts the object, so seven backend leaves stay guarded and no framebuffer slot of the original class is exercised.", "No MDP5 or DSI path, no backlight control (pm660l_wled is an LED driver, not a PWM) and no frame timing.", "The linked driver reads the splash framebuffer the firmware handed over; it does not bring the panel up."]
next_action = ["Cold-flash round180 and read the three phase-1 lines off the card's kernel ring: the console geometry PE_current_console handed this kernel, the constructed object's size and metaCast result, and either init's IOReturn or the refusal line that names the step the class does not survive.", "Then open phase 2 (IOSurface root) and phase 3 (GOP nub, attach and start) one at a time, each only after the previous one reads back; the swap path stays closed until a display is started."]
