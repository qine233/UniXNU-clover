findings = ["sheng's GPU area targets Adreno 740 with AdrenoMetal, AirNir and the SM8550 platform. The register layout, GMU firmware and submission format are different on Adreno 512.", "Round164 leaves the GPU inventory unchanged.", "Round167 leaves the GPU inventory unchanged.", "Round168 leaves the GPU inventory unchanged.", "Round169 leaves the GPU inventory unchanged.", "Round170 leaves the GPU inventory unchanged.", "Round171 leaves the GPU inventory unchanged.", "Round172 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round173 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round174 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round175 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round176 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round177 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round178 adds no GPU work; Adreno 512 stays without a driver. The board.toml edit this round is the menu title, nothing else.", "Round180 adds no GPU work; Adreno 512 stays without a driver, and the display archive it links is not one -- the driver reads the splash framebuffer the firmware handed over and reaches no GPU path. The swap-path arguments that would involve a GPU (sheng-fb-gpu, offline-legacy-transfer/retire) are compiled in but deliberately not passed.", "Round181 changes no GPU fact: the Adreno 512 still has no driver and no iOS display stack behind it. Its share of the round is board.toml only -- the CloverInput archive entry, the clover-input=3 argument and the r181 menu title.", "Round182 adds no GPU work and changes no GPU fact; its board.toml edit is the CloverPower archive entry, the clover-power=3 argument and the menu title.", "Round183 adds no GPU work; Adreno 512 still has no driver, no GMU firmware and no command submission, and the display archive it links in is the same round180 one, re-audited rather than rebuilt from new bindings. Its share of the round is board.toml only -- the CloverDsp archive entry, the clover-dsp=3 argument and the r183 menu title.", "Round184 moves neither display argument nor GPU surface: the three round180 legacy-display boot arguments stay, the phase 2 to 4 switches stay absent, and no Adreno or MDP5 code is reached. Its share of board.toml is the three instrument arguments that left kernel_args, the unattended deadline that returned, and the r184 menu title.", "Round185 changes no display byte: the three offline-legacy arguments remain the only display phase switch shipped, and the Legacy archive re-audited against this round's kernel still produces compiled_object_sha256 1b6c134e and late_object_sha256 a061787e with all 193 original bindings unmoved -- the closed-loop re-audit passing is the evidence that the archive linked into this kernel is still qualified against it.", "Round186 changes no display switch, no boot argument and no binding. The Legacy archive was rebuilt against this round kernel and the closed-loop audit passed with compiled_object_sha256 1b6c134e and late_object_sha256 a061787e -- byte-identical to round183/184/185 -- 193 original bindings unmoved and family_text_sha256 still the 2e044ee6 sheng pins, which is the evidence that the shipped payload carries exactly the audited bytes even though the link layout moved by 0x4000.", "Round192 changes no display switch, no boot argument and no binding. The Legacy archive is rebuilt against this round's kernel but its probe readings (r180) and the display boot args are byte-for-byte the same, and the cache decision happens after the display probe has already run.", "Round193 leaves the GPU area untouched; no payload layout, archive or boot argument used by the display path changes.", "Round200 leaves the display area untouched: the fifteen-archive link is unchanged, the legacy display archive is still the round180 build with the same two object hashes, and the r200 readings come from the user breakpoint path, not from the display probe.", "Round261 makes this area a candidate root cause rather than a later milestone: the boot-48 dispatch group that never drains belongs to libVFXCore (VFX.framework), a render-side framework, and the thread that waits on it is inside backboardd's own touch-event pipeline calling `descriptionForRootObject:` into it. sheng's repo carries no VFX workaround and no switch to skip it; what it carries is a GPU stack -- `Adreno740`, `AdrenoMetal`, `AirNir`, `Sm8550Platform`, `AdrenoPM4`, `AdrenoFirmware`, `ArmSmmu4K` -- with the two facts that say what a desktop needs from it: `the idle desktop submits 6 command buffers per 250 ms at 120 Hz` and `the render server primes all 162 Metal libraries of the OS image while the desktop is idle`. This board ships none of that: no GPU driver, no firmware, no renderer, and the display path reached by round180's legacy archive never touches a GPU.", "Round261 also records what is NOT proven: that the pending leave is a render completion. The rival reading is that the block belongs to another backboardd queue which is itself parked (the touch transport being the obvious candidate, since the panel NACKs). r262 decides between them with one reading -- every thread of pid 58 with its state, pc/lr, kernel frames and the word it sleeps on, in the shape of sheng's BootUiTraceProbe -- and until that reading exists no GPU driver work is scheduled.", "Round262 read the whole task, not the filtered six: boot 49's census of pid 58 resolves to three continuations against this kernel's own symbol table -- _ipc_mqueue_receive_continue (ten threads receiving on their ports), _ulock_wait_continue (tid 0x3b4, on the group word 101985a54 = base +0x34, wr=0 cw=0, age 822 to 1087 s) and _workq_unpark_continue (six dispatch workers parked waiting for work). No thread of the process sleeps inside IOKit or a driver, and free workers exist, so the missing leave is not a kernel-side completion and not a lack of runnable threads: the block was never enqueued, or its completion is expected from outside the process. What the census cannot yet separate is an idle receiver and a thread waiting for an answer that will never come -- both are the same continuation -- so the GPU branch stays open, and r263 closes that gap the way sheng's BootUiTraceProbe does: a per-thread block deadline (0 = untimed idle wait, finite = a timed wait for a reply) plus the port its wait event belongs to and that port's owning service.", "Round263 widened the census to answer what boot 49 left undecidable -- _ipc_mqueue_receive_continue is the same shape whether a thread is idle awaiting work or blocked awaiting a reply that will not come -- by adding dl= (the thread's own wait_timer deadline, so 0 means nothing will ever expire the wait) and peer= (the owner of the send right read from the mach_msg2 trap's x6, named by the r232/r233 lookup). If boot 50 shows a waiter parked in a timed mach_msg2 to a named service, the answer is owed by that service; if every receiver is untimed, the render-completion branch this area owns ", "Round263's own reading then refuted the peer= half of that plan before boot 50: the register used for the send-right name (x6) is rcv_size|priority in this kernel's mach_msg2_trap unpacking (osfmk/ipc/mach_msg.c:934, struct mach_msg2_trap_args at osfmk/mach/mach_traps.h:465), so peer= resolved a size and every row printed -. Read by the correct word, boot 50 shows 27 threads inside the trap and exactly one holding a send right (tid 0x40c, remote=0xcb03, rcv=0xf007, four consecutive beats); the other 26 are pure receivers with remote=MACH_PORT_NULL. dl= was 0 in all 43 rows, so nothing in the process waits on a clock -- a forever wait, which is also why the group never expires.", "Round264 image-side recon (host only, no boot spent) re-names what the forever wait is waiting for. The async group is not a Metal library/shader compile: asyncGroupRequests, waitAsyncGroup, groupID and AsyncGroupRequestState all live in dyld_shared_cache_arm64.07 next to _TtC7VFXCore12TextureCache, VFXCore/TextureCache.swift and the CacheEntry state errors (Can't wait cache entry in non loading state, Can't fetch texture, Failed loading VFXBRDF in Bundle) -- it is a texture load. The shader-shaped evidence was two misreadings: _renderPipelineStateForFramebuffer:device: is really _renderPipelineStateForFramebufferDescriptor:device: (a pipeline-state cache ivar beside _depthStencilState and _encoder), and Error: failed to create Metal library: %@ sits in the ImGui debug overlay (ImguiLibrary, imgui.ini). A load whose completion is -[MTLDevice newTextureWithDescriptor:] needs a device that can answer an allocation, not a device that can render.", "Same recon, three bounds on the CPU-first route, each quoted from the string itself: the window server's no-Metal branch is not a fallback -- dyld_shared_cache_arm64.03 carries CoreAnimation: Software renderer! Simulating crash! immediately beside CoreAnimation: Failed to initialize Metal or OpenGLES contexts! and windowserver-server.cpp's _shutdown_called; a real CPU renderer exists but only for CoreImage (NUSoftwareRenderer initWithCIContext:priority: in dyld_shared_cache_arm64.13, with NUDevice_iOS.m's Software renderer is unsupported in the same image); and swiftshader is not a device here -- its only two hits are the EGL extension token EGL_ANGLE_platform_angle_device_type_swiftshader inside WebCore's libANGLE. AppleSoftwareRenderer, llvmpipe and MTLCreateSoftware* are zero across all 54 slices.", "One judgement this round made and then retracted: the VisualLogger switch is real but named enableRecording (two sites in .07, in the ECS Scheduler's recorder field list beside beginFrame(), currentJobID, recurrentJobs, jobQueueForThisFrame -- the .31 hit for enableRecord is a different framework's enableRecordButton:). Because the texture group's own string neighbourhood has no recorder gate, this round first wrote the lever off as baseless. That dismissal was itself baseless: r261 resolved the waiting thread's ten user frames and the two deepest land in VisualLogger.framework in .31, above them libVFXCore, then backboardd (descriptionForRootObject:, class BKTouchHitTestContextMap), then libVFXCore again where it sleeps -- the recorder is what pulls VFXCore into this touch path. So suppression stays the cheapest CPU-first candidate; what is still unproven is who turns VisualLogger on (.31 has zero hits for com.apple.visuallogger, VisualLoggerAgent, VLServer, CFPreferences and CBCopy, but 63 MobileGestalt and 30 MobileAsset strings, so the gate is more likely a gestalt key or an asset type than a preference). A string neighbourhood can refute a causality I invented; it cannot refute one the board's own stack already showed.", "Round281 opens this area as a parallel workstream rather than a later milestone, at the user's 2026-11-02 direction to start the GPU driver in parallel with the CPU-first desktop work. notes/gpu-bringup.md pins the a5xx facts before any code: GPU 0x05000000+0x40000, chipid 0x05010200, GPUCC 0x05065000, GCC 0x01830000 (round282 corrected this: the board's DT puts GCC at 0x00100000, `clock-controller@100000`, and CloverInput's own registers already used that base -- the 0x01830000 quoted here was a wrong pin), SMMU 0x05040000+0x10000 with its three IRQs and the GPU bank at gpu-offset 0x48000, the two GDSCs gdsc_gpu_cx/gdsc_gpu_gx (GX needs GFX3D_CLK_SRC), zap PAS 13 a512_zap at 0xf0b00000+0x2000, and the RB-side a530_pfp/a530_pm4 microcode in place of the GMU this chip does not have. Round 1 of this workstream is read-only for a reason the register set makes plain: chipid, GPUCC and GDSC reads answer the three questions that gate everything else (is the block alive, is AHB clocked, is a GDSC already on) at zero risk, while a write before those readings would make an unpowered block and a misprogrammed one indistinguishable.", "Round282 starts that workstream with the reading itself and corrects round281's GCC pin. The board's DT gives `clock-controller@100000` reg `<0x100000 0x94000>`, so GCC is 0x00100000 and gcc_gpu_cfg_ahb_clk's 0x71004 offset lands at 0x081004; 0x01830000 was not a second GCC and the round281 note is amended rather than kept as fact. The probe maps only two windows, GCC and GPUCC 0x05065000, and never GPU core 0x05000000, SMMU or chipid: reaching those safely needs GX and the gfx3d root, which this round does not control. GCC is read every fire (gpu_ahb/gpu_bimc/bimc, beside gcc_sdcc1_ahb/apps as a same-page positive control, because a zero GPU bit beside a one eMMC bit is a reading and a row of zeros with no control is not). GPUCC is read only when the AHB vote is 1, the vendor probe's own precondition (\"this clock is used for all GPUCC register access\"), and a whole word of 0xffffffff is treated as a bus that did not answer rather than a vote of zero. The GPUCC row decodes the two GDSCs with their downstream semantics: CX status from hw-ctrl 0x1008 bit 31 (msm-gdsc-660.dtsi gives that node hw-ctrl-addr, and gdsc-regulator.c polls the syscon instead of the GDSCR), GX status from its own 0x1094 bit 31, plus SW_COLLAPSE bits, gfx3d/cxo branch enables, the gfx3d RCG command word and the two syscons GX names. No register is written in any path. Decision criteria were fixed before the flash: eMMC controls 0 with GPU bits 0 voids the whole row; AHB=0 with controls=1 means the GPU clock was off and the GPUCC question stays unasked; CX hw bit 31=0 means CX was unpowered; CX on with GX off is the firmware leaving only the interface domain; both on means the firmware left the GPU fully powered and the next round goes straight to the gfx3d root and chipid. The row repeats every 120 s from 240 s so a boot that stops early still leaves one inside the 512-record ring's horizon.", "Round286 is this area's first write, and boot 74 says the write worked: the probe votes gcc_gpu_cfg_ahb, gcc_gpu_bimc_gfx and gcc_bimc_gfx on, opens the cx and gx GDSCs, sets gfx3d's enable bit and reads every one back. All three GCC votes read 1 beside gcc_sdcc1_ahb/apps=1 -- the same-page positive control, so this is not a silent bus -- with cx_on=1 (cxhw=80001fe0), cxo_en=1 and gfx3d_en=1, but gx_on=0, which is why chipid never ran. The sequence is right and the interface domain comes up; what does not complete is GX.", "Round286's follow-up is a retraction of its own reading. `rcg=80000000` was first written off as the gfx3d root having no clock source. That is wrong twice: mainline gpucc-sdm660.c:57 maps CMD_SRC_SEL=0 to XO, so 0 is a source rather than an absence, and the rate lives in the CONFIG register this round never printed -- nothing on this board has programmed a rate at all. notes/gpu-bringup.md §5 now carries the sourced parent map (XO, gpu_pll0, gpu_pll1, gcc_gpu_gpll0_clk, core_bi_pll_test_se) and the 160..750 MHz table that matches the device's own ro.vendor.gpu.available_frequencies.", "Round289 added no GPU byte and boot 76 settled a question this area owns: its three fires (t=1338, 1582, 1707) are identical field-for-field with boot 74's line -- cx=a0282000, gx=08282000, rcg=80000000, cx_on=1, gx_on=0, gfx3d_en=1, cxo_en=1. gx_on=0 is therefore a stable hardware state, not a race, not a timing artifact and not something another driver turned off behind the probe. Only two suspects stay falsifiable: the parent/votes are missing, or the power corner is missing.", "Round290 splits asked from running and pays the two votes the board's own bill still owed. Every GPU row this board ever printed named BIT(0), the enable request; mainline clk-branch.h:59 defines BIT(31) as CBCR_CLK_OFF and :31 gives BRANCH_HALT the polarity where 1 means halted, so `gfx3d_en=1` never said the clock runs. The new row prints en/halt for gfx3d 0x1098, cxo 0x1020, rbcpr 0x1054 and rbbmtimer 0x10d0, and enables the last two, which notes/gpu-bringup.md §5.2 lists in the vendor's six-clock msm_gpu bill and no round of ours ever touched. The three RCG command words stay raw because a round that sets no rate must not decode one. §5.4's chain is the reason rbcpr matters: rbcpr -> CPR4 cpr4-ctrl@05061000, whose own clocks list is GPUCC_RBCPR_CLK -> gfx_vreg_corner -> vdd_gfx -> gx. This round deliberately does not map CPR, LDO or mem-acc: their register offsets have no source on the card or in notes/sources/sdm660 yet, and a reading nobody can decode is not an instrument.", "Round290 also records the one place §5.4 overreached: it wrote the CPR/LDO/mem-acc reads into r290 itself, and §5.5 now marks what actually shipped (votes plus halt bits, nothing unmapped) so the document does not claim a reading the image cannot produce.",
 "Round290 reported and boot 77 answered: gfx3d and rbbmtimer are both en=1/halt=1 -- the vote reached the branch and the clock never started -- while cxo and the newly voted rbcpr are en=1/halt=0. The two halt=0 rows are the load-bearing part of the reading: cxo is a branch this round writes nothing to, so it is the natural positive control for what halt=0 looks like, and rbcpr went from halted to running under this round's own 0x1054 BIT(0) write, which proves the writes take effect on GPUCC rather than the registers being read as constants. The clock area is therefore not innocent in the way §5.5 hoped: gfx3d cannot leave HALT while its own GDSC domain is down, so programming the RCG rate is not the next step -- gx is. gx_collapse=0 with gx_on=0 means the collapse is already released and the supply is what never arrives, which is what §5.6's GFX LDO table (msm_gfx_ldo.c qcom,sdm660-gfx-ldo at :1504, DT gfx_ldo_vreg: ldo@0506e000 reg=<0x0506e000 0x34>) is now on disk to read.",
 "Round290 also states a correlation it refuses to decode: the two halted branches show rcg3d=80000000 and rcg_rbbm=80000000 while the running rbcpr shows rcg_rbcpr=00000000. No file on this card names BIT(31) of an RCG command register -- the tree's clk-rcg.h is 191 lines and does not carry those offsets -- so the pattern is recorded and left uninterpreted until a durable drivers/clk/qcom/clk-rcg.c is archived with its sha256. Likewise dom=00140001 and sw=00000000 keep printing raw.",
 "Boot 77 also produced the first card sighting of round283's cross-reset verdict: verdict ring slot 0 printed `clover r283: last reset unnamed magic=ed88000200a909f8 beat=403443458069358 beatcnt=1371352791997`. unnamed is not an absence of record -- it is the slot not holding our magic (clover_imem_note writes words 1..6 and only then kResetRecordMagic at CloverSdhci.cpp:8859; the reader at :8916 tests exactly that word). The three observed words are three to four orders of magnitude away from the heartbeat shape (a small beat count plus a CNTVCT near 0x8_2..., compare boot 76's own r148 row cnt1=81d3c90a6), so the bounded reading is that IMEM 0x660 did not survive the trip through panic -> BCB -> TWRP -> fastboot -> reflash -> boot 77. That is evidence about the medium, not about who reset the board, and the named branch still has never been seen on a card. boot 78 reading boot 77's own heartbeat is the differential.",
 "Boot 77 ended at 1248 s with no kind-20 record under its boot id at all (the panic ring's newest entry is seq 47, boot 76's deadline) and with the record after the last kernel line flagged BAD (newline missing) -- a reset that left no panic, the first on-card instance of the phenomenon rounds 283/284 were built to name. The r289 trace instrument is consistent with that: it speaks only inside panic_with_thread_kernel_state(), so a count of 0 here is proof of no panic, not proof the hook is missing.",
 "Round291 ships the LDO reading §5.6 sourced, and corrects §5.6's own plan on the way in. The plan said a third IODeviceMemory::withRange for 0x0506e000+0x34; checking the DT first shows that is unnecessary and worse: sdm660.dtsi:1074/:1076 (clock_gpu) and :1081/:1083 (clock_gfx) both declare reg = <0x5065000 0x10000>, and gfx_ldo_vreg (sdm660-regulator.dtsi:523/:525) at 0x0506e000 is 0x9000 inside that extent -- the same page r286 already maps. A second overlapping window would hand IOKit the same page twice and split one question into two unrelated readings, so the new constants are GPUCC-relative (kGpuccLdoVref 0x9018, kGpuccLdoCtrl 0x901c, kGpuccLdoStatus 0x9028) and CloverGpu.cpp adds no map at all; check-clover.py now asserts the driver's withRange count is exactly 3, so a later shrink of kGpuccSize that pushes the LDO out of the mapping fails the gate instead of reading as a tidy zero.",
 "Round291's row is clover r291: gpu t=%u ldo %s vref/val/uv ctrl/byp/pdn/cpr_byp sts/ready/settled cx_on gx_on, printed on both the post and the beat path with identical fields (r249's rule: a one-shot verdict row needs a periodic copy). uv is not invented here -- it is msm_gfx_ldo.c:1371 ((reg & GENMASK(6,0)) * 5000 + 375000), and ready/settled are the two bits that file uses as its own settling test at :307 (LDO_VREF_SETTLED_BIT BIT(4), LDO_READY_BIT BIT(2)); byp/pdn/cpr_byp are PWRSWITCH_CTRL BIT(6)/BIT(5)/BIT(30) (:47/:48/:41). cx_on and gx_on ride along as the positive control: three words of 0xffffffff beside a normal cx_on means that page did not answer and the row is void, not that the rail is at zero. LDO_STATUS1 0x24 is defined but never read by the vendor driver and ADC_CTL 0x34 is outside the DT window, so neither is touched, and no corner number is printed while the 6-fuse vs 7-pwrlevel mismatch stays unexplained.",
 "Boot 78 read Round291's row on the beat copy (the ldo post row sat outside the boot's 537.496418-718.840606 s kernel-ring window, so Round249's periodic copy carried the verdict a second time): vref=00000000 val=0 uv=375000 ctrl=80000038 byp=0 pdn=1 cpr_byp=0 sts=00000000 ready=0 settled=0 with cx_on=1 and gx_on=0 in the same beat. Two of section 5.8's pre-registered arms fired together: the reference was never programmed (uv is MIN_LDO_VOLTAGE, msm_gfx_ldo.c:65 with the decode at :1371) and the LDO is in power-down (LDO_PDN, :48), while the same-beat cx_on=1 plus gcc gpu_ahb=1 gpu_bimc=1 say the page answers, so the zeros are readings and not a dead window. The 'rail is innocent' branch is closed: vdd_gfx was neither enabled nor programmed this power-up. What is NOT read is who wrote pdn: left by firmware or never probed by CPR4 look identical here, and section 5.8 says that arm speaks only after CPR_BYPASS_IN_LDO_MODE's meaning is sourced. ctrl's BIT(3) is left unnamed because the archived :39-49 list does not define it.",
 "Round292 adds no GPU byte and reads no GPU register, and it corrects round291's stated blocker. That blocker said programming the rail needs a sha256-sourced transcription of the CPR4/LDO enable order and of the corner-to-voltage table. Re-checking the file already archived on disk (notes/sources/sdm660/msm_gfx_ldo.c, sha256 929bc99f86f1, the same one section 5.6 cites): the order is there with every bit named -- enable_ldo_mode() :325 and switch_mode_to_ldo() :498, BHS_UNDER_SW_CTL BIT(0), LDO_UNDER_SW_CTRL_BIT BIT(4), LDO_PREON_SW_OVR_BIT BIT(7), LDO_BYPASS_BIT BIT(6), PWR_SRC_SEL_BIT BIT(9), ACK_SW_OVR_BIT BIT(8), and the voltage raise in ldo_update_voltage() :297 (write val, pulse UPDATE_VREF_BIT BIT(31)). Clearing LDO_PDN is at :537, in switch_mode_to_ldo, not in enable_ldo_mode -- conflating the two was the error. And this SoC does not take the corner branch at all: probe sets ops_type = VOLTAGE for SDM660_SOC_ID (:1561-1562) and only MSM8953 is CORNER (:1550-1552), so the four ops_type == CORNER writes at :360/:387/:504/:645 must not be copied here and qcom,cpr-voltage-ceiling is not the entry point for programming this rail. What the vendor really gates on is get_operating_mode() :230-237 -- !ldo_mode_disable && ldo_fuse_enable && ldo_corner_en_map[corner] -- and ldo_fuse_enable comes from msm_gfx_ldo_efuse_init() :1030 reading the fuse window cpr4-ctrl reg-names fuse_base = 0x00784000 (sdm660-regulator.dtsi:536-537). So the fuse point stands, the reason attached to it did not. The next GPU round is still a read, and a wider one: dump_registers() :253-262 walks 11 words at i*4 across 0x00..0x28 (MAX_LDO_REGS :69) and names them in register_str[] (:240-251) -- including LDO_STATUS0 at 0x20, which this board has never printed, and LDO_STATUS1 0x24, defined but never tested. All eleven sit inside the DT-declared gfx_ldo_vreg reg = <0x0506e000 0x34> (:525), i.e. inside the GPUCC mapping already in use at offset 0x9000, so no fourth window and no change to the withRange count of 3. Read them beside the sdm660_ldo_config init values (:147-158: ATEST 0x80, CFG0 0x0100A600, CFG1 0xA0, CFG2 0xC3FE, LD_DATA 0, VREF_TEST_CFG 0x00401100, REF_X1 0x230, REF_X2 0x48) with the same-beat cx_on as the positive control: matching values mean firmware programmed this block and only the fuse-derived mode decision is missing; all zero or all 0xffffffff mean nobody programmed it or the page did not answer. No bit is written before that reading exists.",
  "Boot 81 puts round294's census on the card and gives its verdict in the same pass: on both beats (t=859 and t=980) only w1c=80000038 and w24=0000000d read non-zero, the other eleven words are 00000000. Put side by side with the vendor's own sdm660_ldo_config[] (ATEST 0x00000080, CFG0 0x0100A600, CFG1 0x000000A0, CFG2 0x0000C3FE, VREF_TEST_CFG 0x00401100, REF_X1 0x00000230, REF_X2 0x00000048) not one bit matches -- the rail is not half-programmed, nobody has programmed this LDO since reset, bootloader included. The positive control holds again: w1c is non-zero and cx_on=1 in the same beat, so the page answers and 0 is a reading, not an empty window. w24 is LDO_STATUS1_REG, defined at msm_gfx_ldo.c:54 and never read by that driver; no archived file names its bits, so the census prints it unnamed. The ldo words post row again sat outside the kernel-ring horizon (boot 81 covers 772.106442-997.261788 s) and the beat copy carried it, as in r291's two rounds.",
  "Round316 changes nothing for the GPU line: clover-gpu=1 and the r311 acc-sel-l1 window ship unchanged, and the MEM_ACC reading is still owed to boot 104.",
  "Round317 writes no register this line did not already write and maps nothing new: it moves every decision CloverGpu reads out of a word into a bus-free header (drivers/CloverGpu/GpuCore.h) and gives it a host model the build gate runs rather than merely reads -- 13 groups in drivers/CloverGpu/tests/clover_gpu_host.cpp compiled by scripts/test-clover-gpu.py. The finding is about our own record: the census over boot 81's archived thirteen words is comparable=8 agree=1 differ=7, so the sentence this area has carried since boot 81 -- 'not one bit matches the vendor's list' -- was a person comparing twelve hex words by eye and is false as written. One word agrees (LDO_LD_DATA @0x10, where the vendor expects zero and the board reads zero), and the claim that survives is narrower: every word sdm660_ldo_config[] would write a non-zero value to reads zero, seven of seven, which is why the row's shape is list-never-written with round294's same-beat control and list-unwritten-blind without it, and not 'the rail is at zero'. Four further facts came out of writing the decoders down: the reset corner decodes to 375,000 uV, below the 400,000 uV floor this unit's own node declares; the seven-bit VREF mask admits val=0x7f, 1,010,000 uV, above both the vendor's MAX_LDO_VOLTAGE and the DT's max; the vendor's settling test (msm_gfx_ldo.c:307) is an OR of READY and SETTLED, so a word with READY alone passes it while the pr_err names SETTLED -- and neither has been observed, boot 78's and boot 81's PWRSWITCH_STATUS both read 0; gdsc_init then release produces 0x00282000, which is exactly the wait field boot 81 read back in both GDSCRs, each keeping one unnamed bit (CX bit29, GX bit27). The layer re-types no number -- it includes GpuRegs.h and derives from its names -- because r313 measured what two indexings of one block do. The board gains one row (clover r317: gpu t= ldo verdict ... shape= named= comparable= agree= differ= nz_zero= no_expect= outside= dead= ctrl_pdn= ctrl_unnamed= vsettle= map_ok= control=) with its own tee class r317-gpu(32) and cap exemption; round294's thirteen-word row is byte-identical so boots 81 and 82 stay comparable. The one real change to the write path is that gdsc_on() gained one MMIO read per domain so the layer can transform the word that is actually there; the words stored are the same ones. Not flashed: the shape is pre-registered for boot 104 in dev-log Round317 (10).",
   "Round318 changes nothing for the GPU line: input is the third and last register-reading driver to hand its decisions to a bus-free layer, and the r311 acc-sel-l1 window is still this line's only open question, waiting for boot 104 to land its clover r311: row.",
   "Round342 changes nothing for the GPU line: no CloverGpu source, no GpuRegs.h address and no GpuCore.h decision moved, clover-gpu=1 is unchanged, and the only board.toml edit is the [payload] title. The r311 acc-sel-l1 window at 0x01fcf004 is still this line's only open question -- boot 104 answered map=1 answered=1 raw=00000000 l1=0 corner=2, which cannot separate 'corner 2 really reads zero' from 'the whole page reads zero', and no later round has added the instrument that would. The +972 B of __text this round is the storage ring's slot arithmetic, not a GPU mapping.",
  "Round344 touches this area only through the shared board.toml, and only its [payload].title: the round token moves to r344 and names the new display rows. Every value this area owns is byte-identical to r343; the entry is recorded here because the file is shared.",
  "Round343 moves no GPU fact: board.toml carries only this round's menu title (clover r343) and clover-gpu=1 stays where round342 left it. The GPU line remains read-only reconnaissance; the display column rename is a probe-wording change measured in the stock framebuffer driver, not a GPU register write or a new mapping.", "Round354 changes the board title and nothing in the GPU instrument: no GDSC, clock or register-window fact moved. The stack fix keeps the beat sampler alive; the GPU line's read-only posture is unchanged.", "Round358 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged. The GPU line stays read-only reconnaissance.", "Round359 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged; the GPU line stays read-only reconnaissance.", "Round360 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round361 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round362 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round364 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round365 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round366 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round367 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round368 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round369 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round370 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round371 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged.", "Round372 moves no GPU fact: only the shared board title changed and clover-gpu=1 is unchanged."]
