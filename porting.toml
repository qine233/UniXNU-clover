[[area]]
id = "packaging"
status = "implemented"
components = []
paths = ["board.toml", "scripts/build-clover-block.py", "scripts/patch-clover-amfi.py", "scripts/normalize-kernel-macho.py", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c", "scripts/verify-clover-payload.py", "patches/xnu-clover/**"]
inputs = ["Prelinked kernel, generated ADT, three-module trust cache, mockfs root image, platform seed and uefi-clover firmware."]
configuration = ["The payload volume is 56 MiB, FAT with 512-byte clusters; loader = firmware.", "patches/xnu-clover/*.patch are applied to the shared XNU tree before the kernel build; they are not applied by the payload step.", "panic_screen = true and entry_probe_reset_delay = 15 patch the payload copy of the kernel with the panic screen and the timed reset."]
procedure = ["Build kernel and payload with the seed, root image and trust cache named explicitly.", "Run scripts/check-clover.py and scripts/verify-clover-payload.py; the second reads probe strings back from the payload image.", "Flash only the cache partition and keep a recovery image available."]
findings = ["The payload builder rejects a trust cache that does not match the trust_cache_sha256 pin; the three-module bundle is the only accepted one.", "The build reads ~/UniXNU/patches/xnu/*.patch, not patches/xnu-clover directly, so a patch change must be copied into the shared tree before the kernel build.", "sheng's [payload.install] needs a Data seed and a persistent Data volume. clover has neither, so no install menu is declared.", "Round164 rebuilds the kernel with zzy-clover-dyld-cache-skip.patch (16 KiB-signed blobs skip cs_native4k_prepare's whole-file read and cs_validate_hash accepts the faulted page) and patches both AMFI exec deny branches on the resulting copy (file 0x1a830e4 cbz to b; file 0x1a8316c tbz to nop). The menu title now names r164; the verifier asserts the three skip instruction groups and both allow-path words, and check-clover.py asserts the patch, patcher and verifier sources.", "Round165 rebuilds only what the driver change touches: the same AMFI copy procedure, a new prelink kernel 8a2d2bbf, AMFI copy 54875b4b, payload 31f2572d with in-volume kernel 12d0d834, unixnu.toml aa31b36a, ADT 99afed39, scratch-data.img 614b8356 and trustcache 7c369ce0. The verifier gains check_read_integrity and asserts the two new CloverSdhci strings; the entry probe stays at 6845 bytes in 37 runs.", "Round166 rebuilds the kernel with zzy-clover-exec-sig-bytes.patch on top of the r164 skip patch: prelink kernel e8b6570c, AMFI copy 986d6ab2 (same 0x1a830e4 and 0x1a8316c sites), payload 9092782b with in-volume kernel b897038d, unixnu.toml dac1ddfc, ADT 7645659b, scratch-data.img 614b8356 and trustcache 7c369ce0; the entry probe is 6844 bytes in 37 runs and verify-clover-payload.py reports 21 checks OK, including AMFI exec hook allows, eMMC read integrity and exec signature dump. The trust cache flag must name build/clover-trust/trustcache.bundle, because build/clover-root/trustcache.bundle is the 56-byte single-module bundle the board pin rejects.", "Round167 rebuilds only the driver and the payload: prelink kernel 248e7c58, AMFI copy f15625be (same 0x1a830e4 and 0x1a8316c sites), payload 2017f236 with in-volume kernel b87480e5, unixnu.toml 4cdbd9c7, ADT 5b328b26, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6845 bytes in 37 runs; verify-clover-payload.py gains an eMMC read/write integrity check covering the readcheck row, both trust outcomes, the write-cache row and the write-not-ready row, and reports every check OK.", "Round168 rebuilds only the driver and the payload: prelink kernel 1be9cc03, AMFI copy 86f99fc0 (same 0x1a830e4 and 0x1a8316c sites), payload 5870d848 (58,720,256 bytes) with in-volume kernel cb0a20cf, unixnu.toml 6f1b4889, ADT 056815d2, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6845 bytes in 37 runs; verify-clover-payload.py asserts the new guard-wait, settle, read-give-up and write-give-up strings on top of the r167 set, and reports every check OK.", "Round169 rebuilds only the driver and the payload from the same kernel tree with zzy-clover-dyld-cache-skip.patch reversed: prelink kernel c5e70a3b, AMFI copy f5f1db9e (same 0x1a830e4 and 0x1a8316c sites), payload db15478e (58,720,256 bytes) with in-volume kernel 52ef7cf4, unixnu.toml 76ca3839, ADT 34b08b2b, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6845 bytes in 37 runs; verify-clover-payload.py asserts the card-busy, staged-read and 30 s settle strings on top of the r168 set, and reports every check OK.", "Round170 rebuilds the kernel from the same tree with zzy-clover-dyld-cache-skip.patch reversed: prelink kernel 98f2e5e1, AMFI copy a100d479 (same 0x1a830e4 and 0x1a8316c sites), payload 00510286 (58,720,256 bytes) with in-volume kernel 27e95ca6, unixnu.toml 6df3a99e, ADT d8de9a71, scratch-data.img 614b8356 and trustcache 7c369ce0. The entry probe is 6844 bytes in 37 runs; verify-clover-payload.py gains kernel.macho: exec/exit probe linked, requires the throttled r170 open and check_np forms and rejects the two uncapped r153 strings, and reports every check OK.", "Round171 rebuilds only the drivers and the payload from the same kernel tree with zzy-clover-dyld-cache-skip.patch reversed: prelink kernel 076f1542, AMFI copy 616f1b38 (the new prelink moves the two exec-hook sites to file 0x1a870e4 and 0x1a8716c and the patcher finds them by symbol), payload 093fafdd (58,720,256 bytes) with in-volume kernel 6cfebbef, unixnu.toml 1333bed1, ADT 2dd487f5, scratch-data.img 614b8356 and trustcache 7c369ce0, the last two unchanged. The entry probe is 6844 bytes in 37 runs; verify-clover-payload.py's eMMC read/write integrity check now requires the batch-stop-refused, write-cache, flush-failed and first-commit strings and reports every check OK, and scripts/verify-userdata-window.py re-passes the round159 archive (9,416,212,480 bytes, three windows, Data 33,554,432 bytes at 0x22f400000, seed sha256 ef00c083) because this round does not touch userdata.", "Round172 extends the payload gate with DMA_INTEGRITY: verify-clover-payload.py now refuses an image whose kernel lacks the five strings that only the ADMA2 path compiles to -- dma up data=, dmacheck lba=, ADMA2 reads trusted for this boot, reads stay on the PIO path for this boot, first dma read lba= -- so a payload built from an older CloverSdhci cannot ship under a round172 title. check-clover.py additionally refuses a NOP descriptor, an unconditional gDmaTrusted = true, and SDHCI_TRNS_DMA on any write transfer mode.", "Round173 extends the payload gate with WRITE_DMA_INTEGRITY: verify-clover-payload.py now also refuses an image whose kernel lacks wrcheck lba=, ADMA2 writes trusted for this boot, writes stay on the PIO path for this boot and first dma write lba=. check-clover.py pins the gate's shape instead of the old prohibition -- the kWriteCheckLba constant, the window refusal against kLogfsLastLba, controlHeld && dmaWrite && dmaRead && diffDma == 0, and the fact that clover_emmc_panic_append still contains writePioBlock calls -- so a payload whose write gate silently degraded to 'trust DMA' cannot ship under a round173 title.", "Round174 gives the payload gate its own assertion: verify-clover-payload.py refuses an image whose linked kernel lacks the verdict-ring arming string, beside the existing read/write-integrity and exec-signature checks, so a payload built without the round174 driver cannot ship under a round174 title.", "Round175 renames the payload gate row to kernel.macho: verdict ring and log tee linked and requires both strings in the linked kernel -- the round174 verdict ring armed lba= and the round175 tee armed bufc= -- so a payload that names this round cannot ship without the tee in it.", "Round176 renames that row to kernel.macho: verdict rings and log tee linked and requires three armed strings in the linked kernel -- verdict ring armed lba=, kernel ring armed lba= and tee armed bufc= -- so a payload that claims round176 cannot ship with one ring or with a tee that never armed. The entry probe is unchanged at 6844 bytes in 37 runs and the payload is again 58,720,256 bytes: this round adds no XNU patch, only the drivers own record layout.", "Round177 puts scripts/normalize-kernel-macho.py into this areas paths and into the recipe between the AMFI patcher and the payload build. Two builds of one tree were measured 3,861 bytes apart in a 52,043,776-byte kernel in exactly three kinds: the n_value of 962 object-path stabs (the .o mtime, and only 50 of them differ per rebuild because a rebuild re-makes the twelve board archives and the patch-rewritten XNU files), one LC_UUID, and the _PrelinkKCID base64 inside __PRELINK_INFO. The normalizer blanks every stamp and derives the UUID and the KCID from sha256 of the zeroed file, is idempotent and length-preserving, and passes --prove on two real prelink outputs and on the two delivered AMFI copies; the shipped round177 AMFI copy is f9966b72 and --check calls it normalised. verify-clover-payload.py gained its 24th check, kernel.macho: build-varying fields normalized, which rebuilds the field table from the in-volume kernel and requires 962/962 stamps blank beside one UUID and one KCID -- it stops at the field table because the payload build writes entry probes into executable text after normalisation. Artifacts: prelink a307b5b0, payload 5d86bbaa (58,720,256 bytes) with in-volume kernel 348049f1, unixnu.toml d53c37e3, ADT 4113f39c, scratch-data.img 614b8356 and trustcache 7c369ce0; the entry probe is still 6844 bytes in 37 runs.", "Round178 ships prelink b8e194b6, a normalized delivery kernel fb2946ae with the AMFI hits at file 0x1a880e4 and 0x1a8816c, payload 28324379 (58,720,256 bytes) with in-volume kernel 2a5cea30, unixnu.toml 96817875, ADT 732a9815, scratch-data.img 614b8356 and trustcache 7c369ce0; the entry probe is still 6844 bytes in 37 runs and normalization still leaves 3860 differing bytes outside executable text. verify-clover-payload.py gained a twenty-fifth check that the r178 hand-off format string is present in the kernel on the volume.", "Round180 ships prelink c3a5051d, a normalized delivery kernel fadb893d (52,154,368 bytes -- 110,592 larger than round177's 52,043,776 because the display archive and its probe are now resident) and payload b453884d, still 58,720,256 bytes. verify-clover-payload.py gained kernel.macho: legacy display archive linked, which requires every LEGACY_DISPLAY string in the kernel that is actually on the volume: nothing else in the payload proves the class was linked, so an image missing them would boot the round179 stack while the menu, the boot arguments and this verifier all claimed round180. Packaging also learned which of its hashes are evidence and which are noise: ar stamps every archive member with its mtime, so two consecutive runs of the display builder produced different archive_sha256 (b56ed261 then 4b949b0a) over four byte-identical members, while compiled_object_sha256 1b6c134e and late_object_sha256 a061787e did not move. The builder audits the kernel the previous round shipped because the archive step runs before the link, so round180 re-ran the audit and the builder against its own freshly linked image: same family text (225,140 bytes at 0xfffffff00576c000), all 193 bindings where the audit said, both objects byte-identical.", "Round181 repackages with three new hashes -- kernel 09fea490..., the delivered AMFI-patched and normalised kernel 2f13ca62..., payload 887043d3... -- and records two build-varying facts the fix-up order exists to catch: the AMFI patch now lands at file 0x1aa80e4 and 0x1aa816c (round177 was 0x1a880e4) because the link layout moved with the thirteenth archive, and the object-stamp count went from 962 to 966, so normalize-kernel-macho.py derives LC_UUID and _PrelinkKCID over a wider symbol table. The entry probe is 6857 bytes in 37 runs with 3877 outside executable text ignored. verify-clover-payload.py gained the touch instrument item (round stamp, 400 kHz divisor, declared geometry, both candidate names, the honest no-answer reading). The display archive was re-audited inside the tree after the link and reported kernel_sha256 = 09fea490... with compiled_object_sha256 = 1b6c134e... and late_object_sha256 = a061787e... byte-identical to the previous round and 193 bindings unmoved: the object hashes, never archive_sha256, which ar dirties with mtimes, are the reproduction evidence.", "Round182 repackages with kernel 7305d191..., the normalized delivery kernel 37c3f260... and payload 0ee08570...; its AMFI sites stayed at file 0x1aa80e4 and 0x1aa816c, because that round's archive did not move the link layout, and the object-stamp count went 966 to 967.", "Round183 repackages with four hashes -- prelink kernel 1c48bac7 at 52,191,232 bytes (16,384 larger than round182 because a fifteenth archive is resident), the normalized delivery kernel acc94982, payload 839543a8 still at 58,720,256 bytes and boot.img 196b284f at 1,613,824 -- and the round is the second one in which the AMFI sites moved: the patcher now finds them at file 0x1aac0e4 and 0x1aac16c, +0x4000 from round181's 0x1aa80e4, while the two virtual addresses are unchanged at 0xfffffff004ab40e4 and 0xfffffff004ab416c, which is what the byte-signature search rather than a hardcoded offset is for. The object-stamp count went 967 to 968, so normalize-kernel-macho.py derives LC_UUID and _PrelinkKCID over a wider symbol table and --check still calls the delivered kernel normalised. verify-clover-payload.py gained the shared-heap item -- round stamp, heap header, global TOC walk, partition table, partition row check, doorbell word, SMP2P identity, image presence and the fork itself -- and reports 29 OK assertions beside its five in-volume shape lines. scripts/build-clover-block.py changed only in the conditional iPhoneOS SDK pin, and the display archive was re-audited inside the tree after the link with both object hashes byte-identical and 193 bindings unmoved.", "Round184 repackages the kernel alone: the root image, trust bundle, data seed, userdata and boot.img are the round183 artifacts unchanged, and the chain is kernel c523b080 -> normalized delivery -> AMFI-patched 166b827d -> payload 954ac76a, archived as round184-* with round184-SHA256SUMS. scripts/verify-clover-payload.py grows one linked-string assertion, panic ring drain linked, over the driver's own CloverSdhci r184: panic drain wrote=%u dropped=%u tee_passes=%u format string, so the drain line is proof the code linked and not just that it compiled; the menu-title and payload-contract checks move to clover r184. The display archive was re-audited inside this tree: kernel_sha256 is the round184 kernel, both object hashes are byte-identical to round183 and all 193 bindings did not move.", "Round185 rebuilds the payload around a new kernel (round185-kernel-amfi.macho 51a12944, 968 object stamps, the two AMFI sites still at 0x1aac0e4 and 0x1aac16c, so the driver's text grew less than one page) and the unchanged firmware volume; after the entry probe the in-volume kernel is d9634f42 with 6857 patched bytes in 37 runs, payload 6b73e99b. scripts/verify-clover-payload.py gains kernel.macho: logdump rings armed from GPT, requiring both the armed line and the refusal line; it correctly fails against the round184 payload. The recipe also lost a defect unrelated to this round's code: build-xnu-4k-baseline.sh replays patches in name order and skips a patch its --reverse --check proves applied, but zzy-clover-dyld-cache-skip.patch appends a field inside a block native-4k-signature-hash-cache.patch adds, which makes that earlier patch neither forward- nor reverse-appliable, so a second build of one tree aborts. Reversing it first, as the script already does for the three base patches with the same overlap, restores idempotence (three replays of one work tree each end with the same 72 modified files). Replaying the tree cleanly also showed that bsd/kern/kern_exec.c, bsd/kern/kern_exit.c, bsd/vfs/vfs_vnops.c and bsd/vm/vm_unix.c were missing all of zzy-clover-shared-region-why5.patch while the shipped image carried its strings, so those lines had reached the kernel through objects that were never recompiled; round185's kernel is the first built from a source state that matches the patch set, which is a precondition round177's byte-reproducibility claim depends on.", "Round186 delivers the same file from two independent kernel passes: the raw prelink hashes differ (55ec10fe and dfe149c3) and normalize-kernel-macho.py converges both to b4f898c9, which is also the evidence that the patch chain replayed cleanly on the same tree a second time. The AMFI sites moved with the 0x4000 text growth to file offsets 0x1aad0e4/0x1aad16c while their virtual addresses stayed 0xfffffff004ab40e4/0xfffffff004ab416c, 968 object stamps. payload.img is f7c130ea (in-volume kernel 426201d7, unixnu.toml c5272a2b, ADT 1ecd4345 at 13516 bytes, entry probe 6857 bytes in 37 runs), scratch-data.img 614b8356 and trustcache 7c369ce0 unchanged, boot.img 196b284f identical to round183/184/185. verify-clover-payload.py gained the row kernel.macho: spawn ENOENT probe linked.", "Round188 packages a kernel with three more readers: round188-kernel.macho 007e0122 (968 object stamps blank, 1 LC_UUID, 1 KCID), the AMFI copy bf50c592 at the usual file offsets 0x1aad0e4 and 0x1aad16c, and payload bf61bdcc (56 MiB, in-volume kernel c58d218b at 52195328 bytes, entry probe 6854 bytes in 37 runs, boot.img unchanged).", "Round192 packages a kernel whose driver no longer enables the eMMC write cache: round192-kernel.macho 42d531c1, AMFI-patched then normalized to 4d550364 (968 object stamps blank, 1 LC_UUID, 1 KCID), payload 08135ca4 with the in-volume kernel 4ceaf22a, unixnu.toml e53abf25, ADT 0803d093 and the same trustcache 7c369ce0 and data seed 614b8356, and boot.img still 196b284f. scripts/verify-clover-payload.py gained check_cache_ownership with three needles (the r192 skipped line, the r171 cache line, the r191 flush-go line), so a payload built without this round's driver is refused rather than booted.", "patches/xnu-clover/zzzzzz-clover-crash-why.patch is copied into out/clover/tree/patches/xnu before the kernel build; the build script leaves an already-applied patch in place, so the probe must exist in .cache/xnu-work or the link would ship without it.", "Round194 packages the same driver with the probe cap and the reordered panic screen: round194-kernel-amfi.macho 6bf97425, normalized to fc3c7cdd (968 object stamps blank, 1 LC_UUID, 1 KCID), payload 0db6ea3e with the in-volume kernel be24e919, ADT 2b0636b4, the same trustcache 7c369ce0 and data seed 614b8356, and boot.img still 196b284f. scripts/verify-clover-payload.py gained check_tee_probe_cap, so a payload whose tee has no cap is refused rather than booted.", "Round195 packages the same kernel half with the per-class tee budgets and the panic record preface: kernel 4557a47f, the two AMFI fixes still at file 0x1aad0e4/0x1aad16c, normalized e4dcd264 (968 object stamps blank), payload 72aff15c (56 MiB; volume kernel 58852946, unixnu.toml 60500560, ADT 8e7ee44a 13516 bytes, trustcache 7c369ce0, data seed 614b8356; entry probe 6986 bytes in 37 runs); round195-boot.img 196b284f is unchanged. verify-clover-payload.py renames its cap needle to the r195 string and reports 40 OK, 0 FAIL.", "Round200 packages kernel 3b4b48c1 (52,211,712 bytes, 968 object stamps blank, one LC_UUID and one KCID), the AMFI copy 94bff883 with its sites at file 0x1ab10e4/0x1ab116c, and payload 1ce3a186 (56 MiB) whose in-volume kernel is 1d92b032 with a 6985-byte entry probe in 37 runs; unixnu.toml 24f6c457, ADT 43a0e213 (13516 bytes), trustcache 7c369ce0 and data seed 614b8356 are unchanged. verify-clover-payload.py's user breakpoint row now requires both the r199 and the r200 prefixes, so a payload carrying only the first line is refused.", "Round212 packages kernel 7c3cf132 (52,215,808 bytes, 968 object stamps blank, one LC_UUID and one KCID), the AMFI copy e84002dc with its cuts still at file 0x1ab10e4/0x1ab116c, and payload 4e142c38 (56 MiB) whose in-volume kernel is 273c486e with a 6985-byte entry probe in 37 runs; unixnu.toml bfc7ed8b (1183 bytes), ADT 545cc0af (13556 bytes), trustcache 7c369ce0 and data seed 614b8356 are unchanged. verify-clover-payload.py adds an r212 boot counter row and keeps the panic-time log tail row (tail, refused, enter, exit, kept-r184), so a payload without the drain enter/exit lines is refused."]
completion = ["Kernel and payload succeed, the payload contains every declared input, and the boot image matches the firmware's load format."]
limits = ["Image output depends on the firmware and the platform seed; neither is stored in this repository.", "The payload is not a ramdisk."]
next_action = ["Attach artifact paths and exact revisions to the next image record, and keep the r212 boot counter and the drain enter/exit rows as required strings so verify-clover-payload.py refuses a payload that loses the attribution half."]

