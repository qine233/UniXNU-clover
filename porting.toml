[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["board.toml", "scripts/make-clover-adt.py", "scripts/build-clover-gop-legacy-display.py", "drivers/ArmCpu/**"]
inputs = ["DRAM at 0x80000000 with size 0x80000000 (2 GiB).", "ABL framebuffer at 0x9D400000 with size 0x02400000; reserved carve-outs for PIL, venus and the firmware FD.", "Payload owned-memory request 0x40000000 (1 GiB), the largest obviously free low-bank request."]
configuration = ["The payload declares owned_memory_size = 0x40000000 and dram_size = 0x80000000.", "The entry probe identity-maps the framebuffer into TTBR0 before the MMU is enabled, then seeds _vinfo for the panic screen."]
procedure = ["Compare facts/ memory dumps, the firmware map, the ADT and the splash reservation before changing a range.", "Run the region checks in scripts/check-clover.py, which reject overlapping windows."]
findings = ["The DarwinBoot window cannot start below 0x9D400000 and the framebuffer lies outside it, so the bootstrap map never reaches the framebuffer. The mapper in the probe builds the missing TTBR0 entries explicitly.", "The kernel switches TTBR0 to its own tables in arm_vm_init; after that point the probe can no longer paint, which is why later frames are timed resets.", "There is no SMMU driver; none of this board's enabled DMA engines is programmed by XNU.", "Round164 leaves every memory window, boot argument and owned range unchanged; the only kernel-side change is a signature-hash policy in ubc_subr.c.", "Round165 again leaves every window, boot argument and owned range unchanged; its kernel-side change is confined to the eMMC read path.", "Round167 also leaves every window, boot argument and owned range unchanged; the driver adds write confirmation, level-gated writes, a CACHE_CTRL clear and the three-sample read trust rule only.", "Round168 leaves every window, boot argument and owned range unchanged; only the block driver's wait bounds and retry ladder change.", "Round169 leaves every window, boot argument and owned range unchanged; only the block driver's read-failure stop, pre-read card-idle wait and wider write waits change.", "Round170 leaves every window, boot argument and owned range unchanged; only kernel print sites change.", "Round171 leaves every window, boot argument and owned range unchanged; only the block driver's completion criterion, cache policy, lock and batch size change.", "Round172's DMA runs through a bounce this driver owns: IOBufferMemoryDescriptor::inTaskWithOptions(kernel_task, kIODirectionInOut | kIOMemoryPhysicallyContiguous | kIOMemoryMapperNone, 64 KiB + one 4 KiB table, 4096), retained for the whole boot and refused outright if getPhysicalSegment reports a run that is not one contiguous segment, not page-aligned, or (on a 32-bit DMA host) past 4 GiB. That is the same four checks sheng's NativeUfs applies to its own bus buffer, and it is what keeps a caller's APFS or dyld buffer from ever having to be walkable by this bus.", "Round173 reuses the one bounce the read path already owns: the caller's words are copied into gAdma.dataVirt before the descriptor table is built and cacheCleanInvalidate runs on the data as well as the table, because on the write side the CPU cache holds bytes the card must see. No caller buffer is ever walked by the bus, and the same four physical-address checks from sheng's NativeUfs guard it.", "Round174 adds no DMA buffer: the verdicts are assembled in a static RAM ring and handed to the same unguarded single-block PIO writer, so no caller buffer is walked by the bus and the round173 cache contract for DMA writes is untouched.", "Round175 allocates nothing: the scan cursor, the single line buffer and the counters are static, and the kernel buffer is read where the kernel left it. Every pass re-reads msg_magic, msg_size, msg_bufx and msg_bufc instead of caching them, because bsd/kern/subr_log.c can relocate msg_bufc at runtime; a changed base prints tee buffer moved and resets the cursor rather than trusting a stale offset.", "Round176 grows only static storage: the staging ring becomes two rings of 128 slots x 320 bytes of text with their length, cursor, sequence, pending, dropped and busy arrays, still allocated at link time and still no IOBufferMemoryDescriptor -- the split costs RAM, not a DMA buffer. The kernel message buffer is read where the kernel left it, its four fields re-read every pass, and nothing in this round walks a caller buffer through the bus.", "Round177 leaves every window, boot argument and owned range unchanged. Its new script rewrites bytes in the kernel file on the host -- 962 symbol n_value stamps, one 16-byte LC_UUID and one 24-character KCID string -- allocates nothing at boot, changes no executable segment and does not change the file length, so no memory map moves.", "Round178 leaves every window, boot argument and owned range unchanged. It adds three driver globals and two static functions, allocates nothing at boot and walks no caller buffer differently; the request deadlines keep their round169 arithmetic and only the interval they measure changed, because guarded time now accumulates across hand-offs instead of restarting per request.", "Round180 moves no window and adds no mapping: the framebuffer, logfs, userdata and scratch ranges are byte-identical to round178, and the 193 absolute bindings the display builder pins from the round179 audit all landed on the address the audit said, so nothing was linked against a slot that had moved. What changes is what is resident at boot. The shipped kernel now links a display archive whose probe constructs one IOMobileFramebufferLegacy at the instance size this board measured itself -- 0x18a0, enforced by static_assert(sizeof(IOMobileFramebufferLegacy)==0x18a0) rather than by a number copied from another device's VM -- and that object plus its vtable read is ordinary kernel heap. The probe bounds itself at kCloverLogBudget=96 lines so a refusal loop cannot fill the shared kernel log ring the card is read from.", "Round181 maps six more device windows, all inside ranges the ADT already declares and none of them new to the boot page table: the QUP v2 block at 0xc17700 (the DT says 0x600; the driver maps a whole 4 KiB page because IODeviceMemory::map() works at page granularity -- round87 proved that shape answers on this board), three page-sized GCC windows at 0x117000, 0x11d000 and 0x152000 that hold registers 0x3b000 apart inside clock-controller@100000+0x94000, and two TLMM pin-pair windows for gpio10/11 (SDA/SCL) and gpio66/67 (reset/interrupt). The driver prints the declared geometry next to its own so a reading is compared with the declaration; the kernel grows by one object, the 966 build stamps the shipped image carries include it.", "Round183 maps five more windows, all inside ranges the ADT already declares and none of them new to the boot page table: the whole shared heap 0x86000000 + 0x200000 as one span (the partition table is at heap size - 0x1000, so a partial map would not reach it), one page for the APCS block at 0x17911000 whose doorbell word sits at +0x8, and 16-page windows at the head of the three regions the heap names -- adsp_fw 0x92a00000 + 0x1f00000, wlan_msa 0x85700000 + 0x100000 and wlan_guard 0x85600000 + 0x100000. Every window is mapped with kIOMapInhibitCache because the heap is written by another processor and the CPU cache would show this boot a stale page, and every image scan is 16 pages deep rather than the declared size because the question is whether firmware was placed there, not what it says. Nothing is mapped at the WiFi subsystem block 0x18800000 + 0x800000 -- deliberately named and deliberately not mapped -- and the driver writes no word to any of these ranges. One declared geometry is kept as a disagreement instead of averaged: the SoC tree says adsp_fw is 0x1e00000 and this board's clover-overlay.dtsi:8 says 0x1f00000, and the board file wins because it describes the fitted device. The shipped kernel grows by 16,384 bytes, and the display archive's re-audit in the same tree shows the family text and all 193 of its bindings did not move with it.", "Round184 maps nothing new: no window, reservation, ADT node or page-table entry moves, and the entry probe is still 6857 bytes over 37 segments. Because the three instrument arguments are commented out, this boot maps fewer device windows than round183's -- QUP v2 I2C-3, the five SPMI windows and the SMEM/APCS/carve-out scans are all skipped -- and the only memory the round writes into is the logfs window CloverSdhci already owns, which is where panicDrainRings puts the two rings' records.", "Round185 touches no memory map and adds no reservation: the log window is a block window, published through the same CloverSdhci path as before, and its new base 13320216 is an eMMC LBA rather than a physical address, so it is deliberately not one of the 30 device-tree-bound constants scripts/check-clover.py cross-checks against the firmware tree.", "Round186 maps nothing new and reserves nothing new: the probe walks path components on volumes that are already mounted when it runs, and its only kernel allocation is one struct nameidata per examined spawn (pid 1 only, at most 24 per site) which it frees before returning. The display archive was rebuilt against this round kernel and its object hashes are unchanged, so the boot-time instance count stays where round180 put it.", "Round188 maps nothing new and reserves nothing new: the three readings copy at most 64 bytes of user text and 128 bytes of a path into stack buffers inside the syscall entry, and no window, reservation, ADT node or page-table entry moves.", "Round192 maps nothing new and reserves nothing new: removing the bring-up's switchExtCsd call only drops a stack word, the cache readings keep using gExtCsd, and the log windows are untouched. The driver still copies at most the same fixed ring records per pass, so the memory cost of a frame is unchanged.", "Round193 reads, but does not map, IMEM: the critical-exit probe prints crash-behavior bits and a continuous-time deadline, so no new MMIO window is involved.", "Round194 maps nothing new either: moving fb= ahead of the panic sink only reorders two lines inside the same 480-byte record, and the tee probe cap is a counter, not a buffer.", "Round195 maps nothing new: the log-only path writes into the same 480-byte stack buffer the screen already formats into, before the screen's own fb= row is drawn, and teeProbeClass reads five static entries in the driver's data segment.", "Round200 reads the kernel map from the breakpoint path. vm_map_lookup_entry runs under the map read lock, and the copyin of the message pointers happens after the unlock, because a fault there would take the write lock and deadlock. foff is VME_OFFSET(entry) plus (pc - start), which the frame proved slide-independent across four watchdogd processes at different bases; the probe also reads eight instructions at pc-16 and four words at the segment start, which is why head= is only meaningful on a standalone executable."]
completion = ["The ADT memory map, the firmware reservations and the owned range do not overlap, and the boot reaches the root mount with the framebuffer mapped."]
limits = ["The record covers the handoff window and the splash region; DRAM sizing beyond those comes from the firmware map.", "No DMA engine is validated through an SMMU."]
next_action = ["Attach the firmware memory map and each DMA consumer when a driver starts using one."]

