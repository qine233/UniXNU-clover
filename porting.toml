[[area]]
id = "power"
status = "implemented"
components = []
paths = ["drivers/CloverPMGR/**", "drivers/CloverPower/**", "scripts/build-clover-pmgr.py", "scripts/test-clover-power.py", "configs/clover_defconfig"]
inputs = ["PM660/PM660L PMIC, SDM660 clock and power domains, PSCI SMC."]
configuration = ["CONFIG_XNU_SHENG_PMGR=y reuses sheng's PMGR hook; clover-pmgr=2 selects the board integration.", "The board drivers are chained as C entry points in sheng_pmgr_run(), in the order the checker asserts by position: clover_unattended_begin(), clover_emmc_run(), clover_input_run(), clover_power_run(), clover_dsp_run().", "drivers/CloverPMGR publishes ApplePMGRNub so AMFI's PMGR lookup succeeds.", "clover-power=3 selects drivers/CloverPower's read-only PMIC instrument (1 arbiter and APID map, 2 add the two PMIC revid identities, 3 add the two LDO enable and voltage readings). No rail is written, enabled, or reconfigured by any mode."]
procedure = ["Document each clock, regulator and firmware-owned state before enabling a transition.", "Read the AMFI start lines and the PMGR observation cell from a frame.", "Before any rail is switched, take the arbiter's own answer for who may write that APID (cnfg + 0x700 + 4*apid) from a read-only boot."]
findings = ["AMFI waits for a service matching ApplePMGRNub and panics when none exists. The board driver publishes that service without owning a real PMGR.", "No battery, charger, CPU-frequency or suspend policy is implemented.", "Round180 changes no power control. Its configs/clover_defconfig edit is CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y, which selects a display archive and touches no clock, regulator or PMGR state, and the three new boot arguments are display phases rather than power knobs. The clover-pmgr=2 contract, the ApplePMGRNub publication and the absence of any battery or charging data are exactly as round178 left them.", "Round181 adds one tail call to sheng_pmgr_run() -- clover_input_run() after clover_emmc_run(), because the touch instrument's only way off the device is the log ring CloverSdhci sets up -- and one archive to CONFIG_XNU_EXTRA_LD_ARCHIVES; a device repository has no IOKit personality slot, so board drivers are chained as C entry points. It touches no power hardware: both DT touch nodes declare supplies and this driver issues no SPMI read or write and no PMIC register at all, which is exactly why a no-answer reading is expected rather than conclusive, and why the GCC/BLSP clock enables it does perform are votes for a bus clock rather than a rail.", "Round182 is the first transaction against a PMIC on this board, and it is a read. drivers/CloverPower maps the SPMI PMIC Arbiter v5 windows the device tree itself declares at qcom,spmi@800f000 -- core 0x0800f000+0x1000, chnls 0x08400000+0x1000000, obsrvr 0x09400000+0x1000000, intr 0x0a400000+0x220000, cnfg 0x0800a000+0x3000 -- refuses any version outside the v5 band (below 0x50000000 the APID map would live at 0x800, at or above 0x60000000 the layout is sheng's v7 0x2000/0x20 pair), walks the 448-entry map at core+0x900 with the vendor's own tie-break (first mapping wins, replaced only by one this EE owns) and its separate IRQ rule (the last APID carrying bit 24), and reads cnfg+0x700+4*apid to print which execution environment may write each APID before anyone attempts a write. Mode 2 asks the two PMICs' revid blocks and refuses to name a chip whose +0x04 byte is not 0x51; mode 3 reads the two rails the touch nodes declare as supplies -- ldo-a11 (PPID 0x04a, sid 0) and ldo-b3 (PPID 0x242, sid 2) -- at 0x01..0x05, 0x40/0x41, 0x45 and 0x46, decoding microvolts only for the L660 subtypes whose FTSMPS426 layout mainline proves. Read-only is structural, not a promise: every transaction is an EXT_READL on an observer channel (vendor rule: from v2 on rd_base is obsrvr, wr_base is chnls), the chnls page is mapped per rail APID only to read its own ACC_ENABLE/IRQ_STATUS, and the single write in the driver is the read command into that command register, which is what a read is. check-clover.py therefore refuses the strings windowWrite and kPmicArbWriteOp in the source, and scripts/test-clover-power.py -- a pthread model of the arbiter that re-decodes every command and asserts its opcode is a read -- runs as a build gate, including a case with no server thread at all so the poll bound has to be what ends it.", "Round182 also repairs the input area's base address: drivers/CloverInput/InputRegs.h shipped kQupPhys as 0x00c17700, a six-digit literal that is a hundredth of the real QUP and lands where no QUP exists. It is now 0x0c177000, decoded from this board's own facts dump (i2c@c177000/reg 0070170c 00060000, little-endian four-byte groups), and the class of typo is closed off rather than re-reviewed: check-clover.py's check_device_tree_constants() now binds each driver header's physical constants to the device tree (26 addresses against 230 nodes), including all ten spmi cells and an observer-block window contract that refuses a mapping past the DT's own 0x1000000.", "Round183 adds the third tail call to sheng_pmgr_run() -- clover_power_run() then clover_dsp_run(), the DSP instrument last because the heap it reads only means something after the block driver has armed the rings that carry its report -- plus one archive in configs/clover_defconfig's CONFIG_XNU_EXTRA_LD_ARCHIVES and one line in scripts/build-clover-pmgr.py: the conditional iPhoneOS SDK pin, because a full XNU pass rewrites IOPlatformExpert.cpo.json without --isysroot and the builder's own -Wall -Wextra -Werror turns that into -Wincompatible-sysroot. No power hardware is touched and no SPMI transaction is issued by drivers/CloverDsp: the ADSP's vdd_cx rail (pm660l L9, the two device-tree cells 0x180 and 0x186a0) is named here only because it is what the schedule's fifth item turns into a power question if the heap says the DSP was never loaded. The arbiter reading, the APID map, the ownership answer and both revid identities are exactly as round182 left them, and the enable path is still closed.", "Round184 stops scheduling CloverPower for this boot: clover-power=3 is commented while the archive, its defconfig line and its position after eMMC stay exactly where round182 put them. The ownership reading the area was waiting on did not arrive, because the hardware reading was a refusal -- the core version word fell outside the v5 band, no APID was claimed, and neither ldo-a11 nor ldo-b3 was read. Reopening this area means answering what that version word is, and that answer now needs the card rather than a photograph."]
completion = ["AMFI reaches its start path and the board's declared power controls respond."]
limits = ["The PMGR service is a compatibility publication, not a full PMGR implementation.", "No battery or charging data is published."]
next_action = ["Cold-flash round182 and read the r182 lines off the card's kernel ring: the declared five windows, the version word against the v5 band, the map census (mapped=/listed=/other_sid=/ee0=), the per-rail ownership line, the two revid identities and the two enable bytes.", "The ownership number is the gate for the schedule's next power step: if ldo-a11 and ldo-b3 both report write-owner EE 0, the following round may ask for an enable write; if either names another EE, XNU cannot switch that rail and the port has to route the request to RPM instead of writing.", "Both rails reading state=off while the touch bus NACKed is the answer round181 asked for -- software, not silicon -- and it moves the next question to the enable path. state=on with the same NACK sends the next round back to the bus and reset timing instead.", "Add a battery/charger source only after the boot path is resolved."]

