# Extra sources for the clover device repository. These are read-only references, kind = refer:
# nothing here is copied into the build and nothing here is a UniXNU module. They are the two
# device trees every hardware constant in board.toml and scripts/make-clover-adt.py comes from,
# so `unixnu fetch` keeps them pinned and reproducible instead of relying on a saved copy.

[[source]]
name = "clover-mainline-dts"
kind = "refer"
git = "https://github.com/sdm660-mainline/linux"
ref = "qcom-sdm660-7.2.y"
commit = "dd1ed52c8ceef4f16715118ed0252fe75adbe71d"
path = "arch/arm64/boot/dts/qcom"
# sdm660-xiaomi-clover.dts           model "Xiaomi Mi Pad 4 LTE", compatible xiaomi,clover-lte
# sdm660-xiaomi-clover-common.dtsi   framebuffer, reserved-memory, eMMC, USB, audio
# sdm660-xiaomi-clover-regular-common.dtsi  boe,tv080wum-nx2 panel, edt-ft5406 touch, pm660l WLED
# sdm660.dtsi / sdm630.dtsi          Kryo 260 cores, qcom,adreno-512.0, qcom,sdm660-mdp5

[[source]]
name = "clover-downstream-dts"
