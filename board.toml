# Board description of the Xiaomi Mi Pad 4 8" LTE (clover, SDM660).
# Hardware constants come from two device trees that agree with each other (mainline
# sdm660-xiaomi-clover and Xiaomi's CAF clover kernel) and from facts/<serial>-<stamp>/,
# produced by scripts/dump-clover-facts.sh.

[board]
name = "clover"
soc = "SDM660"
description = "Xiaomi Mi Pad 4 8\" LTE (2018)"
kit = "clover"

# The unchanged iPad7,1 image, the class every 4 KiB arm64 board in the project uses.
# Kryo 260 is ARMv8.0 without pointer authentication, so arm64e images cannot run.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The Data window is mmcblk0p64 as the unit reports it (15795488 + 106347199 sectors of a
# 122142720-sector disk), so last_lba leaves the backup GPT alone. A different ROM can
# lay the GPT out differently, which is why the window comes from a dump.
[userdata]
first_lba = 0xf10520
last_lba = 0x747bfde
lba_bytes = 512
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "clover_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-clover-display-stub.py",
  "build-clover-pmgr.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

[firmware]
config = "clover"
dsc = "Platforms/Xiaomi/cloverPkg/clover.dsc"
fd = "Build/cloverPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-clover.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "clover"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "clover-research"
# Turns the UniXNU, UniXNUDxe and DarwinBoot modules on in clover.dsc and DXE.inc.
UNIXNU_BUILD = "1"

# Load offsets are this unit's own: both `boot` and `recovery` carry header version 0,
# page 4096, and 0x8000 / 0x1000000 / 0x100 in the three slots. They are base-relative,
# so base stays 0 and the ABL adds the 0x80000000 DRAM base itself.
[bootimg.image]
base = 0
kernel_offset = 0x00008000
ramdisk_offset = 0x01000000
tags_offset = 0x00000100
pagesize = 4096
header_version = 0

# No [[bootimg.dtb_node]]: the unit's own tree, which is what the boot image appends,
# already carries /reserved-memory/splash_region@9d400000 (label cont_splash_mem,
# reg 0x9d400000 + 0x23ff000). patch_dtb creates nodes with `fdtput -c`, and libfdt
# resolves the un-suffixed path to that node, so the create fails with FDT_ERR_EXISTS.
# uefi-clover's checker pins the address against both this tree and MemoryMapLib.

# The payload volume is a FAT volume with the UniXNU config, the kernel, its device
# tree and the optional trust cache. It does not travel in the boot image: this
# firmware has no ramdisk filesystem driver, so UniXNU only sees it on an eMMC
# partition. `cache` (mmcblk0p49, 256 MiB) is the expendable one.
# 56 MiB keeps the 51.8 MB kernel.macho and the ADT in one image; 512-byte clusters
# give 112,892 of them, above the 65,525 the firmware's Fat driver requires.
[payload]
volume = "CLOVERESP"
size_mib = 56
loader = "firmware"
title = "clover tty: exit between the two writes, now that the clock runs"
dram_size = "0x80000000"
# After the menu there is no serial console on this board, so the panel is the
# only output: the entry probe paints DarwinBoot's stage bar and the kernel's
# entry bars on ABL's framebuffer, and a panic stays on screen for a photo.
#
# v0.2.17-v0.2.27 ask where the frame buffer went, then walk the ADT contract
# and the kernel's CPU-feature assumptions, one run at a time. From v0.2.23 the
# signals are timed resets again: arm_vm_init installs the kernel's own tables,
# and after that no probe can paint.
#   * _start_first_cpu maps only the DarwinBoot window (V=P, memSize bytes), and
#     this unit's window cannot start below 0x9D400000: everything below is
#     reserved, the only free row is 148 MiB, and a 1 GiB window has to fit in
#     the high DRAM bank. So the frame buffer is never inside the map, and
#     growing memSize upward (v0.2.14) cannot reach it either.
#   * the window base in boot_args is anchored on __PRELINK_TEXT, whose vmaddr
#     is ~0x2D88000 below __TEXT, so _mh_execute_header sits at window base +
#     0x2D88000 and the bootstrap map starts there. The window base itself is
#     therefore unmapped (v0.2.16 failed self-check 4 reading it).
#   * the magenta cave calls a mapper in its own cave (entry + 0x600). It finds
#     the bootstrap L1 table from its own PC (adr), so it never touches unmapped
#     boot_args. It maps the frame buffer identity in TTBR0: it adds the missing
#     block entries to the window's L2 table when the frame buffer shares its
#     1 GiB slot (masking the L1 descriptor down to the table base), and
#     otherwise builds a table on the window's last page and points the frame
#     buffer's L1 slot at it.
#   * the mapper returns a code in x8. On failure the magenta cave paints a
#     WHITE band at index 5+code before the MMU goes on (1 no Video, 2 zero
#     geometry, 3 window L1 not a table, 4 window entry not a block, 5 no free
#     page, 6 target L2 entry in use), and the vc_info seed is skipped.
#   * a CYAN band at index 4 is painted right after the SCTLR write, so it proves
#     the MMU is on and the frame buffer is writable V=P.
#   * v0.2.18 adds an ORANGE band at index 12 at the first call inside arm_init
#     (_arm_set_kernel_tbi). It reads boot_args from x0 and uses no stack, no AT
#     and no vinfo, so it answers "did arm_init start" independently of the
#     vinfo painter.
#   * v0.2.19 fixes an inverted seed guard that dates back to v0.2.15: "cbz x8"
#     skipped the vinfo seed exactly when the mapper succeeded, so vinfo stayed
#     zero on every successful boot and the yellow band (index 3, painted when
#     the call to _cpu_data_init is reached, from the seeded vinfo) could never
#     appear. It also painted the panic screen a frame buffer after a *failed*
#     map. The guard is now "cbnz". After the displaced call returns, the same
#     cave paints a RED band at index 13 from the callee-saved boot_args copy in
#     x19, so "the first call returned" is a separate reading. Orange without
#     red means _arm_set_kernel_tbi never returned; orange and red without
#     yellow means the rebase block or the memmove before the _cpu_data_init
#     call is the stall.
#   * v0.2.20 is the first round after the bars did their job. v0.2.19 drew the
#     white panic screen (from the seeded vinfo) with "CPU property
#     'cluster-type' has bad size 6 @machine_routines.c:936", so the kernel
#     reached ml_parse_cpu_topology inside arm_init. The ADT generator had
#     emitted the strings "ECore"/"PCore", but ml_readprop() accepts only
#     1/2/4/8-byte integers and the topology compares the value with 'E'/'P'.
#     cpuN.cluster-type is now u32 'E' (cpu0-3) / 'P' (cpu4-7), and
#     check-clover.py asserts it. No kernel patch changed; only the ADT did.
#   * v0.2.21 then hit the next topology assertion: with the 4-byte property in
#     place, "phys_cluster_id <= MAX_CPU_CLUSTER_PHY_ID" failed at
#     machine_routines.c:1099. This kernel builds ARM64_BOARD_CONFIG_BCM2837,
#     which sets MAX_CPU_CLUSTERS 1 and leaves HAS_CLUSTER unset: the code
#     turns (cluster_type == 'P') into physical cluster 1 and asserts it is 0,
#     so a single-cluster kernel cannot accept the Kryo 260 E/P split at all.
#     The ADT now omits cluster-type, so every CPU keeps the CLUSTER_TYPE_SMP
#     default and the eight cores form one flat cluster, which is exactly the
#     state this Pi 3 kernel starts from without an ADT. A faithful two-cluster
#     description needs a kernel rebuilt with MAX_CPU_CLUSTERS >= 2.
#   * v0.2.22 then reached past the topology and faulted on the first PAN
#     instruction: "Undefined kernel instruction ... instr=d500419f" at
#     0x79aff58, i.e. `msr pan, #1` before arm_vm_init. Kryo 260 is ARMv8.0 and
#     has no PSTATE.PAN, but configs/clover_defconfig still carried sheng's
#     CONFIG_XNU_NATIVE_PAN=y. The defconfig now sets it to n, so the 15
#     `msr pan` words and the -march=armv8.1-a flags on copyio.c, pcb.c and
#     platform_tests.c are gone from the rebuilt kernel. Only the kernel build
#     configuration changed here; the patch script and the ADT did not.
#   * v0.2.23 answers the run after that: all bars fired (green, blue, magenta,
#     yellow, cyan, orange, red) and no white text appeared, so the kernel
#     entered arm_init, both early probes returned and it died at or after
#     `bl _arm_vm_init` - with no visible panic. arm_vm_init switches TTBR0 to
#     the kernel's own table ("From here on out, we're off the bootstrap
#     translation tables"), which drops the frame buffer identity map, so a
#     panic after that point would fault on its first pixel and freeze unseen.
#     The panic screen now queries the mapping first and reboots after 3 s when
#     it cannot draw, and the checkpoint below reboots 10 s after the
#     arm_vm_init call returns. Three outcomes: white text = panic before the
#     switch; ~3 s reset = panic after it; ~10 s reset = arm_vm_init returned;
#     no reset = a spin inside arm_vm_init.
#   * the paint probes and their targets are defaults inside this
#     repository's scripts/patch-xnu-entry-probe.py (--no-paint/--no-paint2 turn
#     them off), so the base repository's payload step needs no local change.
#   * v0.2.24 takes the v0.2.23 device reading: the bars appeared and the tablet
#     reset itself after about ten seconds, which is the checkpoint firing, so
#     arm_vm_init returned and the stall is after it. What follows in arm_init
#     is patch_low_glo (debug_boot_arg), PE_consistent_debug_inherit,
#     serial_init, kernel_startup_initialize_upto(KPRINTF), PE_create_console,
#     PE_init_printf, dump_kva_space, cpu_machine_idle_init and
#     PE_init_platform(TRUE, &BootCpuData). serial_init finds no "gpio" or "aux"
#     node in the ADT, so it registers nothing and returns 0. PE_create_console
#     is the first place the panel can come back: initialize_screen sees
#     kernel_map == VM_MAP_NULL and calls ml_io_map_unmappable() on
#     boot_args.Video, stores the new KVA in vinfo.v_baseaddr, and from then on
#     the panic screen can draw again. Its first act is check_for_panic_log,
#     which this BCM2837 build compiles with PLATFORM_PANIC_LOG_PADDR
#     0x3c0fc000 - a Pi address below clover's DRAM; reading it here very likely
#     raises an external abort, and at that moment the frame buffer is still
#     unmapped, so the reading would still be the 3 s panic reset. The
#     checkpoint is therefore after call #2 of PE_init_platform (the TRUE one
#     with &BootCpuData), which is past console creation: a reset 15 s after the
#     bars means the console was created and PE_init_platform returned, and any
#     kprintf text that appeared on the panel in those 15 s came from a working
#     video console. Four readings: bars plus text then ~15 s reset = console
#     alive; bars then ~15 s reset with no text = console returned but nothing
#     rendered; bars then white text and no reset = a panic after console, with
#     a drawable screen, so photograph it; bars and then nothing = the stall is
#     at or before console creation (or a panic that could not draw).
#   * v0.2.25 takes the v0.2.24 device reading: the bars appeared and then
#     nothing - no text, no reset - so the stall is not the checkpoint but
#     something between arm_vm_init and PE_init_platform. A static pass over
#     that span leaves one concrete suspect. kernel_startup_bootstrap() already
#     ran every entry up to STARTUP_SUB_LOCKS before arm_vm_init, so the later
#     kernel_startup_initialize_upto(KPRINTF) runs exactly one entry,
#     PE_init_kprintf, whose serial_init finds no node and returns 0 at once;
#     kprintf before the console is a panel no-op (vcputc_options returns while
#     gc_initialized is false), and the log and kprintf locks are initialized.
#     PE_create_console, however, starts with the inlined check_for_panic_log,
#     and this BCM2837 build compiles that with PLATFORM_PANIC_LOG_PADDR
#     0x3c0fc000 - a Pi address about a gigabyte below clover's DRAM. The first
#     ml_io_map_wcomb+load there raises an external abort, the video console
#     does not exist yet, and the panic screen cannot draw: bars, then nothing.
#     The patcher now rewrites the first four instructions of PE_create_console
#     (mov w19,#0x4000; mov w0,#0x3c0fc000; mov w1,#0x4000) into
#     mov w20,#1; b +0x94; nop; nop, jumping straight to the gPESF check before
#     initialize_screen. w20=1 is what the normal path sets after the map and
#     what "cinc w1, w20, eq" turns into the mode argument, and leaving
#     gPanicBase zero is the state debug_log_init already handles. The
#     checkpoint stays where v0.2.24 put it (call #2 of PE_init_platform, 15 s)
#     so the readings remain comparable: bars plus ~15 s reset = the console was
#     created and PE_init_platform returned; bars plus text then ~15 s reset =
#     the console renders; bars and then nothing = the stall is now inside
#     initialize_screen/ml_io_map_unmappable or the next startup call, not at
#     check_for_panic_log.
#   * v0.2.26 takes the v0.2.25 device reading: the bars appeared and the tablet
#     reset itself after about fifteen seconds, so the skipped panic-log probe
#     was the stall: PE_create_console returned with the video console
#     initialized, and so did the second PE_init_platform. There was still no
#     text, which is expected rather than a fault: initialize_screen sets
#     gc_initialized but leaves gc_enabled false (only vcattach, reached from
#     gc_enable, sets it), and vcputc_options drops every character until both
#     are true -- and arm_init calls PE_init_printf(FALSE), which does not
#     attach. kprintf therefore cannot mark this stretch yet; the checkpoint
#     moves on.
#     The remaining body of arm_init is now traced with the same vinfo painter
#     that has worked since v0.2.19. Each of the five calls that follow the
#     second PE_init_platform gets a cave that runs the call, paints one band
#     and jumps back: band 6 _ml_map_cpu_pio, 7 _cpu_timebase_init,
#     8 _kptimer_curcpu_up, 9 _PE_init_cpu, 10 _fiq_context_init. The checkpoint
#     is now the call to _machine_startup itself, and its cave paints band 11
#     (red) before the 15 s wait, so the trace bands can only be blamed on a
#     call when 11 did appear. Readings: bands 6-10 then 11 then ~15 s reset =
#     all five calls returned and the stall is inside machine_startup; the last
#     band before 11 missing = that call did not return; no 11 at all = the
#     reset cave was never reached or cannot paint either; white text = a panic
#     after the console, so photograph it.
#   * v0.2.27 takes the v0.2.26 device reading: the tablet showed green, blue
#     and white panic text reading "<1>:0 Assertion failed: <d>" (the two %s
#     arguments are the unreadable pointers 0x1 and 0xd), with TCR/SCTLR and
#     pages=free=0. A panic() therefore fired before the VM page bootstrap,
#     inside the traced arm_init tail, and the video console can draw again
#     (PE_create_console re-mapped the frame buffer). Two problems hid the
#     caller: the panic screen cleared rows [h/8, h), which erased every band
#     below the blue one, and the printed arguments do not match the only
#     reference to that format string. _Assert(file, line, expression) is its
#     sole user and the cold call sites pass constants ("kptimer.c" 575,
#     "machine_routines.c" 2404), not 0x1/0xd.
#     The screen now clears only [h/8, h/2) and the trace bands moved to
#     10-14 (white, orange, green, cyan, magenta) with the reset control at 15
#     (red), all below the cleared rows. It also prints RA (the LR on entry),
#     FP (the caller's frame pointer), LR (the saved return address at [FP+8],
#     which names the function that called _Assert), fmt, args and the raw
#     slots m2, m1, a0-a5. Every slot is read only after an AT S1E1R query, so
#     a bogus va_list prints dashes instead of faulting. The checkpoint is
#     unchanged: reset before _machine_startup, 15 s.
#   * v0.2.28 takes the v0.2.27 device reading: the screen showed green, blue
#     and the new diagnostic block. It read RA=0xfffffff00797a3b0 (the return
#     into _Assert), LR=0xfffffff0073f1dc4, fmt at a real assertion string, and
#     a0=1, a1=0, a2=0xd - but the only reference to that string is _Assert,
#     whose call sites pass file/line/expression constants, and none of its
#     callers pass 0xd as the expression. The call chain did not add up, so the
#     probe itself was disassembled instead of the kernel. The band-14 cave had
#     been placed at 0xfffffff0073ed784, which is 4 mod 8. ld.lld aligns .text
#     up, so _start landed at 0x3ed788 while the binary was written at
#     0x3ed784: every PC-relative branch in that cave was four bytes low. Its
#     bl went to _fiq_context_init - 4 (the bl _Assert inside
#     platform_syscall's cold block) with x0/x1/x2 still holding arm_init's
#     arguments to _fiq_context_init (TRUE, 0, 0xd), which is exactly what the
#     screen printed; its b went back to the call site instead of site+4. Bands
#     10-13 were aligned and returned correctly, so _ml_map_cpu_pio,
#     _cpu_timebase_init, _kptimer_curcpu_up and _PE_init_cpu did return; the
#     v0.2.27 photo says nothing about _fiq_context_init or _machine_startup.
#     assemble() now refuses a cave whose _start is not at the requested VA,
#     the placement loop aligns each run to 16 bytes and requires the aligned
#     start to still fit, and every emitted bl is decoded and checked against
#     the callee. All five caves now start on a 16-byte boundary.
#   * v0.2.29 takes the v0.2.28 device reading: bands 10-14 and the red 15 all
#     appeared and the tablet reset after fifteen seconds, so the five traced
#     calls returned and arm_init reached the _machine_startup call site. The
#     checkpoint no longer stops there: the stage 4 cave paints band 15, calls
#     _machine_startup and returns to arm_init only if it unexpectedly comes
#     back, and the reset moves to the end of a handoff ladder inside
#     kernel_bootstrap:
#       band 9  _machine_conf returned (first call of _machine_startup)
#       band 8  _kernel_bootstrap was entered (painted before its first printf)
#       band 7  that printf returned
#       band 6  vm_mem_bootstrap was reached - paint, wait 15 s, reset
#     Every rung paints only after the call before it returned, so the highest
#     missing band names the call that did not return. Bands 10-14 are kept so
#     the reading stays comparable with v0.2.28.
#   * v0.2.30 takes the v0.2.29 device reading: the whole ladder was on screen
#     (15, 9, 8, 7, 6, plus 10-14 and red 15) and the tablet reset after fifteen
#     seconds, so _machine_conf returned, _kernel_bootstrap was entered, its
#     first printf returned and vm_mem_bootstrap was called. The stall is inside
#     vm_mem_bootstrap. The arm_init trace that owned bands 10-14 is retired;
#     those bands now mark the calls vm_mem_bootstrap makes, and the reset moves
#     past kmem_init:
#       band 6  white    vm_mem_bootstrap was entered (painted before the call)
#       band 10 yellow   vm_page_bootstrap was reached
#       band 11 blue     zone_bootstrap was reached
#       band 12 white    vm_object_bootstrap was reached
#       band 13 orange   vm_map_init was reached
#       band 14 magenta  kmem_init was reached
#       band 5  red      kmem_init returned - wait 15 s, reset
#     Each rung paints before its call, so a missing band names the call that
#     did not return. A stall before band 5 leaves no reset: a tablet that stays
#     on past twenty seconds is itself the reading.
#   * v0.2.31 takes the v0.2.30 device reading: all sixteen bars were on screen,
#     including red 5, so every call of the first half of vm_mem_bootstrap
#     returned and the reset rung was reached. The stall is in the tail of
#     vm_mem_bootstrap. The five proven calls are retired; band 5 keeps its
#     meaning as the closing line of the first half, and bands 10-14 move to the
#     tail:
#       band 5  red      kmem_init returned
#       band 10 yellow   kernel_startup_initialize_upto(STARTUP_SUB_KMEM) reached
#       band 11 blue     vm_fault_init reached
#       band 12 white    kernel_startup_initialize_upto(STARTUP_SUB_ZALLOC) reached
#       band 13 orange   the final kprintf reached
#       band 14 magenta  that kprintf returned - wait 15 s, reset
#     The two startup calls paint on entry and are told apart by occurrence and
#     by the w0 loaded right before them (6 = KMEM, 7 = ZALLOC); the final
#     kprintf paints on entry and again on return. Band 13 without 14 means the
#     kprintf itself did not return; 14 plus the reset means the whole function
#     returned and the next stall is after vm_mem_bootstrap.
#   * v0.2.32 takes the v0.2.31 device reading: bands 13 and 14 both appeared and
#     the tablet reset after fifteen seconds, so the final kprintf returned and
#     the whole vm_mem_bootstrap returned. The stall is somewhere in the rest of
#     kernel_bootstrap. Instead of another ladder, this round attaches the video
#     console and lets the kernel speak for itself: the cave that replaces the
#     vm_mem_bootstrap call paints band 6 white, makes the call, repaints band
#     15 green when it returns, and calls _vcattach before continuing.
#     _vcattach reacquires the screen, allocates the console buffers with
#     Z_WAITOK (zalloc is up: STARTUP_SUB_ZALLOC has run) and replays the
#     statically allocated msgbuf, so from then on kprintf draws on the panel
#     and every later message is readable. There is no timed reset this round:
#     a tablet that sits is showing its last line. Three readings:
#       bars remain (including green 15)  vcattach was entered but never reached
#                                         the clear: it is stuck inside, or the
#                                         screen is not reacquirable
#       bars replaced by text or blank    the console attached and cleared; read
