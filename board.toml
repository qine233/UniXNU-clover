# sha256 890e94417bf79dfd. The kernel is byte-for-byte round121's, so nothing else in the volume moves.
trust_cache_sha256 = ["6062a6a45c2ff822563a3c6ef698fdef8222f13e4800a1cf02ec93818709a434"]
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "boot-progress=2",
