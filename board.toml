  # before vfs_mountroot's search runs; rootdev becomes makedev(1, 39); bdevvp hands mockfs a vnode
  # whose reads go through IOMediaBSDClient -> IOBlockStorageDriver -> drivers/CloverSdhci's PIO read
  # instead of a page table. That vnode path is still the new thing under test: round118 proved
