  # read in the same boot. Mode 1 maps 0x86000000+2 MiB and reads the header, the 512-entry global
  # TOC and the partition table one page from the region's end. Mode 2 adds the doorbell word at
  # 0x17911008 and the SMP2P candidates. Mode 3 adds the ADSP carve-out at 0x92a00000 and the Wi-Fi
  # MSA at 0x85700000, sixteen pages each, mapped a page at a time.
  # NOTHING HERE WRITES ANYTHING, AND THAT IS NOT THE WHOLE RISK. Reading SMEM is a load and reading
  # the APCS word is a load, so there is not even a command to issue -- but the SMEM node declares
  # `qcom,mpu-enabled` (clover.dts:4692), a permission the shipping kernel's ADSP driver granted and
  # a boot chain that never ran one may not. That is why the mapping happens before any read, why
  # every offset the walk follows is bounded against the span it came from, and why mode 1 begins
  # with the lowest-addressed word of the region: if a denial happens it happens on the first read,
  # with the mode, the phys and the slot array already printed.
  # What comes back, through round176's tee (`clover r` is already allowlisted):
  #   `clover r183: smem initialized=.. free=.. available=.. reserved=.. sbl=.. pc=../..` -- and
  #    `reserved` is the validity check on the whole decode, because the vendor requires it to be zero;
  #   `clover r183: global toc scanned=512 allocated=.. highest=..` then `toc[i] off=.. size=..
  #    in_span=.. aux=.. phys=..`, up to 24 of them, and `beyond_declared=` says whether the heap holds
  #    more items than its own SIII record advertises;
  #   `clover r183: ptable at .. magic=$TOC version=.. entries=.. info=.. num_items=.. capacity=..` --
  #    a magic that is not $TOC read as one little-endian word is the legacy layout, and the report says
  #    so rather than concluding the heap is empty;
  #   `clover r183: part[i] hosts=0:2 off=.. size=.. cacheline=.. hdr=$PRT ok=1 hosts_ok=..` -- the row
  #    followed to its own partition header and checked against it, which is the difference between a
  #    table and a table that lies;
  #   `clover r183: doorbell 17911008+04 = ..` and per edge `set=1`, plus `out=429 pred=429 law=1` --
  #    the item this port looks for, the one the CAF tree's arithmetic predicts, and whether this
  #    board's shipped DTB says anything about that edge at all;
  #   `clover r183: adsp-out item=429 path=private data=.. hdr magic=$SMP ver=1 lpid=0 rpid=2 total=16`,
  #    with each refusal named separately (`absent`, `rejected rc=DS_E_PID`), because "no such item" and
  #    "an item for a different pair of processors" are different answers to 排期 5;
  #   `clover r183: image adsp-fw 92a00000+1f00000 pages=16 nonzero=.. first=.. elf_at=..` and the same
  #    for wlan-msa -- a presence claim, not an identity claim, since a PIL loader copies segments to
  #    their p_paddr and need not leave the .mdt's ELF magic at offset 0;
  #   `clover r183: verdict adsp_edge=seen|not seen adsp_loaded=pages nonzero|pages zero`.
  # That last line is the fork 排期 5 has been waiting on. An edge and a loaded carve-out make item 5 a
  # protocol job -- open a GLINK channel, speak APR -- with no PIL, no SCM, no rail vote. An empty heap
  # and an empty carve-out make its first step 排期 6's: `qcom,pas-id = <1>` over a `vdd_cx` that is
  # pm660l L9 at RPM level TURBO, which is exactly the gate round182 measured the owner of.
  # It runs last in the PMGR tail, after CloverPower on purpose, because "the ADSP was never loaded"
  # combined with "L9 is off" is what turns a PIL attempt into a two-step plan with the rail first. It
  # never panics: an empty SMEM is a reading, and a boot that finds one still reaches launchd with the
  # emptiness recorded.
  # "clover-dsp=3",
  # Round184 puts round147's wall-clock deadline back into the shipped boot, and it is the whole point
  # of this round. A boot nobody can read is not an answer, and every reading this board has collected
  # since round171 has needed someone to stand next to the tablet with a camera: round149 removed the
  # deadline on purpose ("how far does iPadOS get when nothing interrupts it"), and the price of that
  # is that a boot that gets far never comes back by itself -- round183's flash proved it, waiting on a
  # fastboot device the deadline would have produced in five minutes. With `clover-unattended=<s>` the
  # ArmCpu timer handler panics <s> s after the first tick (drivers/ArmCpu/ArmCpu.cpp:637, message
  # `clover r148: unattended deadline ...`), the panic screen prints and marks IMEM 0x146bf65c, and 20 s
  # later the board resets into fastboot, where scripts/run-clover-unattended.sh is already waiting to
  # pull the card. 300 s is five minutes of uninterrupted iPadOS boot -- long enough that the question
  # this round asks, whether pid 1 still dies of SIGBUS in a page-in after round171-178 rebuilt the
  # block path under it, is answered by whatever the boot reached rather than by the deadline.
  # The deadline is also the reason this round adds the one thing the panic path never had: the kernel
  # log lines and driver verdicts that were still sitting in the RAM rings when the panic came are
  # written to the card by CloverSdhci's panic sink, newest kept, before the reset. Without it the
  # reading stops at the last block request that finished, which on a hung boot is exactly the part
  # that is missing.
  # Round185 moves where all of that lands, because two rounds of empty cards had an ordinary cause in
  # this driver. The arming sat inside the `probeMode == 20` report block while the shipped boot has been
  # mode 21 since round137, and it armed only after reading an existing record out of a partition that had
  # never been written -- so no normal boot could reach it, and the panel-only readings kept being filed
  # as a broken write path. Arming now runs from the GPT entry walk, and the only precondition is that
  # this card names a `logdump` entry at 13320216..13451287 (mmcblk0p56, 131072 sectors, 64 MiB, from the
  # same sysfs dump as the logfs and userdata extents --
  # facts/81ffcaaa-20261022-210928/mmc_partitions.txt). The window is logdump and not logfs because logfs
  # has been the root APFS container since round127: report slot 0 sat in the superblock's own region, the
  # verdict ring's sector 64 and the tee ring's sector 192 were mounted filesystem space, and the round173
  # write gate rewrote sixteen blocks at +4096 -- inside the root, with a transport whose whole purpose is
  # proving itself. The geometry is unchanged, only the base: report/panic slots 0..31, driver kind 21 at
  # sector 64 with 64 slots, kernel kind 22 at sector 192 with 512 slots, so one dd of 1216 sectors still
  # reaches the end of both. scripts/run-clover-unattended.sh now dumps
  # /dev/block/bootdevice/by-name/logdump into ~/clover-out/clover-log-window.bin, and
  # scripts/read-clover-log.py's default --first-lba is 13320216 (pass 12320768 to read a card flashed
  # before this round). Both refusal paths say so on the card -- `logdump entry too small` and
  # `no logdump entry at ...` -- because "never armed" and "armed and never flushed" are different answers
  # and a dump has to be able to tell them apart.
  # Round194 raises it from 300 to 900, and not because the boot needs to be changed: round193's frame
  # shows the boot still working at 312.9 s, killed 20 s after SpringBoard[27] had been alive for a
  # hundred seconds (launchd's "Early boot complete" came at 233 s, and xpcproxy/fairplayd were still
  # being exec'd and reaped at 312.9 s). A deadline that fires while the boot is still moving measures
  # the deadline, not the boot. 900 s is the same argument as round184's five minutes, restated for a
  # boot that now gets past launchd: long enough for a service stall to resolve or for the desktop to
  # present, short enough that a hung boot still comes back and the card can still be read. The
  # checker's 60..1800 window is the only constraint, so the value is a reading, not a contract.
  "clover-unattended=900",
  # Round193. Round192's frame ends with `watchdogd[97] exited -- exit reason namespace 2
  # subcode 0x5 description: none` and the panic-path syncs right behind it, after the same job
  # died the same way twice before (pids 52, 92, 97, each `rv=0x5 ns=2 code=0x5`). ns 2 is
  # OS_REASON_SIGNAL (bsd/sys/reason.h:89) and 0x5 is W_EXITCODE(0, SIGTRAP) (bsd/sys/wait.h:158),
  # so this is a trap, not an exit code. The job plist on the card explains both halves:
  # com.apple.watchdogd is launched by LaunchEvents matching IOProviderClass IOWatchdog, a class this
  # board has no driver for -- watchdogd traps when the lookup fails, exactly as upstream's
  # scripts/check-watchdogd-branches.py records for physical hardware -- and the same plist sets
  # PanicOnCrash and PanicOnConsecutiveCrash, which makes the third death reach
  # proc_handle_critical_exit (bsd/kern/kern_exit.c:1846) and panic the machine 208 s into a boot
  # whose daemons were otherwise surviving. With drivers paused until the desktop, the answer is not
  # an IOWatchdog service but to stop treating this crash as fatal. panic_on_crash_disabled is a
  # plain RELEASE tunable (osfmk/kern/startup.h:245) that returns false before any crash-behavior
  # test, and launchd is still exempt because proc_should_trigger_panic checks initproc first, so a
  # real init death still panics. The r193 kernel line records crashbits/deadline for every
  # critical exit, so the frame can show the suppression ran on this exact path.
  "panic_on_crash_disabled=1",
]

[payload.adt]
tool = "scripts/make-clover-adt.py"
chip_id = "0x13d"
# The low bank is 0x80000000-0x100000000; PIL, venus, the splash and the firmware FD
# leave 0xa0000000-0x100000000, so 1 GiB is the largest obviously free request.
owned_memory_size = "0x40000000"
# Round137 puts the root back into /chosen, and this time names a service the board really
# publishes: the unsealed OS volume inside the APFS container (System role, host copy
# 04769D26-2CA0-4825-B443-E2E5F88300F2). IOFindBSDRoot deserializes this into its matching
# dictionary and waits for exactly that IOMedia; CloverBlock's run, triggered by the earlier
# publishResource("IOBSD") in IOKitBSDInit, is what makes the media appear before the wait.
# The round119 panic this comment used to record was a dictionary naming a UUID no service on this
# board carried; it was not a reason for root-matching to be absent. scripts/check-clover.py now
# asserts this key is present. `rd=md0` stays gone; round138's `rd=md0s39` is a prefix alias for
# bsd_init's ramdisk check, not a root declaration (see the argument's own comment).
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0x0,0x1,0x2,0x3,0x100,0x101,0x102,0x103"
psci_method = "smc"
# False means the --data-ramdisk image gets one plain RAMDisk placeholder. Since round137 that
# image is no longer anyone's root -- the APFS OS volume is -- but md0 is still built from it, and
# a packed one would add PackedRAMDisk and ephemeral-storage, i.e. the Data-seed shape this board
# has no driver for.
packed_data_ramdisk = false
ipad_identity = true
unique_chip_id = "required"
