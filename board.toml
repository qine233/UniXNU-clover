  # before each. Our device never enters kIOServiceSynchronousState, so the driver's own
  # IOMedia registration stays asynchronous and cannot re-enter that cascade from here. The
  # "b st=" line now also carries dm= (metaclass found) and ds= (driver start returned true).
  # A last line of "5 driver start" means the hang is inside IOBlockStorageDriver::start
  # (media creation/registration), not in matching; "6 driver" with dv=0 means it started but
  # left no child of the expected class.
  # Round109's photograph showed every marker through "15 done": the hand-started driver and its
  # IOMedia are real. Round110 makes the block device writable (reportWriteProtection now answers
  # false) and adds the write half of clover_emmc_block_*, so the logfs record is appended the
  # way a real consumer would: stage 14 picks the first slot without this driver's magic, writes
  # header and text through IOMedia's write path, then reads both blocks back through IOMedia and
  # compares them whole. "b w s=<slot> wr=1 rb=1" is the positive; ws= carries the failing
  # IOReturn. A full 16-slot window stops at stage 14 with wr=0 and is never wrapped onto slot 0.
  # This is also the first boot whose record the next boot's stage 12/13 reads: the text is
  # "block write through IOMedia", the marker that the write side of the stack, not the driver's
  # PIO helper, produced it.
  # Round110's photograph stopped at "14 write" with the assertion at IOMemoryDescriptor.cpp:2612
  # (!(kIOMemoryPreparedReadOnly & _flags)). Its writeMediaBlock filled one shared outBuffer with
  # writeBytes; the first media->write prepared that kIODirectionOut descriptor for the device
  # (UPL_COPYOUT_FROM sets kIOMemoryPreparedReadOnly), so the second block's writeBytes tripped
  # the assert. The header block itself did land, which means that slot now holds a valid header
  # and stale text. Round111 builds one withBytes(..., kIODirectionOut) descriptor per block,
  # filled at construction and never touched after submission, and keeps both alive for the whole
  # run; writeMediaBlock only submits. Expected: "b w s=<slot> wr=1 rb=1". If "b lf" names the
  # round110 slot, "c=0 p=0" is that half record, not a new failure.
  # Round112 starts removing the instrumentation: mode 21 no longer parses GPT or writes a log
  # record. clover_block_run loads IOStorageFamily, publishes an IOBlockStorageDevice, starts
  # IOBlockStorageDriver and its whole media by hand (round109: catalogue matching never returns
  # here), lets IOGUIDPartitionScheme probe/start the real table, finds Partition ID 39 among
  # the scheme's children, starts IOMediaBSDClient on the whole disk and that partition, and
  # then repeats setconf()'s rd= discovery: IOBSDNameMatching + waitForService must return the
  # partition, bdevvp(major << 24 | minor) must open it, and a block read at the partition's
  # base through the whole media must equal the same block read at zero through the partition.
  # Round112's photograph was a data abort inside IOStorageFamily at pc 0xfffffff0049754ec:
  # getProvider() returned null and scan() dereferenced it. The scheme had never been attached;
  # IOService::probeCandidates attaches before probing, and this file had called probe() first.
  # Round113 attaches the scheme before probe(), keeps it attached for start, and adds "gpt-attach"
  # as a failure step. Its photograph got past the data abort and stopped at "bsd-props 0": the
  # scheme published its partitions, but the BSD client wrote no BSD Name/Major/Minor. Cause:
  # sheng_pmgr_run() is before vfsinit(), so devfs_ready is still 0, devfs_make_node() returns
  # NULL, MinorTable::insert() fails, and IOMediaBSDClient::start() returns true anyway because it
  # ignores createNodes(). bdevvp() has the same prerequisite. Round114 keeps the whole run but
  # starts it from the publication of IOKit's "IOBSD" resource, which IOKitBSDInit() performs at
  # the end of bsd_autoconf() -- after vfsinit(), before setconf(). A device patches/xnu would
  # shadow the base repository's patch set, so this notification is the post-vfsinit hook the
  # device repo owns. The handler runs on IOKit's config thread; rd= stays md0 and nothing is
  # written to logfs.
  # Round115's mask (0x5abc7) showed devfs was ready, the whole disk already had a BSD name, and
  # disk0/disk0s39 were taken while the hand-built partition media had no properties. The boot log
  # showed why: a column of "disk0sN: name slot allocation failed (Errno=17)" from the duplicate
  # tree. The media's asynchronous registerService() lets IOKit start the partition scheme and the
  # BSD clients on other config threads, and they name the whole kernel-side tree first. Round116
  # stops building a second tree: it waits up to one second for the automatic pass, finds the
  # partition by "BSD Name" == disk0s39, and continues with that media. rd= stays md0 and nothing
  # is written to logfs.
  # Round116 got through that find, the property casts, IOBSDNameMatching and waitForService, then
  # data-aborted at pc 0xfffffff00799238c (esr 0x96000028) while releasing the matching dictionary.
  # IOService::waitForService() already releases that dictionary -- IOFindBSDRoot() retains it once
  # per wait for exactly this reason. Round117 does the same, so the run reaches root-match,
  # bdevvp and the offset comparison.
  # Round117's photograph was a bare data abort at pc 0xfffffff007a231a4, lr 0xfffffff00782ef6c --
  # inside OSMetaClass::postModLoad.cold.1, the duplicate-class panic path, dereferencing a NULL
  # orig->reserved->kext. That is not a fail() line: the first run had already registered
  # CloverBlockDevice, and a second run's postModLoad found it in sAllClassesDict. The boot log had
  # reached APFS and launchd, so the first run finished and the crash came later. resourceMatching
  # ("IOBSD") matches the persistent gIOResources service, and doServiceMatch re-invokes every
  # still-matching gIOPublishNotification on each pass ignoring the handler's return value, so
  # returning false does not retire it; every later publishResource() re-fires the handler.
  # Round118 latches the run: one atomic CAS admits the first invocation and every refire counts
  # itself and returns, so the metaclass registers once and the boot continues. Its photograph said
  # exactly that -- "auto p=39 disk0s39 1:39 bd=1 map=1 fires=1", one "refire n=2 (already ran)",
  # then the log running on through APFS to the EL0 init and its mach lines, ending in the tick
  # watchdog's scheduled panic with spsr ending in 0 (EL0t): userspace was running when it fired.
  # Round119 pointed rd= at this partition and the photograph read `Failed to mount root device
  # @IOKitBSDInit.cpp:984` at ticks=0xb0c: rd= was parsed and then ignored, because /chosen's
  # root-matching filled IOFindBSDRoot's matching dictionary first (:790-797, and the rd= branch is
  # guarded by `!matching` at :888), so the ten waits ran against the stock volume UUID. Round120
  # deletes that property (see [payload.adt]), which leaves rd=disk0s39 as the only root contract.
  # Round120's photograph carried this driver's own line unchanged and went past it: the root mounted
  # on this partition and the boot died at bsd_init.c:1098's seal check. The reading and the two ways
  # past that check are written out above, on the `rd=` argument they belong to.
  # Round121 takes the naming door, and step 9 is where this driver pays for it: after the two reads and
  # the offset comparison, it writes "md0s39" over this media's BSD Name, reads the property back, and
  # re-matches the alias through a fresh IOBSDNameMatching dictionary, which must resolve to the same
  # object. Nothing else in the run changes: steps 1-8 still look the partition up as disk0s39 and still
  # measure major 1 minor 39, so a step-9 failure cannot be mistaken for a block-stack failure.
  # One line on success, "CloverBlock r121: auto p=<n> disk0s39>md0s39 <maj>:<min> bd=1 map=1 fires=<k>"
  # (fires=1 on the run that succeeded); each refire prints "CloverBlock r121: refire n=<k> (already
  # ran)". Every failure panics as "CloverBlock r121: <step> <value>", where "alias", "alias-read" and
  # "alias-match" are step 9's property write, its read-back, and the alias dictionary resolving to
  # something other than this media (alias-match carries the object it found). "auto <n>" means no named
  # partition appeared in time: the value is 0x10000 if the whole disk itself was named, plus the
  # number of named partitions seen. "notify 0/1" means the IOBSD matching dictionary or the
  # notification itself could not be installed. No CloverBlock line at all means it never fired.
  "clover-emmc=21",
  # Passed again, for the opposite reason. Round82 removed it because the EL0 report was the
  # louder channel; rounds 78-85 then showed the EL0 report is exactly the thing under
  # examination, and every one of its four exits (write returning, exit, kill, reboot->panic)
  # went silent in the same shape. The tick panic is the only reporter on this board that the
  # tty cannot influence: it is taken by the timer, in EL1, while the hung context is the one
  # holding the core, and its ELR is that context's address. 60000 ticks, not round82's 30000:
  # the tick number is a boot-progress coordinate rather than a duration, and round82 read
  # ticks=0x14e5=5349 at the AMFI check inside launchd's exec -- one step before initproc runs
  # in EL0 -- so 60000 is roughly eleven times past the point the probe reaches, without
  # depending on how long a tick actually is. That period is now measured at the same time
  # (cnt0/cnt1/freq on the panic line), which is the first real clock this port has had.
  # The instrument still cannot report a duration: the frame taken after the logfs root booted reads
  # `clock watchdog at 60000 ticks (elr=100000b3c spsr=ffffffff14084cd50 elr2=100000b3c cnt0=124f800
  # cnt1=0 freq=124f800) @ArmCpu.cpp:632` -- cnt0 == freq again, cnt1 == 0, the same defect recorded at
  # README's round82 section, so the tick period remains unmeasured and the tick number stays a
  # coordinate. What this frame does give is the sample: spsr's mode field is 0 (EL0t), so the timer
  # interrupted user mode rather than a syscall, and 0x100000b3c is our own EL0 image's __TEXT base
  # (0x100000000, no slide) plus 0xb3c -- `_puts + 4`, the instruction after `bl _write_console`
  # returned and before the `b.hs _fail` test of its return flags. All eight `_puts` sites live in the
  # mach-probe block, which `cmp x19, #1` / `b.eq _skip_mach` (clover-el0-init.S:425) keeps off pid 1,
  # while `_parent` (:1040) speaks only through `_write_console` and `_print_dec` -- so the interrupted
  # thread is the exec'd child, and a write had just come back. Yet round85's self-panic string (`userspace panic: clover-el0: write returned`, reboot(2) at
  # 0x10000061c, three instructions after that `_puts` returns) is absent, and the panic screen keeps
  # the first panic. Those two cannot both be a linear boot: the next reading has to say which of them
  # the frame is lying about, and the .S already prescribes the cut -- reboot before the write instead
  # of after it.
  # Round122 ships that cut: reboot(2) now precedes the `msg=` write and carries "clover-el0: before
  # write", so a panic screen with that string proves the EL0 -> panic_kernel channel works and says
  # nothing about the console, and a watchdog-only frame proves the child never reached the call. Decode
  # a new sample against this image, not round121's: everything after the call site at 0x100000604 moved
  # up 0x1c -- _puts 0x100000b54, _write_console 0x100000b08, _print_dec 0x100000b18.
  # Round122 measured it: the panel carried `userspace panic: clover-el0: before write` with
  # ticks=0x229=553, ~108x short of this deadline, so a watchdog panic can never again be the reason an
  # EL0-initiated reboot is missing. The two IOKit lines directly above the panic header are stamped
  # 9.941193 and 9.942761 seconds, which pairs 553 ticks with ~9.94s of kernel time -- a candidate tick
  # period of ~18ms, putting 60000 ticks near 18 minutes. It stays a candidate: round82 read
  # ticks=0x14e5=5349 at the AMFI check inside launchd's exec, a step *earlier* in boot, and cnt0/cnt1
  # still cannot measure the period directly. What is no longer in doubt is the channel -- reboot(2) from
  # EL0 reaches panic_kernel() (RA/LR = _panic_kernel+0xf0, fmt = the "userspace panic: %s" cstring at
  # __TEXT+0xc044f), so the missing round85 panic means that svc was never executed, and the watchdog's
  # single `_puts + 4` sample is the half of round121's frame that has to carry the doubt now.
  "armcpu-clock-panic=60000",
  # Deliberately not passed: armcpu-self-ipi and armcpu-spi-ipi exist in the driver for
  # the multi-core case, and this board runs one CPU (no sheng-smp), while the driver's
  # software-IPI SPI numbers are hardcoded at 1008..1015 -- tb128fu had to move its base
  # to 536 because its GIC implements fewer INTIDs. typer= on the panic screen is this
  # board's GICD_TYPER, and until it is read, 1008 is a guess.
]

[payload.adt]
tool = "scripts/make-clover-adt.py"
chip_id = "0x13d"
# The low bank is 0x80000000-0x100000000; PIL, venus, the splash and the firmware FD
# leave 0xa0000000-0x100000000, so 1 GiB is the largest obviously free request.
owned_memory_size = "0x40000000"
# Deliberately absent: root_match_volume_uuid, and with it /chosen's `root-matching`.
# IOFindBSDRoot deserializes that property into its `matching` dictionary at
# IOKitBSDInit.cpp:790-797 and `continue`s, which is what made round119's `rd=disk0s39` dead
# text -- the branch at :888 that would turn `rd=` into IOBSDNameMatching only runs when
# `matching` is still NULL. The kernel's own `rd=` is now the only root contract on this board,
# and scripts/check-clover.py asserts the property stays absent.
cpu_regs = "0x0,0x1,0x2,0x3,0x100,0x101,0x102,0x103"
psci_method = "smc"
# False means the --data-ramdisk image gets one plain RAMDisk placeholder, which is
# what the md0/mockfs root needs; a packed one would add PackedRAMDisk and
# ephemeral-storage, i.e. the Data-seed shape this board has no driver for.
packed_data_ramdisk = false
ipad_identity = true
unique_chip_id = "required"
