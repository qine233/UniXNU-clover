#     out to be worth less than it looks. The probe was never reached, so the label
#     write is the call that put its own characters on the panel and did not come
#     back -- which is exactly what ttwrite's ovhiwat sleep on TSA_OLOWAT with
#     tp->t_timeout (bsd/kern/tty.c:2656) would look like on a board where no
#     deadline ever fires. But three states share that picture: the label write
#     blocking after painting, the label write returning and the child's exit
#     blocking, and the child exiting, the parent waking, and the parent's own status
#     print being the missing thing. The child cannot tell them apart, and neither can
#     a console that is itself the suspect. So this round changes only the parent's
#     report: on waking it writes nothing at all and exits with 512 + (status & 0xff),
#     reaching the panel through initproc's panic screen -- the one channel on this
#     board already seen to work while the tty was under suspicion (round 76). 512
#     means the child exited and wait4 woke, so everything outside the console in both
#     processes works and a *print* is all that is missing; 512 + N means the child
#     died of signal N (9 = SIGKILL, the round 72 shape); no panic screen means the
#     child never died and is genuinely inside that write. The child is untouched from
#     round 79, and so is the wait4.
#   * v0.2.51 because round 80 came back as the third reading: `[clover] el0 mach:
#     msg=` and no panic screen, ever, in two photographs a couple of minutes apart.
#     The parent's wait4 has not woken, so the child has not died, and the kernel's
#     own kprintf for an unexpected death ("Failed to send exception
#     EXC_CORPSE_NOTIFY ... for pid 2") never appeared in the boot-log tail either --
#     that line reaches the panel through the video console, not the tty under test,
#     so its absence is independent evidence. Two suspects are left, and the child's
#     exit() is one of them for the first time: an exit from a fork+exec'd process has
#     never been proven on this board (round 70's exiting child was fork-only, rounds
#     72-73 ended in SIGKILL, which is not an exit). So this round asks the child for
#     a third kind of event, one that needs no return: after the label write it does
#     kill(getpid(), SIGSTOP, 0) -- Darwin's kill takes a `posix` third argument
#     (syscalls.master:91), 0 for the legacy path -- and a stop is acted out on the
#     way *into* userland, so the parent is told the child is alive past the write
#     even if the child never runs another instruction. The parent waits with
#     WUNTRACED (2) and keeps the low 16 bits of the status, because W_STOPCODE(17)
#     is 4479 and masking to a byte folded it onto "signal 127". panic 4991 = 512 +
#     4479: the write returned and the child's exit is the hole. panic 1024: kill
#     succeeded, no stop, the child exited(2). panic 768: kill failed, the child
#     exited(1) -- 37 is unreachable here. No panic screen: the write is the one that
#     blocks.
#   * v0.2.52 because round 81 came back as the fourth reading: no panic screen at all,
#     and that reading is now stronger than it looked. SIGSTOP is acted out *inside* the
#     kill (kern_sig.c:2349 stopsigmask -> :2362 p_stat=SSTOP -> :2373 stop(), which
#     wakes the parent from within the syscall), so a delivered stop would have woken
#     wait4 even if the child never ran another instruction. The child never reached
#     kill: the label write did not return.
#     The round then stops treating that write as a tty mystery on its own, because the
#     reference ports document this exact pair of symptoms and fix it without touching
#     XNU. xVanTuring/UniXNU-tb128fu board.toml:199-212 passes armcpu-* boot-args and
#     says why: on those Snapdragons ICC_SGI1R_EL1 generates nothing, so IPIs are
#     re-hosted as software-pended SPIs and the timer's INTID is corrected (their note:
#     the value ArmCpu used before "is another source that stays asserted"). The
#     mechanism was already in our tree -- the driver reads armcpu-self-ipi,
#     armcpu-spi-ipi and armcpu-diagnostics -- but its timer number was wrong for this
#     board: the base driver enables redistributor PPI bit 27 and services INTID 27 as
#     the clock, while clover.dts:2233 describes the architected timer as PPIs 1, 2, 3,
#     0, i.e. INTIDs 17, 18, 19, 16 (a device-tree PPI number is INTID 16 + number), and
#     enableCPUTimeBase arms CNTV_CTL_EL0, the EL1 *virtual* timer, whose line is 19. The
#     siblings in the same tree explain where 27 came from: dodge.dts:7290 lists PPIs 13, 14,
#     11, 10, so there the very same source (non-secure EL1 virtual) is INTID 27 -- 27 and 19
#     are one line under two device-tree numberings, and the base driver carried the old one.
#     The
#     counter event was therefore started and its interrupt could never reach
#     ICC_IAR1_EL1: this board has never taken a tick. That is precisely what round 77
#     measured twice from the outside -- a select() with a 50 ms deadline parks the
#     parent forever, and an EL0 spin starves the sibling on the same CPU, which needs
#     the absence of preemption, and preemption needs the tick.
#     So this round changes the kernel only, and the EL0 probe stays byte-identical to
#     round 81 (same root, same trustcache): drivers/ArmCpu is vendored into this device
#     repository with two additions behind boot-args, and the panic screen now prints the
#     driver's own counters so every photograph says whether the clock runs --
#     ticks=, ipi=, sent=, irq= (the last INTID from ICC_IAR1_EL1), phase=, intid= (the
#     line armed) and typer= (GICD_TYPER, how many INTIDs this GIC implements).
#     armcpu-clock-panic=30000 is the safety net that keeps the round from being silent
#     whatever happens: the clock itself panics once it has taken 30000 ticks, so a hang
#     that survives the fix still reaches the panel. The panic screen keeps the *first*
#     panic, so a probe that finished earlier is untouched, and reaching the watchdog at
#     all is itself the reading that the timer interrupt now arrives.
#   * v0.2.53 because round 82 came back as the first panic screen this board has ever drawn,
#     and the reading was ticks=0x14e5 (5349): the clock took 5349 ticks before the AMFI panic
#     beat the watchdog, so INTID 19 is the right line and the watchdog never had to fire. The
#     panic itself was "AMFI: No PMGR?" (ConfigurationSettings.cpp:235, thread-call worker).
#     That is not a regression from the clock: AMFI calls waitForMatchingService(serviceMatching
#     ("ApplePMGRNub"), timeout) whose timeout is in NANOSECONDS and becomes an absolute
#     deadline (IOService.cpp:6582, clock_absolutetime_interval_to_deadline + SLEEPNOTIFYTO).
#     With no tick, that deadline could never expire, so rounds 70-81 simply hung there and the
#     boot still reached EL0; with a tick it expires at once, the match returns nothing, and
#     AMFI panics. The clock made an old wall visible instead of building it.
#     So this round answers one question: does an unmodified AMFI stop panicking once a board
#     publishes an ApplePMGRNub? drivers/CloverPMGR (built by scripts/build-clover-pmgr.py into
#     the path the base link hardcodes) does it in the shape sheng uses -- load
#     com.apple.driver.ApplePMGR, rebuild the provider's ABI, mint the original nub with the
#     original factory, attach/start/register it under a guard shell whose every power-domain
#     slot panics except the AON read/write pair AMFI actually uses -- and reports through 16
#     observation slots that the panic screen now draws (pmgr=/status=/mode=, nub=/attached=/
#     registered=, aon=0x…=>0x… for the pair AMFI reads then writes). Unlike sheng, every failure path here panics by name; a silent bail
#     would photograph exactly like round82.
#     The clock watchdog goes with it: it has done its job (the clock is proven), and leaving it
#     on would put a 30 s timer panic on top of whatever EL0 reports this round.
#   * v0.2.54 changes no decision and no argument, only the order the panic screen draws in.
#     put() returns without drawing once g->y + 42 exceeds the panel height, so characters past
#     the last row vanish silently -- that is how round82 lost intid= and typer=, which sat after
#     twelve lines of register dumps. This round adds three more lines of its own, so the
#     readings come first and the caller evidence last. Kernel unchanged (44866929375b6ba9...);
#     the screen is injected into the in-volume copy at payload time.
#   * v0.2.55 (round 84) re-runs round 79's cut on a board that now has both a clock and a published
#     ApplePMGRNub: the child's kill(getpid(), SIGSTOP, 0) block is deleted and its last act is
#     exit(448) between the label write and the number write. One thing found while writing it down
#     changed the parent too. initproc's exit reaches the panel through
#     panic_with_options(... "%s -- no exit reason available -- (signal %d, exit status %d %s)") at
#     kern_exit.c:1875, and that field is WEXITSTATUS(rv) = (rv >> 8) & 0xff (wait.h:144) where
#     rv = W_EXITCODE(C, 0) = C << 8 (kern_exit.c:1466). The channel carries eight bits, so rounds
#     80-83's 512 + sixteen-bit code was folded before it ever got there: exit(448) would have read
#     as `exit status 0` and a SIGSTOP as `exit status 127`. The parent now builds a code that fits
#     (0 = our exit(448), 1 = exited another way, 32+N = signal N, 96+N = stopped on N) and the
#     panic screen's own readings are unchanged.
#   * round84's reading came back as the last row of its table -- msg= painted, no panic screen,
#     nothing added after two minutes -- and it is the most informative photograph of the ten,
#     because for the first time the child's whole history is legible: eight lines below the boot
#     log, from `el0 child: alive` through `thread=259 task=515 host=771` and `reply=1827` to the
#     `msg=` label itself. Three claims die in that picture. The exec'd child's write() has already
#     returned at least eight times; three of those eight were bare `_puts` labels with no trailing
#     newline, so "only writes ending in \n come back" is out too; and the newline that produced the
#     `msg=` row scrolled the whole panel, so gc_scroll_up/vc_scroll_up/video_scroll_up are not the
#     blocker either. What is left is that this write is indistinguishable from the eight that
#     worked, and that the photograph still cannot separate (a) the write never returned,
#     (b) it returned and the child's exit() never did, and (c) both completed but the parent's
#     blocking wait4 was never woken -- round70's parent-waking child was fork-without-exec, and
#     whether exec keeps childproc attached has never been tested here. All three report through
#     the two channels under examination. So v0.2.56 changes the channel, not the question: the
#     child panics the kernel itself with reboot(2) (syscall 55, syscalls.master:109) using
#     RB_PANIC|RB_QUICK = 0xc00, which kern_xxx.c:182 turns straight into
#     panic_with_options("userspace panic: %s", message) -- no sync, no unmount, no tty, no parent.
#     On this DEVELOPMENT_ARM64_BCM2837 kernel both the suser test (kern_xxx.c:116) and the MACF
#     check (:142) are skipped for RB_PANIC, so nothing has to be granted for the call to work.
#   * one more thing found while reading source for v0.2.56: `boot-progress=2` in kernel_args below
#     is inert. CONFIG_XNU_BOOT_PROGRESS=n (configs/clover_defconfig:55), so boot_progress_active()
#     expands to the literal 0 (boot_progress.h:22) and the branch at video_console.c:1234 is
#     compiled away. Panel text therefore really does go through gc_putchar and the lck_ticket_t
#     vcputc_lock at video_console.c:153, and through console_write()'s ring buffer
#     (serial_console.c:526) -- which is what the next rounds are about. Left in place rather than
#     deleted so this round's payload differs from round84's by the probe alone.
entry_probe_reset_delay = 15
entry_probe_reset_after = "_machine_startup"
entry_probe_reset_before = true
entry_probe_reset_in = "_arm_init"
entry_probe_reset_occurrence = 1
panic_screen = true
skip_setup_tool = "scripts/seed-data-skip-setup.py"
# The cdhash of scripts/clover-el0-init.S, signed static, passed as the md0/mockfs
# root and published to AMFI through this bundle (scripts/make-clover-root.py).
trust_cache_sha256 = ["b5b064c41801cab0f0386cda47059963b5a150a31b09e4b4d862e57fd7c97099"]
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "boot-progress=2",
  "rd=md0",
  # Round 72 died with SIGKILL (parent's wait4 read status 9) inside its first
  # mach_msg; round 73 bracketed that call with markers and added this boot-arg,
  # and the panel looked exactly the same: presend, no send=. So the boot-arg did
  # not open the gate -- and unlike round 72, that claim can no longer be blamed
  # on the policy being compiled out, because it is now checked against the bytes
  # that are actually running:
  #   - out/clover/logs/kernel.log: the kernel is DEVELOPMENT_ARM64_BCM2837, and
  #     objdump of out/clover/kernel/kernel.macho shows the DEVELOPMENT branch
  #     inside _ipc_policy_allow_legacy_send_trap reading _allow_legacy_mach_msg
  #     (adrp 0xfffffff007158000 + ldrb #0x1a8, tbnz bit 0) before it reaches the
  #     guard call;
  #   - the args string embedded in the payload really ends with
  #     allow_legacy_mach_msg=1, and PE_boot_args() (pexpert/arm/pe_bootargs.c:11)
  #     returns exactly ((boot_args *)PE_state.bootArgs)->CommandLine --
  #     PE_init_platform (pexpert/arm/pe_init.c:416) takes it from the booter and
  #     never consults a device-tree chosen/boot-args;
  #   - the parser handles a name=1 token at the end of the string: the key scan
  #     stops at '=' so the "no value" shortcut (bootargs.c:126) does not fire,
  #     getval() consumes the '=' (bootargs.c:416), argnumcpy writes one int8_t
  #     (bootargs.c:380), and kernel_startup_tunable_init normalises the bool
  #     (startup.c:291).
  # Which leaves the death unexplained, and an unexplained death is not evidence.
  # The probe therefore stops arguing with mach_msg_trap (index 31) and asks the
  # modern call instead: mach_msg2_trap (index 47) builds its send context out of
  # the packed registers and never enters ipc_policy_allow_legacy_send_trap, whose
  # only caller (mach_msg_copyin_user_header, osfmk/ipc/mach_msg.c:611) is reached
  # solely from mach_msg_overwrite_trap. msg2's own two checks -- exactly one CFI
  # bit in ipc_preflight_msg_option64 (ipc_policy.c:144) and a destination that
  # matches it in ipc_validate_kmsg_dest_from_user (ipc_policy.c:686) -- are passed
  # by sending with MACH64_SEND_MQ_CALL to a reply port.
  #
  # The boot-arg stays, as the experiment's control variable: the probe now repeats
  # the legacy mach_msg *last*, after msg2 has answered, so `legacy: send=<code>`
  # says the tunable is live and round 73 died of something else, while a panel
  # ending at `legacy: presend` says the gate is still firing and the tunable is
  # the thing that did not do what this tree says it does.
  "allow_legacy_mach_msg=1",
  # The clock. 19 is the EL1 virtual timer's INTID in this device's own tree
  # (Resources/DTBs/clover.dts:2233, PPI 3); 27, the base driver's number, is a line
  # SDM660 does not route the architected timer to, so until now the kernel armed a
  # source that never fires and masked the one that does.
  "armcpu-timer-intid=19",
  # CloverPMGR's own switch, read inside sheng_pmgr_run(): 2 = publish the original nub and
  # self-verify it with waitForMatchingService (2 ms, safe now that the clock runs). Any other
  # value panics on purpose -- round82 proved that this board's silence is never a reading.
  "clover-pmgr=2",
  # No longer passed: armcpu-clock-panic=30000 existed so a surviving hang would still reach
  # the panel, and round82 read ticks=0x14e5 -- the clock runs, so the safety net would now
  # only pre-empt the EL0 report with its own timer panic.
  # Deliberately not passed: armcpu-self-ipi and armcpu-spi-ipi exist in the driver for
  # the multi-core case, and this board runs one CPU (no sheng-smp), while the driver's
  # software-IPI SPI numbers are hardcoded at 1008..1015 -- tb128fu had to move its base
  # to 536 because its GIC implements fewer INTIDs. typer= on the panic screen is this
  # board's GICD_TYPER, and until it is read, 1008 is a guess.
]

[payload.adt]
tool = "scripts/make-clover-adt.py"
chip_id = "0x13d"
# The low bank is 0x80000000-0x100000000; PIL, venus, the splash and the firmware FD
# leave 0xa0000000-0x100000000, so 1 GiB is the largest obviously free request.
owned_memory_size = "0x40000000"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
cpu_regs = "0x0,0x1,0x2,0x3,0x100,0x101,0x102,0x103"
psci_method = "smc"
# False means the --data-ramdisk image gets one plain RAMDisk placeholder, which is
# what the md0/mockfs root needs; a packed one would add PackedRAMDisk and
# ephemeral-storage, i.e. the Data-seed shape this board has no driver for.
packed_data_ramdisk = false
ipad_identity = true
unique_chip_id = "required"
